- code: U3507
  category: network
  title:
    en: Control Module Input Power B Circuit Intermittent/Erratic
    de: Steuergerät Eingangsspannung B Stromkreis sporadisch/unstet
  description:
    en: "U3507 covers an unsteady supply B: the voltage is mostly in range but drops out or jumps for short moments. Since B often powers stages such as motors or valves, the dropouts typically appear when these draw current, for instance while braking or steering. GM's brake booster tables show that the module judges B over short and long windows (0.2 s up to 90 s); a fault that merely flickers fits neither the low nor the high code and counts as erratic. No manufacturer documents U3507 publicly. Suspect loose crimp contacts, worn fuse holders, corroded grounds and chafed wires, and test under load with a recording meter or scope. If U3505 or U3018 are stored as well, the feed has probably dropped out completely at times."
    de: "U3507 erfasst eine unruhige Versorgung B: Die Spannung liegt meist im Bereich, fällt aber kurz aus oder springt. Da B oft Leistungsstufen wie Motoren oder Ventile speist, zeigen sich die Aussetzer typischerweise, wenn diese Strom ziehen, etwa beim Bremsen oder Lenken. GMs Tabellen zum Bremskraftverstärker zeigen, dass das Gerät B über kurze und lange Fenster bewertet (0,2 s bis 90 s); ein Fehler, der nur flackert, passt weder zum Code niedrig noch hoch und gilt als unstet. Kein Hersteller dokumentiert U3507 öffentlich. Verdächtig sind lockere Crimpkontakte, ausgeleierte Sicherungshalter, korrodierte Massen und durchgescheuerte Leitungen; unter Last mit aufzeichnendem Messgerät oder Oszilloskop prüfen. Stehen zusätzlich U3505 oder U3018 im Speicher, ist der Eingang zeitweise wohl ganz ausgefallen."
  affected_components:
    - module_power_b
    - power_wiring
  common_causes:
    - id: loose_terminal
      likelihood: high
      label:
        en: Loose crimp or worn fuse holder in feed B
        de: Lockere Crimpung oder ausgeleierter Sicherungshalter im Zulauf B
    - id: corroded_ground
      likelihood: medium
      label:
        en: Corroded ground point of the module
        de: Korrodierter Massepunkt des Steuergeräts
    - id: chafed_wire
      likelihood: medium
      label:
        en: Chafed wire with intermittent contact
        de: Durchgescheuerte Leitung mit zeitweisem Kontakt
  symptoms:
    - en: Brief function dropouts when power stages switch on
      de: Kurze Funktionsaussetzer, wenn Leistungsstufen einschalten
    - en: Code returns sporadically and is hard to reproduce
      de: Code kehrt sporadisch zurück und ist schwer nachzustellen
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
