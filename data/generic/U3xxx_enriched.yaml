- code: U3511
  category: network
  title:
    en: High Voltage System Interlock Circuit B
    de: Hochvoltsystem-Interlock-Kreis B
  description:
    en: Generic fault on the second high-voltage interlock loop (HVIL) circuit. The interlock detects whether HV connectors are properly mated; an open loop forces the HV system into a safe state.
    de: Allgemeiner Fehler am zweiten Hochvolt-Interlock-Kreis (HVIL). Der Interlock erkennt, ob HV-Stecker korrekt gesteckt sind; offener Loop zwingt das HV-System in den sicheren Zustand.
  affected_components:
    - hvil_loop_b
    - hv_connectors
  common_causes:
    - id: connector_unmated
      likelihood: high
      label:
        en: HV connector not fully mated
        de: HV-Stecker nicht vollständig gesteckt
    - id: pilot_pin_damaged
      likelihood: medium
      label:
        en: Interlock pilot pin damaged
        de: Interlock-Pilotpin beschädigt
    - id: interlock_wiring_fault
      likelihood: medium
      label:
        en: Damaged interlock wiring or corroded terminal in the loop
        de: Beschädigte Interlock-Leitung oder korrodierter Kontakt in der Schleife
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Fault in the module that drives and evaluates the interlock loop
        de: Fehler im Steuergerät, das die Interlock-Schleife speist und auswertet
  symptoms:
    - en: Vehicle will not switch to ready mode or the HV system shuts down
      de: Fahrzeug lässt sich nicht fahrbereit schalten oder das HV-System schaltet ab
    - en: High-voltage system warning in the instrument cluster
      de: Warnung zum Hochvoltsystem im Kombiinstrument
    - en: Charging may be blocked
      de: Laden kann gesperrt sein
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 2000]
    estimated_hours: [1, 5]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
