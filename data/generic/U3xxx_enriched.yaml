- code: U301C
  category: network
  title:
    en: Control Module Wake-up Circuit A High
    de: Steuergerät Weckleitung A hoch
  description:
    en: "U301C is the opposite of U301B: wake-up line A is stuck high, usually shorted to a battery-fed wire or held up by a sender that never releases it. The receiving module then gets a permanent wake request. In Ford's 2019 hybrid OBD summary, a high charge wake-up signal is one of the conditions under which the battery energy control module runs its charge contactor and pack contactor checks, so a line stuck high makes the module behave as if charging were requested. The likely result is a module that never falls asleep and a 12 V battery that is flat after a few days of parking. A transceiver like NXP's TJA1043 also needs a change of level to register a wake, so a permanently high line cannot deliver a fresh wake event either. No manufacturer documents U301C publicly."
    de: "U301C ist das Gegenstück zu U301B: Weckleitung A hängt auf hohem Pegel, meist durch Schluss mit einer batteriegespeisten Leitung oder weil der Sender sie nie freigibt. Das empfangende Gerät erhält damit eine dauernde Weckanforderung. In Fords Hybrid-OBD-Übersicht 2019 ist ein hohes Lade-Wecksignal eine der Bedingungen, unter denen das Batteriesteuergerät seine Prüfungen der Lade- und Batterieschütze ausführt; eine hängende Leitung lässt das Gerät also so arbeiten, als sei Laden angefordert. Wahrscheinliche Folge: Das Gerät schläft nie ein, und die 12-V-Batterie ist nach einigen Tagen Standzeit leer. Ein Transceiver wie NXPs TJA1043 braucht zudem einen Pegelwechsel, um ein Wecken zu erkennen; eine dauerhaft hohe Leitung kann also auch kein neues Weckereignis liefern. Kein Hersteller dokumentiert U301C öffentlich."
  affected_components:
    - wakeup_circuit_a
    - wakeup_wiring
  common_causes:
    - id: wake_wire_short_voltage
      likelihood: high
      label:
        en: Wake-up wire shorted to a battery or ignition feed
        de: Weckleitung mit einer Batterie- oder Zündungsleitung kurzgeschlossen
    - id: sending_module_output_stuck
      likelihood: medium
      label:
        en: Sending module or charger holding the wake output on
        de: Sendendes Gerät oder Ladegerät hält den Weckausgang dauernd an
    - id: moisture_bridge
      likelihood: low
      label:
        en: Moisture bridging the wake pin to a neighbouring supply pin
        de: Feuchtigkeit überbrückt den Weckpin zu einem benachbarten Versorgungspin
  symptoms:
    - en: 12 V battery drained after the vehicle has been parked
      de: 12-V-Batterie nach Standzeit entladen
    - en: Module or fan audible or active with the vehicle switched off
      de: Steuergerät oder Lüfter bei ausgeschaltetem Fahrzeug hörbar oder aktiv
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
