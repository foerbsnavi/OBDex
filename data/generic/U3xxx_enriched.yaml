- code: U3516
  category: network
  title:
    en: High Voltage System Interlock Circuit C Performance
    de: Hochvoltsystem Interlock-Stromkreis C Funktion
  description:
    en: "U3516 flags loop C as electrically present but untrustworthy: resistance, timing or pattern of the returned signal fall outside what the module accepts, often only for moments. As the U35xx series has no intermittent code for loops B and C, unlike P0A0E for loop A, short dropouts will probably be stored here. The interlock patent from CATL names contact impedance, supply ripple and static discharge as sources of false trips, and Mercedes' bulletin for model line 243 links its interlock codes to oxidised low-voltage pins, bent pins at HV components and twisted harness runs; it adds that the HV component itself is rarely to blame. No maker documents U3516. Drivers notice HV shutdowns that come and go, often after rough roads or rain."
    de: "U3516 kennzeichnet Schleife C als elektrisch vorhanden, aber unzuverlässig: Widerstand, Zeitverhalten oder Muster des Rücksignals liegen außerhalb dessen, was das Steuergerät akzeptiert – oft nur für Augenblicke. Da die U35xx-Reihe für die Kreise B und C keinen Code für sporadische Fehler kennt, anders als P0A0E bei Kreis A, landen kurze Aussetzer vermutlich hier. CATLs Interlock-Patent nennt Übergangswiderstände, Versorgungswelligkeit und statische Entladung als Gründe für Fehlauslösungen; Mercedes führt im Bulletin zur Baureihe 243 für seine Interlock-Codes oxidierte Niedervoltkontakte, an HV-Bauteilen verbogene Pins und verdrehte Kabelstränge als Ursachen an und betont, dass die HV-Komponente selbst selten schuld ist. U3516 dokumentiert kein Hersteller. Spürbar sind HV-Abschaltungen, die kommen und gehen."
  affected_components:
    - hvil_loop_c
  common_causes:
    - id: loose_contact_loop_c
      likelihood: high
      label:
        en: Loose or spread contact in a connector of loop C
        de: Lockerer oder aufgeweiteter Kontakt in einem Stecker von Kreis C
    - id: oxidised_interlock_pins
      likelihood: medium
      label:
        en: Oxidised low-voltage interlock pins
        de: Oxidierte Interlock-Kontakte im Niedervoltstecker
    - id: twisted_harness
      likelihood: medium
      label:
        en: Twisted or strained harness section moving with the body
        de: Verdrehter oder unter Zug stehender Kabelabschnitt, der sich mit der Karosserie bewegt
    - id: static_interference
      likelihood: low
      label:
        en: Static discharge or interference on the interlock line
        de: Statische Entladung oder Störungen auf der Interlock-Leitung
  symptoms:
    - en: Sporadic loss of ready mode
      de: Fahrbereitschaft geht sporadisch verloren
    - en: HV warning that appears and clears by itself
      de: HV-Warnung, die erscheint und von selbst erlischt
    - en: Fault hard to reproduce in the workshop
      de: Fehler in der Werkstatt schwer nachzustellen
