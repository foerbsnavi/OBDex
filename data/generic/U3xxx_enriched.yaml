- code: U3001
  category: network
  title:
    en: Control Module Improper Shutdown Performance
    de: Steuergerät fehlerhaftes Abschalten Funktion
  description:
    en: "U3001 tells you that a module did not finish its orderly power-down: supply vanished or dipped before it had closed its tasks and saved its data, so it notes the abrupt end at the next start. Low voltage is the usual trigger. Audi found U300100 static in the engine computer of 2019 A6, A7, A8 and Q8 3.0 TFSI models after a low-voltage event, with the check engine light on and sometimes a no-start, and released new ECM software. Volkswagen saw the same entry in the engine module of 2018–2020 Tiguan, Passat and Beetle after battery work and clears it by switching transport mode on and off. Ford pairs U3001:68 or :89 with U3000:96 in the F-150 steering module (SSM 51226) when voltage is too low at start-up, which costs steering assist until voltage recovers."
    de: "U3001 bedeutet, dass ein Steuergerät nicht geordnet herunterfahren konnte: Die Versorgung brach weg oder sackte ab, bevor es seine Aufgaben beendet und Daten gesichert hatte, also vermerkt es das abrupte Ende beim nächsten Start. Meist steckt Unterspannung dahinter. Audi fand U300100 statisch im Motorsteuergerät von A6, A7, A8 und Q8 3.0 TFSI (2019) nach einem Spannungseinbruch, mit Motorkontrollleuchte und teils ohne Start, und brachte neue Software. Volkswagen sah denselben Eintrag im Motorsteuergerät von Tiguan, Passat und Beetle 2018–2020 nach Arbeiten an der Batterie und löscht ihn über Ein- und Ausschalten des Transportmodus. Ford nennt U3001:68 oder :89 zusammen mit U3000:96 im Lenkungssteuergerät des F-150 (SSM 51226), wenn beim Start zu wenig Spannung anliegt; bis sie zurückkehrt, fehlt die Lenkhilfe."
  affected_components:
    - control_module
    - module_power_supply
  common_causes:
    - id: battery_low_or_disconnected
      likelihood: high
      label:
        en: Discharged battery, battery swap or jump start cutting power mid-shutdown
        de: Entladene Batterie, Batterietausch oder Fremdstart unterbricht das Herunterfahren
    - id: module_software
      likelihood: medium
      label:
        en: Module software that logs the event too readily and needs an update
        de: Steuergeräte-Software, die das Ereignis zu leicht einträgt und ein Update braucht
    - id: supply_connection
      likelihood: medium
      label:
        en: Loose feed, ground or fuse contact dropping out after key-off
        de: Lockere Versorgung, Masse oder Sicherung, die nach dem Abstellen aussetzt
    - id: power_relay_early_off
      likelihood: low
      label:
        en: Main or power-hold relay opening before the module is done
        de: Haupt- oder Halterelais fällt ab, bevor das Steuergerät fertig ist
  symptoms:
    - en: Stored code found during service, often with no complaint
      de: Gespeicherter Code beim Service, häufig ohne Beanstandung
    - en: Check engine light on and occasionally a no-start when the engine computer stores it
      de: Motorkontrollleuchte an und gelegentlich kein Start, wenn das Motorsteuergerät ihn speichert
    - en: Missing steering assist right after start-up when the steering module stores it
      de: Fehlende Lenkhilfe direkt nach dem Start, wenn das Lenkungssteuergerät ihn speichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [0, 400]
    estimated_hours: [0.2, 1.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
