- code: U3502
  category: network
  title:
    en: Control Module Input Power A Circuit High
    de: Steuergerät Eingangsspannung A Stromkreis hoch
  description:
    en: U3502 means supply A rises above its allowed limit. In GM's 2016–2019 hybrid OBD tables the electric brake booster checks its CAN supply voltage and sets U3502 above 16 V lasting 0.09 s while its software runs; this is Type B, so the MIL comes on after two failing trips, and the test passes after 30 s with ignition on. Unlike low voltage, which a module can often ride out, overvoltage endangers electronics and power stages, which explains the short reaction time. Common causes are a regulator fault in the generator or DC/DC converter, jump-starting from a 24 V source or a wrongly set charger, and a load dump when a battery cable comes loose while charging. If several modules report high voltage at the same moment, the charging system is at fault, not the module.
    de: U3502 heißt, dass Versorgung A über ihre zulässige Grenze steigt. In GMs Hybridtabellen 2016–2019 prüft der elektrische Bremskraftverstärker seine CAN-Versorgung und setzt U3502 bei über 16 V für 0,09 s, solange seine Software läuft; das ist Typ B, die MIL leuchtet nach zwei fehlerhaften Fahrten, und bestanden ist der Test nach 30 s mit Zündung ein. Anders als Unterspannung, die ein Gerät oft übersteht, gefährdet Überspannung Elektronik und Leistungsstufen – daher die kurze Reaktionszeit. Häufig stecken ein defekter Regler in Generator oder Gleichspannungswandler dahinter, Starthilfe aus einer 24-V-Quelle, ein falsch eingestelltes Ladegerät oder ein Lastabwurf, wenn sich beim Laden eine Batterieklemme löst. Melden mehrere Geräte zugleich Überspannung, liegt es an der Ladeanlage, nicht am Steuergerät.
  affected_components:
    - module_power_a
    - charging_system
  common_causes:
    - id: voltage_regulator_fault
      likelihood: high
      label:
        en: Generator regulator or DC/DC converter overcharging
        de: Generatorregler oder Gleichspannungswandler lädt zu hoch
    - id: external_jump_or_charger
      likelihood: medium
      label:
        en: Jump start or external charger with excessive voltage
        de: Starthilfe oder Ladegerät mit zu hoher Spannung
    - id: load_dump
      likelihood: medium
      label:
        en: Loose battery terminal causing voltage spikes
        de: Lockere Batterieklemme verursacht Spannungsspitzen
    - id: module_measurement
      likelihood: low
      label:
        en: Faulty voltage measurement inside the module
        de: Fehlerhafte Spannungsmessung im Steuergerät
  symptoms:
    - en: MIL after repeated trips
      de: MIL nach wiederholten Fahrten
    - en: Several modules logging overvoltage at once
      de: Mehrere Steuergeräte melden gleichzeitig Überspannung
    - en: Flickering lights or battery warning
      de: Flackerndes Licht oder Batteriewarnung
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 700]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3501, U3500, U3503, U3506, U350A]
  sources:
