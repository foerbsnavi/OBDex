- code: U3529
  category: network
  title:
    en: High Voltage System Interlock Circuit H
    de: Hochvoltsystem Interlock-Stromkreis H
  description:
    en: U3529 marks a fault on circuit H, the eighth interlock loop, without a more specific result. Texas Instruments distinguishes one central loop running through all high-voltage parts from individual loops inside each subsystem that confirm its own assembly. Eight separate loops are realistic mainly for trucks, buses and machines with several packs and distribution boxes, such as Volvo's electric-road trucks with at least two HV buses or Caterpillar's multi-pack machines; in passenger cars a fourth to eighth loop is hardly to be expected. No manufacturer documents U3529. On a car, compare codes in other units before assuming a wiring fault.
    de: U3529 meldet einen Fehler an Kreis H, der achten Interlock-Schleife, ohne genaueren Befund. Texas Instruments unterscheidet eine zentrale Schleife durch alle Hochvoltteile von Einzelschleifen in jedem Teilsystem, die dessen eigenen Zusammenbau bestätigen. Acht getrennte Schleifen sind vor allem bei Lkw, Bussen und Maschinen mit mehreren Akkupaketen und Verteilerkästen realistisch, etwa bei Volvos Lkw für elektrische Straßen mit mindestens zwei HV-Bussen oder Caterpillars Maschinen mit mehreren Paketen; im Pkw ist eine vierte bis achte Schleife kaum zu erwarten. Kein Hersteller dokumentiert U3529. Im Pkw erst die Codes anderer Steuergeräte vergleichen, bevor man einen Leitungsfehler annimmt.
  affected_components:
    - hvil_loop_h
    - hv_connectors
  common_causes:
    - id: loop_h_connector_open
      likelihood: high
      label:
        en: Connector or disconnect on loop H open
        de: Stecker oder Trennstelle an Kreis H offen
    - id: loop_h_harness_damage
      likelihood: medium
      label:
        en: Loop H wiring damaged on chassis or between packs
        de: Leitung von Kreis H am Rahmen oder zwischen Paketen beschädigt
    - id: misread_code_or_software
      likelihood: low
      label:
        en: Code logged by a controller with faulty software rather than a real loop H fault
        de: Code von einem Steuergerät mit fehlerhafter Software abgelegt statt echter Fehler an Kreis H
  symptoms:
    - en: One HV branch or pack unavailable, or no ready mode
      de: Ein HV-Zweig oder Akkupaket nicht verfügbar oder keine Fahrbereitschaft
    - en: Warning about the high-voltage system
      de: Warnung zum Hochvoltsystem
