- code: U3503
  category: network
  title:
    en: Control Module Input Power A Circuit Intermittent/Erratic
    de: Steuergerät Eingangsspannung A Stromkreis sporadisch/unstet
  description:
    en: "U3503 stands for a supply A that keeps jumping: mostly correct, but with brief dropouts or spikes, so the module sees erratic readings or restarts. What sets it apart from U3501 and U3502 is the pattern rather than the level: short interruptions, fast swings between samples or repeated resets. No manufacturer documents U3503 publicly. GM's brake booster tables show how short supply check windows can be (0.09 s), and that is the time scale on which a loose crimp or a cracked solder joint becomes visible. Look for loose terminals, fuses with weak clamping, chafed wires near moving parts and grounds shared with large loads; wiggle tests while the engine idles, with a scope or min/max recording help, because a plain multimeter averages such events away."
    de: "U3503 steht für eine Versorgung A, die springt: meist richtig, aber mit kurzen Aussetzern oder Spitzen, sodass das Steuergerät unstete Werte sieht oder neu startet. Von U3501 und U3502 unterscheidet ihn das Muster, nicht der Pegel: kurze Unterbrechungen, schnelle Sprünge zwischen Messungen oder wiederholte Neustarts. Kein Hersteller dokumentiert U3503 öffentlich. GMs Tabellen zum Bremskraftverstärker zeigen, wie kurz Prüffenster der Versorgung sein können (0,09 s) – in dieser Zeitspanne fallen eine lockere Crimpung oder eine gerissene Lötstelle auf. Zu suchen sind lose Klemmen, schlecht klemmende Sicherungen, durchgescheuerte Leitungen an beweglichen Teilen und mit großen Verbrauchern geteilte Massen. Wackeltests bei laufendem Motor mit Oszilloskop oder Min/Max-Aufzeichnung helfen; ein einfaches Multimeter mittelt die Ereignisse weg."
  affected_components:
    - module_power_a
    - power_wiring
  common_causes:
    - id: loose_terminal
      likelihood: high
      label:
        en: Loose crimp, pin or fuse contact in feed A
        de: Lockere Crimpung, Pin oder Sicherungskontakt im Zulauf A
    - id: chafed_wire
      likelihood: medium
      label:
        en: Chafed wire making intermittent contact
        de: Durchgescheuerte Leitung mit zeitweisem Kontakt
    - id: shared_ground_noise
      likelihood: medium
      label:
        en: Ground shared with heavy loads causing dips
        de: Mit großen Verbrauchern geteilte Masse verursacht Einbrüche
    - id: module_solder_joint
      likelihood: low
      label:
        en: Cracked solder joint inside the module
        de: Gerissene Lötstelle im Steuergerät
  symptoms:
    - en: Sporadic resets or brief function dropouts
      de: Sporadische Neustarts oder kurze Funktionsaussetzer
    - en: Code returns over bumps or when loads switch
      de: Code kehrt bei Fahrbahnstößen oder beim Schalten von Verbrauchern zurück
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3500, U3501, U3502, U3507, U350B]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
  reviewed: '2026-11-06'

- code: U3504
  category: network
  title:
    en: Control Module Input Power B Circuit Range/Performance
    de: Steuergerät Eingangsspannung B Stromkreis Bereich/Funktion
  description:
    en: "U3504 checks the plausibility of the second supply input, B. Modules with high-power stages often split their supply: in GM's electric brake booster tables B is the battery feed of the booster circuit (voltage sensor 1), checked separately against low and high limits and compared with feed C. U3504 applies when B is present but implausible, for example disagreeing with the logic supply or failing to follow battery voltage under load, without crossing a hard limit. No manufacturer documents U3504 publicly. Because B often feeds valves or motors, a high resistance tends to show only while current flows, as a drop that is invisible at rest. Measure the voltage drop across fuse, connector and ground under load and check whether U3018 or U3505 are stored as well."
    de: "U3504 ist der Plausibilitätscode für den zweiten Versorgungseingang B. Geräte mit Leistungsstufen teilen ihre Versorgung oft auf: In GMs Tabellen zum elektrischen Bremskraftverstärker ist B die Batterieversorgung des Verstärkerkreises (Spannungsfühler 1), getrennt auf untere und obere Grenzen geprüft und mit Eingang C verglichen. U3504 trifft zu, wenn B anliegt, aber nicht stimmig ist – etwa nicht zur Logikversorgung passt oder der Batteriespannung unter Last nicht folgt –, ohne eine feste Grenze zu verletzen. Kein Hersteller dokumentiert U3504 öffentlich. Weil B häufig Ventile oder Motoren speist, zeigt sich ein Übergangswiderstand meist nur bei Stromfluss, als Abfall, den man im Ruhezustand nicht sieht. Spannungsfall über Sicherung, Stecker und Masse unter Last messen und nachsehen, ob zusätzlich U3018 oder U3505 gespeichert sind."
  affected_components:
    - module_power_b
    - power_wiring
  common_causes:
    - id: high_resistance_contact
      likelihood: medium
      label:
        en: Resistance in fuse, connector or ground of feed B under load
        de: Übergangswiderstand in Sicherung, Stecker oder Masse von Eingang B unter Last
    - id: feed_mismatch
      likelihood: medium
      label:
        en: Feed B supplied from a different source than expected
        de: Eingang B aus einer anderen Quelle als vorgesehen versorgt
    - id: internal_measurement_drift
      likelihood: low
      label:
        en: Drifting measurement of feed B inside the module
        de: Driftende Messung von Eingang B im Steuergerät
  symptoms:
    - en: Power stage functions weak or switched off under load
      de: Leistungsfunktionen schwach oder unter Last abgeschaltet
    - en: Code mainly when motors or valves are active
      de: Code vor allem bei aktiven Motoren oder Ventilen
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3505, U3506, U3507, U3007, U3018]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
  reviewed: '2026-11-06'

- code: U3505
  category: network
  title:
    en: Control Module Input Power B Circuit Low
    de: Steuergerät Eingangsspannung B Stromkreis niedrig
  description:
    en: "U3505 reports that supply input B is too low. In GM's 2016–2019 hybrid tables the electric brake booster treats B as the battery feed of the booster circuit and checks it at several levels: sensor reading under 6 V for 30 s, battery voltage under 9.3 V for 90 s, and quick 0.2 s checks with reduced assist once it falls below 9.3 V (level 1) or 7.5 V (level 2); all Special Type C, no MIL. Body controllers use the code too: GM bulletin PIT5869 (revised as PIT5869A) on 2021–2024 full-size SUVs such as Escalade and Tahoe pairs U3505 with U3018 and B1AA3, warm A/C and the SES light; a shorted circuit to the front console compartment lamp opens fuse F4DR on the BCM's second feed. Check fuse and battery first."
    de: "U3505 meldet zu niedrige Spannung an Versorgungseingang B. GMs elektrischer Bremskraftverstärker in den Hybridtabellen 2016–2019 sieht B als Batterieversorgung des Verstärkerkreises und prüft in Stufen: Fühlerwert unter 6 V für 30 s, Batteriespannung unter 9,3 V für 90 s sowie schnelle Prüfungen von 0,2 s, bei denen die Unterstützung zurückgenommen wird, sobald 9,3 V (Stufe 1) oder 7,5 V (Stufe 2) unterschritten sind; alles Special Typ C ohne MIL. Auch Karosseriesteuergeräte nutzen den Code: GMs PIT5869/PIT5869A zu Tahoe, Suburban, Yukon und Escalade 2021–2024 nennt U3505 mit U3018 und B1AA3, warmer Klimaanlage und Motorkontrollleuchte, wenn ein Kurzschluss im Kreis der vorderen Konsolenfachleuchte die Sicherung F4DR am zweiten BCM-Eingang öffnet. Zuerst Sicherung und Batterie prüfen."
  affected_components:
    - module_power_b
    - power_wiring
    - fuse
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Fuse of feed B blown by a short elsewhere on the circuit
        de: Sicherung von Eingang B durch Kurzschluss im Kreis ausgelöst
    - id: weak_battery
      likelihood: high
      label:
        en: Weak or discharged 12 V battery
        de: Schwache oder entladene 12-V-Batterie
    - id: feed_resistance
      likelihood: medium
      label:
        en: Corroded terminal or ground in feed B
        de: Korrodierte Klemme oder Masse im Zulauf B
    - id: module_internal_supply
      likelihood: low
      label:
        en: Internal measurement or supply path faulty
        de: Interne Messung oder Versorgungspfad defekt
  symptoms:
    - en: Functions on the second feed missing, e.g. warm A/C
      de: Funktionen am zweiten Eingang fehlen, etwa warme Klimaanlage
    - en: Reduced brake assist with warning on booster modules
      de: Verminderte Bremsunterstützung mit Warnung bei Verstärkermodulen
    - en: Stored together with U3018
      de: Zusammen mit U3018 gespeichert
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [10, 400]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
