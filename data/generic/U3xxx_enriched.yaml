- code: U3537
  category: network
  title:
    en: High Voltage System Interlock Circuit L Low
    de: Hochvoltsystem Interlock-Stromkreis L niedrig
  description:
    en: U3537 is logged for an insufficient reading on loop L. The cause may lie outside the loop itself. In a Volvo patent with paired loops for trucks with separate high-voltage buses, neither loop is closed before the current sources start; one loop only closes once the source of the other energises the coil of an isolated relay. If that partner source stays off, or the relay coil or its contacts fail, the dependent loop reads as open though its own plugs are fine. With such a design, a low result on loop L calls for checking the codes and source of the coupled loop and the relay before any wiring is opened. No maker documents U3537; the contactors behind loop L stay open.
    de: U3537 wird bei ungenügendem Wert an Schleife L abgelegt. Die Ursache kann außerhalb der Schleife selbst liegen. In Volvos Patent mit zwei Schleifen für Lkw mit getrennten Hochvolt-Bussen ist vor dem Start der Stromquellen keine Schleife geschlossen; die eine schließt erst, wenn die Quelle der anderen die Spule eines galvanisch getrennten Relais bestromt. Bleibt diese Partnerquelle aus oder versagen Relaisspule oder -kontakt, wirkt die abhängige Schleife offen, obwohl ihre eigenen Stecker in Ordnung sind. Bei einer solchen Auslegung gehören bei niedrigem Wert an Kreis L zuerst die Codes und die Quelle der gekoppelten Schleife sowie das Relais auf den Prüfstand, bevor Leitungen geöffnet werden. U3537 dokumentiert kein Hersteller; die Schütze hinter Kreis L bleiben offen.
  affected_components:
    - hvil_loop_l
    - hvil_wiring
  common_causes:
    - id: loop_l_plug_open
      likelihood: high
      label:
        en: Plug within loop L disconnected or wire shorted to ground
        de: Stecker in Kreis L getrennt oder Leitung mit Masseschluss
    - id: coupled_loop_source_off
      likelihood: medium
      label:
        en: Source of a coupled loop not running, so the coupling relay stays open
        de: Quelle einer gekoppelten Schleife läuft nicht, das Koppelrelais bleibt offen
    - id: coupling_relay_fault
      likelihood: low
      label:
        en: Coupling relay between loops with failed coil or contact
        de: Koppelrelais zwischen den Schleifen mit defekter Spule oder defektem Kontakt
  symptoms:
    - en: Vehicle or one high-voltage bus does not become ready
      de: Fahrzeug oder ein Hochvolt-Bus wird nicht betriebsbereit
    - en: Interlock codes for more than one loop stored at once
      de: Interlock-Codes für mehr als eine Schleife gleichzeitig gespeichert
