- code: U300F
  category: network
  title:
    en: Ignition Input Accessory
    de: Zündungseingang Zubehör
  description:
    en: "U300F refers to the accessory input, the line that powers comfort loads such as audio or power windows when the key is in accessory. In GM's 2012 pickup wiring manual this accessory voltage circuit is active in accessory and run but switched off in crank and in both off positions. A module stores U300F when that pattern breaks: voltage on the accessory input with the key out, or none while the body controller broadcasts accessory or run. No manufacturer documents U300F publicly. Since the accessory feed is often routed through a relay and shared by many consumers, a stuck relay can leave radio and windows working with the key removed and slowly flatten the battery, whereas an open feed simply kills those functions; checking which of the two applies is the first step."
    de: "U300F bezieht sich auf den Zubehöreingang, also die Leitung, die Komfortverbraucher wie Radio oder Fensterheber in der Zubehörstellung versorgt. Im Schaltplanhandbuch der GM-Pickups 2012 ist dieser Zubehörkreis bei Zubehör und Fahrt aktiv, beim Anlassen und in beiden Aus-Stellungen dagegen abgeschaltet. Ein Steuergerät speichert U300F, wenn dieses Muster bricht: Spannung am Zubehöreingang bei abgezogenem Schlüssel oder keine, obwohl das Karosseriesteuergerät Zubehör oder Fahrt sendet. Kein Hersteller dokumentiert U300F öffentlich. Weil die Zubehörleitung oft über ein Relais läuft und viele Verbraucher speist, kann ein klebendes Relais Radio und Fenster ohne Schlüssel weiterlaufen lassen und die Batterie langsam leeren, während eine Unterbrechung diese Funktionen einfach abschaltet. Erster Schritt ist zu klären, welcher Fall vorliegt."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: accessory_relay_stuck
      likelihood: medium
      label:
        en: Accessory relay sticking closed or not pulling in
        de: Zubehörrelais klebt oder zieht nicht an
    - id: accessory_fuse_open
      likelihood: medium
      label:
        en: Blown accessory fuse or open feed wire
        de: Durchgebrannte Zubehörsicherung oder unterbrochene Zuleitung
    - id: switch_contacts_worn
      likelihood: medium
      label:
        en: Worn accessory contact in the ignition switch
        de: Verschlissener Zubehörkontakt im Zündschalter
    - id: aftermarket_backfeed
      likelihood: low
      label:
        en: Aftermarket equipment backfeeding the accessory line
        de: Nachgerüstetes Gerät speist in die Zubehörleitung zurück
  symptoms:
    - en: Radio, windows or sockets dead in accessory, or still on with the key out
      de: Radio, Fenster oder Steckdosen in Zubehör ohne Funktion oder ohne Schlüssel noch an
    - en: Battery drained after parking when the feed stays live
      de: Batterie nach dem Abstellen leer, wenn die Leitung aktiv bleibt
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [10, 350]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
