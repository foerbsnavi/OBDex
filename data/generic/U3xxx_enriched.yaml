- code: U351C
  category: network
  title:
    en: High Voltage System Interlock Circuit D High
    de: Hochvoltsystem Interlock-Stromkreis D hoch
  description:
    en: "U351C is stored when loop D carries more voltage than its present state allows. GM's high check for loop A, P0A0D, shows why both states are tested: with the source commanded to 0 V, more than 24 % of 5 V counts as a failure, five times in eight samples; with the source at 5 V the limit is 44 %, four times in six. A loop that fails to fall when its source switches off reveals foreign voltage even if it looks normal while fed. No maker lists U351C. Likely are a loop wire touching a 12 V feed, a source that no longer turns off, or a bad repair splice. Readiness is withheld until the loop is clean."
    de: "U351C wird abgelegt, wenn an Schleife D mehr Spannung anliegt, als ihr augenblicklicher Zustand zulässt. GMs Hoch-Prüfung für Kreis A, P0A0D, zeigt, warum beide Zustände geprüft werden: Bei auf 0 V geschalteter Quelle gilt mehr als 24 % von 5 V als Fehler, fünfmal in acht Messungen; bei eingeschalteter Quelle liegt die Grenze bei 44 %, viermal in sechs. Eine Schleife, die beim Abschalten der Quelle nicht abfällt, verrät so Fremdspannung, auch wenn sie bestromt unauffällig wirkt. U351C nennt kein Hersteller. Wahrscheinlich sind eine Leitung mit Kontakt zu 12 V, eine Quelle, die nicht mehr abschaltet, oder eine schlechte Reparaturstelle. Bis dahin gibt es keine Fahrbereitschaft."
  affected_components:
    - hvil_loop_d
    - hvil_wiring
  common_causes:
    - id: loop_d_short_to_12v
      likelihood: high
      label:
        en: Loop D wire in contact with a 12 V supply line
        de: Leitung von Kreis D mit Kontakt zu einer 12-V-Versorgung
    - id: source_stuck_on
      likelihood: medium
      label:
        en: Source driver in the controller no longer switches off
        de: Quellstufe im Steuergerät schaltet nicht mehr ab
    - id: wrong_repair_splice
      likelihood: low
      label:
        en: Earlier repair splice joined the loop to a wrong wire
        de: Frühere Reparaturstelle verbindet die Schleife mit einer falschen Leitung
  symptoms:
    - en: Vehicle does not reach ready mode
      de: Fahrzeug wird nicht fahrbereit
    - en: Fault returns immediately after clearing
      de: Fehler kehrt sofort nach dem Löschen zurück
    - en: Other 12 V consumers may show faults if a supply wire is involved
      de: Andere 12-V-Verbraucher zeigen womöglich Fehler, wenn eine Versorgungsleitung beteiligt ist
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
