- code: U3567
  category: network
  title:
    en: Anode Inlet Pressure Sensor 2 Circuit
    de: Anodeneintritt Drucksensor 2 Stromkreis
  description:
    en: "U3567 belongs to the second pressure sensor at the anode inlet. Its signal carries safety weight: GM uses anode pressure to catch an injector stuck open, then shuts the tank valves, opens the anode bleed valve, lifts cathode pressure with compressor and backpressure valve and opens the cathode bypass so hydrogen in the exhaust stays diluted. Another GM patent treats a gap of more than a calibrated margin, typically 3 kPa, between actual and desired pressure as an injector fault. Sensors in this wet zone can ice up, so GM checks the anode sensor before start against ambient pressure plus the anode-to-cathode differential. A second sensor allows a similar comparison while driving. No maker publishes U3567. Expect a warning; with sensor 1 as the only source, power may be reduced. Sensor 1 is U3566."
    de: "U3567 gehört zum zweiten Drucksensor am Anodeneintritt. Sein Signal hat Sicherheitsrang: GM erkennt am Anodendruck einen offen hängenden Injektor, schließt dann die Tankventile, öffnet das Anoden-Spülventil, hebt mit Verdichter und Gegendruckventil den Kathodendruck an und öffnet den Kathoden-Bypass, damit der Wasserstoff im Abgas verdünnt bleibt. Ein weiteres GM-Patent wertet eine Abweichung zwischen Ist- und Solldruck jenseits einer kalibrierten Grenze, typisch 3 kPa, als Injektordefekt. In der Nässe am Stack können Sensoren vereisen; GM prüft den Anodensensor deshalb vor dem Start gegen Umgebungsdruck plus Differenzdruck zur Kathode. Ein zweiter Sensor erlaubt einen vergleichbaren Abgleich während der Fahrt. Öffentlich nennt kein Hersteller U3567. Folge: Warnung, mit Sensor 1 allein evtl. weniger Leistung. Sensor 1 meldet U3566."
  affected_components:
    - anode_inlet_pressure_sensor_2
    - sensor_wiring
  common_causes:
    - id: sensor_connector_wiring_stack_area
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of sensor 2 at the stack
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker von Sensor 2 am Stack
    - id: sensor_internal_fault
      likelihood: medium
      label:
