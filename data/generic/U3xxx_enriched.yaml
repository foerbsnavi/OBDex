- code: U352B
  category: network
  title:
    en: High Voltage System Interlock Circuit H Low
    de: Hochvoltsystem Interlock-Stromkreis H niedrig
  description:
    en: "U352B reports too low a level on interlock loop H. Apart from a pulled plug or a grounded wire, a deliberate opening can cause it: Texas Instruments mentions feeding a crash signal into the loop so that high voltage shuts off after an accident. The DGUV warns that such a crash shutdown does not establish absence of voltage and that disconnection following the maker's rescue sheet is still advisable; FMVSS 305a takes its post-crash voltage readings in a window from 10 s to one minute after the impact. No maker documents U352B. After a collision, replace damaged loop sections rather than patching them, and have trained staff isolate the system."
    de: "U352B meldet einen zu niedrigen Pegel an Interlock-Schleife H. Neben einem gezogenen Stecker oder einem Masseschluss kann auch gewolltes Öffnen dahinterstehen: Texas Instruments erwähnt, ein Crash-Signal in die Schleife einzuspeisen, damit die Hochspannung nach einem Unfall abschaltet. Die DGUV warnt, dass eine solche Crash-Abschaltung keine festgestellte Spannungsfreiheit ist und das Freischalten nach dem Rettungsdatenblatt des Herstellers trotzdem erfolgen sollte; FMVSS 305a misst die Spannungen 10 bis 60 Sekunden nach dem Aufprall. Kein Hersteller dokumentiert U352B. Nach einem Unfall beschädigte Schleifenabschnitte ersetzen statt flicken und das System von qualifiziertem Personal freischalten lassen."
  affected_components:
    - hvil_loop_h
    - hvil_wiring
  common_causes:
    - id: crash_signal_opened_loop
      likelihood: medium
      label:
        en: Loop H opened on purpose by a crash signal after an accident
        de: Kreis H nach einem Unfall gewollt durch ein Crash-Signal geöffnet
    - id: loop_h_damaged_in_collision
      likelihood: medium
      label:
        en: Loop H wiring or plug damaged in a collision
        de: Leitung oder Stecker von Kreis H bei einem Unfall beschädigt
    - id: loop_h_short_to_ground
      likelihood: medium
      label:
        en: Loop H wire shorted to ground
        de: Leitung von Kreis H mit Masseschluss
  symptoms:
    - en: High voltage off after an accident or airbag deployment
      de: Hochspannung nach Unfall oder Airbag-Auslösung abgeschaltet
    - en: Vehicle cannot be made ready
      de: Fahrzeug lässt sich nicht fahrbereit schalten
