- code: U3522
  category: network
  title:
    en: High Voltage System Interlock Circuit F Performance
    de: Hochvoltsystem Interlock-Stromkreis F Funktion
  description:
    en: "U3522 is set when loop F behaves inconsistently, for instance when redundant evaluation channels reach different verdicts or the signal timing is off. Such checks exist because the interlock belongs to a safety function: Samsung SDI notes that it then needs an ASIL rating and failure-rate figures for its parts, so hidden faults in the monitoring path have to be caught, not just an open loop. CARB counts the interlock among safety-only systems, which is why this code concerns electrical safety rather than emissions and why lamp behaviour differs between makers. No manufacturer publishes U3522. Expect sporadic refusals to become ready."
    de: "U3522 wird gesetzt, wenn Schleife F sich widersprüchlich verhält, etwa weil redundante Auswertekanäle zu unterschiedlichen Urteilen kommen oder das Zeitverhalten nicht stimmt. Solche Prüfungen gibt es, weil das Interlock zu einer Sicherheitsfunktion gehört: Laut Samsung SDI braucht es dann eine ASIL-Einstufung und Ausfallraten für seine Bauteile, also müssen auch verdeckte Fehler im Überwachungspfad auffallen, nicht nur eine offene Schleife. CARB rechnet das Interlock zu den reinen Sicherheitssystemen – deshalb geht es hier um elektrische Sicherheit statt Abgas, und das Lampenverhalten unterscheidet sich je nach Hersteller. Kein Hersteller veröffentlicht U3522. Das Fahrzeug wird gelegentlich nicht fahrbereit."
  affected_components:
    - hvil_loop_f
  common_causes:
    - id: channel_mismatch
      likelihood: medium
      label:
        en: Redundant measuring channels for loop F disagree because of a sensing fault
        de: Redundante Messkanäle für Kreis F widersprechen sich wegen eines Messfehlers
    - id: intermittent_contact_loop_f
      likelihood: medium
      label:
        en: Intermittent contact in a loop F connector
        de: Zeitweiser Kontaktfehler in einem Stecker von Kreis F
    - id: controller_internal_fault
      likelihood: low
      label:
