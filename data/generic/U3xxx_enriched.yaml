- code: U356D
  category: network
  title:
    en: Anode Header Drain Valve
    de: Anoden-Sammler-Ablassventil
  description:
    en: "U356D is set when the header drain valve responds electrically yet does not empty the header as intended. GM splits each opening into two phases: first water runs out of the header, then nitrogen-rich gas is bled off. The end of the water phase is recognised from stack voltage or from an estimated gas flow across the valve, and the bleed phase is sized by the hydrogen content of the anode. If the water phase takes unusually long, GM concludes the stack is tilted or the header overfilled and calls on the valve more often. A valve stuck closed lets water build up and starve the cells farthest along the header; one stuck open keeps venting hydrogen into the cathode exhaust. Ice is a further risk at outlet manifolds. No maker publishes U356D. A warning and less power follow; circuit faults are U356C."
    de: "U356D steht für ein Sammler-Ablassventil, das elektrisch reagiert, den Sammler aber nicht wie vorgesehen leert. GM teilt jede Öffnung in zwei Abschnitte: Erst läuft Wasser aus dem Sammler, dann wird stickstoffreiches Gas abgelassen. Das Ende der Wasserphase erkennt das Steuergerät an der Stackspannung oder an einem geschätzten Gasdurchfluss; die Spüldauer richtet sich nach dem Wasserstoffanteil der Anode. Dauert die Wasserphase ungewöhnlich lange, schließt GM auf Schräglage oder einen überfüllten Sammler und setzt das Ventil häufiger ein. Hängt es zu, staut sich Wasser und die Zellen am Sammlerende bekommen zu wenig Wasserstoff; hängt es offen, strömt laufend Wasserstoff ins Kathodenabgas. Dazu kommt Eis in den Austrittskanälen. Kein Hersteller dokumentiert U356D öffentlich. Folge: Warnung und weniger Leistung; Kreisfehler meldet U356C."
  affected_components:
    - anode_header_drain_valve
  common_causes:
