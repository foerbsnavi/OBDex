- code: U356E
  category: network
  title:
    en: Anode Drain Valve Heater Relay Control Circuit
    de: Anoden-Ablassventil Heizrelais Steuerkreis
  description:
    en: U356E refers to the relay that powers the heater on the anode drain valve, more precisely to its coil drive from the fuel cell controller. Drain valves sit in the wettest corner of the hydrogen loop and can freeze shut after a cold night. Hyundai fits PTC heaters to its purge valves, fed by the battery and switched on when a start below freezing is detected; Parker Hannifin places a PTC element right at the seat of a fuel cell drain valve, and Hilite sells drain valves with built-in heating that still open at minus 40 °C. If the relay cannot be driven, the heater stays off, or stays on and drains the battery. In mild weather nothing may be noticeable; in frost an iced drain valve can delay or prevent the start. No maker documents U356E publicly, and its MIL handling is unknown.
    de: Gemeint ist die Steuerseite des Relais, das die Heizung am Anoden-Ablassventil schaltet, meist die Ansteuerung der Relaisspule durch das Brennstoffzellen-Steuergerät. Ablassventile sitzen an der nassesten Stelle des Wasserstoffkreises und können nach einer Frostnacht festfrieren. Hyundai versieht Spülventile mit PTC-Heizern, die aus der Batterie gespeist und bei einem Start unter dem Gefrierpunkt zugeschaltet werden; Parker Hannifin setzt das PTC-Element direkt an den Ventilsitz, Hilite bietet beheizte Ablassventile an, die noch bei −40 °C öffnen. Lässt sich das Relais nicht ansteuern, bleibt die Heizung aus – oder dauerhaft an und leert die Batterie. Bei milder Witterung fällt oft nichts auf; bei Frost kann ein vereistes Ventil den Start verzögern oder verhindern. Öffentlich dokumentiert ist U356E nicht, die MIL-Behandlung ist offen.
  affected_components:
    - anode_drain_heater_relay
    - relay_wiring
  common_causes:
