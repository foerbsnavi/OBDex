- code: U3559
  category: network
  title:
    en: Air Inlet Pressure Sensor Circuit
    de: Luftansaug-Drucksensor Stromkreis
  description:
    en: "U3559 flags a wiring or signal fault on the first pressure sensor of the air supply that feeds the stack, located behind the air filter and ahead of the electric compressor. Its reading is the suction pressure of the compressor: in a Toyota patent the delivery pressure is divided by it to place the operating point on the compressor map and keep clear of the surge line, and Nissan derives the compressor inlet pressure the same way from a barometric sensor. Altitude and a clogged filter also show up here. No maker documents U3559 publicly. Without the value the controller has to work with a substitute, the margin to surge shrinks, and output is likely held back. Honda's Clarity shows that air supply faults in such cars light the MIL. Sensors further downstream report as U355A and U355B."
    de: Der Code meldet einen Stromkreisfehler am Drucksensor ganz am Anfang des Luftwegs der Brennstoffzelle, hinter dem Luftfilter und vor dem elektrischen Verdichter. Sein Wert ist der Ansaugdruck des Verdichters. Toyota bildet laut Patent aus Förder- und Ansaugdruck das Druckverhältnis, um den Betriebspunkt im Kennfeld von der Pumpgrenze fernzuhalten; Nissan rechnet den Eingangsdruck des Verdichters ebenso aus einem Atmosphärendrucksensor. In öffentlichen Herstellerunterlagen taucht U3559 nicht auf. Fehlt der Messwert, rechnet das Steuergerät mit einem Ersatzwert, der Sicherheitsabstand zur Pumpgrenze schrumpft, die Leistung wird voraussichtlich gedrosselt. Dass Fehler der Luftversorgung bei Brennstoffzellenautos die MIL schalten, zeigt Hondas Clarity. Die Sensoren weiter stromab melden U355A und U355B.
  affected_components:
    - air_inlet_pressure_sensor
    - sensor_wiring
  common_causes:
    - id: connector_moisture_intake_area
      likelihood: high
      label:
        en: Connector or wiring at the air filter housing wet, corroded or damaged
        de: Stecker oder Leitung am Luftfiltergehäuse feucht, korrodiert oder beschädigt
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Inlet pressure sensor faulty internally
        de: Ansaugdrucksensor intern defekt
    - id: sensor_supply_ground_fault
      likelihood: low
      label:
        en: 5 V supply or ground of the sensor missing
        de: 5-V-Versorgung oder Masse des Sensors fehlt
    - id: fuel_cell_controller_fault
      likelihood: low
      label:
        en: Fuel cell control unit faulty or needing a software update
        de: Brennstoffzellen-Steuergerät defekt oder Software veraltet
  symptoms:
