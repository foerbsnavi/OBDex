- code: U352A
  category: network
  title:
    en: High Voltage System Interlock Circuit H Performance
    de: Hochvoltsystem Interlock-Stromkreis H Funktion
  description:
    en: "U352A says the eighth loop is closed but its electrical values leave the calibrated band. In CATL's interlock patent the decision thresholds follow from the loop current, a sensing resistor and the impedance of every HV part in the chain. A long loop through many parts therefore has narrow margins: each extra contact, a replacement part with different internal resistance or a lengthened harness shifts the result. That makes a performance fault on a late loop plausible after repairs or conversions. No maker publishes U352A. Compare part numbers of recently fitted HV parts with the originals and look for added plugs in loop H."
    de: "U352A besagt, dass die achte Schleife geschlossen ist, ihre elektrischen Werte aber das kalibrierte Band verlassen. Im Interlock-Patent von CATL ergeben sich die Entscheidungsschwellen aus Schleifenstrom, einem Messwiderstand und der Impedanz jedes HV-Teils in der Kette. Eine lange Schleife durch viele Teile hat daher wenig Spielraum: Jeder zusätzliche Kontakt, ein Ersatzteil mit anderem Innenwiderstand oder ein verlängerter Kabelbaum verschiebt das Ergebnis. Nach Reparaturen oder Umbauten ist ein Funktionsfehler an einer späten Schleife deshalb naheliegend. Kein Hersteller veröffentlicht U352A. Teilenummern kürzlich eingebauter HV-Teile mit den Originalen vergleichen und nach eingefügten Steckern in Kreis H suchen."
  affected_components:
    - hvil_loop_h
  common_causes:
    - id: non_matching_replacement_part
      likelihood: medium
      label:
        en: Replacement HV component with different interlock resistance fitted
        de: Ersatz-HV-Komponente mit abweichendem Interlock-Widerstand eingebaut
    - id: added_connector_or_extension
      likelihood: medium
      label:
        en: Extra connector or harness extension added to loop H
        de: Zusätzlicher Stecker oder Kabelverlängerung in Kreis H eingefügt
    - id: contact_resistance_rise
      likelihood: medium
      label:
        en: Rising contact resistance at several loop H terminals
        de: Steigender Übergangswiderstand an mehreren Kontakten von Kreis H
  symptoms:
    - en: Fault appears after a repair or conversion
      de: Fehler tritt nach einer Reparatur oder einem Umbau auf
    - en: High-voltage system switches off occasionally
      de: Hochvoltsystem schaltet gelegentlich ab
