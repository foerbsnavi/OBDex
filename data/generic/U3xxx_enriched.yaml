- code: U3515
  category: network
  title:
    en: High Voltage System Interlock Circuit C
    de: Hochvoltsystem Interlock-Stromkreis C
  description:
    en: "U3515 is the general fault of a third interlock loop, circuit C. Such a loop exists where one or two are not enough: Caterpillar's patent for battery machines forms a separate interlock circuit from each battery group with its disconnect and contactor pair, and Samsung SDI mentions designs with more than two independent loops for parts inside the pack. Volvo couples two loops through an isolated relay so that a fault in one opens the other, which is why codes for several loops can be logged together. Which component a manufacturer wires into loop C is not documented publicly for any vehicle. U3515 applies when loop C fails without a more specific low, high or performance result; HV power remains off until the loop is closed again."
    de: "U3515 ist der allgemeine Fehler einer dritten Interlock-Schleife, des Stromkreises C. So eine Schleife gibt es, wo eine oder zwei nicht reichen: Caterpillars Patent für Batteriemaschinen bildet aus jeder Batteriegruppe mit ihrer Trennstelle und ihrem Schützpaar einen eigenen Interlock-Kreis, Samsung SDI nennt Auslegungen mit mehr als zwei unabhängigen Schleifen für Teile im Akku. Volvo koppelt zwei Schleifen über ein galvanisch getrenntes Relais, sodass ein Fehler in der einen auch die andere öffnet – deshalb können Codes mehrerer Kreise zugleich auftauchen. Welches Bauteil ein Hersteller in Kreis C legt, ist für kein Fahrzeug öffentlich beschrieben. U3515 gilt, wenn Kreis C ohne genaueren Befund (niedrig, hoch, Funktion) ausfällt; die Hochvoltversorgung bleibt aus, bis die Schleife wieder geschlossen ist."
  affected_components:
    - hvil_loop_c
    - hv_connectors
  common_causes:
    - id: loop_c_component_open
      likelihood: high
      label:
        en: Connector or cover belonging to loop C opened during work and not refitted correctly
        de: Stecker oder Deckel von Kreis C bei Arbeiten geöffnet und nicht korrekt wieder montiert
    - id: loop_c_harness_damage
      likelihood: medium
      label:
        en: Interlock harness of loop C damaged
        de: Interlock-Kabelbaum von Kreis C beschädigt
    - id: coupled_loop_fault
      likelihood: medium
      label:
        en: Fault in a coupled loop opening loop C as well
        de: Fehler in einer gekoppelten Schleife öffnet auch Kreis C
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Monitoring module unable to drive or read loop C
        de: Überwachendes Steuergerät kann Kreis C nicht ansteuern oder lesen
  symptoms:
    - en: No ready mode, HV system switched off
      de: Keine Fahrbereitschaft, HV-System abgeschaltet
    - en: Interlock codes for more than one loop stored together
      de: Interlock-Codes für mehr als einen Kreis gemeinsam gespeichert
    - en: Charging blocked
      de: Laden gesperrt
  repair:
    difficulty: hard
