- code: U3531
  category: network
  title:
    en: High Voltage System Interlock Circuit K
    de: Hochvoltsystem Interlock-Stromkreis K
  description:
    en: "U3531 stands for an unspecified fault on interlock circuit K, the tenth loop. An interlock need not be a dedicated wire pair. For hybrid trucks, International patented running the hybrid CAN bus through the same connector as the power cable: once the plug is parted, data traffic on that bus stops and one terminating impedance drops out, and a traffic detector then opens an interrupter in the high-voltage feed. A loop K built along these lines would react to a dead or disturbed bus section as well as to an open plug, so network faults stored in the same controllers deserve attention. No maker discloses the members of loop K. High voltage stays blocked while the fault is active."
    de: "U3531 steht für eine unspezifische Störung an Interlock-Kreis K, der zehnten Schleife. Ein Interlock braucht nicht unbedingt ein eigenes Leitungspaar. Für Hybrid-Lkw hat International patentiert, den Hybrid-CAN-Bus durch denselben Stecker zu führen wie das Leistungskabel: Wird der Stecker getrennt, verstummt der Datenverkehr auf diesem Bus und ein Abschlusswiderstand fällt weg; ein Verkehrsdetektor öffnet dann einen Trennschalter in der Hochvoltleitung. Ein so gebauter Kreis K spräche auf einen toten oder gestörten Busabschnitt ebenso an wie auf einen offenen Stecker; Netzwerkfehler in denselben Steuergeräten verdienen deshalb Beachtung. Welche Teile zu Kreis K gehören, veröffentlicht kein Hersteller. Solange der Fehler ansteht, bleibt die Hochspannung gesperrt."
  affected_components:
    - hvil_loop_k
    - hv_connectors
  common_causes:
    - id: loop_k_connector_unlatched
      likelihood: high
      label:
        en: Connector in loop K not fully latched
        de: Stecker in Kreis K nicht vollständig eingerastet
    - id: bus_section_disturbed
      likelihood: medium
      label:
        en: Communication line routed with loop K interrupted or disturbed
        de: Mit Kreis K geführte Kommunikationsleitung unterbrochen oder gestört
    - id: loop_k_harness_damage
      likelihood: medium
      label:
        en: Loop K wiring damaged
        de: Leitung von Kreis K beschädigt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller monitoring loop K faulty
        de: Steuergerät, das Kreis K überwacht, defekt
  symptoms:
    - en: No ready mode or one high-voltage branch unavailable
      de: Keine Fahrbereitschaft oder ein Hochvoltzweig nicht verfügbar
    - en: Network or communication codes stored alongside
      de: Zusätzlich Netzwerk- oder Kommunikationscodes gespeichert
    - en: High-voltage system warning in the instrument cluster
      de: Warnmeldung zum Hochvoltsystem im Kombiinstrument
  repair:
