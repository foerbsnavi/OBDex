- code: U3023
  category: network
  title:
    en: Control Module Input Power Circuit A - Ignition Input On/Start Circuit Correlation
    de: Steuergerät Eingangsspannung Stromkreis A – Zündungseingang Ein/Start Korrelation
  description:
    en: "U3023 means a module sees clearly different voltages on its permanent battery feed A and its switched run/crank input while both should be live. GM's 2025 engine and transmission control modules (25OBDG04B, 25OBDG03B and others) run this check once a battery is detected, run/crank is active and the starter is not engaged: a difference above 3 V in 40 of 50 samples fails it, in some ECM variants 50 of 63. The TCM entries are Type A and most ECM entries Type B, both with MIL; one 2025 ECM list (25OBDG04A) keeps it as Type C without MIL. GM bulletin 24-NA-124 shows a typical cause on 2020–2025 Silverado and Sierra 2500/3500: the ECM harness rubs through at the driver-side upper control arm bracket, giving U3023 with P2534, P0700 and others, a lit MIL, a stall or a no-start; the harness is repaired and tied away from the bracket."
    de: "Bei U3023 sieht ein Steuergerät deutlich verschiedene Spannungen an Dauerplus-Eingang A und geschaltetem Eingang Zündung/Start, obwohl beide anliegen sollten. GMs Motor- und Getriebesteuergeräte 2025 prüfen das bei erkannter Batterie, aktivem Zündungs-/Startsignal und ruhendem Anlasser: Über 3 V Differenz in 40 von 50 Messungen (teils 50 von 63) sind ein Fehler. Im Getriebesteuergerät ist der Code Typ A, im Motorsteuergerät meist Typ B, beide mit MIL; eine Liste von 2025 (25OBDG04A) führt ihn im Motorsteuergerät als Typ C ohne MIL. Laut GM-Bulletin 24-NA-124 scheuert bei Silverado und Sierra 2500/3500 (2020–2025) der Kabelbaum des Motorsteuergeräts am Halter des linken oberen Querlenkers durch; Folge: U3023 mit P2534, P0700 u. a., MIL, Absterben oder kein Start; der Kabelbaum wird repariert und neu befestigt."
  affected_components:
    - module_power_a
    - ignition_input
  common_causes:
    - id: harness_chafed
      likelihood: high
      label:
        en: Module harness chafed against a bracket, interrupting feed or ignition wire
        de: Kabelbaum des Steuergeräts am Halter durchgescheuert, Versorgungs- oder Zündleitung unterbrochen
    - id: ignition_relay_fuse
      likelihood: medium
      label:
        en: Faulty run/crank relay or fuse feeding the ignition input
        de: Defektes Zündungs-/Startrelais oder Sicherung des Zündungseingangs
    - id: battery_feed_resistance
      likelihood: medium
      label:
        en: Voltage drop on the battery feed from a loose terminal or corroded fuse
        de: Spannungsabfall am Batterieeingang durch lockere Klemme oder korrodierte Sicherung
    - id: module_internal
      likelihood: low
      label:
        en: Faulty voltage sensing inside the module
        de: Fehlerhafte Spannungserfassung im Steuergerät
  symptoms:
    - en: MIL on, often with several other codes from the same module
      de: MIL an, oft mit mehreren weiteren Codes desselben Steuergeräts
    - en: Engine stalls or does not start
      de: Motor geht aus oder springt nicht an
    - en: Transmission faults when the TCM stores it
      de: Getriebestörungen, wenn das Getriebesteuergerät ihn speichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 400]
    estimated_hours: [0.5, 3]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3024, U3006, U3018, U3501, U3010]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04B.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG03B.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04A.pdf
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-11005254-0001.pdf
