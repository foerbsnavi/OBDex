- code: U3521
  category: network
  title:
    en: High Voltage System Interlock Circuit F
    de: Hochvoltsystem Interlock-Stromkreis F
  description:
    en: "U3521 flags an unspecified fault in loop F, the sixth interlock loop. Extra loops often guard service openings rather than cables. FMVSS 305a defines the service disconnect as the device that switches the circuit off for checks and service and demands finger protection wherever it opens without tools; its interlock tells the controller when it is pulled. Covers can be watched without contacts too: GM patented an interlock switch built from a magnet and a reed relay that stays closed only while the magnet is near. No maker publishes which opening belongs to loop F. Check that the service plug is fully locked and that magnet covers sit correctly."
    de: "U3521 kennzeichnet einen nicht näher bestimmten Fehler an Kreis F, der sechsten Interlock-Schleife. Zusätzliche Schleifen bewachen oft Serviceöffnungen statt Kabel. FMVSS 305a definiert die Service-Trennstelle als Einrichtung, die den Kreis für Prüfung und Wartung abschaltet, und verlangt Fingerschutz überall dort, wo sie sich ohne Werkzeug öffnen lässt; ihr Interlock meldet, wenn sie gezogen ist. Deckel lassen sich auch berührungslos überwachen: GM hat einen Interlock-Schalter aus Reed-Relais und Magnet patentiert, der nur geschlossen bleibt, solange der Magnet nah ist. Welche Öffnung zu Kreis F gehört, veröffentlicht kein Hersteller. Prüfen, ob der Servicestecker verriegelt ist und Magnetdeckel richtig sitzen."
  affected_components:
    - hvil_loop_f
    - hv_connectors
  common_causes:
    - id: service_disconnect_not_locked
      likelihood: high
      label:
        en: Service disconnect not fully inserted or its lever not locked
        de: Service-Trennstelle nicht ganz gesteckt oder Hebel nicht verriegelt
    - id: cover_magnet_misplaced
      likelihood: medium
      label:
        en: Cover with interlock magnet missing, swapped or mounted out of position
        de: Deckel mit Interlock-Magnet fehlt, vertauscht oder versetzt montiert
    - id: reed_switch_failed
      likelihood: low
      label:
        en: Reed relay or switch contact of the cover interlock failed
        de: Reed-Relais bzw. Schaltkontakt der Deckelüberwachung defekt
