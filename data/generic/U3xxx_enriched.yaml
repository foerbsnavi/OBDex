- code: U356B
  category: network
  title:
    en: Anode Drain Valve
    de: Anoden-Ablassventil
  description:
    en: "U356B is about how the drain valve behaves, not its wiring. Hyundai shows how such faults are separated: if the level in the trap fails to drop within a set time after an open command while the position sensor still reports closed, the valve is judged stuck shut; the system then limits current, drains on a schedule derived from accumulated charge and runs the stack warmer so water leaves as vapour. If the level stays low after a close command and the sensor reports open, hydrogen could escape, so the system is shut down. A dead level sensor can mimic a jammed valve; another Hyundai patent forces the valve open and watches whether a sagging cell voltage recovers to tell the two apart. In winter frozen condensate is a likely cause. No public source cites U356B; expect a warning plus reduced power or a shutdown."
    de: "Hier zählt das Verhalten des Ablassventils, nicht die Verkabelung. Hyundai trennt die Fehlerbilder so: Sinkt der Wasserstand nach einem Öffnungsbefehl nicht rechtzeitig und meldet der Stellungsgeber weiter „zu“, gilt das Ventil als geschlossen hängend. Dann begrenzt das System den Strom, lässt nach einem aus der umgesetzten Ladung berechneten Takt ab und fährt den Stack wärmer, damit Wasser als Dampf abzieht. Bleibt der Pegel nach einem Schließbefehl niedrig und der Geber meldet „offen“, droht Wasserstoffaustritt – das System schaltet ab. Ein toter Füllstandsensor kann ein klemmendes Ventil vortäuschen; ein weiteres Hyundai-Patent öffnet dann zwangsweise und prüft, ob sich eine eingebrochene Zellspannung erholt. Im Winter liegt Eis nahe. U356B ist öffentlich nicht belegt; es folgen Warnung und Leistungsrücknahme oder Abschaltung."
  affected_components:
    - anode_drain_valve
  common_causes:
