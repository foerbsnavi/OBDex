- code: U3512
  category: network
  title:
    en: High Voltage System Interlock Circuit B Performance
    de: Hochvoltsystem Interlock-Stromkreis B Funktion
  description:
    en: "U3512 is stored when interlock loop B still conducts but behaves implausibly: its resistance drifts outside the permitted window, the returned signal does not follow the test pattern in time, or two readings of the same loop disagree. CATL's interlock patent explains why loops misreport: contact impedance between HV parts, supply fluctuations and static discharge can cause false alarms. Samsung SDI points out that different loops may have different detection and reaction times, so loop B can be judged by other rules than loop A. Oxidised pins, a connector not fully latched or a harness rubbing on the body are likely causes, as Mercedes lists for its interlock codes P0A0A00 to P0A0D00. No maker documents U3512 itself. The HV system may drop out repeatedly rather than stay off."
    de: "U3512 wird gespeichert, wenn Interlock-Schleife B zwar leitet, sich aber unplausibel verhält: Ihr Widerstand wandert aus dem zulässigen Fenster, das Rücksignal folgt dem Prüfmuster nicht rechtzeitig, oder zwei Messungen derselben Schleife widersprechen sich. Laut Interlock-Patent von CATL lösen Übergangswiderstände zwischen HV-Teilen, Versorgungsschwankungen und statische Entladungen Fehlalarme aus. Nach Samsung SDI können Schleifen unterschiedliche Erkennungs- und Reaktionszeiten haben; Kreis B gilt also womöglich anderen Regeln als Kreis A. Wahrscheinlich sind oxidierte Kontakte, ein halb eingerasteter Stecker oder ein scheuernder Kabelbaum – so nennt es Mercedes für P0A0A00 bis P0A0D00. U3512 selbst dokumentiert kein Hersteller. Das HV-System fällt eher wiederholt aus als dauerhaft."
  affected_components:
    - hvil_loop_b
  common_causes:
    - id: oxidised_interlock_pins
      likelihood: high
      label:
        en: Oxidised interlock pins raising the loop resistance
        de: Oxidierte Interlock-Kontakte erhöhen den Schleifenwiderstand
    - id: connector_partly_latched
      likelihood: medium
      label:
        en: Connector in loop B seated but not fully latched
        de: Stecker in Kreis B aufgesteckt, aber nicht vollständig verriegelt
    - id: harness_rubbing
      likelihood: medium
      label:
        en: Harness rubbing on the body with intermittent contact
        de: Kabelbaum scheuert an der Karosserie, Kontakt setzt zeitweise aus
    - id: electrical_interference
      likelihood: low
      label:
        en: Interference or supply ripple distorting the loop signal
        de: Störungen oder Welligkeit der Versorgung verfälschen das Schleifensignal
  symptoms:
    - en: HV system switches off and on again unexpectedly
      de: HV-System schaltet unerwartet ab und wieder zu
    - en: Ready mode lost while driving or at start
      de: Fahrbereitschaft geht beim Start oder während der Fahrt verloren
    - en: Interlock codes in several modules at once
      de: Interlock-Codes in mehreren Steuergeräten gleichzeitig
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 1500]
    estimated_hours: [1, 5]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
