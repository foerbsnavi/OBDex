- code: U354B
  category: network
  title:
    en: Hydrogen Tank A Temperature Sensor 2 Circuit
    de: Wasserstofftank A Temperatursensor 2 Stromkreis
  description:
    en: "U354B is the circuit code for the second temperature sensor in tank A. One probe cannot capture a long tank during a fast fill: in tests published in the HySafe journal, sensors in on-tank valves at both ends of a Type IV tank finished a fill around 30 °C apart, and the authors concluded that even two positions miss the hottest zone. A second sensor thus gives the controller a cross-check and a second view of the gas. Honda's 2019 dealer notice for the Clarity Fuel Cell describes the flip side: a false reading between two tank sensors kept the tank from being filled completely. No maker documents U354B publicly. With sensor 2 lost, expect a warning and cautious, perhaps incomplete fills; sensor 1 of the same tank is U354A."
    de: "U354B gilt dem Stromkreis des zweiten Temperatursensors in Tank A. Warum es ihn gibt: Ein einzelner Messpunkt erfasst einen langen Tank beim Schnellbetanken nicht. In im HySafe-Journal veröffentlichten Versuchen saßen Fühler in Tankventilen an beiden Enden eines Typ-IV-Tanks und lagen am Ende der Füllung rund 30 °C auseinander; selbst zwei Stellen, so die Autoren, treffen die heißeste Zone nicht. Der zweite Fühler liefert also Gegenprobe und zweite Sicht. Die Kehrseite beschreibt Hondas Händlerinformation von 2019 zum Clarity Fuel Cell: Ein falscher Unterschied zwischen zwei Tankfühlern verhinderte das vollständige Befüllen. U354B dokumentiert öffentlich kein Hersteller. Fällt Fühler 2 aus, folgen Warnung und vorsichtiges, eventuell unvollständiges Tanken; Fühler 1 dieses Tanks ist U354A."
  affected_components:
    - h2_tank_a_temp_sensor_2
    - sensor_wiring
  common_causes:
    - id: harness_connector
      likelihood: high
      label:
        en: Wiring or connector fault at the far tank end
        de: Leitungs- oder Steckerfehler am entfernten Tankende
    - id: sensor_failed
      likelihood: medium
      label:
        en: Second temperature sensor of tank A failed
        de: Zweiter Temperaturfühler von Tank A ausgefallen
    - id: evaluation_software
      likelihood: low
      label:
        en: Evaluation software misjudging the sensor pair
        de: Auswertesoftware beurteilt das Fühlerpaar falsch
  symptoms:
    - en: Tank cannot be filled completely
      de: Tank lässt sich nicht ganz füllen
    - en: Hydrogen system warning
      de: Warnung des Wasserstoffsystems
