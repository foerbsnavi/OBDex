        de: Signaleingang des auswertenden Steuergeräts defekt
  symptoms:
    - en: High-voltage consumer on loop J switching off intermittently
      de: Hochvoltverbraucher an Kreis J schaltet zeitweise ab
    - en: Fault more frequent on rough roads or after work on covers
      de: Fehler häufiger auf schlechter Straße oder nach Arbeiten an Deckeln
    - en: High-voltage system warning that comes and goes
      de: Kommende und gehende Warnmeldung zum Hochvoltsystem
