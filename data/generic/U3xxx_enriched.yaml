- code: U3576
  category: network
  title:
    en: Stack Differential Pressure Sensor Circuit
    de: Stack-Differenzdrucksensor Stromkreis
  description:
    en: "U3576 is set when the stack differential pressure sensor delivers no signal, a shorted one or one outside its valid range. The title leaves open which two pressures it compares. In a GM patent such a sensor is plumbed between anode and cathode side, as the anode is normally kept slightly above the cathode. GM also uses it ahead of start-up, with the cathode still at ambient pressure, to verify the anode pressure sensor: ambient plus differential reading should match the anode value. Ford keeps the difference across the membrane within a tolerance of around 600 mbar, may shut the system down when it is breached and heats such sensors so that ice cannot blind them. No maker documents U3576 publicly. Expect a warning, reduced power or no start; anode inlet pressure is U3566/U3567."
    de: "U3576 steht für einen gestörten Signalkreis am Differenzdrucksensor des Stacks: Ausfall, Kurzschluss oder unzulässiger Wert. Welche beiden Drücke er vergleicht, lässt der Titel offen. In einem GM-Patent sitzt ein solcher Sensor zwischen Anoden- und Kathodenseite, weil die Anode üblicherweise etwas über dem Kathodendruck läuft. GM nutzt ihn zudem vor dem Start, solange die Kathode noch Umgebungsdruck hat, zur Kontrolle des Anodendrucksensors: Umgebungsdruck plus Differenz muss dessen Wert ergeben. Ford hält den Druckunterschied über der Membran in einer Toleranz von etwa 600 mbar, schaltet bei Überschreitung gegebenenfalls ab und beheizt solche Sensoren, damit Eis sie nicht lahmlegt. Öffentlich belegt ist U3576 bei keinem Hersteller. Folgen: Warnung, weniger Leistung oder kein Start; den Anodeneintrittsdruck melden U3566/U3567."
  affected_components:
    - stack_differential_pressure_sensor
    - sensor_wiring
  common_causes:
    - id: sensor_connector_wiring
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of the differential pressure sensor
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker des Differenzdrucksensors
    - id: sensor_frozen_or_wet
      likelihood: medium
      label:
        en: Water or ice in the sensor ports or a failed sensor heater
        de: Wasser oder Eis in den Sensoranschlüssen oder ausgefallene Sensorheizung
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Differential pressure sensor faulty internally
        de: Differenzdrucksensor intern defekt
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Reduced power or fuel cell system shuts down
      de: Weniger Leistung oder Abschalten des Brennstoffzellensystems
    - en: No start, especially after a cold night
      de: Kein Start, vor allem nach einer kalten Nacht
