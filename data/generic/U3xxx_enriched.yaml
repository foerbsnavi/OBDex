- code: U356C
  category: network
  title:
    en: Anode Header Drain Valve Control Circuit
    de: Anoden-Sammler-Ablassventil Steuerkreis
  description:
    en: "U356C covers the drive circuit of a second drain valve mounted directly on the anode exhaust header, the channel inside the stack that gathers the gas leaving every cell. GM lists three valves behind the stack: a bleed valve at the top of the anode sump, a drain valve at its bottom and this header valve, which empties into the cathode exhaust. Condensate pooling in the outlet header harms cell durability, above all when the car stands on a steep slope, and GM has also patented heating of these manifolds against ice. Older logic opened the header valve only at shutdown or on a tilt sensor signal; GM's newer scheme lets it serve a share of bleed requests, by default the fifth. If the drive is open or shorted, the water stays put. No maker documents U356C publicly; a warning and limited operation are likely. The sump drain circuit is U356A."
    de: "U356C betrifft den Ansteuerkreis eines zweiten Ablassventils direkt am Anoden-Austrittssammler, dem Kanal im Stack, in dem das Gas aller Zellen zusammenläuft. GM nennt hinter dem Stack drei Ventile: ein Spülventil oben am Anodensumpf, ein Ablassventil an dessen Boden und dieses Sammlerventil, das ins Kathodenabgas entleert. Kondensat im Sammler schadet der Lebensdauer der Zellen, vor allem am steilen Hang; gegen Eis in diesen Kanälen hat GM zudem eine Beheizung patentiert. Früher öffnete das Sammlerventil nur beim Abstellen oder auf ein Neigungssignal, in der neueren GM-Logik übernimmt es einen Teil der Spülanforderungen, standardmäßig jede fünfte. Ist der Antrieb unterbrochen oder kurzgeschlossen, bleibt Wasser stehen. U356C hat keinen öffentlichen Beleg; Warnung und Drosselung sind wahrscheinlich. Den Sumpf-Ablasskreis meldet U356A."
