- code: U3561
  category: network
  title:
    en: Cathode Bypass Valve Control Circuit
    de: Kathoden-Bypassventil Steuerkreis
  description:
    en: "U3561 points to a break, a short or an output stage fault in the actuator circuit of the cathode bypass valve. This valve lets part of the compressor delivery skip the stack and flow straight into the exhaust. Nissan gives two reasons: keeping the compressor clear of surge when the stack needs little air, and putting enough air into the exhaust to dilute the hydrogen released when the anode is purged. Because opening the bypass lowers stack pressure, Nissan closes the pressure control valve a little further at the same moment. Toyota uses a three-way valve that can send the entire flow into the bypass when air pressure has to be dumped. No public maker document lists U3561. If the valve cannot be driven, a fuel cell warning is likely, along with limited power and possibly no start. Its mechanical behaviour is judged under U3562."
    de: "Hier geht es um den elektrischen Ansteuerkreis des Kathoden-Bypassventils – Unterbrechung, Kurzschluss oder ein Fehler der Endstufe. Das Ventil schickt einen Teil der Verdichterluft am Stack vorbei direkt in den Abgasstrang. Nissan nennt dafür zwei Gründe: Der Verdichter soll bei geringem Luftbedarf des Stacks nicht in die Pumpgrenze geraten, und beim Spülen der Anode muss genug Luft im Abgas sein, um den austretenden Wasserstoff zu verdünnen. Weil der Stackdruck beim Öffnen des Bypasses sinkt, schließt Nissan zugleich das Druckregelventil etwas weiter. Toyota setzt ein Dreiwegeventil ein, das im Notfall die gesamte Luft in den Bypass lenkt. U3561 findet sich in keiner öffentlichen Herstellerunterlage. Folgen: Warnmeldung, gedrosselte Leistung, unter Umständen kein Start. Die mechanische Funktion bewertet U3562."
  affected_components:
    - cathode_bypass_valve
    - valve_wiring
  common_causes:
