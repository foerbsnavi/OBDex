    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U3010
  category: network
  title:
    en: Ignition Input Start
    de: Zündungseingang Start
  description:
    en: "U3010 concerns the start or crank request input, which should be active only while the key or button is held in Start. A module sets it when it sees a start signal outside a valid crank event, or misses one although the network reports crank. In GM's 2012 truck wiring manual the start position is the only one in which the run/crank line is active while the accessory line is off, so the start state is recognised from a combination of lines that must change together. No manufacturer documents U3010 publicly. The moment of transition is delicate: Ram found that the 2025 heavy-duty LED headlamp modules flag the run-to-start change as invalid (U300A-29) and treat it as harmless if stored only, which shows that a code logged exactly at cranking can be a software artefact rather than a wiring fault."
    de: "U3010 betrifft den Start- bzw. Anlasseingang, der nur aktiv sein soll, solange Schlüssel oder Taster auf Start stehen. Ein Steuergerät setzt den Code, wenn es ein Startsignal außerhalb eines gültigen Anlassvorgangs sieht oder es fehlt, obwohl das Netz „Anlassen“ meldet. Im Schaltplanhandbuch der GM-Pickups 2012 ist Start die einzige Stellung, in der die Run/Crank-Leitung aktiv und die Zubehörleitung aus ist; der Startzustand ergibt sich also aus mehreren Leitungen, die gemeinsam wechseln müssen. Kein Hersteller dokumentiert U3010 öffentlich. Heikel ist der Übergang: Ram stellte fest, dass die LED-Scheinwerfermodule der Heavy-Duty-Modelle 2025 den Wechsel von Run auf Start als ungültig melden (U300A-29) was nur gespeichert als harmlos gilt – ein genau beim Anlassen eingetragener Code kann also ein Softwareeffekt sein."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: start_contact_worn
      likelihood: medium
      label:
        en: Worn start contact or push-button in the ignition switch
        de: Verschlissener Startkontakt oder Starttaster im Zündschalter
    - id: start_wire_short_open
      likelihood: medium
      label:
        en: Start request wire open or shorted to voltage
        de: Startanforderungsleitung unterbrochen oder mit Spannung kurzgeschlossen
    - id: module_software_transition
      likelihood: medium
      label:
        en: Module software misreading the run-to-start transition
        de: Steuergeräte-Software wertet den Übergang von Run auf Start falsch
    - id: low_voltage_cranking
      likelihood: low
      label:
        en: Supply dip during cranking upsetting the input reading
        de: Spannungseinbruch beim Anlassen verfälscht das Eingangssignal
  symptoms:
    - en: Engine does not crank or cranks with a delay
      de: Motor dreht nicht oder erst verzögert durch
    - en: Code stored at each start with no further complaint
      de: Code bei jedem Start gespeichert, ohne weitere Beanstandung
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [0, 500]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300D, U300A, U300E, P2533, P0615]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11018277-0001.pdf
  reviewed: '2026-11-06'

- code: U3011
  category: network
  title:
    en: Ignition Input Off
    de: Zündungseingang Aus
  description:
    en: "U3011 relates to the input that tells a module the ignition is off, for instance a key-in or off-state line. The code is set when that input reports off while the network says the car is running, or fails to report off when every other source does. This matters because modules plan their shutdown around it: Ford's patent US5945745A describes control modules that run fully while an ignition detector sees the ignition and drop into a low-current sleep once the signal disappears. A false off can therefore cut functions while driving, and a missing off can keep modules awake and draw the battery down. GM's 2012 truck wiring manual likewise lets the body controller sleep only with the switch off and the key out. No manufacturer documents U3011 publicly."
    de: "U3011 betrifft den Eingang, der einem Steuergerät meldet, dass die Zündung aus ist, etwa eine Leitung für „Schlüssel steckt“ oder den Aus-Zustand. Der Code fällt, wenn dieser Eingang Aus meldet, während das Netz von laufendem Fahrzeug spricht, oder wenn er Aus nicht meldet, obwohl alle übrigen Quellen es tun. Das ist wichtig, weil Steuergeräte ihr Abschalten danach ausrichten: Fords Patent US5945745A beschreibt Geräte, die voll arbeiten, solange ein Zündungsdetektor die Zündung erkennt, und in einen stromsparenden Schlaf wechseln, sobald das Signal fehlt. Ein falsches Aus kann also Funktionen während der Fahrt abschalten, ein fehlendes Aus hält Geräte wach und belastet die Batterie. Auch bei GMs Pickups 2012 schläft das Karosseriesteuergerät nur bei Schalter aus und abgezogenem Schlüssel. Kein Hersteller dokumentiert U3011 öffentlich."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: key_in_switch_fault
      likelihood: medium
      label:
        en: Faulty key-in or off-position contact in the switch
        de: Defekter Kontakt für „Schlüssel steckt“ oder die Aus-Stellung im Schalter
    - id: input_wire_open_short
      likelihood: medium
      label:
        en: Off-state input wire open or shorted
        de: Eingangsleitung für den Aus-Zustand unterbrochen oder kurzgeschlossen
    - id: power_mode_master_fault
      likelihood: low
      label:
        en: Body control module reporting a wrong power mode
        de: Karosseriesteuergerät meldet einen falschen Betriebszustand
    - id: module_input_fault
      likelihood: low
      label:
        en: Faulty input stage in the reading module
        de: Defekte Eingangsstufe im auswertenden Steuergerät
  symptoms:
    - en: Modules not going to sleep, battery drained after parking
      de: Steuergeräte schlafen nicht ein, Batterie nach dem Abstellen leer
    - en: Functions switching off briefly while driving
      de: Funktionen schalten während der Fahrt kurz ab
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
