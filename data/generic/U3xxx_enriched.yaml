- code: U3004
  category: network
  title:
    en: Accessory Power Relay
    de: Zubehörrelais
  description:
    en: "U3004 concerns the relay, or electronic switch, that feeds the accessory (ACC) circuits once the car is in accessory or run mode. On GM trucks the body module reads the ignition inputs, decides the power mode and energises the matching relays itself. Mazda documents the code in the start stop unit as U3004:17, an ACC relay line above its threshold. Its bulletin SA-023-23 for the 2017–2022 CX-5 traces it to drink spilled near the front cupholder, which corrodes connector C-16: the ignition then cannot be switched off, infotainment stays on and the battery runs flat. Mazda's MT-001/21 lists the same entry among faults caused by aftermarket dongles plugged into the diagnostic connector. The stuck accessory feed matters more to the driver than the code; no MIL."
    de: "U3004 betrifft das Relais oder den elektronischen Schalter, der die Zubehörkreise (ACC) versorgt, sobald das Fahrzeug in Zubehör- oder Fahrstellung ist. Bei GM-Pick-ups liest das Bordnetzsteuergerät die Zündeingänge, legt den Betriebszustand fest und zieht die passenden Relais selbst an. Mazda dokumentiert den Code in der Start-Stopp-Einheit als U3004:17, ACC-Relaiskreis über Schwelle. Das Bulletin SA-023-23 für den CX-5 2017–2022 führt ihn auf Getränke zurück, die am vorderen Becherhalter verschüttet wurden und Stecker C-16 korrodieren lassen: Die Zündung lässt sich dann nicht ausschalten, das Infotainment bleibt an, die Batterie wird leer. In MT-001/21 nennt Mazda denselben Eintrag unter Folgen nachgerüsteter Stecker in der Diagnosebuchse. Für den Fahrer zählt die hängende Zubehörversorgung; eine MIL gibt es nicht."
  affected_components:
    - accessory_power_relay
    - relay_wiring
  common_causes:
    - id: liquid_corrosion
      likelihood: high
      label:
        en: Spilled liquid corroding a connector in the relay control or feed circuit
        de: Verschüttete Flüssigkeit korrodiert einen Stecker im Relais-Steuer- oder Versorgungskreis
    - id: aftermarket_device
      likelihood: medium
      label:
        en: Aftermarket device on the diagnostic socket or accessory circuit feeding back voltage
        de: Nachgerüstetes Gerät an Diagnosebuchse oder Zubehörkreis speist Spannung zurück
    - id: relay_fault
      likelihood: medium
      label:
        en: Accessory relay sticking or its coil damaged
        de: Zubehörrelais klebt oder Spule beschädigt
    - id: control_module_fault
      likelihood: low
      label:
        en: Fault in the module that drives the relay
        de: Fehler im Steuergerät, das das Relais ansteuert
  symptoms:
    - en: Ignition or accessory mode cannot be switched off, radio stays on
      de: Zündung oder Zubehörmodus lässt sich nicht ausschalten, Radio bleibt an
    - en: Flat battery and no-start after the car has stood
      de: Leere Batterie und kein Start nach Standzeit
    - en: Accessory functions dead in accessory mode
      de: Zubehörfunktionen in Zubehörstellung ohne Funktion
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 400]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
