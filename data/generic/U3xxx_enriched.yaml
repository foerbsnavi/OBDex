- code: U3550
  category: network
  title:
    en: Hydrogen Tank A Valve Control Circuit
    de: Wasserstofftank A Ventil Steuerkreis
  description:
    en: "U3550 indicates an electrical fault in the control circuit of the solenoid valve on hydrogen tank A. This on-tank valve is the primary closure between tank and fuel system, and FMVSS 308 requires it to default to closed when unpowered. Toyota's FCHV guide lists when the controller shuts the valves of all tanks: vehicle off, abnormal pressure loss or rise, airbag or fuel cell crash sensors, a hydrogen sensor alarm, hood or fuel door opened, or a malfunction of a shut valve. An open coil, a short or a failed driver stage thus leaves tank A closed. No manufacturer documents U3550 publicly. With several tanks the others may keep the car moving with less range; the enable path is U3551, the mechanical function U3552."
    de: "U3550 zeigt einen elektrischen Fehler im Ansteuerkreis des Magnetventils an Wasserstofftank A. Dieses Tankventil ist der erste Verschluss zwischen Behälter und Kraftstoffsystem; FMVSS 308 verlangt, dass es ohne Strom geschlossen bleibt. Wann das Steuergerät die Ventile aller Tanks schließt, zählt Toyotas FCHV-Leitfaden auf: Fahrzeug aus, ungewöhnlicher Druckabfall oder -anstieg, Airbag- oder Brennstoffzellen-Crashsensoren, Alarm eines Wasserstoffsensors, geöffnete Motorhaube oder Tankklappe sowie eine Störung an einem Absperrventil. Offene Spule, Kurzschluss oder defekte Endstufe lassen Tank A daher zu. U3550 dokumentiert öffentlich kein Hersteller. Bei mehreren Tanks fährt das Auto womöglich mit den übrigen weiter, nur kürzer; der Freigabepfad ist U3551, die mechanische Funktion U3552."
  affected_components:
    - h2_tank_a_valve
    - valve_wiring
  common_causes:
    - id: coil_open_or_shorted
      likelihood: medium
      label:
        en: Solenoid coil of the tank A valve open or shorted
        de: Magnetspule des Ventils an Tank A unterbrochen oder kurzgeschlossen
    - id: harness_connector
      likelihood: high
      label:
        en: Wiring or connector fault between controller and valve
        de: Leitungs- oder Steckerfehler zwischen Steuergerät und Ventil
    - id: driver_stage
      likelihood: low
      label:
        en: Valve driver stage in the storage control unit faulty
        de: Ventil-Endstufe im Speichersteuergerät defekt
