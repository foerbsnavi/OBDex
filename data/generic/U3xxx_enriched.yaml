- code: U3519
  category: network
  title:
    en: High Voltage System Interlock Circuit D
    de: Hochvoltsystem Interlock-Stromkreis D
  description:
    en: "U3519 marks a fault on the fourth interlock loop of the high-voltage system, circuit D, that the module does not classify further. A fourth independent loop mainly makes sense where one vehicle carries several battery packs. Caterpillar explains why for battery-powered mining, building and farm machines: with only one loop, charging or servicing a single pack would cut off all of them, so each battery group is watched on its own and the charging port gets yet another loop. No manufacturer publishes which parts belong to loop D. The contactors guarded by it open, and the branch behind them stays unavailable."
    de: "U3519 meldet einen Fehler an der vierten Hochvolt-Interlock-Schleife, Kreis D, den das Steuergerät nicht weiter eingrenzt. Eine vierte unabhängige Schleife ergibt vor allem dort Sinn, wo ein Fahrzeug mehrere Akkupakete trägt. Caterpillar begründet das für batterieelektrische Bau-, Bergbau- und Landmaschinen: Gäbe es nur eine Schleife, würde das Laden oder Warten eines einzelnen Pakets alle übrigen mit abtrennen; also wird jede Batteriegruppe für sich überwacht, und der Ladeanschluss bekommt noch einen Kreis. Welche Teile zu Kreis D gehören, veröffentlicht kein Hersteller. Die von ihm bewachten Schütze öffnen, der Zweig dahinter fällt aus."
  affected_components:
    - hvil_loop_d
    - hv_connectors
  common_causes:
    - id: pack_disconnect_left_open
      likelihood: high
      label:
        en: Disconnect of the battery group on loop D left open or not locked after charging or service
        de: Trennstelle der Batteriegruppe an Kreis D nach Laden oder Wartung offen oder nicht verriegelt
    - id: loop_d_connector_unlatched
      likelihood: medium
      label:
        en: Connector in loop D not fully latched
        de: Stecker in Kreis D nicht vollständig eingerastet
    - id: loop_d_harness_damage
      likelihood: medium
      label:
        en: Loop D wiring damaged between packs or distribution units
        de: Leitung von Kreis D zwischen Paketen oder Verteilereinheiten beschädigt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller that drives and reads loop D faulty
        de: Steuergerät, das Kreis D speist und auswertet, defekt
  symptoms:
    - en: One battery pack or high-voltage branch not available
      de: Ein Akkupaket bzw. ein Hochvoltzweig steht nicht zur Verfügung
    - en: Reduced range or power, or no ready mode at all, depending on design
      de: Je nach Auslegung weniger Reichweite oder Leistung oder gar keine Fahrbereitschaft
    - en: High-voltage system warning in the instrument cluster
      de: Warnmeldung zum Hochvoltsystem im Kombiinstrument
  repair:
