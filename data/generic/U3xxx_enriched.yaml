- code: U3534
  category: network
  title:
    en: High Voltage System Interlock Circuit K High
    de: Hochvoltsystem Interlock-Stromkreis K hoch
  description:
    en: U3534 reports loop K above its upper threshold. Besides a loop wire chafed onto a 12 V feed, the timing of the electronics can be behind it. In the Texas Instruments reference design TIDA-020069 a 10 mA constant current feeds the loop, and that source can be disabled to save power or to hold the loop in a deliberate fault state until the other systems are ready. Its current then shrinks to one hundredth, and send and return voltages look like a short to battery. If software reads loop K before enabling the source, or the enable line hangs, a high result appears although the wiring is sound. No maker documents U3534. Rule out foreign voltage first, then ask about controller software updates.
    de: U3534 meldet Schleife K über ihrer oberen Schwelle. Neben einer an eine 12-V-Versorgung gescheuerten Leitung kann auch das Timing der Elektronik dahinterstecken. Im Referenzdesign TIDA-020069 von Texas Instruments speist ein Konstantstrom von 10 mA die Schleife, und diese Quelle lässt sich abschalten, um Strom zu sparen oder die Schleife bewusst im Fehlerzustand zu halten, bis die übrigen Systeme bereit sind. Ihr Strom sinkt dann auf ein Hundertstel, und Sende- und Rückspannung sehen aus wie ein Schluss nach Batterieplus. Liest die Software Kreis K, bevor die Quelle freigegeben ist, oder hängt die Freigabeleitung, entsteht ein Hoch-Befund bei intakter Verkabelung. U3534 dokumentiert kein Hersteller. Erst Fremdspannung ausschließen, dann nach Software-Updates für das Steuergerät fragen.
  affected_components:
    - hvil_loop_k
    - hvil_wiring
  common_causes:
    - id: loop_k_short_to_12v
      likelihood: high
      label:
        en: Loop K wire in contact with a 12 V supply
        de: Leitung von Kreis K mit Kontakt zu einer 12-V-Versorgung
    - id: source_not_enabled
      likelihood: medium
      label:
        en: Loop source still disabled when the controller evaluates loop K
        de: Schleifenquelle noch abgeschaltet, wenn das Steuergerät Kreis K auswertet
    - id: controller_software
      likelihood: low
      label:
        en: Controller software with faulty start-up sequence
        de: Steuergeräte-Software mit fehlerhafter Startreihenfolge
  symptoms:
    - en: Vehicle does not become ready
      de: Fahrzeug wird nicht fahrbereit
    - en: Fault may appear right at switch-on although no wiring damage is found
      de: Fehler womöglich direkt beim Einschalten, obwohl kein Leitungsschaden zu finden ist
  repair:
