- code: U3543
  category: network
  title:
    en: High Voltage System Interlock Circuit O Low
    de: Hochvoltsystem Interlock-Stromkreis O niedrig
  description:
    en: "With U3543, loop O has dropped under its minimum. Some plug designs let the fitter see the reason. An LG Electronics patent describes a high-voltage connector closed by turning a cover housing: the rotation moves an inner cap up or down so that the power terminals mate first and the shorter interlock tab last, while a scale on the plug housing shows how far the cover has turned. A cover left short of its end stop keeps the power pins engaged with the interlock still apart, exactly the picture of a low reading. No maker documents U3543. Turn each rotary plug on loop O fully home and check the scale."
    de: "U3543 zeigt an, dass Kreis O unter seiner unteren Grenze liegt. Manche Steckerbauarten machen den Grund von außen sichtbar. Ein Patent von LG Electronics beschreibt einen Hochvoltstecker, der durch Drehen eines Deckelgehäuses geschlossen wird: Die Drehung hebt oder senkt eine innere Kappe, sodass erst die Leistungskontakte und zuletzt die kürzere Interlock-Lasche Verbindung bekommen; eine Skala auf dem Steckergehäuse zeigt, wie weit der Deckel gedreht ist. Bleibt der Deckel vor seinem Endanschlag stehen, stecken die Leistungskontakte schon, die Interlock-Verbindung aber noch nicht – genau das Bild eines zu niedrigen Werts. U3543 dokumentiert kein Hersteller. Jeden Drehstecker an Kreis O ganz zudrehen und die Skala kontrollieren."
  affected_components:
    - hvil_loop_o
    - hvil_wiring
  common_causes:
    - id: rotary_plug_not_fully_turned
      likelihood: high
      label:
        en: Rotary HV plug on loop O not turned to its end position
        de: Hochvolt-Drehstecker an Kreis O nicht bis zur Endstellung gedreht
    - id: interlock_tab_damaged
      likelihood: medium
      label:
        en: Interlock tab or socket in a loop O plug bent or pushed back
        de: Interlock-Lasche oder -Buchse in einem Stecker von Kreis O verbogen oder zurückgeschoben
    - id: loop_o_short_to_ground
      likelihood: medium
      label:
        en: Loop O wire shorted to ground
        de: Leitung von Kreis O mit Masseschluss
  symptoms:
    - en: High voltage stays off after work on HV plugs
      de: Hochvolt bleibt nach Arbeiten an Hochvoltsteckern aus
    - en: No ready mode
      de: Keine Fahrbereitschaft
    - en: Charging not possible
      de: Laden nicht möglich
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [60, 1200]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
