- code: U3033
  category: network
  title:
    en: Control Module Security Certificate Missing/Invalid
    de: Steuergerät Sicherheitszertifikat fehlt/ungültig
  description:
    en: U3033 reports that a module's own security certificate is absent or fails validation, so the unit cannot prove its identity in signed or encrypted exchanges. Stellantis uses the code in the security gateway (SGW) and in connected radios. For 2020 Durango and Pacifica radios, case S2008000164 explains that the certificate is fetched once the car is online and that a stored entry may need as many as 40 key cycles before it disappears; no part is to be replaced. Later bulletins for Ram, Jeep Wagoneer, Grand Cherokee and Dodge Charger (08-322-25, 08-173-26, 9100701) name U3033-00/-01 in the SGW, state that it leaves the MIL off and fix it by reflashing the SGW when the over-the-air update failed. Bulletin 9100386 adds checks of connectivity and the Ethernet network and reloading the certificate store.
    de: "U3033 meldet, dass das eigene Sicherheitszertifikat eines Steuergeräts fehlt oder die Prüfung nicht besteht; bei signierter oder verschlüsselter Kommunikation kann sich das Gerät dann nicht ausweisen. Stellantis setzt den Code im Sicherheits-Gateway (SGW) und in vernetzten Radios ein. Zu Radios in Durango und Pacifica 2020 erklärt Fall S2008000164: Das Zertifikat kommt, sobald das Auto online ist, ein gespeicherter Eintrag braucht bis zu 40 Zündzyklen zum Erlöschen, Teiletausch ist unnötig. Spätere Bulletins für Ram, Jeep Wagoneer, Grand Cherokee und Dodge Charger (08-322-25, 08-173-26, 9100701) nennen U3033-00/-01 im SGW, ohne MIL, und beheben ihn durch Neuprogrammieren des SGW, wenn das Update per Funk scheiterte. 9100386 ergänzt Prüfung von Verbindung und Ethernet-Netz sowie Neuladen des Zertifikatspeichers."
  affected_components:
    - control_module
    - security_module
    - gateway_module
  common_causes:
    - id: certificate_not_yet_provisioned
      likelihood: high
      label:
        en: Certificate not yet downloaded because the vehicle had no connectivity
        de: Zertifikat noch nicht geladen, weil das Fahrzeug keine Verbindung hatte
    - id: gateway_software
      likelihood: high
      label:
        en: Gateway software setting the code erroneously, fixed by reflash
        de: Gateway-Software setzt den Code fälschlich, Abhilfe durch Neuprogrammierung
    - id: failed_ota_update
      likelihood: medium
      label:
        en: Over-the-air update not completed
        de: Update per Funk nicht abgeschlossen
    - id: certificate_store_corrupt
      likelihood: low
      label:
        en: Certificate store empty or holding a wrong certificate
        de: Zertifikatspeicher leer oder mit falschem Zertifikat
  symptoms:
    - en: Code active or stored and cannot be cleared, usually without MIL
      de: Code aktiv oder gespeichert und nicht löschbar, meist ohne MIL
    - en: Security gateway not answering the diagnostic tester
      de: Sicherheits-Gateway antwortet dem Diagnosegerät nicht
    - en: Message asking for an over-the-air update or a service visit
      de: Hinweis auf ein Update per Funk oder einen Werkstattbesuch
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [0, 250]
    estimated_hours: [0.2, 1.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3034, U3035, U3036]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2020/MC-10183046-9999.pdf
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-11004342-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11023594-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11024610-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11031667-0001.pdf
  reviewed: '2026-11-06'

- code: U3034
  category: network
  title:
    en: Communication Authentication Key/Certificate Missing/Invalid
    de: Kommunikation Authentifizierungsschlüssel/-zertifikat fehlt/ungültig
  description:
    en: "U3034 concerns the secret keys or certificates that modules use to authenticate messages to each other: the module finds that key material missing or not matching its partners. Ford's TRON (Trusted Real-Time Operation Network) on 2023–2025 models from F-150 to Mustang Mach-E shows the usual trigger. If a TRON module is replaced and fresh keys are not distributed, the gateway and the other TRON modules can log U3034 together with U3035, U3036 and U211A–U211C; SSM 53638 and 53759 call for the TRON Module Authentication routine, started from the gateway in Ford's diagnostic software. Volkswagen's bulletin 01-24-02 lists U303400 as a sporadic, irrelevant entry in the brake electronics of 2024 ID.4 with one gateway software level. No MIL is documented; the cause is setup or software far more often than hardware."
    de: "U3034 betrifft die geheimen Schlüssel oder Zertifikate, mit denen Steuergeräte ihre Botschaften gegenseitig absichern: Das Gerät findet dieses Material nicht oder es passt nicht zu den Partnern. Fords TRON-Verbund (Trusted Real-Time Operation Network) (Modelle 2023–2025 vom F-150 bis zum Mustang Mach-E) zeigt den häufigsten Auslöser. Wird ein TRON-Steuergerät ersetzt und kein neuer Schlüsselsatz verteilt, können Gateway und übrige TRON-Geräte U3034 neben U3035, U3036 und U211A–U211C ablegen; SSM 53638 und 53759 verlangen die Routine TRON Module Authentication, gestartet im Gateway-Bereich der Ford-Diagnosesoftware. VWs Bulletin 01-24-02 führt U303400 als sporadischen, belanglosen Eintrag im Bremsensteuergerät des ID.4 2024 mit einem bestimmten Gateway-Softwarestand. Eine MIL ist nicht belegt; meist liegt es an Einrichtung oder Software."
  affected_components:
    - control_module
    - security_module
    - gateway_module
  common_causes:
    - id: keys_not_distributed_after_replacement
      likelihood: high
      label:
        en: Module replaced without running the key distribution routine
        de: Steuergerät ersetzt, ohne die Schlüsselverteilung auszuführen
    - id: gateway_software
      likelihood: medium
      label:
        en: Gateway software logging the code without real fault
        de: Gateway-Software legt den Code ohne echten Fehler ab
    - id: module_not_responding
      likelihood: medium
      label:
        en: Partner module offline during key exchange
        de: Partnergerät beim Schlüsselaustausch nicht erreichbar
    - id: secure_storage_fault
      likelihood: low
      label:
        en: Key storage in the module damaged
        de: Schlüsselspeicher im Steuergerät beschädigt
  symptoms:
    - en: Code appears in several modules at once after a repair
      de: Code erscheint nach einer Reparatur in mehreren Steuergeräten zugleich
    - en: Functions relying on secured messages unavailable or degraded
      de: Funktionen mit abgesicherten Botschaften fallen aus oder sind eingeschränkt
    - en: Often no noticeable symptom, sporadic entry only
      de: Oft ohne spürbare Folge, nur sporadischer Eintrag
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [0, 300]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3033, U3035, U3036]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11017064-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11018238-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-10252428-0001.pdf
    - https://www.autosar.org/fileadmin/standards/R22-11/FO/AUTOSAR_PRS_SecOcProtocol.pdf
  reviewed: '2026-11-06'

- code: U3035
  category: network
  title:
    en: Communication Authentication Signal Invalid Data
    de: Kommunikation Authentifizierungssignal ungültige Daten
  description:
    en: U3035 means a secured message arrived but its authentication part did not check out, so the receiver treats the content as invalid. In AUTOSAR Secure Onboard Communication the receiver recomputes the message authentication code over data ID, payload and freshness value; a mismatch or an unusable key counts as failed verification and the message is dropped. Ford's SSM 51497 for 2023 Super Duty says the PCM sets U3035 when authentication fails after key initialization, harmless without other codes, MIL or drivability issues; TSB 23-2421 reflashes the 6.8L/7.3L PCM when the MIL is on with P061B, U0140 and U3035/U3036. Audi's TSB 2077740 ties U303500 with U029400 and U012900 to Q6 e-tron that cannot select a gear in cold weather. Ford TRON module replacement without new keys also causes it.
    de: "U3035 heißt: Eine abgesicherte Botschaft kam an, doch ihr Authentifizierungsteil hielt der Prüfung nicht stand, und der Empfänger verwirft den Inhalt als ungültig. Bei AUTOSAR Secure Onboard Communication berechnet der Empfänger den Prüfcode aus Kennung, Nutzdaten und Frischewert neu; weicht er ab oder ist der Schlüssel unbrauchbar, gilt die Prüfung als gescheitert. Fords SSM 51497 zum Super Duty 2023: Das PCM setzt U3035 bei gescheiterter Authentifizierung nach der Schlüsselinitialisierung; ohne weitere Codes, MIL oder Fahrprobleme belanglos. TSB 23-2421 programmiert das PCM der 6,8-/7,3-l-Motoren neu, wenn die MIL mit P061B, U0140 und U3035/U3036 leuchtet. Audis TSB 2077740 verknüpft U303500 mit U029400 und U012900 beim Q6 e-tron, der bei Kälte keinen Gang einlegt. Auch ein Ford-TRON-Tausch ohne neue Schlüssel löst ihn aus."
  affected_components:
    - can_bus
    - security_module
  common_causes:
    - id: control_module_software
      likelihood: high
      label:
        en: Module software rejecting valid messages, fixed by update
        de: Steuergeräte-Software lehnt gültige Botschaften ab, Abhilfe per Update
    - id: keys_not_aligned
      likelihood: medium
      label:
        en: Keys not aligned after a module replacement
        de: Schlüssel nach Steuergerätetausch nicht abgeglichen
    - id: startup_timing
      likelihood: medium
      label:
        en: Messages checked before key initialization or wake-up finished
        de: Botschaften geprüft, bevor Schlüsselinitialisierung oder Aufwecken fertig war
    - id: bus_disturbance
      likelihood: low
      label:
        en: Corrupted frames from wiring or bus faults
        de: Verfälschte Botschaften durch Leitungs- oder Busfehler
  symptoms:
    - en: Code found during a self-test without complaints
      de: Code beim Selbsttest ohne Beanstandung gefunden
    - en: MIL with further network or processor codes on some engines
      de: MIL zusammen mit weiteren Netzwerk- oder Prozessorcodes bei einzelnen Motoren
    - en: Function refused, e.g. gear selection not possible in the cold
      de: Funktion verweigert, etwa keine Gangwahl bei Kälte
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [0, 300]
    estimated_hours: [0.3, 2]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3036, U3034, U3033, P061B, U0140]
  sources:
    - https://www.autosar.org/fileadmin/standards/R22-11/FO/AUTOSAR_PRS_SecOcProtocol.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10233883-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10248365-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11017662-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11017064-0001.pdf
  reviewed: '2026-11-06'

- code: U3036
  category: network
  title:
    en: Communication Authentication Signal Performance
    de: Kommunikation Authentifizierungssignal Funktion
  description:
    en: "U3036 judges authentication over time rather than a single bad frame: checks keep failing, cannot be completed, or sender and receiver lose step, for example in their freshness counters. AUTOSAR SecOC shows why this differs from U3035: a receiver retries when no freshness value is available or the crypto service is busy and only gives up after a configured number of build or verify attempts. Ford stores U3036 in the 2023 Super Duty PCM; SSM 51497 explains that it is logged while the PCM keeps monitoring as the CAN bus goes to sleep, and needs no action without other codes, MIL or drivability faults. TSB 23-2421 covers 6.8L and 7.3L trucks with MIL, P061B and U0140, cured by new PCM software. After a TRON module swap Ford also lists U3036 among codes from keys that were not redistributed."
    de: "U3036 bewertet die Authentifizierung über die Zeit statt einer einzelnen fehlerhaften Botschaft: Prüfungen scheitern wiederholt, lassen sich nicht abschließen, oder Sender und Empfänger geraten aus dem Takt, etwa bei ihren Frischezählern. AUTOSAR SecOC zeigt den Unterschied zu U3035: Der Empfänger versucht es erneut, wenn kein Frischewert vorliegt oder der Kryptodienst belegt ist, und gibt erst nach einer eingestellten Zahl von Versuchen auf. Ford legt U3036 im PCM des Super Duty 2023 ab; laut SSM 51497 entsteht er, während das PCM beim Einschlafen des CAN-Busses weiter überwacht, und erfordert ohne weitere Codes, MIL oder Fahrprobleme nichts. TSB 23-2421 behandelt 6,8- und 7,3-l-Modelle mit MIL, P061B und U0140 durch neue PCM-Software. Nach einem TRON-Gerätetausch nennt Ford U3036 auch bei nicht neu verteilten Schlüsseln."
  affected_components:
    - can_bus
    - security_module
  common_causes:
    - id: control_module_software
      likelihood: high
      label:
        en: Monitoring software flags authentication during bus sleep or wake-up
        de: Überwachungssoftware bemängelt Authentifizierung beim Einschlafen oder Aufwecken des Busses
    - id: freshness_out_of_sync
      likelihood: medium
      label:
        en: Freshness counters of sender and receiver out of step
        de: Frischezähler von Sender und Empfänger nicht im Takt
    - id: keys_not_aligned
      likelihood: medium
      label:
        en: Keys not redistributed after module replacement
        de: Schlüssel nach Gerätetausch nicht neu verteilt
    - id: sender_module_offline
      likelihood: low
      label:
        en: Sending module intermittently missing on the bus
        de: Sendendes Steuergerät zeitweise nicht am Bus
  symptoms:
    - en: Code stored after a self-test or key-off without complaints
      de: Code nach Selbsttest oder Abstellen gespeichert, ohne Beanstandung
    - en: MIL together with P061B or U0140 on some engines
      de: MIL zusammen mit P061B oder U0140 bei einzelnen Motoren
    - en: Secured functions working only intermittently
      de: Abgesicherte Funktionen arbeiten nur zeitweise
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [0, 300]
    estimated_hours: [0.3, 2]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
