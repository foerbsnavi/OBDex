    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10233883-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10248365-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11018238-0001.pdf
  reviewed: '2026-11-06'

- code: U3500
  category: network
  title:
    en: Control Module Input Power A Circuit Range/Performance
    de: Steuergerät Eingangsspannung A Stromkreis Bereich/Funktion
  description:
    en: U3500 says that supply input A of a module is present but its voltage is implausible, for example outside the window expected for the current power mode or contradicting other measurements, without clearly passing a lower or upper limit. It thus sits between U3006, which reports a missing or open feed, and the hard limit codes U3501 and U3502. Which pin is A is up to the manufacturer; in GM's electric brake booster tables (2016–2019 hybrid) A is the module's own logic and CAN supply, watched for under 7.5 V and over 16 V, but GM uses only the Low and High codes there. No manufacturer documents U3500 publicly. Typical causes are a high-resistance contact that sags under load, a poor ground or a drifting internal measurement.
    de: U3500 besagt, dass Versorgungseingang A eines Steuergeräts zwar Spannung führt, der Wert aber unplausibel ist – etwa außerhalb des Fensters für den aktuellen Betriebszustand oder im Widerspruch zu anderen Messungen –, ohne eindeutig zu niedrig oder zu hoch zu sein. Damit liegt er zwischen U3006 für einen fehlenden oder unterbrochenen Eingang und den Grenzwertcodes U3501 und U3502. Welcher Pin A ist, bestimmt der Hersteller; im elektrischen Bremskraftverstärker aus GMs Hybridtabellen 2016–2019 ist A die eigene Logik- und CAN-Versorgung, überwacht auf unter 7,5 V und über 16 V, doch GM nutzt dort nur die Codes niedrig und hoch. Kein Hersteller dokumentiert U3500 öffentlich. Typisch sind ein Übergangswiderstand, der unter Last einbricht, eine schlechte Masse oder eine driftende interne Messung.
  affected_components:
    - module_power_a
    - power_wiring
  common_causes:
    - id: high_resistance_contact
      likelihood: medium
      label:
        en: High-resistance terminal or fuse contact on feed A
        de: Übergangswiderstand an Klemme oder Sicherung von Eingang A
    - id: poor_ground
      likelihood: medium
      label:
        en: Poor module ground shifting the measured supply
        de: Schlechte Masse des Steuergeräts verschiebt die gemessene Versorgung
