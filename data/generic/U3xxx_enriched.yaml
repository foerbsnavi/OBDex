- code: U3003
  category: network
  title:
    en: Battery Voltage
    de: Batteriespannung
  description:
    en: "U3003 is logged when the supply a module measures at its own pins leaves the band it needs; the byte gives the direction: :16 too low, :17 too high, :1C out of range, :68 a logged event. GM's front camera module sets it below 9.0 V or above 16.0 V after 3 s in Run and then switches off adaptive cruise, without MIL. Mazda's MT-006/18 links U3003:16 in the CX-5 and CX-9 power liftgate module to a flat battery: recharge, reset, done. Volvo's TJ 34142 ties PSCM U30031C at cranking in start/stop cars to a battery support module switch and asks for both batteries above 12.4 V; Ford's SSM 49662 reports U3003:68 in the 2018 F-150 steering module after auto start-stop on a low battery. Each module stores its own entry, so several at once point to the battery or charging."
    de: "U3003 steht, wenn die Spannung, die ein Steuergerät an seinen eigenen Pins misst, das benötigte Fenster verlässt; das Byte nennt die Richtung: :16 zu niedrig, :17 zu hoch, :1C außerhalb des Bereichs, :68 protokolliertes Ereignis. GMs Frontkameramodul setzt ihn unter 9,0 V oder über 16,0 V nach 3 s in Run, schaltet dann den Abstandstempomat ab und lässt die MIL aus. Mazda (MT-006/18) führt U3003:16 im Heckklappenmodul von CX-5 und CX-9 auf eine leere Batterie zurück: laden, zurücksetzen, fertig. Volvo (TJ 34142) verbindet U30031C im Lenkungssteuergerät beim Start-Stopp-Anlassen mit einem Schalter im Batterie-Stützmodul und verlangt beide Batterien über 12,4 V; Ford (SSM 49662) meldet U3003:68 im Lenkungsmodul des F-150 2018 nach Start-Stopp bei schwacher Batterie. Melden ihn mehrere Module zugleich, liegt es meist an Batterie oder Ladung."
  affected_components:
    - battery
    - alternator
    - charging_system
  common_causes:
    - id: weak_battery
      likelihood: high
      label:
        en: Low state of charge or aged 12 V battery
        de: Geringer Ladezustand oder gealterte 12-V-Batterie
    - id: charging_fault
      likelihood: medium
      label:
        en: Alternator or DC/DC converter charging too little or too much
        de: Lichtmaschine oder DC/DC-Wandler lädt zu wenig oder zu viel
    - id: start_stop_dip
      likelihood: medium
      label:
        en: Voltage dip while cranking or restarting in start/stop mode
        de: Spannungseinbruch beim Anlassen oder Wiederstart im Start-Stopp-Betrieb
    - id: module_feed_resistance
      likelihood: low
      label:
        en: Corroded fuse, connector or ground in the feed to that module
        de: Korrodierte Sicherung, Steckverbindung oder Masse in der Zuleitung dieses Moduls
  symptoms:
    - en: Comfort or assistance function inoperative, e.g. power liftgate or adaptive cruise
      de: Komfort- oder Assistenzfunktion außer Betrieb, etwa elektrische Heckklappe oder Abstandstempomat
    - en: Reduced steering assist message during cranking or after start-stop
      de: Meldung zu reduzierter Lenkhilfe beim Anlassen oder nach Start-Stopp
    - en: The same code stored in several modules at once
      de: Derselbe Code in mehreren Steuergeräten zugleich gespeichert
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [0, 300]
    estimated_hours: [0.3, 1.5]
  flags:
