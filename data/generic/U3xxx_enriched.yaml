- code: U3031
  category: network
  title:
    en: Ignition Output Off
    de: Zündungsausgang Aus
  description:
    en: "U3031 relates to an output whose task is to announce the off state, for example a discrete line that tells other units they may shut down, or the off branch of a power-mode output. Shutdown in many vehicles hinges on such a signal: in Ford's patent US5945745A, modules work normally while an ignition signal is present and fall back to a sleep mode with minimal current draw once it disappears, and GM's 2012 pickups allow the BCM to sleep only when none of its outputs is commanded. If the generating module finds this off output in the wrong state, it records U3031. Stuck in the not-off state, receivers stay awake and drain the battery; signalling off while driving could shut functions down on the move. No manufacturer documents U3031 publicly, so where this output sits has to be taken from the wiring diagram of the vehicle."
    de: "U3031 bezieht sich auf einen Ausgang, der den Aus-Zustand ankündigen soll, etwa eine eigene Leitung, die anderen Geräten das Abschalten erlaubt, oder den Aus-Zweig eines Betriebszustand-Ausgangs. Oft hängt das Herunterfahren an so einem Signal: In Fords Patent US5945745A arbeiten Steuergeräte normal, solange ein Zündsignal anliegt, und gehen bei dessen Wegfall in einen Ruhemodus mit sehr kleinem Strom; GMs Pickups 2012 lassen das BCM erst schlafen, wenn keiner seiner Ausgänge mehr angesteuert ist. Findet das erzeugende Gerät den Aus-Ausgang im falschen Zustand, speichert es U3031. Bleibt er auf „nicht aus“, bleiben Empfänger wach und leeren die Batterie; meldet er Aus während der Fahrt, können Funktionen unterwegs abschalten. Kein Hersteller dokumentiert U3031 öffentlich; wo der Ausgang sitzt, zeigt der Schaltplan des Fahrzeugs."
  affected_components:
    - ignition_output
    - output_wiring
  common_causes:
    - id: output_stage_fault
      likelihood: medium
      label:
        en: Faulty output stage in the module that generates the off signal
        de: Defekte Ausgangsstufe im Steuergerät, das das Aus-Signal erzeugt
    - id: output_wire_open_short
      likelihood: medium
      label:
        en: Off-signal wire open or shorted to ground or voltage
        de: Leitung des Aus-Signals unterbrochen oder mit Masse oder Spannung kurzgeschlossen
    - id: connector_corrosion
      likelihood: low
      label:
        en: Corroded or loose pin at the sending or receiving module
        de: Korrodierter oder lockerer Pin am sendenden oder empfangenden Steuergerät
    - id: module_software
      likelihood: low
      label:
        en: Module software setting the off output at the wrong moment
        de: Steuergeräte-Software setzt den Aus-Ausgang zum falschen Zeitpunkt
  symptoms:
    - en: Battery drained because modules do not go to sleep
      de: Batterie entladen, weil Steuergeräte nicht einschlafen
    - en: Functions switching off unexpectedly with the vehicle on
      de: Funktionen schalten bei eingeschaltetem Fahrzeug unerwartet ab
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 700]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3011, U3032, U302C, U302D, U300A]
  sources:
    - https://patents.google.com/patent/US5945745A/en
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
