- code: U3032
  category: network
  title:
    en: Ignition Output Accessory/Off
    de: Zündungsausgang Zubehör/Aus
  description:
    en: "U3032 is the output counterpart of U3022: a line that a module drives to express the grouped state Accessory or Off, i.e. every power mode where the engine should stay off. Such grouping exists in real wiring. GM's 2012 pickup electrical manual shows a coded ignition circuit whose level is identical for a pulled key and for accessory, and changes once the key is inserted, the engine runs or cranks. A module generating a comparable output monitors the level at its pin and logs U3032 when the level differs from what it means to send, for instance accessory/off appearing while the vehicle runs. Receivers may then switch functions off on the move or stay awake when parked. No manufacturer documents U3032 publicly; codes such as U3022 or U302C stored in the receiving units show which side is wrong."
    de: "U3032 bildet die Ausgangsseite zu U3022: eine Leitung, über die ein Steuergerät den zusammengefassten Zustand Zubehör oder Aus ausgibt, also jeden Betriebszustand, in dem der Motor stillstehen soll. In echten Bordnetzen gibt es das: Das GM-Elektrikhandbuch der Pickups von 2012 zeigt einen codierten Zündkreis, dessen Pegel bei abgezogenem Schlüssel und in Zubehör gleich ist und sich erst bei steckendem Schlüssel, Fahrt und Anlassen ändert. Ein Gerät, das einen vergleichbaren Ausgang erzeugt, liest den eigenen Pin zurück und speichert U3032, wenn der Pegel nicht zum gewollten Zustand passt – etwa Zubehör/Aus während der Fahrt. Empfänger schalten dann womöglich unterwegs Funktionen ab oder bleiben im geparkten Auto wach. Kein Hersteller dokumentiert U3032 öffentlich; U3022 oder U302C in den Empfängern zeigen, welche Seite falsch liegt."
  affected_components:
    - ignition_output
    - output_wiring
  common_causes:
    - id: output_stage_fault
      likelihood: medium
      label:
        en: Output stage in the driving module stuck or failed
        de: Ausgangsstufe im treibenden Steuergerät hängt oder ist defekt
    - id: output_wire_short_or_open
      likelihood: medium
      label:
        en: Output wire shorted to ground or voltage, or broken
        de: Ausgangsleitung mit Schluss nach Masse oder Plus oder unterbrochen
    - id: connector_corrosion
      likelihood: low
      label:
        en: Corroded or loose pin shifting the coded level
        de: Korrodierter oder lockerer Pin verschiebt den codierten Pegel
    - id: aftermarket_load
      likelihood: low
      label:
        en: Retrofitted accessory tapped into the line
        de: Nachgerüsteter Verbraucher an der Leitung angezapft
  symptoms:
    - en: Accessories such as radio or sockets not matching the key or button position
      de: Zubehör wie Radio oder Steckdosen passt nicht zur Schlüssel- bzw. Tasterstellung
    - en: Modules staying awake after shut-off, battery drained overnight
      de: Steuergeräte bleiben nach dem Abstellen wach, Batterie über Nacht leer
    - en: Related ignition input codes stored in other modules
      de: Passende Zündungseingangs-Codes in anderen Steuergeräten gespeichert
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
