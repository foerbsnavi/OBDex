- code: U354E
  category: network
  title:
    en: Hydrogen Tank C Temperature Sensor 1 Circuit
    de: Wasserstofftank C Temperatursensor 1 Stromkreis
  description:
    en: "U354E points to an electrical fault on sensor 1 of tank C, a tank that exists only on three-tank vehicles: the second-generation Mirai, whose long central tank is joined by two smaller ones crosswise under the rear seat and the boot, or the Nexo with three tanks holding 156 litres. On a two-tank car such as the first Mirai or the Clarity the code would suggest a configuration or software mismatch. The sensor is not the overheat protection: a thermally activated relief device opens on its own, on Toyota's FCHV at 110 °C, without electronics. A lost sensor costs information, not the fire safeguard. No manufacturer documents U354E publicly; sensor 2 of tank C is U354F."
    de: "Der Code betrifft den Stromkreis des ersten Temperatursensors in Tank C – einen dritten Tank haben nur Fahrzeuge wie der Mirai der zweiten Generation, bei dem zum langen Mitteltank zwei kleinere quer unter Rücksitz und Kofferraum kommen, oder der Nexo mit drei Tanks und 156 Litern. Bei einem Zwei-Tank-Auto wie dem ersten Mirai oder dem Clarity spräche U354E eher für falsche Konfiguration oder Software. Der Fühler ist nicht der Überhitzungsschutz: Die thermisch auslösende Druckentlastung öffnet selbsttätig, beim Toyota FCHV bei 110 °C, ganz ohne Elektronik. Ein ausgefallener Fühler kostet also Information, nicht die Brandsicherung. Öffentlich dokumentiert kein Hersteller U354E; Fühler 2 von Tank C meldet U354F."
