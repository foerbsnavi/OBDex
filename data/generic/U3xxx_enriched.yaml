    - https://static.nhtsa.gov/odi/tsbs/2022/MC-10225741-0001.pdf
  reviewed: '2026-11-06'

- code: U3006
  category: network
  title:
    en: Control Module Input Power A Circuit/Open
    de: Steuergerät Eingangsspannung A Stromkreis/Unterbrechung
  description:
    en: "Modules with heavy loads often take more than one battery feed, and U3006 says feed A is missing or open. Which pin is A depends on the maker. In one GM brake module (25OBDG04B) feed A means KL30_1, which supplies the pump motor: if it falls below 53.85 % of the second feed KL30_2 for 75 ms, a blown fuse or short to ground is assumed, Type B with MIL. A second GM brake supplier (25OBDG03B) sets U3006 when the motor supply is under 5 V before the start-up motor test, also Type B. Both feeds there are permanent battery positive, not an ignition line. Jeep's 08-106-21 lists U3006-00 next to U3007-00 on 2021 Wrangler 4xe with a weak 12 V battery and MIL, and Mazda's SA-023-23 shows U3006:01 in the CX-5 parking brake module after battery drain."
    de: "Steuergeräte mit großen Lasten haben oft mehrere Batterieeingänge; U3006 meldet, dass Eingang A fehlt oder unterbrochen ist. Welcher Pin A ist, legt der Hersteller fest. In einem GM-Bremssteuergerät (25OBDG04B) ist A die Versorgung KL30_1 für den Pumpenmotor: Fällt sie 75 ms lang unter 53,85 % des zweiten Eingangs KL30_2, gilt eine durchgebrannte Sicherung oder ein Masseschluss als Ursache, Typ B mit MIL. Ein zweiter GM-Bremszulieferer (25OBDG03B) setzt U3006, wenn die Motorversorgung vor dem Motortest beim Start unter 5 V liegt, ebenfalls Typ B. Beide Eingänge sind dort Dauerplus, keine Zündungsleitung. Jeep (08-106-21) nennt U3006-00 neben U3007-00 beim Wrangler 4xe 2021 mit schwacher 12-V-Batterie und MIL; Mazda (SA-023-23) zeigt U3006:01 im Feststellbremsmodul des CX-5 nach entladener Batterie."
  affected_components:
    - module_power_a
    - fuse
    - power_wiring
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Blown or loose fuse in the feed A path
        de: Durchgebrannte oder lockere Sicherung im Pfad von Eingang A
    - id: weak_battery
      likelihood: medium
      label:
        en: Discharged 12 V battery pulling the feed below the check limit
        de: Entladene 12-V-Batterie zieht den Eingang unter die Prüfgrenze
    - id: connector_or_wire
      likelihood: medium
      label:
        en: Corroded terminal, loose pin or chafed wire on supply A
        de: Korrodierter Kontakt, lockerer Pin oder durchgescheuerte Leitung an Versorgung A
    - id: internal_switch
      likelihood: low
      label:
