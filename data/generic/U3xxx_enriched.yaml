- code: U3523
  category: network
  title:
    en: High Voltage System Interlock Circuit F Low
    de: Hochvoltsystem Interlock-Stromkreis F niedrig
  description:
    en: "U3523 is logged when loop F reads too low, typically from an open plug or a wire shorted to ground. Tracing it means working close to high-voltage parts. The German statutory accident insurance DGUV lets only trained high-voltage staff de-energise the system and insists on the order: isolate, secure against switching back on, then prove absence of voltage with a suitable tester, not a multimeter. Only then open loop F plugs, measure sections or bridge the loop for a test; a bridge must never stay in place, as it defeats the protection. No maker documents U3523. The vehicle stays without high voltage until the cause is fixed."
    de: "U3523 wird gespeichert, wenn Schleife F zu niedrig misst, typischerweise wegen eines offenen Steckers oder einer Leitung mit Masseschluss. Die Suche führt nahe an Hochvoltteile. Die Deutsche Gesetzliche Unfallversicherung (DGUV) lässt nur entsprechend qualifizierte Fachkräfte das System spannungsfrei schalten und betont die Reihenfolge: freischalten, gegen Wiedereinschalten sichern, dann Spannungsfreiheit mit geeignetem Prüfgerät feststellen, ausdrücklich keinem Multimeter. Erst danach Stecker von Kreis F öffnen, Abschnitte messen oder zum Test brücken; eine Brücke darf nie im Fahrzeug bleiben, sonst ist der Schutz ausgehebelt. Kein Hersteller dokumentiert U3523. Bis zur Behebung fehlt die Hochspannung."
  affected_components:
    - hvil_loop_f
    - hvil_wiring
  common_causes:
    - id: loop_f_plug_open
      likelihood: high
      label:
        en: Plug in loop F open or not engaged after service
        de: Stecker in Kreis F offen oder nach Service nicht eingerastet
    - id: loop_f_short_to_ground
      likelihood: medium
      label:
        en: Loop F wire shorted to ground
        de: Leitung von Kreis F mit Masseschluss
    - id: broken_interlock_connector
      likelihood: medium
      label:
        en: Broken interlock connector housing or locking tab
        de: Gehäuse oder Rastnase eines Interlock-Steckers gebrochen
  symptoms:
