    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11031309-0001.pdf
  reviewed: '2026-11-06'

- code: U300A
  category: network
  title:
    en: Ignition Switch
    de: Zündschalter
  description:
    en: "U300A is a module's complaint about the ignition switch as a whole: the position or key information it receives does not add up, so it cannot be sure whether the driver wants off, accessory, run or start. The failure-type byte narrows it down. Ford's SSM 52606 covers 2023–2024 Super Duty trucks with a keyed ignition that display Vehicle May Not Start/Restart Service Now with U300A:01 stored by the body control module; a grommet around the lock cylinder had shifted and hindered the key, and reseating it is the repair. On Ram's 2025 heavy-duty pickups the LED headlamps, i.e. smart lamp modules left and right, log U300A-29, signal invalid, as the key moves from run to start. Ram says to leave it alone if it only comes back as stored, but to check the hardwired ignition line if it is active 10 s after start."
    de: "Mit U300A beanstandet ein Steuergerät den Zündschalter als Ganzes: Stellung oder Schlüsselinformation ergeben kein stimmiges Bild, also ist unklar, ob Aus, Zubehör, Fahrt oder Start gewünscht ist. Das Fehlertyp-Byte grenzt ein. Fords SSM 52606 betrifft Super Duty 2023–2024 mit Schlüsselzündung, die „Vehicle May Not Start/Restart Service Now“ melden und U300A:01 im Karosseriesteuergerät ablegen; eine verrutschte Gummitülle am Schließzylinder behinderte den Schlüssel, Abhilfe ist das Neueinsetzen der Tülle. Bei Rams Heavy-Duty-Pickups 2025 speichern die LED-Scheinwerfer, also die Smart-Lamp-Module links und rechts, U300A-29 (Signal ungültig), sobald der Schlüssel von Run auf Start geht. Kommt der Code nur als gespeichert zurück, bleibt er laut Ram unbeachtet; ist er 10 s nach dem Start aktiv, wird die fest verdrahtete Zündleitung geprüft."
  affected_components:
    - ignition_switch
    - ignition_wiring
    - body_control_module
  common_causes:
    - id: key_obstructed_trim
      likelihood: medium
      label:
        en: Key travel hindered at the lock cylinder, e.g. by a displaced grommet or trim
        de: Schlüsselweg am Schließzylinder behindert, etwa durch verrutschte Tülle oder Verkleidung
    - id: module_software_false_entry
      likelihood: medium
      label:
        en: Module software that flags the run-to-start transition as invalid
        de: Steuergeräte-Software, die den Übergang von Run auf Start als ungültig wertet
    - id: switch_contacts_worn
      likelihood: medium
      label:
        en: Worn or dirty contacts inside the ignition switch
        de: Verschlissene oder verschmutzte Kontakte im Zündschalter
    - id: ignition_line_wiring
      likelihood: low
      label:
        en: Open, chafed or corroded hardwired ignition line or connector
        de: Unterbrochene, durchgescheuerte oder korrodierte Zündleitung oder Steckverbindung
  symptoms:
    - en: Start or restart warning in the cluster, possibly a no-start
      de: Warnung zu Start oder Neustart im Kombiinstrument, eventuell kein Start
    - en: Stored code in a lamp or body module with no noticeable effect
      de: Gespeicherter Code in einem Leuchten- oder Karosseriemodul ohne spürbare Folge
    - en: Key turns stiffly or does not reach every position cleanly
      de: Schlüssel dreht schwer oder erreicht nicht jede Stellung sauber
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [0, 450]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300D, U3010, U3011, P2533, U0140]
  sources:
