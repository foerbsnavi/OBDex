- code: U3015
  category: network
  title:
    en: Control Module Ground C
    de: Steuergerät Masse C
  description:
    en: "U3015 reports that the third ground path of a module, labelled C, is missing or no longer plausible. Three or four separate grounds are found mainly on units that drive heavy loads, such as brake, steering or power distribution modules, where control electronics and power stages return current through their own wires. No manufacturer documents U3015 publicly. The published logic for grounds A and B gives the pattern: GM's 19OBDG03B brake module compares the voltages on two grounds and flags one as lost once the ratio leaves ±0.9, and Ford's 26-2150 ties each ground letter to a specific body point. Which pin is C is defined only by that module's wiring diagram. A failing ground C can bring warning lamps, a disabled function or erratic readings from the same module."
    de: "U3015 meldet, dass der dritte Massepfad eines Steuergeräts, Masse C, fehlt oder nicht mehr plausibel ist. Drei oder vier getrennte Massen haben vor allem Geräte mit großen Lasten wie Brems-, Lenkungs- oder Stromverteilermodule, bei denen Steuerelektronik und Endstufen ihren Strom über eigene Leitungen zurückführen. Kein Hersteller dokumentiert U3015 öffentlich. Das Vorgehen zeigen die veröffentlichten Prüfungen für Masse A und B: GMs Tabelle 19OBDG03B lässt ein Bremssteuergerät die Spannungen zweier Massen vergleichen; eine gilt als verloren, sobald das Verhältnis ±0,9 überschreitet, und Fords 26-2150 ordnet jedem Massebuchstaben einen bestimmten Karosseriepunkt zu. Welcher Pin C ist, steht nur im Schaltplan des Geräts. Fehlt Masse C, sind Warnleuchten, eine abgeschaltete Funktion oder unstete Messwerte desselben Moduls möglich."
  affected_components:
    - module_ground_c
    - ground_strap
  common_causes:
    - id: ground_point_corroded
      likelihood: high
      label:
        en: Corroded or loose ground eyelet at the body or frame point
        de: Korrodierte oder lockere Masseöse am Karosserie- oder Rahmenpunkt
    - id: ground_wire_damaged
      likelihood: medium
      label:
        en: Chafed or broken ground wire between module and ground point
        de: Durchgescheuerte oder gebrochene Masseleitung zwischen Modul und Massepunkt
    - id: connector_pin
      likelihood: medium
      label:
        en: Spread or corroded ground pin in the module connector
        de: Aufgeweiteter oder korrodierter Massepin im Modulstecker
    - id: module_internal
      likelihood: low
      label:
        en: Internal fault in the module's ground measurement
        de: Interner Fehler in der Massemessung des Steuergeräts
  symptoms:
    - en: Warning lamp or message for the system run by the affected module
      de: Warnleuchte oder Meldung für das System des betroffenen Steuergeräts
    - en: Function cut back or switched off, often depending on load or moisture
      de: Funktion eingeschränkt oder abgeschaltet, oft abhängig von Last oder Feuchte
    - en: Stored together with other supply or ground codes of the same module
      de: Gespeichert zusammen mit weiteren Versorgungs- oder Massecodes desselben Moduls
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 250]
    estimated_hours: [0.5, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
