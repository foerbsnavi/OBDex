- code: U354F
  category: network
  title:
    en: Hydrogen Tank C Temperature Sensor 2 Circuit
    de: Wasserstofftank C Temperatursensor 2 Stromkreis
  description:
    en: "U354F is set when the circuit of the second temperature sensor in tank C fails. During refuelling the car hands tank data to the station; Toyota describes infrared links between the tank temperature sensors, nozzle and dispenser that set the flow so the gas does not overheat. In a published test series the fill was stopped as soon as either of two tank sensors showed 85 °C, which explains why a missing channel matters: the controller has to fill more cautiously or quit early. FMVSS 308 likewise ties a slower pressure ramp to gas above 85 °C. No maker documents U354F. Expect a hydrogen system warning and refuelling that takes longer or ends short of full, which in turn trims range. The paired sensor is U354E."
    de: "Fällt der Stromkreis des zweiten Temperatursensors in Tank C aus, wird U354F gespeichert. Beim Tanken übergibt das Auto Tankdaten an die Station; Toyota beschreibt eine Infrarotverbindung zwischen Tankfühlern, Zapfpistole und Säule, über die der Durchfluss so bemessen wird, dass das Gas nicht zu heiß wird. In einer veröffentlichten Versuchsreihe endete die Füllung, sobald einer von zwei Tankfühlern 85 °C zeigte – daran sieht man, was ein fehlender Kanal bedeutet: Das Steuergerät muss zurückhaltender füllen oder früher aufhören. Auch FMVSS 308 knüpft den langsameren Druckanstieg an Gas über 85 °C. Kein Hersteller dokumentiert U354F. Zu erwarten: Warnung, längeres oder unvollständiges Tanken und dadurch weniger Reichweite. Partnerfühler ist U354E."
  affected_components:
