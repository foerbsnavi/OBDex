- code: U351D
  category: network
  title:
    en: High Voltage System Interlock Circuit E
    de: Hochvoltsystem Interlock-Stromkreis E
  description:
    en: "U351D covers a disturbed fifth interlock loop, circuit E, where the module cannot narrow the fault down. Five loops arise naturally if every protected housing gets its own circuit. A GM patent describes this: each high-voltage enclosure has a functional interlock tied to its access point, and the low-voltage signal inside only gets through while that opening is closed. Removing a cover is thus noticed by the circuit of that very housing. Which enclosure belongs to loop E is not published. Check covers, lids and their screws first, then the plugs of the housings involved; high voltage stays off until loop E is closed."
    de: "U351D steht für eine gestörte fünfte Interlock-Schleife, Kreis E, wenn das Steuergerät den Fehler nicht genauer einordnen kann. Fünf Schleifen entstehen zwanglos, wenn jedes geschützte Gehäuse einen eigenen Kreis erhält. Ein GM-Patent beschreibt das: Jedes Hochvoltgehäuse hat einen funktionalen Interlock-Kreis an seiner Zugangsöffnung, und das Niedervoltsignal darin kommt nur durch, solange diese Öffnung verschlossen ist. Wer einen Deckel abnimmt, wird also vom Kreis genau dieses Gehäuses bemerkt. Welches Gehäuse zu Kreis E gehört, ist nicht veröffentlicht. Zuerst Deckel und deren Schrauben prüfen, dann die Stecker der beteiligten Gehäuse; bis Kreis E geschlossen ist, bleibt die Hochspannung aus."
  affected_components:
    - hvil_loop_e
    - hv_connectors
  common_causes:
    - id: housing_cover_not_closed
      likelihood: high
      label:
        en: Cover of a high-voltage housing on loop E not fitted or not fully tightened
        de: Deckel eines Hochvoltgehäuses an Kreis E nicht montiert oder nicht fest verschraubt
    - id: cover_contact_damaged
      likelihood: medium
      label:
        en: Interlock contact or bridge in the cover bent or broken
        de: Interlock-Kontakt oder Brücke im Deckel verbogen oder gebrochen
    - id: loop_e_harness_damage
      likelihood: medium
      label:
        en: Loop E wiring damaged between housings
        de: Leitung von Kreis E zwischen den Gehäusen beschädigt
    - id: monitoring_module_fault
