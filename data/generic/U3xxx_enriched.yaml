      de: Plötzlicher Antriebsverlust während der Fahrt
    - en: Contactors open without prior warning
      de: Schütze öffnen ohne vorherige Warnung
    - en: No restart until the loop reads normal
      de: Kein Neustart, bis die Schleife wieder Normalwerte liefert
