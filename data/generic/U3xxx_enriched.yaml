- code: U3575
  category: network
  title:
    en: Coolant Mixing Valve Position Sensor Circuit
    de: Kühlmittel-Mischventil Positionssensor Stromkreis
  description:
    en: "U3575 deals with wiring and signal of the sensor reporting how far the coolant mixing valve is open. GM lists feedback of the valve position, next to two temperature sensors, among the parts its stack outlet temperature control relies on. In Toyota's design the sensor is built into the valve and returns the angle of the valving element; since it can drift, the controller re-zeroes it against an end position before the coolant pump starts. If the signal is missing or shorted, the controller no longer knows where the valve stands and may regulate from temperatures alone or move the valve to a safe setting. No maker documents U3575 publicly. Probable results: a warning lamp and capped output. Faults in driving this valve fall under U3573."
    de: Gestört ist der Stromkreis jenes Gebers, der die Öffnung des Kühlmittel-Mischventils zurückmeldet. GM zählt einen solchen Stellungsgeber neben zwei Temperaturfühlern zu den Teilen, ohne die seine Regelung der Stack-Austrittstemperatur nicht auskommt. Bei Toyota steckt der Geber im Ventil und misst den Winkel des Ventilkörpers; weil er driften kann, gleicht das Steuergerät ihn vor dem Anlaufen der Kühlmittelpumpe an einer Endlage neu ab. Fehlt das Signal oder ist es kurzgeschlossen, weiß das Steuergerät nicht mehr, wo das Ventil steht. Es kann dann nur noch nach Temperaturen regeln oder das Ventil in eine sichere Lage fahren. Öffentlich nennt kein Hersteller U3575. Wahrscheinlich sind Warnmeldung und begrenzte Leistung; Antriebsfehler desselben Ventils meldet U3573.
  affected_components:
    - coolant_mixing_valve_position_sensor
    - sensor_wiring
  common_causes:
    - id: sensor_connector_wiring
      likelihood: high
      label:
        en: Open, short or moisture in the position sensor wiring or connector
        de: Unterbrechung, Kurzschluss oder Feuchtigkeit an Leitung oder Stecker des Stellungsgebers
    - id: position_sensor_internal_fault
      likelihood: medium
      label:
        en: Position sensor faulty (usually replaced together with the valve)
        de: Stellungsgeber defekt (meist nur zusammen mit dem Ventil erhältlich)
    - id: sensor_supply_ground_fault
      likelihood: low
      label:
        en: Sensor supply or ground missing
        de: Versorgung oder Masse des Gebers fehlt
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Stack temperature regulated less precisely, reduced power
      de: Stacktemperatur wird ungenauer geregelt, weniger Leistung
    - en: Valve opening shown as invalid in live data
      de: Ventilöffnung in den Messwerten als ungültig angezeigt
  repair:
