- code: U352E
  category: network
  title:
    en: High Voltage System Interlock Circuit J Performance
    de: Hochvoltsystem-Interlock-Kreis J Leistung
  description:
    en: HVIL loop J timing/pattern does not match expected behavior. The interlock is a low-voltage signal loop routed through the HV connectors and covers; the monitoring module drives a current or signal through it and opens the HV contactors, or refuses to close them, when the loop is broken or out of range, so that no HV connection can be opened while live.
    de: HVIL-Loop J Timing/Muster entspricht nicht dem Sollverhalten. Der Interlock ist eine Niedervolt-Signalschleife, die durch die HV-Stecker und -Abdeckungen läuft; das überwachende Steuergerät speist einen Strom oder ein Signal ein und öffnet die HV-Schütze oder schließt sie gar nicht erst, wenn die Schleife unterbrochen ist oder außerhalb des Sollbereichs liegt, damit keine HV-Verbindung unter Spannung getrennt werden kann.
