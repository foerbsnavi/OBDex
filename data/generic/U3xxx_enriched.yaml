- code: U301E
  category: network
  title:
    en: Control Module Wake-up Circuit B/Open
    de: Steuergerät Weckleitung B Stromkreis/Unterbrechung
  description:
    en: "U301E is the open-circuit code for a second wake-up line, B, on modules that can be roused by more than one source, for example by a door or key event and separately by a charge or timer signal. Ford's patent US5945745A explains why such paths exist at all: a module may sit in a low-current state with the ignition off and still has to answer certain demands, such as panel lighting when the headlamps are switched on. No manufacturer documents U301E publicly; Ford's 2019 hybrid OBD summary shows only the A-side logic of a charge wake-up line. When only line B is open, the module still wakes through A and the bus but ignores the source wired to B, so the fault often shows as one specific function failing to start. If A and B are logged together, check the common sending module or a shared splice first."
    de: "U301E ist der Unterbrechungscode für eine zweite Weckleitung B an Steuergeräten, die von mehr als einer Quelle geweckt werden können, etwa durch Tür oder Schlüssel und getrennt durch ein Lade- oder Zeitsignal. Fords Patent US5945745A erklärt, warum es solche Pfade gibt: Ein Gerät kann bei ausgeschalteter Zündung stromsparend ruhen und muss trotzdem auf bestimmte Anforderungen reagieren, etwa die Instrumentenbeleuchtung beim Einschalten des Lichts. Kein Hersteller dokumentiert U301E öffentlich; Fords Hybrid-OBD-Übersicht 2019 zeigt nur die A-Seite einer Lade-Weckleitung. Ist nur Leitung B offen, wacht das Gerät weiter über A und den Bus auf, überhört aber die an B angeschlossene Quelle – oft fällt dann gezielt eine Funktion aus. Stehen A und B gemeinsam im Speicher, zuerst den gemeinsamen Sender oder Verbindungspunkt prüfen."
  affected_components:
    - wakeup_circuit_b
    - wakeup_wiring
  common_causes:
    - id: wake_wire_open
      likelihood: high
      label:
        en: Broken wake-up wire B or loose pin
        de: Gebrochene Weckleitung B oder lockerer Pin
    - id: shared_splice_fault
      likelihood: medium
      label:
        en: Fault at a splice or sender shared with line A
        de: Fehler an einem mit Leitung A gemeinsamen Verbindungspunkt oder Sender
    - id: sending_module_no_output
      likelihood: medium
      label:
        en: Source wired to line B not driving its output
        de: An Leitung B angeschlossene Quelle steuert ihren Ausgang nicht an
  symptoms:
    - en: One wake-dependent function, e.g. timed or remote action, does not start
      de: Eine weckabhängige Funktion, etwa zeitgesteuert oder per Fernzugriff, startet nicht
    - en: Module otherwise works normally once awake
      de: Gerät arbeitet sonst normal, sobald es wach ist
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U301F, U3020, U3021, U301A, U3012]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US5945745A/en
    - https://www.fordservicecontent.com/Ford_Content/catalog/motorcraft/OBDSM1901_HEV.pdf
  reviewed: '2026-11-06'

- code: U301F
  category: network
  title:
    en: Control Module Wake-up Circuit B Low
    de: Steuergerät Weckleitung B niedrig
  description:
    en: U301F reports wake-up line B held below its valid level, most often by a short to ground. Since B is a second, independent wake path, the module can still be roused through line A or the network; what it loses is the wake source wired to B. With an edge-triggered input such as the WAKE pin of NXP's TJA1043, which only reacts to a level change that remains stable for a short filter time, a grounded line simply never delivers that change. Its threshold sits only a few volts under battery voltage, so a partly shorted or corroded wire can count as low as well. No manufacturer documents U301F publicly. Unlike U301E, the circuit is not open, so a resistance check to ground with both connectors unplugged is the quickest way to find the fault.
    de: U301F meldet, dass Weckleitung B unter ihrem gültigen Pegel liegt, meist durch Schluss nach Masse. Da B ein zweiter, unabhängiger Weckpfad ist, lässt sich das Gerät weiter über Leitung A oder das Netz wecken; verloren geht nur die an B angeschlossene Weckquelle. Bei einem flankengesteuerten Eingang wie dem WAKE-Pin von NXPs TJA1043, der nur auf einen Pegelwechsel reagiert, der eine kurze Filterzeit stabil bleibt, liefert eine auf Masse liegende Leitung diesen Wechsel nie. Die Schwelle liegt nur wenige Volt unter der Batteriespannung, daher kann auch eine teilweise kurzgeschlossene oder korrodierte Leitung als niedrig gelten. Kein Hersteller dokumentiert U301F öffentlich. Anders als bei U301E ist der Kreis nicht offen; am schnellsten findet man den Fehler mit einer Widerstandsmessung gegen Masse bei abgezogenen Steckern.
  affected_components:
    - wakeup_circuit_b
    - wakeup_wiring
  common_causes:
    - id: wake_wire_short_ground
      likelihood: high
      label:
        en: Wake-up wire B chafed and touching ground
        de: Weckleitung B durchgescheuert und mit Masse in Kontakt
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Moisture or corrosion pulling line B down
        de: Feuchtigkeit oder Korrosion zieht Leitung B herunter
    - id: sending_module_output_low
      likelihood: low
      label:
        en: Source on line B with its output stuck low
        de: Quelle an Leitung B mit dauerhaft niedrigem Ausgang
  symptoms:
    - en: Function tied to wake source B unavailable
      de: Funktion, die an Weckquelle B hängt, nicht verfügbar
    - en: No other complaint while the module is awake
      de: Keine weitere Beanstandung, solange das Gerät wach ist
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
  flags:
