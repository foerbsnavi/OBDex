- code: U355D
  category: network
  title:
    en: Expander Inlet Pressure Sensor 1 Circuit
    de: Expander Eintritt Drucksensor 1 Stromkreis
  description:
    en: U355D covers the first pressure sensor in front of the expander, a turbine in the cathode exhaust that turns leftover pressure from the stack outlet into shaft power for the compressor. Garrett states that its optional turbine expander, developed among others for the compressor of the BMW iX5 Hydrogen, lowers the electricity needed for compression by up to 20 %. In a Toyota patent a waste gate valve divides exhaust between turbine and bypass, because the flow resistance of the turbine raises the pressure the compressor must supply and can push it toward surge. A sensor at the turbine inlet shows this back pressure directly. No maker documents U355D. Losing it takes an input from energy recovery and cathode pressure control. Toyota's Mirai bulletin T-SB-0043-23 shows that faults on the cathode air side light the MIL.
    de: U355D gilt dem ersten Drucksensor vor dem Expander. Das ist eine Turbine im Kathodenabgas, die den Restdruck am Stack-Austritt in Wellenleistung für den Verdichter umsetzt. Garrett gibt für seinen optionalen Turbinen-Expander, entwickelt etwa für den Verdichter des BMW iX5 Hydrogen, bis zu 20 % weniger Verdichterstrom an. In einem Toyota-Patent teilt ein Wastegate-Ventil das Abgas zwischen Turbine und Umgehung auf, weil der Strömungswiderstand der Turbine den nötigen Förderdruck anhebt und den Verdichter Richtung Pumpgrenze schieben kann. Ein Sensor am Turbineneintritt zeigt diesen Gegendruck direkt. Kein Hersteller dokumentiert U355D. Fällt er aus, fehlt Energierückgewinnung und Kathodendruckregelung eine Eingangsgröße. Laut Toyota-Bulletin T-SB-0043-23 schalten Luftseiten-Fehler am Mirai die MIL ein.
  affected_components:
    - expander_inlet_pressure_sensor_1
    - sensor_wiring
  common_causes:
    - id: harness_connector_exhaust_side
      likelihood: high
      label:
        en: Wiring or connector of sensor 1 at the wet exhaust side corroded, open or shorted
        de: Leitung oder Stecker von Sensor 1 an der feuchten Abgasseite korrodiert, unterbrochen oder kurzgeschlossen
    - id: sensor_internal_fault
      likelihood: medium
      label:
