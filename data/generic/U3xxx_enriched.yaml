- code: U3560
  category: network
  title:
    en: Cathode Backpressure Valve Position Sensor Circuit
    de: Kathoden-Gegendruckventil Positionssensor Stromkreis
  description:
    en: "U3560 is set when the signal of the position sensor on the cathode backpressure valve is missing, shorted or outside its electrical range. Outlet valves of this kind are often throttle flaps whose angle is reported back, as a Hydrogenics patent shows for the cathode and purge valves of a stack. The reading matters beyond the valve: in a GM patent the controller turns the valve position into an expected air-side pressure and compares it with the measured one to reveal leaks or blockages in the air path, so without a believable angle that check loses its footing. No manufacturer publishes U3560. The controller may carry on regulating from pressure alone or park the flap in a safe position; a warning and limited output are likely. Faults in powering the same valve are logged as U355F."
    de: "Gemeldet wird ein Fehler im Signalkreis des Stellungsgebers am Kathoden-Gegendruckventil: Das Signal fehlt, ist kurzgeschlossen oder liegt außerhalb des zulässigen Spannungsbereichs. Viele dieser Ventile sind Drosselklappen mit Winkelrückmeldung – ein Hydrogenics-Patent zeigt das für Kathoden- und Spülventile. Die Rückmeldung dient nicht nur der Ventilregelung: GM errechnet laut Patent aus der Klappenstellung den zu erwartenden Druck im Luftpfad und erkennt im Vergleich mit dem Messwert Undichtigkeiten oder Verstopfungen. Ohne plausible Stellung fehlt dieser Prüfung die Grundlage. Öffentliche Herstellerunterlagen zu U3560 gibt es nicht. Denkbar ist, dass das Steuergerät nur noch nach Druck regelt oder die Klappe in eine sichere Lage fährt; Mit Warnmeldung und Leistungsrücknahme ist zu rechnen. Den Ansteuerkreis meldet U355F."
  affected_components:
    - cathode_backpressure_valve_position_sensor
    - sensor_wiring
  common_causes:
