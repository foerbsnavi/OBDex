- code: U3571
  category: network
  title:
    en: Stack Outlet Coolant Temperature Sensor 1 Circuit
    de: Stack-Austritt Kühlmitteltemperatursensor 1 Stromkreis
  description:
    en: "U3571 concerns the wiring and signal of sensor 1 in the coolant stream leaving the stack. Coolant is hottest here, so the reading serves as the main overheat guard: GM holds stack outlet temperature mainly with a three-port valve sending coolant past or through the radiator and shuts the stack off when coolant at this point gets too hot. A wrong outlet value can therefore force a needless shutdown or hide genuine overheating. GM cross-checks the sensor against end cell temperatures and treats it as suspect when it reads more than 3 °C above their average. Hyundai can fall back on the exhaust temperature of the air side as a stand-in. No public maker document names U3571. Warning and lower output follow; U3572 covers sensor 2 at this location, U3570 the inlet."
    de: "Hier liegt ein Kreisfehler am ersten Temperaturfühler im Kühlmittelaustritt des Stacks vor. Dort ist das Kühlmittel am wärmsten, deshalb dient der Wert als Überhitzungsschutz: GM regelt die Austrittstemperatur vor allem über ein Dreiwege-Bypassventil am Kühler und schaltet den Stack ab, wenn es dort zu heiß wird. Liefert der Fühler falsche Werte, droht entweder ein unnötiges Abschalten oder eine unerkannte Überhitzung. GM gleicht ihn deshalb mit den Temperaturen der Endzellen ab und hält ihn für verdächtig, wenn er mehr als 3 °C über deren Mittel liegt. Hyundai kann ersatzweise mit der Ablufttemperatur der Luftseite weiterregeln. U3571 ist bei keinem Hersteller öffentlich dokumentiert. Folgen: Warnung und weniger Leistung. Fühler 2 an derselben Stelle meldet U3572, den Eintritt U3570."
  affected_components:
