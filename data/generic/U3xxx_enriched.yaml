- code: U3501
  category: network
  title:
    en: Control Module Input Power A Circuit Low
    de: Steuergerät Eingangsspannung A Stromkreis niedrig
  description:
    en: "U3501 reports that supply A of a module is below its permitted range. GM's electric brake booster (BSC2) in the 2016–2019 hybrid OBD tables runs two checks: the CAN/logic supply under 7.5 V for 0.09 s, and the internal sensor for the module supply under 4.9 V for 0.2 s, a level below the point where the hardware should already have shut down. Both are Special Type C, so no MIL. The weight of the code lies elsewhere: GM lists U3501 among the conditions that suspend many other booster tests, because motor and sensor checks are meaningless without proper supply. It passes after 30 s with ignition on. Usual causes are a weak or discharged battery, a deep dip while cranking, a corroded fuse or terminal on the feed, or a bad ground."
    de: "U3501 meldet, dass Versorgung A eines Steuergeräts unter dem zulässigen Bereich liegt. GMs elektrischer Bremskraftverstärker (BSC2) in den Hybridtabellen 2016–2019 prüft zweifach: CAN- bzw. Logikversorgung unter 7,5 V für 0,09 s und den internen Fühler der Gerätespannung unter 4,9 V für 0,2 s – ein Wert, bei dem die Hardware eigentlich schon abgeschaltet haben müsste. Beides ist Special Typ C, also ohne MIL. Gewicht hat der Code anderswo: GM führt U3501 unter den Bedingungen, die viele andere Prüfungen des Verstärkers aussetzen, weil Motor- und Sensortests ohne saubere Versorgung nichts aussagen. Als bestanden gilt er nach 30 s mit Zündung ein. Üblich sind eine schwache oder entladene Batterie, ein tiefer Einbruch beim Anlassen, eine korrodierte Sicherung oder Klemme im Zulauf oder eine schlechte Masse."
  affected_components:
    - module_power_a
    - power_wiring
    - fuse
  common_causes:
    - id: weak_battery
      likelihood: high
      label:
        en: Weak or discharged 12 V battery
        de: Schwache oder entladene 12-V-Batterie
    - id: cranking_dip
      likelihood: medium
      label:
        en: Deep voltage dip during engine start
        de: Tiefer Spannungseinbruch beim Motorstart
    - id: feed_resistance
      likelihood: medium
      label:
        en: Corroded fuse, terminal or ground in the A feed
        de: Korrodierte Sicherung, Klemme oder Masse im Zulauf A
    - id: module_internal_supply
      likelihood: low
      label:
        en: Internal supply stage of the module faulty
        de: Interne Versorgungsstufe des Steuergeräts defekt
  symptoms:
    - en: Module resets or drops off the network at low voltage
      de: Steuergerät startet neu oder fällt bei Unterspannung aus dem Netz
    - en: Other self-tests of the module suspended
      de: Andere Selbsttests des Steuergeräts ausgesetzt
    - en: Warning lamp for the affected system, usually without MIL
      de: Warnleuchte des betroffenen Systems, meist ohne MIL
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [10, 300]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
