- code: U301D
  category: network
  title:
    en: Control Module Wake-up Circuit A Performance
    de: Steuergerät Weckleitung A Funktion
  description:
    en: "U301D says wake-up line A is electrically intact but its level does not fit what the module expects at that moment. Ford uses it in the battery energy control module of the 2019 Fusion Energi plug-in hybrid. Its OBD summary files the code under the charging performance checks: while the charger is precharging and its output voltage is already within the window for closing the charge contactors, the BECM still sees the charge wake-up line low before it has asked for the contactors to close. Ford's TSB 18-2386 and SSM 47630 report U301D with a lit MIL after charging on cars built up to 2 Oct 2018; if it is the only BECM code, the PCM and BECM are reprogrammed together (0.5 h) under the emissions warranty. Charging is normally unaffected, but the MIL stays on until cleared."
    de: "U301D besagt, dass Weckleitung A elektrisch in Ordnung ist, ihr Pegel aber nicht zu dem passt, was das Gerät in diesem Moment erwartet. Ford nutzt den Code im Batteriesteuergerät (BECM) des Plug-in-Hybriden Fusion Energi 2019. Die OBD-Übersicht führt ihn bei den Ladefunktionsprüfungen: Während das Ladegerät vorlädt und seine Ausgangsspannung schon im Fenster zum Schließen der Ladeschütze liegt, sieht das BECM die Lade-Weckleitung noch auf niedrig, bevor es selbst das Schließen angefordert hat. Fords TSB 18-2386 und SSM 47630 melden U301D mit leuchtender MIL nach dem Laden bei Fahrzeugen, die bis 2. Oktober 2018 gebaut wurden; ist er der einzige BECM-Code, werden Motor- und Batteriesteuergerät gemeinsam neu programmiert (0,5 h, Abgasgarantie). Das Laden selbst läuft meist normal, die MIL bleibt aber bis zum Löschen an."
  affected_components:
    - wakeup_circuit_a
    - battery_energy_control_module
    - on_board_charger
  common_causes:
    - id: module_software
      likelihood: high
      label:
        en: BECM and PCM software judging the wake-up timing too strictly
        de: Software von BECM und Motorsteuergerät bewertet das Weck-Timing zu streng
    - id: charger_wake_signal_late
      likelihood: medium
      label:
        en: On-board charger raising its wake-up signal late or unsteadily
        de: Bordlader setzt sein Wecksignal verspätet oder unstet
    - id: wake_wire_resistance
      likelihood: low
      label:
        en: High resistance in the charge wake-up wire or connector
        de: Erhöhter Widerstand in der Lade-Weckleitung oder am Stecker
  symptoms:
    - en: MIL on after a charging session
      de: MIL nach einem Ladevorgang an
    - en: Code is the only entry in the battery control module
      de: Code ist der einzige Eintrag im Batteriesteuergerät
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [0, 200]
    estimated_hours: [0.5, 1]
  flags:
