- code: U353C
  category: network
  title:
    en: High Voltage System Interlock Circuit M High
    de: Hochvoltsystem Interlock-Stromkreis M hoch
  description:
    en: U353C indicates that loop M exceeds its upper threshold. A loop built from known resistances can be checked point by point. In Tesla's Model S tech note the battery management sends a constant 20 mA through four resistance stages of 60 ohms, 240 ohms in total, so about 4.8 V appears at the start and the value falls to 3.6, 2.4 and 1.2 V at the following connectors. Back-probing each point and comparing it with these steps shows in which section extra resistance or foreign voltage sits; resistance to ground with the loop off runs in matching 60-ohm steps. A wiring diagram with such reference values makes loop M quick to trace. No maker documents U353C itself.
    de: U353C zeigt an, dass Schleife M ihre obere Schwelle überschreitet. Eine Schleife aus bekannten Widerständen lässt sich Punkt für Punkt prüfen. In Teslas Technotiz zum Model S schickt das Batteriemanagement konstant 20 mA durch vier Widerstandsstufen von je 60 Ohm, zusammen 240 Ohm; am Anfang liegen so etwa 4,8 V an, an den folgenden Steckern 3,6, 2,4 und 1,2 V. Wer jeden Punkt von hinten abgreift und mit diesen Stufen vergleicht, sieht, in welchem Abschnitt Zusatzwiderstand oder Fremdspannung sitzt; der Widerstand gegen Masse bei abgeschalteter Schleife fällt entsprechend in 60-Ohm-Schritten. Mit solchen Sollwerten im Schaltplan ist Kreis M rasch eingegrenzt. U353C selbst dokumentiert kein Hersteller.
  affected_components:
    - hvil_loop_m
    - hvil_wiring
  common_causes:
    - id: added_resistance_loop_m
      likelihood: high
      label:
        en: Corroded or loose contact adding resistance in one section of loop M
        de: Korrodierter oder lockerer Kontakt erhöht den Widerstand in einem Abschnitt von Kreis M
    - id: loop_m_short_to_12v
      likelihood: medium
      label:
        en: Loop M wire in contact with a 12 V supply
        de: Leitung von Kreis M mit Kontakt zu einer 12-V-Versorgung
    - id: component_resistance_out_of_spec
      likelihood: low
      label:
        en: High-voltage component with internal loop resistance out of specification
        de: Hochvoltbauteil mit innerem Schleifenwiderstand außerhalb der Vorgabe
  symptoms:
    - en: Vehicle does not become ready
      de: Fahrzeug wird nicht fahrbereit
    - en: High-voltage warning returns after clearing
      de: Hochvolt-Warnung kehrt nach dem Löschen zurück
  repair:
    difficulty: hard
    diy_possible: false
