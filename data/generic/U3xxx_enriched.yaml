- code: U3506
  category: network
  title:
    en: Control Module Input Power B Circuit High
    de: Steuergerät Eingangsspannung B Stromkreis hoch
  description:
    en: "U3506 reports overvoltage on supply input B. In GM's electric brake booster (2016–2019 hybrid OBD tables) three checks feed this code: battery voltage of the booster circuit above 17 V for 90 s, the supply of the internal motor driver above 18 V for 1.1 s, and battery voltage above 16.5 V for 1.1 s, at which booster performance is cut back. All are Type B, MIL after two trips; passing takes 90 s with ignition on. The graded limits reveal the idea: brief excursions are tolerated, lasting ones or those that put the power stage at risk are not. Check the charging voltage at idle with loads switched on first, then external chargers, jump starters and loose battery terminals that produce voltage spikes."
    de: "U3506 meldet Überspannung an Versorgungseingang B. Im elektrischen Bremskraftverstärker aus GMs Hybridtabellen 2016–2019 führen drei Prüfungen zu diesem Code: Batteriespannung des Verstärkerkreises über 17 V für 90 s, Versorgung des internen Motortreibers über 18 V für 1,1 s und Batteriespannung über 16,5 V für 1,1 s, wobei die Verstärkerleistung zurückgenommen wird. Alle sind Typ B, MIL nach zwei Fahrten; bestanden nach 90 s mit Zündung ein. Die gestaffelten Grenzen zeigen das Prinzip: Kurze Ausreißer werden geduldet, anhaltende oder solche, die die Leistungsstufe gefährden, nicht. Zuerst die Ladespannung bei laufendem Motor mit eingeschalteten Verbrauchern messen, dann Ladegeräte, Starthilfegeräte und lockere Batterieklemmen als Quelle von Spannungsspitzen prüfen."
  affected_components:
    - module_power_b
    - charging_system
  common_causes:
    - id: voltage_regulator_fault
      likelihood: high
      label:
        en: Charging voltage too high from regulator or DC/DC converter
        de: Ladespannung durch Regler oder Gleichspannungswandler zu hoch
    - id: external_jump_or_charger
      likelihood: medium
      label:
        en: Jump starter or charger delivering excessive voltage
        de: Starthilfe- oder Ladegerät liefert zu hohe Spannung
    - id: load_dump
      likelihood: medium
      label:
        en: Loose battery terminal causing spikes
        de: Lockere Batterieklemme verursacht Spitzen
    - id: module_measurement
      likelihood: low
      label:
        en: Faulty measurement of feed B in the module
        de: Fehlerhafte Messung von Eingang B im Steuergerät
  symptoms:
    - en: MIL after two trips
      de: MIL nach zwei Fahrten
    - en: Reduced assist of the supplied power stage
      de: Verminderte Leistung der versorgten Leistungsstufe
    - en: Overvoltage codes in further modules
      de: Überspannungscodes in weiteren Steuergeräten
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 700]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3505, U3504, U3507, U3502, U350A]
  sources:
