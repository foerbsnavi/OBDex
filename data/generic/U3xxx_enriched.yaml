- code: U3513
  category: network
  title:
    en: High Voltage System Interlock Circuit B Low
    de: Hochvoltsystem Interlock-Stromkreis B niedrig
  description:
    en: "U3513 reports a signal on interlock loop B that stays below its lower limit while the loop is energised by the module. What that means depends on the circuit: where the module feeds a test voltage in and reads it back at the far end, an opened plug reads low just like a wire touching ground. GM's documented loop A gives a sense of scale: its low code sets when less than 30 % of its 5 V check voltage comes back in two 12.5 ms samples, Type A. Texas Instruments' reference design shows how a current-fed loop can tell both apart: a grounded wire makes the loop current vanish while the supply current rises, with an open loop both drop. No maker publishes U3513. The contactors stay open; check loop B for chafed wires and unplugged connectors."
    de: "U3513 meldet ein Signal an Interlock-Schleife B, das unter seiner Untergrenze bleibt, obwohl das Steuergerät die Schleife bestromt. Was das heißt, hängt von der Schaltung ab: Speist das Gerät eine Prüfspannung ein und liest sie am Ende der Schleife zurück, erscheint ein gezogener Stecker genauso niedrig wie ein Masseschluss. GMs dokumentierte Schleife A gibt einen Maßstab: Dort setzt der Niedrig-Code, wenn von 5 V Prüfspannung in zwei Messungen zu 12,5 ms weniger als 30 % zurückkommen, Typ A. Das Referenzdesign von Texas Instruments zeigt, wie eine stromgespeiste Schleife beides unterscheidet: Bei Masseschluss verschwindet der Schleifenstrom, während der Versorgungsstrom steigt; bei offener Schleife sinken beide. Kein Hersteller veröffentlicht U3513. Die Schütze bleiben offen; Kreis B auf Scheuerstellen und gelöste Stecker prüfen."
  affected_components:
    - hvil_loop_b
    - hvil_wiring
  common_causes:
    - id: loop_b_short_to_ground
      likelihood: high
      label:
        en: Interlock wire of loop B chafed through to ground
        de: Interlock-Leitung von Kreis B an Masse durchgescheuert
    - id: loop_b_opened
      likelihood: medium
      label:
        en: Plug or cover in loop B open, read as low by the sensing circuit
        de: Stecker oder Deckel in Kreis B offen, von der Messschaltung als niedrig gewertet
    - id: pushed_back_pin
      likelihood: medium
      label:
        en: Pushed-back interlock terminal without contact
        de: Zurückgeschobener Interlock-Kontakt ohne Verbindung
    - id: interlock_source_fault
      likelihood: low
      label:
        en: Interlock source in the monitoring module not delivering its signal
        de: Interlock-Quelle im überwachenden Steuergerät liefert kein Signal
  symptoms:
    - en: No ready mode, HV contactors stay open
      de: Keine Fahrbereitschaft, HV-Schütze bleiben offen
    - en: Hybrid or EV warning lamp, MIL depending on maker
      de: Hybrid- oder EV-Warnleuchte, MIL je nach Hersteller
    - en: Charging not possible
      de: Laden nicht möglich
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3511, U3512, U3514, U3517, P0A0C]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
    - https://www.ti.com/lit/ug/tidud43a/tidud43a.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U3514
  category: network
  title:
    en: High Voltage System Interlock Circuit B High
    de: Hochvoltsystem Interlock-Stromkreis B hoch
  description:
    en: "U3514 means loop B reads higher than allowed: a wire of the loop touches 12 V or another supply, or the loop does not fall back to its low state once the module turns its source off. GM's loop A code checks both states, allowing 24 % of 5 V while the source is off and 44 % while it is on. Ford's interlock patent tests the source line for a short to 12 V before releasing the loop, then stores a trouble code and turns on the Service Soon lamp rather than a general warning. In the reference design from Texas Instruments a short to battery shows up as loop current that no longer follows the commanded on/off pattern. No manufacturer lists U3514 itself. Disconnecting segments one at a time shows where the foreign voltage enters loop B."
    de: "U3514 bedeutet, dass Schleife B höher misst als zulässig: Eine Leitung der Schleife berührt 12 V oder eine andere Versorgung, oder die Schleife fällt nicht in den Ruhezustand zurück, wenn das Steuergerät seine Quelle abschaltet. GMs Code für Schleife A prüft beide Zustände, mit Grenzen von 24 % von 5 V bei abgeschalteter und 44 % bei eingeschalteter Quelle. Fords Interlock-Patent prüft die Quellleitung auf Schluss nach 12 V, bevor die Schleife freigegeben wird, und setzt dann einen Fehlercode samt „Service Soon“-Leuchte statt einer allgemeinen Warnung. Im Referenzdesign von Texas Instruments zeigt sich ein Schluss nach Plus daran, dass der Schleifenstrom dem befohlenen Ein-aus-Muster nicht mehr folgt. U3514 selbst führt kein Hersteller. Wer Abschnitte nacheinander abklemmt, findet, wo die Fremdspannung in Kreis B gelangt."
  affected_components:
    - hvil_loop_b
    - hvil_wiring
  common_causes:
    - id: loop_b_short_to_voltage
      likelihood: high
      label:
        en: Interlock wire of loop B shorted to 12 V or another supply
        de: Interlock-Leitung von Kreis B mit Schluss nach 12 V oder anderer Versorgung
    - id: source_stuck_on
      likelihood: medium
      label:
        en: Interlock source in the module not switching off
        de: Interlock-Quelle im Steuergerät schaltet nicht ab
    - id: water_in_connector
      likelihood: medium
      label:
        en: Water in a connector bridging an interlock pin to a supply pin
        de: Wasser im Stecker verbindet Interlock- und Versorgungskontakt
    - id: wrong_repair_splice
      likelihood: low
      label:
        en: Incorrect splice or add-on wiring after a repair
        de: Falsche Spleißstelle oder Zusatzverkabelung nach einer Reparatur
  symptoms:
    - en: Vehicle will not start or enter ready mode
      de: Fahrzeug startet nicht bzw. geht nicht in Fahrbereitschaft
    - en: Service or HV warning lamp on
      de: Service- oder HV-Warnleuchte an
    - en: Fault stays present with all HV connectors properly mated
      de: Fehler bleibt bestehen, obwohl alle HV-Stecker korrekt sitzen
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
