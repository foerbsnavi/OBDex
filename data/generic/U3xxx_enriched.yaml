- code: U355F
  category: network
  title:
    en: Cathode Backpressure Valve Control Circuit
    de: Kathoden-Gegendruckventil Steuerkreis
  description:
    en: "U355F reports a wiring or output stage fault on the actuator of the valve at the cathode outlet, which throttles the air leaving the stack and thereby sets the pressure the air side runs at. GM moves such a valve in closed loop on a pressure reading, in steps or continuously. U355F itself is absent from public maker documents. For the 2021–22 Mirai, Toyota bulletin T-SB-0043-23 ties a lit MIL to a stuck air pressure regulating valve (P1F6E71), fixed by new EV control software or, since the 2025 revision, a new valve. In a Toyota patent air pressure that repeatedly exceeds about 270 kPa counts as a fault: compressor stopped, air routed into the bypass, valve opened. An open or shorted drive leaves cathode pressure uncontrolled; expect a warning and cut power. Position feedback has its own code, U3560."
    de: Der Code betrifft die Ansteuerung des Ventils am Kathodenaustritt. Es drosselt die abströmende Luft und legt so fest, unter welchem Druck die Luftseite des Stacks arbeitet; GM verstellt es laut Patent stufig oder stufenlos anhand eines Drucksensors. Ist der Ansteuerkreis unterbrochen oder kurzgeschlossen, lässt sich der Kathodendruck nicht mehr führen. Öffentlich nennt kein Hersteller U355F. Toyota belegt beim Mirai 2021–22 für ein klemmendes Luftdruck-Regelventil (P1F6E71) die MIL und hilft mit neuer Software ab, seit der Revision 2025 notfalls mit einem neuen Ventil (T-SB-0043-23). Steigt der Luftdruck wiederholt über etwa 270 kPa, schaltet Toyota laut Patent den Verdichter ab, lenkt die Luft in den Bypass und öffnet das Ventil. Für den Fahrer heißt das Warnmeldung und weniger Leistung. Die Stellungsrückmeldung meldet U3560.
  affected_components:
    - cathode_backpressure_valve
    - valve_wiring
  common_causes:
    - id: harness_connector_cathode_outlet
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of the valve actuator (wet exhaust area)
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker des Ventilantriebs (feuchter Abluftbereich)
    - id: valve_actuator_motor_fault
      likelihood: medium
      label:
        en: Valve motor or actuator winding faulty
        de: Ventilmotor oder Antriebswicklung defekt
    - id: fuel_cell_controller_driver
      likelihood: low
      label:
        en: Driver stage of the fuel cell control unit faulty or software outdated
        de: Endstufe des Brennstoffzellen-Steuergeräts defekt oder Software veraltet
  symptoms:
