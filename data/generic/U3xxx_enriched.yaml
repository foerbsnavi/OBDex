- code: U3509
  category: network
  title:
    en: Control Module Input Power C Circuit Low
    de: Steuergerät Eingangsspannung C Stromkreis niedrig
  description:
    en: U3509 says supply C is too low. In GM's 2016–2019 hybrid OBD tables the electric brake booster sets it when voltage sensor 2, which watches the motor driver supply, reads below 6 V for 90 s while the car travels faster than 4 mph. Unlike the A and B low codes, which are Special Type C without MIL, this one is Type A, lighting the MIL after one failing trip, because the booster motor cannot build assist without this feed. Passing requires a straight drive of at least 3.1 miles. Less than 6 V for that long almost always means an open fuse or wire, a failed connector or a deeply discharged battery rather than a brief dip. Drivers may see a brake warning and feel a harder pedal; check the motor fuse and its ground first.
    de: "U3509 heißt, dass Versorgung C zu niedrig ist. GMs elektrischer Bremskraftverstärker in den Hybridtabellen 2016–2019 setzt ihn, wenn Spannungsfühler 2, der die Versorgung des Motortreibers überwacht, 90 s lang unter 6 V liegt, während das Fahrzeug schneller als 4 mph fährt. Anders als die Codes niedrig für A und B, die als Special Typ C keine MIL auslösen, ist dieser Typ A: MIL schon bei der ersten Fahrt, weil der Verstärkermotor ohne diesen Eingang keine Unterstützung aufbauen kann. Zum Bestehen muss das Auto mindestens 3,1 Meilen geradeaus fahren. So lange unter 6 V bedeutet fast immer eine offene Sicherung oder Leitung, einen ausgefallenen Stecker oder eine tief entladene Batterie, kaum einen kurzen Einbruch. Fahrer sehen womöglich eine Bremswarnung und spüren ein härteres Pedal; zuerst Motorsicherung und Masse prüfen."
  affected_components:
    - module_power_c
    - power_wiring
    - fuse
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Fuse of the motor supply open
        de: Sicherung der Motorversorgung offen
    - id: feed_wire_or_connector
      likelihood: medium
      label:
        en: Broken wire or failed connector in feed C
        de: Unterbrochene Leitung oder ausgefallener Stecker im Zulauf C
    - id: weak_battery
      likelihood: medium
      label:
        en: Deeply discharged 12 V battery
        de: Tief entladene 12-V-Batterie
    - id: module_internal_supply
      likelihood: low
      label:
        en: Internal measurement of feed C faulty
        de: Interne Messung von Eingang C defekt
  symptoms:
    - en: MIL and brake warning on the first trip
      de: MIL und Bremswarnung bei der ersten Fahrt
    - en: Harder brake pedal through missing assist
      de: Härteres Bremspedal durch fehlende Unterstützung
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.3, 2.5]
  flags:
