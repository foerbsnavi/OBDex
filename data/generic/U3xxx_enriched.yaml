- code: U3510
  category: network
  title:
    en: Control Module Missing Calibration
    de: Steuergerät Kalibrierung fehlt
  description:
    en: "U3510 says a control module lacks a calibration it needs: either the data set that adapts its software to the vehicle was never written or got lost, or a learned calibration such as a sensor alignment has not been done. CARB makes every emission-critical unit report a calibration ID and a verification number, so empty or invalid data cannot pass unnoticed. No maker publishes U3510 itself, but related codes show both meanings: Hyundai's chassis code C2702, worded the same way, appears on 2019 Elantra blind-spot radars (bulletin 19-BE-016H, new radar plus mounting-angle check), and Stellantis' C0529-00 for the steering angle sensor of the 2023 Dodge Hornet lit the MIL until the wheel was turned lock to lock (08-148-23, EPS update)."
    de: "U3510 sagt, dass einem Steuergerät eine nötige Kalibrierung fehlt: Entweder wurde der Datensatz, der seine Software ans Fahrzeug anpasst, nie geschrieben oder ging verloren, oder eine angelernte Kalibrierung wie die Ausrichtung eines Sensors steht noch aus. CARB verlangt von jedem abgasrelevanten Gerät eine Kalibrierkennung und eine Prüfnummer, damit leere oder ungültige Daten auffallen. U3510 selbst veröffentlicht kein Hersteller, verwandte Codes zeigen aber beide Bedeutungen: Hyundais C2702 „Control Module Missing Calibration“ tritt an Totwinkel-Radaren des Elantra 2019 auf (Bulletin 19-BE-016H, neues Radar plus Prüfung des Einbauwinkels); Stellantis’ C0529-00 für den Lenkwinkelsensor des Dodge Hornet 2023 ließ die MIL leuchten, bis das Lenkrad einmal von Anschlag zu Anschlag gedreht war (08-148-23, EPS-Update)."
  affected_components:
    - control_module
    - module_eeprom
  common_causes:
    - id: not_programmed_after_replacement
      likelihood: high
      label:
        en: New or used module installed without programming or setup
        de: Neues oder gebrauchtes Steuergerät ohne Programmierung bzw. Einrichtung verbaut
    - id: interrupted_flash
      likelihood: medium
      label:
        en: Software update aborted, e.g. by low 12 V voltage or lost connection
        de: Software-Update abgebrochen, etwa durch zu niedrige 12-V-Spannung oder Verbindungsabbruch
    - id: learn_routine_missing
      likelihood: medium
      label:
        en: Required learn or alignment routine not performed after repair
        de: Nötige Anlern- oder Ausrichtroutine nach der Reparatur nicht durchgeführt
    - id: memory_fault
      likelihood: low
      label:
        en: Internal memory of the module losing its stored data
        de: Interner Speicher des Steuergeräts verliert die abgelegten Daten
  symptoms:
    - en: Function of the affected module unavailable or limited
      de: Funktion des betroffenen Steuergeräts fehlt oder ist eingeschränkt
    - en: Warning lamp of the related system, MIL if the module is OBD-relevant
      de: Warnleuchte des zugehörigen Systems, MIL bei OBD-relevantem Gerät
    - en: Fault appears right after a module replacement or software update
      de: Fehler tritt direkt nach Gerätetausch oder Software-Update auf
