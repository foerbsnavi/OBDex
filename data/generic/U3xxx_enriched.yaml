    - https://static.nhtsa.gov/odi/tsbs/2014/SB-10052449-4313.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U3541
  category: network
  title:
    en: High Voltage System Interlock Circuit O
    de: Hochvoltsystem Interlock-Stromkreis O
  description:
    en: "U3541 denotes trouble on interlock circuit O, the fourteenth loop. What happens next may depend on the operating state. Tesla's 2013 HVIL diagnostic guide for the Model S, published through NHTSA, splits the reaction: in the modes Standby, Support and Charge the battery management stores a fault and opens the contactors, or leaves them open if they already are, whereas in Drive it only raises a warning so that the car does not lose propulsion. A loop O fault that occurs on the move may thus first be noticed as a car that will not restart after parking. No maker documents U3541 or the parts of loop O."
    de: "U3541 bezeichnet eine Störung an Interlock-Kreis O, der vierzehnten Schleife. Wie das System reagiert, kann vom Betriebszustand abhängen. Teslas über die NHTSA veröffentlichter HVIL-Diagnoseleitfaden von 2013 für das Model S unterscheidet: Im Zustand Standby, Support oder Charge legt das Batteriemanagement einen Fehler ab und öffnet die Schütze bzw. lässt sie offen; während der Fahrt (Drive) gibt es nur eine Warnung aus, damit der Antrieb erhalten bleibt. Ein unterwegs aufgetretener Fehler an Kreis O fällt deshalb womöglich erst auf, wenn sich das Fahrzeug nach dem Abstellen nicht mehr starten lässt. Weder U3541 noch die Bauteile von Kreis O dokumentiert ein Hersteller."
  affected_components:
    - hvil_loop_o
    - hv_connectors
  common_causes:
    - id: loop_o_connector_unlatched
      likelihood: high
      label:
        en: Connector in loop O not fully latched
        de: Stecker in Kreis O nicht vollständig eingerastet
    - id: loop_o_harness_damage
      likelihood: medium
      label:
        en: Loop O wiring damaged
        de: Leitung von Kreis O beschädigt
    - id: component_internal_loop_o
      likelihood: low
      label:
        en: Internal fault in an HV component on loop O
        de: Interner Fehler in einer Hochvoltkomponente an Kreis O
  symptoms:
    - en: Warning while driving without loss of drive
      de: Warnung während der Fahrt ohne Antriebsverlust
    - en: No ready mode after the vehicle was switched off
      de: Keine Fahrbereitschaft nach dem Abstellen
    - en: Charging refused
      de: Laden verweigert
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [60, 1500]
    estimated_hours: [0.5, 4]
  flags:
