- code: U3547
  category: network
  title:
    en: High Voltage System Interlock Circuit P Low
    de: Hochvoltsystem Interlock-Stromkreis P niedrig
  description:
    en: "U3547 reports a low value on loop P, and the contactors drop out with it. A design flaw can be the cause too. Kenworth (campaign 25KWC) and Peterbilt (25PBC) recalled battery electric T680E, 520EV and 579EV trucks under NHTSA number 25V181: with certain HVIL circuit layouts in their Accelera power control accessory subsystem, high voltage could be lost and the contactors open without warning, cutting propulsion. The remedy pairs a software check with two overlay harnesses. If a commercial vehicle keeps losing power on loop P, ask for open campaigns before hunting for wiring faults. No maker documents U3547."
    de: "U3547 besagt, dass Kreis P unter seiner unteren Grenze liegt; damit fallen die Schütze ab. Auch ein Konstruktionsfehler kommt als Ursache in Frage. Kenworth (Aktion 25KWC) und Peterbilt (25PBC) haben batterieelektrische Lkw der Typen T680E, 520EV und 579EV unter der NHTSA-Nummer 25V181 zurückgerufen: Bei bestimmten HVIL-Schaltungsvarianten im Nebenaggregate-Steuerteil von Accelera konnte die Hochspannung wegfallen und die Schütze ohne Vorwarnung öffnen, sodass der Antrieb ausfiel. Abhilfe bringen eine Softwareprüfung und zwei zusätzliche Aufsatz-Kabelsätze. Verliert ein Nutzfahrzeug wiederholt die Leistung über Kreis P, zuerst nach offenen Aktionen fragen, dann Leitungen suchen. U3547 dokumentiert kein Hersteller."
  affected_components:
    - hvil_loop_p
    - hvil_wiring
  common_causes:
    - id: hvil_circuit_design_defect
      likelihood: medium
      label:
        en: Interlock circuit layout covered by a recall, overlay harness not yet fitted
        de: Interlock-Schaltung von einem Rückruf betroffen, Zusatzkabelsatz noch nicht eingebaut
    - id: loop_p_plug_open
      likelihood: medium
      label:
        en: Plug in loop P open or interlock pin pushed back
        de: Stecker in Kreis P offen oder Interlock-Kontakt zurückgeschoben
    - id: loop_p_short_to_ground
      likelihood: medium
      label:
        en: Loop P wire shorted to ground
        de: Leitung von Kreis P mit Masseschluss
  symptoms:
