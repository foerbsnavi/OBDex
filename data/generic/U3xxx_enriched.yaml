- code: U3549
  category: network
  title:
    en: Hydrogen Tank High Pressure Sensor 1 Circuit
    de: Wasserstofftank Hochdrucksensor 1 Stromkreis
  description:
    en: "U3549 covers the electrical circuit of the high-pressure sensor that reads hydrogen pressure on the storage side, upstream of the regulator, where a full system holds up to 70 MPa, the ceiling set by FMVSS 308. Its value feeds the fuel gauge, fill logic and leak checks: a Hyundai patent watches it while the parked car briefly wakes, a GM patent trims it against the more precise low-pressure sensor whenever the regulator stands wide open, and Toyota compares the filling-side and supply-side sensors after refuelling. U3549 itself appears in no public manufacturer document. An open, a short or a signal outside its range leaves the gauge and leak monitoring blind; expect a warning and possibly limited power. The supply-line sensors have their own codes, U3564 and U3565."
    de: "Gemeint ist der Stromkreis des Hochdrucksensors auf der Speicherseite, also vor dem Druckminderer. Bei vollem System liegen dort bis zu 70 MPa an – mehr lässt FMVSS 308 nicht zu. Der Messwert dient Tankanzeige, Betankungslogik und Dichtheitskontrolle: Hyundai wertet ihn laut Patent aus, wenn das geparkte Auto kurz aufwacht, GM eicht ihn bei ganz offenem Regler gegen den genaueren Niederdrucksensor, Toyota stellt nach dem Tanken die Sensoren von Befüll- und Versorgungsseite gegenüber. In öffentlichen Herstellerunterlagen kommt U3549 nicht vor. Unterbrechung, Kurzschluss oder ein Wert jenseits des Messbereichs machen Füllstandsberechnung und Leckwache blind; mit Warnmeldung und gegebenenfalls gedrosselter Leistung ist zu rechnen. Für die Sensoren der Versorgungsleitung gibt es U3564 und U3565."
  affected_components:
    - h2_tank_pressure_sensor_1
    - sensor_wiring
  common_causes:
    - id: harness_connector_underbody
      likelihood: high
      label:
        en: Corroded or damaged connector or wiring between sensor and storage controller
        de: Korrodierter oder beschädigter Stecker bzw. Leitung zwischen Sensor und Speichersteuergerät
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: High-pressure sensor faulty internally
        de: Hochdrucksensor intern defekt
    - id: reference_or_ground_fault
      likelihood: low
      label:
        en: Sensor supply voltage or ground missing
        de: Versorgungsspannung oder Masse des Sensors fehlt
    - id: controller_fault
      likelihood: low
      label:
        en: Hydrogen storage control unit faulty
        de: Wasserstoffspeicher-Steuergerät defekt
  symptoms:
    - en: Hydrogen system warning in the instrument cluster
      de: Warnung des Wasserstoffsystems im Kombiinstrument
    - en: Fuel gauge or range display missing or implausible
      de: Tankanzeige oder Reichweite fehlt bzw. unplausibel
    - en: Fuel cell power limited
      de: Leistung der Brennstoffzelle begrenzt
