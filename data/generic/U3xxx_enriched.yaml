- code: U354C
  category: network
  title:
    en: Hydrogen Tank B Temperature Sensor 1 Circuit
    de: Wasserstofftank B Temperatursensor 1 Stromkreis
  description:
    en: "U354C flags the circuit of the first temperature sensor in tank B. The maker decides which tank is B, and every series fuel cell car has at least two: the first Mirai carried tanks of 60.0 and 62.4 litres, the Clarity a main and a sub tank. With several tanks the readings can be checked against each other. A Hyundai patent monitors the sensors of three tanks, judges one defective once it sits 20 °C away from the others and replaces its value with a healthy one, so fill control still respects 85 °C and the fuel quantity stays right. Such comparison targets drifting values; an open or shorted sensor as in U354C is recognised directly. No maker documents the code. Sensor 2 of tank B is U354D."
    de: "Hier meldet das Steuergerät einen Fehler im Stromkreis des ersten Temperatursensors von Tank B. Welcher Behälter B heißt, entscheidet der Hersteller; Serien-Brennstoffzellenautos haben mindestens zwei: der erste Mirai Tanks mit 60,0 und 62,4 Litern, der Clarity einen Haupt- und einen Nebentank. Mehrere Tanks erlauben den Quervergleich. Ein Hyundai-Patent beobachtet die Fühler dreier Tanks, erklärt einen für defekt, wenn er 20 °C von den übrigen abweicht, und setzt an seine Stelle den Wert eines intakten Fühlers – so bleibt die 85-°C-Grenze beim Tanken gewahrt und die Füllmenge stimmt. Das zielt auf abdriftende Werte; Unterbrechung oder Kurzschluss wie bei U354C erkennt das Gerät unmittelbar. Kein Hersteller dokumentiert den Code. Fühler 2 von Tank B: U354D."
  affected_components:
    - h2_tank_b_temp_sensor_1
    - sensor_wiring
  common_causes:
    - id: harness_connector
      likelihood: high
      label:
        en: Open or short in the wiring to tank B
        de: Unterbrechung oder Kurzschluss in der Leitung zu Tank B
    - id: sensor_failed
      likelihood: medium
      label:
        en: Temperature sensor 1 of tank B failed
        de: Temperaturfühler 1 von Tank B ausgefallen
    - id: controller_input
      likelihood: low
      label:
        en: Input stage of the storage control unit faulty
        de: Eingangsstufe des Speichersteuergeräts defekt
  symptoms:
