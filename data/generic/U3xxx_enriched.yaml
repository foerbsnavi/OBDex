    - https://patents.google.com/patent/US5945745A/en
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U3012
  category: network
  title:
    en: Control Module Improper Wake-up Performance
    de: Steuergerät fehlerhaftes Aufwecken Funktion
  description:
    en: "Some modules must wake themselves while the car is parked, for example to run engine-off tests or battery checks, and U3012 reports that this went wrong. Ford's 2023 diesel OBD summary describes the PCM monitor: the code sets if more than two wake-ups happen in the ten minutes before a scheduled alarm wake, or if a requested alarm wake is still missing ten minutes later. GM's 2016 Volt hybrid module checks at power-up whether a self wake-up requested at the last shutdown actually happened, Type A, one trip. In practice the cause is often software: Ford TSB 23-2077 reprograms PCM and TCM on 2022 Super Duty 6.7L trucks with MIL and U3012, and TSB 25-2245 reflashes the ABS module of 2025 F-150s storing U3012:68 with a soft pedal after start-up."
    de: "Manche Steuergeräte müssen sich im abgestellten Fahrzeug selbst wecken, etwa für Prüfungen bei stehendem Motor oder Batteriekontrollen; U3012 meldet, dass das nicht richtig klappte. Fords Diesel-OBD-Zusammenfassung 2023 beschreibt die Überwachung im PCM: Der Code steht, wenn in den zehn Minuten vor einem geplanten Weckzeitpunkt mehr als zwei Aufwachvorgänge stattfinden oder das angeforderte Wecken nach zehn Minuten noch nicht erfolgt ist. GMs Hybridsteuergerät im Volt 2016 prüft beim Einschalten, ob ein beim letzten Abschalten angefordertes Selbstwecken wirklich lief, Typ A nach einer Fahrt. Oft ist Software die Ursache: Ford programmiert mit TSB 23-2077 PCM und TCM der Super Duty 6.7L (2022) mit MIL und U3012 neu, und TSB 25-2245 aktualisiert das ABS-Modul des F-150 2025, das U3012:68 mit weichem Bremspedal nach dem Start speichert."
  affected_components:
    - control_module
    - wakeup_circuit
  common_causes:
    - id: module_software
      likelihood: high
      label:
        en: Module software handling timed wake-ups incorrectly
        de: Steuergeräte-Software verarbeitet zeitgesteuertes Wecken fehlerhaft
    - id: other_module_waking_bus
      likelihood: medium
      label:
        en: Another module or add-on keeping the network awake or waking it repeatedly
        de: Anderes Steuergerät oder Zubehör hält das Netz wach oder weckt es wiederholt
    - id: supply_interrupted
      likelihood: medium
      label:
        en: Battery disconnected or supply lost while a wake-up was pending
        de: Batterie abgeklemmt oder Versorgung weg, während ein Wecken anstand
    - id: wake_circuit_fault
      likelihood: low
      label:
        en: Fault in a hard-wired wake-up line or its connector
        de: Fehler in einer festverdrahteten Weckleitung oder ihrem Stecker
  symptoms:
    - en: Check engine light on with no drivability concern
      de: Motorkontrollleuchte an, ohne spürbare Fahrstörung
    - en: ABS or brake warning and soft pedal right after start-up when the brake module stores it
      de: ABS- oder Bremswarnung und weiches Pedal direkt nach dem Start, wenn das Bremsmodul ihn speichert
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 300]
    estimated_hours: [0.3, 1.5]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3001, U301A, P06E4, P24EF, P2610]
  sources:
    - https://www.fordservicecontent.com/Ford_Content/catalog/motorcraft/obd-summary-diesel-2023.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG01%20Hybrid%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10233589-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11019420-0001.pdf
  reviewed: '2026-11-06'

- code: U3013
  category: network
  title:
    en: Control Module Input Power C Circuit/Open
    de: Steuergerät Eingangsspannung C Stromkreis/Unterbrechung
  description:
    en: U3013 extends the input power family to a third feed, C, and reports it as missing or open. It only exists on modules with at least three separately fused supplies, such as large body or brake units. No manufacturer documents U3013 publicly, and nothing defines which pin is C; that is up to each maker's wiring. The detection principle can be taken from GM's brake module, which compares two battery feeds and flags one as open when it drops to about half of the other for 75 ms (U3006/U3007). CARB requires electronic inputs that the OBD system relies on to be checked for circuit faults, which is the basis for such checks. In practice a single blown fuse, a pushed-out pin or a weak battery is behind it; if C and D appear together, look for a shared fuse or a supply common to both.
    de: U3013 erweitert die Reihe der Versorgungseingänge auf einen dritten Eingang C und meldet ihn als fehlend oder unterbrochen. Ihn gibt es nur bei Geräten mit mindestens drei getrennt abgesicherten Versorgungen, etwa großen Bordnetz- oder Bremssteuergeräten. Kein Hersteller dokumentiert U3013 öffentlich, und nirgends ist festgelegt, welcher Pin C ist; das bestimmt die jeweilige Verkabelung. Das Erkennungsprinzip zeigt GMs Bremssteuergerät, das zwei Batterieeingänge vergleicht und einen als offen wertet, wenn er 75 ms lang auf etwa die Hälfte des anderen sinkt (U3006/U3007). CARB verlangt, dass elektronische Eingänge, auf die sich die Diagnose stützt, auf Kreisfehler geprüft werden. Meist steckt eine Sicherung, ein herausgedrückter Pin oder eine schwache Batterie dahinter; bei C und D zugleich eine gemeinsame Zuleitung suchen.
  affected_components:
    - module_power_c
    - fuse
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Blown fuse in the feed C path
        de: Durchgebrannte Sicherung im Pfad von Eingang C
    - id: connector_or_wire
      likelihood: medium
      label:
        en: Pushed-out pin, corroded terminal or broken wire on supply C
        de: Herausgedrückter Pin, korrodierter Kontakt oder Leitungsbruch an Versorgung C
    - id: weak_battery
      likelihood: medium
      label:
        en: Weak battery or voltage dip during cranking
        de: Schwache Batterie oder Spannungseinbruch beim Anlassen
  symptoms:
    - en: Part of the functions of the affected module dead
      de: Ein Teil der Funktionen des betroffenen Steuergeräts ohne Funktion
    - en: Lost communication codes in other modules if the unit shuts down
      de: Kommunikationsverlust-Codes in anderen Steuergeräten, wenn das Gerät abschaltet
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 300]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3014, U3006, U3007, U3019]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04B.pdf
  reviewed: '2026-11-06'

- code: U3014
  category: network
  title:
    en: Control Module Input Power D Circuit/Open
    de: Steuergerät Eingangsspannung D Stromkreis/Unterbrechung
  description:
    en: U3014 is the fourth member of the input power series and means feed D of a module is absent or open. Four separate feeds are rare, so the code appears mainly on central body controllers or power distribution units with several power stages. As with U3013, no maker publishes a definition for it, and the letter only follows that module's pin plan. Where maker data exists for the A and B codes, the supplies are compared with one another, as in GM's brake module, or a single feed must reach a minimum voltage before a load test. Mazda's SA-023-23 shows how a drained battery leaves supply codes in several modules at once, which is why a single D entry is better explained by its own fuse or pin. Not emission-relevant; whether a lamp lights depends on the module.
    de: U3014 ist das vierte Glied der Versorgungsreihe und bedeutet, dass Eingang D eines Steuergeräts fehlt oder unterbrochen ist. Vier getrennte Versorgungen sind selten, der Code betrifft daher vor allem zentrale Bordnetzsteuergeräte oder Stromverteiler. Wie bei U3013 veröffentlicht kein Hersteller eine Definition; der Buchstabe richtet sich nur nach dem Pinplan des Geräts. Wo Herstellerdaten zu den Codes für A und B vorliegen, werden die Versorgungen gegeneinander verglichen, wie in GMs Bremssteuergerät, oder ein einzelner Eingang muss vor einem Lasttest eine Mindestspannung erreichen. Laut Mazdas SA-023-23 hinterlässt eine entladene Batterie Versorgungscodes in mehreren Modulen zugleich; ein einzelner Eintrag für D deutet eher auf die eigene Sicherung oder den Pin. Nicht abgasrelevant; ob eine Leuchte angeht, hängt vom Steuergerät ab.
  affected_components:
    - module_power_d
    - fuse
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Blown fuse feeding input D
        de: Durchgebrannte Sicherung für Eingang D
    - id: connector_or_wire
      likelihood: medium
      label:
        en: Loose terminal or damaged wire on supply D
        de: Lockerer Kontakt oder beschädigte Leitung an Versorgung D
    - id: weak_battery
      likelihood: low
      label:
        en: Flat battery, then usually with further supply codes in other modules
        de: Leere Batterie, dann meist mit weiteren Versorgungscodes in anderen Modulen
  symptoms:
    - en: Individual consumers or functions of the module not working
      de: Einzelne Verbraucher oder Funktionen des Steuergeräts arbeiten nicht
    - en: Often stored together with other input power codes after a battery problem
      de: Nach Batterieproblemen oft zusammen mit anderen Versorgungscodes gespeichert
