- code: U3539
  category: network
  title:
    en: High Voltage System Interlock Circuit M
    de: Hochvoltsystem Interlock-Stromkreis M
  description:
    en: "U3539 covers a non-specific fault on circuit M, the twelfth interlock loop. Loops J to M only make sense in very extensive high-voltage systems such as trucks, buses, construction or mining machines with interfaces for battery, charging, drive and auxiliaries such as hydraulic pumps or heaters. In a 2026 article a TE Connectivity product manager argues against fitting HVIL everywhere: if analysis shows that only 20 of 50 interfaces on a truck need it, leaving out 30 removes 30 potential failure points, since each loop can trip and halt a working vehicle. No maker documents what loop M covers. A fault there can idle the vehicle while its high-voltage parts are undamaged."
    de: "U3539 umfasst einen unbestimmten Fehler an Kreis M, der zwölften Interlock-Schleife. Die Kreise J bis M ergeben nur in sehr ausgedehnten Hochvoltsystemen Sinn, etwa bei Lkw, Bussen, Bau- oder Bergbaumaschinen mit Schnittstellen für Batterie, Laden, Antrieb und Nebenaggregate wie Heizungen oder Hydraulikpumpen. Ein Produktmanager von TE Connectivity rät in einem Beitrag von 2026, HVIL nicht überall vorzusehen: Ergibt die Analyse, dass nur 20 von 50 Schnittstellen eines Lkw es brauchen, entfallen mit den übrigen 30 ebenso viele mögliche Fehlerquellen, denn jede Schleife kann auslösen und ein intaktes Fahrzeug stilllegen. Was Kreis M umfasst, dokumentiert kein Hersteller. Ein Fehler dort kann das Fahrzeug stoppen, obwohl die Hochvoltteile unversehrt sind."
  affected_components:
    - hvil_loop_m
    - hv_connectors
  common_causes:
    - id: loop_m_connector_unlatched
      likelihood: high
      label:
        en: Connector of an auxiliary or charging interface in loop M not fully latched
        de: Stecker einer Nebenaggregate- oder Ladeschnittstelle in Kreis M nicht vollständig eingerastet
    - id: loop_m_harness_damage
      likelihood: medium
      label:
        en: Loop M wiring damaged on a long run through the vehicle
        de: Leitung von Kreis M auf langem Weg durchs Fahrzeug beschädigt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller monitoring loop M faulty
        de: Steuergerät, das Kreis M überwacht, defekt
  symptoms:
    - en: Vehicle or a high-voltage auxiliary unavailable
      de: Fahrzeug oder ein Hochvolt-Nebenaggregat nicht verfügbar
    - en: High-voltage warning without visible damage
      de: Hochvolt-Warnung ohne sichtbaren Schaden
