- code: U352E
  category: network
  title:
    en: High Voltage System Interlock Circuit J Performance
    de: Hochvoltsystem Interlock-Stromkreis J Funktion
  description:
    en: "U352E reports an implausible result from loop J. Interlocks also guard auxiliary drives outside the traction system. Copeland patented a contactless version for the inverter of a trailer refrigeration unit, which may be fed from a 460 V generator through a rectifier at about 650 V DC: a magnet on each terminal cover faces a Hall sensor in the housing, and the drive releases voltage only while that field is sensed. The patent wants the detection range small, so a cover sitting slightly askew, a deformed gasket or a loosened magnet screw can leave the sensor near its switching point and let the reading flicker. No maker documents U352E. The drive on loop J may cut out at random."
    de: "U352E meldet ein unplausibles Ergebnis von Schleife J. Interlocks sichern auch Nebenantriebe außerhalb des Fahrantriebs. Copeland hat eine berührungslose Lösung für den Frequenzumrichter eines Kühlaufliegers patentiert, der etwa von einem 460-V-Generator über einen Gleichrichter mit rund 650 V Gleichspannung versorgt wird: Ein Magnet an jedem Klemmendeckel sitzt einem Hall-Sensor im Gehäuse gegenüber, und der Umrichter gibt nur Spannung frei, solange dieses Feld erkannt wird. Der Erfassungsbereich soll laut Patent klein sein; ein leicht schief sitzender Deckel, eine verformte Dichtung oder eine gelockerte Magnetschraube können den Sensor daher an seiner Schaltschwelle halten und die Anzeige flackern lassen. Kein Hersteller dokumentiert U352E. Der Antrieb an Kreis J fällt womöglich sporadisch aus."
  affected_components:
    - hvil_loop_j
  common_causes:
    - id: cover_not_seated_evenly
      likelihood: medium
      label:
        en: Cover with interlock sensing seated unevenly or gasket deformed
        de: Deckel mit Interlock-Erkennung ungleichmäßig aufgesetzt oder Dichtung verformt
    - id: loose_contact_loop_j
