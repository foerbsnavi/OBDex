- code: U3532
  category: network
  title:
    en: High Voltage System Interlock Circuit K Performance
    de: Hochvoltsystem Interlock-Stromkreis K Funktion
  description:
    en: "U3532 indicates that loop K does not respond the way the controller expects. Some checks run only while the system powers up. A Ford patent describes one: during precharge a switch holds the high-voltage bus between an upper and a lower level far below operating voltage, and the interlock test takes place inside that window. Too little current then suggests a connector that is not seated, too much a short, and only a passed test lets precharge carry on. A start-only test of this kind can let a marginal contact pass on one key cycle and fail on the next, so the code may come and go between trips. No maker publishes U3532. Expect occasional refusals to become ready."
    de: "U3532 zeigt an, dass Schleife K nicht so reagiert, wie das Steuergerät es erwartet. Manche Prüfungen laufen nur beim Hochfahren des Systems. Ein Ford-Patent beschreibt eine: Während der Vorladung hält ein Schalter den Hochvolt-Bus zwischen einer oberen und einer unteren Spannung weit unter der Betriebsspannung, und in diesem Fenster findet der Interlock-Test statt. Zu wenig Strom spricht dann für einen nicht gesteckten Stecker, zu viel für einen Kurzschluss; nur nach bestandenem Test geht die Vorladung weiter. Ein reiner Starttest lässt einen grenzwertigen Kontakt bei einem Einschalten bestehen und beim nächsten scheitern, sodass der Code von Fahrt zu Fahrt kommen und gehen kann. U3532 veröffentlicht kein Hersteller. Zu erwarten ist, dass das Fahrzeug gelegentlich nicht fahrbereit wird."
  affected_components:
    - hvil_loop_k
  common_causes:
    - id: marginal_contact_loop_k
      likelihood: high
      label:
        en: Marginal contact in a loop K connector that passes some start checks and fails others
        de: Grenzwertiger Kontakt in einem Stecker von Kreis K, der manche Startprüfungen besteht und andere nicht
    - id: precharge_path_fault
      likelihood: low
      label:
        en: Fault in the precharge path disturbing the start-up check
        de: Fehler im Vorladepfad stört die Startprüfung
    - id: controller_software
      likelihood: low
      label:
        en: Controller software with outdated check limits
        de: Steuergeräte-Software mit veralteten Prüfgrenzen
  symptoms:
    - en: Vehicle sometimes does not become ready at switch-on, then works on the next attempt
      de: Fahrzeug wird beim Einschalten manchmal nicht fahrbereit, beim nächsten Versuch aber schon
    - en: Fault stored at start-up rather than while driving
      de: Fehler wird beim Start statt während der Fahrt gespeichert
  repair:
