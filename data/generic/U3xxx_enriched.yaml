- code: U351E
  category: network
  title:
    en: High Voltage System Interlock Circuit E Performance
    de: Hochvoltsystem Interlock-Stromkreis E Funktion
  description:
    en: "U351E points to loop E giving results the module cannot trust, and the doubt may concern the monitoring hardware as much as the wiring. Designers do test their own test circuits: CATL first checks its current-generating stage so that a failing source is not blamed on high-voltage parts, and Sanden's interlock at the plug of an electric A/C compressor also recognises defects of the monitoring device and its loop, not only an unplugged connector. A performance code on loop E can therefore come from a drifting source or detector. No maker publishes U351E. Once wiring and plugs test fine, suspect the controller running the loop."
    de: "U351E zeigt, dass Schleife E Ergebnisse liefert, denen das Steuergerät nicht traut – und der Zweifel kann die Überwachungselektronik ebenso betreffen wie die Leitungen. Entwickler prüfen ihre Prüfschaltung selbst: CATL kontrolliert zuerst die eigene Stromquelle, damit deren Ausfall nicht den Hochvoltteilen angelastet wird, und Sandens Interlock am Stecker eines elektrischen Klimakompressors erkennt auch Defekte der Überwachung und ihrer Schleife, nicht nur einen gezogenen Stecker. Ein Funktionsfehler an Kreis E kann also von driftender Quelle oder Auswertung stammen. Kein Hersteller veröffentlicht U351E. Sind Leitungen und Stecker in Ordnung, rückt das Steuergerät in den Verdacht."
  affected_components:
    - hvil_loop_e
  common_causes:
    - id: interlock_source_drift
      likelihood: medium
      label:
        en: Current or voltage source for loop E drifting in the controller
        de: Strom- oder Spannungsquelle für Kreis E im Steuergerät driftet
    - id: loose_contact_loop_e
      likelihood: medium
      label:
