- code: U3563
  category: network
  title:
    en: Cathode Bypass Valve Position Sensor Circuit
    de: Kathoden-Bypassventil Positionssensor Stromkreis
  description:
    en: U3563 means the position sensor on the cathode bypass valve delivers no usable signal because of a broken wire, a short or a voltage outside its window. Toyota's patent mounts such a valve body position sensor right at the bypass valve, with pressure sensors before and after it; the angle tells the controller how the compressor air is really being split between stack and bypass. A Hydrogenics patent likewise fits angle sensors to the throttle-type valves of its stack. No public manufacturer source names U3563. Without the feedback, the controller has to infer the valve state indirectly, for example from compressor outlet pressure or stack current as Toyota describes, and will usually restrict operation. Drive faults of the valve are U3561, a mechanically misbehaving valve U3562.
    de: Der Stellungsgeber am Kathoden-Bypassventil liefert kein verwertbares Signal – wegen Unterbrechung, Kurzschluss oder einer Spannung außerhalb des erlaubten Fensters. Im Toyota-Patent sitzt ein solcher Geber direkt am Bypassventil, flankiert von Drucksensoren davor und dahinter; über die Stellung weiß das Steuergerät, wie sich die Verdichterluft tatsächlich auf Stack und Bypass verteilt. Auch Hydrogenics stattet die Drosselventile seines Systems mit Winkelgebern aus. Eine öffentliche Herstellerquelle für U3563 existiert nicht. Fehlt die Rückmeldung, muss das Steuergerät den Ventilzustand indirekt erschließen, etwa wie bei Toyota über den Druck hinter dem Verdichter oder den Stackstrom, und schränkt den Betrieb in der Regel ein. Ansteuerfehler meldet U3561, eine mechanische Fehlfunktion U3562.
  affected_components:
    - cathode_bypass_valve_position_sensor
    - sensor_wiring
  common_causes:
    - id: sensor_connector_wiring
      likelihood: high
      label:
        en: Open, short or moisture in the position sensor wiring or connector
        de: Unterbrechung, Kurzschluss oder Feuchtigkeit an Leitung oder Stecker des Stellungsgebers
    - id: position_sensor_internal_fault
      likelihood: medium
      label:
        en: Position sensor in the valve unit faulty
        de: Stellungsgeber in der Ventileinheit defekt
    - id: sensor_supply_ground_fault
      likelihood: low
      label:
        en: Shared 5 V supply or ground faulty (often with other sensor codes)
        de: Gemeinsame 5-V-Versorgung oder Masse gestört (oft mit weiteren Sensorcodes)
