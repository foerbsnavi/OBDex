- code: U3005
  category: network
  title:
    en: Retained Accessory Power
    de: Zubehörstrom-Nachlauf (RAP)
  description:
    en: "U3005 relates to retained accessory power (RAP), which keeps radio, windows or sunroof alive for a while after the key is switched off. GM's truck manual explains the logic: the body module holds its internal RAP relay for about ten minutes after key-off, and ends RAP early when a door opens or battery voltage sinks below a calibrated limit; some modules get the RAP state as a bus message instead. No manufacturer documents U3005 itself publicly, so the code most likely flags a RAP output or message that does not follow these rules. GM's PIE0724 for 2022 Silverado, Sierra and Envision shows the typical consequence of a RAP fault: radio still on afterwards and a dead battery, checked with a parasitic draw test against 50 mA. Not emission-related, no MIL."
    de: "U3005 bezieht sich auf den Zubehörstrom-Nachlauf (RAP), der Radio, Fenster oder Schiebedach nach dem Abstellen noch eine Weile versorgt. GMs Handbuch für Pick-ups erklärt die Logik: Das Bordnetzsteuergerät hält sein internes RAP-Relais etwa zehn Minuten nach dem Ausschalten und beendet den Nachlauf früher, wenn eine Tür öffnet oder die Batteriespannung unter eine kalibrierte Grenze fällt; manche Module bekommen den Zustand als Busbotschaft. Kein Hersteller beschreibt U3005 selbst öffentlich; vermutlich meldet der Code einen Ausgang oder eine Botschaft, die sich nicht an diese Regeln hält. GMs PIE0724 für Silverado, Sierra und Envision 2022 zeigt die typische Folge eines RAP-Fehlers: Das Radio bleibt an, die Batterie wird leer, geprüft per Ruhestrommessung gegen 50 mA. Nicht abgasrelevant, keine MIL."
  affected_components:
    - rap_relay
    - body_control_module
  common_causes:
    - id: rap_relay_stuck
      likelihood: medium
      label:
        en: RAP relay or output stage staying on or not switching on
        de: RAP-Relais oder Endstufe bleibt an oder schaltet nicht ein
    - id: door_switch_signal
      likelihood: medium
      label:
        en: Faulty door switch signal, so RAP is not ended on door opening
        de: Fehlerhaftes Türkontaktsignal, Nachlauf endet beim Türöffnen nicht
    - id: module_software
      likelihood: medium
      label:
        en: Body module or radio software handling the RAP state wrongly
        de: Software von Bordnetzsteuergerät oder Radio behandelt den Nachlauf falsch
    - id: wiring_backfeed
      likelihood: low
      label:
        en: Wiring fault or add-on device back-feeding the accessory circuit
        de: Leitungsfehler oder Zusatzgerät speist in den Zubehörkreis zurück
  symptoms:
    - en: Radio, windows or sunroof working long after key-off or not at all after key-off
      de: Radio, Fenster oder Schiebedach laufen lange nach dem Abstellen weiter oder gar nicht
    - en: High parasitic drain and flat battery
      de: Hoher Ruhestrom und leere Batterie
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
