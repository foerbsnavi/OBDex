- code: U3533
  category: network
  title:
    en: High Voltage System Interlock Circuit K Low
    de: Hochvoltsystem Interlock-Stromkreis K niedrig
  description:
    en: "U3533 says loop K reads too low. Apart from an open plug, part of the loop current may be escaping somewhere. Tesla's HVIL tech note for the Model S describes two such cases: a drive inverter whose control board leaked some of the nominal 20 mA loop current to ground, and a loop wire squeezed against ground close to a seat belt pretensioner. The fault therefore need not sit in a connector at all; a component on the loop or a wire trapped by seat or trim parts can cause it. When every plug of loop K is latched and the value stays low, measure the loop current at each component and inspect wiring near seat mounts. No maker documents U3533; the contactors remain open."
    de: "U3533 meldet, dass Schleife K zu niedrig liegt. Neben einem offenen Stecker kann ein Teil des Schleifenstroms irgendwo abfließen. Teslas HVIL-Technotiz zum Model S beschreibt zwei solche Fälle: einen Antriebswechselrichter, dessen Steuerplatine einen Teil der nominell 20 mA Schleifenstrom nach Masse ableitete, und eine Schleifenleitung, die nahe einem Gurtstraffer gegen Masse gequetscht war. Der Fehler muss also gar nicht in einem Stecker sitzen; auch ein Bauteil an der Schleife oder eine von Sitz oder Verkleidung eingeklemmte Leitung kommt infrage. Sind alle Stecker von Kreis K eingerastet und bleibt der Wert niedrig, den Schleifenstrom an jedem Bauteil messen und die Leitungen an Sitzbefestigungen prüfen. U3533 dokumentiert kein Hersteller; die Schütze bleiben offen."
  affected_components:
    - hvil_loop_k
    - hvil_wiring
  common_causes:
    - id: loop_k_wire_pinched
      likelihood: high
      label:
        en: Loop K wire squeezed against ground by seat, trim or mounting parts
        de: Leitung von Kreis K von Sitz, Verkleidung oder Halterung gegen Masse gequetscht
    - id: loop_k_plug_open
      likelihood: medium
      label:
        en: Plug within loop K not connected
        de: Stecker in Kreis K nicht gesteckt
    - id: component_leaks_loop_current
      likelihood: low
      label:
        en: High-voltage component on loop K leaking loop current to ground internally
        de: Hochvoltbauteil an Kreis K leitet Schleifenstrom intern nach Masse ab
  symptoms:
    - en: Vehicle does not reach ready mode
      de: Fahrzeug wird nicht fahrbereit
    - en: Fault may follow work on seats or interior trim
      de: Fehler womöglich nach Arbeiten an Sitzen oder Innenverkleidung
    - en: Warning to have the high-voltage system checked
      de: Aufforderung, das Hochvoltsystem prüfen zu lassen
  repair:
