      de: Schlagartiger Antriebsverlust, oft mit Aufforderung zum sicheren Anhalten
    - en: Vehicle cannot be restarted in ready mode
      de: Fahrzeug lässt sich nicht wieder fahrbereit schalten
    - en: Charging aborted or impossible
      de: Laden bricht ab oder ist nicht möglich
