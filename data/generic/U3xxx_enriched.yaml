- code: U3540
  category: network
  title:
    en: High Voltage System Interlock Circuit N High
    de: Hochvoltsystem Interlock-Stromkreis N hoch
  description:
    en: U3540 reports loop N on the high side of its permitted window. In converted or repowered vehicles the installer often assembles the loop. The hardware manual of BorgWarner's Cascadia Motion CM inverters offers a pin pair, HVIL_IN and HVIL_OUT, that is bridged inside once every HV plug of the inverter is fitted, and leaves the safety of the whole installation to the installer. Each unit chained in this way adds pins, crimps and splices. Where the controller injects a fixed current, as in Tesla's Model S loop, every added ohm lifts the measured voltage. No maker documents U3540. Check adapter harnesses and added joints first.
    de: U3540 meldet Kreis N über seiner oberen Grenze. In umgebauten oder neu motorisierten Fahrzeugen stellt oft der Umrüster die Schleife zusammen. Das Hardware-Handbuch der Cascadia-Motion-Wechselrichter der Baureihe CM von BorgWarner sieht dafür ein Pinpaar HVIL_IN und HVIL_OUT vor, das intern durchverbunden ist, sobald alle Hochvoltstecker des Geräts sitzen, und überträgt die Verantwortung für die Sicherheit der gesamten Anlage dem Einbauer. Jedes so eingereihte Gerät bringt weitere Kontakte, Crimpungen und Verbindungsstellen mit. Speist das Steuergerät einen festen Strom ein, wie bei Teslas Model S, hebt jedes zusätzliche Ohm die gemessene Spannung. U3540 dokumentiert kein Hersteller. Zuerst Adapterkabel und nachträgliche Verbindungen prüfen.
  affected_components:
    - hvil_loop_n
    - hvil_wiring
  common_causes:
    - id: added_resistance_in_retrofit
      likelihood: high
      label:
        en: Extra contacts, splices or adapter harnesses from a conversion raise loop N resistance
        de: Zusätzliche Kontakte, Verbindungen oder Adapterkabel eines Umbaus erhöhen den Widerstand von Kreis N
    - id: loop_n_short_to_battery
      likelihood: medium
      label:
        en: Loop N wire shorted to a 12 V or 24 V feed
        de: Leitung von Kreis N mit Schluss nach 12 V oder 24 V
    - id: poor_crimp_loop_n
      likelihood: medium
      label:
        en: Poorly crimped or loose interlock terminal
        de: Schlecht gecrimpter oder lockerer Interlock-Kontakt
  symptoms:
    - en: No ready mode right after a conversion or component swap
      de: Keine Fahrbereitschaft direkt nach Umbau oder Komponententausch
    - en: High-voltage system warning
      de: Warnmeldung zum Hochvoltsystem
    - en: Charging blocked
      de: Laden gesperrt
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [60, 1200]
    estimated_hours: [0.5, 4]
  flags:
