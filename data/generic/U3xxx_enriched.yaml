- code: U353E
  category: network
  title:
    en: High Voltage System Interlock Circuit N Performance
    de: Hochvoltsystem Interlock-Stromkreis N Funktion
  description:
    en: U353E marks loop N as implausible. Such a verdict can stem from electrical interference rather than from the loop wiring. Tesla bulletin SB-25-17-005 for 2023 and 2024 Model Y cars describes the centre high mounted stop lamp disturbing the supply line of the high-voltage controller, which set HVIL alerts on an intact loop; the fix is a ferrite clipped around the thickest tan wire of that harness branch. A fault that coincides with braking or with other loads switching on suggests similar coupling on loop N. No maker documents U353E. Wiring checks then find nothing, and the warning may clear by itself.
    de: U353E meldet Kreis N als unplausibel. Ein solches Urteil kann von elektrischer Störeinkopplung herrühren statt von der Schleifenverdrahtung. Tesla beschreibt im Bulletin SB-25-17-005 für das Model Y der Baujahre 2023 und 2024, dass die dritte Bremsleuchte die Versorgungsleitung des Hochvolt-Steuergeräts stört und so HVIL-Meldungen bei intakter Schleife auslöst; abgestellt wird das mit einem Ferritkern um die dickste hellbraune Ader dieses Kabelzweigs. Tritt der Fehler gemeinsam mit dem Bremsen oder dem Zuschalten anderer Verbraucher auf, liegt eine ähnliche Kopplung an Kreis N nahe. U353E dokumentiert kein Hersteller. Leitungsprüfungen bleiben dann ohne Befund, und die Warnung verschwindet mitunter von selbst.
  affected_components:
    - hvil_loop_n
  common_causes:
    - id: emi_on_controller_supply
      likelihood: medium
      label:
        en: Interference from another load coupling into the supply of the monitoring controller
        de: Störung eines anderen Verbrauchers, die in die Versorgung des überwachenden Steuergeräts einkoppelt
    - id: loose_contact_loop_n
      likelihood: medium
      label:
        en: Loose contact in a loop N connector
        de: Wackelkontakt in einem Stecker von Kreis N
    - id: missing_ferrite_or_shield
      likelihood: low
      label:
        en: Ferrite or shielding missing after harness repair
        de: Ferritkern oder Schirmung nach Kabelreparatur nicht wieder angebracht
    - id: controller_software
      likelihood: low
      label:
        en: Evaluation software of the controller too sensitive
        de: Auswertesoftware des Steuergeräts zu empfindlich
  symptoms:
    - en: High-voltage warning that appears briefly, sometimes when braking
      de: Kurz auftauchende Hochvoltwarnung, teils beim Bremsen
    - en: No fault found on loop resistance checks
      de: Messung des Schleifenwiderstands ohne Befund
    - en: Occasional refusal to become ready
      de: Gelegentlich keine Fahrbereitschaft
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 800]
    estimated_hours: [0.5, 3]
  flags:
    mil: true
    emissions_relevant: false
