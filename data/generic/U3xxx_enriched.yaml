- code: U351F
  category: network
  title:
    en: High Voltage System Interlock Circuit E Low
    de: Hochvoltsystem Interlock-Stromkreis E niedrig
  description:
    en: "U351F reports a low reading on interlock loop E, the usual result when a plug in that loop is separated or one of its wires is grounded. The US standard FMVSS 305a explains the hurry: a high-voltage connector that can be pulled without tools may, as one permitted option, bring its live parts to 60 V DC or less within one second of separation. The interlock gives the early signal for that; Texas Instruments describes the follow-up of stopping traction, opening the power relays and discharging the DC-link capacitors. No maker documents U351F. Expect abrupt loss of drive power and no restart until loop E reads normal."
    de: "U351F meldet einen zu niedrigen Wert an Interlock-Schleife E – typisch, wenn ein Stecker dieser Schleife getrennt oder eine ihrer Leitungen an Masse geraten ist. Die Eile erklärt die US-Norm FMVSS 305a: Ein Hochvoltstecker, der sich ohne Werkzeug abziehen lässt, darf als eine zulässige Lösung seine aktiven Teile binnen einer Sekunde nach dem Trennen auf höchstens 60 V Gleichspannung bringen. Das Interlock liefert dafür das frühe Signal; Texas Instruments beschreibt die Folge aus Antrieb stoppen, Leistungsrelais öffnen und Zwischenkreiskondensatoren entladen. Kein Hersteller dokumentiert U351F. Zu erwarten ist ein schlagartiger Antriebsverlust, ein Neustart gelingt erst bei normalem Wert an Kreis E."
  affected_components:
    - hvil_loop_e
    - hvil_wiring
  common_causes:
    - id: loop_e_plug_separated
      likelihood: high
      label:
        en: High-voltage plug with interlock in loop E pulled or backed out
        de: Hochvoltstecker mit Interlock in Kreis E abgezogen oder herausgerutscht
    - id: loop_e_short_to_ground
      likelihood: medium
      label:
        en: Loop E wire chafed through to ground
        de: Leitung von Kreis E an Masse durchgescheuert
    - id: pushed_back_pin
      likelihood: medium
      label:
        en: Interlock pin pushed back in its housing
        de: Interlock-Kontakt im Steckergehäuse zurückgeschoben
  symptoms:
