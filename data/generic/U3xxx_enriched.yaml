- code: U3018
  category: network
  title:
    en: Control Module Input Power Circuit A/B Correlation
    de: Steuergerät Eingangsspannung Stromkreis A/B Korrelation
  description:
    en: "Where a module has two separate battery feeds, U3018 says that feed A and feed B no longer agree. In GM's 2025 body control module tables (25OBDG04B, 25OBDG03B) the two measured voltages are compared while a battery is detected and the starter is not engaged; a gap above 4 V in 4 s of a 5 s window fails the test, Type B. GM's electric brake booster in the 2016 and 2018 hybrid tables checks battery supply against the module's own supply instead and fails at a difference above 7 V within 0.01 s, Type A, because the booster's master switch needs a firm supply. In practice one feed is usually dead: GM's PIT5869/PIT5869A for 2021–2024 Tahoe, Suburban, Yukon and Escalade pair U3018 with U3505 and warm A/C when a shorted console lamp wire blows fuse F4DR of the second BCM feed."
    de: "Hat ein Steuergerät zwei getrennte Batterieeingänge, meldet U3018, dass Eingang A und B nicht mehr zusammenpassen. In GMs Tabellen für das Karosseriesteuergerät 2025 (25OBDG04B, 25OBDG03B) werden beide Spannungen verglichen, solange eine Batterie erkannt ist und der Anlasser nicht dreht; eine Differenz über 4 V in 4 s eines 5-s-Fensters gilt als Fehler, Typ B. GMs elektrischer Bremskraftverstärker (Hybridtabellen 2016/2018) vergleicht Batteriespannung und interne Versorgung und setzt den Code bei über 7 V Unterschied binnen 0,01 s, Typ A, weil sein Hauptschalter sichere Spannung braucht. Meist ist ein Eingang ausgefallen: GMs PIT5869/PIT5869A (Tahoe, Suburban, Yukon, Escalade 2021–2024) nennt U3018 mit U3505 und warmer Klimaanlage, wenn die Leitung der Konsolenleuchte kurzschließt und Sicherung F4DR des BCM 2 auslöst."
  affected_components:
    - module_power_a
    - module_power_b
    - fuse
  common_causes:
    - id: blown_fuse_one_feed
      likelihood: high
      label:
        en: Blown fuse on one of the two feeds, often from a short on a load circuit sharing it
        de: Ausgelöste Sicherung an einem der beiden Eingänge, oft durch Kurzschluss eines mitversorgten Verbrauchers
    - id: feed_wiring_connection
      likelihood: medium
      label:
        en: High resistance or loose terminal in one feed wire
        de: Übergangswiderstand oder lockerer Kontakt in einer Versorgungsleitung
    - id: battery_weak
      likelihood: low
      label:
        en: Weak battery causing uneven voltage drops between feeds
        de: Schwache Batterie mit ungleichen Spannungseinbrüchen an den Eingängen
    - id: module_internal
      likelihood: low
      label:
        en: Faulty voltage measurement inside the module
        de: Fehlerhafte Spannungsmessung im Steuergerät
  symptoms:
    - en: Service engine soon lamp or system warning, depending on the module
      de: Motorkontrollleuchte oder Systemwarnung, je nach Steuergerät
    - en: Functions on the dead feed stop working, e.g. A/C blowing warm
      de: Funktionen am ausgefallenen Eingang versagen, etwa warme Luft aus der Klimaanlage
    - en: Logged together with a low-voltage code for feed A or B
      de: Eingetragen zusammen mit einem Unterspannungscode für Eingang A oder B
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 400]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3019, U3006, U3007, U3501, U3505]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04B.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/tsbs/2021/MC-10204460-9999.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10247770-9999.pdf
  reviewed: '2026-11-06'

- code: U3019
  category: network
  title:
    en: Control Module Input Power Circuit B/C Correlation
    de: Steuergerät Eingangsspannung Stromkreis B/C Korrelation
  description:
    en: U3019 pairs the second and third supply of a module and reports that they drift apart. The one published use comes from GM's electric brake booster module in the 2016 and 2018 hybrid tables (16OBDG02, 18OBDG01). There, one voltage sensor watches the booster circuit supply and a second one the supply of the motor driver; the module divides the two readings and sets U3019 when the ratio rises above 1.321 or falls below 0.766 for 2 s while running or shutting down. GM describes this as a check for drift of the voltage divider, so besides a weak feed a measuring fault inside the module is a real candidate. The code is Type A, meaning MIL on the first trip, and it passes after about 5 s with ignition on. Because the booster supports braking, expect a brake warning and possibly reduced assist.
    de: U3019 bildet das Paar aus zweitem und drittem Versorgungseingang und meldet, dass beide auseinanderlaufen. Belegt ist der Code im elektrischen Bremskraftverstärker von GM in den Hybridtabellen 2016 und 2018 (16OBDG02, 18OBDG01). Ein Spannungsfühler misst dort die Versorgung des Verstärkerkreises, ein zweiter die der Motorendstufe; das Steuergerät teilt beide Werte und setzt U3019, wenn das Verhältnis 2 s lang über 1,321 oder unter 0,766 liegt, im Betrieb oder beim Herunterfahren. GM nennt das eine Prüfung auf Drift des Spannungsteilers, deshalb kommt neben einem schwachen Eingang auch ein Messfehler im Gerät selbst ernsthaft in Frage. Typ A, also MIL schon in der ersten Fahrt; bestanden ist die Prüfung nach rund 5 s Zündung an. Weil der Verstärker das Bremsen unterstützt, sind eine Bremswarnung und geringere Unterstützung zu erwarten.
  affected_components:
    - module_power_b
    - module_power_c
    - brake_booster_module
  common_causes:
    - id: feed_resistance
      likelihood: medium
      label:
        en: Voltage loss on one feed from a corroded fuse, terminal or splice
        de: Spannungsverlust an einem Eingang durch korrodierte Sicherung, Klemme oder Verbindung
    - id: module_divider_drift
      likelihood: medium
      label:
        en: Drift of the voltage divider or sensor inside the module
        de: Drift des Spannungsteilers oder Fühlers im Steuergerät
    - id: motor_driver_load
      likelihood: low
      label:
        en: Motor driver supply sagging under load from a faulty booster motor stage
        de: Versorgung der Motorendstufe bricht unter Last einer fehlerhaften Endstufe ein
  symptoms:
    - en: MIL and brake system warning on the first trip
      de: MIL und Bremssystemwarnung schon in der ersten Fahrt
    - en: Reduced or harder brake pedal assist
      de: Geringere Bremskraftunterstützung, härteres Pedal
    - en: Often stored with input power low or high codes of the same module
      de: Oft zusammen mit Unter- oder Überspannungscodes desselben Steuergeräts
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [20, 1500]
    estimated_hours: [0.5, 3]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3018, U3007, U3013, U3505, U3509]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2018/18OBDG01%20Hybrid%20Diagnostics.pdf
  reviewed: '2026-11-06'

- code: U301A
  category: network
  title:
    en: Control Module Wake-up Circuit A/Open
    de: Steuergerät Weckleitung A Stromkreis/Unterbrechung
  description:
    en: "A wake-up circuit is a separate wire that rouses a sleeping module without bus traffic, for example when a charge cable is plugged in or another controller needs it. U301A reports that line A has lost continuity, so no valid signal reaches the input. Ford's 2019 hybrid OBD summary shows such a line in use: the battery energy control module relies on a hardwired charge wake-up signal before it runs its charging and contactor checks. No manufacturer documents U301A publicly. GM's PIT6198 for 2019–2022 Silverado and Sierra shows the consequence of a lost wake input at the ECM (circuit 5985, about 12 V with the BCM awake): other modules report U0100 and the service engine lamp comes on, with possible shift complaints. An open wake line usually means the module stays asleep or joins late."
    de: "Eine Weckleitung ist ein eigener Draht, der ein schlafendes Steuergerät ohne Busverkehr aufweckt, etwa beim Einstecken des Ladekabels oder wenn ein anderes Gerät es braucht. U301A meldet, dass Leitung A keinen Durchgang mehr hat und am Eingang kein gültiges Signal ankommt. Fords Hybrid-OBD-Übersicht 2019 zeigt eine solche Leitung im Einsatz: Das Batteriesteuergerät wartet auf ein fest verdrahtetes Lade-Wecksignal, bevor es Lade- und Schützprüfungen ausführt. Kein Hersteller dokumentiert U301A öffentlich. GMs PIT6198 zu Silverado und Sierra 2019–2022 zeigt die Folgen eines fehlenden Weckeingangs am Motorsteuergerät (Kreis 5985, rund 12 V bei wachem BCM): Andere Geräte melden U0100, die Motorkontrollleuchte geht an, teils mit Schaltbeschwerden. Eine offene Weckleitung heißt meist, dass das Gerät schläft oder verspätet dazukommt."
  affected_components:
    - wakeup_circuit_a
    - wakeup_wiring
  common_causes:
    - id: wake_wire_open
      likelihood: high
      label:
        en: Broken wake-up wire or pushed-out connector pin
        de: Gebrochene Weckleitung oder zurückgeschobener Steckerpin
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose contact at the sending or receiving module
        de: Korrodierter oder lockerer Kontakt am sendenden oder empfangenden Gerät
    - id: sending_module_no_output
      likelihood: medium
      label:
        en: Sending module or charger not driving the wake-up output
        de: Sendendes Gerät oder Ladegerät steuert den Weckausgang nicht an
    - id: wake_fuse_open
      likelihood: low
      label:
        en: Blown fuse in a supply-fed wake circuit
        de: Durchgebrannte Sicherung in einem aus der Versorgung gespeisten Weckkreis
  symptoms:
    - en: Module does not respond, other modules report lost communication
      de: Gerät antwortet nicht, andere Steuergeräte melden Kommunikationsverlust
    - en: Charging or a function that needs the wake-up does not start
      de: Laden oder eine Funktion, die das Wecken braucht, startet nicht
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U301B, U301C, U301D, U301E, U3012]
  sources:
    - https://www.fordservicecontent.com/Ford_Content/catalog/motorcraft/OBDSM1901_HEV.pdf
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-11007183-0001.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U301B
  category: network
  title:
    en: Control Module Wake-up Circuit A Low
    de: Steuergerät Weckleitung A niedrig
  description:
    en: U301B means wake-up line A sits below its expected level, typically because it touches ground or is pulled down by a faulty sender. What happens next depends on how the receiving chip works. NXP's CAN transceiver TJA1043, for example, wakes on a change of the WAKE pin in either direction once the new level has stayed stable for a short filter time, and its switching threshold lies a few volts below battery voltage (typically battery minus 2.5 V). A line clamped to ground therefore produces no further edge and acts like an unused pin, so the module stays asleep when it should start. A wire that only sags, for example through corrosion, can drop under the threshold too. No manufacturer documents U301B publicly; compared with U301A, look first for chafing against body metal.
    de: U301B bedeutet, dass Weckleitung A unter ihrem erwarteten Pegel liegt, meist weil sie Masse berührt oder ein defekter Sender sie herunterzieht. Was dann geschieht, hängt vom Empfängerbaustein ab. NXPs CAN-Transceiver TJA1043 etwa wacht bei einem Pegelwechsel am WAKE-Pin in beide Richtungen auf, sobald der neue Pegel eine kurze Filterzeit stabil war, und seine Schaltschwelle liegt einige Volt unter der Batteriespannung (typisch Batterie minus 2,5 V). Eine auf Masse festgelegte Leitung erzeugt also keine weitere Flanke und wirkt wie ein unbenutzter Pin – das Gerät bleibt im Schlaf, obwohl es starten sollte. Auch eine nur durchhängende Leitung, etwa durch Korrosion, kann unter die Schwelle rutschen. Kein Hersteller dokumentiert U301B öffentlich; anders als bei U301A zuerst nach Scheuerstellen an Karosserieblech suchen.
  affected_components:
    - wakeup_circuit_a
    - wakeup_wiring
  common_causes:
    - id: wake_wire_short_ground
      likelihood: high
      label:
        en: Wake-up wire chafed through and touching ground
        de: Weckleitung durchgescheuert und mit Masse in Kontakt
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corrosion or moisture pulling the level down at a connector
        de: Korrosion oder Feuchtigkeit zieht den Pegel am Stecker herunter
    - id: sending_module_output_low
      likelihood: medium
      label:
        en: Sending module output stuck low
        de: Ausgang des sendenden Geräts hängt auf niedrig
  symptoms:
    - en: Module stays asleep, function or charging unavailable
      de: Gerät bleibt im Schlaf, Funktion oder Laden nicht verfügbar
    - en: Lost-communication codes in other modules
      de: Codes für Kommunikationsverlust in anderen Steuergeräten
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
