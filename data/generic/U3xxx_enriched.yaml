- code: U3574
  category: network
  title:
    en: Coolant Mixing Valve
    de: Kühlmittel-Mischventil
  description:
    en: "U3574 serves as the catch-all for the coolant mixing valve when the trouble lies in its behaviour rather than its wiring: it sticks, moves too slowly or misses the commanded split between radiator and bypass. Temperatures reveal it, because GM sets stack outlet temperature with this valve and the inlet-to-outlet difference with pump speed, so a jammed valve upsets both. Toyota plans for the case: before each start the valve runs to a fully open end position to reset its zero point, and in one variant it is left open toward the radiator at shutdown, so a valve that seizes later still cools the stack. Hyundai patented a lower-friction plunger seal for its stack coolant valve against leaks and wear. No maker documents U3574 publicly. Expect a warning, swinging temperatures and less power."
    de: "U3574 fasst Fehler zusammen, bei denen das Mischventil elektrisch in Ordnung ist, sich aber falsch verhält: Es klemmt, verstellt sich zu träge oder erreicht die vorgegebene Aufteilung zwischen Kühler und Bypass nicht. Sichtbar wird das an den Temperaturen, denn GM regelt über dieses Ventil die Austrittstemperatur des Stacks und über die Pumpendrehzahl den Temperaturhub zwischen Ein- und Austritt. Toyota sorgt laut Patent für diesen Fall vor: Vor dem Start fährt das Ventil zum Nullpunktabgleich in eine Endlage, in einer Variante bleibt es beim Abstellen zum Kühler hin offen, damit auch ein später festsitzendes Ventil den Stack noch kühlt. Hyundai hat für sein Stack-Kühlmittelventil eine reibungsärmere, dichtere Kolbenabdichtung patentiert. Öffentlich belegt ist U3574 nicht. Folgen: Warnung, schwankende Temperaturen, weniger Leistung."
  affected_components:
    - coolant_mixing_valve
  common_causes:
    - id: valve_sticking_deposits
      likelihood: medium
      label:
        en: Valve element sticking from deposits, worn seal or unsuitable coolant
        de: Ventilkörper klemmt durch Ablagerungen, verschlissene Dichtung oder ungeeignetes Kühlmittel
    - id: valve_actuator_gear_wear
      likelihood: medium
      label:
        en: Actuator gear or motor worn, valve moves sluggishly
        de: Getriebe oder Motor des Stellantriebs verschlissen, Ventil bewegt sich träge
    - id: valve_internal_leak
      likelihood: low
      label:
        en: Internal leak, coolant passes the closed port
        de: Innere Undichtigkeit, Kühlmittel strömt am geschlossenen Anschluss vorbei
    - id: air_in_coolant_loop
      likelihood: low
      label:
        en: Air in the stack coolant loop after service distorting the temperature response
        de: Luft im Stack-Kühlkreis nach einer Wartung verfälscht das Temperaturverhalten
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Stack temperature swings or stays too high under load
      de: Stacktemperatur schwankt oder bleibt unter Last zu hoch
    - en: Reduced power, slow warm-up in cold weather
      de: Weniger Leistung, langsames Warmwerden bei Kälte
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [250, 1500]
    estimated_hours: [1, 4]
  flags:
    mil: true
    emissions_relevant: false
