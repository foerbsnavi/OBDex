- code: U3518
  category: network
  title:
    en: High Voltage System Interlock Circuit C High
    de: Hochvoltsystem Interlock-Stromkreis C hoch
  description:
    en: U3518 is stored when loop C reads above its upper limit, usually a loop wire shorted to 12 V, to the wire of another loop in a shared connector, or a source stage that no longer switches off. Volvo's two-loop patent couples loops only through a galvanically isolated relay, so foreign voltage from one loop is not meant to reach another; where wires of different loops share a connector, damage can still bridge them. Ford's patent stores a code and switches on its Service Soon lamp once an interlock circuit is shorted high, and Texas Instruments shows that the loop current then stops following the commanded pattern. No maker documents U3518. The HV system stays off; inspect connectors that carry interlock pins of several loops first.
    de: U3518 wird abgelegt, wenn Schleife C über ihrer Obergrenze misst – meist eine Schleifenleitung mit Schluss nach 12 V, zur Leitung einer anderen Schleife im gemeinsamen Stecker, oder eine Quellstufe, die nicht mehr abschaltet. Volvos Zwei-Schleifen-Patent koppelt die Kreise nur über ein galvanisch getrenntes Relais, damit Fremdspannung aus einer Schleife die andere nicht erreicht; teilen sich Leitungen verschiedener Kreise einen Stecker, kann ein Schaden sie trotzdem verbinden. Fords Patent setzt einen Code und schaltet die „Service Soon“-Leuchte ein, wenn ein Interlock-Kreis nach Plus kurzgeschlossen ist, und Texas Instruments zeigt, dass der Schleifenstrom dann dem befohlenen Muster nicht mehr folgt. U3518 dokumentiert kein Hersteller. Das HV-System bleibt aus; zuerst Stecker prüfen, die Interlock-Pins mehrerer Kreise führen.
  affected_components:
    - hvil_loop_c
    - hvil_wiring
  common_causes:
    - id: loop_c_short_to_voltage
      likelihood: high
      label:
        en: Interlock wire of loop C shorted to 12 V
        de: Interlock-Leitung von Kreis C mit Schluss nach 12 V
    - id: cross_short_between_loops
      likelihood: medium
      label:
        en: Loop C bridged to another loop's wire in a shared connector
        de: Kreis C im gemeinsamen Stecker mit der Leitung einer anderen Schleife verbunden
    - id: source_stuck_on
      likelihood: low
      label:
        en: Interlock source for loop C stuck on in the module
        de: Interlock-Quelle für Kreis C im Steuergerät dauerhaft eingeschaltet
  symptoms:
    - en: No ready mode despite all HV connectors being in place
      de: Keine Fahrbereitschaft, obwohl alle HV-Stecker sitzen
    - en: Service or HV warning lamp lit
      de: Service- oder HV-Warnleuchte leuchtet
    - en: High codes for more than one interlock loop
      de: Hoch-Codes für mehr als eine Interlock-Schleife
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
