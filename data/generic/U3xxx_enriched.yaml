    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11031309-0001.pdf
  reviewed: '2026-11-06'

- code: U3016
  category: network
  title:
    en: Control Module Ground D
    de: Steuergerät Masse D
  description:
    en: U3016 closes the ground series and stands for a fourth return path, D, that the module considers open or out of line with its other grounds. Four grounds on one unit are rare, so before chasing the D pin it pays to check whether grounds A to C are logged as well; several ground codes at once point to a shared splice, the battery negative cable or a body-to-engine strap rather than to one wire. No manufacturer publishes a definition for U3016. GM's ratio check for two brake module grounds (19OBDG03B) and Ford's bulletin 26-2150, which assigns grounds A and B of a steering module to different bolts, show that each letter means a real, separate fastening point. CARB expects electrical faults of such components to be caught by continuous circuit checks.
    de: U3016 schließt die Massereihe ab und steht für einen vierten Rückleiter, D, den das Steuergerät als offen oder unstimmig zu seinen übrigen Massen erkennt. Vier Massen an einem Gerät sind selten; bevor man den Pin D sucht, lohnt der Blick, ob auch Masse A bis C eingetragen sind. Mehrere Massecodes zugleich deuten eher auf einen gemeinsamen Verbindungspunkt, das Batterie-Minuskabel oder ein Masseband zwischen Motor und Karosserie als auf eine einzelne Leitung. Kein Hersteller veröffentlicht eine Definition für U3016. GMs Verhältnisprüfung zweier Massen im Bremssteuergerät (19OBDG03B) und Fords Bulletin 26-2150, das Masse A und B eines Lenkungssteuergeräts unterschiedlichen Schrauben zuordnet, zeigen, dass jeder Buchstabe eine eigene Befestigung meint. CARB verlangt, dass elektrische Fehler solcher Bauteile laufend erkannt werden.
  affected_components:
    - module_ground_d
    - ground_strap
  common_causes:
    - id: shared_ground_fault
      likelihood: high
      label:
        en: Poor shared ground, battery negative or engine-to-body strap
        de: Schlechte gemeinsame Masse, Batterie-Minuspol oder Masseband Motor–Karosserie
    - id: ground_point_corroded
      likelihood: medium
      label:
        en: Corroded or loose eyelet at ground point D
        de: Korrodierte oder lockere Öse am Massepunkt D
    - id: connector_pin
      likelihood: medium
      label:
        en: Damaged ground pin or water in the module connector
        de: Beschädigter Massepin oder Wasser im Modulstecker
    - id: module_internal
      likelihood: low
      label:
        en: Fault in the module's own ground monitoring
        de: Fehler in der eigenen Masseüberwachung des Steuergeräts
  symptoms:
    - en: Warning or service message for the affected system
      de: Warn- oder Servicemeldung für das betroffene System
    - en: Several ground or supply codes logged at the same time
      de: Mehrere Masse- oder Versorgungscodes gleichzeitig eingetragen
    - en: Intermittent loss of the module's function
      de: Zeitweiser Ausfall der Funktion des Steuergeräts
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 250]
    estimated_hours: [0.5, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
