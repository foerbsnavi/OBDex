- code: U302C
  category: network
  title:
    en: Ignition Output Off/On/Start
    de: Zündungsausgang Aus/Ein/Start
  description:
    en: "U302C covers an ignition output that encodes several states on one wire: Off, On and Start each get their own level, so a single conductor passes the power mode on to other units. It is the sending counterpart of coded inputs like the Off/Run/Crank circuit that GM's wiring manual for its 2012 light-duty trucks shows between ignition switch and body controller, which uses separate levels for key removed, key in at off, running and cranking. A module producing such a coded line stores U302C once the level read back at its own pin differs from the state it means to transmit. No manufacturer documents U302C publicly. Since receivers evaluate voltage bands rather than on or off, a partial short, an extra load or a corroded pin can turn run into start or off without the line going dead, so measure it in each mode with receivers connected."
    de: "U302C betrifft einen Zündungsausgang, der mehrere Zustände auf einer Leitung codiert: Aus, Ein und Start haben je einen eigenen Pegel, sodass ein Draht den Betriebszustand an andere Geräte weitergibt. Er ist das sendende Gegenstück zu codierten Eingängen wie dem Off/Run/Crank-Kreis, den GMs Schaltplanbuch für die Pickups 2012 zwischen Zündschalter und Karosseriesteuergerät zeigt, mit eigenen Pegeln für abgezogenen Schlüssel, steckenden Schlüssel bei Aus, Fahrt und Anlassen. Ein Steuergerät, das so eine Leitung erzeugt, setzt U302C, wenn der an seinem Pin gemessene Pegel nicht zum gesendeten Zustand passt. Kein Hersteller dokumentiert U302C öffentlich. Weil Empfänger Spannungsbereiche auswerten, machen ein Teilschluss, eine Zusatzlast oder ein korrodierter Pin aus Fahrt womöglich Start oder Aus, ohne dass die Leitung ausfällt."
  affected_components:
    - ignition_output
    - output_wiring
  common_causes:
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose pin shifting the coded level
        de: Korrodierter oder lockerer Pin verschiebt den codierten Pegel
    - id: receiver_input_loading
      likelihood: medium
      label:
        en: Faulty input in a receiving module pulling the line out of its band
        de: Defekter Eingang in einem Empfängergerät zieht die Leitung aus ihrem Bereich
    - id: output_wire_partial_short
      likelihood: medium
      label:
        en: Chafed wire with a partial short to ground or voltage
        de: Durchgescheuerte Leitung mit teilweisem Schluss nach Masse oder Spannung
    - id: output_stage_fault
      likelihood: low
      label:
        en: Faulty output stage in the sending module
        de: Defekte Ausgangsstufe im sendenden Steuergerät
  symptoms:
    - en: Other modules acting on a wrong power mode, e.g. shutting down or not waking
      de: Andere Steuergeräte folgen einem falschen Betriebszustand, schalten etwa ab oder wachen nicht auf
    - en: Sporadic warnings that change with key position or button presses
      de: Sporadische Warnungen, die sich mit Schlüsselstellung oder Tastendruck ändern
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300C, U302B, U302D, U3031, U3011]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U302D
  category: network
  title:
    en: Ignition Output On/Start
    de: Zündungsausgang Ein/Start
  description:
    en: "U302D concerns the output that powers the On/Start circuits, i.e. everything that has to work with the engine running and through cranking but not in Off or Accessory. On GM's 2012 pickups the body control module handles this by switching the coil of the run/crank relay over circuit 5199. GM bulletin PIT5817A, covering 2020–2021 models such as Escalade, Tahoe, Corvette and CT5, shows what goes wrong on that side: the BCM keeps driving ignition main relay KR73 after shut-off, circuit 5199 stays live and the battery runs down, while engine, transmission and brake controllers store P2535 and the cluster stores U300D; the repair is a new BCM. GM records that case through input codes in the receivers, not as U302D. A module that checks its own on/start output would catch the same fault at the source. No manufacturer documents U302D publicly."
    de: "U302D betrifft den Ausgang, der die Ein/Start-Kreise versorgt, also alles, was bei laufendem Motor und beim Anlassen arbeiten muss, nicht aber in Aus oder Zubehör. Bei GMs Pickups 2012 steuert das Karosseriesteuergerät dafür die Spule des Run/Crank-Relais über Kreis 5199. GMs PIT5817A zu Modellen 2020–2021 wie Escalade, Tahoe, Corvette und CT5 zeigt den Fehler auf dieser Seite: Das BCM steuert das Zündungs-Hauptrelais KR73 nach dem Abstellen weiter an, Kreis 5199 bleibt unter Spannung, die Batterie entlädt sich; Motor-, Getriebe- und Bremssteuergerät speichern P2535, das Kombiinstrument U300D. Repariert wird durch Tausch des BCM. GM erfasst den Fall über Eingangscodes der Empfänger, nicht als U302D; ein Gerät, das seinen Ein/Start-Ausgang selbst prüft, würde ihn direkt an der Quelle melden. Kein Hersteller dokumentiert U302D öffentlich."
  affected_components:
    - ignition_output
    - ignition_relay
    - body_control_module
    - output_wiring
  common_causes:
    - id: bcm_relay_driver_stuck_on
      likelihood: high
      label:
        en: Relay driver in the body control module staying on after shut-off
        de: Relaistreiber im Karosseriesteuergerät bleibt nach dem Abstellen eingeschaltet
    - id: relay_contact_welded
      likelihood: medium
      label:
        en: Ignition main relay contact welded or relay not pulling in
        de: Kontakt des Zündungs-Hauptrelais verschweißt oder Relais zieht nicht an
    - id: coil_control_wire_fault
      likelihood: medium
      label:
        en: Relay coil control wire open or shorted to voltage
        de: Steuerleitung zur Relaisspule unterbrochen oder mit Spannung kurzgeschlossen
    - id: aftermarket_backfeed
      likelihood: low
      label:
        en: Retrofitted device feeding voltage back into the run/crank circuit
        de: Nachgerüstetes Gerät speist Spannung in den Run/Crank-Kreis zurück
  symptoms:
    - en: Battery repeatedly flat, often after a remote start
      de: Batterie wiederholt leer, oft nach einem Fernstart
    - en: Engine lamp at start-up with P2535 stored in engine and transmission modules
      de: Motorkontrollleuchte beim Start, P2535 in Motor- und Getriebesteuergerät gespeichert
    - en: No start or modules without power if the output fails open
      de: Kein Start oder Steuergeräte ohne Versorgung, wenn der Ausgang nicht schaltet
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [20, 900]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300D, P2535, U302E, U3030, U3023]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2021/MC-10190367-9999.pdf
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
