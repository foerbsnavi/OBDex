    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11015963-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11018277-0001.pdf
  reviewed: '2026-11-06'

- code: U300B
  category: network
  title:
    en: Ignition Input Accessory/On/Start
    de: Zündungseingang Zubehör/Ein/Start
  description:
    en: "Judging by its name, U300B concerns the ignition line that should carry voltage in Accessory, On and Start, i.e. in every key position except Off. A module sets it when the level on that wire contradicts the power mode it has been told or sees on its other inputs, for example live with the vehicle off, or dead while the bus reports run. No manufacturer documents U300B publicly. GM's 2012 pickup wiring manual shows the principle: the body control module reads several discrete switch circuits, decides on the power mode and broadcasts it, and modules with their own switched inputs may fall back to a default mode when that message disagrees with their own pins. GM also shows that such lines are cut differently, e.g. its accessory feed drops out while cranking, which this input type should not do."
    de: "Dem Namen nach betrifft U300B die Zündleitung, die in Zubehör, Ein und Start Spannung führen soll, also in jeder Schlüsselstellung außer Aus. Ein Steuergerät legt den Code ab, wenn der Pegel auf dieser Leitung dem gemeldeten Betriebszustand oder seinen übrigen Eingängen widerspricht, etwa Spannung bei abgestelltem Fahrzeug oder keine bei gemeldeter Fahrt. Kein Hersteller dokumentiert U300B öffentlich. GMs Schaltplanhandbuch der Pickups 2012 zeigt das Prinzip: Das Karosseriesteuergerät liest mehrere getrennte Schalterleitungen, bestimmt daraus den Betriebszustand und verteilt ihn; Geräte mit eigenen Zündungseingängen können in einen Ersatzbetrieb gehen, wenn die Botschaft nicht zu ihren Pins passt. GM zeigt auch, dass solche Leitungen verschieden schalten: Die Zubehörleitung fällt dort beim Anlassen ab, was dieser Eingang nicht soll."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: ignition_feed_fuse_relay
      likelihood: medium
      label:
        en: Blown fuse or faulty relay in the switched feed to this input
        de: Durchgebrannte Sicherung oder defektes Relais in der geschalteten Zuleitung
    - id: input_wire_open_short
      likelihood: medium
      label:
        en: Input wire open, shorted or backfed from another circuit
        de: Eingangsleitung unterbrochen, kurzgeschlossen oder von einem anderen Kreis rückgespeist
    - id: switch_contacts_worn
      likelihood: medium
      label:
        en: Worn ignition switch contact for this position group
        de: Verschlissener Kontakt im Zündschalter für diese Stellungsgruppe
    - id: power_mode_master_fault
      likelihood: low
      label:
        en: Body control module sending a wrong power mode on the bus
        de: Karosseriesteuergerät sendet einen falschen Betriebszustand auf den Bus
  symptoms:
    - en: Functions on the accessory and run feed missing or behaving oddly
      de: Funktionen an der Zubehör- und Fahrtleitung fehlen oder verhalten sich seltsam
    - en: Affected module running in a fallback mode with a warning
      de: Betroffenes Steuergerät läuft im Ersatzbetrieb mit Warnmeldung
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 500]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300F, U300D, U3022, U3004, U300A]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U300C
  category: network
  title:
    en: Ignition Input Off/On/Start
    de: Zündungseingang Aus/Ein/Start
  description:
    en: "U300C covers an ignition input that, going by the title, is meant to distinguish Off, On and Start rather than simply switching between live and dead. GM's 2012 light-duty truck wiring manual has exactly such a circuit, labelled Off/Run/Crank: unlike the plain accessory and run/crank feeds it takes separate states for key out or accessory, key in and off, run, and crank. A module reading a coded line of this kind sets U300C when the state it decodes is invalid or disagrees with the power mode on the network. No manufacturer documents U300C publicly. Because one wire carries several states, a slight resistance in the switch or a poor connector can shift the level into the wrong state without breaking the circuit, so measuring the line in every key position beats a simple continuity test."
    de: "U300C betrifft einen Zündungseingang, der dem Titel nach Aus, Ein und Start unterscheiden soll, statt nur Spannung oder keine Spannung zu melden. GMs Schaltplanhandbuch für die leichten Pickups 2012 enthält genau so einen Kreis mit der Bezeichnung Off/Run/Crank: Anders als die einfachen Zubehör- und Run/Crank-Leitungen nimmt er eigene Zustände für Schlüssel abgezogen oder Zubehör, Schlüssel steckt und Aus, Fahrt sowie Anlassen an. Ein Steuergerät, das eine solche codierte Leitung auswertet, setzt U300C, wenn der erkannte Zustand ungültig ist oder nicht zum Betriebszustand im Netz passt. Kein Hersteller dokumentiert U300C öffentlich. Da eine Leitung mehrere Zustände trägt, kann schon ein Übergangswiderstand im Schalter oder Stecker den Pegel verschieben, ohne den Kreis zu unterbrechen – daher in jeder Schlüsselstellung messen."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: switch_contact_resistance
      likelihood: high
      label:
        en: Contact resistance in the ignition switch shifting the coded level
        de: Übergangswiderstand im Zündschalter verschiebt den codierten Pegel
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose pin at the switch or module connector
        de: Korrodierter oder lockerer Pin am Schalter- oder Steuergerätestecker
    - id: input_wire_open_short
      likelihood: medium
      label:
        en: Input wire open or shorted to ground or voltage
        de: Eingangsleitung unterbrochen oder mit Masse oder Spannung kurzgeschlossen
    - id: module_input_fault
      likelihood: low
      label:
        en: Faulty input stage in the reading module
        de: Defekte Eingangsstufe im auswertenden Steuergerät
  symptoms:
    - en: Vehicle does not switch power modes as expected, e.g. no start or no shutdown
      de: Fahrzeug wechselt den Betriebszustand nicht wie erwartet, etwa kein Start oder kein Abschalten
    - en: Intermittent warnings that depend on key position or switch movement
      de: Sporadische Warnungen abhängig von Schlüsselstellung oder Bewegung am Schalter
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3011, U300D, U3010, U300A, P2533]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U300D
  category: network
  title:
    en: Ignition Input On/Start
    de: Zündungseingang Ein/Start
  description:
    en: "U300D concerns the line that should be live in On and Start only, which GM calls Run/Crank Ignition 1; in GM's 2012 truck wiring manual it is active in run and crank and inactive in off and accessory. A module sets the code when this line and the power mode on the bus disagree. GM's PIT5817A for 2020–2021 Envision, CT4, CT5, Escalade, Corvette, Tahoe, Suburban and Yukon shows the typical case: the instrument cluster stores U300D while the ECM, TCM and brake module log P2535, often after remote start, and the customer finds a dead battery and a service engine lamp. The BCM's driver for the ignition main relay stays on after key-off and keeps circuit 5199 powered, so the line remains live with the car off; the fix is a new BCM. The cluster's code itself is the witness, not the cause."
    de: "U300D betrifft die Leitung, die nur in Ein und Start Spannung führen soll; GM nennt sie Run/Crank Ignition 1, und im Schaltplanhandbuch der Pickups 2012 ist sie bei Fahrt und Anlassen aktiv, bei Aus und Zubehör nicht. Ein Steuergerät setzt den Code, wenn diese Leitung und der Betriebszustand auf dem Bus auseinanderliegen. GMs PIT5817A zu Envision, CT4, CT5, Escalade, Corvette, Tahoe, Suburban und Yukon 2020–2021 zeigt den typischen Fall: Das Kombiinstrument speichert U300D, Motor-, Getriebe- und Bremssteuergerät melden P2535, oft nach einem Fernstart, und der Kunde findet eine leere Batterie und die Motorkontrollleuchte vor. Der Treiber des Zündungs-Hauptrelais im BCM bleibt nach dem Abstellen an und hält Kreis 5199 unter Spannung; Abhilfe ist ein neues BCM. Das Kombiinstrument ist dabei Zeuge, nicht Ursache."
  affected_components:
    - ignition_input
    - ignition_relay
    - body_control_module
    - ignition_wiring
  common_causes:
    - id: bcm_relay_driver_stuck
