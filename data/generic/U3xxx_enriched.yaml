- code: U352C
  category: network
  title:
    en: High Voltage System Interlock Circuit H High
    de: Hochvoltsystem Interlock-Stromkreis H hoch
  description:
    en: U352C reports an excessive reading on loop H. Whether that points to foreign voltage or to a break depends on the quantity the controller evaluates. If it reads voltage, a wire touching 12 V is the usual reason. If it works out the loop's resistance, as Lear's tester patent does, a value beyond the maximum is treated as open and one under the minimum as shorted, so high may mean corrosion or a loose terminal. The service data of the specific vehicle settles which reading applies; for U352C no maker publishes it. Measure loop H resistance with every plug latched and compare it with a sound loop of the same vehicle.
    de: U352C meldet einen überhöhten Messwert an Kreis H. Ob das auf Fremdspannung oder auf eine Unterbrechung hinweist, hängt davon ab, welche Größe das Steuergerät auswertet. Liest es Spannung, ist meist eine Leitung mit Kontakt zu 12 V der Grund. Berechnet es den Schleifenwiderstand, wie der Prüfer in Lears Patent, gilt ein Wert über dem Maximum als Unterbrechung und einer unter dem Minimum als Kurzschluss – hoch kann dann Korrosion oder ein lockerer Kontakt bedeuten. Welche Lesart gilt, klären die Servicedaten des Fahrzeugs; für U352C veröffentlicht sie kein Hersteller. Den Widerstand von Kreis H bei eingerasteten Steckern messen und mit einer intakten Schleife desselben Fahrzeugs vergleichen.
  affected_components:
    - hvil_loop_h
    - hvil_wiring
  common_causes:
    - id: loop_h_short_to_voltage
      likelihood: medium
      label:
        en: Loop H wire in contact with a 12 V supply
        de: Leitung von Kreis H mit Kontakt zu einer 12-V-Versorgung
    - id: loop_h_high_resistance
      likelihood: medium
      label:
        en: Corroded or loose terminal raising loop H resistance
        de: Korrodierter oder lockerer Kontakt erhöht den Widerstand von Kreis H
    - id: source_stuck_on
      likelihood: low
      label:
        en: Loop source stuck on in the controller
        de: Schleifenquelle im Steuergerät bleibt eingeschaltet
  symptoms:
    - en: No ready mode, high-voltage warning
      de: Keine Fahrbereitschaft, Hochvolt-Warnung
    - en: Fault sometimes disappears after moving connectors
      de: Fehler verschwindet mitunter, wenn man an Steckern wackelt
