- code: U3546
  category: network
  title:
    en: High Voltage System Interlock Circuit P Performance
    de: Hochvoltsystem Interlock-Stromkreis P Funktion
  description:
    en: U3546 marks loop P as implausible. On large vehicles the mechanical routing of HV cables affects the interlock too. Gillig's field service campaign FSC 22-13-2479 for its Gen 2.0 and 2.5 battery electric buses found that HV battery cables in one equipment compartment lacked adequate support brackets; the outcome was an intermittent HVIL fault 8175, sometimes with the HV exposure lamp lit, and the fix was added bracketry. A heavy cable that swings with every bump can tug at its plug just enough to upset the loop for an instant. No maker documents U3546. Look for unsupported cable runs close to the plugs of loop P.
    de: U3546 kennzeichnet Kreis P als unplausibel. Bei großen Fahrzeugen wirkt sich auch die mechanische Führung der Hochvoltkabel auf das Interlock aus. Gilligs Feldaktion FSC 22-13-2479 für die batterieelektrischen Busse der Generationen 2.0 und 2.5 stellte fest, dass Batteriekabel in einem Geräteraum zu wenig Halterungen hatten; die Folge war ein sporadischer HVIL-Fehler 8175, teils mit leuchtender Warnlampe für Hochvolt, behoben durch zusätzliche Halter. Ein schweres Kabel, das bei jeder Bodenwelle mitschwingt, kann gerade so viel an seinem Stecker ziehen, dass die Schleife kurz gestört wird. U3546 dokumentiert kein Hersteller. Nach ungestützten Kabelabschnitten nahe den Steckern von Kreis P suchen.
  affected_components:
    - hvil_loop_p
  common_causes:
    - id: unsupported_hv_cable
      likelihood: high
      label:
        en: HV cable without adequate brackets pulling on a loop P plug
        de: Hochvoltkabel ohne ausreichende Halter zieht an einem Stecker von Kreis P
    - id: loose_contact_loop_p
      likelihood: medium
      label:
