- code: U350A
  category: network
  title:
    en: Control Module Input Power C Circuit High
    de: Steuergerät Eingangsspannung C Stromkreis hoch
  description:
    en: "U350A is the overvoltage code for supply C. GM's electric brake booster (2016–2019 hybrid tables) logs it when voltage sensor 2 on the motor driver supply exceeds 19.8 V for 90 s at speeds above 4 mph, Type A, so a single failing trip lights the MIL. The limit is higher than the 16 to 18 V thresholds used for feeds A and B because the motor stage tolerates more, yet a lasting excess is treated as serious since it threatens the power transistors. The pass condition is a straight drive over 3.1 miles or more. Such values rarely arise in a healthy 12 V system: think of a failed generator regulator or DC/DC converter, jump-starting from a 24 V source, or, with normal battery voltage, an internal sensing error."
    de: "U350A ist der Überspannungscode für Versorgung C. Der elektrische Bremskraftverstärker in GMs Hybridtabellen 2016–2019 speichert ihn, wenn Spannungsfühler 2 an der Motortreiber-Versorgung 90 s lang mehr als 19,8 V misst, bei über 4 mph, Typ A mit MIL bei der ersten Fahrt. Die Grenze liegt höher als die 16 bis 18 V bei den Eingängen A und B, weil die Motorstufe mehr verträgt; ein anhaltender Überschuss gilt trotzdem als ernst, da er die Leistungstransistoren gefährdet. Bestanden ist der Test nach mindestens 3,1 Meilen Geradeausfahrt. Solche Werte entstehen in einem intakten 12-V-Netz kaum: Naheliegend sind ein defekter Generatorregler oder Gleichspannungswandler, Starthilfe aus einer 24-V-Quelle oder – bei normaler Batteriespannung – ein Messfehler im Steuergerät."
  affected_components:
    - module_power_c
    - charging_system
  common_causes:
    - id: voltage_regulator_fault
      likelihood: medium
      label:
        en: Generator regulator or DC/DC converter overcharging
        de: Generatorregler oder Gleichspannungswandler lädt zu hoch
    - id: external_jump_or_charger
      likelihood: medium
      label:
        en: Jump start from a 24 V source
        de: Starthilfe aus einer 24-V-Quelle
    - id: module_measurement
      likelihood: medium
      label:
        en: Faulty measurement of feed C inside the module
        de: Fehlerhafte Messung von Eingang C im Steuergerät
  symptoms:
    - en: MIL and brake warning on the first trip
      de: MIL und Bremswarnung bei der ersten Fahrt
    - en: Brake assist reduced or switched off
      de: Bremsunterstützung verringert oder abgeschaltet
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [20, 1200]
    estimated_hours: [0.5, 3]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: true
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3509, U3508, U350B, U3506, U3502]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2018/18OBDG01%20Hybrid%20Diagnostics.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U350B
  category: network
  title:
    en: Control Module Input Power C Circuit Intermittent/Erratic
    de: Steuergerät Eingangsspannung C Stromkreis sporadisch/unstet
  description:
    en: "U350B reports that supply C fluctuates: it drops or spikes briefly without staying out of range. Where C feeds a motor stage, as in GM's electric brake booster (motor driver supply, voltage sensor 2), such faults surface at moments of peak current, because a loose contact then loses voltage or opens for an instant. GM itself uses only the Low, High and correlation codes for this feed, and no manufacturer documents U350B publicly. The difference from U3509 lies in the timing: short events rather than a steady low level. Typical findings are a fuse with weak clamping, a loose ring terminal on the ground, chafing near the module or corroded pins; check with a recording meter while the load is operating and look for U3019 as a companion code."
    de: "U350B meldet, dass Versorgung C schwankt: Sie bricht kurz ein oder springt, ohne dauerhaft außerhalb des Bereichs zu liegen. Speist C eine Motorstufe wie beim elektrischen Bremskraftverstärker von GM (Motortreiber-Versorgung, Spannungsfühler 2), zeigen sich solche Fehler in Momenten höchsten Stroms, weil ein lockerer Kontakt dann Spannung verliert oder kurz öffnet. GM selbst nutzt für diesen Eingang nur die Codes niedrig, hoch und Korrelation, und kein Hersteller dokumentiert U350B öffentlich. Von U3509 trennt ihn der zeitliche Verlauf: kurze Ereignisse statt dauerhaft niedriger Spannung. Typische Befunde sind eine schlecht klemmende Sicherung, ein lockerer Ringkabelschuh an der Masse, Scheuerstellen nahe dem Gerät oder korrodierte Pins; mit aufzeichnendem Messgerät bei arbeitender Last prüfen und auf U3019 als Begleitcode achten."
  affected_components:
    - module_power_c
    - power_wiring
  common_causes:
    - id: loose_terminal
      likelihood: high
      label:
        en: Loose fuse contact or ring terminal in feed C or its ground
        de: Lockerer Sicherungskontakt oder Ringkabelschuh in Eingang C oder dessen Masse
    - id: chafed_wire
      likelihood: medium
      label:
        en: Chafed wire near the module
        de: Durchgescheuerte Leitung nahe dem Steuergerät
    - id: corroded_pins
      likelihood: medium
      label:
        en: Corroded connector pins
        de: Korrodierte Steckerpins
  symptoms:
    - en: Brief loss of assist from the motor-driven function
      de: Kurzer Ausfall der Unterstützung durch die motorische Funktion
    - en: Sporadic warning lamp that clears again
      de: Sporadische Warnleuchte, die wieder erlischt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3508, U3509, U350A, U3507, U3019]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2016/16OBDG02%20Hybrid%20Diagnostics.pdf
  reviewed: '2026-11-06'

- code: U350C
  category: network
  title:
    en: Control Module Cooling Fan Circuit/Open
    de: Steuergerät Kühllüfter Stromkreis/Unterbrechung
  description:
    en: "U350C reports that the fan built into or attached to a control module draws no current, or its circuit is open, at the moment the module switches it on. Some electronics carry their own blower: on the 2021 Toyota RAV4 Prime the plug-in charger has a fan with a speed sensor (bulletin T-SB-0021-21, code P1CE931), and the central infotainment unit of the Karma Revero has one under a shroud (TB-24-94-01). For electrical parts that cool inverters and traction batteries, CARB requires circuit and function monitoring. No maker documents U350C itself. With the fan dead, the module heats up and may cut its own output, charge more slowly or shut down. Shorts are split off into U350D/U350E; U350F covers a fan that is wired correctly but runs wrong."
    de: "U350C meldet, dass der Lüfter, der in einem Steuergerät steckt oder an ihm sitzt, beim Einschalten keinen Strom aufnimmt bzw. sein Kreis offen ist. Manche Elektronik hat ein eigenes Gebläse: Beim Toyota RAV4 Prime 2021 kühlt ein Lüfter mit Drehzahlgeber das Ladegerät (Bulletin T-SB-0021-21, Code P1CE931), beim Karma Revero sitzt einer unter einer Haube an der zentralen Infotainment-Einheit (TB-24-94-01). Für elektrische Teile, die Wechselrichter oder Antriebsbatterie kühlen, verlangt CARB die Überwachung von Kreis und Funktion. U350C selbst beschreibt kein Hersteller öffentlich. Ohne Lüfter wird das Gerät warm und nimmt womöglich Leistung zurück, lädt langsamer oder schaltet ab. Kurzschlüsse laufen unter U350D/U350E, ein falsch laufender Lüfter unter U350F."
  affected_components:
    - module_cooling_fan
    - fan_wiring
  common_causes:
    - id: fan_motor_open
      likelihood: high
      label:
        en: Fan motor winding or brushes open
        de: Wicklung oder Bürsten des Lüftermotors unterbrochen
    - id: fan_connector_loose
      likelihood: medium
      label:
        en: Fan plug loose or not latched after the module was removed
        de: Lüfterstecker locker oder nach Ausbau des Geräts nicht eingerastet
    - id: fan_wire_broken
      likelihood: medium
      label:
        en: Broken fan supply or control wire
        de: Versorgungs- oder Ansteuerleitung des Lüfters gebrochen
    - id: fan_driver_failed
      likelihood: low
      label:
        en: Fan output stage inside the module failed open
        de: Lüfter-Endstufe im Steuergerät hochohmig ausgefallen
  symptoms:
    - en: Module fan silent when it should run
      de: Lüfter des Steuergeräts bleibt still, obwohl er laufen sollte
    - en: Module overheats, reduces output, charges slower or restarts
      de: Steuergerät überhitzt, regelt ab, lädt langsamer oder startet neu
    - en: Temperature warning or function message for the affected module
      de: Temperatur- oder Funktionsmeldung zum betroffenen Steuergerät
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [40, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U350D, U350E, U350F, P0480]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/tsbs/2022/MC-10206537-9999.pdf
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-10251645-0001.pdf
  reviewed: '2026-11-06'

- code: U350D
  category: network
  title:
    en: Control Module Cooling Fan Circuit Low
    de: Steuergerät Kühllüfter Stromkreis niedrig
  description:
    en: U350D is set when the voltage or current feedback in a control module's fan circuit sits below the window the module expects. Usually the fan supply or control wire touches ground, or the motor itself has shorted turns, so the output stage limits current or switches off and the fan stands still; a blown fan fuse produces the same picture. Electronics with a dedicated fan exist, for example the charger of the 2021 Toyota RAV4 Prime with its fan speed sensor (T-SB-0021-21), and CARB demands that electrical outputs cooling inverters and batteries be checked for circuit faults. No manufacturer publishes U350D. Once warm, the module will most likely protect itself by lowering its output. An open circuit is U350C, a short to voltage U350E.
    de: U350D steht, wenn die Spannungs- oder Stromrückmeldung im Lüfterkreis eines Steuergeräts unter dem erwarteten Fenster liegt. Meist hat die Versorgungs- oder Ansteuerleitung Masseschluss oder der Motor Windungsschluss; die Endstufe begrenzt dann den Strom oder schaltet ab, der Lüfter steht. Eine durchgebrannte Lüftersicherung ergibt dasselbe Bild. Elektronik mit eigenem Lüfter gibt es etwa im Ladegerät des Toyota RAV4 Prime 2021 mit Drehzahlgeber (T-SB-0021-21), und CARB verlangt, dass elektrische Kühlausgänge von Wechselrichter und Batterie auf Kreisfehler geprüft werden. Kein Hersteller veröffentlicht U350D. Sobald das Gerät warm wird, schützt es sich voraussichtlich durch Leistungsrücknahme. Eine Unterbrechung wäre U350C, ein Schluss nach Plus U350E.
  affected_components:
    - module_cooling_fan
    - fan_wiring
  common_causes:
    - id: fan_wire_short_to_ground
      likelihood: high
      label:
        en: Fan supply or control wire chafed through to ground
        de: Versorgungs- oder Ansteuerleitung des Lüfters an Masse durchgescheuert
    - id: fan_motor_shorted
      likelihood: medium
      label:
        en: Fan motor with shorted windings drawing excess current
        de: Lüftermotor mit Windungsschluss zieht zu viel Strom
    - id: fan_fuse_blown
      likelihood: medium
      label:
        en: Fan fuse blown as a result of the short
        de: Lüftersicherung durch den Kurzschluss ausgelöst
    - id: fan_driver_fault
      likelihood: low
      label:
        en: Output stage in the module pulling the line low
        de: Endstufe im Steuergerät zieht die Leitung nach Masse
  symptoms:
    - en: Module fan does not run
      de: Lüfter des Steuergeräts läuft nicht
    - en: Reduced function or shutdown of the module when hot
      de: Eingeschränkte Funktion oder Abschaltung des Geräts bei Wärme
    - en: Blown fan fuse
      de: Lüftersicherung durchgebrannt
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 500]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U350C, U350E, U350F, P0691]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/tsbs/2022/MC-10206537-9999.pdf
  reviewed: '2026-11-06'

- code: U350E
  category: network
  title:
    en: Control Module Cooling Fan Circuit High
    de: Steuergerät Kühllüfter Stromkreis hoch
  description:
    en: U350E points to a fan circuit whose level is higher than the module expects, typically because the control or feedback line is shorted to battery voltage or the output stage is stuck on. Unlike the low and open faults, the fan may then run all the time, even with the module cold or the car parked, which is audible and can drain the 12 V battery. Fan-cooled electronics are found in infotainment units such as the central unit of the Karma Revero (TB-24-94-01) and in on-board chargers; CARB treats electrical cooling outputs for inverters and batteries as monitored components. U350E is not documented by any manufacturer in public. Check the harness for chafing against supply wires before suspecting the module.
    de: U350E weist auf einen Lüfterkreis hin, dessen Pegel höher liegt als erwartet – meist hat die Ansteuer- oder Rückmeldeleitung Schluss nach Batteriespannung, oder die Endstufe bleibt durchgeschaltet. Anders als bei Unterbrechung oder Masseschluss läuft der Lüfter dann womöglich ständig, auch bei kaltem Gerät oder abgestelltem Auto; das ist hörbar und kann die 12-V-Batterie leeren. Lüftergekühlte Elektronik steckt in Infotainment-Einheiten wie der des Karma Revero (TB-24-94-01) und in Bordladern; CARB führt elektrische Kühlausgänge von Wechselrichtern und Batterien als überwachte Bauteile. Öffentlich dokumentiert kein Hersteller U350E. Vor einem Gerätetausch den Kabelbaum auf Scheuerstellen an Plusleitungen prüfen.
  affected_components:
    - module_cooling_fan
    - fan_wiring
  common_causes:
    - id: fan_wire_short_to_voltage
      likelihood: high
      label:
        en: Fan control or feedback wire shorted to a 12 V supply
        de: Ansteuer- oder Rückmeldeleitung des Lüfters mit Schluss nach 12 V
    - id: fan_driver_stuck_on
      likelihood: medium
      label:
        en: Fan output stage in the module stuck on
        de: Lüfter-Endstufe im Steuergerät dauerhaft durchgeschaltet
    - id: connector_moisture
      likelihood: low
      label:
        en: Moisture or corrosion bridging pins in the fan connector
        de: Feuchtigkeit oder Korrosion überbrückt Kontakte im Lüfterstecker
  symptoms:
    - en: Module fan running continuously, also after switch-off
      de: Lüfter des Steuergeräts läuft dauernd, auch nach dem Abstellen
    - en: 12 V battery discharged after standing
      de: 12-V-Batterie nach Standzeit entladen
    - en: Fan does not react to temperature changes
      de: Lüfter reagiert nicht auf Temperaturänderungen
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [30, 500]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U350C, U350D, U350F, P0692]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/tsbs/2024/MC-10251645-0001.pdf
  reviewed: '2026-11-06'

- code: U350F
  category: network
  title:
    en: Control Module Cooling Fan Circuit Range/Performance
    de: Steuergerät Kühllüfter Stromkreis Bereich/Funktion
  description:
    en: "U350F means the fan circuit is electrically sound but the fan does not do what it is told: its speed feedback disagrees with the command, or the module keeps heating up although the fan is switched on. Dust, a blocked or rubbing blade, worn bearings or a lost speed signal are typical. A related case is Toyota's bulletin T-SB-0021-21 for the 2021 RAV4 Prime: the charger fan's speed sensor reported no signal (P1CE931), charging took longer, and the cure was new charger software rather than a new fan. Karma fixed noise from the infotainment unit fan with a redesigned shroud (TB-24-94-01). CARB asks for a functional check of cooling performance where feasible. No maker lists U350F itself; U350C to U350E cover wiring faults."
    de: "U350F heißt: Der Lüfterkreis ist elektrisch in Ordnung, aber der Lüfter tut nicht, was er soll – die Drehzahlrückmeldung passt nicht zur Vorgabe, oder das Gerät wird trotz eingeschaltetem Lüfter zu warm. Typisch sind Staub, ein blockiertes oder schleifendes Lüfterrad, verschlissene Lager oder ein fehlendes Drehzahlsignal. Einen verwandten Fall beschreibt Toyota in T-SB-0021-21 zum RAV4 Prime 2021: Der Drehzahlgeber des Ladegerätelüfters lieferte kein Signal (P1CE931), das Laden dauerte länger, behoben wurde es per neuer Ladegerät-Software statt mit neuem Lüfter. Karma beseitigte Geräusche des Infotainment-Lüfters mit einer geänderten Haube (TB-24-94-01). CARB fordert, wo machbar, eine Funktionsprüfung der Kühlleistung. U350F selbst führt kein Hersteller; Leitungsfehler laufen unter U350C bis U350E."
  affected_components:
    - module_cooling_fan
