- code: U3548
  category: network
  title:
    en: High Voltage System Interlock Circuit P High
    de: Hochvoltsystem Interlock-Stromkreis P hoch
  description:
    en: U3548 is the high-side code of loop P. When each unit adds a known share of loop resistance, a single suspect can be isolated by substitution. Tesla's Model S HVIL guide has technicians, after consulting a field engineer, place a 60-ohm resistor across the drive inverter's interlock pins at connector X250 and also bridge its CAN lines; if the contactors then close, the inverter's internal section is to blame. Such a stand-in serves only as a short test by trained staff and must be removed afterwards. No maker documents U3548. A raised reading calls for measuring the share of each component on loop P.
    de: U3548 kennzeichnet Kreis P über seiner oberen Grenze. Trägt jedes Gerät einen bekannten Anteil zum Schleifenwiderstand bei, lässt sich ein Verdächtiger durch Ersetzen eingrenzen. Teslas HVIL-Leitfaden für das Model S lässt die Werkstatt nach Rücksprache mit einem Außendiensttechniker einen 60-Ohm-Widerstand über die Interlock-Pins des Antriebswechselrichters am Stecker X250 setzen und dazu dessen CAN-Leitungen überbrücken; schließen die Schütze dann, liegt der Fehler im inneren Abschnitt des Wechselrichters. Ein solcher Ersatz dient nur als kurzer Test durch geschultes Personal und wird danach wieder entfernt. U3548 dokumentiert kein Hersteller. Ein erhöhter Wert verlangt, den Anteil jeder Komponente an Kreis P zu messen.
  affected_components:
    - hvil_loop_p
    - hvil_wiring
  common_causes:
    - id: component_internal_resistance_high
      likelihood: medium
      label:
        en: Internal interlock section of an HV component too resistive
        de: Innerer Interlock-Abschnitt einer Hochvoltkomponente zu hochohmig
    - id: loop_p_short_to_battery
