- code: U3021
  category: network
  title:
    en: Control Module Wake-up Circuit B Performance
    de: Steuergerät Weckleitung B Funktion
  description:
    en: "U3021 is the plausibility code for wake-up line B: the wire is neither open nor shorted, but the wake signal arrives at the wrong time or does not match what other inputs say. No manufacturer documents U3021 publicly. The closest published logic is Ford's U301D for line A in the 2019 Fusion Energi battery module, which fails when the charge wake-up is still low although the charger output voltage is already in the window for closing the contactors. Chrysler's powertrain counterpart P06E4, wake-up circuit performance, appears in 2024 Jeep Wrangler 4xe bulletins (e.g. 21-017-24) that cure it with new module software. Both cases point the same way: a performance fault on a wake line is often a timing question between two modules and is more often solved by a software update than by new wiring."
    de: "U3021 ist der Plausibilitätscode für Weckleitung B: Die Leitung ist weder offen noch kurzgeschlossen, doch das Wecksignal kommt zur falschen Zeit oder passt nicht zu dem, was andere Eingänge melden. Kein Hersteller dokumentiert U3021 öffentlich. Am nächsten kommt Fords U301D für Leitung A im Batteriesteuergerät des Fusion Energi 2019: Er fällt, wenn das Lade-Wecksignal noch niedrig ist, obwohl die Ausgangsspannung des Ladegeräts schon im Fenster zum Schließen der Schütze liegt. Das Antriebs-Gegenstück P06E4 (Weckleitung Funktion) erscheint in Bulletins zum Jeep Wrangler 4xe 2024, etwa 21-017-24, die es mit neuer Steuergeräte-Software beheben. Beide Fälle zeigen: Ein Funktionsfehler an einer Weckleitung ist oft eine Timingfrage zwischen zwei Geräten und wird eher per Software als mit neuer Verkabelung gelöst."
  affected_components:
    - wakeup_circuit_b
    - wakeup_wiring
  common_causes:
    - id: module_software
      likelihood: high
      label:
        en: Software in sender or receiver judging the wake timing wrongly
        de: Software in Sender oder Empfänger bewertet das Weck-Timing falsch
    - id: sending_module_late_signal
      likelihood: medium
      label:
        en: Source on line B raising or dropping its signal late
        de: Quelle an Leitung B setzt oder nimmt ihr Signal verspätet
    - id: wake_wire_resistance
      likelihood: low
      label:
        en: Contact resistance on line B slowing the level change
        de: Übergangswiderstand an Leitung B verlangsamt den Pegelwechsel
  symptoms:
    - en: Warning lamp or message after a wake event, e.g. after charging
      de: Warnleuchte oder Meldung nach einem Weckvorgang, etwa nach dem Laden
    - en: Function works, but the code returns sporadically
      de: Funktion arbeitet, der Code kehrt aber sporadisch zurück
