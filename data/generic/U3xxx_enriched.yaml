- code: U3535
  category: network
  title:
    en: High Voltage System Interlock Circuit L
    de: Hochvoltsystem Interlock-Stromkreis L
  description:
    en: U3535 is the umbrella code for interlock circuit L, the eleventh loop. Large vehicles carry many guarded compartments. On New Flyer battery buses the energy storage units sit on the roof at front, centre and rear, and each access door is watched by an interlock limit switch. A service instruction from the bus maker, filed with NHTSA, swaps the switch bracket for one with a stop and bonds a striker plate to the door so the switch is pressed reliably; the same procedure turns a separate HV interlock switch off for lockout. A misadjusted door switch, or a lockout switch not turned back on, can open a loop such as L. Which compartments belong to it is not published.
    de: U3535 ist der Oberbegriff-Code für Interlock-Kreis L, die elfte Schleife. Große Fahrzeuge haben viele gesicherte Fächer. Bei Batteriebussen von New Flyer sitzen die Energiespeicher vorn, in der Mitte und hinten auf dem Dach, und jede Zugangsklappe wird von einem Interlock-Endschalter überwacht. Eine bei der NHTSA hinterlegte Serviceanweisung des Busherstellers ersetzt den Schalterhalter durch einen mit Anschlag und klebt eine Anschlagplatte an die Klappe, damit der Schalter sicher betätigt wird; dieselbe Anleitung schaltet zum Sperren einen eigenen HV-Interlock-Schalter aus. Ein verstellter Klappenschalter oder ein nicht wieder eingeschalteter Sperrschalter kann eine Schleife wie L öffnen. Welche Fächer dazugehören, ist nicht veröffentlicht.
  affected_components:
    - hvil_loop_l
    - hv_connectors
  common_causes:
    - id: compartment_switch_misadjusted
      likelihood: high
      label:
        en: Door or lid limit switch on loop L misadjusted or not actuated
        de: Endschalter einer Klappe an Kreis L verstellt oder nicht betätigt
    - id: lockout_switch_left_off
      likelihood: medium
      label:
        en: Manual high-voltage interlock or lockout switch left off after service
        de: Manueller HV-Interlock- oder Sperrschalter nach der Wartung ausgeschaltet geblieben
    - id: loop_l_connector_unlatched
      likelihood: medium
      label:
        en: Connector in loop L not fully latched
        de: Stecker in Kreis L nicht vollständig eingerastet
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller monitoring loop L faulty
        de: Steuergerät, das Kreis L überwacht, defekt
  symptoms:
    - en: Vehicle or one energy storage unit unavailable after maintenance
      de: Fahrzeug oder ein Energiespeicher nach der Wartung nicht verfügbar
    - en: High-voltage system warning on the dashboard
      de: Warnmeldung zum Hochvoltsystem in der Armaturentafel
    - en: Fault linked to opening or closing a compartment
