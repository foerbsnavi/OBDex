- code: U3551
  category: network
  title:
    en: Hydrogen Tank A Valve Enable Circuit
    de: Wasserstofftank A Ventil Freigabekreis
  description:
    en: "U3551 concerns the enable circuit of the valve on tank A: not the switched control line, but the path that permits the valve to be powered at all, typically a relay, fuse or supply-side switch. Designs keep it apart so a crash can cut hydrogen reliably. In a Honda patent the fuel cell controller opens a collision cutoff relay as soon as the airbag unit reports an impact, and FMVSS 307 demands valve closure no later than 5 seconds after a crash. Toyota's FCHV guide follows the same idea: pulling two fuses disables the vehicle and closes every tank valve. If this path is open or shorted, tank A cannot open. No manufacturer documents U3551. Enable codes on several tanks at once point to a shared supply."
    de: "Bei U3551 geht es um den Freigabekreis des Ventils an Tank A – nicht um die geschaltete Steuerleitung, sondern um den Pfad, der dem Ventil überhaupt Strom erlaubt, meist Relais, Sicherung oder versorgungsseitiger Schalter. Er ist getrennt ausgeführt, damit ein Unfall den Wasserstoff sicher absperrt. In einem Honda-Patent trennt das Brennstoffzellen-Steuergerät ein Crash-Abschaltrelais, sobald das Airbagsteuergerät einen Aufprall meldet; FMVSS 307 fordert, dass das Ventil binnen 5 Sekunden nach dem Crash schließt. Toyotas FCHV-Leitfaden folgt demselben Prinzip: Zieht man zwei Sicherungen, ist das Fahrzeug stillgelegt und jedes Tankventil geht zu. Ist dieser Pfad unterbrochen oder kurzgeschlossen, öffnet Tank A nicht. Kein Hersteller dokumentiert U3551. Freigabecodes an mehreren Tanks zugleich deuten auf eine gemeinsame Versorgung."
  affected_components:
    - h2_tank_a_valve_enable
    - safety_circuit
  common_causes:
    - id: enable_relay
      likelihood: medium
      label:
        en: Enable or crash cutoff relay faulty
        de: Freigabe- bzw. Crash-Abschaltrelais defekt
    - id: fuse_or_supply
      likelihood: medium
      label:
        en: Blown fuse or missing supply in the valve enable path
        de: Sicherung durchgebrannt oder Versorgung im Freigabepfad fehlt
