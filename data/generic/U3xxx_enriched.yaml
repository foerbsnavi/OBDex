- code: U302A
  category: network
  title:
    en: Control Module A Disable Feedback Circuit High
    de: Steuergerät A Abschaltkreis Rückmeldung hoch
  description:
    en: U302A means the readback from module A's disable path is stuck above its valid range, for example through a short to a supply wire. The risk is a false all-clear or a false alarm, depending on which level stands for disabled. In a test sequence like the six-step shutoff check of FCA patent US10676100B2, a feedback that never drops will fail the steps where a shutdown is commanded, and the controller must assume the shutdown path does not work. FCA notes that such a result would eventually need a fault flag, and that blocking the vehicle outright could strand the driver, so it proposes rerouting the signal through another processor to keep availability. No manufacturer documents U302A publicly. Check the readback wire for contact with powered circuits and the connectors for moisture.
    de: U302A heißt, dass das Rücklesesignal aus dem Abschaltpfad von Steuergerät A über seinem gültigen Bereich hängt, etwa durch Schluss zu einer Versorgungsleitung. Je nachdem, welcher Pegel für abgeschaltet steht, droht eine falsche Entwarnung oder ein Fehlalarm. In einer Testfolge wie der sechsstufigen Abschaltprüfung im FCA-Patent US10676100B2 scheitert eine Rückmeldung, die nie abfällt, an den Schritten mit befohlener Abschaltung, und die Steuerung muss annehmen, dass der Abschaltpfad nicht wirkt. Laut FCA ist dann ein Fehlereintrag fällig, doch völliges Sperren könnte den Fahrer liegen lassen; das Patent leitet das Signal daher über einen anderen Prozessor um. Kein Hersteller dokumentiert U302A öffentlich. Zu prüfen sind Kontakt der Rückleseleitung zu spannungsführenden Kreisen und Feuchte in Steckern.
  affected_components:
    - module_disable_feedback_a
    - feedback_wiring
  common_causes:
    - id: feedback_short_to_voltage
      likelihood: high
      label:
        en: Feedback wire shorted to a battery or supply wire
        de: Rückmeldeleitung mit Schluss zu einer Batterie- oder Versorgungsleitung
    - id: connector_bridge
      likelihood: medium
      label:
        en: Corrosion bridging the readback pin to a neighbouring supply pin
        de: Korrosion verbindet den Rücklesepin mit einem benachbarten Versorgungspin
    - id: module_output_stuck
      likelihood: low
      label:
        en: Module A driving its feedback output permanently high
        de: Steuergerät A treibt seinen Rückmeldeausgang dauerhaft auf High
  symptoms:
    - en: System warning and function of module A unavailable
      de: Systemwarnung, Funktion von Modul A nicht verfügbar
    - en: In hybrids, possibly no ready mode or reduced drive power
      de: Bei Hybriden unter Umständen keine Fahrbereitschaft oder reduzierte Antriebsleistung
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3028, U3029, U3027]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US10676100B2/en
  reviewed: '2026-11-06'

- code: U302B
  category: network
  title:
    en: Ignition Output Accessory/On/Start
    de: Zündungsausgang Zubehör/Ein/Start
  description:
    en: "U302B belongs to the ignition outputs, i.e. a feed that a module switches itself instead of merely reading it. The Accessory/On/Start variant should carry voltage in every power mode except Off and, unlike most accessory feeds, should stay on while the engine cranks. The driving unit, typically a body controller or the power supply unit of a keyless start system, compares its command with what it reads back on its own pin and stores U302B when the two differ: voltage in Off, or none in accessory, run or crank. No manufacturer documents U302B publicly. Tokai Rika's patent US6900552B2 shows such a unit switching separate relay coils for accessory, two ignition stages and the starter through FET drivers. A driver stuck on or a welded relay contact on this feed can flatten the battery overnight."
    de: "U302B zählt zu den Zündungsausgängen: eine Leitung, die ein Steuergerät selbst schaltet, statt sie nur zu lesen. Die Variante Zubehör/Ein/Start soll in jedem Betriebszustand außer Aus Spannung führen und – anders als viele Zubehörleitungen – auch beim Anlassen anbleiben. Das treibende Gerät, meist ein Karosseriesteuergerät oder die Stromversorgungseinheit eines schlüssellosen Startsystems, vergleicht seinen Befehl mit dem am eigenen Ausgang zurückgelesenen Pegel und legt U302B ab, wenn beides abweicht: Spannung in Aus oder keine in Zubehör, Fahrt oder Start. Kein Hersteller dokumentiert U302B öffentlich. Tokai Rikas Patent US6900552B2 zeigt eine solche Einheit, die über FET-Treiber getrennte Relais für Zubehör, zwei Zündstufen und den Anlasser schaltet. Hängt ein Treiber oder verschweißt ein Kontakt, leert sich die Batterie über Nacht."
  affected_components:
    - ignition_output
    - ignition_relay
    - output_wiring
  common_causes:
    - id: relay_contact_welded
      likelihood: medium
      label:
        en: Welded relay contact keeping the feed live in Off
        de: Verschweißter Relaiskontakt hält die Leitung in Aus unter Spannung
    - id: output_driver_fault
      likelihood: medium
      label:
        en: Faulty driver stage in the switching module, stuck on or not switching
        de: Defekte Treiberstufe im schaltenden Steuergerät, hängt ein oder schaltet nicht
    - id: output_wire_short_ground
      likelihood: medium
      label:
        en: Output wire or a connected load shorted to ground, tripping the driver protection
        de: Ausgangsleitung oder ein angeschlossener Verbraucher mit Masseschluss, Treiberschutz löst aus
    - id: feed_fuse_open
      likelihood: low
      label:
        en: Blown fuse between the relay and the loads on this feed
        de: Durchgebrannte Sicherung zwischen Relais und den Verbrauchern dieser Leitung
  symptoms:
    - en: Battery flat after the car has been parked
      de: Batterie nach dem Abstellen leer
    - en: Several loads on the feed dead although the vehicle is switched on
      de: Mehrere Verbraucher an der Leitung ohne Funktion, obwohl das Fahrzeug eingeschaltet ist
    - en: Warning about the power supply or ignition system in the cluster
      de: Warnmeldung zu Stromversorgung oder Zündsystem im Kombiinstrument
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [20, 700]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300B, U302F, U302D, U302C, U3032]
  sources:
