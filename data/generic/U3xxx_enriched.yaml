- code: U3573
  category: network
  title:
    en: Coolant Mixing Valve Control Circuit
    de: Kühlmittel-Mischventil Steuerkreis
  description:
    en: "U3573 concerns how the coolant mixing valve is powered: its actuator line may be interrupted or shorted, or the output stage may have failed. This three-way valve splits stack coolant between radiator and bypass and so decides how warm it is when it returns to the stack. Designs vary: in a Hyundai application a solenoid pushes a spool and its current sets the split, while Toyota describes a rotary valve turned by a stepper motor through a gear train. In the conventional Hyundai layout the valve takes the stack inlet temperature over CAN from the fuel cell control unit. If the actuator cannot be powered, coolant temperature is no longer regulated. U3573 appears in no public maker document. Likely consequences are a warning and capped output; how the valve itself responds is judged under U3574."
    de: "Gemeldet wird ein elektrischer Fehler im Ansteuerkreis des Kühlmittel-Mischventils – Unterbrechung, Kurzschluss oder defekte Endstufe. Das Dreiwegeventil teilt das Kühlmittel zwischen Kühler und Bypass auf und legt so fest, wie warm es in den Stack zurückläuft. Die Bauarten unterscheiden sich: In einer Hyundai-Anmeldung schiebt ein Elektromagnet einen Kolben, und der Spulenstrom bestimmt die Aufteilung; Toyota beschreibt einen Drehschieber mit Schrittmotor und Zahnradgetriebe. Beim herkömmlichen Hyundai-Aufbau erhält das Ventil die Stack-Eintrittstemperatur über CAN vom Brennstoffzellen-Steuergerät. Lässt sich der Antrieb nicht bestromen, ist die Kühlmitteltemperatur nicht mehr regelbar. Kein Hersteller nennt U3573 öffentlich. Warnung und Leistungsrücknahme sind wahrscheinlich; das Verhalten des Ventils selbst bewertet U3574."
  affected_components:
    - coolant_mixing_valve
    - valve_wiring
  common_causes:
    - id: harness_connector_mixing_valve
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of the valve actuator
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker des Ventilantriebs
    - id: valve_actuator_motor_fault
      likelihood: medium
      label:
        en: Actuator motor or solenoid coil of the mixing valve faulty
        de: Stellmotor oder Magnetspule des Mischventils defekt
    - id: fuel_cell_controller_driver
      likelihood: low
      label:
        en: Driver stage or CAN link of the controlling unit faulty
        de: Endstufe oder CAN-Anbindung des ansteuernden Steuergeräts gestört
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Stack temperature too high or too low, reduced power
      de: Stacktemperatur zu hoch oder zu niedrig, weniger Leistung
    - en: Slow warm-up of the fuel cell system
      de: Brennstoffzellensystem wird nur langsam warm
