      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of the bypass valve
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker des Bypassventils
    - id: valve_actuator_motor_fault
      likelihood: medium
      label:
        en: Bypass valve motor or actuator faulty
        de: Motor oder Antrieb des Bypassventils defekt
    - id: fuel_cell_controller_driver
      likelihood: low
      label:
        en: Driver stage of the fuel cell control unit faulty
        de: Endstufe des Brennstoffzellen-Steuergeräts defekt
