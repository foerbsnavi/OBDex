- code: U3557
  category: network
  title:
    en: Hydrogen Tank C Valve Enable Circuit
    de: Wasserstofftank C Ventil Freigabekreis
  description:
    en: "U3557 is stored for a fault in the enable circuit of the tank C valve, the third tank of three-tank vehicles. Permission to open is not tied to driving alone: a Honda patent describes the cutoff valve being open with the ignition off, for example when the stack keeps operating after shutdown, so collision detection stays powered in that state and a cutoff relay can still close the valve. The enable path therefore has to work when the car is parked, and faults may surface after switch-off. FMVSS 307 asks for valve closure within 5 seconds of any crash. No manufacturer documents U3557. Expect tank C to stay shut, a warning and less range. If U3551 and U3554 are also stored, look for a supply common to all valves."
    de: "U3557 wird bei einem Fehler im Freigabekreis des Ventils an Tank C abgelegt, dem dritten Behälter von Drei-Tank-Fahrzeugen. Die Erlaubnis zum Öffnen hängt nicht nur am Fahren: Ein Honda-Patent beschreibt, dass das Absperrventil auch bei ausgeschalteter Zündung offen sein kann, etwa wenn das Brennstoffzellensystem nach dem Abstellen weiterläuft; deshalb bleibt die Crasherkennung dann versorgt, und ein Abschaltrelais kann das Ventil weiterhin schließen. Der Freigabepfad muss also auch im Stand funktionieren, Fehler können sich nach dem Ausschalten zeigen. FMVSS 307 fordert nach jedem Crash den Ventilschluss binnen 5 Sekunden. Kein Hersteller dokumentiert U3557. Folgen: Tank C bleibt zu, Warnung, weniger Reichweite. Stehen auch U3551 und U3554 im Speicher, die gemeinsame Versorgung aller Ventile prüfen."
  affected_components:
    - h2_tank_c_valve_enable
    - safety_circuit
  common_causes:
    - id: cutoff_relay
      likelihood: medium
      label:
        en: Cutoff or enable relay for valve C faulty
        de: Abschalt- bzw. Freigaberelais für Ventil C defekt
    - id: shared_supply
      likelihood: medium
      label:
        en: Fuse or common valve supply interrupted
        de: Sicherung oder gemeinsame Ventilversorgung unterbrochen
    - id: enable_wiring
      likelihood: medium
      label:
        en: Enable line to tank C damaged
        de: Freigabeleitung zu Tank C beschädigt
  symptoms:
    - en: Hydrogen system warning, possibly right after switch-off or at start
      de: Warnung des Wasserstoffsystems, unter Umständen direkt nach dem Abstellen oder beim Start
    - en: Reduced range
      de: Verringerte Reichweite
