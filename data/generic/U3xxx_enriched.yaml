- code: U3526
  category: network
  title:
    en: High Voltage System Interlock Circuit G Performance
    de: Hochvoltsystem Interlock-Stromkreis G Funktion
  description:
    en: "U3526 reports an implausible result for loop G. Not every interlock is a wire loop: Rivian patented a virtual interlock in which a controller first brings the DC bus up to a low, safe voltage only, gathers the voltages that the high-voltage components report over CAN, and raises the bus to operating voltage only if those reports are acceptable. With such a scheme a performance fault means values that contradict each other rather than a broken wire, for example one component seeing a bus voltage far from the battery's. No maker documents U3526. Missing or stale CAN data, a faulty voltage sensor or a loose HV plug are the main suspects."
    de: "U3526 meldet ein unplausibles Ergebnis für Kreis G. Nicht jedes Interlock ist eine Drahtschleife: Rivian hat ein virtuelles Interlock patentiert, bei dem ein Steuergerät den Gleichspannungsbus zunächst nur auf eine Sicherheitsspannung lädt, die von den Hochvoltkomponenten über CAN gemeldeten Spannungen einsammelt und erst bei stimmigen Meldungen auf Betriebsspannung hochfährt. Ein Funktionsfehler bedeutet dann widersprüchliche Werte statt eines gerissenen Drahts, etwa wenn eine Komponente eine Busspannung weit weg von der des Akkus sieht. U3526 dokumentiert kein Hersteller. Verdächtig sind fehlende oder veraltete CAN-Daten, ein defekter Spannungssensor oder ein lockerer HV-Stecker."
  affected_components:
    - hvil_loop_g
  common_causes:
    - id: component_voltage_sensor_fault
      likelihood: medium
      label:
        en: Voltage sensing inside one high-voltage component faulty
        de: Spannungsmessung in einer Hochvoltkomponente fehlerhaft
    - id: can_data_missing
      likelihood: medium
      label:
        en: Voltage message missing or late on the CAN bus
        de: Spannungsbotschaft auf dem CAN-Bus fehlt oder kommt zu spät
    - id: loose_hv_plug
      likelihood: medium
      label:
        en: HV plug not fully seated, so one component sees no bus voltage
        de: HV-Stecker nicht ganz gesteckt, eine Komponente sieht keine Busspannung
  symptoms:
    - en: Start-up of the high-voltage system aborted
      de: Hochfahren des Hochvoltsystems bricht ab
    - en: Communication codes in other control units at the same time
      de: Gleichzeitig Kommunikationscodes in anderen Steuergeräten
