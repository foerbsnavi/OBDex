- code: U354D
  category: network
  title:
    en: Hydrogen Tank B Temperature Sensor 2 Circuit
    de: Wasserstofftank B Temperatursensor 2 Stromkreis
  description:
    en: U354D marks an electrical fault on the second temperature sensor of tank B. Apart from fill control, tank temperature is needed to convert pressure into fuel quantity, because cold gas at a given pressure holds more hydrogen than warm gas. Sensors and wiring sit at the tank under the floor, often inside the on-tank valve. Hyundai's venting bulletin 20-FL-008H-1 for the Nexo has the underbody covers removed to reach the tank valves, requires tank pressure below 500 psi before work on hydrogen parts and full venting before welding or open flame within 18 inches. A sensor fault on the tank can therefore become a job involving defuelling. No maker publishes U354D. Its partner on the same tank is U354C.
    de: "U354D steht für einen elektrischen Fehler am zweiten Temperatursensor von Tank B. Neben der Betankung braucht das System die Tanktemperatur, um aus dem Druck die Füllmenge zu errechnen: Kaltes Gas enthält bei gleichem Druck mehr Wasserstoff als warmes. Fühler und Leitungen liegen am Tank unter dem Boden, häufig im Tankventil selbst. Hyundais Bulletin 20-FL-008H-1 zum Entleeren des Nexo lässt für den Zugang zu den Tankventilen die Unterbodenverkleidung abnehmen, verlangt für Arbeiten an wasserstoffführenden Teilen unter 500 psi Tankdruck und völliges Entleeren, wenn innerhalb von 18 Zoll geschweißt oder mit Flamme gearbeitet wird. Ein Fühlerfehler am Tank kann deshalb Arbeit mit Entleeren bedeuten. Veröffentlicht hat U354D kein Hersteller. Partner am selben Tank: U354C."
  affected_components:
    - h2_tank_b_temp_sensor_2
    - sensor_wiring
  common_causes:
    - id: underbody_connector
      likelihood: high
