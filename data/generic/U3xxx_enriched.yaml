- code: U351B
  category: network
  title:
    en: High Voltage System Interlock Circuit D Low
    de: Hochvoltsystem Interlock-Stromkreis D niedrig
  description:
    en: "U351B reports that too little level comes back from interlock loop D while the module drives it. GM's hybrid tables for the loop A code P0A0C give a frame of reference: the test only runs when on-board voltage exceeds 10.2 V, judges what fraction of a 5 V test signal returns against a 30 % limit and logs a Type A fault after two failed 12.5 ms readings. A weak 12 V battery thus pauses the check instead of tripping it. No maker publishes a calibration for U351B. Typical causes are a wire crushed against the body, a loop plug left off, or a dead source; the contactors behind loop D may not close."
    de: "U351B meldet, dass von Interlock-Schleife D zu wenig Pegel zurückkommt, während das Steuergerät sie speist. GMs Hybrid-Tabellen zum Kreis-A-Code P0A0C geben einen Anhalt: Geprüft wird nur bei mehr als 10,2 V Bordspannung, bewertet wird, welcher Anteil eines 5-V-Prüfsignals zurückkehrt, gegen eine Grenze von 30 %, und nach zwei fehlgeschlagenen Messungen zu je 12,5 ms steht ein Fehler vom Typ A. Eine schwache 12-V-Batterie setzt die Prüfung also aus, statt sie auszulösen. Eine Kalibrierung für U351B legt kein Hersteller offen. Häufig sind eine an der Karosserie gequetschte Leitung, ein vergessener Stecker oder eine ausgefallene Quelle; die Schütze hinter Kreis D dürfen nicht schließen."
  affected_components:
    - hvil_loop_d
    - hvil_wiring
  common_causes:
    - id: loop_d_pinched_to_ground
      likelihood: high
      label:
        en: Loop D wire pinched against the body and shorted to ground
        de: Leitung von Kreis D an der Karosserie gequetscht, Masseschluss
    - id: loop_d_plug_not_seated
      likelihood: medium
      label:
        en: Plug within loop D not seated after a repair
        de: Stecker in Kreis D nach einer Reparatur nicht gesteckt
    - id: interlock_source_fault
      likelihood: low
      label:
        en: Test voltage source in the controller failed
        de: Prüfspannungsquelle im Steuergerät ausgefallen
  symptoms:
    - en: No ready mode or high-voltage branch D unavailable
      de: Keine Fahrbereitschaft bzw. Hochvoltzweig D nicht verfügbar
    - en: Warning to have the high-voltage system checked
      de: Aufforderung, das Hochvoltsystem prüfen zu lassen
    - en: Fault stays present after clearing until the wiring is repaired
      de: Fehler kehrt nach dem Löschen zurück, bis die Leitung repariert ist
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
