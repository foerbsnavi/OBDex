- code: U3508
  category: network
  title:
    en: Control Module Input Power C Circuit Range/Performance
    de: Steuergerät Eingangsspannung C Stromkreis Bereich/Funktion
  description:
    en: U3508 checks the plausibility of a third supply input, C. Only modules with large or separately protected loads have three feeds; in GM's electric brake booster (2016–2019 hybrid tables) C is the motor driver feed, measured by voltage sensor 2 and compared with feed B through U3019 (ratio outside 0.766 to 1.321). U3508 would apply if C is present but its value does not suit the operating state, for instance staying high while the motor draws current or departing from battery voltage, without crossing a hard limit. No manufacturer documents U3508 publicly; GM uses only the Low and High codes for C. Check the motor feed and its ground under load and look for related U3019 or U3013.
    de: U3508 ist der Plausibilitätscode für einen dritten Versorgungseingang C. Nur Geräte mit großen oder getrennt abgesicherten Lasten haben drei Eingänge; im elektrischen Bremskraftverstärker aus GMs Hybridtabellen 2016–2019 ist C die Versorgung des Motortreibers, gemessen über Spannungsfühler 2 und über U3019 mit Eingang B verglichen (Verhältnis außerhalb 0,766 bis 1,321). U3508 träfe zu, wenn C zwar anliegt, der Wert aber nicht zum Betriebszustand passt – etwa unverändert hoch bleibt, während der Motor Strom zieht, oder von der Batteriespannung abweicht –, ohne eine feste Grenze zu reißen. Kein Hersteller dokumentiert U3508 öffentlich; GM nutzt für C nur die Codes niedrig und hoch. Motorzuleitung und deren Masse unter Last prüfen und auf U3019 oder U3013 achten.
  affected_components:
    - module_power_c
    - power_wiring
  common_causes:
    - id: high_resistance_contact
      likelihood: medium
      label:
        en: Resistance in the motor supply path of feed C
        de: Übergangswiderstand im Motorversorgungspfad von Eingang C
    - id: poor_ground
      likelihood: medium
      label:
        en: Poor ground of the power stage
        de: Schlechte Masse der Leistungsstufe
    - id: internal_measurement_drift
      likelihood: low
      label:
        en: Drift of the internal voltage divider
        de: Drift des internen Spannungsteilers
  symptoms:
    - en: Reduced function of the motor-driven system
      de: Eingeschränkte Funktion des motorisch betriebenen Systems
    - en: Correlation codes between feeds stored as well
      de: Zusätzlich Korrelationscodes zwischen den Eingängen gespeichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 600]
    estimated_hours: [0.3, 2.5]
  flags:
