- code: U3566
  category: network
  title:
    en: Anode Inlet Pressure Sensor 1 Circuit
    de: Anodeneintritt Drucksensor 1 Stromkreis
  description:
    en: "U3566 is set for an electrical fault at anode inlet pressure sensor 1, sitting between hydrogen injector and stack. A GM patent explains why this value is central: it closes the loop for the injector and also feeds anode valve control and the handling of hydrogen in the exhaust. A wrong value derails that loop; in GM's example the injector is held at full duty because a 200 kPa target never shows on a sensor stuck at 100 kPa. GM flags such a sensor when its readings vary by less than 6 kPa over a time window and then runs the anode open loop, about 50 kPa above cathode pressure. Hyundai checks its stack supply pressure sensor against recirculation blower speed and warns in the cluster. As a circuit code U3566 covers opens and shorts; no public source uses it. Expect a warning and reduced power."
    de: "Betroffen ist der Stromkreis von Drucksensor 1 am Anodeneintritt zwischen Wasserstoff-Injektor und Stack. Dieser Wert ist laut GM-Patent zentral: Er schließt den Regelkreis des Injektors und fließt in die Steuerung der Anodenventile und des Wasserstoffs im Abgas ein. Ein falscher Wert führt die Regelung in die Irre: Im GM-Beispiel bleibt der Injektor voll angesteuert, weil der Sollwert von 200 kPa am bei 100 kPa festhängenden Sensor nie erscheint. GM erkennt das, wenn die Messwerte über ein Zeitfenster weniger als 6 kPa schwanken, und regelt die Anode dann ohne Rückführung etwa 50 kPa über dem Kathodendruck. Hyundai prüft den Sensor über die Gebläsedrehzahl der Rezirkulation und warnt im Kombiinstrument. U3566 selbst erfasst Unterbrechung und Kurzschluss und ist öffentlich nicht belegt; Warnung und weniger Leistung sind zu erwarten."
  affected_components:
    - anode_inlet_pressure_sensor_1
    - sensor_wiring
  common_causes:
