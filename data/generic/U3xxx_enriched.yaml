- code: U3517
  category: network
  title:
    en: High Voltage System Interlock Circuit C Low
    de: Hochvoltsystem Interlock-Stromkreis C niedrig
  description:
    en: U3517 says the level read back on interlock loop C stays too low. Depending on the design, an opened plug in loop C, a wire chafed to ground or a failed source in the monitoring module all lead to it. In current-fed designs such as the Texas Instruments reference circuit, a short to ground draws extra supply current while an opened loop does not, which helps to separate the two. For loop A, GM uses a 5 V test voltage and a 30 % lower limit, which indicates the margins involved. Mercedes has technicians measure interlock loop resistance segment by segment on model line 243, a method that suits loop C just as well. No manufacturer publishes U3517 itself. Until the fault is cleared, the contactors remain open.
    de: U3517 besagt, dass der an Interlock-Schleife C zurückgelesene Pegel zu niedrig bleibt. Je nach Auslegung führen ein gezogener Stecker in Kreis C, eine an Masse gescheuerte Leitung oder eine ausgefallene Quelle im überwachenden Steuergerät dazu. Bei stromgespeisten Schaltungen wie dem Referenzdesign von Texas Instruments zieht ein Masseschluss zusätzlichen Versorgungsstrom, eine offene Schleife nicht – so lassen sich beide trennen. Für Schleife A arbeitet GM mit 5 V Prüfspannung und einer Untergrenze von 30 %, was die Größenordnung zeigt. Mercedes lässt bei der Baureihe 243 den Schleifenwiderstand Abschnitt für Abschnitt messen; das Verfahren passt auf Kreis C genauso. U3517 selbst veröffentlicht kein Hersteller. Bis der Fehler beseitigt ist, bleiben die Schütze offen.
  affected_components:
    - hvil_loop_c
    - hvil_wiring
  common_causes:
    - id: loop_c_short_to_ground
      likelihood: high
      label:
        en: Interlock wire of loop C chafed to ground at a module or the body
        de: Interlock-Leitung von Kreis C an Steuergerät oder Karosserie nach Masse gescheuert
    - id: loop_c_plug_open
      likelihood: medium
      label:
        en: Connector in loop C unplugged, sensed as a low signal
        de: Stecker in Kreis C abgezogen, als niedriges Signal erkannt
    - id: broken_interlock_connector
      likelihood: medium
      label:
        en: Broken interlock connector housing or terminal
        de: Gebrochenes Interlock-Steckergehäuse oder gebrochener Kontakt
    - id: interlock_source_fault
      likelihood: low
      label:
        en: Source stage for loop C failed in the monitoring module
        de: Quellstufe für Kreis C im überwachenden Steuergerät ausgefallen
  symptoms:
    - en: Vehicle cannot be started
      de: Fahrzeug lässt sich nicht starten
    - en: HV system warning in the instrument cluster
      de: HV-Warnung im Kombiinstrument
    - en: Charging unavailable
      de: Laden nicht verfügbar
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
  flags:
