- code: U3524
  category: network
  title:
    en: High Voltage System Interlock Circuit F High
    de: Hochvoltsystem Interlock-Stromkreis F hoch
  description:
    en: "U3524 indicates a level on loop F above its upper threshold. Pulsed test schemes recognise this easily: if the loop is driven with a fixed square wave, as in Corun's 100 Hz battery design, a wire stuck at 12 V returns a flat level without any edges, which no intact connection could produce. Texas Instruments rates its interlock reference design to survive a direct connection to the 12 V battery, and it offers a third, high-impedance output state for diagnosis. No manufacturer publishes U3524. Look for chafing against fused 12 V wires and for low-voltage plugs in which a loop pin sits right beside a supply pin."
    de: "U3524 zeigt an Schleife F einen Pegel über der oberen Schwelle. Gepulste Prüfverfahren erkennen das leicht: Wird die Schleife mit einer festen Rechteckwelle betrieben, wie in Coruns 100-Hz-Batterieschaltung, liefert eine auf 12 V liegende Leitung einen flachen Pegel ganz ohne Flanken, den keine intakte Verbindung erzeugen könnte. Texas Instruments legt sein Interlock-Referenzdesign so aus, dass es einen Schluss zur 12-V-Batterie übersteht, und bietet für die Diagnose einen dritten, hochohmigen Schaltzustand. Kein Hersteller veröffentlicht U3524. Nach Scheuerstellen an abgesicherten 12-V-Leitungen suchen und nach Niedervoltsteckern, in denen ein Schleifenkontakt direkt neben einem Versorgungskontakt sitzt."
  affected_components:
    - hvil_loop_f
    - hvil_wiring
  common_causes:
    - id: loop_f_short_to_voltage
      likelihood: high
      label:
        en: Loop F wire chafed against a fused 12 V wire
        de: Leitung von Kreis F an einer abgesicherten 12-V-Leitung durchgescheuert
    - id: adjacent_pin_bridge
      likelihood: medium
      label:
        en: Loop pin bridged to a neighbouring supply pin by corrosion or a bent terminal
        de: Schleifenkontakt durch Korrosion oder verbogenen Kontakt mit benachbartem Versorgungskontakt verbunden
    - id: source_stuck_on
      likelihood: low
      label:
        en: Source driver for loop F no longer switches off
        de: Quellstufe für Kreis F schaltet nicht mehr ab
