- code: U353D
  category: network
  title:
    en: High Voltage System Interlock Circuit N
    de: Hochvoltsystem Interlock-Stromkreis N
  description:
    en: "U353D is the general code for interlock circuit N, the thirteenth loop in J2012 lettering; designs with that many loops are only conceivable on very large high-voltage systems. No maker documents U353D publicly. Moisture is a frequent root cause on interlocks of any letter: FCA bulletin 08-131-21 for the 2021 Jeep Wrangler plug-in hybrid traces a no-start with P0A0A to water getting past a pinched orange seal into the P1 and P2 HV connectors under the car, often logged together with an isolation fault (P0AA6). Where corrosion has set in, the harness or the power inverter module has to be replaced. Inspect seals before cleaning pins."
    de: "U353D ist der allgemeine Code für Interlock-Kreis N, nach der J2012-Zählung die dreizehnte Schleife; so viele Kreise sind nur in sehr großen Hochvoltsystemen denkbar. Öffentlich dokumentiert kein Hersteller U353D. Feuchtigkeit ist bei Interlocks jeder Kennung eine häufige Ursache: Das FCA-Bulletin 08-131-21 zum Plug-in-Hybrid des Jeep Wrangler von 2021 führt einen Nichtstart mit P0A0A auf Wasser zurück, das an einer gequetschten orangefarbenen Dichtung vorbei in die Hochvoltstecker P1 und P2 am Unterboden gelangte; oft steht zugleich ein Isolationsfehler (P0AA6) im Speicher. Hat sich bereits Korrosion gebildet, sind Kabelsatz oder Wechselrichtermodul zu ersetzen. Erst die Dichtungen ansehen, dann Kontakte reinigen."
  affected_components:
    - hvil_loop_n
    - hv_connectors
  common_causes:
    - id: water_ingress_loop_n_connector
      likelihood: high
      label:
        en: Water in a loop N connector because a seal is pinched or damaged
        de: Wasser in einem Stecker von Kreis N wegen gequetschter oder beschädigter Dichtung
    - id: loop_n_connector_not_seated
      likelihood: medium
      label:
        en: Connector in loop N not fully seated
        de: Stecker in Kreis N nicht vollständig gesteckt
    - id: corroded_interlock_pins
      likelihood: medium
      label:
        en: Interlock pins corroded after earlier moisture
        de: Interlock-Kontakte nach früherer Feuchtigkeit korrodiert
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller that drives and reads loop N faulty
        de: Steuergerät, das Kreis N speist und auswertet, defekt
  symptoms:
    - en: No ready mode or no start, often after rain, washing or wading
      de: Keine Fahrbereitschaft oder kein Start, oft nach Regen, Wäsche oder Wasserdurchfahrt
    - en: Isolation fault stored alongside the interlock code
      de: Isolationsfehler zusammen mit dem Interlock-Code gespeichert
    - en: Hybrid or high-voltage system warning in the cluster
      de: Warnmeldung zum Hybrid- bzw. Hochvoltsystem im Kombiinstrument
  repair:
