- code: U351A
  category: network
  title:
    en: High Voltage System Interlock Circuit D Performance
    de: Hochvoltsystem Interlock-Stromkreis D Funktion
  description:
    en: U351A says that loop D returns a signal, but not the one the module sent out. Many designs feed the loop with pulses rather than a steady level. In a Corun battery patent a microcontroller sends a 0 to 5 V square wave at 100 Hz with half on, half off through the interlock switches of pack, motor controller and vehicle controller, and treats the loop as sound only if frequency, on-time and amplitude return unchanged. A rounded, shifted or weakened pattern hints at contact resistance, moisture or coupled interference rather than a clean break. No maker documents U351A. High voltage may drop out without warning.
    de: U351A besagt, dass aus Schleife D zwar ein Signal zurückkommt, aber nicht das ausgesendete. Viele Schaltungen speisen die Schleife mit Pulsen statt mit festem Pegel. In einem Batterie-Patent von Corun schickt ein Mikrocontroller eine Rechteckwelle von 0 bis 5 V mit 100 Hz und 50 % Tastverhältnis durch die Interlock-Schalter von Akku, Motorsteuerung und Fahrzeugsteuerung; in Ordnung ist die Schleife nur, wenn Frequenz, Tastverhältnis und Amplitude unverändert ankommen. Ein verschliffenes, verschobenes oder schwaches Muster deutet eher auf Übergangswiderstand, Feuchtigkeit oder Störeinkopplung als auf einen Bruch. Kein Hersteller dokumentiert U351A. Die Hochspannung kann unvermittelt wegfallen.
  affected_components:
    - hvil_loop_d
  common_causes:
    - id: corroded_interlock_contacts
      likelihood: high
      label:
        en: Corroded or worn interlock contacts adding resistance to loop D
        de: Korrodierte oder abgenutzte Interlock-Kontakte erhöhen den Widerstand von Kreis D
    - id: moisture_in_lv_connector
      likelihood: medium
      label:
        en: Moisture in a low-voltage connector of the loop
        de: Feuchtigkeit in einem Niedervoltstecker der Schleife
    - id: interference_coupling
      likelihood: low
      label:
        en: Loop wiring routed too close to switching high-voltage cables
        de: Schleifenleitung zu nah an schaltenden Hochvoltkabeln verlegt
    - id: detector_input_fault
      likelihood: low
      label:
        en: Signal input of the evaluating controller faulty
        de: Signaleingang des auswertenden Steuergeräts defekt
  symptoms:
    - en: Sudden loss of high-voltage power while driving or charging
      de: Plötzlicher Ausfall der Hochvoltversorgung während Fahrt oder Laden
    - en: Fault appears after rain, washing or on rough roads
      de: Fehler tritt nach Regen, Wäsche oder auf schlechter Straße auf
    - en: Restart sometimes possible after switching off and on
      de: Neustart nach Aus- und Einschalten mitunter möglich
  repair:
    difficulty: hard
    diy_possible: false
