- code: U3562
  category: network
  title:
    en: Cathode Bypass Valve
    de: Kathoden-Bypassventil
  description:
    en: "Unlike U3561, this code concerns how the cathode bypass valve itself behaves: it does not reach or hold the opening the controller asks for, for instance because it sticks. A Toyota patent shows why a valve stuck shut is serious. While a cold stack is warmed by deliberately inefficient generation, bypass air is supposed to thin out hydrogen in the exhaust; if ice holds the valve closed, all of that air enters the stack, which then produces more power than intended. Toyota spots this from compressor outlet pressure above a limit or from stack current straying from its command, then opens the backpressure valve and slows the compressor. A valve stuck open costs stack pressure instead, as Nissan notes. No maker publishes U3562; that stuck air valves switch on the MIL is documented by Toyota for the Mirai (T-SB-0043-23)."
    de: "Anders als bei U3561 ist hier nicht der Stromkreis, sondern das Verhalten des Kathoden-Bypassventils auffällig: Es erreicht oder hält die verlangte Öffnung nicht, etwa weil es klemmt. Warum ein geschlossen hängendes Ventil heikel ist, zeigt ein Toyota-Patent. Beim Aufwärmen eines kalten Stacks mit absichtlich schlechtem Wirkungsgrad soll Bypassluft den Wasserstoff im Abgas verdünnen; hält Eis das Ventil zu, strömt die ganze Luft durch den Stack, der dann zu viel Leistung abgibt. Toyota erkennt das an zu hohem Druck hinter dem Verdichter oder an einem Stackstrom, der vom Sollwert abweicht, öffnet das Gegendruckventil und senkt die Verdichterdrehzahl. Hängt es offen, fehlt laut Nissan Stackdruck. U3562 ist öffentlich nicht dokumentiert; dass klemmende Luftventile die MIL schalten, belegt Toyota beim Mirai (T-SB-0043-23)."
