- code: U3553
  category: network
  title:
    en: Hydrogen Tank B Valve Control Circuit
    de: Wasserstofftank B Ventil Steuerkreis
  description:
    en: "U3553 means the controller sees a fault in the drive circuit of the solenoid valve on tank B, such as an open coil, a short to ground or supply, or an output that does not follow its command. Hyundai shows in a patent how such valves can be checked: one current sensor reads the operating current of several tank solenoids; if it falls below a reference, the controller switches the PWM duty from 100 to 90 % and looks whether the fed-back duty appears inverted. If not, the valve is judged faulty. In the workshop that means measuring coil resistance and following the harness from tank to controller. No maker documents U3553. Until repaired, tank B stays closed; U3550 and U3556 are the same fault on tanks A and C."
    de: "U3553 bedeutet, dass das Steuergerät im Ansteuerkreis des Magnetventils an Tank B einen Fehler erkennt – etwa eine offene Spule, Schluss nach Masse oder Plus oder einen Ausgang, der seinem Befehl nicht folgt. Wie man solche Ventile prüfen kann, zeigt ein Hyundai-Patent: Ein einziger Stromsensor erfasst den Betriebsstrom mehrerer Tank-Magnetventile; sinkt er unter einen Referenzwert, stellt das Steuergerät das PWM-Tastverhältnis von 100 auf 90 % um und prüft, ob das rückgemeldete Signal invertiert erscheint. Bleibt das aus, gilt das Ventil als defekt. In der Werkstatt heißt das: Spulenwiderstand messen und den Kabelsatz vom Tank zum Steuergerät verfolgen. Kein Hersteller dokumentiert U3553. Bis zur Reparatur bleibt Tank B zu; U3550 und U3556 sind derselbe Fehler an Tank A und C."
  affected_components:
    - h2_tank_b_valve
    - valve_wiring
  common_causes:
    - id: harness_connector
      likelihood: high
      label:
        en: Damaged wiring or corroded connector to the tank B valve
        de: Beschädigte Leitung oder korrodierter Stecker zum Ventil an Tank B
    - id: coil_open_or_shorted
      likelihood: medium
      label:
        en: Solenoid coil open or shorted
        de: Magnetspule unterbrochen oder kurzgeschlossen
    - id: driver_stage
      likelihood: low
      label:
        en: Output stage of the control unit faulty
        de: Endstufe des Steuergeräts defekt
  symptoms:
    - en: Hydrogen system warning
      de: Warnung des Wasserstoffsystems
    - en: Range reduced because tank B is not used
      de: Reichweite geringer, weil Tank B nicht genutzt wird
