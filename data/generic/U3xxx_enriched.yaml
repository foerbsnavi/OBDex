- code: U355C
  category: network
  title:
    en: Charge Air Cooler Outlet Temperature Sensor Circuit
    de: Ladeluftkühler Austritt Temperatursensor Stromkreis
  description:
    en: "U355C reports a circuit fault on the temperature sensor behind the charge air cooler. Compression heats the air strongly: Honda gives about 120 °C at the compressor outlet, while the stack works at 80 to 90 °C, so the air is first brought down to roughly 60 to 75 °C. The sensor confirms this cooling before the air reaches the humidifier. In a Toyota patent it sits between intercooler and humidifier, and if the intercooler coolant pump fails, the controller slows the compressor to keep air temperature below a set limit; Nissan derives an upper pressure limit from the same reading. No maker documents U355C publicly. Without a valid temperature, humidifier and membrane lose their protection, so a warning and a careful cut in power should follow. Pressure here is U355A/U355B."
    de: "U355C zeigt einen Kreisfehler am Temperatursensor hinter dem Ladeluftkühler. Verdichten erhitzt die Luft: Honda nennt rund 120 °C am Verdichteraustritt, während der Stack bei 80 bis 90 °C arbeitet; deshalb kühlt der Ladeluftkühler sie zunächst auf etwa 60 bis 75 °C. Der Sensor bestätigt diese Abkühlung, bevor die Luft den Befeuchter erreicht. Bei Toyota sitzt er laut Patent zwischen Ladeluftkühler und Befeuchter; fällt die Kühlmittelpumpe des Kühlers aus, senkt das Steuergerät die Verdichterdrehzahl, bis die Temperatur wieder unter einem Grenzwert liegt. Nissan leitet aus demselben Messwert eine Obergrenze für den Druck ab. Öffentlich dokumentiert kein Hersteller U355C. Ohne gültige Temperatur fehlt Befeuchter und Membran der Schutz; Warnung und vorsichtige Leistungsrücknahme folgen. Druck dort: U355A/U355B."
  affected_components:
    - cac_outlet_temperature_sensor
    - sensor_wiring
  common_causes:
    - id: harness_connector
      likelihood: high
      label:
        en: Open or short in wiring or connector of the temperature sensor
        de: Unterbrechung oder Kurzschluss an Leitung oder Stecker des Temperatursensors
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Temperature sensor (thermistor) faulty internally
        de: Temperatursensor (Thermistor) intern defekt
    - id: sensor_ground_fault
      likelihood: low
      label:
        en: Sensor ground or reference circuit faulty
        de: Masse- oder Referenzkreis des Sensors gestört
