- code: U302E
  category: network
  title:
    en: Ignition Output On
    de: Zündungsausgang Ein
  description:
    en: "U302E applies to an output intended to carry voltage in On alone, which means it has to switch off while the starter turns. The driving module must blank out that intended gap during cranking and judge the output only in steady power modes, otherwise every start would log the code. How such a check can be built is shown in Yazaki's patent CN106797120A: a controller measures the voltage behind a second ignition relay, treats a reading below a threshold set between nominal voltage and 0 V as a relay that failed open, warns the driver on a display and moves the affected loads over to the first ignition feed. Transferred to U302E, a dead output in On points to a relay stuck open, a blown fuse or a broken wire, while voltage in Off points to a welded contact or a driver stuck on. No manufacturer documents U302E publicly."
    de: "U302E gilt für einen Ausgang, der ausschließlich in Ein versorgt sein und daher abschalten soll, solange der Anlasser dreht. Das treibende Steuergerät muss diese gewollte Lücke ausblenden und den Ausgang nur in stabilen Betriebszuständen bewerten, sonst stünde der Code nach jedem Start im Speicher. Wie eine solche Prüfung aussehen kann, zeigt Yazakis Patent CN106797120A: Eine Steuerung misst die Spannung hinter einem zweiten Zündrelais, wertet einen Wert unter einer Schwelle zwischen Nennspannung und 0 V als offen hängendes Relais, warnt über eine Anzeige und versorgt die Verbraucher ersatzweise aus der ersten Zündleitung. Für U302E heißt das: Fehlt in Ein die Spannung, liegt es an Relais, Sicherung oder Leitung; liegt in Aus Spannung an, an verschweißtem Kontakt oder hängendem Treiber. Kein Hersteller dokumentiert U302E öffentlich."
  affected_components:
    - ignition_output
    - ignition_relay
    - output_wiring
  common_causes:
    - id: relay_stuck_open
      likelihood: medium
      label:
        en: Run relay not closing, e.g. burnt contacts or open coil
        de: Fahrtrelais schließt nicht, etwa wegen verbrannter Kontakte oder unterbrochener Spule
    - id: run_fuse_or_wire_open
      likelihood: medium
      label:
        en: Blown fuse or broken wire behind the relay
        de: Durchgebrannte Sicherung oder gebrochene Leitung hinter dem Relais
    - id: relay_welded_or_driver_on
      likelihood: medium
      label:
        en: Welded contact or driver stuck on, leaving the output live in Off
        de: Verschweißter Kontakt oder hängender Treiber, Ausgang bleibt in Aus aktiv
    - id: crank_blanking_software
      likelihood: low
      label:
        en: Module software judging the intended cut during cranking as a fault
        de: Steuergeräte-Software wertet die gewollte Abschaltung beim Anlassen als Fehler
  symptoms:
    - en: Loads on the run-only feed dead with the engine running
      de: Verbraucher an der reinen Fahrtleitung bei laufendem Motor ohne Funktion
    - en: Power supply warning in the cluster
      de: Warnung zur Stromversorgung im Kombiinstrument
    - en: Battery discharged when the output stays on after shut-off
      de: Batterie entladen, wenn der Ausgang nach dem Abstellen eingeschaltet bleibt
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [20, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300E, U302D, U302F, U3030, P2530]
  sources:
    - https://patents.google.com/patent/CN106797120A/en
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U302F
  category: network
  title:
    en: Ignition Output Accessory
    de: Zündungsausgang Zubehör
  description:
    en: "U302F is logged by the module that switches the accessory feed for audio, sockets or windows when that feed is out of step with its own command. Two normal behaviours have to be ruled out first. Keyless systems cut accessory power during cranking: in Tokai Rika's patent US7254466B2 the power supply unit releases the accessory relay when start is requested and re-energizes it only once the engine controller reports that combustion has begun. GM's 2012 pickups, on the other hand, keep accessory voltage on after key-off through a relay inside the BCM for roughly 10 minutes, unless a door is opened. Outside those windows, a live feed in a locked car suggests a welded relay or a driver stuck on, and a dead feed in accessory an open relay, fuse or wire. No manufacturer documents U302F publicly."
    de: "U302F legt das Steuergerät ab, das die Zubehörleitung für Radio, Steckdosen oder Fenster schaltet, wenn diese Leitung nicht zu seinem eigenen Befehl passt. Zwei normale Verhaltensweisen sind auszuschließen. Schlüssellose Systeme nehmen den Zubehörstrom beim Anlassen weg: In Tokai Rikas Patent US7254466B2 gibt die Stromversorgungseinheit das Zubehörrelais bei der Startanforderung frei und zieht es erst wieder an, wenn das Motorsteuergerät die begonnene Verbrennung meldet. GMs Pickups 2012 halten die Zubehörspannung nach dem Abstellen über ein Relais im BCM noch rund 10 Minuten, sofern keine Tür aufgeht. Außerhalb dieser Fenster deutet Spannung im verriegelten Fahrzeug auf ein verschweißtes Relais oder einen hängenden Treiber, eine tote in Zubehör auf Relais, Sicherung oder Leitung. Kein Hersteller dokumentiert U302F öffentlich."
  affected_components:
    - ignition_output
    - ignition_relay
    - output_wiring
  common_causes:
    - id: accessory_relay_welded
      likelihood: medium
      label:
        en: Accessory relay welded or its driver stuck on
        de: Zubehörrelais verschweißt oder sein Treiber hängt ein
    - id: accessory_relay_open
      likelihood: medium
      label:
        en: Accessory relay not pulling in
        de: Zubehörrelais zieht nicht an
    - id: accessory_fuse_wire_open
      likelihood: medium
      label:
        en: Blown accessory fuse or open feed wire
        de: Durchgebrannte Zubehörsicherung oder unterbrochene Zuleitung
    - id: aftermarket_load
      likelihood: low
      label:
        en: Retrofitted equipment overloading or backfeeding the accessory feed
        de: Nachgerüstetes Gerät überlastet die Zubehörleitung oder speist zurück
  symptoms:
    - en: Radio, sockets or windows dead in accessory mode
      de: Radio, Steckdosen oder Fenster in der Zubehörstellung ohne Funktion
    - en: Accessories still on long after locking, battery drained
      de: Zubehör lange nach dem Verriegeln noch an, Batterie entladen
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [10, 500]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U300F, U3032, U302B, U302E, U3030]
  sources:
    - https://patents.google.com/patent/US7254466B2/en
    - https://www.gmupfitter.com/wp-content/uploads/2021/05/2012_LD_ElectricalPickupsChassisCabs_100813.pdf
  reviewed: '2026-11-06'

- code: U3030
  category: network
  title:
    en: Ignition Output Start
    de: Zündungsausgang Start
  description:
    en: "U3030 points to the start output, the line through which a module energizes the starter relay or passes on a crank request; it should be active for seconds at most. In Tokai Rika's push-button start patents the power supply unit switches the starter relay on together with the ignition relays once brake pedal and button are confirmed, and off as soon as the engine controller reports that the engine has fired. Which unit owns this output varies: on GM's 2012 pickups the engine control module, not the body controller, drives the starter enable relay. A module logs U3030 when the line stays dead although cranking is commanded, leaving the engine unable to crank, or stays live after the command ends, which can keep the starter engaged. No manufacturer documents U3030 publicly; starter relay circuit faults have their own codes, P0615 to P0617."
    de: "U3030 weist auf den Startausgang hin, über den ein Steuergerät das Anlasserrelais ansteuert oder eine Startanforderung weitergibt; er soll höchstens wenige Sekunden aktiv sein. In Tokai Rikas Patenten zum Tasterstart schaltet die Stromversorgungseinheit das Anlasserrelais mit den Zündrelais ein, sobald Bremspedal und Taster bestätigt sind, und wieder ab, wenn das Motorsteuergerät das Anspringen meldet. Wer den Ausgang besitzt, ist verschieden: Bei GMs Pickups 2012 steuert das Motorsteuergerät das Starter-Freigaberelais, nicht das Karosseriesteuergerät. U3030 fällt, wenn die Leitung trotz Startbefehl spannungslos bleibt – der Motor springt nicht an – oder nach dem Befehl aktiv bleibt, was den Anlasser eingespurt halten kann. Kein Hersteller dokumentiert U3030 öffentlich; Fehler im Anlasserrelais-Kreis haben eigene Codes, P0615 bis P0617."
  affected_components:
    - ignition_output
    - starter_relay
    - output_wiring
  common_causes:
    - id: start_output_driver_fault
      likelihood: medium
      label:
        en: Faulty start driver in the module, not switching or stuck on
        de: Defekter Starttreiber im Steuergerät, schaltet nicht oder hängt ein
    - id: start_wire_open_short
      likelihood: medium
      label:
        en: Start control wire open or shorted to ground or voltage
        de: Startsteuerleitung unterbrochen oder mit Masse oder Spannung kurzgeschlossen
    - id: starter_relay_coil_fault
      likelihood: medium
      label:
        en: Open or shorted coil in the starter relay loading the output
        de: Unterbrochene oder kurzgeschlossene Spule im Anlasserrelais belastet den Ausgang
    - id: low_voltage_cranking
      likelihood: low
      label:
        en: Weak battery pulling the output level down during cranking
        de: Schwache Batterie zieht den Ausgangspegel beim Anlassen herunter
  symptoms:
    - en: Engine does not crank when start is requested
      de: Motor dreht beim Startversuch nicht durch
    - en: Starter keeps running or grinding after the engine has fired
      de: Anlasser läuft nach dem Anspringen weiter oder kratzt
    - en: Start only on a second or third attempt
      de: Start erst beim zweiten oder dritten Versuch
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [20, 800]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
