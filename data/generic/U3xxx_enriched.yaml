- code: U356A
  category: network
  title:
    en: Anode Drain Valve Control Circuit
    de: Anoden-Ablassventil Steuerkreis
  description:
    en: "U356A concerns the electrical drive of the solenoid sitting under the anode water trap, which lets condensate leave the hydrogen loop. Hyundai opens it when a level sensor reports a full trap and closes it at a low mark so no hydrogen follows; if that sensor fails, the valve is closed as soon as anode pressure falls faster than a set rate. GM also gives the drain valve an emergency role: after an injector sticks open, hydrogen may be let out through it until the concentration in the exhaust reaches a limit. A broken or shorted drive circuit takes away both jobs. No maker documents U356A publicly. Since water keeps collecting in the anode, a warning and reduced or interrupted operation are plausible. The valve's mechanical state is U356B, the header drain circuit U356C."
    de: "Gemeint ist die Ansteuerung des Anoden-Ablassventils, des Magnetventils am Boden des Wasserabscheiders, durch das Kondensat den Wasserstoffkreis verlässt. Hyundai öffnet es, wenn ein Füllstandsensor einen vollen Abscheider meldet, und schließt es bei einer unteren Marke, damit kein Wasserstoff nachströmt; fällt der Sensor aus, schließt es, sobald der Anodendruck schneller als vorgegeben sinkt. Bei GM hat das Ventil zudem eine Notfallrolle: Hängt ein Injektor offen, darf darüber Wasserstoff entweichen, bis seine Konzentration im Abgas eine Grenze erreicht. Ein unterbrochener oder kurzgeschlossener Kreis nimmt beides weg. Öffentlich nennt kein Hersteller U356A. Da sich Wasser in der Anode sammelt, sind Warnung und gedrosselter oder unterbrochener Betrieb wahrscheinlich. Das Ventilverhalten meldet U356B, den Sammlerkreis U356C."
