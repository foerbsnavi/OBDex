- code: U352D
  category: network
  title:
    en: High Voltage System Interlock Circuit J
    de: Hochvoltsystem Interlock-Stromkreis J
  description:
    en: "U352D is the summary code for interlock circuit J, the ninth loop in J2012 lettering, which leaves out the letter I. What the loop contains is up to the maker, and none has published it. A loop need not pass through plugs only: a Ford patent for a centralised interlock leads the circuit across mating body parts such as the hood or trunk latch and its receptacle, so that opening the lid by itself switches high voltage off; floor access panels are named as a further option. Where a design like this is used, a lid that has not fully latched can explain a fault on loop J. Check latches before wiring; the vehicle cannot become ready until the loop is complete."
    de: "U352D ist der Sammelcode für Interlock-Kreis J, nach der J2012-Zählung ohne den Buchstaben I die neunte Schleife. Was zu ihr gehört, legt der Hersteller fest; veröffentlicht hat es keiner. Eine Schleife muss nicht nur durch Stecker führen: Ein Ford-Patent für ein zentrales Interlock leitet den Kreis über zusammengehörige Karosserieteile wie das Schloss von Motorhaube oder Kofferraumdeckel und dessen Gegenstück, sodass schon das Öffnen der Klappe die Hochspannung abschaltet; auch Bodenklappen werden genannt. Bei solcher Bauweise erklärt ein nicht vollständig eingerastetes Schloss einen Fehler an Kreis J. Erst Schlösser, dann Leitungen prüfen; fahrbereit wird das Fahrzeug erst mit geschlossener Schleife."
  affected_components:
    - hvil_loop_j
    - hv_connectors
  common_causes:
    - id: loop_j_connector_unlatched
      likelihood: high
      label:
        en: Connector in loop J not fully latched
        de: Stecker in Kreis J nicht vollständig eingerastet
    - id: lid_latch_not_engaged
      likelihood: medium
      label:
        en: Hood, trunk or access panel latch wired into loop J not fully engaged
        de: In Kreis J eingebundenes Schloss von Haube, Klappe oder Bodenabdeckung nicht ganz eingerastet
    - id: loop_j_harness_damage
      likelihood: medium
      label:
        en: Loop J wiring damaged
        de: Leitung von Kreis J beschädigt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Controller that drives and reads loop J faulty
        de: Steuergerät, das Kreis J speist und auswertet, defekt
  symptoms:
    - en: No ready mode, often right after a hood, trunk or underbody panel was opened
      de: Keine Fahrbereitschaft, oft direkt nachdem Haube, Klappe oder Bodenabdeckung geöffnet waren
    - en: High-voltage system warning in the instrument cluster
      de: Warnmeldung zum Hochvoltsystem im Kombiinstrument
    - en: Charging blocked
