- code: U3007
  category: network
  title:
    en: Control Module Input Power B Circuit/Open
    de: Steuergerät Eingangsspannung B Stromkreis/Unterbrechung
  description:
    en: "U3007 is the partner code for the second battery feed, B. In GM's 25OBDG04B brake module B is KL30_2, the supply for the valve coils: the module compares it with KL30_1 and sets U3007 when it stays below 53.85 % of that value for 75 ms, and also when the switch for valve power reports less than half the supply voltage for 50 ms; Type B with MIL. The other GM brake supplier (25OBDG03B) uses U3007 differently, for charge-pump tests that could not run three times because both internal supply paths were in undervoltage. So B is a separate fused feed, not a backup of A, and a fault on B alone points to its own fuse or pin. Jeep's 08-106-21 for the 2021 Wrangler 4xe lists U3007-00 first among codes cured by charging or replacing the 12 V battery."
    de: "U3007 ist der Partnercode für den zweiten Batterieeingang B. Im GM-Bremssteuergerät aus 25OBDG04B ist B die Versorgung KL30_2 für die Ventilspulen: Das Gerät vergleicht sie mit KL30_1 und setzt U3007, wenn sie 75 ms lang unter 53,85 % davon bleibt, außerdem wenn der Ventil-Leistungsschalter 50 ms lang weniger als die halbe Versorgungsspannung zurückmeldet; Typ B mit MIL. Der andere GM-Bremszulieferer (25OBDG03B) nutzt U3007 anders, für Ladungspumpentests, die dreimal wegen Unterspannung auf beiden internen Versorgungswegen nicht laufen konnten. B ist also ein eigener abgesicherter Eingang, keine Reserve für A; tritt nur U3007 auf, sind seine eigene Sicherung oder sein Pin verdächtig. Jeep (08-106-21, Wrangler 4xe 2021) nennt U3007-00 zuerst unter den Codes, die Laden oder Tausch der 12-V-Batterie beseitigt."
  affected_components:
    - module_power_b
    - fuse
    - power_wiring
  common_causes:
    - id: fuse_blown
      likelihood: high
      label:
        en: Blown or poorly seated fuse feeding input B
        de: Durchgebrannte oder schlecht sitzende Sicherung für Eingang B
    - id: weak_battery
      likelihood: medium
      label:
        en: Low battery voltage making feed B fail the comparison
        de: Niedrige Batteriespannung, Eingang B fällt beim Vergleich durch
    - id: connector_or_wire
      likelihood: medium
      label:
        en: Damaged wire or spread terminal on supply B
        de: Beschädigte Leitung oder aufgeweiteter Kontakt an Versorgung B
    - id: internal_switch
      likelihood: low
      label:
        en: Valve power switch or internal supply path in the module faulty
        de: Ventil-Leistungsschalter oder interner Versorgungsweg im Steuergerät defekt
  symptoms:
    - en: ABS and stability control warnings, functions shut off
      de: Warnungen für ABS und Stabilitätsregelung, Funktionen abgeschaltet
    - en: Check engine light on in some vehicles
      de: Bei manchen Fahrzeugen Motorkontrollleuchte an
    - en: Often stored together with U3006 when the battery is weak
      de: Bei schwacher Batterie oft zusammen mit U3006 gespeichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 400]
    estimated_hours: [0.3, 2.5]
