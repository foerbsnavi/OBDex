- code: U356F
  category: network
  title:
    en: Anode Header Drain Valve Heater Relay Control Circuit
    de: Anoden-Sammler-Ablassventil Heizrelais Steuerkreis
  description:
    en: U356F reports that the relay feeding the heater on the anode header drain valve cannot be driven properly because its coil circuit is open or shorted. That valve hangs on the stack's anode outlet header, where condensate gathers and can freeze during a cold soak. GM targets exactly this zone with heated outlet manifolds so ice does not block them during subzero starts. Whether the header valve carries its own heater and when it is switched is not described in public maker documents; the code only implies a relay separate from the one for the sump drain valve (U356E). Such a fault can leave the heater dead, risking an iced valve and a delayed or failed cold start, or keep it powered, which costs battery energy. In warm weather the effect is rarely noticeable. U356F has no public manufacturer source.
    de: Gestört ist der Steuerkreis des Relais, das die Heizung am Anoden-Sammler-Ablassventil versorgt. Das Ventil hängt am Austrittssammler der Anode, wo sich Kondensat sammelt und beim Parken in der Kälte gefrieren kann. Genau diesen Bereich beheizt GM laut Patent, damit Eis die Austrittskanäle beim Start unter null nicht verstopft. Ob das Sammlerventil eine eigene Heizung hat und wann sie läuft, beschreibt keine öffentliche Herstellerunterlage; der Code setzt nur ein eigenes Relais neben dem des Sumpf-Ablassventils (U356E) voraus. Ist der Spulenkreis unterbrochen oder kurzgeschlossen, bleibt die Heizung kalt – mit dem Risiko eines vereisten Ventils und eines verzögerten oder gescheiterten Kaltstarts – oder sie läuft dauernd und zieht Batterieenergie. Bei Wärme merkt man davon selten etwas. Eine öffentliche Herstellerquelle zu U356F fehlt.
