- code: U355E
  category: network
  title:
    en: Expander Inlet Pressure Sensor 2 Circuit
    de: Expander Eintritt Drucksensor 2 Stromkreis
  description:
    en: "U355E names a circuit fault on pressure sensor 2 at the expander inlet. Conditions there are harsh: cathode exhaust carries the product water of the stack, and Volkswagen notes in a turbine patent that the pressure drop inside the turbine makes water condense even behind a droplet separator, eroding the blades. A Hannover study on fuel cell turbines likewise asks for robustness against droplets and lets the turbine set the cathode operating pressure. Ford describes how wet pressure sensors in a fuel cell can freeze and give no or false signals at a cold start. A second sensor lets the controller spot such a reading. No maker documents U355E publicly. A failure of sensor 2 alone mainly removes this cross-check; together with U355D the expander control is blind and power is likely limited."
    de: "U355E: Kreisfehler am zweiten Drucksensor vor dem Expander, einem rauen Einbauort. Das Kathodenabgas führt das im Stack entstandene Wasser mit. Volkswagen beschreibt in einem Turbinen-Patent, dass durch den Druckabfall in der Turbine selbst hinter einem Tropfenabscheider Wasser kondensiert und die Schaufeln erodiert. Eine Hannoveraner Studie verlangt von solchen Turbinen ebenfalls Tropfenfestigkeit und regelt mit ihnen den Kathodendruck. Ford schildert, dass feuchte Drucksensoren einer Brennstoffzelle einfrieren und beim Kaltstart kein oder ein falsches Signal geben können. Mit einem zweiten Sensor erkennt das Steuergerät solche Werte. Öffentlich dokumentiert kein Hersteller U355E. Fällt nur Sensor 2 aus, entfällt vor allem die Gegenprobe; zusammen mit U355D ist die Expander-Regelung blind und die Leistung wohl begrenzt."
  affected_components:
    - expander_inlet_pressure_sensor_2
    - sensor_wiring
  common_causes:
    - id: harness_connector_exhaust_side
      likelihood: high
      label:
        en: Wiring or connector of sensor 2 corroded by exhaust moisture, open or shorted
        de: Leitung oder Stecker von Sensor 2 durch Abgasfeuchte korrodiert, unterbrochen oder kurzgeschlossen
    - id: water_frozen_on_sensor
      likelihood: medium
      label:
        en: Water frozen in the sensor port at cold start
        de: Wasser im Sensoranschluss beim Kaltstart gefroren
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Expander inlet pressure sensor 2 faulty internally
        de: Expander-Eintrittsdrucksensor 2 intern defekt
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Fault appears mainly after cold starts
      de: Fehler tritt vor allem nach Kaltstarts auf
    - en: Reduced power if sensor 1 is affected as well
      de: Weniger Leistung, wenn auch Sensor 1 betroffen ist
