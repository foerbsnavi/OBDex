      de: Klimaanlage oder elektrische Heizung nicht verfügbar
    - en: In some designs no ready mode at all
      de: Bei manchen Auslegungen gar keine Fahrbereitschaft
    - en: High-voltage or climate warning in the cluster
      de: Hochvolt- oder Klimawarnung im Kombiinstrument
