- code: U3558
  category: network
  title:
    en: Hydrogen Tank C Valve
    de: Wasserstofftank C Ventil
  description:
    en: "U3558 is listed only as Hydrogen Tank C Valve, without a fault type, so it serves as the general valve code for tank C on three-tank vehicles. FMVSS 308 shows what such a valve must withstand: tens of thousands of pressure cycles, partly at extreme temperatures, chatter flow, and afterwards no more than 10 NmL of leakage per hour. Toyota treats tank and valve as one service part on the Mirai and has it replaced every 15 years. A valve fault on the third tank costs range rather than mobility as long as tanks A and B work. No manufacturer documents U3558 publicly; the diagnosis starts with the freeze frame data and with U3556 and U3557 for the electrical side of the same valve."
    de: "U3558 trägt in den Codelisten nur den Titel „Hydrogen Tank C Valve“ ohne Fehlerart und dient damit als allgemeiner Ventilcode für Tank C bei Drei-Tank-Fahrzeugen. Was ein solches Ventil aushalten muss, legt FMVSS 308 fest: zehntausende Druckzyklen, teils bei extremen Temperaturen, Flattern im Durchfluss und danach höchstens 10 NmL Leckage pro Stunde. Toyota führt Tank und Ventil beim Mirai als ein Wartungsteil und lässt es nach 15 Jahren tauschen. Solange Tank A und B arbeiten, kostet ein Ventilfehler am dritten Tank eher Reichweite als Fahrbereitschaft. Öffentlich dokumentiert kein Hersteller U3558; die Diagnose beginnt mit den Umgebungsdaten des Fehlerspeichers sowie mit U3556 und U3557 für die elektrische Seite desselben Ventils."
  affected_components:
    - h2_tank_c_valve
  common_causes:
    - id: valve_mechanical
      likelihood: medium
      label:
        en: Tank C valve sticking or not sealing
        de: Ventil an Tank C klemmt oder dichtet nicht
    - id: valve_electrical
      likelihood: medium
      label:
