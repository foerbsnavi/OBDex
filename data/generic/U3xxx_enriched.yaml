- code: U3520
  category: network
  title:
    en: High Voltage System Interlock Circuit E High
    de: Hochvoltsystem Interlock-Stromkreis E hoch
  description:
    en: "U3520 means the fifth interlock loop sits above its permitted range, usually because a loop wire has picked up battery voltage or another low-voltage feed. Lear's patent for a pulsed interlock tester shows how to pin this down further: it measures current at generator and detector pins and, by comparing them, works out at which end the unwanted link to the 12 V side lies. Simpler controllers only see the raised level. No manufacturer has published U3520. In the workshop, test each loop E wire against 12 V with the plugs at both ends disconnected; wet or corroded connectors next to fused feeds are typical spots."
    de: "U3520 bedeutet, dass die fünfte Interlock-Schleife über ihrem zulässigen Bereich liegt, meist weil eine Schleifenleitung Batteriespannung oder eine andere Niedervoltversorgung abbekommt. Lears Patent für einen gepulsten Interlock-Prüfer zeigt, wie man das weiter eingrenzt: Es misst den Strom an den Anschlüssen von Generator und Detektor und ermittelt durch Vergleich, an welchem Ende die ungewollte Verbindung zur 12-V-Seite sitzt. Einfachere Steuergeräte sehen nur den erhöhten Pegel. U3520 hat kein Hersteller veröffentlicht. In der Werkstatt jede Leitung von Kreis E bei beidseitig getrennten Steckern gegen 12 V prüfen; nasse oder korrodierte Stecker neben abgesicherten Versorgungen sind typische Stellen."
  affected_components:
    - hvil_loop_e
    - hvil_wiring
  common_causes:
    - id: loop_e_short_to_voltage
      likelihood: high
      label:
        en: Loop E wire shorted to a 12 V supply
        de: Leitung von Kreis E mit Schluss nach 12 V
    - id: wet_lv_connector
      likelihood: medium
      label:
        en: Water or corrosion bridging a loop pin to a supply pin
        de: Wasser oder Korrosion verbindet einen Schleifenkontakt mit einem Versorgungskontakt
    - id: source_stuck_on
      likelihood: low
