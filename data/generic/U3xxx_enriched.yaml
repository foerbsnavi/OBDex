- code: U3022
  category: network
  title:
    en: Ignition Input Accessory/Off
    de: Zündungseingang Zubehör/Aus
  description:
    en: "U3022 is the last of the ignition input codes and, by its name, covers a line or line state that belongs to Accessory and Off together, i.e. to all positions in which the engine is not meant to run. GM's 2012 pickup wiring manual has a comparable case: its coded Off/Run/Crank circuit shows one common state for key out and for accessory, separate from key in, run and crank. A module that sees this accessory/off state while the network reports run or crank, or the opposite with the vehicle parked, logs U3022. No manufacturer documents U3022 publicly. In practice the code is less about a single dead wire than about two signals disagreeing, so stored codes for U300C, U300F or U3011 in the same module are useful hints as to which circuit is wrong."
    de: "U3022 schließt die Reihe der Zündungseingänge ab und betrifft dem Namen nach eine Leitung oder einen Leitungszustand, der zu Zubehör und Aus gemeinsam gehört, also zu allen Stellungen, in denen der Motor nicht laufen soll. GMs Schaltplanhandbuch der Pickups 2012 kennt einen ähnlichen Fall: Der codierte Off/Run/Crank-Kreis zeigt für Schlüssel abgezogen und für Zubehör denselben Zustand, getrennt von Schlüssel steckt, Fahrt und Anlassen. Sieht ein Steuergerät diesen Zubehör/Aus-Zustand, während das Netz Fahrt oder Anlassen meldet, oder umgekehrt bei geparktem Fahrzeug, legt es U3022 ab. Kein Hersteller dokumentiert U3022 öffentlich. Meist geht es weniger um eine einzelne tote Leitung als um zwei widersprüchliche Signale; gespeicherte Codes U300C, U300F oder U3011 im selben Gerät zeigen, welcher Kreis falsch liegt."
  affected_components:
    - ignition_input
    - ignition_switch
    - ignition_wiring
  common_causes:
    - id: switch_contact_resistance
      likelihood: medium
      label:
        en: Contact resistance in the ignition switch giving an in-between level
        de: Übergangswiderstand im Zündschalter erzeugt einen Zwischenpegel
