        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker der Relaisspule
    - id: relay_faulty
      likelihood: medium
      label:
        en: Heater relay faulty
        de: Heizrelais defekt
    - id: fuse_or_supply_missing
      likelihood: low
      label:
        en: Fuse or supply of the relay circuit missing
        de: Sicherung oder Versorgung des Relaiskreises fehlt
    - id: fuel_cell_controller_driver
      likelihood: low
      label:
        en: Relay driver in the fuel cell control unit faulty
        de: Relaistreiber im Brennstoffzellen-Steuergerät defekt
  symptoms:
    - en: Fuel cell warning message
      de: Warnmeldung des Brennstoffzellensystems
    - en: Delayed or failed start in frost
      de: Verzögerter oder gescheiterter Start bei Frost
    - en: Often no noticeable effect in warm weather
      de: Bei warmem Wetter oft keine spürbare Auswirkung
