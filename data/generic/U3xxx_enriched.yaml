- code: U3544
  category: network
  title:
    en: High Voltage System Interlock Circuit O High
    de: Hochvoltsystem-Interlock-Kreis O hoch
  description:
    en: HVIL loop O voltage above expected range. The interlock is a low-voltage signal loop routed through the HV connectors and covers; the monitoring module drives a current or signal through it and opens the HV contactors, or refuses to close them, when the loop is broken or out of range, so that no HV connection can be opened while live.
    de: Spannung am HVIL-Loop O über Sollbereich. Der Interlock ist eine Niedervolt-Signalschleife, die durch die HV-Stecker und -Abdeckungen läuft; das überwachende Steuergerät speist einen Strom oder ein Signal ein und öffnet die HV-Schütze oder schließt sie gar nicht erst, wenn die Schleife unterbrochen ist oder außerhalb des Sollbereichs liegt, damit keine HV-Verbindung unter Spannung getrennt werden kann.
  affected_components:
    - hvil_loop_o
    - hvil_wiring
  common_causes:
    - id: open_loop
      likelihood: high
      label:
        en: Interlock loop open
        de: Interlock-Loop offen
    - id: connector_unmated
      likelihood: medium
      label:
        en: HV connector, service disconnect or cover switch not fully seated
        de: HV-Stecker, Service-Trennstecker oder Deckelschalter nicht vollständig gesteckt
    - id: interlock_wiring_fault
      likelihood: medium
      label:
        en: Damaged interlock wiring or corroded terminal in the loop
        de: Beschädigte Interlock-Leitung oder korrodierter Kontakt in der Schleife
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Fault in the module that drives and evaluates the interlock loop
        de: Fehler im Steuergerät, das die Interlock-Schleife speist und auswertet
  symptoms:
    - en: Vehicle will not switch to ready mode or the HV system shuts down
      de: Fahrzeug lässt sich nicht fahrbereit schalten oder das HV-System schaltet ab
    - en: High-voltage system warning in the instrument cluster
