- code: U353A
  category: network
  title:
    en: High Voltage System Interlock Circuit M Performance
    de: Hochvoltsystem Interlock-Stromkreis M Funktion
  description:
    en: U353A flags loop M as questionable rather than plainly open or shorted. Redundant monitoring can produce exactly that state. NIO patented an interlock fed by two signal generators whose pulse trains overlap on one line; with duty ratios A and B the detector expects a combined average of A plus B minus their product. If only one part arrives, the system can keep the contactors closed and name the generator whose share is missing as a fault candidate, though the real cause may sit outside it. The aim is to avoid needless shutdowns caused by a failing monitoring part. Under such logic a performance code may be logged while the vehicle still drives. No maker documents U353A.
    de: U353A kennzeichnet Schleife M als fragwürdig, nicht als klar offen oder kurzgeschlossen. Genau diesen Zustand kann eine redundante Überwachung erzeugen. NIO hat ein Interlock patentiert, das zwei Signalgeber speisen, deren Pulsfolgen sich auf einer Leitung überlagern; bei Tastverhältnissen A und B erwartet der Detektor im Mittel A plus B minus deren Produkt. Kommt nur ein Anteil an, kann das System die Schütze geschlossen lassen und den Geber mit dem fehlenden Anteil als Fehlerkandidaten nennen, auch wenn die wahre Ursache außerhalb liegt. Ziel ist, unnötige Abschaltungen durch ein versagendes Überwachungsteil zu vermeiden. Mit einer solchen Logik kann ein Funktionscode gespeichert werden, während das Fahrzeug weiterfährt. U353A dokumentiert kein Hersteller.
  affected_components:
    - hvil_loop_m
  common_causes:
    - id: signal_source_degraded
      likelihood: medium
      label:
        en: One of the loop M signal sources weak or failed
        de: Eine der Signalquellen von Kreis M geschwächt oder ausgefallen
    - id: loose_contact_loop_m
      likelihood: medium
      label:
        en: Loose contact in a loop M connector distorting the signal
        de: Wackelkontakt in einem Stecker von Kreis M verfälscht das Signal
    - id: detector_circuit_fault
      likelihood: low
      label:
        en: Detection circuit for loop M faulty
        de: Auswerteschaltung für Kreis M defekt
  symptoms:
    - en: Warning lamp while the vehicle keeps driving
      de: Warnleuchte, während das Fahrzeug weiterfährt
    - en: Occasional loss of high voltage if the second channel also degrades
      de: Gelegentlicher Ausfall der Hochspannung, wenn auch der zweite Kanal nachlässt
  repair:
