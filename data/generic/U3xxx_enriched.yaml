- code: U3565
  category: network
  title:
    en: Hydrogen Supply Line A Pressure Sensor 2 Circuit
    de: Wasserstoffzufuhrleitung A Drucksensor 2 Stromkreis
  description:
    en: "U3565 signals that the second pressure sensor of hydrogen supply line A has a wiring problem. Two sensors on one line let the controller cross-check them, and Hyundai's Nexo shows how such a pair is handled in service: when hydrogen pressure sensor 1 or 2 (P315200, P315300) set codes, campaign T4E from 2019 had both swapped for a revised part at an outdoor venting spot, followed by an offset reset and a leak test; the thin metal membrane of the sensors must touch nothing. A later Hyundai update (20-01-029H) reworked the MIL logic in the Nexo's fuel cell controller and names the sensor 1 code P315292 in that context. No maker documents U3565. A warning is likely; relying on sensor 1 alone, the system may keep running, perhaps with less power. Sensor 1 on this line is U3564."
    de: "Betroffen ist der Stromkreis des zweiten Drucksensors in Zufuhrleitung A. Zwei Sensoren an derselben Leitung erlauben dem Steuergerät einen Gegencheck. Wie mit so einem Paar in der Werkstatt umgegangen wird, zeigt Hyundai beim Nexo: Meldeten Wasserstoffdrucksensor 1 oder 2 Fehler (P315200, P315300), wurden in der Kampagne T4E von 2019 beide gegen ein geändertes Teil getauscht – im Freien an einem Ablassplatz, mit anschließendem Offset-Abgleich und Dichtheitsprüfung. Die dünne Metallmembran der Sensoren darf dabei nichts berühren. Ein späteres Software-Update (20-01-029H) überarbeitete die MIL-Logik des Brennstoffzellen-Steuergeräts und nennt dabei den Code P315292. Öffentlich dokumentiert ist U3565 nicht. Zu erwarten ist eine Warnung; mit Sensor 1 allein läuft das System womöglich weiter, eventuell gedrosselt. Sensor 1 meldet U3564."
