- code: U3564
  category: network
  title:
    en: Hydrogen Supply Line A Pressure Sensor 1 Circuit
    de: Wasserstoffzufuhrleitung A Drucksensor 1 Stromkreis
  description:
    en: "U3564 deals with the wiring of pressure sensor 1 on hydrogen supply line A, most likely the medium-pressure section behind the tank regulator; J2012 does not fix the spot. Toyota's patent shows such a layout: a mechanical reducing valve brings tank hydrogen down to roughly 1.1–1.6 MPa, an intermediate pressure sensor watches that section, and the injector then lowers the pressure to about 200–300 kPa for the stack. To find an offset, Toyota closes the tank valve, lets the injector draw the line down until the reducer stands wide open, and compares readings up- and downstream of it. Hyundai's Nexo has two hydrogen pressure sensors, numbered 1 and 2, with their own codes (P315200/P315300) and renewed both in campaign T4E; U3564 itself is in no public document. Without the value, regulator monitoring suffers and power may be limited."
    de: "Der Code gilt dem Stromkreis des ersten Drucksensors in der Wasserstoffzufuhrleitung A – vermutlich im Mitteldruckabschnitt hinter dem Druckminderer; J2012 legt die Stelle nicht fest. Toyota beschreibt einen solchen Aufbau im Patent: Ein mechanischer Minderer senkt den Tankdruck auf rund 1,1 bis 1,6 MPa, ein Mitteldrucksensor überwacht diesen Abschnitt, der Injektor regelt danach auf etwa 200 bis 300 kPa für den Stack herunter. Einen Versatz erkennt Toyota, indem das Tankventil schließt, der Injektor die Leitung leert, bis der Minderer ganz offen steht, und die Werte davor und dahinter verglichen werden. Hyundai führt beim Nexo Wasserstoffdrucksensor 1 und 2 mit eigenen Codes (P315200/P315300). U3564 selbst taucht in öffentlichen Unterlagen nicht auf. Ohne Messwert leidet die Überwachung des Minderers; Leistungsbegrenzung ist möglich."
