- code: U3572
  category: network
  title:
    en: Stack Outlet Coolant Temperature Sensor 2 Circuit
    de: Stack-Austritt Kühlmitteltemperatursensor 2 Stromkreis
  description:
    en: "U3572 is logged when the second coolant temperature sensor at the stack outlet has a wiring or signal problem. No maker explains in public why two sensors share this spot; mutual checking is the obvious reason. A Toyota patent for systems with several stacks shows one way: outlet temperature is estimated from inlet temperature and stack output, and an outlet sensor whose reading departs from that estimate is reported as faulty. GM compares the outlet value with an expected figure to spot a failed coolant pump and may then lower stack output. Hyundai campaign 21-01-045H-1 for the Nexo shows that a stack coolant fault (pump code P1D3D94) lights the check engine lamp. No maker documents U3572 publicly. With sensor 1 still valid a warning may be all; with both lost, power will be cut. Sensor 1 is U3571."
    de: "U3572 betrifft den Stromkreis des zweiten Kühlmitteltemperaturfühlers am Stack-Austritt. Warum dort zwei Fühler sitzen, legt kein Hersteller offen; naheliegend ist eine gegenseitige Kontrolle. Ein Beispiel liefert ein Toyota-Patent für Anlagen mit mehreren Stacks: Aus Eintrittstemperatur und Stackleistung wird die Austrittstemperatur geschätzt, und ein Fühler, der davon abweicht, wird als defekt gemeldet. GM vergleicht den Austrittswert mit einem Erwartungswert, erkennt so eine ausgefallene Kühlmittelpumpe und drosselt dann gegebenenfalls. Dass Störungen im Stack-Kühlkreis die Motorkontrollleuchte einschalten, belegt Hyundais Nexo-Kampagne 21-01-045H-1 (Pumpencode P1D3D94). Öffentlich dokumentiert ist U3572 nicht. Misst Fühler 1 plausibel, bleibt es womöglich bei einer Warnung; fallen beide aus, wird gedrosselt. Fühler 1: U3571."
  affected_components:
