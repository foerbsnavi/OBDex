- code: U353B
  category: network
  title:
    en: High Voltage System Interlock Circuit M Low
    de: Hochvoltsystem Interlock-Stromkreis M niedrig
  description:
    en: "U353B is set when loop M reads too low. A lever-type plug can leave it in exactly that state on purpose. A connector patent by Hyundai and Kia adds an intermediate lock to the lever: on the way out it stops at a point where the interlock contacts are already apart while the power terminals still touch, so the system has time to switch off before the second lever movement separates the plug. If such a plug is left at the intermediate stage after service, or not pushed fully home, loop M stays open although the plug seems attached. Check every lever on the loop for its final locked position. No maker documents U353B; the contactors remain open."
    de: "U353B wird gesetzt, wenn Schleife M zu niedrig liegt. Ein Hebelstecker kann sie gezielt in genau diesen Zustand bringen. Ein Steckerpatent von Hyundai und Kia gibt dem Hebel eine Zwischenraste: Beim Lösen stoppt er an einer Stelle, an der die Interlock-Kontakte schon getrennt sind, die Leistungskontakte aber noch anliegen, damit das System abschalten kann, bevor die zweite Hebelbewegung den Stecker trennt. Bleibt ein solcher Stecker nach der Wartung in der Zwischenstellung oder wird er nicht ganz eingeschoben, bleibt Kreis M offen, obwohl der Stecker angeschlossen wirkt. Jeden Hebel an der Schleife auf seine Endverriegelung prüfen. U353B dokumentiert kein Hersteller; die Schütze bleiben offen."
  affected_components:
    - hvil_loop_m
    - hvil_wiring
  common_causes:
    - id: lever_at_intermediate_lock
      likelihood: high
      label:
        en: Lever-type connector in loop M left at its intermediate position
        de: Hebelstecker in Kreis M in Zwischenstellung belassen
    - id: loop_m_short_to_ground
      likelihood: medium
      label:
        en: Loop M wire shorted to ground
        de: Leitung von Kreis M mit Masseschluss
    - id: interlock_source_fault
      likelihood: low
      label:
        en: Loop M source in the controller failed
        de: Quelle von Kreis M im Steuergerät ausgefallen
  symptoms:
    - en: No ready mode after service on high-voltage plugs
      de: Keine Fahrbereitschaft nach Arbeiten an Hochvoltsteckern
    - en: Fault persists after clearing
      de: Fehler bleibt nach dem Löschen bestehen
