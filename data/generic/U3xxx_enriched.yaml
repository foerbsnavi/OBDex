- code: U354A
  category: network
  title:
    en: Hydrogen Tank A Temperature Sensor 1 Circuit
    de: Wasserstofftank A Temperatursensor 1 Stromkreis
  description:
    en: "U354A reports an electrical fault on the first temperature sensor of hydrogen tank A. Tank sensors matter most while refuelling: compression heats the gas, and FMVSS 308 slows the pressure ramp once the gas inside passes 85 °C; on the Mirai the tank temperature is passed to the dispenser by infrared. No maker publishes U354A, but Honda shows how such faults appear on the 2017 Clarity Fuel Cell under its own codes P1F76 (main tank) and P1F77 (sub tank): they set during fuelling, and because the sensor sits inside the tank, the first remedy in Tech Line article ATS 170903 was a new tank. Bulletin 19-001 later blamed many cases on outdated software in the fuel cell communication unit. Sensor 2 of the same tank is U354B."
    de: "Der Code steht für einen elektrischen Fehler am ersten Temperatursensor von Wasserstofftank A. Wichtig ist der Sensor vor allem an der Zapfsäule: Beim Verdichten wird das Gas warm, und ab 85 °C Gastemperatur schreibt FMVSS 308 einen flacheren Druckanstieg vor; der Mirai meldet die Tanktemperatur per Infrarot an die Tankstelle. Kein Hersteller veröffentlicht U354A. Wie sich solche Fehler zeigen, belegt Honda beim Clarity Fuel Cell 2017 mit eigenen Codes – P1F76 Haupttank, P1F77 Nebentank: Sie kamen beim Betanken, und da der Fühler im Tank sitzt, lautete die erste Abhilfe im Tech-Line-Artikel ATS 170903 Tanktausch. Später führte Bulletin 19-001 viele Fälle auf eine veraltete Software der Brennstoffzellen-Kommunikationssteuerung zurück. Fühler 2 desselben Tanks meldet U354B."
  affected_components:
    - h2_tank_a_temp_sensor_1
    - sensor_wiring
  common_causes:
    - id: control_software_outdated
      likelihood: medium
      label:
        en: Outdated software in the unit that evaluates the tank sensors
        de: Veraltete Software im Steuergerät, das die Tankfühler auswertet
    - id: tank_sensor_failed
      likelihood: medium
      label:
        en: Temperature sensor inside the tank failed (often only as tank assembly)
        de: Temperaturfühler im Tank ausgefallen (oft nur als Tankeinheit erhältlich)
    - id: harness_connector
      likelihood: medium
      label:
        en: Open or short in the sensor wiring or connector at the tank
        de: Unterbrechung oder Kurzschluss in Fühlerleitung oder Stecker am Tank
  symptoms:
    - en: Code sets while refuelling
      de: Code tritt beim Betanken auf
    - en: Hydrogen system warning
      de: Warnung des Wasserstoffsystems
    - en: Refuelling slower or ends before the tank is full
      de: Betanken langsamer oder bricht vor vollem Tank ab
