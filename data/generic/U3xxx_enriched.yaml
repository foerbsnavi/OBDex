      de: Kommender und gehender Interlock-Fehler, häufiger auf schlechter Fahrbahn
    - en: High-voltage warning lamp lighting briefly
      de: Hochvolt-Warnlampe leuchtet kurz auf
    - en: Brief loss of high-voltage power
      de: Kurzzeitiger Ausfall der Hochvoltleistung
