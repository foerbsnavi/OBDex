- code: U3569
  category: network
  title:
    en: Anode Multifunction Valve
    de: Anoden-Multifunktionsventil
  description:
    en: "With U3569 the multifunction valve can be driven but does not do what it is told: it stays shut, leaks or reacts too slowly. A solenoid of this kind usually lacks position feedback, so its state is inferred. For an integrated drain and purge valve Hyundai lifts anode pressure a fixed amount over ambient while no current is drawn and the air path is closed, opens the valve and checks after the expected drain time plus a settling period whether pressure has dropped to ambient; if not, the valve counts as stuck closed. GM reads the injector duty instead, which climbs once gas rather than water passes. Stuck shut, the valve lets water flood the anode and nitrogen dilute the hydrogen; stuck open, hydrogen escapes. No public source names U3569. Typical results are a warning, less power or a shutdown."
    de: "Das Ventil ist elektrisch erreichbar, gehorcht aber nicht: Es bleibt zu, ist undicht oder reagiert zu träge. Solche Magnetventile haben meist keine Stellungsrückmeldung, ihr Zustand wird daher indirekt bestimmt. Hyundai hebt für sein integriertes Ablass- und Spülventil den Anodendruck ohne Stromabgabe und bei geschlossenem Luftpfad um einen festen Betrag über den Umgebungsdruck, öffnet und prüft nach Ablass- plus Beruhigungszeit, ob der Druck auf Umgebungsniveau gefallen ist – sonst gilt das Ventil als geschlossen hängend. GM wertet das Tastverhältnis des Injektors aus, das steigt, sobald Gas statt Wasser durchströmt. Klemmt das Ventil zu, flutet Wasser die Anode und Stickstoff verdünnt den Wasserstoff; klemmt es offen, entweicht Wasserstoff. Öffentliche Belege für U3569 fehlen; Warnung, Leistungsrücknahme oder Abschaltung sind die Regel."
  affected_components:
