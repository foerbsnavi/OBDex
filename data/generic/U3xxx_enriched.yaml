- code: U300E
  category: network
  title:
    en: Ignition Input On
    de: Zündungseingang Ein
  description:
    en: U300E deals with an ignition input that should be live only in On, without Start. Such run-only feeds exist because many loads are shed while the starter turns; GM's 2012 truck wiring manual, for instance, keeps its retained accessory power relay energized in all modes but two, crank and off-awake. If a module sees this run-only line high in Off or Accessory, or low while the network reports run, it stores U300E. A brief drop during cranking is intended and must not be judged as a fault, so a module that flags the code right after every start points more to a timing or software issue than to wiring. No manufacturer documents U300E publicly. A real wiring fault usually leaves functions on that feed dead with the engine running, which helps to separate the two cases.
    de: U300E betrifft einen Zündungseingang, der nur in Ein Spannung führen soll, nicht beim Starten. Solche reinen Fahrtleitungen gibt es, weil viele Verbraucher abgeschaltet werden, solange der Anlasser dreht; GMs Schaltplanhandbuch der Pickups 2012 etwa hält das Relais für den Zubehörstrom-Nachlauf in allen Betriebszuständen außer Off-Awake und Crank angezogen. Sieht ein Steuergerät die Fahrtleitung in Aus oder Zubehör aktiv oder bei gemeldeter Fahrt stromlos, speichert es U300E. Der kurze Abfall beim Anlassen ist gewollt und darf nicht als Fehler gelten; setzt ein Gerät den Code nach jedem Start, deutet das eher auf ein Zeit- oder Softwareproblem als auf die Verkabelung. Kein Hersteller dokumentiert U300E öffentlich. Ein echter Leitungsfehler legt meist Funktionen an dieser Leitung bei laufendem Motor lahm.
  affected_components:
    - ignition_input
    - ignition_relay
    - ignition_wiring
  common_causes:
    - id: run_feed_fuse_relay
      likelihood: medium
      label:
        en: Blown fuse or faulty run relay on the run-only feed
        de: Durchgebrannte Sicherung oder defektes Fahrtrelais in der reinen Fahrtleitung
    - id: input_wire_open_short
      likelihood: medium
      label:
        en: Input wire open, shorted or backfed
        de: Eingangsleitung unterbrochen, kurzgeschlossen oder rückgespeist
    - id: crank_transition_timing
      likelihood: medium
      label:
        en: Module software misjudging the intended drop during cranking
        de: Steuergeräte-Software wertet den gewollten Abfall beim Anlassen falsch
    - id: switch_contacts_worn
      likelihood: low
      label:
        en: Worn run contact in the ignition switch
        de: Verschlissener Fahrtkontakt im Zündschalter
  symptoms:
    - en: Functions on the run-only feed dead with the engine running
      de: Funktionen an der reinen Fahrtleitung fallen bei laufendem Motor aus
    - en: Code logged right after each start with no other complaint
      de: Code nach jedem Start eingetragen, sonst keine Beanstandung
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [20, 450]
    estimated_hours: [0.5, 2.5]
