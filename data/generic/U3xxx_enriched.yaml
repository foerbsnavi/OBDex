- code: U3527
  category: network
  title:
    en: High Voltage System Interlock Circuit G Low
    de: Hochvoltsystem Interlock-Stromkreis G niedrig
  description:
    en: "U3527 sets when the level on loop G drops below what the module expects. When several controllers watch interlock lines, the reporting unit already narrows the search. A Mercedes service bulletin on the 243 model series shows this with loop A codes: the DC charging unit and the AC charger each store a ground-short code, the battery management a short to positive, and the PTC heater has a separate code. For loop G, start measuring at the controller storing U3527, follow its section outward and compare the codes in the other units. No maker publishes U3527. While the low reading persists, the contactors behind loop G stay locked."
    de: "U3527 wird gesetzt, wenn der Pegel an Kreis G unter den erwarteten Wert fällt. Überwachen mehrere Steuergeräte Interlock-Leitungen, grenzt schon das meldende Gerät die Suche ein. Ein Mercedes-Servicehinweis zur Baureihe 243 zeigt das an Kreis-A-Codes: Gleichstrom-Ladeeinheit und AC-Lader speichern jeweils einen Masseschluss-Code, das Batteriemanagement einen Schluss nach Plus, der PTC-Heizer hat einen eigenen Code. Für Kreis G heißt das: am Steuergerät, das U3527 speichert, mit dem Messen beginnen, seinen Abschnitt nach außen verfolgen und die Codes der übrigen Geräte vergleichen. Kein Hersteller veröffentlicht U3527. Solange der niedrige Wert anliegt, bleiben die Schütze hinter Kreis G gesperrt."
  affected_components:
    - hvil_loop_g
    - hvil_wiring
  common_causes:
    - id: loop_g_short_to_ground
      likelihood: high
      label:
        en: Loop G wire cut or chafed to ground near a control unit
        de: Leitung von Kreis G nahe einem Steuergerät eingeschnitten oder an Masse gescheuert
    - id: loop_g_plug_open
      likelihood: medium
      label:
        en: Plug in the section of the reporting unit not connected
        de: Stecker im Abschnitt des meldenden Geräts nicht verbunden
    - id: interlock_source_fault
      likelihood: low
      label:
        en: Loop source of the reporting controller failed
        de: Schleifenquelle des meldenden Steuergeräts ausgefallen
  symptoms:
    - en: Vehicle does not become ready, or charging is refused
      de: Fahrzeug wird nicht fahrbereit oder verweigert das Laden
    - en: Interlock codes in more than one control unit
      de: Interlock-Codes in mehr als einem Steuergerät
