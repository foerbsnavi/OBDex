- code: U3525
  category: network
  title:
    en: High Voltage System Interlock Circuit G
    de: Hochvoltsystem Interlock-Stromkreis G
  description:
    en: "U3525 stands for a fault on the seventh interlock loop, circuit G, that the module does not classify further. Auxiliary high-voltage consumers are candidates for loops of their own: Sanden runs an interlock loop beside the HV plug between an electric A/C compressor and the traction battery, and a Chinese design cited by Caterpillar links an air-conditioning interlock circuit to the main one over CAN. On Mercedes model line 243 the PTC heater's control unit logs its own interlock code, P154700. Which consumer sits on loop G is not public. A dead loop G may only disable heating or cooling, or may block the whole system."
    de: "U3525 steht für einen Fehler an der siebten Interlock-Schleife, Kreis G, den das Steuergerät nicht genauer zuordnet. Hochvolt-Nebenverbraucher kommen für eigene Schleifen in Frage: Sanden führt eine Interlock-Schleife neben dem HV-Stecker zwischen elektrischem Klimakompressor und Antriebsbatterie, und ein von Caterpillar zitierter chinesischer Entwurf verbindet einen Klima-Interlock-Kreis über CAN mit dem Hauptkreis. Bei der Mercedes-Baureihe 243 legt das Steuergerät des PTC-Heizers einen eigenen Interlock-Code ab, P154700. Welcher Verbraucher an Kreis G hängt, ist nicht öffentlich. Ein ausgefallener Kreis G schaltet womöglich nur Heizung oder Kühlung ab oder sperrt das ganze System."
  affected_components:
    - hvil_loop_g
    - hv_connectors
  common_causes:
    - id: auxiliary_hv_plug_open
      likelihood: high
      label:
        en: HV plug of an auxiliary consumer such as compressor or heater not latched
        de: HV-Stecker eines Nebenverbrauchers wie Kompressor oder Heizer nicht eingerastet
    - id: loop_g_harness_damage
      likelihood: medium
      label:
        en: Loop G wiring to the auxiliary consumer damaged
        de: Leitung von Kreis G zum Nebenverbraucher beschädigt
    - id: consumer_interlock_fault
      likelihood: low
      label:
        en: Interlock contacts inside the consumer's connector damaged
        de: Interlock-Kontakte im Stecker des Verbrauchers beschädigt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Evaluating controller faulty
        de: Auswertendes Steuergerät defekt
