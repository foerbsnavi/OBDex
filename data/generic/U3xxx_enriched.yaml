- code: U3024
  category: network
  title:
    en: Control Module Input Power Circuit B - Ignition Input On/Start Circuit Correlation
    de: Steuergerät Eingangsspannung Stromkreis B – Zündungseingang Ein/Start Korrelation
  description:
    en: "U3024 is the same plausibility test as U3023, but against the module's second battery feed, B: with the key in run or start, feed B and the switched ignition input should show about the same voltage, and a lasting gap points to a fault on one of the two paths. The code only makes sense on modules with two permanent feeds plus an ignition line. No manufacturer documents U3024 publicly. For guidance, GM's 2025 tables describe the A variant in engine and transmission modules: battery present, run/crank active, starter not engaged, and a difference above 3 V in most of 50 samples. If only U3024 is stored and not U3023, feed B itself is the more likely culprit, since a missing ignition signal would upset both comparisons. Effects depend on what feed B powers inside the module."
    de: "U3024 ist dieselbe Plausibilitätsprüfung wie U3023, nur gegen den zweiten Batterieeingang B: Bei Zündung an oder Start sollten Eingang B und der geschaltete Zündungseingang etwa gleiche Spannung zeigen; ein bleibender Unterschied weist auf einen Fehler in einem der beiden Wege. Sinnvoll ist der Code nur bei Steuergeräten mit zwei Dauerplus-Eingängen und einer Zündleitung. Kein Hersteller dokumentiert U3024 öffentlich. Als Anhalt dienen GMs Tabellen 2025 zur Variante A in Motor- und Getriebesteuergeräten: Batterie erkannt, Zündung/Start aktiv, Anlasser nicht eingespurt und mehr als 3 V Unterschied in der Mehrzahl von 50 Messungen. Steht nur U3024 und nicht U3023, ist eher Eingang B selbst schuld, denn ein fehlendes Zündsignal würde beide Vergleiche stören. Die Auswirkungen hängen davon ab, was Eingang B im Gerät versorgt."
  affected_components:
    - module_power_b
    - ignition_input
  common_causes:
    - id: feed_b_fuse_wiring
      likelihood: high
      label:
        en: Blown fuse or damaged wire on battery feed B
        de: Ausgelöste Sicherung oder beschädigte Leitung an Batterieeingang B
    - id: ignition_input_fault
      likelihood: medium
      label:
        en: Run/crank relay or ignition wire delivering too little voltage
        de: Zündungs-/Startrelais oder Zündleitung liefert zu wenig Spannung
    - id: connector_pin
      likelihood: medium
      label:
        en: Loose or corroded pin for feed B in the module connector
        de: Lockerer oder korrodierter Pin für Eingang B im Modulstecker
    - id: module_internal
      likelihood: low
      label:
        en: Faulty voltage sensing inside the module
        de: Fehlerhafte Spannungserfassung im Steuergerät
  symptoms:
    - en: Warning lamp or message, depending on the module
      de: Warnleuchte oder Meldung, je nach Steuergerät
    - en: Loss of functions supplied through feed B
      de: Ausfall der Funktionen, die über Eingang B versorgt werden
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 400]
    estimated_hours: [0.3, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3023, U3007, U3018, U3505, U3010]
  sources:
