- code: U3556
  category: network
  title:
    en: Hydrogen Tank C Valve Control Circuit
    de: Wasserstofftank C Ventil Steuerkreis
  description:
    en: U3556 is the control circuit code for the valve on tank C, the third tank found only on three-tank layouts such as the Nexo or the current Mirai. On the Mirai the two crosswise tanks behind the long central one are the smaller ones, so losing one costs only part of the range. That makes the fault easy to overlook while driving. The controller recognises an electrical fault in the valve drive directly and stores U3556, whereas a valve that sticks mechanically only shows up as missing hydrogen, which Hyundai's patent finds by comparing supply with consumption. Check coil, connector and driver first. No manufacturer documents U3556 publicly. Tank C stays shut; expect a warning and less range. The enable path of the same valve is U3557.
    de: "U3556 ist der Code für den Ansteuerkreis des Ventils an Tank C, dem dritten Behälter, den nur Drei-Tank-Fahrzeuge wie der Nexo oder der aktuelle Mirai haben. Beim Mirai sind die beiden quer liegenden Tanks hinter dem langen Mitteltank die kleineren; fällt einer aus, fehlt nur ein Teil der Reichweite. Unterwegs übersieht man den Fehler daher leicht. Einen elektrischen Fehler am Ventilantrieb erkennt das Steuergerät unmittelbar und legt U3556 ab; ein mechanisch klemmendes Ventil fällt dagegen nur als fehlender Wasserstoff auf, den Hyundais Patent durch Vergleich von Zufuhr und Verbrauch aufspürt. Zuerst Spule, Stecker und Endstufe prüfen. Öffentlich dokumentiert kein Hersteller U3556. Tank C bleibt zu; Warnung und weniger Reichweite sind die Folge. Der Freigabepfad desselben Ventils: U3557."
  affected_components:
    - h2_tank_c_valve
    - valve_wiring
  common_causes:
