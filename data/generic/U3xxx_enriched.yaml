- code: U355B
  category: network
  title:
    en: Charge Air Cooler Outlet Pressure Sensor 2 Circuit
    de: Ladeluftkühler Austritt Drucksensor 2 Stromkreis
  description:
    en: "U355B points to a circuit problem with pressure sensor 2 at the charge air cooler outlet. J2012 lists two at this spot, which points to a pair used for cross-checking; how a maker splits the roles is unpublished, and no public document uses U355B. A GM patent shows the principle: before start-up, while the compressor stands still and the cathode holds only atmospheric pressure, readings are compared, and a doubtful sensor is replaced by a value calculated from the remaining ones. Ford names a winter risk on the wet air side: water on a sensor diaphragm can freeze and give no or false output at a cold start, which may lead to a shutdown. Sensor 1 at the same spot is U355A. With only one valid sensor left, output may be limited."
    de: "Der zweite Drucksensor am Austritt des Ladeluftkühlers hat einen Stromkreisfehler. Dass J2012 hier zwei Sensoren vorsieht, spricht für ein Paar zur gegenseitigen Kontrolle; die Rollenverteilung legt der Hersteller fest, veröffentlicht ist sie nicht, und U355B steht in keiner öffentlichen Unterlage. Das Prinzip beschreibt ein GM-Patent: Vor dem Start, bei stehendem Verdichter und Umgebungsdruck auf der Kathode, werden die Messwerte verglichen, und ein unplausibler Sensor wird durch einen aus den übrigen errechneten Wert ersetzt. Ford weist auf eine Gefahr im Winter hin: Wasser auf der Messmembran kann gefrieren, sodass der Sensor beim Kaltstart nichts oder Falsches liefert und das System abschalten kann. Sensor 1 derselben Stelle meldet U355A. Bleibt nur ein gültiger Sensor, ist begrenzte Leistung möglich."
  affected_components:
    - cac_outlet_pressure_sensor_2
    - sensor_wiring
  common_causes:
    - id: harness_connector
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of sensor 2
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker von Sensor 2
    - id: water_frozen_on_sensor
      likelihood: medium
      label:
        en: Condensed water frozen on the sensor (occurs at cold start, may clear when warm)
        de: Kondenswasser am Sensor gefroren (tritt beim Kaltstart auf, verschwindet warm oft)
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Pressure sensor 2 faulty internally
        de: Drucksensor 2 intern defekt
  symptoms:
    - en: Fuel cell system warning, MIL on
      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Start refused or system shuts down shortly after a cold start
      de: Start verweigert oder Abschaltung kurz nach einem Kaltstart
    - en: Reduced power while only one pressure sensor is valid
      de: Weniger Leistung, solange nur ein Drucksensor gültig ist
