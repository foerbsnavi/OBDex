    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U3542
  category: network
  title:
    en: High Voltage System Interlock Circuit O Performance
    de: Hochvoltsystem Interlock-Stromkreis O Funktion
  description:
    en: U3542 marks loop O as implausible. Interlock trouble often clusters around charging. Mercedes bulletin LI54.10-P-067823 for the third-generation smart electric drive with the optional 22 kW on-board charger, built before 25 March 2013, links sporadic or permanent interlock codes (P0A0A00, P0A0E00), a no-start with a charging-cable message and a battery that will not charge to loose low-voltage contacts at that charger. Technicians push or pull those plugs gently and wait up to 5 seconds each time to see whether charging begins; the fault may appear solely with cold or warm components. No maker documents U3542.
    de: U3542 kennzeichnet Kreis O als unplausibel. Interlock-Störungen häufen sich oft rund ums Laden. Das Mercedes-Bulletin LI54.10-P-067823 zum smart electric drive der dritten Generation mit dem optionalen 22-kW-Bordlader, gebaut vor dem 25. März 2013, bringt sporadische oder dauerhafte Interlock-Codes (P0A0A00, P0A0E00), einen Nichtstart mit der Anzeige eines gesteckten Ladekabels und eine nicht ladbare Batterie mit losen Niedervoltkontakten an diesem Lader in Verbindung. Die Werkstatt drückt oder zieht behutsam an diesen Steckern und wartet jeweils bis zu 5 Sekunden, ob der Ladevorgang beginnt; der Fehler kann nur bei warmen oder kalten Bauteilen auftreten. U3542 dokumentiert kein Hersteller.
  affected_components:
    - hvil_loop_o
    - on_board_charger
  common_causes:
    - id: loose_lv_contact_at_charger
      likelihood: high
      label:
        en: Loose low-voltage contact at the on-board charger carrying loop O
        de: Lockerer Niedervoltkontakt am Bordlader, über den Kreis O läuft
    - id: temperature_dependent_contact
      likelihood: medium
      label:
        en: Contact that opens only when components are hot or cold
        de: Kontakt, der nur bei heißen oder kalten Bauteilen öffnet
    - id: charger_internal_fault
      likelihood: low
      label:
        en: Internal fault in the on-board charger
        de: Interner Fehler im Bordlader
  symptoms:
    - en: Vehicle will not start and reports a plugged-in charging cable
      de: Fahrzeug startet nicht und meldet ein gestecktes Ladekabel
    - en: Charging does not start or stops
      de: Ladevorgang beginnt nicht oder bricht ab
    - en: Fault at the beginning or end of a charging session
      de: Fehler zu Beginn oder am Ende eines Ladevorgangs
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 2500]
    estimated_hours: [0.5, 4]
  flags:
