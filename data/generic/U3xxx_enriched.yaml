- code: U3570
  category: network
  title:
    en: Stack Inlet Coolant Temperature Sensor Circuit
    de: Stack-Eintritt Kühlmitteltemperatursensor Stromkreis
  description:
    en: "U3570 signals that the sensor for coolant entering the stack sends a broken, shorted or out-of-range reading. Thermal control is steered by this value: Hyundai describes a three-port valve which gets the stack inlet temperature from the fuel cell control unit over CAN and sets its opening from it, and in a Nissan patent the current drawn from the stack is capped once inlet coolant passes a set point, so that the outlet cannot overheat. GM shows that the inlet figure can also be estimated from pump inlet temperature, flow rate and a heat exchanger model. No maker documents U3570 publicly. Without a valid reading the system has to run on a substitute; a warning lamp and held-back power are to be expected. Outlet sensors report as U3571 and U3572."
    de: "Der Code meldet einen elektrischen Fehler am Temperaturfühler im Kühlmittelzulauf des Stacks: Unterbrechung, Kurzschluss oder ein Signal außerhalb des gültigen Bereichs. Nach diesem Wert richtet sich die Temperaturregelung. Bei Hyundai bekommt das Dreiwegeventil die Stack-Eintrittstemperatur vom Brennstoffzellen-Steuergerät über CAN und stellt danach seine Öffnung ein; Nissan begrenzt laut Patent den entnehmbaren Strom, sobald das zulaufende Kühlmittel eine Schwelle überschreitet, damit der Austritt nicht zu heiß wird. GM zeigt, dass sich der Eintrittswert auch aus Pumpenzulauftemperatur, Durchfluss und einem Wärmetauschermodell schätzen lässt. Öffentlich belegt ist U3570 bei keinem Hersteller. Zu erwarten sind Warnmeldung und gedrosselte Leistung; die Austrittsfühler melden U3571 und U3572."
  affected_components:
