- code: U3555
  category: network
  title:
    en: Hydrogen Tank B Valve Performance
    de: Wasserstofftank B Ventil Funktion
  description:
    en: "U3555 reports that the valve on tank B does not behave as expected although its circuit tests good. Leakage through the closed valve is one form. Hyundai patented a check for it while the car is parked: at wake-ups, hydrogen left in the supply line is fed into the stack with the tank valves shut, so the high-pressure reading should fall slightly; if it stays the same at each wake-up, the tank is feeding gas past the seal. The opposite is a valve that will not open. On the Nexo, venting for service closes the manual valve on each tank with a hex key, and a manual valve left shut afterwards would look like a stuck valve. No maker documents U3555. U3552 and U3558 are the siblings for A and C."
    de: "U3555 meldet, dass das Ventil an Tank B sich nicht wie erwartet verhält, obwohl sein Stromkreis in Ordnung ist. Eine Form davon ist Undichtigkeit im geschlossenen Zustand. Hyundai hat dafür eine Prüfung im Stand patentiert: Beim Aufwachen des geparkten Autos wird Restwasserstoff aus der Versorgungsleitung bei geschlossenen Tankventilen in den Stack geleitet, der Hochdruckwert müsste also etwas sinken; bleibt er bei jedem Aufwachen gleich, strömt Gas aus dem Tank am Ventilsitz vorbei nach. Das Gegenstück ist ein Ventil, das nicht öffnet. Beim Nexo werden zum Entleeren vor Arbeiten die Handventile aller Tanks per Innensechskant geschlossen; bleibt eines danach zu, sähe das aus wie ein klemmendes Ventil. Kein Hersteller dokumentiert U3555. Geschwister für A und C: U3552, U3558."
  affected_components:
    - h2_tank_b_valve
  common_causes:
    - id: seat_leak
      likelihood: medium
      label:
        en: Tank B valve seat leaking when closed
        de: Ventilsitz an Tank B undicht im geschlossenen Zustand
    - id: valve_stuck_closed
      likelihood: medium
      label:
        en: Valve not opening mechanically
        de: Ventil öffnet mechanisch nicht
    - id: manual_valve_closed
      likelihood: low
      label:
        en: Manual tank valve not reopened after service
        de: Handventil am Tank nach Wartung nicht wieder geöffnet
  symptoms:
