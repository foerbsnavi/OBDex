- code: U3002
  category: network
  title:
    en: Vehicle Identification Number
    de: Fahrzeug-Identifizierungsnummer (FIN)
  description:
    en: With U3002 a module reports that its own stored VIN is either blank or differs from the VIN that the rest of the car sends on the bus. GM's front camera module splits this into :51, memory still erased, and :56, any digit not matching the broadcast VIN; both run at start-up in Run with 9–16 V and do not light the MIL. Ford's SSM 51903 covers Ford- and Lincoln-badged 2021–2023 vehicles whose cruise, blind-spot and other modules store U2100 or U3002 after replacement, fixed by writing VIN and configuration in FDRS; SSM 53569 adds that a tail lamp moved from another car can trigger it. CARB requires the VIN to be readable through the diagnostic connector, which is why modules check it. The typical case is a used or unprogrammed part.
    de: Mit U3002 meldet ein Steuergerät, dass seine gespeicherte Fahrgestellnummer fehlt oder von der FIN abweicht, die der Rest des Fahrzeugs über den Bus sendet. GMs Frontkameramodul unterscheidet :51, Speicher noch leer, und :56, mindestens eine Stelle passt nicht; beide Prüfungen laufen beim Start in Run bei 9–16 V und schalten keine MIL. Fords SSM 51903 nennt Ford- und Lincoln-Modelle 2021–2023, deren Tempomat-, Totwinkel- und weitere Module nach einem Tausch U2100 oder U3002 speichern; Abhilfe schafft das Einschreiben von FIN und Konfiguration mit FDRS. SSM 53569 ergänzt, dass schon eine Heckleuchte aus einem anderen Fahrzeug den Code auslösen kann. CARB schreibt vor, dass die FIN über die Diagnosebuchse lesbar ist, daher gleichen Module sie ab. Typisch ist ein gebrauchtes oder unprogrammiertes Teil.
  affected_components:
    - control_module
    - module_eeprom
  common_causes:
    - id: used_module_other_vin
      likelihood: high
      label:
        en: Used module or lamp from another vehicle still holding its old VIN
        de: Gebrauchtes Modul oder Leuchte aus einem anderen Fahrzeug mit alter FIN
    - id: vin_not_written
      likelihood: high
      label:
        en: New module fitted without writing VIN and configuration
        de: Neues Steuergerät ohne Einschreiben von FIN und Konfiguration verbaut
    - id: programming_interrupted
      likelihood: low
      label:
        en: Programming session broken off, leaving the VIN memory blank
        de: Abgebrochene Programmierung, FIN-Speicher bleibt leer
  symptoms:
    - en: Stored code right after a module or lamp replacement
      de: Gespeicherter Code direkt nach Tausch eines Moduls oder einer Leuchte
    - en: Driver assistance or the affected function disabled until the VIN is written
      de: Assistenz oder betroffene Funktion bleibt abgeschaltet, bis die FIN eingeschrieben ist
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 250]
    estimated_hours: [0.3, 1]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [U3000, P0630, P0602]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04B.pdf
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10243479-0001.pdf
