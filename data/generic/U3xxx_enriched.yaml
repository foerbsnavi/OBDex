    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U353F
  category: network
  title:
    en: High Voltage System Interlock Circuit N Low
    de: Hochvoltsystem Interlock-Stromkreis N niedrig
  description:
    en: "U353F covers a loop N value under the permitted minimum. The defect can sit inside a consumer rather than in the harness. For the Cummins battery electric systems BES CM2450 EV110B and EV111B, bulletin TSB250044 ties fault codes 8174 (interlock level too low or grounded) and 8175 to the electric air compressor: once the interlock contacts of the HV cable to the compressor pass, the measurement moves to the interlock pins of its low-voltage connector, and above 2 ohms (1 ohm in the first issue of February 2025) the compressor gets replaced. No maker documents U353F. While it is set, the vehicle is likely to lose high-voltage readiness."
    de: "U353F besagt, dass Kreis N unter seiner unteren Grenze liegt. Der Defekt kann in einem Verbraucher stecken statt im Kabelstrang. Für die batterieelektrischen Antriebe BES CM2450 EV110B und EV111B von Cummins ordnet das Bulletin TSB250044 die Fehlercodes 8174 (Interlock-Pegel zu niedrig oder an Masse) und 8175 dem elektrischen Luftpresser zu: Sind die Schleifenkontakte am Hochvoltkabel zum Kompressor in Ordnung, wird an den Schleifenkontakten seines Niedervoltsteckers gemessen; über 2 Ohm (in der ersten Fassung vom Februar 2025 noch 1 Ohm) wird der Kompressor ersetzt. U353F dokumentiert kein Hersteller. Solange er gesetzt ist, verliert das Fahrzeug voraussichtlich die Hochvolt-Bereitschaft."
  affected_components:
    - hvil_loop_n
    - hvil_wiring
  common_causes:
    - id: internal_loop_fault_in_consumer
      likelihood: high
      label:
        en: Interlock path inside an HV consumer such as an electric air compressor open or high-resistance
        de: Interlock-Pfad in einem Hochvoltverbraucher wie dem elektrischen Luftpresser unterbrochen oder hochohmig
    - id: loop_n_plug_disconnected
      likelihood: medium
      label:
        en: HV cable plug on loop N not reconnected properly
        de: Hochvoltkabelstecker an Kreis N nicht richtig wieder gesteckt
    - id: loop_n_short_to_ground
      likelihood: medium
      label:
        en: Loop N wire shorted to ground
        de: Leitung von Kreis N mit Masseschluss
  symptoms:
    - en: High voltage switches off and stays off
      de: Hochvolt schaltet ab und bleibt aus
    - en: Interlock fault returns although all cable plugs test fine
      de: Interlock-Fehler kehrt zurück, obwohl alle Kabelstecker in Ordnung sind
    - en: Auxiliary drive such as the air compressor not running
      de: Nebenantrieb wie der Luftpresser läuft nicht
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 6000]
    estimated_hours: [1, 6]
  flags:
    mil: true
    emissions_relevant: false
