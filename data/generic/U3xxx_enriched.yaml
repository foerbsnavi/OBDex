    - sae:J2012
  related_codes: [U3541, U3542, U3543, U3540, P0A0D]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11028892-0001.pdf
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U3545
  category: network
  title:
    en: High Voltage System Interlock Circuit P
    de: Hochvoltsystem Interlock-Stromkreis P
  description:
    en: "U3545 is the general fault code for interlock circuit P, the fifteenth loop. Interlock electronics can be harmed by events elsewhere in the drive. Allison service letter SIL 3-EP-14 (Rev. C, 2017) for the H 40/50 EP hybrid system used in buses offers a separate HVIL circuit card for the DPIM2 inverter: if the check list shows 3 to 4 µF between DC+ or DC− and chassis, for example after an internal stator short, that card is damaged and can be swapped instead of the whole inverter, which first has to come out of the vehicle; an ESD wrist strap is mandatory. No maker documents U3545."
    de: "U3545 ist der allgemeine Fehlercode für Interlock-Kreis P, die fünfzehnte Schleife. Die Interlock-Elektronik kann durch Ereignisse an anderer Stelle des Antriebs Schaden nehmen. Allisons Service-Information SIL 3-EP-14 (Rev. C, 2017) zum Hybridsystem H 40/50 EP, das in Bussen läuft, bietet eine eigene HVIL-Platine für den Wechselrichter DPIM2 an: Zeigt die Prüfliste zwischen DC+ bzw. DC− und Masse 3 bis 4 µF, etwa nach einem inneren Statorkurzschluss, ist diese Platine beschädigt und lässt sich statt des ganzen Wechselrichters tauschen, der dazu ausgebaut werden muss; ein Erdungsarmband gegen elektrostatische Entladung ist Pflicht. U3545 dokumentiert kein Hersteller."
  affected_components:
    - hvil_loop_p
    - hv_connectors
  common_causes:
    - id: hvil_board_damaged
      likelihood: medium
      label:
        en: Interlock circuit board inside the inverter damaged, e.g. after a motor winding short
        de: Interlock-Platine im Wechselrichter beschädigt, etwa nach Windungsschluss im Motor
    - id: loop_p_connector_unlatched
      likelihood: medium
      label:
        en: Connector in loop P not fully latched
        de: Stecker in Kreis P nicht vollständig eingerastet
    - id: loop_p_harness_damage
      likelihood: medium
      label:
        en: Loop P wiring damaged
        de: Leitung von Kreis P beschädigt
    - id: esd_damage_after_service
      likelihood: low
      label:
        en: Electrostatic damage to monitoring electronics during service
