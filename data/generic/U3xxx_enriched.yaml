- code: U3008
  category: network
  title:
    en: Control Module Ground A
    de: Steuergerät Masse A
  description:
    en: Modules that switch large currents are often grounded through two separate wires, and U3008 marks the loss of ground A. GM's 19OBDG03B brake module measures the voltage on both grounds and forms (G1 − G2)/(G1 + G2); each wire should carry half the current, so a result above 0.9 for 200 ms means ground 1 is gone, Type A with MIL. Ford's TSB 26-2150 for 2025–2026 Explorer, Police Interceptor and Aviator ties U3008:1B in the steering module, the byte meaning resistance too high, to ground G104 or G116 on the passenger frame rail; the repair enlarges the hole and fits a self-tapping M8 bolt. On the road this shows as a steering assist warning and heavier steering. Mazda uses U3008:01 on CX-90 and CX-70 plug-in hybrids for an over-current or voltage fault in the backup power unit instead.
    de: Steuergeräte mit großen Strömen haben oft zwei getrennte Masseleitungen; U3008 meldet den Verlust von Masse A. Das GM-Bremssteuergerät in 19OBDG03B misst die Spannung an beiden Massen und bildet (G1 − G2)/(G1 + G2); jede Leitung soll die Hälfte des Stroms führen, ein Wert über 0,9 für 200 ms bedeutet also, dass Masse 1 fehlt, Typ A mit MIL. Fords TSB 26-2150 für Explorer, Police Interceptor und Aviator 2025–2026 verbindet U3008:1B im Lenkungssteuergerät, das Byte steht für zu hohen Widerstand, mit Massepunkt G104 bzw. G116 am rechten Rahmenlängsträger; repariert wird durch Aufbohren und eine selbstschneidende M8-Schraube. Der Fahrer sieht eine Lenkhilfe-Störmeldung und lenkt schwerer. Mazda belegt U3008:01 bei den Plug-in-Hybriden CX-90 und CX-70 abweichend mit einem Überstrom- oder Spannungsfehler der Notstromeinheit.
  affected_components:
    - module_ground_a
    - ground_strap
  common_causes:
    - id: loose_ground_point
      likelihood: high
      label:
        en: Loose or poorly clamped ground eyelet at the body or frame
        de: Lockerer oder schlecht anliegender Massering an Karosserie oder Rahmen
    - id: corroded_ground
      likelihood: medium
      label:
        en: Corrosion or paint under the ground connection raising resistance
        de: Korrosion oder Lack unter dem Massepunkt erhöht den Widerstand
    - id: ground_wire_damage
      likelihood: low
      label:
        en: Broken or chafed ground wire A in the harness
        de: Gebrochene oder durchgescheuerte Masseleitung A im Kabelbaum
  symptoms:
    - en: Steering assist or brake system warning in the cluster
      de: Warnung zu Lenkhilfe oder Bremssystem im Kombiinstrument
    - en: Reduced power steering assist or limited ABS function
      de: Verringerte Lenkunterstützung oder eingeschränkte ABS-Funktion
    - en: Check engine light where the maker classes it as MIL-relevant
      de: Motorkontrollleuchte, wo der Hersteller den Code als MIL-relevant führt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 250]
    estimated_hours: [0.5, 2]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3009, U3015, U3016, U3006]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11031309-0001.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11020998-0001.pdf
