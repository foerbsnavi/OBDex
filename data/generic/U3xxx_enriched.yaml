    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
  reviewed: '2026-11-06'

- code: U3020
  category: network
  title:
    en: Control Module Wake-up Circuit B High
    de: Steuergerät Weckleitung B hoch
  description:
    en: "U3020 sets when wake-up line B stays above its valid level, typically through contact with a battery or ignition feed, or because its source holds it on. The practical effect differs from U301F: a permanently active B line keeps asking the module to stay awake even when line A and the bus have gone quiet, so the module cannot enter sleep and the 12 V battery runs down while parked. Ford's 2019 hybrid OBD summary shows how much a high wake level can trigger, since its battery module starts contactor checks whenever the charge wake-up is high. At the same time a transceiver such as NXP's TJA1043 only wakes on a level change, so the fixed high line cannot pass on a real request from source B. No manufacturer documents U3020 publicly. A parasitic draw test with the line unplugged confirms the cause."
    de: "U3020 fällt, wenn Weckleitung B über ihrem gültigen Pegel bleibt, meist durch Schluss mit einer Batterie- oder Zündungsleitung oder weil ihre Quelle sie festhält. Die Folge unterscheidet sich von U301F: Eine dauernd aktive Leitung B verlangt weiter, dass das Gerät wach bleibt, auch wenn Leitung A und der Bus längst ruhen; das Gerät kann nicht einschlafen, und die 12-V-Batterie entlädt sich im Stand. Wie viel ein hoher Weckpegel auslösen kann, zeigt Fords Hybrid-OBD-Übersicht 2019: Dort startet das Batteriesteuergerät Schützprüfungen, sobald das Lade-Wecksignal hoch ist. Zugleich weckt ein Transceiver wie NXPs TJA1043 nur bei einem Pegelwechsel, sodass die festgelegte Leitung eine echte Anforderung von Quelle B nicht weitergeben kann. Kein Hersteller dokumentiert U3020 öffentlich. Eine Ruhestrommessung mit abgezogener Leitung klärt es."
  affected_components:
    - wakeup_circuit_b
    - wakeup_wiring
  common_causes:
    - id: wake_wire_short_voltage
      likelihood: high
      label:
        en: Wake-up wire B shorted to a battery or ignition feed
        de: Weckleitung B mit einer Batterie- oder Zündungsleitung kurzgeschlossen
    - id: sending_module_output_stuck
      likelihood: medium
      label:
        en: Source on line B holding its output on
        de: Quelle an Leitung B hält ihren Ausgang dauernd an
    - id: moisture_bridge
      likelihood: low
      label:
        en: Moisture bridging line B to a supply pin
        de: Feuchtigkeit überbrückt Leitung B zu einem Versorgungspin
  symptoms:
    - en: 12 V battery flat after parking
      de: 12-V-Batterie nach dem Parken leer
    - en: Module stays awake with the vehicle locked
      de: Steuergerät bleibt bei verriegeltem Fahrzeug wach
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [50, 600]
    estimated_hours: [0.5, 3]
