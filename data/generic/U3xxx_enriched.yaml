    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2025/25OBDG04B.pdf
  reviewed: '2026-11-06'

- code: U3025
  category: network
  title:
    en: Control Module A Disable Circuit/Open
    de: Steuergerät A Abschaltkreis/Unterbrechung
  description:
    en: "Safety-relevant systems often give a supervising controller a hard-wired line through which it can switch off another module or its power stage, independent of the bus. Bosch patent US6804564B2 describes a first control unit that de-energizes a faulty second unit over such an output line, and FCA patent US10676100B2 shows a hybrid where control processor, motor processor and a monitor each have their own shutoff line to the inverter gate driver. U3025 says this disable line to module A is open or electrically missing. No manufacturer documents U3025 publicly. A broken line is serious either way: depending on the logic, module A may treat it as a permanent shutdown request and refuse to run, or stopping it in an emergency becomes impossible, which is why the system usually keeps the function off."
    de: "Sicherheitsrelevante Systeme geben einem überwachenden Steuergerät oft eine fest verdrahtete Leitung, über die es ein anderes Modul oder dessen Endstufe unabhängig vom Bus abschalten kann. Das Bosch-Patent US6804564B2 beschreibt ein erstes Steuergerät, das ein fehlerhaftes zweites über eine solche Ausgangsleitung stromlos schaltet, und im FCA-Patent US10676100B2 haben Hybridprozessor, Motorprozessor und Überwachung je eine eigene Abschaltleitung zum Gate-Treiber des Wechselrichters. U3025 meldet, dass diese Abschaltleitung zu Steuergerät A unterbrochen ist oder elektrisch fehlt. Kein Hersteller dokumentiert U3025 öffentlich. Eine offene Leitung ist so oder so ernst: Je nach Logik wertet Modul A sie als dauernde Abschaltanforderung und bleibt aus, oder es lässt sich im Notfall nicht mehr stoppen; meist bleibt die Funktion deshalb gesperrt."
  affected_components:
    - module_disable_a
    - control_wiring
  common_causes:
    - id: disable_wire_open
      likelihood: high
      label:
        en: Broken disable wire or unplugged connector between the two modules
        de: Gebrochene Abschaltleitung oder abgezogener Stecker zwischen den Modulen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or pushed-out pin on the disable line
        de: Korrodierter oder zurückgeschobener Pin der Abschaltleitung
    - id: sending_module_fault
      likelihood: low
      label:
        en: Output driver of the supervising module no longer driving the line
        de: Ausgangstreiber des überwachenden Steuergeräts steuert die Leitung nicht mehr
    - id: receiving_module_fault
      likelihood: low
      label:
        en: Input stage of module A misreading the line
        de: Eingangsstufe von Steuergerät A liest die Leitung falsch
  symptoms:
    - en: Function of module A unavailable, e.g. drive system not ready
      de: Funktion von Steuergerät A nicht verfügbar, etwa Antrieb nicht fahrbereit
    - en: System warning message in the cluster
      de: Systemwarnung im Kombiinstrument
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3026, U3027, U3028, P2C96]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US6804564B2/en
    - https://patents.google.com/patent/US10676100B2/en
  reviewed: '2026-11-06'

- code: U3026
  category: network
  title:
    en: Control Module A Disable Circuit Low
    de: Steuergerät A Abschaltkreis niedrig
  description:
    en: U3026 is logged when the disable line to module A sits below its valid voltage range, typically because it is shorted to ground. What that means depends on the polarity the maker chose. In the Siemens control unit of patent US7596436B2 the enable signal is high for run and low for shutdown, and a monitoring circuit cuts the output stages by pulling the shutdown paths to vehicle ground. With such active-low logic a short to ground looks exactly like a permanent shutdown command, so module A stays off and the driver loses that function, although nothing else is wrong. Where low is the run state, the danger is the opposite, since the shutdown can no longer be signalled. No manufacturer documents U3026 publicly. Look for a chafed wire touching the body between the two modules.
    de: "U3026 wird gesetzt, wenn die Abschaltleitung zu Steuergerät A unter ihrem gültigen Spannungsbereich liegt, meist wegen eines Masseschlusses. Was das bedeutet, hängt von der gewählten Polarität ab. Im Siemens-Steuergerät aus Patent US7596436B2 heißt das Freigabesignal High Betrieb und Low Abschaltung, und eine Überwachungsschaltung legt die Abschaltpfade zum Sperren der Endstufen auf Fahrzeugmasse. Bei solcher Low-aktiver Logik sieht ein Masseschluss genau wie ein dauernder Abschaltbefehl aus: Modul A bleibt aus, die Funktion fehlt, obwohl sonst alles in Ordnung ist. Ist Low dagegen der Betriebszustand, droht das Gegenteil, weil sich die Abschaltung nicht mehr anfordern lässt. Kein Hersteller dokumentiert U3026 öffentlich. Gesucht wird eine durchgescheuerte Leitung mit Karosseriekontakt zwischen beiden Steuergeräten."
  affected_components:
    - module_disable_a
    - control_wiring
  common_causes:
    - id: short_to_ground
      likelihood: high
      label:
        en: Disable wire chafed through and touching body ground
        de: Abschaltleitung durchgescheuert mit Kontakt zur Karosseriemasse
    - id: water_in_connector
      likelihood: medium
      label:
        en: Moisture in a connector creating a leak path to ground
        de: Feuchtigkeit im Stecker bildet einen Kriechweg nach Masse
    - id: sending_module_stuck_low
      likelihood: low
      label:
        en: Supervising module holding the line low permanently
        de: Überwachendes Steuergerät hält die Leitung dauerhaft auf Low
  symptoms:
    - en: Module A stays switched off, function unavailable
      de: Steuergerät A bleibt abgeschaltet, Funktion nicht verfügbar
    - en: Warning message for the affected system
      de: Warnmeldung für das betroffene System
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3025, U3027, U3029, P2C97]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US7596436B2/en
    - https://patents.google.com/patent/US10676100B2/en
  reviewed: '2026-11-06'

- code: U3027
  category: network
  title:
    en: Control Module A Disable Circuit High
    de: Steuergerät A Abschaltkreis hoch
  description:
    en: "U3027 is the high-side counterpart: the disable line to module A reads above its valid range, as with a short to battery voltage or a neighbouring wire. In an active-low design such as the one in Siemens patent US7596436B2, where pulling the shutdown path to ground blocks the output stages, a line stuck high means module A keeps its enable and can no longer be switched off over the hard-wired path. That removes the independent safety layer FCA's patent US10676100B2 is built around, where losing a shutoff line could let a hybrid keep producing torque. Systems therefore treat this case strictly and usually disable the function by other means. No manufacturer documents U3027 publicly; check for a short to a powered wire in the harness and for water in connectors."
    de: "U3027 ist das Gegenstück nach oben: Die Abschaltleitung zu Steuergerät A liegt über ihrem gültigen Bereich, etwa durch Schluss nach Batteriespannung oder zu einer Nachbarleitung. Bei Low-aktiver Auslegung wie im Siemens-Patent US7596436B2, wo das Ziehen des Abschaltpfads auf Masse die Endstufen sperrt, behält Modul A bei hängendem High seine Freigabe und lässt sich über die feste Leitung nicht mehr abschalten. Damit fällt die unabhängige Sicherheitsebene weg, um die es im FCA-Patent US10676100B2 geht: Dort könnte ein Hybrid bei verlorener Abschaltleitung weiter Drehmoment abgeben. Systeme behandeln diesen Fall deshalb streng und sperren die Funktion meist auf anderem Weg. Kein Hersteller dokumentiert U3027 öffentlich; zu prüfen sind Schluss zu einer spannungsführenden Leitung im Kabelbaum und Wasser in Steckern."
  affected_components:
    - module_disable_a
    - control_wiring
  common_causes:
    - id: short_to_voltage
      likelihood: high
      label:
        en: Disable wire shorted to a battery or supply wire
        de: Abschaltleitung mit Schluss zu einer Batterie- oder Versorgungsleitung
    - id: connector_bridge
      likelihood: medium
      label:
        en: Moisture or corrosion bridging pins in a connector
        de: Feuchtigkeit oder Korrosion überbrückt Pins im Stecker
    - id: sending_module_stuck_high
      likelihood: low
      label:
        en: Output driver of the supervising module stuck high
        de: Ausgangstreiber des überwachenden Steuergeräts hängt auf High
  symptoms:
    - en: Function locked out by the safety concept, system warning shown
      de: Funktion durch das Sicherheitskonzept gesperrt, Systemwarnung angezeigt
    - en: Vehicle may not become ready to drive
      de: Fahrzeug wird unter Umständen nicht fahrbereit
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3025, U3026, U302A, P2C98]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US7596436B2/en
    - https://patents.google.com/patent/US10676100B2/en
  reviewed: '2026-11-06'

- code: U3028
  category: network
  title:
    en: Control Module A Disable Feedback Circuit
    de: Steuergerät A Abschaltkreis Rückmeldung
  description:
    en: "A disable line is only useful if someone can prove it works, so many designs read back what actually arrives at the switched module. U3028 reports a fault in that feedback path for module A: the returned signal is missing or does not match the state that was commanded. GM's patent US9122662B2 shows the principle: while the ignition is off, several processors set their outputs in a fixed series of test states and compare the resulting output of the inhibit path with the expected value, flagging a fault on any mismatch. FCA's patent US10676100B2 likewise steps through six combinations of shutoff signals. No manufacturer documents U3028 publicly. Unlike U3025, the shutdown line itself may be fine; the system just cannot confirm it, so it often withholds the function until a test passes."
    de: "Eine Abschaltleitung nützt nur, wenn sich ihre Wirkung nachweisen lässt; viele Systeme lesen deshalb zurück, was beim abgeschalteten Modul wirklich ankommt. U3028 meldet einen Fehler in diesem Rückmeldepfad von Steuergerät A: Das zurückgeführte Signal fehlt oder passt nicht zum befohlenen Zustand. Das GM-Patent US9122662B2 zeigt das Prinzip: Bei ausgeschalteter Zündung setzen mehrere Prozessoren ihre Ausgänge in einer festen Folge von Testzuständen und vergleichen das Ergebnis des Sperrpfads mit dem Erwartungswert; jede Abweichung gilt als Fehler. Auch das FCA-Patent US10676100B2 geht sechs Kombinationen von Abschaltsignalen durch. Kein Hersteller dokumentiert U3028 öffentlich. Anders als bei U3025 kann die Abschaltleitung selbst intakt sein; das System kann es nur nicht bestätigen und hält die Funktion oft gesperrt, bis ein Test besteht."
  affected_components:
    - module_disable_feedback_a
    - feedback_wiring
  common_causes:
    - id: feedback_wire_open
      likelihood: high
      label:
        en: Open feedback wire or loose pin between module A and the monitoring module
        de: Unterbrochene Rückmeldeleitung oder lockerer Pin zwischen Modul A und Überwachung
    - id: test_interrupted
      likelihood: medium
      label:
        en: Self-test disturbed by low voltage or an early shutdown
        de: Selbsttest durch Unterspannung oder vorzeitiges Abschalten gestört
    - id: module_internal
      likelihood: low
      label:
        en: Faulty readback stage in module A or the monitoring module
        de: Fehlerhafte Rücklesestufe in Modul A oder im überwachenden Steuergerät
  symptoms:
    - en: Function of module A blocked after the self-test, system warning
      de: Funktion von Modul A nach dem Selbsttest gesperrt, Systemwarnung
    - en: Fault may appear only at start-up or shutdown
      de: Fehler zeigt sich mitunter nur beim Starten oder Abstellen
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [U3029, U302A, U3025]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US9122662B2/en
    - https://patents.google.com/patent/US10676100B2/en
  reviewed: '2026-11-06'

- code: U3029
  category: network
  title:
    en: Control Module A Disable Feedback Circuit Low
    de: Steuergerät A Abschaltkreis Rückmeldung niedrig
  description:
    en: "U3029 narrows the feedback fault to a signal that stays below its valid range, typically a readback wire shorted to ground. The consequence follows from the readback idea in GM's patent US9122662B2, where the inhibit path is driven through known test states and its actual output compared with the expected one: if the feedback is pinned low, every state that should read high fails, and the monitor cannot tell a working shutdown from a broken one. Depending on the design, a permanently low readback may also be taken as module A already being disabled. No manufacturer documents U3029 publicly. The usual suspects are a chafed readback wire touching the body, water in a connector or a defective input stage; the disable line itself should be checked separately."
    de: "U3029 grenzt den Rückmeldefehler auf ein Signal ein, das unter seinem gültigen Bereich bleibt, meist eine Rückleseleitung mit Masseschluss. Die Folge ergibt sich aus dem Rücklese-Prinzip im GM-Patent US9122662B2, bei dem der Sperrpfad bekannte Testzustände durchläuft und sein tatsächlicher Ausgang mit dem erwarteten verglichen wird: Hängt die Rückmeldung auf Low, scheitert jeder Zustand, der High liefern müsste, und die Überwachung kann eine funktionierende Abschaltung nicht mehr von einer defekten unterscheiden. Je nach Auslegung wird ein dauerhaft niedriges Rücklesesignal auch als bereits abgeschaltetes Modul A gedeutet. Kein Hersteller dokumentiert U3029 öffentlich. Typisch sind eine durchgescheuerte Rückleseleitung an der Karosserie, Wasser im Stecker oder eine defekte Eingangsstufe; die Abschaltleitung selbst wird getrennt geprüft."
  affected_components:
    - module_disable_feedback_a
    - feedback_wiring
  common_causes:
    - id: feedback_short_to_ground
      likelihood: high
      label:
        en: Feedback wire shorted to body ground
        de: Rückmeldeleitung mit Masseschluss zur Karosserie
    - id: connector_moisture
      likelihood: medium
      label:
        en: Moisture or corrosion pulling the readback pin low
        de: Feuchtigkeit oder Korrosion zieht den Rücklesepin auf Low
    - id: module_input_stage
      likelihood: low
      label:
        en: Defective readback input stage in the monitoring module
        de: Defekte Rücklese-Eingangsstufe im überwachenden Steuergerät
  symptoms:
    - en: Function of module A locked out, system warning displayed
      de: Funktion von Modul A gesperrt, Systemwarnung angezeigt
    - en: Code returns at every start until the short is found
      de: Code kehrt bei jedem Start zurück, bis der Schluss gefunden ist
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [50, 1200]
    estimated_hours: [1, 4]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
