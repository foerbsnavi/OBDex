- code: U3568
  category: network
  title:
    en: Anode Multifunction Valve Control Circuit
    de: Anoden-Multifunktionsventil Steuerkreis
  description:
    en: "U3568 flags trouble in the electrical drive of the anode multifunction valve: an open wire, a short against ground or battery voltage, or a failed output stage. The code title does not say which duties the valve combines; known designs merge draining water and purging nitrogen in one solenoid below the anode water separator. GM routes such a combined valve into the cathode inlet so that escaping hydrogen reacts on the catalyst, and Hyundai calls its version an integrated discharge valve. If the controller cannot switch it, the anode loses both its water outlet and its nitrogen outlet; in Hyundai's patent the system stops when no gas leaves the valve. No manufacturer documents U3568 publicly. A fuel cell warning with lost drive power is the likely result. Mechanical misbehaviour of the valve is U3569."
    de: "Der Ansteuerkreis des Anoden-Multifunktionsventils ist gestört – Leitungsbruch, Kurzschluss gegen Masse bzw. Versorgung oder eine defekte Endstufe. Welche Aufgaben das Ventil bündelt, sagt der Codetitel nicht. Bekannte Bauformen vereinen Wasserablass und Stickstoffspülung in einem Magnetventil unter dem Wasserabscheider der Anode: GM leitet ein solches Kombiventil in den Kathodeneintritt, damit entweichender Wasserstoff am Katalysator abreagiert; Hyundai spricht vom integrierten Auslassventil. Lässt es sich nicht schalten, fehlt der Anode der Weg für Wasser und Stickstoff zugleich – im Hyundai-Patent wird das System abgestellt, wenn nichts aus dem Ventil austritt. Öffentliche Herstellerunterlagen zu U3568 gibt es nicht. Zu rechnen ist mit Warnmeldung und Leistungsverlust. Mechanische Fehler des Ventils meldet U3569."
  affected_components:
    - anode_multifunction_valve
    - valve_wiring
  common_causes:
