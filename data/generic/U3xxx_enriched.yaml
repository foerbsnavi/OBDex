- code: U352F
  category: network
  title:
    en: High Voltage System Interlock Circuit J Low
    de: Hochvoltsystem Interlock-Stromkreis J niedrig
  description:
    en: U352F means loop J reads below its lower threshold, the picture an interrupted loop gives. In high-voltage plugs the interlock pins are shorter than the power pins, so they part first when the plug is withdrawn. A TE Connectivity product manager puts the resulting lead at just one to three milliseconds for a plug pulled quickly, while switching the whole system off can take close to a second, and adds that a closed loop does not prove full mating. A Hyundai and Kia connector patent names the same weakness of fast separation. A plug in loop J that has been pulled back slightly, or a dropped interlock pin, is thus the first suspect. No maker lists U352F; the contactors stay open.
    de: U352F bedeutet, dass Schleife J unter ihrer unteren Schwelle liegt – das Bild, das eine unterbrochene Schleife liefert. In Hochvoltsteckern sind die Interlock-Kontakte kürzer als die Leistungskontakte und trennen beim Abziehen zuerst. Ein Produktmanager von TE Connectivity beziffert diesen Vorsprung bei schnell gezogenem Stecker auf nur ein bis drei Millisekunden, während das Abschalten des ganzen Systems fast eine Sekunde dauern kann; eine geschlossene Schleife sei zudem kein Nachweis für einen ganz gesteckten Stecker. Ein Steckerpatent von Hyundai und Kia benennt dieselbe Schwäche schneller Trennung. Verdächtig ist daher zuerst ein leicht zurückgezogener Stecker in Kreis J oder ein zurückgewichener Interlock-Kontakt. U352F führt kein Hersteller; die Schütze bleiben offen.
  affected_components:
    - hvil_loop_j
    - hvil_wiring
  common_causes:
    - id: loop_j_plug_backed_out
      likelihood: high
      label:
        en: High-voltage plug in loop J partly withdrawn, interlock pins already apart
        de: Hochvoltstecker in Kreis J teilweise abgezogen, Interlock-Kontakte bereits getrennt
    - id: interlock_pin_pushed_back
      likelihood: medium
      label:
        en: Interlock pin in loop J pushed back in its cavity
        de: Interlock-Kontakt in Kreis J in seiner Kammer zurückgeschoben
    - id: loop_j_short_to_ground
      likelihood: medium
      label:
        en: Loop J wire chafed through to ground
        de: Leitung von Kreis J an Masse durchgescheuert
  symptoms:
    - en: High-voltage system switches off and stays off
      de: Hochvoltsystem schaltet ab und bleibt aus
    - en: No ready mode after work near high-voltage plugs
      de: Keine Fahrbereitschaft nach Arbeiten in der Nähe von Hochvoltsteckern
    - en: Charging not possible
      de: Laden nicht möglich
