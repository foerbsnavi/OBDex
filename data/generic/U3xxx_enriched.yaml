- code: U3528
  category: network
  title:
    en: High Voltage System Interlock Circuit G High
    de: Hochvoltsystem Interlock-Stromkreis G hoch
  description:
    en: U3528 means something lifts loop G to a level the controller never expects from it. Texas Instruments notes that automotive interlocks, unlike industrial ones, must survive a short to the 12 V battery and to ground; its reference design feeds the loop through an intelligent switch on the supply side with current limiting and thermal shutdown. Such electronics may come through a short undamaged, whereas a simpler output stage can fail, and then the code returns even after the wiring is repaired because the driver now stays on. No manufacturer documents U3528. Remove the foreign voltage, clear the code and test again before replacing a controller.
    de: U3528 bedeutet, dass etwas Kreis G auf einen Pegel hebt, den das Steuergerät dort nie erwartet. Texas Instruments weist darauf hin, dass ein Interlock im Fahrzeug anders als in der Industrie einen Schluss zur 12-V-Batterie und nach Masse aushalten muss; das Referenzdesign speist die Schleife deshalb über einen intelligenten High-Side-Schalter mit Strombegrenzung und Übertemperaturabschaltung. So eine Elektronik übersteht einen Kurzschluss womöglich unbeschadet, eine einfachere Endstufe nicht – dann kehrt der Code auch nach reparierter Leitung zurück, weil der Treiber eingeschaltet bleibt. Kein Hersteller dokumentiert U3528. Erst die Fremdspannung beseitigen, Code löschen und neu prüfen, bevor ein Steuergerät getauscht wird.
  affected_components:
    - hvil_loop_g
    - hvil_wiring
  common_causes:
    - id: loop_g_short_to_voltage
      likelihood: high
      label:
        en: Loop G wire shorted to the 12 V supply
        de: Leitung von Kreis G mit Schluss zur 12-V-Versorgung
    - id: driver_damaged_by_short
      likelihood: medium
      label:
        en: Loop output stage damaged by an earlier short and stuck on
        de: Schleifen-Endstufe durch früheren Kurzschluss beschädigt und dauerhaft an
    - id: connector_moisture
      likelihood: low
      label:
        en: Moisture bridging pins in a loop G connector
        de: Feuchtigkeit überbrückt Kontakte in einem Stecker von Kreis G
  symptoms:
    - en: No ready mode, high-voltage warning
      de: Keine Fahrbereitschaft, Hochvolt-Warnung
    - en: Code persists after the harness repair
      de: Code bleibt auch nach der Kabelbaumreparatur bestehen
