- code: U3009
  category: network
  title:
    en: Control Module Ground B
    de: Steuergerät Masse B
  description:
    en: "U3009 is the counterpart for the second ground path, B. In the GM brake module of 19OBDG03B the same ratio test runs the other way round: if (G1 − G2)/(G1 + G2) drops below −0.9 for 200 ms, ground 2 is judged disconnected, Type A with MIL. Ford's steering module on the 2025–2026 Explorer, Police Interceptor and Aviator shows that B is a different physical point: TSB 26-2150 sends U3009:1B to the right-hand shock tower ground, G103 on the Explorer and G119 on the Aviator, while ground A sits on the frame rail, and the repair there renews the fastening. Because one good ground can carry the module for a while, the fault may come and go with load, heat or moisture. If both U3008 and U3009 appear, check the shared ground circuit and the battery negative first."
    de: "U3009 ist das Gegenstück für den zweiten Massepfad B. Im GM-Bremssteuergerät aus 19OBDG03B läuft dieselbe Verhältnisprüfung umgekehrt: Sinkt (G1 − G2)/(G1 + G2) für 200 ms unter −0,9, gilt Masse 2 als getrennt, Typ A mit MIL. Fords Lenkungssteuergerät in Explorer, Police Interceptor und Aviator 2025–2026 zeigt, dass B ein anderer Massepunkt ist: TSB 26-2150 verweist bei U3009:1B auf G103 (Explorer) bzw. G119 (Aviator) am rechten Federbeindom, während Masse A am Rahmenträger sitzt; dort wird die Befestigung erneuert. Weil eine intakte Masse das Steuergerät eine Zeit lang allein trägt, kann der Fehler mit Last, Wärme oder Feuchte kommen und gehen. Stehen U3008 und U3009 gemeinsam, zuerst die gemeinsame Masseführung und den Batterie-Minuspol prüfen."
  affected_components:
    - module_ground_b
    - ground_strap
  common_causes:
    - id: loose_ground_point
      likelihood: high
      label:
        en: Loose nut or stud at the ground B mounting point
        de: Lockere Mutter oder lockerer Bolzen am Massepunkt B
    - id: corroded_ground
      likelihood: medium
      label:
        en: Corroded contact face at the strut tower or body ground
        de: Korrodierte Auflagefläche am Federbeindom oder Karosseriemassepunkt
    - id: ground_wire_damage
      likelihood: low
      label:
        en: Damaged ground wire B or crimp in the harness
        de: Beschädigte Masseleitung B oder Crimpung im Kabelbaum
  symptoms:
    - en: Intermittent steering assist or brake warning messages
      de: Zeitweise Meldungen zu Lenkhilfe oder Bremssystem
    - en: Heavier steering or reduced brake control while the fault is active
      de: Schwergängigere Lenkung oder eingeschränkte Bremsregelung, solange der Fehler aktiv ist
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [10, 250]
    estimated_hours: [0.5, 2]
  flags:
