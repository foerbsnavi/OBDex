      de: Warnung des Brennstoffzellensystems, MIL an
    - en: Noticeably reduced power
      de: Spürbar weniger Leistung
    - en: Compressor speed fluctuates or stays high
      de: Verdichterdrehzahl schwankt oder bleibt hoch
