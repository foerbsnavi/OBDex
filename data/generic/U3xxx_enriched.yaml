- code: U3538
  category: network
  title:
    en: High Voltage System Interlock Circuit L High
    de: Hochvoltsystem Interlock-Stromkreis L hoch
  description:
    en: "U3538 is stored when loop L overshoots its permitted maximum. In a constant-current loop that can be a contact problem rather than foreign voltage. Tesla's Model S tech note records its most frequent HVIL field failure as high-voltage plugs serving the cabin PTC heater, the heater for battery coolant and the A/C compressor harness whose interlock pins were too short: the supplier had changed the housing without lengthening the pins, and in the worst case male and female never met. Higher resistance raised the loop voltage until the fault set. Replacement plugs with longer pins carry a yellow dot. Comparable part revisions can matter on any loop L. No maker documents U3538; high voltage stays off."
    de: "U3538 zeigt Schleife L über ihrer oberen Schwelle. In einer Schleife mit Konstantstrom kann das ein Kontaktproblem statt Fremdspannung sein. Teslas Technotiz zum Model S nennt als häufigsten HVIL-Ausfall im Feld Hochvoltstecker an PTC-Innenraumheizung, Batterie-Kühlmittelheizer und Klimakompressor-Leitung mit zu kurzen Interlock-Kontakten: Der Zulieferer hatte das Gehäuse geändert, ohne die Kontakte zu verlängern, und schlimmstenfalls berührten sich Stift und Buchse gar nicht. Der höhere Widerstand hob die Schleifenspannung, bis der Fehler stand. Ersatzstecker mit längeren Kontakten tragen einen gelben Punkt. Vergleichbare Teilestände können bei jeder Schleife L eine Rolle spielen. U3538 dokumentiert kein Hersteller; die Hochspannung bleibt aus."
  affected_components:
    - hvil_loop_l
    - hvil_wiring
  common_causes:
    - id: interlock_pins_too_short
      likelihood: medium
      label:
        en: Connector revision in loop L with interlock pins too short for reliable contact
        de: Steckerstand in Kreis L mit zu kurzen Interlock-Kontakten für sicheren Kontakt
    - id: loop_l_short_to_12v
      likelihood: medium
      label:
        en: Loop L wire in contact with a 12 V supply
        de: Leitung von Kreis L mit Kontakt zu einer 12-V-Versorgung
    - id: spread_terminal_loop_l
      likelihood: medium
      label:
        en: Spread female terminal in a loop L connector
        de: Aufgeweitete Buchse in einem Stecker von Kreis L
  symptoms:
    - en: Vehicle does not become ready or switches off high voltage
      de: Fahrzeug wird nicht fahrbereit oder schaltet die Hochspannung ab
    - en: Heating or air conditioning affected if their plugs are part of the loop
      de: Heizung oder Klimaanlage betroffen, wenn deren Stecker zur Schleife gehören
