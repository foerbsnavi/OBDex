- code: U3552
  category: network
  title:
    en: Hydrogen Tank A Valve Performance
    de: Wasserstofftank A Ventil Funktion
  description:
    en: "U3552 is the performance code for the valve on tank A: the circuit tests good, but the valve does not act as commanded, either staying shut or failing to seal. With several tanks this is hard to see, because one pressure sensor where the tank lines merge cannot tell that a single tank no longer delivers. Hyundai's answer in a 2018 patent is to estimate how much hydrogen is supplied and compare it with what the stack consumes and purges; another Hyundai patent, with a sensor on each tank, flags the tank whose pressure drifts about 50 bar from the rest. No maker documents U3552 publicly. The driver mainly notices less range and a warning, and the tank with the faulty valve is kept closed. U3555 is tank B."
    de: "U3552 ist der Funktionscode des Ventils an Tank A: Elektrisch ist alles in Ordnung, doch das Ventil folgt dem Befehl nicht – es bleibt zu oder dichtet nicht ab. Bei mehreren Tanks fällt das schwer auf, denn ein einzelner Drucksensor hinter der Zusammenführung der Tankleitungen merkt nicht, dass ein Behälter nichts mehr liefert. Hyundai schätzt deshalb laut Patent von 2018 die zugeführte Wasserstoffmenge und stellt sie dem gegenüber, was der Stack verbraucht und ausspült; ein weiteres Hyundai-Patent mit Sensor an jedem Tank markiert den Behälter, dessen Druck etwa 50 bar von den anderen abweicht. Öffentlich dokumentiert kein Hersteller U3552. Spürbar sind vor allem geringere Reichweite und eine Warnung; der Tank mit dem fehlerhaften Ventil bleibt geschlossen. Tank B: U3555."
  affected_components:
    - h2_tank_a_valve
  common_causes:
    - id: valve_stuck_closed
      likelihood: medium
      label:
