- code: U3511
  category: network
  title:
    en: High Voltage System Interlock Circuit B
    de: Hochvoltsystem Interlock-Stromkreis B
  description:
    en: "U3511 is the general fault of a second high-voltage interlock loop, circuit B. Many vehicles need more than one loop: a Volvo truck patent gives each separate HV bus its own interlock circuit, and a Samsung SDI patent describes extra loops for battery-internal parts such as the service disconnect or the junction box, each with its own source, detector and diagnosis. Which plugs belong to loop B is not published by any maker; GM's OBD tables and Mercedes' model line 243 report all interlock faults with the loop A codes P0A0A–P0A0D. The module sets U3511 when loop B is disturbed but no more precise low, high or performance result applies. The contactors stay open and the vehicle cannot reach ready mode. CARB lists interlock loops as safety-only systems."
    de: "U3511 ist der allgemeine Fehler einer zweiten Hochvolt-Interlock-Schleife, des Stromkreises B. Viele Fahrzeuge brauchen mehr als eine Schleife: Ein Volvo-Lkw-Patent gibt jedem getrennten HV-Bus einen eigenen Interlock-Kreis, ein Patent von Samsung SDI beschreibt zusätzliche Schleifen für Teile im Akku wie Servicestecker oder Verteilerbox, jeweils mit eigener Quelle, eigenem Detektor und eigener Diagnose. Welche Stecker zu Kreis B gehören, legt kein Hersteller offen; GM (OBD-Tabellen) und Mercedes (Baureihe 243) melden Interlock-Fehler nur mit P0A0A–P0A0D. U3511 steht, wenn Kreis B gestört ist, ohne dass ein genauerer Befund (niedrig, hoch, Funktion) zutrifft. Die Schütze bleiben offen, Fahrbereitschaft gibt es nicht. CARB zählt Interlock-Schleifen zu den reinen Sicherheitssystemen."
  affected_components:
    - hvil_loop_b
    - hv_connectors
  common_causes:
    - id: loop_b_connector_open
      likelihood: high
      label:
        en: HV connector, cover or disconnect in loop B open or not latched after service
        de: HV-Stecker, Deckel oder Trennstelle in Kreis B offen oder nach Service nicht eingerastet
    - id: interlock_pin_damage
      likelihood: medium
      label:
        en: Bent, pushed-back or corroded interlock pins
        de: Verbogene, zurückgeschobene oder korrodierte Interlock-Kontakte
    - id: loop_b_harness_damage
      likelihood: medium
      label:
        en: Interlock wiring of loop B chafed or cut
        de: Interlock-Leitung von Kreis B durchgescheuert oder durchtrennt
    - id: monitoring_module_fault
      likelihood: low
      label:
        en: Source or sense stage for loop B in the monitoring module faulty
        de: Quelle oder Messstufe für Kreis B im überwachenden Steuergerät defekt
  symptoms:
    - en: Vehicle does not enter ready mode
      de: Fahrzeug geht nicht in Fahrbereitschaft
    - en: High-voltage or hybrid system warning in the cluster
      de: Hochvolt- bzw. Hybridwarnung im Kombiinstrument
    - en: Charging refused
      de: Laden wird verweigert
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1500]
    estimated_hours: [0.5, 4]
