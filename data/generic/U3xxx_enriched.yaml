- code: U3536
  category: network
  title:
    en: High Voltage System Interlock Circuit L Performance
    de: Hochvoltsystem Interlock-Stromkreis L Funktion
  description:
    en: U3536 means loop L delivers values the controller considers implausible without a clear limit being crossed. Shaky contacts are a typical reason. Tesla's Model S HVIL note has technicians wiggle each plug while a second person watches the live loop voltage, and stresses that a weak spot may make the value drift long before it is bad enough to set a fault; pin drag tests then reveal loose terminal tension. Multi-Contact markets a dedicated short-contact module tested for shock and vibration to DIN 50467, because ordinary shortened contacts can end up wrongly placed. No maker documents U3536. Expect brief shutdowns, often on bad roads.
    de: U3536 bedeutet, dass Schleife L Werte liefert, die das Steuergerät für unplausibel hält, ohne dass eine klare Grenze überschritten wird. Wacklige Kontakte sind ein typischer Grund. Teslas HVIL-Notiz zum Model S lässt Techniker jeden Stecker bewegen, während eine zweite Person die laufend angezeigte Schleifenspannung beobachtet, und betont, dass eine Schwachstelle den Wert schon wandern lassen kann, lange bevor sie für einen Fehler reicht; Zugkraftprüfungen an den Kontakten decken danach nachlassende Federkraft auf. Multi-Contact bietet ein eigenes Modul mit kurzen Kontakten an, geprüft auf Stoß und Vibration nach DIN 50467, weil gewöhnliche gekürzte Kontakte falsch sitzen können. U3536 dokumentiert kein Hersteller. Zu erwarten sind kurze Abschaltungen, oft auf schlechter Straße.
  affected_components:
    - hvil_loop_l
  common_causes:
    - id: low_terminal_tension
      likelihood: high
      label:
        en: Terminal in a loop L connector with too little contact force
        de: Kontakt in einem Stecker von Kreis L mit zu geringer Kontaktkraft
    - id: connector_not_strain_relieved
      likelihood: medium
      label:
        en: Loop L connector without proper strain relief, moving with vibration
        de: Stecker von Kreis L ohne ausreichende Zugentlastung, bewegt sich bei Vibration
    - id: detector_input_fault
      likelihood: low
      label:
        en: Signal input of the evaluating controller faulty
        de: Signaleingang des auswertenden Steuergeräts defekt
  symptoms:
    - en: Short high-voltage dropouts while driving, especially over bumps
      de: Kurze Hochvolt-Aussetzer während der Fahrt, besonders über Unebenheiten
    - en: Warning disappears after a restart
      de: Warnung verschwindet nach einem Neustart
