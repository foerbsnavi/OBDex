- code: U3554
  category: network
  title:
    en: Hydrogen Tank B Valve Enable Circuit
    de: Wasserstofftank B Ventil Freigabekreis
  description:
    en: "U3554 refers to the enable path that powers the tank B solenoid. Its purpose is a second, independent way to withdraw the permission for the valve to open. Toyota patented a layout in which the valve controller and the controller for high voltage sit at opposite ends of the car and back each other up: after a crash at one end, the controller at the undamaged end shuts the hydrogen valve. Toyota's FCHV guide also lists an opened hood or fuel door among the triggers that close the valves. A fault in such a release path keeps tank B shut even with an intact coil. No maker documents U3554 publicly. Check fuses, relays and the release wiring before the valve itself; U3553 covers the control side of the same valve."
    de: "U3554 betrifft den Freigabekreis des Magnetventils an Tank B. Er soll einen zweiten, unabhängigen Weg bieten, dem Ventil die Erlaubnis zum Öffnen zu entziehen. Toyota hat eine Anordnung patentiert, bei der Ventilsteuerung und Hochvoltsteuerung an entgegengesetzten Fahrzeugenden sitzen und sich gegenseitig absichern: Nach einem Aufprall an einem Ende schließt das Gerät am unbeschädigten Ende das Wasserstoffventil. Im FCHV-Leitfaden von Toyota gehören auch geöffnete Motorhaube oder Tankklappe zu den Auslösern, die die Ventile schließen. Ein Fehler in einem solchen Freigabepfad hält Tank B geschlossen, obwohl die Spule heil ist. Öffentlich dokumentiert kein Hersteller U3554. Vor dem Ventil Sicherungen, Relais und Freigabeleitung prüfen; die Steuerseite desselben Ventils meldet U3553."
  affected_components:
    - h2_tank_b_valve_enable
    - safety_circuit
  common_causes:
    - id: enable_relay
      likelihood: medium
      label:
        en: Enable relay or switch in the supply path faulty
        de: Freigaberelais oder Schalter im Versorgungspfad defekt
    - id: enable_wiring
      likelihood: medium
      label:
        en: Open or short in the enable line to valve B
        de: Unterbrechung oder Kurzschluss in der Freigabeleitung zu Ventil B
    - id: release_condition_input
      likelihood: low
      label:
        en: Faulty input that withdraws the release, such as a crash or flap signal
        de: Fehlerhafter Eingang, der die Freigabe entzieht, etwa Crash- oder Klappensignal
  symptoms:
