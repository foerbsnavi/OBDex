- code: U3530
  category: network
  title:
    en: High Voltage System Interlock Circuit J High
    de: Hochvoltsystem Interlock-Stromkreis J hoch
  description:
    en: U3530 flags loop J above its upper threshold. Foreign voltage is one explanation, but in a design that pushes a constant current through the loop and reads the drop across it, any added resistance lifts the measured value too. Tesla's HVIL tech note for early Model S cars, filed with NHTSA, names a poor solder joint at a charger board connector that exceeded 90 ohms only when hot. To reproduce it, technicians drove about 20 minutes at highway speed, charged for at least half an hour and measured the loop pins on the still warm charger. A loop J fault that turns up only after long trips or charging sessions points to such heat-sensitive joints. No maker documents U3530 itself.
    de: U3530 meldet Schleife J über ihrer oberen Schwelle. Fremdspannung ist eine Erklärung; schickt eine Schaltung aber einen konstanten Strom durch die Schleife und misst den Spannungsabfall, hebt jeder zusätzliche Widerstand den Messwert ebenfalls an. Teslas bei der NHTSA hinterlegte HVIL-Technotiz zum frühen Model S nennt eine schlechte Lötstelle an einem Stecker der Ladegeräteplatine, die nur im heißen Zustand über 90 Ohm stieg. Zum Nachstellen fuhren Techniker rund 20 Minuten auf der Autobahn, luden mindestens eine halbe Stunde und maßen die Schleifenkontakte am noch warmen Lader. Tritt ein Fehler an Kreis J nur nach langen Fahrten oder Ladevorgängen auf, deutet das auf solche wärmeempfindlichen Verbindungen. U3530 selbst dokumentiert kein Hersteller.
  affected_components:
    - hvil_loop_j
    - hvil_wiring
  common_causes:
    - id: heat_sensitive_joint
      likelihood: medium
      label:
        en: Cracked solder joint or crimp in loop J whose resistance rises when warm
        de: Gerissene Lötstelle oder Crimpung in Kreis J, deren Widerstand bei Wärme steigt
    - id: loop_j_short_to_12v
      likelihood: medium
      label:
        en: Loop J wire in contact with a 12 V supply
        de: Leitung von Kreis J mit Kontakt zu einer 12-V-Versorgung
    - id: loose_terminal_loop_j
      likelihood: medium
      label:
        en: Loose or spread terminal in a loop J connector
        de: Lockerer oder aufgeweiteter Kontakt in einem Stecker von Kreis J
  symptoms:
    - en: Fault appears after long drives or charging, not on a cold start
      de: Fehler tritt nach langer Fahrt oder nach dem Laden auf, nicht beim Kaltstart
    - en: Charging session or drive interrupted by a high-voltage warning
      de: Ladevorgang oder Fahrt wird von einer Hochvolt-Warnung unterbrochen
    - en: Loop measures normal once the components have cooled down
      de: Schleife misst nach dem Abkühlen der Bauteile wieder normal
  repair:
