- code: U355A
  category: network
  title:
    en: Charge Air Cooler Outlet Pressure Sensor 1 Circuit
    de: Ladeluftkühler Austritt Drucksensor 1 Stromkreis
  description:
    en: "U355A concerns the first of two pressure sensors behind the charge air cooler, where compressed and cooled air heads for the humidifier and the stack. This is the pressure the system really regulates: in a Nissan patent a sensor between intercooler and water recovery unit is the feedback for compressor torque and the outlet pressure valve, and the controller caps this pressure so that compressor and humidifier stay below their heat limits. Toyota takes its counterpart behind compressor and intercooler as the delivery pressure for the surge check. No public manufacturer document names U355A. An open or shorted circuit takes away the main pressure feedback; expect a fuel cell warning and reduced output. Where sensor 2 (U355B) is fitted it can serve as a fallback."
    de: "U355A betrifft den ersten von zwei Drucksensoren hinter dem Ladeluftkühler, also dort, wo die verdichtete und gekühlte Luft zum Befeuchter und zum Stack strömt. An dieser Stelle wird der Druck tatsächlich geregelt: Im Nissan-Patent dient ein Sensor zwischen Ladeluftkühler und Wasserrückgewinnung als Rückmeldung für Verdichter-Drehmoment und Druckventil am Ausgang; zugleich begrenzt das Steuergerät diesen Druck, damit Verdichter und Befeuchter nicht zu heiß werden. Toyota nutzt den entsprechenden Sensor als Förderdruck für die Pumpgrenzen-Prüfung. Öffentlich beschreibt kein Hersteller U355A. Bei Unterbrechung oder Kurzschluss fehlt die wichtigste Druckrückmeldung – Warnung und gedrosselte Leistung sind zu erwarten. Ist Sensor 2 (U355B) verbaut, kann er einspringen."
  affected_components:
    - cac_outlet_pressure_sensor_1
    - sensor_wiring
  common_causes:
    - id: harness_connector_cac_area
      likelihood: high
      label:
        en: Open, short or corrosion in wiring or connector of sensor 1
        de: Unterbrechung, Kurzschluss oder Korrosion an Leitung oder Stecker von Sensor 1
    - id: sensor_internal_fault
      likelihood: medium
      label:
        en: Pressure sensor 1 faulty internally
        de: Drucksensor 1 intern defekt
    - id: sensor_supply_ground_fault
      likelihood: low
      label:
        en: Shared 5 V supply or ground faulty (often with other sensor codes)
        de: Gemeinsame 5-V-Versorgung oder Masse gestört (oft mit weiteren Sensorcodes)
  symptoms:
