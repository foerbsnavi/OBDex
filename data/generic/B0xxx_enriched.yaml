- code: B00E6
  category: body
  title:
    en: Third Row Right Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C dritte Reihe rechts Auslösesteuerung
  description:
    en: "Note the order in this block: B00E6 is the right seat of the third row, while B00E7 is the left. Mercedes-Benz fills B00E6 with the retractor tensioner on that seat: LI54.21-P-070658 (first issued December 2019 for A-Class and CLA, extended to GLB in version 4) reads B00E613 as an interrupted igniter in the tensioning retractor on the right of row three. The stated cause is again contact resistance at the airbag unit plug. Mercedes' GLS manual of 2017 confirms that the brand gives third-row belts their own tensioners and force limiters. No other maker publishes the code. With B00E6 stored, the airbag lamp is on and the right third-row belt will not be tightened."
    de: "Achtung, Reihenfolge: B00E6 ist der rechte Platz der dritten Reihe, B00E7 der linke. Mercedes-Benz belegt B00E6 mit dem Aufrollerstraffer an diesem Sitz: LI54.21-P-070658 (zuerst im Dezember 2019 für A-Klasse und CLA, in Fassung 4 auf den GLB erweitert) führt B00E613 als Unterbrechung an der Zündpille des Gurtstraffer-Aufrollers rechts in der dritten Sitzreihe. Als Ursache gilt auch hier der Übergangswiderstand am Stecker des Airbag-Steuergeräts. Dass die Marke den Gurten der dritten Reihe eigene Straffer und Kraftbegrenzer gibt, bestätigt das GLS-Handbuch von 2017. Andere Hersteller veröffentlichen den Code nicht. Ist B00E6 gespeichert, leuchtet die Airbag-Lampe, und der rechte Gurt der dritten Reihe wird nicht gestrafft."
  affected_components:
    - third_row_right_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: srs_module_contact
      likelihood: high
      label:
        en: Contact resistance at the airbag unit connector (Mercedes LI54.21-P-070658)
        de: Übergangswiderstand am Stecker des Airbag-Steuergeräts (Mercedes LI54.21-P-070658)
    - id: third_row_right_connector
      likelihood: medium
      label:
        en: Plug of the right third-row retractor behind the cargo trim loose
        de: Stecker des rechten Aufrollers der dritten Reihe hinter der Laderaumverkleidung locker
    - id: cargo_area_harness
      likelihood: low
      label:
        en: Wiring in the rear wheel arch area pinched by trim or cargo
        de: Leitung im Bereich des hinteren Radhauses durch Verkleidung oder Ladung gequetscht
    - id: retractor_squib_fault
      likelihood: low
      label:
        en: Squib of the right third-row retractor defective
        de: Zündpille des rechten Aufrollers der dritten Reihe defekt
  symptoms:
    - en: SRS message or airbag warning lamp
      de: SRS-Meldung oder Airbag-Warnleuchte
    - en: Right third-row belt stays slack in a crash
      de: Rechter Gurt der dritten Reihe bleibt bei einem Unfall lose
    - en: "Safety note: work on this pyrotechnic retractor only de-energised (battery disconnected, wait time) and preferably by a specialist"
      de: "Sicherheitshinweis: An diesem pyrotechnischen Aufroller nur spannungsfrei arbeiten (Batterie ab, Wartezeit), am besten durch eine Fachwerkstatt"
