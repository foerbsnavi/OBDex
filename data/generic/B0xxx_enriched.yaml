    - https://static.nhtsa.gov/odi/tsbs/2017/MC-10138855-9999.pdf
  reviewed: '2026-11-06'

- code: B011D
  category: body
  title:
    en: Fluid Reservoir Level Sensor B
    de: Flüssigkeitsbehälter Füllstandssensor B
  description:
    en: "B011D concerns level sensor B. Not every washer tank relies on a float. Volkswagen's bulletin 2037322 (2015) describes its washer level sensor G33 as a part whose reading depends on the fluid itself: the wrong mix or additives coat the sensor, cut its sensitivity and leave the lamp lit with a full tank; the remedy is draining, cleaning the sensor and refilling with approved fluid. Sensors moulded into the reservoir cannot be replaced on their own. A non-contact alternative is the capacitive single-point detector of patent US5017909A, fixed on the outside wall at the minimum level, where the liquid shifts the measured capacitance. Which principle sits behind letter B is not published, and no maker lists B011D publicly."
    de: "B011D betrifft Füllstandssensor B. Nicht jeder Waschbehälter misst mit Schwimmer. Volkswagen beschreibt im Bulletin 2037322 (2015) den Füllstandsgeber G33 als Bauteil, dessen Messung von der Flüssigkeit selbst abhängt: Falsches Mischungsverhältnis oder Zusätze lagern sich ab, senken die Empfindlichkeit und lassen die Leuchte bei vollem Behälter brennen. Abhilfe ist Ablassen, Reinigen des Gebers und Befüllen mit freigegebenem Mittel. In den Behälter eingespritzte Geber lassen sich nicht einzeln tauschen. Berührungslos arbeitet dagegen der kapazitive Einpunktmelder aus Patent US5017909A, außen an der Behälterwand auf Höhe des Mindeststands befestigt; die Flüssigkeit verändert dort die Kapazität. Welches Prinzip hinter B steckt, ist nicht veröffentlicht; B011D dokumentiert kein Hersteller."
  affected_components:
    - fluid_reservoir_level_sensor_b
    - sensor_wiring
  common_causes:
    - id: sensor_coated_by_fluid
      likelihood: high
      label:
        en: Deposits from unsuitable washer fluid or additives on the sensing surface
        de: Ablagerungen aus ungeeignetem Waschmittel oder Zusätzen auf der Messfläche
    - id: sensor_b_internal_fault
      likelihood: medium
      label:
