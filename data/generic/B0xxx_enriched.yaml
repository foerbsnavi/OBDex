- code: B0092
  category: body
  title:
    en: Left Side Restraints Sensor 2
    de: Seitencrashsensor links 2
  description:
    en: "B0092 belongs to the second crash sensor on the left side. Mitsubishi fits it at the left B-pillar and lists it as B-PILLAR SAT SEN LH, adding the J2012 title Left Side Restraints Sensor 2; its index shows only subtype -55, set two seconds after the unit finds that its stored configuration does not fit the vehicle. A pillar position suits an acceleration satellite: Bosch mounts these on stiff members such as sills, seat cross members or B- and C-pillars, and its SMA773 chip measures two axes up to 60 g and talks to the module over a two-wire PSI5 link. GM-built Saabs use the number differently: the 2006 9-5 and the 9-3 store B0092 for a general fault of the passenger presence system, with the airbag system then rated out of order. The airbag lamp is on."
    de: "B0092 gehört zum zweiten Crashsensor auf der linken Seite. Mitsubishi setzt ihn an die linke B-Säule und führt ihn als B-PILLAR SAT SEN LH mit dem J2012-Titel Left Side Restraints Sensor 2; im Index steht nur der Untertyp -55, gesetzt zwei Sekunden nachdem das Steuergerät feststellt, dass seine gespeicherte Konfiguration nicht zum Fahrzeug passt. Für eine Säule eignet sich ein Beschleunigungs-Satellit: Bosch montiert solche Sensoren an steifen Bauteilen wie Schweller, Sitzquerträger oder B- und C-Säule, und sein Chip SMA773 misst zwei Achsen bis 60 g und spricht über eine zweiadrige PSI5-Leitung mit dem Steuergerät. Saab-Modelle von GM nutzen die Nummer anders: Der 9-5 (2006) und der 9-3 legen B0092 für einen allgemeinen Fehler der Beifahrer-Präsenzerkennung ab und werten das Airbag-System dann als gestört. Die Airbag-Lampe brennt."
  affected_components:
    - left_side_impact_sensor_2
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: module_configuration
      likelihood: high
      label:
        en: Airbag unit configuration not matching the fitted sensors (Mitsubishi subtype -55)
        de: Konfiguration des Airbag-Steuergeräts passt nicht zu den verbauten Sensoren (Mitsubishi Untertyp -55)
    - id: pillar_connector_fault
      likelihood: medium
      label:
        en: Loose or corroded plug at the B-pillar sensor after trim or body work
        de: Lockerer oder korrodierter Stecker am B-Säulen-Sensor nach Verkleidungs- oder Karosseriearbeit
    - id: saab_pps_fault
      likelihood: medium
      label:
        en: On GM-built Saabs, passenger presence system fault (different meaning)
        de: Bei Saab von GM Fehler der Beifahrer-Präsenzerkennung (andere Bedeutung)
    - id: pillar_sensor_fault
      likelihood: low
      label:
        en: Internal fault of the B-pillar satellite sensor
        de: Interner Fehler des Satellitensensors an der B-Säule
