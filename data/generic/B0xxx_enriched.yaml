      likelihood: high
      label:
        en: Liquid, rain or condensation soaked into the seat cushion and sensor
        de: Flüssigkeit, Regen oder Kondenswasser im Sitzpolster und Sensor
    - id: sensor_mat_wear
      likelihood: medium
      label:
        en: Sensor mat cracked or worn from years of getting in and out
        de: Sensormatte durch jahrelanges Ein- und Aussteigen gebrochen oder verschlissen
    - id: seat_harness_connector
      likelihood: medium
      label:
        en: Damaged lead or plug between mat and classification unit
        de: Beschädigte Leitung oder Stecker zwischen Matte und Klassifizierungsgerät
  symptoms:
