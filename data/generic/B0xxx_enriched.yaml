- code: B011F
  category: body
  title:
    en: Fluid Reservoir Level Sensor D
    de: Flüssigkeitsbehälter Füllstandssensor D
  description:
    en: "B011F reports level sensor D. A recurring weakness of float switches in washer bottles is motion: fluid slopping around in corners or under braking lifts and drops the float and can set it spinning. Continental's patent US9003878B2 answers with a float guided in an angled carrier, ribs that stop it turning and an optional slosh guard, so one design suits side or bottom mounting. The other weak point is the wiring: FCA parts tip 68225064A tells technicians who face a false low-fluid message to check circuits W1 and W11 at a 48-way connector before condemning the float sensor. Which tank letter D refers to is left open by the makers, and nobody documents B011F publicly. Expect flickering or false level messages."
    de: "B011F meldet Füllstandssensor D. Eine bekannte Schwäche von Schwimmerschaltern in Waschflaschen ist Bewegung: Schwappende Flüssigkeit in Kurven oder beim Bremsen hebt und senkt den Schwimmer und kann ihn ins Drehen bringen. Continentals Patent US9003878B2 setzt dagegen einen Schwimmer in einem schräg stehenden Träger, Rippen gegen Verdrehen und einen wahlweisen Schwallschutz; dieselbe Bauform passt so für Seiten- und Bodeneinbau. Die zweite Schwachstelle ist die Leitung: FCA rät im Teile-Hinweis 68225064A, bei falscher Meldung zuerst die Kreise W1 und W11 an einem 48-poligen Stecker zu prüfen, bevor der Schwimmergeber getauscht wird. Was Buchstabe D bezeichnet, lassen die Hersteller offen; öffentlich dokumentiert niemand B011F. Zu erwarten sind flackernde oder falsche Füllstandsmeldungen."
  affected_components:
    - fluid_reservoir_level_sensor_d
    - sensor_wiring
  common_causes:
    - id: harness_connector_d
      likelihood: high
      label:
        en: Loose or corroded pins at an intermediate harness connector
        de: Lockere oder korrodierte Kontakte an einem Zwischenstecker des Kabelbaums
    - id: float_slosh_d
      likelihood: medium
      label:
        en: Float moving freely with sloshing fluid, guide or slosh guard broken
        de: Schwimmer folgt dem Schwappen, Führung oder Schwallschutz gebrochen
    - id: sensor_d_defective
      likelihood: low
      label:
        en: Level sensor D itself defective
        de: Füllstandsgeber D selbst defekt
  symptoms:
    - en: Level warning switching on and off while driving, especially in bends
      de: Füllstandswarnung geht während der Fahrt an und aus, vor allem in Kurven
    - en: False low-level message with a full reservoir
      de: Falsche Meldung „Füllstand niedrig“ bei vollem Behälter
