      de: Statusanzeige des Beifahrerairbags zeigt den falschen Zustand, oder der Beifahrerairbag bleibt abgeschaltet
    - en: Fault may appear only after cold starts with a weak battery
      de: Fehler tritt eventuell nur nach Kaltstarts mit schwacher Batterie auf
