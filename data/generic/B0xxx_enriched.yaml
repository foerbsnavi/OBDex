- code: B007B
  category: body
  title:
    en: Second Row Left Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B zweite Reihe links Auslösesteuerung
  description:
    en: "B007B would cover a second pretensioner on the outboard left seat in row two, for example a lap tensioner in addition to the retractor unit. No manufacturer publishes B007B. The documented rear cases use other slots: Mitsubishi files its left rear retractor pretensioner under B0073, and Mercedes logs the left rear emergency tensioning retractor as B00E3, the C-stage code. Joyson's lap pretensioner shows the kind of hardware a B stage could stand for, since it is meant to fire alongside a retractor pretensioner. In IIHS crash tests that placed a dummy behind the driver, submarining showed up in some vehicles with rear pretensioners, which is the risk such a lap device addresses. A stored B007B keeps the airbag lamp lit and leaves that stage inactive."
    de: "B007B wäre ein zweiter Gurtstraffer am linken Außenplatz der zweiten Reihe, etwa ein Beckengurtstraffer zusätzlich zum Aufroller. Kein Hersteller veröffentlicht B007B. Die dokumentierten Fälle hinten nutzen andere Plätze: Mitsubishi legt den linken hinteren Aufrollerstraffer unter B0073 ab, Mercedes den linken hinteren Gurtstraffer-Aufroller als B00E3, also auf Stufe C. Welche Hardware eine Stufe B sein könnte, zeigt Joysons Beckengurtstraffer, der gemeinsam mit einem Aufrollerstraffer zündet. In Frontalcrashtests des IIHS mit Dummy hinten links rutschte der Dummy bei einigen Fahrzeugen mit hinteren Straffern unter dem Beckengurt durch – genau dagegen hilft ein Beckenstraffer. Ist B007B gespeichert, leuchtet die Airbag-Lampe und diese Stufe fällt aus."
  affected_components:
    - second_row_left_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: rear_left_lap_connector
      likelihood: high
      label:
        en: Plug of the left rear lap or anchor tensioner disturbed when the bench was removed
        de: Stecker des linken hinteren Becken- oder Verankerungsstraffers beim Ausbau der Rückbank gelöst
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Airbag module coded for a rear B-stage tensioner that is not fitted
        de: Airbagsteuergerät auf einen nicht verbauten hinteren Straffer der Stufe B codiert
    - id: floor_harness_damage
      likelihood: low
      label:
        en: Floor harness to the left rear seat damaged
        de: Bodenkabelbaum zum linken Rücksitz beschädigt
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left rear lap belt not tightened in a crash
      de: Beckengurt hinten links wird bei einem Unfall nicht gestrafft
    - en: "Safety note: pyrotechnic part at the rear seat; work only de-energised (battery off, wait) and at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Teil am Rücksitz; nur spannungsfrei (Batterie ab, warten) und in einer Fachwerkstatt arbeiten"
  repair:
    difficulty: shop_only
