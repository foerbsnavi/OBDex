- code: B0088
  category: body
  title:
    en: Third Row Right Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer dritte Reihe rechts Auslösesteuerung
  description:
    en: "B0088 closes the load limiter series with the right third-row seat. No manufacturer documents it with this meaning. If such a squib-switched limiter is fitted, the module tests its loop for opens, shorts and out-of-window resistance like any igniter; an Autoliv patent shows the principle, where gas from a squib releases a blocking ring so the softer torsion section takes over. Some designs avoid the extra loop altogether, such as the Delphi rear-seat retractor that switches mechanically. On GM Global A models (2011 Saab 9-4X) B0088 instead flags the right rear side impact sensor, using the same symptom bytes as its siblings: shorts, open or high resistance, low current, internal failure, wrong part fitted and invalid serial data. A stored code lights the airbag lamp."
    de: "B0088 schließt die Reihe der Kraftbegrenzer mit dem rechten Sitz der dritten Reihe ab. Kein Hersteller belegt ihn in dieser Bedeutung. Ist ein solcher pillengeschalteter Begrenzer verbaut, prüft das Steuergerät seinen Kreis wie jeden Zünder auf Unterbrechung, Kurzschluss und Widerstand außerhalb des Fensters; ein Autoliv-Patent zeigt das Prinzip, bei dem Gas aus einer Pille einen Sperrring freigibt, sodass der weichere Torsionsabschnitt übernimmt. Der Delphi-Aufroller für Rücksitze schaltet dagegen rein mechanisch. Beim Saab 9-4X (2011) meldet B0088 dagegen den rechten hinteren Seitenaufprallsensor, mit denselben Fehlerbytes wie die Nachbarn: Kurzschlüsse, Unterbrechung oder hoher Widerstand, zu geringer Strom, innerer Fehler, falsches Teil und ungültige Daten. Die Airbag-Lampe leuchtet."
  affected_components:
    - third_row_right_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_right_rear_side_sensor
      likelihood: high
      label:
        en: On GM vehicles, right rear side impact sensor or wiring faulty (different meaning)
        de: Bei GM rechter hinterer Seitenaufprallsensor oder Leitung defekt (andere Bedeutung)
    - id: third_row_harness
      likelihood: medium
      label:
        en: Harness to the right third-row seat strained by seat folding
        de: Kabelbaum zum rechten Sitz der dritten Reihe durch Umklappen belastet
    - id: limiter_squib_fault
      likelihood: low
      label:
        en: Internal fault of the right third-row limiter squib
        de: Interner Fehler der Zündpille am rechten Begrenzer der dritten Reihe
  symptoms:
