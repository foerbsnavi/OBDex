- code: B0074
  category: body
  title:
    en: Second Row Center Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer zweite Reihe Mitte Auslösesteuerung
  description:
    en: "B0074 would flag the firing loop of a pretensioner at the second row's middle seat. Rear centre belts with their own pretensioner are rare; IIHS rear-seat tests concentrate on the outboard positions, and no carmaker publishes B0074 with the J2012 meaning. The code is common in GM vehicles, but with an older meaning: the 2011 Saab 9-4X sets B0074 00/04 when the passenger presence module loses its seat sensor mat, GM's Impala bulletin PIE0485A (2015–2018) covers B0074-0D, and campaign N182188910 for the 2017 Buick Verano ties B0074 0D/0E to a pinched presence sensor wire that suppresses the passenger airbag. In a GM vehicle, B0074 therefore points to the front passenger seat sensing, not a rear belt. Where the code does mean a rear centre pretensioner, the airbag lamp is on and that unit is inactive."
    de: "B0074 stünde für den Auslösekreis eines Gurtstraffers am Mittelplatz der zweiten Reihe. Eigene Straffer für den hinteren Mittelgurt sind selten; die Rücksitz-Crashtests des IIHS betrachten die Außenplätze, und kein Hersteller veröffentlicht B0074 mit der J2012-Bedeutung. Häufig ist der Code bei GM, aber in älterer Belegung: Der Saab 9-4X (2011) setzt B0074 00/04, wenn das Modul der Sitzbelegungserkennung die Sensormatte verliert, das Impala-Bulletin PIE0485A (2015–2018) behandelt B0074-0D, und die Aktion N182188910 zum Buick Verano 2017 führt B0074 0D/0E auf eine eingeklemmte Leitung der Sitzbelegungserkennung zurück, die den Beifahrerairbag abschaltet. Bei GM führt B0074 also zur Sitzbelegungserkennung vorn rechts. Wo der Code wirklich einen hinteren Mittelstraffer meint, leuchtet die Airbag-Lampe und der Straffer ist außer Funktion."
  affected_components:
    - second_row_center_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_passenger_presence_sensor
      likelihood: high
      label:
        en: On GM vehicles, fault in the passenger presence sensor mat or its pinched wire (older GM meaning)
        de: Bei GM-Fahrzeugen Fehler in der Sensormatte der Sitzbelegungserkennung oder deren eingeklemmter Leitung (ältere GM-Belegung)
    - id: rear_center_connector
      likelihood: medium
      label:
        en: Plug of the rear centre pretensioner disturbed when the bench is folded or removed
        de: Stecker des hinteren Mittelstraffers beim Umklappen oder Ausbau der Rückbank gelöst
    - id: rear_center_harness
      likelihood: low
      label:
        en: Open or short in the harness to the rear centre seat
        de: Unterbrechung oder Kurzschluss in der Leitung zum hinteren Mittelsitz
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On GM vehicles also passenger airbag status shows OFF with an adult seated
      de: Bei GM zusätzlich Beifahrerairbag-Anzeige OFF, obwohl ein Erwachsener sitzt
    - en: "Safety note: restraint parts may be pyrotechnic or part of the airbag control; disconnect the battery, observe the wait time and use a specialist workshop"
      de: "Sicherheitshinweis: Rückhalte-Bauteile können pyrotechnisch sein oder die Airbagsteuerung betreffen – Batterie abklemmen, Wartezeit einhalten, Fachwerkstatt aufsuchen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 900]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B0073, B0075, B007D, B00E5]
  sources:
    - https://saabwisonline.com/9-4x/2011/8-body/airbag-srs/fault-diagnosis-diagnostic-trouble-codes/dtc-b0074
    - https://static.nhtsa.gov/odi/tsbs/2019/MC-10159553-9999.pdf
