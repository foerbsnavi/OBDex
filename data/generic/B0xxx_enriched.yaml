- code: B0046
  category: body
  title:
    en: Left Curtain Deployment Loop Open
    de: Kopfairbag links Auslösekreis unterbrochen
  description:
    en: "B0046 appears in none of the accessible J2012 code lists, which jump from B0043 to B0048, and no carmaker or bulletin uses it publicly, so the code cannot be traced to a vehicle. Its title describes an open firing loop of the left curtain airbag that drops from the roof rail. J2012 normally encodes that fault as B0021 with failure type 13: Mitsubishi stores B0021-13 when the left curtain circuit has been open for 2 seconds, and Mercedes-Benz reads B002113 as an open left windowbag squib. GM's Global A modules report the same fault as B0016 04 for the left roof rail airbag. If B0046 is read, trust the text the scan tool shows. Airbag lamp on."
    de: "B0046 steht in keiner der zugänglichen J2012-Codelisten, die von B0043 direkt zu B0048 springen, und weder ein Hersteller noch ein Bulletin nutzt ihn öffentlich; der Code lässt sich keinem Fahrzeug zuordnen. Sein Titel beschreibt einen unterbrochenen Zündkreis des linken Kopfairbags, der aus dem Dachrahmen herausklappt. J2012 bildet diesen Fehler sonst als B0021 mit Fehlertyp 13 ab: Mitsubishi legt B0021-13 ab, wenn der Kreis des linken Curtain-Airbags 2 Sekunden offen ist, Mercedes-Benz liest B002113 als offene Zündpille des linken Windowbags. Die Global-A-Steuergeräte von GM melden denselben Fehler als B0016 04 beim linken Dachrahmen-Airbag. Wird B0046 ausgelesen, zählt der Klartext des Testers. Airbag-Leuchte an."
  affected_components:
    - left_curtain_airbag
    - srs_roof_wiring
    - srs_control_module
  common_causes:
    - id: curtain_connector
      likelihood: high
      label:
        en: Unplugged or loose curtain airbag connector at the pillar or roof rail
        de: Abgezogener oder lockerer Kopfairbagstecker an Säule oder Dachrahmen
    - id: roof_harness_break
      likelihood: medium
      label:
        en: Broken lead in the roof rail harness, e.g. after headliner work
        de: Gebrochene Leitung im Dachrahmen-Kabelstrang, z. B. nach Arbeiten am Dachhimmel
    - id: curtain_squib_open
      likelihood: low
      label:
        en: Open igniter inside the left curtain airbag
        de: Offener Zünder im linken Kopfairbag
  symptoms:
