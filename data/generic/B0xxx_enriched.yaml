- code: B010D
  category: body
  title:
    en: Camera Washer Actuator D
    de: Kamera-Wascher-Aktuator D
  description:
    en: "B010D covers actuator D. Audi's TSB 2059228/2 (2022) for the 2019–2022 e-tron and 2020–2022 e-tron Sportback shows what a missing check valve does to a rear camera wash: the line empties while driving or when the tailgate opens, the system stops after four activations to save fluid, and four tries are not enough to refill and pressurise it, so the lens stays dirty until the ignition (terminal 15) is switched off and on. The fix adds an inline valve, part 4N0 955 481 A. ARaymond fits such a non-return valve directly into a slim rear camera nozzle in a tailgate handle. Here the driver sees no spray but no fault code; B010D itself points to an electrical fault at actuator D, whose camera assignment is not published by any maker."
    de: "B010D betrifft Aktor D. Audis TSB 2059228/2 (2022) zum e-tron 2019–2022 und e-tron Sportback 2020–2022 zeigt, was ein fehlendes Rückschlagventil bei der Heckkamerawäsche bewirkt: Die Leitung läuft während der Fahrt oder beim Öffnen der Heckklappe leer, das System bricht nach vier Betätigungen ab, um Flüssigkeit zu sparen, und vier Versuche reichen nicht, um sie wieder zu füllen und unter Druck zu setzen. Die Linse bleibt dann schmutzig, bis Klemme 15 aus- und wieder eingeschaltet wird. Abhilfe ist ein eingesetztes Ventil, Teil 4N0 955 481 A. ARaymond baut ein solches Rückschlagventil direkt in eine flache Heckkameradüse im Heckklappengriff ein. Dabei kommt kein Strahl, aber auch kein Fehlercode; B010D selbst deutet auf einen elektrischen Fehler an Aktor D, dessen Kamerazuordnung kein Hersteller veröffentlicht."
  affected_components:
    - camera_washer_actuator_d
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: actuator_d_electrical
      likelihood: high
      label:
        en: Pump or valve D open, shorted or drawing abnormal current
        de: Pumpe oder Ventil D unterbrochen, kurzgeschlossen oder mit auffälliger Stromaufnahme
    - id: tailgate_wiring_d
      likelihood: medium
      label:
        en: Wire break where the harness flexes into the tailgate
        de: Aderbruch an der Biegestelle des Kabelbaums zur Heckklappe
    - id: dry_running_pump
      likelihood: low
      label:
        en: Pump damaged by repeatedly running dry on an empty line
        de: Pumpe durch wiederholten Trockenlauf an leerer Leitung beschädigt
  symptoms:
    - en: Camera wash request must be repeated several times before fluid arrives, or nothing arrives
      de: Waschanforderung für die Kamera muss mehrfach wiederholt werden, bis Flüssigkeit kommt, oder es kommt nichts
    - en: Reversing camera stays smeared after the wash function has been used
      de: Rückfahrkamera bleibt nach Nutzung der Waschfunktion verschmiert
