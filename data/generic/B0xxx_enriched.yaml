- code: B001A
  category: body
  title:
    en: Center Frontal Stage 3 Deployment Control
    de: Mittlerer Frontairbag Stufe 3 Auslösesteuerung
  description:
    en: "B001A closes the first-row center frontal series and stands for a third stage of a middle-seat frontal airbag, matching B0003 for the driver and B0012 for the passenger. No carmaker documents it publicly in this sense. At General Motors the number belongs to the anchor-mounted belt pretensioner on the driver side, a second pretensioner at the belt end fitting that works next to the retractor unit coded B0015. Its limits match the other GM squib loops: a pretensioner loop reading beyond 4.2 ohms or beneath 1.4 ohms for two seconds sets the code, as do shorts and opens. GM bulletins report it on the 2009-11 Impala with a pinched or misrouted pretensioner harness (PIC5396A, 15-NA-074) and on Equinox and Traverse 2018 (PIE0438). On GM vehicles look at the lower belt anchor first. The airbag lamp is on."
    de: "B001A schließt die Reihe für den mittleren Frontairbag der ersten Reihe ab und steht für dessen dritte Stufe – analog zu B0003 beim Fahrer und B0012 beim Beifahrer. Kein Hersteller dokumentiert ihn öffentlich in diesem Sinn. Bei General Motors gehört die Nummer zum Endbeschlag-Gurtstraffer des Fahrers, einem zweiten Straffer am unteren Gurtanker neben dem Aufrollstraffer mit Code B0015. Die Grenzen gleichen den übrigen GM-Zündkreisen: Liegt der Strafferkreis zwei Sekunden oberhalb von 4,2 Ohm oder unterhalb von 1,4 Ohm, wird der Code gesetzt, ebenso bei Kurzschluss und Unterbrechung. GM-Bulletins melden ihn beim Impala 2009–11 mit eingeklemmtem oder falsch verlegtem Strafferkabel (PIC5396A, 15-NA-074) und bei Equinox und Traverse 2018 (PIE0438). Bei GM also zuerst am unteren Gurtanker suchen. Die Airbag-Leuchte ist an."
  affected_components:
    - center_frontal_airbag
    - driver_seatbelt_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_anchor_pretensioner_harness
      likelihood: high
      label:
        en: On GM vehicles pinched, misrouted or corroded anchor pretensioner harness
        de: Bei GM eingeklemmtes, falsch verlegtes oder korrodiertes Kabel des Endbeschlagstraffers
    - id: center_airbag_stage3_loop
      likelihood: low
      label:
        en: Fault in the third stage loop of a first-row center frontal airbag (J2012 meaning)
        de: Fehler im Kreis der dritten Stufe eines mittleren Frontairbags der ersten Reihe (J2012-Bedeutung)
    - id: pretensioner_fault
      likelihood: low
      label:
        en: Internal fault in the pretensioner
        de: Innerer Fehler im Gurtstraffer
  symptoms:
