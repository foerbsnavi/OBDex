- code: B0099
  category: body
  title:
    en: Roll Over Sensor
    de: Überschlagsensor
  description:
    en: "B0099 reports a fault in the rollover sensing that decides whether curtain airbags and pretensioners fire when a vehicle tips. Bosch integrates rollover sensors in its base airbag control unit, so the sensor is often part of the module. A Delphi patent shows the principle: roll rate and low-g vertical acceleration give roll angle and rate, which are compared with deploy and no-deploy curves, while a high-g lateral accelerometer acts as a separate arming check. FMVSS 226 requires a monitored readiness indicator where ejection mitigation deploys in a rollover; Karma recalled the 2018 Revero because its rollover sensing was not enabled. FCA uses the code: recall Y79 (2021 Grand Cherokee, 2022 Wagoneer) has technicians check for B0099-96 before reflashing the restraint controller, without defining it. The airbag lamp lights."
    de: "B0099 meldet einen Fehler der Überschlagerkennung, die entscheidet, ob Kopfairbags und Gurtstraffer zünden, wenn ein Fahrzeug kippt. Bosch integriert Überschlagsensoren in sein Basis-Airbag-Steuergerät; der Sensor ist also oft Teil des Moduls. Ein Delphi-Patent zeigt das Prinzip: Drehrate und Vertikalbeschleunigung ergeben Rollwinkel und -rate, die mit Auslöse- und Sperrkurven verglichen werden; ein Querbeschleunigungssensor gibt unabhängig frei. FMVSS 226 verlangt eine überwachte Bereitschaftsanzeige, wenn der Schutz gegen Herausschleudern bei Überschlag auslöst; Karma rief den Revero 2018 zurück, weil dessen Überschlagerkennung nicht aktiv war. FCA nutzt den Code: Beim Rückruf Y79 (Grand Cherokee 2021, Wagoneer 2022) prüft die Werkstatt vor dem Neuprogrammieren auf B0099-96, ohne ihn zu erklären. Die Airbag-Leuchte brennt."
  affected_components:
    - rollover_sensor
    - srs_control_module
  common_causes:
    - id: module_internal_sensor
      likelihood: high
      label:
        en: Internal fault of the rollover sensor built into the airbag control unit (module replacement)
        de: Interner Fehler des im Airbag-Steuergerät integrierten Überschlagsensors (Gerätetausch)
    - id: module_mounting
      likelihood: medium
      label:
        en: Airbag unit loose, mounted at an angle or after a crash no longer within its fitting tolerance
        de: Airbag-Steuergerät locker, schräg montiert oder nach einem Unfall außerhalb der Einbaulage
    - id: external_sensor_wiring
      likelihood: low
      label:
        en: Wiring or plug fault where a separate rollover sensor is fitted
        de: Leitungs- oder Steckerfehler, wo ein separater Überschlagsensor verbaut ist
    - id: controller_software
      likelihood: low
      label:
        en: Restraint controller software or configuration not matching the vehicle
        de: Software oder Konfiguration des Rückhalte-Steuergeräts passt nicht zum Fahrzeug
  symptoms:
