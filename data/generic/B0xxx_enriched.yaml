- code: B00D3
  category: body
  title:
    en: Restraint System Malfunction Indicator 2
    de: Rückhaltesystem-Störungsanzeige 2
  description:
    en: "B00D3 refers to a second restraint malfunction indicator. No carmaker documents which lamp that is, so its meaning has to be inferred. One reading is a backup for the main lamp: the 1995 Saab 900 calls its SRS light warning lamp 1 and switches the central warning lamp on for good if that circuit fails. Saturn patented a similar fallback in 1991, using the seat belt lamp as second SIR indicator once a voltage check or photocell shows the airbag lamp is dead, flashing ten times and then glowing for ten minutes, or flashing constantly. Another reading is a separate telltale, since FMVSS 101 names a side air bag malfunction lamp besides the main airbag lamp. In either case B00D3 reports a fault in that second display circuit, not in the airbags themselves."
    de: "B00D3 verweist auf eine zweite Störungsanzeige des Rückhaltesystems. Kein Hersteller dokumentiert, welche Leuchte das ist, die Bedeutung muss also erschlossen werden. Eine Lesart ist ein Ersatz für die Hauptleuchte: Der Saab 900 von 1995 nennt seine SRS-Leuchte Warnleuchte 1 und schaltet bei einem Fehler in deren Kreis die Zentralwarnleuchte dauerhaft ein. Saturn patentierte 1991 eine ähnliche Rückfallebene und nutzt die Gurtwarnleuchte als zweite SIR-Anzeige, sobald eine Spannungsprüfung oder Fotozelle den Ausfall der Airbag-Leuchte zeigt: zehnmal blinken, dann zehn Minuten Dauerlicht, oder ständiges Blinken. Möglich ist auch eine eigene Kontrollleuchte, denn FMVSS 101 kennt neben der Airbag-Leuchte eine für Seitenairbag-Störungen. In beiden Fällen meldet B00D3 einen Fehler in diesem zweiten Anzeigekreis, nicht in den Airbags selbst."
  affected_components:
    - srs_indicator_2
    - instrument_cluster
    - srs_control_module
  common_causes:
    - id: indicator_2_circuit
      likelihood: high
      label:
        en: Open or shorted circuit to the second restraint indicator
        de: Unterbrochene oder kurzgeschlossene Leitung zur zweiten Rückhalte-Anzeige
    - id: indicator_2_lamp
      likelihood: medium
      label:
        en: Second indicator lamp or LED failed
        de: Zweite Anzeigeleuchte bzw. LED ausgefallen
    - id: configuration_mismatch
      likelihood: low
      label:
        en: Restraint module or cluster configured for an indicator the vehicle does not have
        de: Rückhaltesteuergerät oder Kombiinstrument auf eine nicht vorhandene Anzeige konfiguriert
  symptoms:
    - en: Airbag lamp on, second indicator dark or not doing its bulb check
      de: Airbag-Leuchte an, zweite Anzeige dunkel oder ohne Lampenprobe
    - en: Backup warning missing if the main airbag lamp also fails
      de: Ersatzwarnung fehlt, falls auch die Hauptleuchte ausfällt
    - en: "Safety note: restraint warnings incomplete; work on cluster and wiring only de-energised (ignition off, battery off, wait time), specialist workshop only"
      de: "Sicherheitshinweis: Rückhalte-Warnungen unvollständig; an Kombiinstrument und Leitungen nur spannungsfrei arbeiten (Zündung aus, Batterie ab, Wartezeit), nur Fachwerkstatt"
