- code: B0098
  category: body
  title:
    en: Right Side Restraints Sensor 3
    de: Seitencrashsensor rechts 3
  description:
    en: B0098 belongs to the third right-side crash sensor. In Mitsubishi's airbag index it is the C-PILLAR SAT SEN RH, given with the J2012 wording Right Side Restraints Sensor 3. The full set of nine subtypes applies, each set two seconds after detection with the ignition on; beside the usual short to ground (-11), configuration mismatch (-55) and lost communication (-81), the list covers a short to supply (-12), an open line (-88), an offset error (-28) and a reset fault (-93). A sensor this far back sees impacts on the rear door and rear seat area early. Continental's gSAT reports acceleration from rigid structure for such tasks. FCA uses its own code B2765 for the right C-pillar sensor of the Ram 1500, while the Saab 9-3 airbag module uses B0098 to flag that its passenger presence system has failed in general. The airbag lamp lights.
    de: B0098 gehört zum dritten Crashsensor rechts, im Airbag-Index von Mitsubishi der C-PILLAR SAT SEN RH mit dem J2012-Wortlaut Right Side Restraints Sensor 3. Es gilt der volle Satz von neun Untertypen, jeweils zwei Sekunden nach dem Erkennen bei Zündung an gesetzt; neben Masseschluss (-11), unpassender Konfiguration (-55) und Kommunikationsausfall (-81) stehen Schluss nach Plus (-12), Unterbrechung (-88), Nullpunktfehler (-28) und Reset-Fehler (-93) darin. Ein so weit hinten montierter Sensor bemerkt Treffer an Hintertür und Fondbereich früh; Continentals gSAT liefert dafür Beschleunigungswerte aus steifer Struktur. FCA nutzt für den rechten C-Säulen-Sensor des Ram 1500 den eigenen Code B2765, und das Saab-9-3-Airbagmodul meldet mit B0098, dass die Beifahrer-Präsenzerkennung insgesamt gestört ist. Die Airbag-Leuchte geht an.
  affected_components:
    - right_side_impact_sensor_3
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: c_pillar_harness_fault
      likelihood: high
      label:
        en: Open or shorted line or poor contact at the right C-pillar plug (subtypes -11/-12/-88/-81)
        de: Unterbrochene oder kurzgeschlossene Leitung oder schlechter Kontakt am rechten C-Säulen-Stecker (Untertypen -11/-12/-88/-81)
    - id: c_pillar_sensor_fault
      likelihood: medium
      label:
        en: Internal fault of the right C-pillar sensor, e.g. offset or reset error (subtypes -28/-93)
        de: Interner Fehler des rechten C-Säulen-Sensors, z. B. Nullpunkt- oder Reset-Fehler (Untertypen -28/-93)
    - id: module_configuration
