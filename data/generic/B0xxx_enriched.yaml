- code: B010B
  category: body
  title:
    en: Camera Washer Actuator B
    de: Kamera-Reinigungsaktuator B
  description:
    en: Fault on camera washer actuator B. Such an actuator is usually a small solenoid valve or a dedicated pump outlet that releases washer fluid to the nozzle of one camera, for example a rear-view, surround-view or driver-assistance camera; the letter only tells which actuator the manufacturer assigned to which camera. When it fails, that lens can no longer be rinsed on demand, and dirt on it can blur the image or make the systems that rely on the camera switch off.
    de: Fehler am Kamera-Reinigungsaktuator B. Ein solcher Aktuator ist meist ein kleines Magnetventil oder ein eigener Pumpenausgang, der Waschflüssigkeit zur Düse einer einzelnen Kamera freigibt, etwa einer Rückfahr-, Rundumsicht- oder Assistenzkamera; der Buchstabe gibt nur an, welchen Aktuator der Hersteller welcher Kamera zugeordnet hat. Fällt er aus, lässt sich diese Linse nicht mehr gezielt spülen, und Schmutz darauf kann das Bild verschleiern oder die Systeme abschalten, die auf die Kamera angewiesen sind.
  affected_components:
    - camera_washer_actuator_b
    - actuator_wiring
  common_causes:
    - id: actuator_failed
      likelihood: high
      label:
        en: Washer actuator failed
        de: Reinigungsaktuator defekt
    - id: wiring_fault
      likelihood: medium
      label:
        en: Open or shorted actuator wiring, or corroded connector
        de: Unterbrochene oder kurzgeschlossene Aktuatorleitung oder korrodierter Stecker
    - id: nozzle_line_blocked
      likelihood: low
      label:
        en: Blocked or frozen nozzle or supply hose
        de: Verstopfte oder eingefrorene Düse oder Zuleitung
  symptoms:
    - en: Camera lens is not cleaned when washing is requested
      de: Kameralinse wird bei Waschanforderung nicht gereinigt
    - en: Blurred or obstructed camera image
      de: Unscharfes oder verdecktes Kamerabild
    - en: Message that a camera is blocked or a driver-assistance function is unavailable
      de: Meldung, dass eine Kamera verdeckt oder eine Assistenzfunktion nicht verfügbar ist
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [100, 600]
    estimated_hours: [0.5, 2]
  flags:
    mil: true
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B010A, B010C, B010D, B010E, B010F, B0111, B0112, B0113, B0114, B0115, B0116, B0117]
  sources:
    - https://github.com/Wal33D/dtc-database
    - https://en.wikipedia.org/wiki/Advanced_driver-assistance_system
