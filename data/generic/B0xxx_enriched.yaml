      de: Kopfairbags und Gurtstraffer lösen bei einem Überschlag womöglich nicht aus
    - en: "Safety note: airbag control unit with rollover sensing; work only de-energised (battery off, wait time) at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-Steuergerät mit Überschlagerkennung; nur spannungsfrei (Batterie ab, Wartezeit) in einer Fachwerkstatt bearbeiten"
