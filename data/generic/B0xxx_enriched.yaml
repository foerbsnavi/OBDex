- code: B0081
  category: body
  title:
    en: First Row Center Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer erste Reihe Mitte Auslösesteuerung
  description:
    en: "B0081 is assigned to a squib-switched limiter for the centre place of a three-across front bench. No carmaker publishes the code with this meaning. Mercedes-Benz files a first-row centre tensioning retractor under its own code B1B36, and NHTSA's 2013 study notes that load limiters became universal only at the two outer front seats. In practice the number almost always carries a GM meaning: on Global A cars such as the Saab 9-4X it means a passenger presence module fault (00) or a wrong module fitted (3A), with the passenger airbag disabled; GM special coverage N182188910 (2017 Buick Verano) and bulletin PIE0407B (Impala) deal with it. Saab 9-3 and 9-5 airbag modules use B0081 for a wrong passenger-side B-pillar or side sensor. Check the make before suspecting a belt."
    de: "B0081 gehört zu einem umschaltbaren Kraftbegrenzer am Mittelsitz einer dreisitzigen Vorderbank. Kein Hersteller veröffentlicht den Code in dieser Bedeutung. Mercedes-Benz legt einen Gurtstraffer-Aufroller in der Mitte der ersten Reihe unter dem eigenen Code B1B36 ab, und die NHTSA-Studie von 2013 hält fest, dass Kraftbegrenzer nur an den beiden äußeren Vordersitzen Standard wurden. Meist trägt die Nummer eine GM-Bedeutung: Bei Global-A-Fahrzeugen wie dem Saab 9-4X steht sie für einen Fehler des Beifahrer-Präsenzmoduls (00) oder ein falsch verbautes Modul (3A), der Beifahrerairbag wird abgeschaltet; dazu gibt es die Sonderkulanz N182188910 (Buick Verano 2017) und PIE0407B (Impala). Saab 9-3/9-5 melden damit einen falschen Seitensensor rechts. Erst die Marke klären."
  affected_components:
    - first_row_center_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_passenger_presence_module
      likelihood: high
      label:
        en: On GM vehicles, fault or mismatch of the passenger presence module in the seat (different meaning)
        de: Bei GM Fehler oder falsche Ausführung des Beifahrer-Präsenzmoduls im Sitz (andere Bedeutung)
    - id: centre_seat_wiring
      likelihood: medium
      label:
        en: Wiring to a centre front seat retractor damaged in the seat base
        de: Leitung zum Aufroller des vorderen Mittelsitzes im Sitzunterbau beschädigt
    - id: limiter_squib_fault
      likelihood: low
      label:
        en: Internal fault of the centre seat load limiter squib
        de: Interner Fehler der Zündpille am Kraftbegrenzer des Mittelsitzes
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On GM vehicles the passenger airbag status shows OFF although an adult is seated
      de: Bei GM zeigt die Beifahrerairbag-Anzeige AUS, obwohl ein Erwachsener sitzt
    - en: "Safety note: airbag system with pyrotechnic parts; diagnose and repair only de-energised at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System mit pyrotechnischen Bauteilen; nur spannungsfrei in einer Fachwerkstatt prüfen und instand setzen"
