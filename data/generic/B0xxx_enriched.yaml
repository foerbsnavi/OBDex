        de: Kommunikation mit dem vierten Sensor rechts durch Leitung, Stecker oder Sensor gestört
    - id: satellite_fault
      likelihood: medium
      label:
        en: Internal fault of the fourth right crash satellite
        de: Interner Fehler des vierten rechten Crash-Satelliten
    - id: module_configuration
      likelihood: low
      label:
