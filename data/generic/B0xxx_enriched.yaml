- code: B0113
  category: body
  title:
    en: Camera Washer Actuator K
    de: Kamera-Wascher-Aktuator K
  description:
    en: "B0113 names actuator K. Even a working actuator is useless if the jet misses the lens. Stellantis TSB 23-049-22 Rev. A for 2022–2023 Jeep Grand Cherokee (WL) built between 13 April and 15 September 2022 found the liftgate nozzle of the digital rearview mirror camera pointing the wrong way; it is unclipped, turned 180 degrees and refitted, after which the mirror is reset by holding its plus and minus buttons for about 15 s. Bowles' application US20140060582A1 explains the geometry: a nozzle offset roughly 10 to 30 mm beside the lens, aimed within about 1 to 20 degrees of its surface and kept out of the field of view. A misaimed jet sets no code; B0113 concerns the actuator circuit, for a camera that is not published."
    de: "B0113 bezeichnet Aktor K. Selbst ein funktionierender Aktor nützt nichts, wenn der Strahl die Linse verfehlt. Das Stellantis-TSB 23-049-22 Rev. A zum Jeep Grand Cherokee (WL) 2022–2023, gebaut zwischen 13. April und 15. September 2022, fand die Heckklappendüse der Kamera des digitalen Innenspiegels falsch ausgerichtet; sie wird ausgeclipst, um 180 Grad gedreht und wieder eingesetzt, danach wird der Spiegel durch etwa 15 s Halten seiner Plus- und Minustaste zurückgesetzt. Bowles' Anmeldung US20140060582A1 erklärt die Geometrie: Die Düse sitzt rund 10 bis 30 mm seitlich der Linse, zielt in etwa 1 bis 20 Grad zu deren Oberfläche und bleibt außerhalb des Bildfelds. Ein schief zielender Strahl setzt keinen Code; B0113 betrifft den Stromkreis des Aktors einer nicht veröffentlichten Kamera."
  affected_components:
    - camera_washer_actuator_k
    - rear_camera
    - actuator_wiring
  common_causes:
    - id: actuator_k_circuit
      likelihood: high
      label:
        en: Open or short in the circuit of valve or pump K
        de: Unterbrechung oder Kurzschluss im Stromkreis von Ventil oder Pumpe K
    - id: liftgate_wiring_k
      likelihood: medium
      label:
        en: Wire fatigue in the liftgate hinge area
        de: Ermüdete Leitung im Bereich der Heckklappenscharniere
    - id: camera_refit_k
      likelihood: low
      label:
        en: Plug not reconnected after the camera or nozzle was removed
        de: Stecker nach Aus- und Einbau von Kamera oder Düse nicht wieder aufgesteckt
  symptoms:
    - en: Camera wash does not run for the camera served by actuator K
      de: Kamerawäsche läuft für die von Aktor K versorgte Kamera nicht
    - en: Digital mirror or reversing picture stays dirty after the wash is requested
      de: Digitaler Spiegel oder Rückfahrbild bleibt nach Waschanforderung verschmutzt
  repair:
