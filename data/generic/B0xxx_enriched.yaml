- code: B0030
  category: body
  title:
    en: Second Row Left Side Airbag Deployment Control
    de: Seitenairbag zweite Sitzreihe links Auslösesteuerung
  description:
    en: "In J2012 the B003x block covers the second seat row, and B0030 is the left rear side airbag, mounted in the rear door or the outer backrest. Mitsubishi files B0030 under the rear side airbag module LH and sets a short to another circuit after 2 seconds. Mercedes-Benz reads B003013 as an open squib in the left rear sidebag on the A-Class, CLA and GLB, often caused by higher contact resistance at the restraint unit connector (LI54.21-P-070658). The older GM numbering differs: on the 2006 Saab 9-5, B0030 is a passenger side airbag loop whose pin voltage is above 4.1 or below 1.0 volts for 2 seconds, and the Saab 9-3 reads it as a passenger side bag short. The right-hand rear twin is B0038. Airbag lamp on."
    de: "Bei J2012 umfasst der Block B003x die zweite Sitzreihe; B0030 ist der linke hintere Seitenairbag in der Fondtür oder der äußeren Rücklehne. Mitsubishi ordnet B0030 dem hinteren linken Seitenairbagmodul zu und setzt einen Schluss zu einem anderen Kreis nach 2 Sekunden. Mercedes-Benz deutet B003013 an A-Klasse, CLA und GLB als unterbrochene Zündpille im linken Fond-Sidebag, häufig wegen zu hohen Kontaktwiderstands an der Steuergeräte-Steckverbindung (LI54.21-P-070658). Die ältere GM-Nummerierung weicht ab: Beim Saab 9-5 von 2006 ist B0030 ein Kreis des Beifahrer-Seitenairbags, dessen Pinspannung 2 Sekunden lang außerhalb 1,0 bis 4,1 Volt liegt, beim Saab 9-3 ein Kurzschluss dort. Das rechte Gegenstück hinten ist B0038. Airbag-Leuchte an."
  affected_components:
    - second_row_left_side_airbag
    - srs_control_module
    - srs_wiring
  common_causes:
    - id: connector_resistance
      likelihood: high
      label:
        en: Raised contact resistance at the restraint module or rear side airbag connector
        de: Erhöhter Übergangswiderstand am Steuergeräte- oder Fond-Seitenairbagstecker
    - id: rear_door_or_seat_harness
      likelihood: medium
      label:
        en: Damaged lead in the rear door transition or rear seat backrest
        de: Beschädigte Leitung im Fondtürübergang oder in der Rücklehne
    - id: side_airbag_fault
      likelihood: low
      label:
        en: Internal fault in the rear left side airbag module
        de: Innerer Fehler im hinteren linken Seitenairbagmodul
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Rear left side airbag may not deploy in a side impact
      de: Hinterer linker Seitenairbag löst bei einem Seitenaufprall eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
