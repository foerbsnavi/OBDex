- code: B0028
  category: body
  title:
    en: Right Side Airbag Deployment Control
    de: Seitenairbag rechts Auslösesteuerung
  description:
    en: "B0028 is the right-hand twin of B0020: the firing loop of the right front side airbag, normally in the outer flank of the passenger seat. Honda asked for parts from 2018-20 Accord and CR-V and from the 2015 TLX that stored B0028-13, an open or raised resistance in the passenger side airbag inflator. FCA traces B0028-13 on the Cherokee and Chrysler 200 to the jumper harness in the seat, and Toyota's 2022 Tundra stored B002811 or B002812 because the wireless phone charger disturbed the module. Mitsubishi confirms a short to ground after 2 seconds. The older GM numbering differs: the 2006 Saab 9-5 and the 9-3 used B0028 for low resistance in the passenger side bag loop, under 1.5 ohms. Airbag lamp on."
    de: "B0028 ist das rechte Gegenstück zu B0020: der Zündkreis des rechten vorderen Seitenairbags, meist in der äußeren Wange des Beifahrersitzes. Honda forderte Teile von Accord und CR-V 2018–20 sowie vom TLX 2015 mit B0028-13 an, also offenem oder erhöhtem Widerstand im Gasgenerator des Beifahrer-Seitenairbags. FCA führt B0028-13 bei Cherokee und Chrysler 200 auf das Zwischenkabel im Sitz zurück, und beim Toyota Tundra 2022 entstanden B002811 oder B002812, weil das kabellose Ladefach das Steuergerät störte. Mitsubishi bestätigt einen Masseschluss nach 2 Sekunden. Die ältere GM-Nummerierung weicht ab: Saab 9-5 (2006) und 9-3 meinen mit B0028 zu niedrigen Widerstand unter 1,5 Ohm im Kreis des Beifahrer-Seitenairbags. Airbag-Leuchte an."
  affected_components:
    - right_side_airbag_module
    - srs_control_module
    - srs_seat_wiring
    - seat_harness_connector
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Poor contact or corrosion at the side airbag connector or jumper harness under or in the seat
