- code: B0095
  category: body
  title:
    en: Right Frontal Restraints Sensor
    de: Crashsensor vorne rechts
  description:
    en: "B0095 is the right-hand partner of B0090: an acceleration satellite in the right front crumple zone that lets the airbag module judge early how severe a frontal hit is. Honda's Fit and HR-V of model years 2016–2017 use the code this way, B0095-87 meaning the right front impact sensor sends nothing; in request AER17060A Honda asked dealers to report such cars before any repair. On the Ram 1500, FCA stores B0095-49 for an internal electronic failure of the right frontal acceleration sensor. STAR case S2408000050 traces repeat faults to a replacement sensor whose part number does not suit the restraint controller, and TSB 08-150-26 reprograms the controller on 2025 trucks. Mitsubishi once recalled Lancers because salty water could corrode the front impact sensors. With B0095 set, the airbag lamp is lit."
    de: "B0095 ist das rechte Gegenstück zu B0090: ein Beschleunigungs-Satellit in der rechten vorderen Knautschzone, mit dem das Airbag-Steuergerät früh abschätzt, wie schwer ein Frontaufprall ist. Honda nutzt den Code so bei Fit und HR-V 2016–2017: B0095-87 heißt, vom rechten Frontaufprallsensor kommt kein Signal; mit AER17060A bat Honda, solche Autos vor jeder Reparatur zu melden. Beim Ram 1500 legt FCA B0095-49 für einen inneren Elektronikfehler des rechten Front-Beschleunigungssensors ab. Der STAR-Fall S2408000050 führt Wiederholfehler auf einen Ersatzsensor zurück, dessen Teilenummer nicht zum Rückhalte-Steuergerät passt; TSB 08-150-26 programmiert das Steuergerät beim Modelljahr 2025 neu. Mitsubishi rief einst Lancer zurück, weil Salzwasser die Frontsensoren korrodierte. Die Airbag-Leuchte brennt."
  affected_components:
    - right_front_crash_sensor
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sensor_part_mismatch
      likelihood: high
      label:
        en: Replacement sensor part number not matching the restraint controller (FCA S2408000050)
        de: Teilenummer des Ersatzsensors passt nicht zum Rückhalte-Steuergerät (FCA S2408000050)
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Water or road salt in the sensor housing or plug at the right front
        de: Wasser oder Streusalz im Sensorgehäuse oder Stecker vorne rechts
    - id: controller_software
      likelihood: medium
      label:
        en: Restraint controller software needing a reflash (FCA TSB 08-150-26)
        de: Software des Rückhalte-Steuergeräts muss neu aufgespielt werden (FCA TSB 08-150-26)
    - id: right_front_sensor_fault
      likelihood: low
      label:
        en: Internal failure of the right front acceleration sensor
        de: Innerer Defekt des rechten Front-Beschleunigungssensors
  symptoms:
    - en: Airbag warning lamp on, often after front-end repair
      de: Airbag-Warnleuchte an, oft nach einer Frontreparatur
    - en: Frontal impacts on the right are judged later or less precisely
      de: Frontaufpralle rechts werden später oder ungenauer bewertet
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before touching the sensor, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten am Sensor Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
