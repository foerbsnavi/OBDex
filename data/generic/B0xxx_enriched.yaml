- code: B0005
  category: body
  title:
    en: Collapsible Steering Column Deployment Control
    de: Zusammenschiebbare Lenksäule Auslösesteuerung
  description:
    en: Some steering columns can change how much energy they soak up while collapsing in a frontal crash. In a Delphi/Nexteer patent a controller fires pyrotechnic actuators that force an absorber strap into a tighter path or couple in extra absorbers, matching the column to driver size and crash severity. B0005 is the restraint module code for the firing loop of such an actuator. Land Rover documents B0005-56, an invalid or incompatible configuration, on the Evoque from 2018 when a replacement restraints control module had received older software than the factory level; a manual patch of the diagnostic equipment fixes it (SSM 74577). FMVSS 204 caps rearward column travel at 127 mm when the car hits a barrier at 48 km/h. With the loop faulted, the column keeps its fixed default behaviour and the airbag lamp is on.
    de: Manche Lenksäulen können verändern, wie viel Energie sie beim Zusammenschieben im Frontalaufprall aufnehmen. In einem Delphi/Nexteer-Patent zündet ein Steuergerät pyrotechnische Aktoren, die einen Absorberstreifen in eine engere Bahn zwingen oder weitere Absorber zuschalten – passend zu Fahrergröße und Unfallschwere. B0005 ist der Code des Airbagsteuergeräts für den Zündkreis eines solchen Aktors. Land Rover belegt B0005-56 (Konfiguration ungültig oder unpassend) beim Evoque ab 2018, wenn ein Ersatz-Steuergerät ältere Software als ab Werk erhalten hatte; ein manueller Patch des Diagnosegeräts behebt das (SSM 74577). FMVSS 204 begrenzt den Rückweg der Säule im 48-km/h-Barrierentest auf 127 mm. Bei gestörtem Kreis bleibt die Säule im festen Grundverhalten, die Airbag-Leuchte ist an.
  affected_components:
    - collapsible_steering_column
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: rcm_configuration
      likelihood: high
      label:
        en: Restraint module configuration or software does not match the vehicle (Land Rover SSM 74577)
        de: Konfiguration oder Software des Airbagsteuergeräts passt nicht zum Fahrzeug (Land Rover SSM 74577)
    - id: column_actuator_circuit
      likelihood: medium
      label:
        en: Open or shorted lead to the pyrotechnic column actuator
        de: Unterbrochene oder kurzgeschlossene Leitung zum pyrotechnischen Lenksäulenaktor
    - id: column_actuator_fault
      likelihood: low
      label:
        en: Faulty actuator in the steering column
        de: Defekter Aktor in der Lenksäule
  symptoms:
