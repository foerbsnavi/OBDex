        de: Schmutz oder Eis im Behälter stört die Messung
  symptoms:
    - en: Refill request or cleaning-system warning without obvious reason
      de: Aufforderung zum Nachfüllen oder Warnung der Reinigungsanlage ohne erkennbaren Grund
    - en: Sensor cleaning may be withheld, and assistance functions may restrict themselves when sensors get dirty
      de: Sensorreinigung bleibt eventuell aus, Assistenzfunktionen schränken sich bei verschmutzten Sensoren ein
