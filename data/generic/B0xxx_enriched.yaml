    - en: "Safety note: pyrotechnic device – disconnect the battery and wait before touching it; have it serviced at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Bauteil – vor dem Anfassen Batterie abklemmen und warten; Wartung in einer Fachwerkstatt"
