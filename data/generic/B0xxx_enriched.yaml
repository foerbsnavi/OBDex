- code: B0012
  category: body
  title:
    en: Passenger Frontal Stage 3 Deployment Control
    de: Beifahrer-Frontairbag Stufe 3 Auslösesteuerung
  description:
    en: In the J2012 order B0012 is the third element of the front passenger airbag. Mercedes-Benz uses B001213 for the squib of the vent valve in that airbag, and Mitsubishi lists B0012 as passenger airbag module 3. GM gives the number a different meaning. Its later sensing and diagnostic modules assign B0012 to stage 1 of the steering wheel airbag; the Saab 9-4X 2011 manual trips it after two seconds of contact with supply or ground, an open, more than 4.4 ohms or less than 1.7 ohms; GM bulletins link it to chafed coil wires on the 2009 Cobalt and to weak terminal tension at the coil connector on the 2015 CTS. Older Saab 9-3 modules used B0012 for low resistance in the passenger stage 2 loop. Read the code with the maker's tool before choosing which airbag to check.
    de: "In der J2012-Reihenfolge ist B0012 das dritte Element des Beifahrer-Frontairbags. Mercedes-Benz nutzt B001213 für die Zündpille des Abströmventils dieses Airbags, Mitsubishi führt B0012 als Beifahrerairbagmodul 3. GM belegt die Nummer anders: Seine neueren Airbagsteuergeräte ordnen B0012 der Stufe 1 des Lenkradairbags zu; laut Handbuch des Saab 9-4X 2011 genügen zwei Sekunden Kontakt zu Plus oder Masse, eine Unterbrechung, mehr als 4,4 oder weniger als 1,7 Ohm. GM-Bulletins verbinden ihn mit durchgescheuerten Wickelfederleitungen im Cobalt 2009 und zu geringer Kontaktkraft am Wickelfederstecker im CTS 2015. Ältere Saab-9-3-Steuergeräte meldeten mit B0012 einen zu kleinen Widerstand im Beifahrerkreis Stufe 2. Vor der Suche den Code mit dem Herstellertester einordnen."
  affected_components:
    - passenger_airbag_module
    - driver_airbag_module
    - clock_spring
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: vent_squib_circuit
      likelihood: medium
      label:
        en: Open or shorted third squib (vent valve) in the passenger airbag (J2012 meaning)
        de: Dritte Zündpille (Abströmventil) im Beifahrerairbag unterbrochen oder kurzgeschlossen (J2012-Bedeutung)
    - id: gm_coil_connector
      likelihood: high
      label:
        en: On GM vehicles weak terminal tension or chafed wires at the steering wheel airbag coil
        de: Bei GM zu geringe Kontaktkraft oder durchgescheuerte Leitungen an der Lenkrad-Wickelfeder
    - id: srs_module_fault
      likelihood: low
      label:
        en: Restraint control module fault
        de: Fehler im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Depending on maker, passenger airbag venting or GM driver airbag stage 1 affected
      de: Je nach Hersteller Abströmsteuerung des Beifahrerairbags oder bei GM Fahrerairbag Stufe 1 betroffen
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
