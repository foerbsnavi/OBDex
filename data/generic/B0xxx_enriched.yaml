- code: B00D5
  category: body
  title:
    en: Restraint System Passenger Disable Indicator
    de: Anzeige Beifahrer-Rückhaltesystem deaktiviert
  description:
    en: "B00D5 concerns the lamp that tells the front occupants the passenger airbag is off. FMVSS 208 wants it yellow, worded PASSENGER AIR BAG OFF (short form PASS AIR BAG OFF) and separate from the readiness lamp; Ford's 2014 F-150 places it by the radio and lights it briefly at start as a self-test. Mitsubishi defines the code in its 2022 airbag index as PASS A/B INDICATOR: subtype -11 for a short to ground, -12 for a short to power and -13 for an open circuit, each checked with the ignition on and set after 2 s; harness, the indicator itself or the airbag control unit are listed as causes. Ford logged B00D5:01 in the restraint module of 2021 Edge and Nautilus among network faults, cured by updating the gateway module. Occupants may be misled about the airbag."
    de: "B00D5 betrifft die Leuchte, die den Vorderinsassen anzeigt, dass der Beifahrerairbag aus ist. FMVSS 208 verlangt sie gelb, beschriftet mit PASSENGER AIR BAG OFF oder PASS AIR BAG OFF und getrennt von der Bereitschaftsleuchte; Fords F-150 von 2014 setzt sie neben das Radio und lässt sie beim Start kurz zur Selbstprüfung leuchten. Mitsubishi definiert den Code im Airbag-Index 2022 als PASS A/B INDICATOR: Untertyp -11 für Masseschluss, -12 für Schluss nach Plus und -13 für Unterbrechung, jeweils bei Zündung an geprüft und nach 2 s gesetzt; als Ursachen gelten Kabelbaum, die Anzeige selbst oder das Airbag-Steuergerät. Ford fand B00D5:01 im Rückhaltesteuergerät von Edge und Nautilus 2021 unter Netzwerkfehlern, behoben durch ein Software-Update des Gateway-Moduls. Die Insassen werden womöglich über den Airbagzustand getäuscht."
  affected_components:
    - passenger_disable_indicator
    - srs_control_module
    - srs_wiring
  common_causes:
    - id: indicator_circuit
      likelihood: high
      label:
        en: Indicator lead shorted to ground, shorted to power or open (Mitsubishi -11/-12/-13)
        de: Leitung zur Anzeige mit Masse oder Plus kurzgeschlossen oder unterbrochen (Mitsubishi -11/-12/-13)
    - id: indicator_unit_fault
      likelihood: medium
      label:
        en: Passenger airbag off indicator itself failed
        de: Beifahrerairbag-Aus-Anzeige selbst defekt
    - id: gateway_software
      likelihood: low
      label:
        en: Network or gateway software fault, as on 2021 Ford Edge/Nautilus (SSM 50127)
        de: Netzwerk- bzw. Gateway-Softwarefehler, wie bei Ford Edge/Nautilus 2021 (SSM 50127)
    - id: airbag_unit_fault
      likelihood: low
      label:
        en: Internal fault of the airbag control unit output
        de: Interner Fehler im Ausgang des Airbag-Steuergeräts
  symptoms:
    - en: Passenger airbag off lamp stays dark during the start check or shows the wrong state
      de: Beifahrerairbag-Aus-Leuchte bleibt bei der Startprüfung dunkel oder zeigt den falschen Zustand
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: "Safety note: occupants cannot see whether the passenger airbag is off; do not fit a rear-facing child seat until repaired, wiring only de-energised, specialist workshop"
      de: "Sicherheitshinweis: Insassen sehen nicht, ob der Beifahrerairbag aus ist; bis zur Reparatur keinen rückwärts gerichteten Kindersitz einbauen, Leitungen nur spannungsfrei, Fachwerkstatt"
