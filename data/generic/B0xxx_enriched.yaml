- code: B00C3
  category: body
  title:
    en: Passenger Seat Occupant Classification Sensor D
    de: Beifahrersitz Insassenklassifizierungssensor D
  description:
    en: B00C3 is the fourth passenger seat classification input. No carmaker documents it under this number. Some classification signals are not a weight at all but a frequency, which makes them prone to electrical noise. Tesla reported for 2017–2019 Model 3 cars that the OCS frequency could leave its valid range because of interference on the passenger seat harness, so the airbag symbol appeared on the touchscreen. The first fix added a harness extension with a ferrite filter at the OCS module, which sits under the front of the seat; a later bulletin used a dedicated filter module, each about 0.15 h of labour. Whether a maker files such a signal as D is not known. A stored B00C3 means this input is missing or out of range, and the airbag lamp stays on until the cause is found.
    de: B00C3 ist der vierte Klassifizierungseingang des Beifahrersitzes. Kein Hersteller dokumentiert ihn unter dieser Nummer. Manche Klassifizierungssignale sind kein Gewicht, sondern eine Frequenz und daher anfällig für elektrische Störungen. Tesla meldete für das Model 3 der Jahre 2017–2019, dass die OCS-Frequenz wegen Einstreuungen im Kabelbaum des Beifahrersitzes ihren gültigen Bereich verlassen konnte; das Airbag-Symbol erschien dann auf dem Bildschirm. Abhilfe war zunächst eine Kabelverlängerung mit Ferritfilter am OCS-Modul, das vorn unter dem Sitz sitzt, später ein eigenes Filtermodul, jeweils mit etwa 0,15 h Arbeitszeit. Ob ein Hersteller ein solches Signal als D führt, ist nicht bekannt. Ein gespeicherter B00C3 heißt, dieser Eingang fehlt oder liegt außerhalb des Bereichs; die Airbag-Leuchte bleibt an, bis die Ursache gefunden ist.
  affected_components:
    - passenger_classification_sensor_d
    - srs_seat_wiring
    - occupant_classification_module
  common_causes:
    - id: electrical_interference
      likelihood: medium
      label:
        en: Electrical interference coupled into the seat harness (seat heating, motors, routing near other leads)
        de: Elektrische Einstreuung in den Sitzkabelbaum (Sitzheizung, Motoren, Verlegung neben anderen Leitungen)
    - id: seat_harness_connector
      likelihood: medium
      label:
        en: Harness under tension or plug loose at the classification module when the seat moves
        de: Kabelbaum unter Zug oder Stecker am Klassifizierungsmodul locker, wenn der Sitz verfahren wird
    - id: sensor_d_fault
      likelihood: low
      label:
        en: Internal fault of sensor D or the classification module
        de: Interner Fehler von Sensor D oder Klassifizierungsmodul
  symptoms:
    - en: Airbag warning lamp or airbag symbol on the display
      de: Airbag-Warnleuchte oder Airbag-Symbol im Display
    - en: Fault may depend on seat position or on other electrical loads being switched on
      de: Fehler kann von der Sitzstellung oder von zugeschalteten Verbrauchern abhängen
    - en: "Safety note: occupant classification unreliable; work on seat wiring only de-energised (12 V off, wait time), use the maker's filter or rework kit where one exists, specialist workshop only"
      de: "Sicherheitshinweis: Insassenklassifizierung unzuverlässig; am Sitzkabelbaum nur spannungsfrei arbeiten, vorhandene Filter- oder Nacharbeitssätze des Herstellers verwenden, nur Fachwerkstatt"
