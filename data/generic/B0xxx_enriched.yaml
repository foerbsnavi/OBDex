- code: B0054
  category: body
  title:
    en: Second Row Center Seat Belt Sensor
    de: Gurtsensor zweite Sitzreihe Mitte
  description:
    en: B0054 is reserved for the buckle sensor of the middle seat in the second row. That position often has its buckle in a split bench or under a fold-down armrest, so the lead runs through moving seat parts. The rear warning required by FMVSS 208 S7.5(c) for vehicles made from September 2028 covers every rear designated seat, the middle one included. Ford's patent for rear belt monitoring counts latched belts once the car passes 3 mph with the doors shut and warns only when that count drops, so a passenger who changes seats is not flagged. The sensor itself is usually a Hall switch that detects the steel tongue in the buckle. No carmaker documents B0054 publicly; Mitsubishi's passenger code B0052 shows how such a buckle fault is set.
    de: B0054 ist für den Gurtschlosssensor des Mittelplatzes der zweiten Reihe vorgesehen. Dort sitzt das Schloss oft in einer geteilten Bank oder unter einer klappbaren Mittelarmlehne, die Leitung läuft also durch bewegliche Sitzteile. Die hintere Gurtwarnung nach FMVSS 208 S7.5(c) für Fahrzeuge ab September 2028 umfasst jeden hinteren Sitzplatz, auch den mittleren. Fords Patent zur Gurtüberwachung hinten zählt die eingerasteten Gurte, sobald das Auto bei geschlossenen Türen 3 mph überschreitet, und warnt erst, wenn diese Zahl sinkt – wer nur den Platz wechselt, löst nichts aus. Der Sensor selbst ist meist ein Hallschalter, der die Stahlzunge im Schloss erkennt. Öffentlich dokumentiert kein Hersteller B0054; wie ein solcher Gurtschlossfehler gesetzt wird, zeigt Mitsubishis Beifahrercode B0052.
  affected_components:
