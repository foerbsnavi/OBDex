- code: B0018
  category: body
  title:
    en: Center Frontal Stage 1 Deployment Control
    de: Mittlerer Frontairbag Stufe 1 Auslösesteuerung
  description:
    en: "In the J2012 order of seating positions (driver, passenger, center, then second and third row) B0018 covers stage 1 of a frontal airbag for the middle seat of the first row. FMVSS 208 demands frontal airbags only for the outboard front seats, so such a bag is rare, and no carmaker publicly documents B0018 with this meaning. It is not the GM front center airbag of 2013, which deploys from the inner flank of the driver seat in side impacts (SAE 2013-01-1156). GM did use B0018 itself in older modules: on the Saab 9-5 2006 it reports a voltage out of range in the passenger frontal stage 1 circuit, above 4.1 V or below 1.0 V at module pin 44 for two seconds, and on the Saab 9-3 a short to battery or ground in that loop. Check which module stored the code."
    de: "In der J2012-Reihenfolge der Sitzplätze (Fahrer, Beifahrer, Mitte, dann zweite und dritte Reihe) betrifft B0018 die Stufe 1 eines Frontairbags für den mittleren Platz der ersten Reihe. FMVSS 208 verlangt Frontairbags nur an den äußeren Vordersitzen, solche Airbags sind daher selten, und kein Hersteller dokumentiert B0018 öffentlich in dieser Bedeutung. Gemeint ist nicht der GM-Mittelairbag von 2013, der bei Seitenaufprall aus der Innenseite des Fahrersitzes kommt (SAE 2013-01-1156). GM nutzte B0018 selbst in älteren Steuergeräten: Beim Saab 9-5 2006 meldet er Spannung außerhalb des Bereichs im Beifahrer-Frontkreis Stufe 1, über 4,1 V oder unter 1,0 V an Pin 44 für zwei Sekunden, beim Saab 9-3 Plus- oder Masseschluss in diesem Kreis. Erst klären, welches Steuergerät den Code gespeichert hat."
  affected_components:
    - center_frontal_airbag
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: center_airbag_loop
      likelihood: medium
      label:
        en: Open or shorted stage 1 loop of a first-row center frontal airbag (J2012 meaning)
        de: Kreis Stufe 1 eines mittleren Frontairbags der ersten Reihe unterbrochen oder kurzgeschlossen (J2012-Bedeutung)
    - id: gm_passenger_loop_short
      likelihood: medium
      label:
        en: On older GM/Saab passenger frontal stage 1 loop shorted to battery or ground
        de: Bei älteren GM/Saab Plus- oder Masseschluss im Beifahrer-Frontkreis Stufe 1
    - id: srs_module_fault
      likelihood: low
      label:
        en: Restraint control module fault
        de: Fehler im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Affected frontal airbag stage may not deploy
      de: Betroffene Frontairbag-Stufe löst womöglich nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
