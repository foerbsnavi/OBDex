- code: B0002
  category: body
  title:
    en: Driver Frontal Stage 2 Deployment Control
    de: Fahrer-Frontairbag Stufe 2 Auslösesteuerung
  description:
    en: Dual-stage driver airbags hold a second charge that the restraint module fires only in severe crashes or after a short delay, so the cushion fills harder or for longer; a Nissan patent bases that choice on the change in vehicle speed and belt use. B0002 flags a fault in the firing loop of this second stage. Land Rover documents B0002-13 as an open stage 2 circuit on the Evoque, which also appeared after a module replacement had loaded older software (SSM 74577). Mercedes-Benz, Mitsubishi and FCA list it as the driver squib or module 2, GM as stage 2 of the steering wheel module. Because both stages share connector and clock spring, B0002 often comes together with B0001; alone it points to the stage 2 lead or squib. Adaptive inflation is lost and the airbag lamp is on.
    de: Zweistufige Fahrerairbags tragen eine zweite Ladung, die das Steuergerät nur bei schweren Unfällen oder verzögert zündet, damit das Kissen härter oder länger gefüllt bleibt; ein Nissan-Patent macht das an der Geschwindigkeitsänderung und am Gurtstatus fest. B0002 meldet einen Fehler im Zündkreis dieser zweiten Stufe. Land Rover beschreibt B0002-13 beim Evoque als offenen Stufe-2-Kreis, der auch nach einem Steuergerätetausch mit zu alter Software auftrat (SSM 74577). Mercedes-Benz, Mitsubishi und FCA führen ihn als Zündpille bzw. Modul 2 des Fahrers, GM als Lenkradmodul Stufe 2. Da beide Stufen Stecker und Wickelfeder teilen, steht B0002 oft neben B0001; allein deutet er auf Leitung oder Zündpille der Stufe 2. Die angepasste Füllung entfällt, die Airbag-Leuchte brennt.
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: stage2_squib_open
      likelihood: high
      label:
        en: Open stage 2 squib lead at the airbag module connector
        de: Unterbrochene Zuleitung der Zündpille Stufe 2 am Airbagstecker
    - id: clock_spring_open
      likelihood: medium
      label:
        en: Stage 2 track in the clock spring broken
        de: Leiterbahn der Stufe 2 in der Wickelfeder gerissen
    - id: rcm_software_mismatch
      likelihood: low
      label:
        en: Replacement restraint module loaded with unsuitable software (Land Rover SSM 74577)
        de: Ersatz-Airbagsteuergerät mit unpassender Software bespielt (Land Rover SSM 74577)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver airbag loses its second, high-severity stage
      de: Fahrerairbag verliert die zweite Stufe für schwere Unfälle
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
