- code: B0076
  category: body
  title:
    en: Third Row Left Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer dritte Reihe links Auslösesteuerung
  description:
    en: "B0076 belongs to the pretensioner at the left seat of the third row, a position found only in vehicles with a third seat row. No carmaker publishes B0076 with this meaning. Mercedes shows how third-row units are logged in practice: its LI54.21-P-070658 names open-circuit faults of the emergency tensioning retractors at the left and right of the third seat row as B00E7 and B00E6, the C-stage slots, so a B0076 is not to be expected on those models. The circuit itself is a pyrotechnic squib that the airbag module checks for opens, shorts and resistance drift, as with the front retractor and buckle units GM and NHTSA describe. If B0076 is stored, the airbag lamp is on and the third-row left occupant may not get any pretensioning."
    de: "B0076 gehört zum Gurtstraffer am linken Platz der dritten Sitzreihe, die es nur in Fahrzeugen mit drei Reihen gibt. Kein Hersteller veröffentlicht B0076 in dieser Bedeutung. Wie Straffer der dritten Reihe tatsächlich erfasst werden, zeigt Mercedes: LI54.21-P-070658 führt Unterbrechungen an den Gurtstraffer-Aufrollern links und rechts in der dritten Reihe als B00E7 und B00E6, also auf den Plätzen der Stufe C – auf diesen Modellen ist B0076 nicht zu erwarten. Technisch handelt es sich um eine Zündpille, die das Airbagsteuergerät auf Unterbrechung, Kurzschluss und Widerstandsabweichung überwacht, wie bei den Aufroll- und Schlossstraffern vorn, die GM und NHTSA beschreiben. Ist B0076 gespeichert, leuchtet die Airbag-Lampe, und der Insasse links in der dritten Reihe wird womöglich nicht gestrafft."
  affected_components:
    - third_row_left_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: third_row_connector
      likelihood: high
      label:
        en: Plug at the third-row left belt disturbed by folding or removing the seat
        de: Stecker am linken Gurt der dritten Reihe durch Umklappen oder Ausbau des Sitzes gelöst
    - id: cargo_area_harness
      likelihood: medium
      label:
        en: Harness damaged by luggage or trim work in the cargo area
        de: Leitung durch Gepäck oder Verkleidungsarbeiten im Laderaum beschädigt
    - id: configuration_mismatch
      likelihood: low
      label:
        en: Airbag module coded for a third-row pretensioner that is not fitted
        de: Airbagsteuergerät auf einen nicht verbauten Straffer der dritten Reihe codiert
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Third-row left occupant without pretensioning in a crash
      de: Insasse dritte Reihe links bei einem Unfall ohne Gurtstraffung
    - en: "Safety note: pyrotechnic belt component; disconnect the battery and wait before touching it, repair at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Gurtbauteil – vor dem Anfassen Batterie abklemmen und warten, Reparatur in der Fachwerkstatt"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
