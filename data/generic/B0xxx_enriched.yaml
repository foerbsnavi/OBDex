- code: B0108
  category: body
  title:
    en: LIDAR Washer Actuator C
    de: LIDAR-Wascher-Aktuator C
  description:
    en: B0108 covers lidar washer actuator C. Robotaxis with several lidars, for example on roof and corners, are where a third circuit would fit. Valeo lists a heated telescopic lidar nozzle, a 2021 PACE award finalist, and says it supplies cleaning systems with ECU and software for private cars and robotaxis; a telescopic nozzle adds a moving part that can stick in frost. Solero's 4/3-way valve distributes fluid centrally so fewer DC pumps are needed, meaning actuator C may be a valve position rather than a pump. Jalopnik noted in 2018 that Waymo cleaned its lidar domes with small wipers and that Cruise was building its own cleaning hardware. No manufacturer assigns C publicly or documents B0108.
    de: B0108 betrifft Lidar-Wascheraktor C. Robotaxis mit mehreren Lidars, etwa auf dem Dach und an den Ecken, sind der Ort, wo ein dritter Kreis passt. Valeo führt seine beheizte Teleskopdüse für Lidar (Finalist des PACE Award 2021) und liefert nach eigener Angabe Reinigungssysteme samt Steuergerät und Software für Privatfahrzeuge und Robotaxis; eine Teleskopdüse bringt ein bewegliches Teil mit, das bei Frost klemmen kann. Soleros 4/3-Wegeventil verteilt Flüssigkeit zentral, damit weniger Gleichstrompumpen nötig sind – Aktor C kann also auch eine Ventilstellung statt einer Pumpe sein. Jalopnik berichtete 2018, dass Waymo seine Lidar-Kuppeln mit kleinen Wischern reinigte und Cruise eigene Reinigungstechnik baute. Kein Hersteller vergibt C öffentlich oder dokumentiert B0108.
  affected_components:
