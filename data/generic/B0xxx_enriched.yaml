- code: B003A
  category: body
  title:
    en: Second Row Right Frontal Stage 2 Deployment Control
    de: Frontairbag zweite Sitzreihe rechts Stufe 2 Auslösesteuerung
  description:
    en: B003A covers stage 2 of the right rear-seat frontal airbag. The second charge allows the module to soften or strengthen inflation; for a rear bag this matters because the person behind the front seat may be an adult, a child or a child seat facing either way, a point Mercedes-Benz stressed when it introduced the S-Class rear airbag in 2020. The Mercedes filing for a bag on a sliding front backrest provides separate deployment devices so its chambers can fire one after the other. No vehicle maker documents B003A, and no bulletin with it is on record at NHTSA. A stage 2 code alone suggests the stage 2 wires or igniter rather than the whole bag. Airbag lamp on.
    de: B003A betrifft Stufe 2 des rechten Fond-Frontairbags. Mit der zweiten Ladung kann das Steuergerät das Aufblasen abschwächen oder verstärken; hinten ist das wichtig, weil hinter dem Vordersitz ein Erwachsener, ein Kind oder ein Kindersitz in beliebiger Richtung sitzen kann – darauf wies Mercedes-Benz bei der Vorstellung des S-Klasse-Fondairbags 2020 hin. Die Mercedes-Anmeldung für einen Airbag an einer verschiebbaren Vordersitzlehne sieht eigene Auslöseeinheiten vor, damit die Kammern nacheinander zünden. Kein Fahrzeughersteller dokumentiert B003A, im NHTSA-Bulletinbestand fehlt er. Steht nur ein Stufe-2-Code, liegt der Fehler eher an Leitung oder Zünder dieser Stufe als am ganzen Airbag. Airbag-Leuchte an.
  affected_components:
    - second_row_right_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: stage2_lead
      likelihood: medium
      label:
        en: Open or short only in the stage 2 pair of wires
        de: Unterbrechung oder Schluss nur im Leitungspaar der Stufe 2
    - id: seatback_connector
      likelihood: high
      label:
        en: Loose or corroded connector of the airbag lead routed through the front seat backrest
        de: Lockerer oder korrodierter Stecker der Airbagleitung in der Vordersitzlehne
    - id: rear_airbag_module
      likelihood: medium
      label:
        en: Faulty second igniter in the right rear-seat airbag
        de: Defekter zweiter Zünder im rechten Fond-Airbag
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Rear airbag may not adapt its inflation to the occupant
      de: Fond-Airbag passt sein Aufblasen womöglich nicht an den Insassen an
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
