- code: B012B
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet "E" Circuit/Open
    de: DC/AC-Wandler A Hochvolt-Steckdose „E“ Stromkreis/Unterbrechung
  description:
    en: B012B is the last outlet circuit code, for outlet E. Many trucks combine bed sockets with one in the cabin. Ford's SSM 49562 for the 2021 F-150 with the 7.2 kW system notes that a message about a tripped bed-panel breaker could really come from the breaker above the 120 V outlet in the instrument panel, or from that outlet's connector not being fully plugged in; an over-the-air update corrected the wording. Ford's patent US11043801B2 also lets each socket be switched on its own from the screen or a button. Which outlet E is remains unpublished, and B012B appears in no manufacturer document. Before blaming the converter, check breaker, connector and socket of the outlet concerned.
    de: B012B ist der letzte Steckdosenkreis-Code, für Steckdose E. Viele Pick-ups haben neben den Ladeflächen-Steckdosen eine im Innenraum. Fords SSM 49562 zum F-150 2021 mit 7,2-kW-System weist darauf hin, dass eine Meldung über einen ausgelösten Schutzschalter der Ladefläche in Wahrheit vom Schalter über der 120-V-Steckdose im Armaturenbrett stammen konnte – oder von deren nicht ganz eingerastetem Stecker; ein Software-Update per Funk korrigierte die Anzeige. Fords Patent US11043801B2 erlaubt außerdem, jede Steckdose einzeln über Bildschirm oder Taster zu schalten. Welche Steckdose E ist, bleibt unveröffentlicht; B012B steht in keinem Herstellerdokument. Vor dem Wandler sind Schutzschalter, Stecker und Steckdose des betroffenen Ausgangs zu prüfen.
  affected_components:
    - dc_ac_converter_a
    - hv_outlet_e
  common_causes:
    - id: outlet_e_connector_unplugged
      likelihood: high
      label:
        en: Connector at outlet E not fully engaged, e.g. after dash work
        de: Stecker an Steckdose E nicht ganz eingerastet, etwa nach Arbeiten am Armaturenbrett
    - id: outlet_e_breaker
      likelihood: medium
      label:
        en: Circuit breaker of outlet E tripped or defective
        de: Schutzschalter von Steckdose E ausgelöst oder defekt
    - id: outlet_e_wiring
      likelihood: low
      label:
        en: Wiring between converter and outlet E open
        de: Leitung zwischen Wandler und Steckdose E unterbrochen
  symptoms:
    - en: Socket E dead, possibly with a misleading breaker message for another outlet
      de: Steckdose E tot, eventuell mit irreführender Schutzschalter-Meldung zu einer anderen Steckdose
    - en: Outlet circuits carry 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Steckdosenkreise führen 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
