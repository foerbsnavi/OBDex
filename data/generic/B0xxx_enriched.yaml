- code: B0121
  category: body
  title:
    en: Fluid Reservoir Level Sensor F
    de: Flüssigkeitsbehälter Füllstandssensor F
  description:
    en: "B0121 closes the row with level sensor F. Small local reservoirs are one reason a vehicle might carry six level sensors: Ford's application DE102018109892A1 describes a camera washer with its own container close to the lens, fitted with a buoyant level sensor that signals when the fluid has fallen to a set low point and the container needs topping up. How the result reaches the driver is a separate design question; Mannesmann VDO's patent US6588270B1 even moved the washer level display next to the fuel filler neck so that it is noticed while refuelling. No manufacturer publishes which reservoir F stands for or documents B0121. Driving is not affected, but the washer it watches may run dry unnoticed."
    de: "B0121 schließt die Reihe mit Füllstandssensor F. Kleine Einzelbehälter sind ein Grund, warum ein Fahrzeug sechs Füllstandsgeber haben könnte: Fords Anmeldung DE102018109892A1 beschreibt eine Kamerawäsche mit eigenem Behälter nahe der Linse und einem Schwimmer-Füllstandsgeber, der meldet, wenn die Flüssigkeit eine festgelegte Untergrenze erreicht hat und nachgefüllt werden muss. Wie das Ergebnis beim Fahrer ankommt, ist eine eigene Frage; Mannesmann VDO verlegte im Patent US6588270B1 die Anzeige des Waschwasserstands sogar neben den Tankstutzen, damit sie beim Tanken auffällt. Welchen Behälter F meint, veröffentlicht kein Hersteller, und B0121 dokumentiert niemand. Das Fahren bleibt unberührt, doch die überwachte Wäsche kann unbemerkt leerlaufen."
  affected_components:
    - fluid_reservoir_level_sensor_f
    - sensor_wiring
  common_causes:
    - id: float_f_stuck
      likelihood: high
      label:
        en: Float of sensor F stuck by deposits or ice
        de: Schwimmer von Geber F durch Ablagerungen oder Eis blockiert
    - id: wiring_f_damaged
      likelihood: medium
      label:
        en: Wiring to the small reservoir chafed or connector corroded
        de: Leitung zum Kleinbehälter durchgescheuert oder Stecker korrodiert
    - id: sensor_f_defective
      likelihood: low
      label:
        en: Level sensor F defective
        de: Füllstandsgeber F defekt
  symptoms:
    - en: Missing or permanent refill message for the affected reservoir
      de: Fehlende oder dauerhafte Nachfüllmeldung für den betroffenen Behälter
    - en: Washer served by this reservoir runs dry without warning
      de: Die von diesem Behälter versorgte Wäsche läuft ohne Warnung trocken
