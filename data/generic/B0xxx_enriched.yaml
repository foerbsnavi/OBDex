- code: B00F2
  category: body
  title:
    en: Second Row Left Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt zweite Reihe links Auslösesteuerung
  description:
    en: "B00F2 covers the inflatable belt at the left outer seat of row two, the position where such belts actually reached production. Ford offered them from the 2011 Explorer; its 2018 owner's manual puts the bag into the shoulder part of the belts at both outer seats in row two, filled with cooled gas at lower pressure, deployed in frontal, side and rollover crashes and monitored by the same module and lamp as the front belts. Ford itself logs faults under its own codes B141B/B141C: programme 21B11 (Explorer 2014–2016) traces them to damaged seat harness wires at the rear inflatable belt connector. Mercedes-Benz fits its beltbag to the outer rear seats of the S-Class. Neither publishes B00F2. Airbag lamp on when set."
    de: "B00F2 betrifft den aufblasbaren Gurt am linken Außenplatz der zweiten Reihe – genau dort, wo solche Gurte in Serie kamen. Ford bot sie ab dem Explorer 2011 an; laut Betriebsanleitung 2018 sitzt der Luftsack im Schulterteil der äußeren Gurte der zweiten Reihe, wird mit gekühltem Gas bei geringerem Druck gefüllt, löst bei Frontal-, Seiten- und Überschlagunfällen aus und wird vom selben Steuergerät samt Warnleuchte überwacht wie die Vordergurte. Fehler legt Ford unter eigenen Codes ab (B141B/B141C): Das Programm 21B11 (Explorer 2014–2016) führt sie auf beschädigte Adern im Sitzkabelbaum am Gurtstecker zurück. Mercedes-Benz setzt seinen Beltbag an die äußeren Fondplätze der S-Klasse. B00F2 veröffentlicht keiner der beiden. Gesetzt: Airbag-Lampe an."
  affected_components:
    - second_row_left_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: seat_harness_wire_damage
      likelihood: high
      label:
        en: Internal wire damage in the second-row seat harness at the belt connector (Ford programme 21B11)
        de: Innere Aderschäden im Sitzkabelbaum der zweiten Reihe am Gurtstecker (Ford-Programm 21B11)
    - id: buckle_inflator_connector
      likelihood: medium
      label:
        en: Plug of the inflator under the left rear seat loose after folding or removing the seat
        de: Stecker des Gasgenerators unter dem linken Rücksitz nach Umklappen oder Ausbau locker
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Fault in the belt inflator igniter
        de: Fehler im Zünder des Gurt-Gasgenerators
  symptoms:
    - en: Airbag warning light on
      de: Airbag-Warnleuchte an
    - en: Left rear inflatable belt may not deploy in a crash
      de: Aufblasbarer Gurt hinten links löst bei einem Unfall womöglich nicht aus
    - en: "Safety note: the belt holds a stored-gas or pyrotechnic inflator – battery off, wait time, work only at a specialist workshop"
      de: "Sicherheitshinweis: Der Gurt hat einen Kaltgas- bzw. pyrotechnischen Generator – Batterie ab, Wartezeit, Arbeiten nur in der Fachwerkstatt"
  repair:
    difficulty: shop_only
