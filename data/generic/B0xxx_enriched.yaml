- code: B012D
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet Control Module "B"
    de: DC/AC-Wandler A Hochvolt-Steckdosen-Steuermodul „B“
  description:
    en: B012D addresses outlet control module B. A converter for household sockets interacts with the rest of the vehicle both electrically and by radio. Ford's TSB 23-2218 for 2021–2023 F-150 with the DCACA inverter shows radio-frequency interference from the inverter upsetting the tyre pressure system, so the BCM stores B124D and lights the TPMS lamp; the procedure confirms the inverter as source and suppresses the interference. Toyota Industries' patent US10050558B2 describes a 12 V-fed inverter that only runs between about 11 and 16 V and shuts down on overvoltage or when its power devices overheat. Which unit module B is remains unpublished; no maker documents B012D. Supply, ground and data lines come before a new module.
    de: "B012D betrifft Steckdosen-Steuermodul B. Ein Wandler für Haushaltssteckdosen wirkt elektrisch und per Funk auf das übrige Fahrzeug. Fords TSB 23-2218 zu F-150 2021–2023 mit DCACA-Wechselrichter zeigt Funkstörungen des Wechselrichters, die das Reifendrucksystem stören: Das BCM speichert B124D und schaltet die TPMS-Leuchte ein; das Verfahren bestätigt den Wechselrichter als Quelle und dämpft die Störung. Das Patent US10050558B2 von Toyota Industries beschreibt einen am 12-V-Netz hängenden Wechselrichter, der nur zwischen etwa 11 und 16 V läuft und bei Überspannung oder überhitzten Leistungsbauteilen abschaltet. Welche Einheit Modul B ist, bleibt unveröffentlicht; B012D dokumentiert kein Hersteller. Versorgung, Masse und Datenleitungen kommen vor einem neuen Modul."
  affected_components:
    - hv_outlet_module_b
    - dc_ac_converter_module_a
  common_causes:
    - id: module_b_supply_voltage
      likelihood: high
      label:
        en: Supply voltage outside the permitted window, weak 12 V battery or poor ground
        de: Versorgungsspannung außerhalb des zulässigen Fensters, schwache 12-V-Batterie oder schlechte Masse
    - id: module_b_overheating
      likelihood: medium
      label:
        en: Module B overheating, blocked air path or cooling fan failed
        de: Modul B überhitzt, Luftweg verstellt oder Lüfter ausgefallen
    - id: module_b_internal
      likelihood: low
      label:
        en: Module B internally defective or emitting interference
        de: Modul B intern defekt oder strahlt Störungen ab
  symptoms:
    - en: Outlets switch off or are unavailable
      de: Steckdosen schalten ab oder sind nicht verfügbar
    - en: Side effects on radio-based systems such as tyre pressure monitoring
      de: Nebenwirkungen auf Funksysteme wie die Reifendrucküberwachung
    - en: Module handles 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Modul verarbeitet 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [100, 2500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B012C, B012E, P2EA7, P2EA8, P2EA9]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10239475-0001.pdf
    - https://patents.google.com/patent/US10050558B2/en
  reviewed: '2026-11-06'

- code: B012E
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet Control Module "C"
    de: DC/AC-Wandler A Hochvolt-Steckdosen-Steuermodul „C“
  description:
    en: "B012E concerns outlet control module C. GM's name for the part is accessory AC and DC power control module: in program N222385490, 2023 Silverado and Sierra 1500 built from September 2022 without a working inverter, because of the chip shortage, received this module, a fuse and BCM reprogramming, with separate inverters for 110 V (RPO KI4) and 230 V (KI5). Ford's patent US11043801B2 describes the control side: relays switching each socket, run timers and power limits, all managed by the DCACA controller. Whether module C is a third unit or another function is not published, and no manufacturer documents B012E. Typical causes are supply, ground, network faults or missing configuration after replacement."
    de: "B012E betrifft Steckdosen-Steuermodul C. GM nennt das Teil Zubehör-Stromsteuermodul für Wechsel- und Gleichstrom: Im Programm N222385490 erhielten Silverado und Sierra 1500 von 2023, die ab September 2022 wegen Chipmangels ohne funktionierenden Wechselrichter gebaut wurden, dieses Modul, eine Sicherung und eine BCM-Programmierung; für 110 V (RPO KI4) und 230 V (KI5) gibt es eigene Wechselrichter. Fords Patent US11043801B2 beschreibt die Steuerseite: Relais für jede Steckdose, Laufzeit-Timer und Leistungsgrenzen, verwaltet von der DCACA-Steuerung. Ob Modul C eine dritte Einheit oder eine weitere Funktion ist, ist nicht veröffentlicht; B012E dokumentiert kein Hersteller. Typische Ursachen sind Versorgung, Masse, Netzwerkfehler oder fehlende Konfiguration nach dem Tausch."
  affected_components:
    - hv_outlet_module_c
    - body_control_module
  common_causes:
    - id: module_c_configuration
      likelihood: high
      label:
        en: Module C or BCM not configured or programmed after installation or replacement
        de: Modul C oder BCM nach Einbau oder Tausch nicht konfiguriert oder programmiert
    - id: module_c_power_ground
      likelihood: medium
      label:
        en: Fuse, supply or ground of module C faulty
        de: Sicherung, Versorgung oder Masse von Modul C fehlerhaft
    - id: module_c_internal
      likelihood: low
      label:
        en: Module C internally defective
        de: Modul C intern defekt
  symptoms:
    - en: Power outlets in cab and bed inoperative
      de: Steckdosen in Innenraum und Ladefläche ohne Funktion
    - en: Outlet functions missing from the display menu
      de: Steckdosenfunktionen fehlen im Bildschirmmenü
    - en: Module handles 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Modul verarbeitet 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [100, 2500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B012C, B012D, B0127]
  sources:
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10234131-0001.pdf
    - https://patents.google.com/patent/US11043801B2/en
  reviewed: '2026-11-06'

- code: B012F
  category: body
  title:
    en: A/V Sensor Washer Fluid A Control Circuit
    de: A/V-Sensor-Waschflüssigkeit A Steuerkreis
  description:
    en: "B012F reports a fault in the control circuit for A/V sensor washer fluid A, the first of six such circuits, with B0130 to B0134 following. A/V most likely stands for autonomous vehicle; the circuit drives the pump or valve that delivers fluid to one sensor. Uber's patent family (US20180015907A1, US10220817B2) shows the layout: one reservoir, a set of pumps the vehicle computer starts individually for each camera or lidar cleaner, plus compressed air through solenoid valves. Ford's US10569746B2 has the computer run a wash pump when it judges a sensor window dirty. Which sensor A serves is not published; no maker documents B012F. If the circuit fails, sensor A goes uncleaned and automated driving functions may restrict themselves."
    de: "B012F meldet einen Fehler im Steuerkreis für A/V-Sensor-Waschflüssigkeit A, den ersten von sechs solchen Kreisen; B0130 bis B0134 folgen. A/V steht sehr wahrscheinlich für autonomes Fahrzeug; der Kreis schaltet Pumpe oder Ventil, das einem Sensor Flüssigkeit zuführt. Ubers Patentfamilie (US20180015907A1, US10220817B2) zeigt den Aufbau: ein Behälter, mehrere Pumpen, die der Fahrzeugrechner für jede Kamera- oder Lidar-Reinigung einzeln startet, dazu Druckluft über Magnetventile. In Fords US10569746B2 setzt der Rechner eine Waschpumpe in Gang, sobald er ein Sensorfenster für verschmutzt hält. Welchen Sensor A versorgt, ist nicht veröffentlicht; B012F dokumentiert kein Hersteller. Fällt der Kreis aus, bleibt Sensor A ungereinigt, und automatisierte Fahrfunktionen schränken sich gegebenenfalls ein."
  affected_components:
    - av_washer_fluid_pump_a
    - pump_wiring
  common_causes:
    - id: pump_a_open_short
      likelihood: high
      label:
        en: Pump motor or valve coil for fluid circuit A open or shorted
        de: Pumpenmotor oder Ventilspule für Flüssigkeitskreis A unterbrochen oder kurzgeschlossen
    - id: control_wiring_a
      likelihood: medium
      label:
        en: Damaged wiring or corroded connector in the control circuit
        de: Beschädigte Leitung oder korrodierter Stecker im Steuerkreis
    - id: driver_stage_a
      likelihood: low
      label:
        en: Driver stage in the controlling module defective
        de: Endstufe im ansteuernden Steuergerät defekt
  symptoms:
    - en: Sensor A is no longer washed, camera or lidar view stays dirty
      de: Sensor A wird nicht mehr gewaschen, Kamera- oder Lidarsicht bleibt verschmutzt
    - en: Assistance or automated driving functions report sensor blocked or become unavailable
      de: Assistenz- oder automatisierte Fahrfunktionen melden Sensor verdeckt oder sind nicht verfügbar
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [30, 400]
    estimated_hours: [0.3, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B0130, B0131, B0132, B0133, B0134, B011E]
  sources:
    - https://patents.google.com/patent/US20180015907A1/en
    - https://patents.google.com/patent/US10220817B2/en
    - https://patents.google.com/patent/US10569746B2/en
  reviewed: '2026-11-06'

