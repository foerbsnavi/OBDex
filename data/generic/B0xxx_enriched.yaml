- code: B00E0
  category: body
  title:
    en: Third Row Left Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B dritte Reihe links Auslösesteuerung
  description:
    en: B00E0 points to a second pretensioner stage (B) on the left seat of the third row. Such a stage would be an extra device next to the retractor, typically a lap or anchor tensioner that pulls on the lower belt end. No carmaker publishes B00E0. Mercedes-Benz, which does fit third-row tensioners (the 2017 GLS manual lists them for every third-row belt), logs the left third-row retractor under B00E7 in topic LI54.21-P-070658, i.e. on the C slot, and never names a B stage back there. GM describes anchor units only for front seats, and Joyson pairs its lap pretensioner with a retractor unit against submarining. A stored code lights the airbag lamp; the stage is treated as not available.
    de: B00E0 verweist auf eine zweite Straffer-Stufe (B) am linken Platz der dritten Reihe – ein zusätzliches Bauteil neben dem Aufroller, etwa ein Becken- oder Verankerungsstraffer am unteren Gurtende. Öffentlich nutzt kein Hersteller B00E0. Mercedes-Benz verbaut Straffer auch ganz hinten (das GLS-Handbuch 2017 nennt sie für alle Gurte der dritten Reihe), legt den linken Aufroller dort laut LI54.21-P-070658 aber unter B00E7 ab, also auf Stufe C; eine Stufe B taucht hinten nicht auf. GM beschreibt Verankerungsstraffer nur an Vordersitzen, Joyson kombiniert seinen Beckengurtstraffer mit einem Aufrollerstraffer gegen das Durchrutschen. Mit gespeichertem Code leuchtet die Airbag-Lampe, die Stufe gilt als nicht verfügbar.
  affected_components:
    - third_row_left_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: third_row_floor_connector
      likelihood: high
      label:
        en: Plug of the lap or anchor tensioner at the left third-row seat loose, unlatched or corroded
        de: Stecker des Becken- bzw. Verankerungsstraffers am linken Sitz der dritten Reihe locker, nicht verriegelt oder korrodiert
    - id: folding_seat_harness
      likelihood: medium
      label:
        en: Lead strained or chafed by folding and stowing the third-row seat
        de: Leitung durch Umklappen und Versenken des Sitzes der dritten Reihe gedehnt oder durchgescheuert
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Airbag module coded for a B stage the vehicle does not have (after module or seat replacement)
        de: Airbag-Steuergerät auf eine Stufe B codiert, die das Fahrzeug nicht hat (nach Tausch von Steuergerät oder Sitz)
    - id: squib_internal
      likelihood: low
      label:
        en: Internal open or short in the tensioner squib
        de: Interne Unterbrechung oder Kurzschluss in der Zündpille des Straffers
  symptoms:
    - en: Airbag warning lamp lit
      de: Airbag-Warnleuchte leuchtet
    - en: Lap belt at the left third-row seat may not be pulled tight in a crash
      de: Beckengurt am linken Platz der dritten Reihe wird bei einem Aufprall womöglich nicht gestrafft
    - en: "Safety note: pyrotechnic part – work only with the battery disconnected and the wait time observed, preferably at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Bauteil – nur spannungsfrei (Batterie ab, Wartezeit abwarten) und am besten in der Fachwerkstatt daran arbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
