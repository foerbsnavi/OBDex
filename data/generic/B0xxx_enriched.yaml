- code: B0014
  category: body
  title:
    en: Driver Knee Airbag Deployment Control
    de: Fahrer-Knieairbag Auslösesteuerung
  description:
    en: B0014 is not in the public J2012 code lists; there the driver knee airbag has B0004 and the passenger knee airbag B0013. The number is documented only at General Motors, and with another meaning. GM modules from about 2010 use B0014 for the side airbag in the driver seat; the Saab 9-4X 2011 manual adds a fault byte for each failure, from a shorted or open loop to a high reading (0D, over 4.2 ohms) or a low one (0E, under 1.4 ohms). GM bulletins blame chafed or loose seat harness connectors and high connector resistance on Silverado and Tahoe 2014-15, Equinox, Traverse and the Bolt EV. Older Saab 9-3 modules used B0014 for a short in the passenger frontal stage 2 loop. A knee airbag meaning for this code is not publicly documented.
    de: "B0014 steht nicht in den öffentlichen J2012-Codelisten; dort hat der Fahrer-Knieairbag B0004 und der Beifahrer-Knieairbag B0013. Belegt ist die Nummer nur bei General Motors, und zwar mit anderer Bedeutung: GM-Steuergeräte ab etwa 2010 verwenden B0014 für den Seitenairbag im Fahrersitz; das Handbuch des Saab 9-4X 2011 hängt je Fehlerart ein Byte an, vom Kurzschluss oder offenen Kreis bis zu hohem (0D, über 4,2 Ohm) oder niedrigem Messwert (0E, unter 1,4 Ohm). GM-Bulletins nennen durchgescheuerte oder lose Sitzkabelstecker und zu hohen Übergangswiderstand bei Silverado und Tahoe 2014–15, Equinox, Traverse und Bolt EV. Ältere Saab-9-3-Steuergeräte meldeten mit B0014 einen Kurzschluss im Beifahrerkreis Stufe 2. Eine Knieairbag-Bedeutung ist für diesen Code öffentlich nicht nachweisbar."
  affected_components:
    - knee_airbag_module
    - driver_side_airbag
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: On GM vehicles loose or high-resistance side airbag connector under or in the driver seat
        de: Bei GM loser oder hochohmiger Seitenairbagstecker unter oder im Fahrersitz
    - id: seat_harness_chafe
      likelihood: medium
      label:
        en: Seat harness chafed by seat frame, motor or foam
        de: Sitzkabelbaum an Sitzrahmen, Motor oder Polster durchgescheuert
    - id: airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the airbag module served by this loop
        de: Innerer Fehler im Airbagmodul dieses Kreises
  symptoms:
