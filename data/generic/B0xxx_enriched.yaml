- code: B0072
  category: body
  title:
    en: Passenger Seat Belt Pretensioner A Deployment Control
    de: Beifahrer-Gurtstraffer A Auslösesteuerung
  description:
    en: "B0072 reports a fault in the deployment loop of the front passenger's A-stage belt pretensioner. While that loop is faulty the device cannot be relied on to fire, so the airbag module lights its lamp and keeps the code. Toyota uses the number this way: T-SB-0057-22 for the 2022 Tundra and Tundra Hybrid lists B007212, a short to battery, among the codes the wireless charger can provoke, and the remedy is an SRS ECU reprogramming. The passenger seat often carries further devices; Mercedes logs the passenger's belt end fitting tensioner and retractor as B007A and B007F, and FCA ties B007F to the passenger retractor at the B-pillar. NHTSA's 2013 evaluation explains how buckle and retractor pretensioners remove slack. Whatever the hardware, a stored B0072 means passenger pretensioning is not assured."
    de: "B0072 meldet einen Fehler im Auslösekreis des Gurtstraffers der Stufe A am Beifahrersitz. Solange der Kreis gestört ist, kann sich das Airbagsteuergerät nicht auf die Zündung verlassen; es schaltet die Warnleuchte ein und speichert den Code. Toyota nutzt die Nummer in diesem Sinn: T-SB-0057-22 (Tundra und Tundra Hybrid 2022) führt B007212 – Schluss nach Plus – unter den Codes, die die kabellose Ladeschale auslösen kann; Abhilfe ist ein Software-Update des SRS-Steuergeräts. Am Beifahrerplatz sitzen oft weitere Straffer: Mercedes legt Endbeschlag- und Aufrollerstraffer des Beifahrers unter B007A und B007F ab, FCA ordnet B007F dem Aufroller an der B-Säule zu. Wie Schloss- und Aufrollerstraffer die Gurtlose beseitigen, beschreibt die NHTSA-Auswertung von 2013. Mit gespeichertem B0072 ist die Straffung am Beifahrersitz nicht gesichert."
  affected_components:
    - passenger_seatbelt_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: passenger_pretensioner_plug
      likelihood: high
      label:
        en: Passenger pretensioner plug not latched or corroded
        de: Stecker am Beifahrer-Gurtstraffer nicht eingerastet oder korrodiert
    - id: seat_or_pillar_harness
      likelihood: medium
      label:
        en: Lead pinched at the passenger seat base or B-pillar trim
        de: Leitung am Beifahrersitz-Unterbau oder an der B-Säulenverkleidung eingeklemmt
    - id: electrical_interference
      likelihood: low
      label:
        en: Interference from added electronics such as a wireless charger
        de: Störeinkopplung durch Zusatzelektronik wie eine Qi-Ladeschale
    - id: pretensioner_fault
      likelihood: low
      label:
        en: Pretensioner squib with internal fault
        de: Zündpille des Gurtstraffers intern defekt
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Front passenger belt may stay slack in a crash
      de: Beifahrergurt bleibt bei einem Unfall womöglich locker
    - en: "Safety note: the pretensioner is pyrotechnic; only handle it de-energised (battery off, wait time) and have it serviced at a specialist workshop"
      de: "Sicherheitshinweis: Der Straffer ist pyrotechnisch; nur spannungsfrei anfassen (Batterie ab, Wartezeit) und in einer Fachwerkstatt instand setzen lassen"
