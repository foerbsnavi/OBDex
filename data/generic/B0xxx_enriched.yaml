- code: B00C2
  category: body
  title:
    en: Passenger Seat Occupant Classification Sensor C
    de: Beifahrersitz Insassenklassifizierungssensor C
  description:
    en: "B00C2 names the third classification input of the passenger seat. No carmaker documents it, and nobody has tied the letter to a known part. Another common sensor type besides load cells is a mat in the cushion. Hyundai extended the cover of the OCS mat in 2006–2011 Accent cars to 15 years with unlimited mileage: the mat should spot child seats and small occupants, and a faulty one could let the bag fire for a child; the lamp then lights with Hyundai's own codes B1447/B1448. Subaru tells technicians for 2014–2016 Forester that spilled drinks, rain through an open window or high humidity reaching the mat can set its occupant detection codes B1760 and B1650. Should C be such a mat, moisture and wear would be the prime suspects. A stored B00C2 lights the airbag lamp."
    de: "B00C2 bezeichnet den dritten Klassifizierungseingang des Beifahrersitzes. Kein Hersteller veröffentlicht ihn, und der Buchstabe ist keinem bekannten Bauteil zugeordnet. Neben Lastzellen ist eine Matte im Polster ein verbreiteter Sensortyp. Hyundai verlängerte die Garantie der OCS-Matte im Accent 2006–2011 auf 15 Jahre ohne Kilometergrenze: Die Matte soll Kindersitze und kleine Insassen erkennen, eine defekte könnte den Airbag bei einem Kind zünden lassen; dann leuchtet die Lampe mit den Hyundai-eigenen Codes B1447/B1448. Subaru weist für den Forester 2014–2016 darauf hin, dass verschüttete Getränke, Regen durch ein offenes Fenster oder hohe Luftfeuchte an der Matte die Insassenerkennungscodes B1760 und B1650 auslösen. Wäre C eine solche Matte, stünden Nässe und Verschleiß obenan. Ein gespeicherter B00C2 schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_classification_sensor_c
    - srs_seat_wiring
    - occupant_classification_module
  common_causes:
