- code: B0042
  category: body
  title:
    en: Third Row Left Frontal Stage 2 Deployment Control
    de: Frontairbag dritte Sitzreihe links Stufe 2 Auslösesteuerung
  description:
    en: "B0042 stands for the second stage of a frontal airbag aimed at the left third-row passenger. A second stage only makes sense with an inflator that has two independently fired charges, as in Breed's multi-chamber design where the controller picks which chamber fires first and the gap between them. No carmaker documents B0042 for the third row, and no series car with such a bag is known. The older GM meaning is clear-cut: Saab's 9-5 (2006) and 9-3 manuals define B0042 as driver frontal stage 2 loop resistance below 1.5 ohms lasting 2 seconds, and the GM CPA retainer bulletin 08-09-41-002H covers it too. Airbag lamp on."
    de: "B0042 steht für die zweite Stufe eines Frontairbags für den Fahrgast links in der dritten Reihe. Eine zweite Stufe setzt einen Gasgenerator mit zwei getrennt zündbaren Ladungen voraus, wie im Mehrkammer-Entwurf von Breed, bei dem das Steuergerät wählt, welche Kammer zuerst zündet und mit welchem Abstand die nächste folgt. Kein Hersteller dokumentiert B0042 für die dritte Reihe, ein Serienauto mit solchem Airbag ist nicht bekannt. Die ältere GM-Bedeutung ist eindeutig: Für den 9-5 des Jahrgangs 2006 und den 9-3 beschreibt Saab B0042 als Widerstand unter 1,5 Ohm über 2 Sekunden im Kreis der Fahrer-Frontairbagstufe 2; das Steckersicherungs-Bulletin 08-09-41-002H von GM schließt ihn ein. Airbag-Leuchte an."
  affected_components:
    - third_row_left_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: stage2_lead
      likelihood: medium
      label:
        en: Open or short only in the stage 2 wiring
        de: Unterbrechung oder Schluss nur in der Leitung der Stufe 2
    - id: connector_lock
      likelihood: medium
      label:
        en: Connector lock not engaged at the airbag plug
        de: Steckersicherung am Airbagstecker nicht eingerastet
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
