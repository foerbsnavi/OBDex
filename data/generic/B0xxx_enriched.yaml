- code: B0115
  category: body
  title:
    en: Camera Washer Actuator M
    de: Kamera-Wascher-Aktuator M
  description:
    en: B0115 names actuator M. Where several cameras share one pump, the actuator is often a distribution valve. Solero's SCV43 is a 4/3-way valve switched by voltage, with one inlet and three independently switched outlets, so a single pump can serve up to three nozzles and fewer DC pumps are needed in the reservoir. Kautex's Allegro systems clean several camera points and lidar with water and air, and their software decides which point is served first. With a shared valve block, one failed coil can stop washing at one camera while the others still spray, and that is how a single-letter code like B0115 would show. No manufacturer publishes B0115 or the camera behind M.
    de: B0115 bezeichnet Aktor M. Teilen sich mehrere Kameras eine Pumpe, ist der Aktor oft ein Verteilventil. Soleros SCV43 ist ein spannungsgesteuertes 4/3-Wegeventil mit einem Eingang und drei unabhängig geschalteten Ausgängen; so versorgt eine Pumpe bis zu drei Düsen, und im Behälter werden weniger Gleichstrompumpen gebraucht. Die Allegro-Systeme von Kautex reinigen mehrere Kamerapunkte und Lidar mit Wasser und Luft, ihre Software legt fest, welcher Punkt zuerst bedient wird. Bei einem gemeinsamen Ventilblock kann eine ausgefallene Spule die Wäsche an einer Kamera stoppen, während die anderen weiter spritzen – genau so würde sich ein Einzelbuchstaben-Code wie B0115 zeigen. Kein Hersteller veröffentlicht B0115 oder die Kamera hinter M.
  affected_components:
    - camera_washer_actuator_m
    - washer_pump
