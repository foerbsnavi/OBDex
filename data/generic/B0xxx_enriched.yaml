- code: B0041
  category: body
  title:
    en: Third Row Left Frontal Stage 1 Deployment Control
    de: Frontairbag dritte Sitzreihe links Stufe 1 Auslösesteuerung
  description:
    en: "B0041 would report the first stage of a frontal airbag for the left third-row seat, which would have to deploy from the back of the second-row seat in front of it. Such bags are described in patents, for instance a Daimler application for an airbag at the rear of a front seat and a Mercedes-Benz filing that compensates for a sliding seat with stacked chambers, but no production vehicle with third-row frontal airbags is known; the S-Class rear airbag serves the second row only. No maker documents B0041. GM's old numbering is unrelated: for the Saab 9-5 of 2006 B0041 means an open driver side airbag loop, read as more than 4.5 ohms over 2 seconds. Airbag lamp on."
    de: "B0041 würde die erste Stufe eines Frontairbags für den linken Platz der dritten Reihe melden, der sich aus der Lehne des Vordermanns in Reihe zwei entfalten müsste. Solche Airbags stehen in Patenten, etwa in einer Daimler-Anmeldung für einen Airbag an der Rückseite eines Vordersitzes und in einer Mercedes-Benz-Anmeldung, die einen verschiebbaren Sitz mit gestapelten Kammern ausgleicht; ein Serienfahrzeug mit Frontairbags für die dritte Reihe ist aber nicht bekannt, der Fond-Airbag der S-Klasse schützt nur die zweite Reihe. Kein Hersteller dokumentiert B0041. Die alte GM-Nummerierung hat damit nichts zu tun: Beim Saab 9-5 2006 heißt B0041 offener Kreis des Fahrer-Seitenairbags, über 4,5 Ohm (±0,2) für 2 Sekunden. Airbag-Leuchte an."
  affected_components:
    - third_row_left_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: second_row_seat_connector
      likelihood: medium
      label:
        en: Loose connector of the airbag lead in the second-row seatback
        de: Lockerer Stecker der Airbagleitung in der Lehne der zweiten Reihe
    - id: folding_seat_harness
      likelihood: medium
      label:
        en: Lead strained when the second-row seat is folded or slid
        de: Leitung beim Klappen oder Verschieben des Sitzes der zweiten Reihe belastet
    - id: config_mismatch
      likelihood: low
