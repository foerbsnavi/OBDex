- code: B0109
  category: body
  title:
    en: LIDAR Washer Actuator D
    de: LIDAR-Wascher-Aktuator D
  description:
    en: "B0109 ends the lidar washer group with actuator D; the next codes, B010A onward, move on to camera washers. Four lidar circuits match fleets built for driverless service: Kautex fits two complete Allegro cleaning and clearing systems to every Zoox robotaxi, combining water and air for cameras and lidars. On Ford’s self-driving test cars, nozzles next to each lens spray washer fluid on demand, and the roof tiara that carries cameras and lidar adds an air curtain. In Ford's US10569746B2 the computer can even leave autonomous mode while a lidar window is too opaque. Nothing public tells which unit is D, and no carmaker documents B0109. A failed actuator D usually shows as one lidar staying dirty while the others clean normally."
    de: "B0109 schließt die Gruppe der Lidar-Wascher mit Aktor D ab; ab B010A folgen die Kamera-Wascher. Vier Lidar-Kreise passen zu Flotten für fahrerlosen Betrieb: Kautex baut in jedes Zoox-Robotaxi zwei vollständige Allegro-Systeme zum Reinigen und Freihalten ein, die Wasser und Luft für Kameras und Lidars kombinieren. Bei Fords Versuchsfahrzeugen für autonomes Fahren sprühen Düsen neben jeder Linse bei Bedarf Waschflüssigkeit, und die Dachtiara mit Kameras und Lidar erzeugt zusätzlich einen Luftvorhang. In Fords US10569746B2 kann der Rechner den autonomen Modus sogar verlassen, solange ein Lidar-Fenster zu trüb ist. Öffentlich ist nicht festgelegt, welche Einheit D ist, und kein Autohersteller dokumentiert B0109. Ein ausgefallener Aktor D zeigt sich meist daran, dass ein Lidar verschmutzt bleibt, während die übrigen sauber werden."
  affected_components:
