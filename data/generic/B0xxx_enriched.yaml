      de: SRS-Meldung oder Airbag-Lampe dauerhaft angezeigt
    - en: Right rear passenger loses shoulder-belt tensioning
      de: Fondpassagier rechts verliert die Straffung des Schultergurts
    - en: "Safety note: pyrotechnic tensioner – only work on it with the battery disconnected and after the wait time, ideally at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnischer Straffer – nur mit abgeklemmter Batterie und nach Ablauf der Wartezeit daran arbeiten, am besten in der Fachwerkstatt"
