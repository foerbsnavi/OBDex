- code: B011A
  category: body
  title:
    en: Camera Washer Actuator R
    de: Kamera-Wascher-Aktuator R
  description:
    en: "B011A covers actuator R. Some camera cleaners use air as well as fluid, so the actuator may be a blower as much as a pump. Thunder Power's patent US9539988B2 places a water nozzle and an air nozzle at a reversing camera: air blasts first, then unheated fluid, and below about 0 °C heated fluid, while an infrared drop sensor behind the lens decides when cleaning is needed. Denso's US9180840B2 opens its fluid valve only after the air has started and keeps it open for 0.1 to 0.5 s; in its tests at least about 70 % of salty mud had to come off for a usable picture. Air blowers for sensors have their own codes from B0100. Which camera R serves is not published; no manufacturer documents B011A."
    de: "B011A betrifft Aktor R. Manche Kamerareiniger arbeiten mit Luft und Flüssigkeit, der Aktor kann also ebenso ein Gebläse wie eine Pumpe sein. Thunder Powers Patent US9539988B2 setzt eine Wasser- und eine Luftdüse an eine Rückfahrkamera: Zuerst kommt ein Luftstoß, dann unbeheizte Flüssigkeit und unter etwa 0 °C beheizte, während ein Infrarot-Tropfensensor hinter der Linse entscheidet, wann gereinigt wird. Densos US9180840B2 öffnet sein Flüssigkeitsventil erst nach dem Start der Luft und hält es 0,1 bis 0,5 s offen; in den Versuchen mussten mindestens etwa 70 % des salzigen Schlamms weichen, damit das Bild brauchbar war. Luftgebläse für Sensoren haben ab B0100 eigene Codes. Welche Kamera R versorgt, ist nicht veröffentlicht; kein Hersteller dokumentiert B011A."
