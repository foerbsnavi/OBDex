- code: B0116
  category: body
  title:
    en: Camera Washer Actuator N
    de: Kamera-Wascher-Aktuator N
  description:
    en: "B0116 covers actuator N. Like B0111 it also turns up on the 2004–2009 Toyota Sienna, where bulletin T-SB-0069-12 uses it for an open side-airbag squib circuit, not a washer. In the generic sense, cold is a typical burden for camera washers. Denso's patent US9180840B2 mixes air from a pump with fluid admitted by an electromagnetic valve and adapts to the weather: at or below a threshold such as 2 °C it lowers the pump voltage so that larger droplets form, which freeze less readily on the lens, and it lengthens spray and blow times. Kautex offers heated nozzles and heated hoses against the same problem. Frozen fluid can stall a pump or valve and make it draw abnormal current. Which camera N serves is not published."
    de: "B0116 betrifft Aktor N. Wie B0111 taucht er auch beim Toyota Sienna 2004–2009 auf, wo Bulletin T-SB-0069-12 ihn für einen unterbrochenen Zündkreis des Seitenairbags nutzt, nicht für einen Wascher. Im generischen Sinn ist Kälte eine typische Belastung für Kamerawascher. Densos Patent US9180840B2 mischt Luft aus einer Pumpe mit Flüssigkeit, die ein elektromagnetisches Ventil zulässt, und passt sich dem Wetter an: Bei oder unter einer Schwelle wie 2 °C senkt es die Pumpenspannung, damit größere Tropfen entstehen, die auf der Linse weniger leicht gefrieren, und verlängert Sprüh- und Blaszeiten. Kautex bietet gegen dasselbe Problem beheizte Düsen und beheizte Schläuche an. Gefrorene Flüssigkeit kann Pumpe oder Ventil blockieren und eine auffällige Stromaufnahme bewirken. Welche Kamera N versorgt, ist nicht veröffentlicht."
  affected_components:
    - camera_washer_actuator_n
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: frozen_fluid_n
      likelihood: high
      label:
        en: Washer fluid without enough antifreeze frozen in pump or valve N
        de: Waschflüssigkeit mit zu wenig Frostschutz in Pumpe oder Ventil N gefroren
    - id: actuator_n_electrical
