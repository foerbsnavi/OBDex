- code: B00C6
  category: body
  title:
    en: Passenger Seat Recline Position Restraints Sensor
    de: Beifahrersitz-Lehnenpositionssensor (Rückhaltesystem)
  description:
    en: "B00C6 concerns the sensor that reports how far the passenger seat back is reclined. It appears neither in any public carmaker list nor in NHTSA bulletins. On the passenger side the angle matters mainly for classification, because a reclined back carries part of the occupant's weight. A patent filed in 1997 gives numbers: a cushion sensor read 42, 39 and 27 lb for a 60 lb child at three recline settings and 74, 64 and 49 lb for a 120 lb adult, so a recline sensor feeds a lookup table; there, below about 95 lb the bag is suppressed. A 2010 Delphi patent corrects bladder pressure with a backrest angle from an accelerometer or potentiometer. Without this input a small adult may be taken for a child. B00C6 lights the airbag lamp."
    de: "B00C6 betrifft den Sensor, der meldet, wie weit die Lehne des Beifahrersitzes geneigt ist. Kein Hersteller dokumentiert diesen Code, und im NHTSA-Bulletinindex gibt es keinen Eintrag. Auf der Beifahrerseite zählt der Winkel vor allem für die Klassifizierung, denn eine geneigte Lehne trägt einen Teil des Körpergewichts. Ein 1997 eingereichtes Patent nennt Zahlen: Ein Polstersensor maß für ein Kind von 60 lb bei drei Lehnenstellungen 42, 39 und 27 lb, für einen Erwachsenen von 120 lb 74, 64 und 49 lb; deshalb speist ein Lehnensensor eine Kennfeldtabelle, unter etwa 95 lb wird der Airbag dort gesperrt. Ein Delphi-Patent von 2010 korrigiert den Druck einer Blase mit dem Lehnenwinkel aus Beschleunigungssensor oder Potentiometer. Fehlt dieser Eingang, kann ein kleiner Erwachsener als Kind gelten. B00C6 schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_recline_sensor
    - srs_seat_wiring
    - occupant_classification_module
  common_causes:
    - id: recline_sensor_harness
      likelihood: high
      label:
        en: Lead to the recline sensor stretched or broken at the seat back hinge
        de: Leitung zum Lehnensensor am Lehnengelenk gedehnt oder gebrochen
    - id: recline_sensor_fault
      likelihood: medium
      label:
        en: Recline potentiometer or inclination sensor worn or faulty
        de: Lehnenpotentiometer oder Neigungssensor verschlissen oder defekt
    - id: sensor_not_initialised
      likelihood: low
      label:
        en: Angle reference not learned after replacing the seat back or the sensor
        de: Winkelreferenz nach Tausch von Lehne oder Sensor nicht eingelernt
  symptoms:
