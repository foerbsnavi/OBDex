        de: Gurtschlossleitung in der Klappmechanik der dritten Reihe gebrochen oder durchgescheuert
    - id: third_row_connector
      likelihood: medium
      label:
        en: Loose or corroded connector at the third-row seat
        de: Lockerer oder korrodierter Stecker am Sitz der dritten Reihe
    - id: buckle_sensor_fault
      likelihood: low
