- code: B0111
  category: body
  title:
    en: Camera Washer Actuator H
    de: Kamera-Wascher-Aktuator H
  description:
    en: B0111 is the J2012 code for camera washer actuator H, but the number has an older second life. Toyota's bulletin T-SB-0069-12 (revision 2, 2014) for the 2004–2009 Sienna lists B0111 together with B0116 as an open side-airbag squib circuit with the SRS lamp lit, repaired in the floor harness. On that van the code has nothing to do with washing, and a scan tool showing the generic title would mislead. In the generic sense, actuator H is one of the pumps or valves that suppliers such as Kautex offer for ADAS cleaning, next to heated nozzles, heated hoses, connectors and level sensors. No manufacturer publishes which camera H means or documents B0111 as a washer code.
    de: B0111 ist in J2012 der Code für Kamera-Wascheraktor H, die Nummer hat aber ein älteres Zweitleben. Toyotas Bulletin T-SB-0069-12 (Revision 2, 2014) zum Sienna 2004–2009 führt B0111 zusammen mit B0116 als unterbrochenen Zündkreis des Seitenairbags bei leuchtender SRS-Lampe; repariert wird der Bodenkabelbaum. Bei diesem Van hat der Code nichts mit Waschen zu tun, und ein Diagnosegerät mit dem generischen Titel führt in die Irre. Im generischen Sinn ist Aktor H eine der Pumpen oder eines der Ventile, die Zulieferer wie Kautex für die ADAS-Reinigung anbieten, neben beheizten Düsen, beheizten Schläuchen, Verbindern und Füllstandsensoren. Kein Hersteller veröffentlicht, welche Kamera H meint, oder dokumentiert B0111 als Wascher-Code.
  affected_components:
    - camera_washer_actuator_h
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: actuator_h_electrical
      likelihood: high
      label:
        en: Pump or valve H open, shorted or seized
        de: Pumpe oder Ventil H unterbrochen, kurzgeschlossen oder festgegangen
    - id: actuator_h_plug
      likelihood: low
      label:
        en: Water ingress or corrosion in the plug of actuator H
        de: Wassereintritt oder Korrosion im Stecker von Aktor H
  symptoms:
