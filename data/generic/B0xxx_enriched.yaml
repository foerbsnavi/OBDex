- code: B0094
  category: body
  title:
    en: Center Frontal Restraints Sensor
    de: Crashsensor vorne Mitte
  description:
    en: "B0094 refers to a single crash sensor placed in the middle of the vehicle front, used where a car has one central frontal satellite rather than a left and right pair. Mitsubishi's airbag unit shows it as CRASH ZONE SENS and adds the J2012 name Center Frontal Restraints Sensor. Its index lists nine subtypes, logged once a fault has persisted for two seconds at ignition on: -11 and -12 for shorts to ground or supply, -88 for an open line, -81 for lost communication, -25 for a failed self-diagnosis, -28 for an offset error, -93 for a reset fault, -55 for a configuration mismatch and -86 when sensor and unit are not the specified parts. That index has no B0090 or B0095, so the centre unit is the only frontal satellite there. Bosch notes that crumple-zone acceleration sensors improve frontal crash detection. The airbag lamp lights."
    de: "B0094 betrifft einen einzelnen Crashsensor in der Mitte der Fahrzeugfront – für Autos mit einem zentralen Frontsatelliten statt eines linken und rechten. Mitsubishi zeigt ihn als CRASH ZONE SENS mit dem J2012-Namen Center Frontal Restraints Sensor. Der Index kennt neun Untertypen, je nach zwei Sekunden bei Zündung an gesetzt: -11/-12 Schluss nach Masse oder Plus, -88 Unterbrechung, -81 Kommunikationsausfall, -25 fehlgeschlagene Eigendiagnose, -28 Nullpunktfehler, -93 Reset-Fehler, -55 unpassende Konfiguration und -86, wenn Sensor und Steuergerät nicht die vorgesehenen Teile sind. B0090 und B0095 fehlen dort, der Mittelsensor ist also der einzige Frontsatellit. Laut Bosch verbessern Beschleunigungssensoren in der Knautschzone die Frontcrash-Erkennung. Die Airbag-Leuchte geht an."
  affected_components:
    - center_front_crash_sensor
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: front_sensor_harness_fault
      likelihood: high
      label:
        en: Open, short or corroded contact in the harness to the centre front sensor (subtypes -11/-12/-88)
        de: Unterbrechung, Kurzschluss oder korrodierter Kontakt in der Leitung zum mittleren Frontsensor (Untertypen -11/-12/-88)
    - id: centre_sensor_internal_fault
      likelihood: medium
      label:
        en: Internal fault of the crash zone sensor, e.g. offset or self-diagnosis error (subtypes -25/-28)
        de: Interner Fehler des Crashzonen-Sensors, z. B. Nullpunkt- oder Eigendiagnosefehler (Untertypen -25/-28)
    - id: wrong_part_or_configuration
      likelihood: medium
      label:
        en: Sensor or airbag unit not the specified part, or unit configuration wrong (subtypes -86/-55)
        de: Sensor oder Airbag-Steuergerät nicht das vorgesehene Teil oder falsch konfiguriert (Untertypen -86/-55)
    - id: front_end_damage
      likelihood: low
      label:
        en: Sensor or bracket bent by a front-end impact or refitted poorly after body work
        de: Sensor oder Halter durch Frontschaden verbogen oder nach Karosseriearbeit schlecht montiert
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Frontal crash detection falls back on the sensors inside the airbag unit
      de: Frontcrash-Erkennung stützt sich nur noch auf die Sensoren im Airbag-Steuergerät
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before work at the front sensor, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten am Frontsensor Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
