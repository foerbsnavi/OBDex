- code: B0105
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator B Control Relay
    de: Sensorreinigung Luftgebläse-Aktuator B Steuerrelais
  description:
    en: "B0105 is the relay fault on the B side of the sensor-cleaning air supply. If B is a compressor rather than a small fan, as in Uber's patent where a compressor charges an accumulator and recharges once pressure drops to roughly 130–140 psi, the relay carries a sizable inrush current, and pitted contacts become the usual weak point. HELLA lists change-over and make relays for motors such as fans and names the checks: dropout voltage, contact drop, coil resistance. AUMOVIO stresses that air keeps a lidar usable in bad weather by blowing off droplets, so a stuck relay shows up first in rain. No carmaker has published B0105 or what B supplies."
    de: "B0105 ist der Relaisfehler auf der B-Seite der Luftversorgung für die Sensorreinigung. Ist B kein kleiner Lüfter, sondern ein Kompressor – wie in Ubers Patent, wo ein Kompressor einen Speicher füllt und bei etwa 130–140 psi nachlädt –, muss das Relais einen kräftigen Einschaltstrom tragen, und abgebrannte Kontakte werden zur typischen Schwachstelle. HELLA führt Wechsler- und Schließerrelais für Motoren wie Lüfter auf und nennt die Prüfungen: Abfallspannung, Kontakt-Spannungsfall, Spulenwiderstand. AUMOVIO betont, dass Luft ein Lidar bei schlechtem Wetter einsatzfähig hält, indem sie Tropfen abbläst – ein hängendes Relais fällt deshalb zuerst bei Regen auf. Kein Autohersteller hat B0105 oder die Aufgabe von B veröffentlicht."
  affected_components:
