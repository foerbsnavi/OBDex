- code: B009B
  category: body
  title:
    en: Left Side Restraints Sensor 5
    de: Seitencrashsensor links 5
  description:
    en: "B009B names a fifth crash sensor on the left side. No carmaker documents this code publicly, and the reviewed bulletins and airbag indexes stop well before it. Why vehicles carry several side satellites at all follows from FMVSS 214: cars must protect occupants in a moving barrier crash and in a vehicle-to-pole test, and a narrow pole can strike anywhere along the side. Continental offers two kinds of satellites for this: the gSAT reports acceleration from rigid structure, the pSAT reacts to the pressure rise of a crushed door. A fifth left unit would most likely monitor a rear door or an extra seat row. When B009B is stored, the module has rejected that sensor's signal or circuit, and side or curtain airbags may react later on that side. The airbag lamp is lit."
    de: "B009B bezeichnet einen fünften Crashsensor links. Kein Hersteller dokumentiert diesen Code öffentlich; die gesichteten Bulletins und Airbag-Indizes enden lange davor. Warum Autos mehrere Seitensatelliten tragen, zeigt FMVSS 214: Insassen müssen beim Aufprall einer fahrenden Barriere und beim Pfahltest geschützt sein, und ein schmaler Pfahl kann die Flanke überall treffen. Continental bietet dafür zwei Satelliten an: Der gSAT meldet Beschleunigung aus steifer Struktur, der pSAT reagiert auf den Druckanstieg in einer eingedrückten Tür. Ein fünfter Sensor links würde vermutlich eine Hintertür oder eine weitere Sitzreihe überwachen. Ist B009B gespeichert, hat das Steuergerät Signal oder Kreis dieses Sensors verworfen, und Seiten- oder Kopfairbags reagieren links womöglich später. Die Airbag-Leuchte brennt."
  affected_components:
    - left_side_restraints_sensor_5
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sensor_harness_fault
      likelihood: high
      label:
        en: Line or connector fault on the way to the fifth left sensor
        de: Leitungs- oder Steckerfehler auf dem Weg zum fünften Sensor links
    - id: satellite_fault
      likelihood: medium
      label:
        en: Internal fault of the fifth left satellite (pressure or acceleration type)
        de: Interner Fehler des fünften linken Satelliten (Druck- oder Beschleunigungsausführung)
    - id: replacement_part_mismatch
      likelihood: low
      label:
        en: Replacement sensor of the wrong part number after a body repair
        de: Ersatzsensor mit falscher Teilenummer nach einer Karosseriereparatur
  symptoms:
