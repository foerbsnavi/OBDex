- code: B004A
  category: body
  title:
    en: Third Row Right Frontal Stage 2 Deployment Control
    de: Frontairbag dritte Sitzreihe rechts Stufe 2 Auslösesteuerung
  description:
    en: "B004A is the second-stage loop of the right third-row frontal airbag. Stage 2 is a separately ignited charge: Breed's patent shows an inflator whose chambers each carry their own igniter, fired alone, together or with a delay chosen by the controller, and Mercedes-Benz's rear airbag filing allows one deployment device per chamber for sequential filling. No published DTC table, vehicle maker or bulletin connects B004A to a real vehicle. If it appears, the stage 2 circuit of that bag is out of range while stage 1 (B0049) may still be fine; the left-hand equivalent is B0042. Airbag lamp on."
    de: "B004A ist der Kreis der zweiten Stufe des rechten Frontairbags der dritten Reihe. Stufe 2 ist eine getrennt gezündete Ladung: Das Breed-Patent zeigt einen Gasgenerator, dessen Kammern je einen eigenen Zünder haben und einzeln, gemeinsam oder mit vom Steuergerät gewähltem Versatz gezündet werden; die Mercedes-Benz-Anmeldung für den Fond-Airbag erlaubt je Kammer eine Auslöseeinheit zum Füllen nacheinander. Keine veröffentlichte Codetabelle, kein Hersteller und kein Bulletin verbindet B004A mit einem echten Fahrzeug. Taucht er auf, liegt der Kreis der Stufe 2 außerhalb des Sollbereichs, während Stufe 1 (B0049) noch in Ordnung sein kann; links entspricht ihm B0042. Airbag-Leuchte an."
  affected_components:
    - third_row_right_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: stage2_lead
      likelihood: medium
      label:
