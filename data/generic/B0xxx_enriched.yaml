- code: B00C1
  category: body
  title:
    en: Passenger Seat Occupant Classification Sensor B
    de: Beifahrersitz Insassenklassifizierungssensor B
  description:
    en: "B00C1 belongs to input B of the passenger seat classification. It is unpublished as such, but Toyota shows why a seat can carry several such sensors: on 2012–2013 Camry, Prius c and Yaris and 2013 Avalon, a left and a right weight detector sit between seat frame and rails. Their readings decide whether the passenger bag is armed, and they also serve as collision sensing. In campaign F0B (about 753,200 US cars) Toyota found that some seating habits or rough roads were taken for a rear impact, lighting the airbag lamp and AIR BAG OFF; dealers fitted new sensors, torqued them to 30 N·m, zeroed the system and verified its sensitivity. Whether B stands for such a right-hand cell is not documented. With B00C1 the airbag lamp is on."
    de: "B00C1 meldet den zweiten Klassifizierungseingang des Beifahrersitzes. Kein Hersteller veröffentlicht den Code, doch Toyota zeigt, warum ein Sitz mehrere solcher Sensoren trägt: Bei Camry, Prius c und Yaris 2012–2013 sowie Avalon 2013 sitzen ein linker und ein rechter Gewichtsaufnehmer zwischen Sitzrahmen und Schienen. Ihre Werte entscheiden, ob der Beifahrerairbag scharf ist, und dienen zugleich der Aufprallerkennung. In der Aktion F0B (rund 753.200 Fahrzeuge in den USA) stellte Toyota fest, dass manche Sitzhaltungen oder schlechte Straßen als Heckaufprall galten; Airbag-Leuchte und AIR BAG OFF gingen an. Die Händler bauten neue Sensoren ein, zogen sie mit 30 N·m an und führten Nullabgleich und Empfindlichkeitsprüfung durch. Ob B einen solchen rechten Aufnehmer meint, ist nicht belegt. Bei B00C1 leuchtet die Airbag-Leuchte."
  affected_components:
