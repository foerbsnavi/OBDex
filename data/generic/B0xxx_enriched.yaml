- code: B00CA
  category: body
  title:
    en: Passenger Seat Occupant Position Sensor D
    de: Beifahrersitz Insassenpositionssensor D
  description:
    en: "B00CA is position input D, the fourth for the passenger seat. Its use is not documented by any carmaker. Optical sensing is one way to fill such a slot: a patent family of Automotive Technologies International, going back to 1995, places imagers with infrared lighting at the A-pillar, in the headliner or on top of the dashboard, two arrays spaced apart for depth, and calls an occupant out of position once head or chest come within about 5 inches of the airbag door. Pattern recognition separates a rear-facing child seat from a person, and the authors judge ultrasound with roughly 10 ms per update as too slow for tracking during a crash. For the passenger, FMVSS 208 permits dynamic suppression and prescribes no method. With B00CA stored, that view is lost and the airbag warning shows."
    de: "B00CA ist Positionseingang D, der vierte am Beifahrersitz. Kein Hersteller dokumentiert seine Verwendung. Denkbar ist hier optische Erfassung: Eine Patentfamilie von Automotive Technologies International, zurückgehend auf 1995, setzt Bildsensoren mit Infrarotbeleuchtung an die A-Säule, in den Dachhimmel oder oben auf die Armaturentafel, zwei Sensoren mit Abstand für die Tiefe, und wertet einen Insassen als falsch sitzend, sobald Kopf oder Brust näher als etwa 5 Zoll an die Airbagklappe kommen. Mustererkennung trennt rückwärts gerichtete Kindersitze von Personen; Ultraschall mit rund 10 ms je Messung gilt dort als zu langsam für den Crash. FMVSS 208 lässt diese dynamische Abschaltung für den Beifahrer zu, ohne ein Verfahren vorzuschreiben. B00CA heißt, dieser Eingang ist ausgefallen; die Airbag-Leuchte brennt."
  affected_components:
    - passenger_occupant_position_sensor_d
    - srs_roof_wiring
    - occupant_position_module
  common_causes:
    - id: sensor_d_wiring
      likelihood: high
      label:
        en: Lead to sensor D damaged at the pillar, headliner or dashboard after trim or glass work
        de: Leitung zu Sensor D an Säule, Dachhimmel oder Armaturentafel nach Verkleidungs- oder Scheibenarbeiten beschädigt
    - id: sensor_view_blocked
      likelihood: medium
      label:
        en: Sensor view blocked or lens dirty, for example by stickers or accessories
        de: Sicht des Sensors verdeckt oder Optik verschmutzt, etwa durch Aufkleber oder Zubehör
    - id: sensor_d_fault
      likelihood: medium
      label:
        en: Internal fault of position sensor D
        de: Interner Fehler von Positionssensor D
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
