- code: B0040
  category: body
  title:
    en: Third Row Left Side Airbag Deployment Control
    de: Seitenairbag dritte Sitzreihe links Auslösesteuerung
  description:
    en: "B0040 is reserved for a side airbag at the left seat of a third row, as found in some seven-seat SUVs and vans; most of them protect that row only with an extended curtain. A Joyson (TK Holdings) patent states its seatback side module may serve any row, third included, and a GM application gives rear-row side bags their own gas generators and allows the rear row to be the third. No maker documents B0040 with this meaning. Earlier GM modules assign it elsewhere: Saab manuals for the 9-5 of 2006 and the 9-3 treat B0040 as low resistance in the driver side airbag loop, under 1.5 ohms with 0.2 tolerance for 2 seconds; bulletin 08-09-41-002H also names it for loose CPA retainers. Airbag lamp on."
    de: "B0040 ist für einen Seitenairbag am linken Platz einer dritten Sitzreihe vorgesehen, wie ihn manche siebensitzigen SUVs und Vans haben; meist schützt dort nur ein verlängerter Kopfairbag. Ein Patent von Joyson (TK Holdings) nennt sein Seitenairbagmodul in der Lehne ausdrücklich für jede Reihe einschließlich der dritten, eine GM-Anmeldung gibt den hinteren Seitenairbags eigene Gasgeneratoren und lässt die hintere Reihe auch die dritte sein. Mit dieser Bedeutung dokumentiert kein Hersteller B0040. Frühere GM-Steuergeräte belegen ihn anders: Die Saab-Anleitungen für 9-5 (2006) und 9-3 werten B0040 als zu kleinen Widerstand im Kreis des Fahrer-Seitenairbags, unter 1,5 Ohm bei 0,2 Toleranz über 2 Sekunden; GMs Rundschreiben 08-09-41-002H über nicht gesicherte Stecker nennt ihn ebenfalls. Airbag-Leuchte an."
  affected_components:
    - third_row_left_side_airbag
    - squib_circuit
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: third_row_connector
      likelihood: high
      label:
        en: Poor contact at the side airbag connector of the third-row seat or rear quarter trim
        de: Schlechter Kontakt am Seitenairbagstecker des Sitzes der dritten Reihe oder der Seitenverkleidung hinten
    - id: folding_seat_harness
      likelihood: medium
      label:
        en: Lead strained by folding or removing the third-row seat
        de: Leitung durch Umklappen oder Ausbauen des Sitzes der dritten Reihe belastet
    - id: side_airbag_fault
      likelihood: low
      label:
        en: Internal fault in the third-row side airbag
        de: Innerer Fehler im Seitenairbag der dritten Reihe
