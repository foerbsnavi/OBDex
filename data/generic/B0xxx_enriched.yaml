      de: Airbag-Warnleuchte an
    - en: Position-based adjustment of the driver airbag partly unavailable
      de: Positionsabhängige Anpassung des Fahrerairbags teilweise nicht verfügbar
    - en: "Safety note: airbag system; disconnect sensor and seat plugs only de-energised (ignition off, battery off, wait time); calibrate the sensor after replacement, specialist workshop only"
