- code: B010C
  category: body
  title:
    en: Camera Washer Actuator C
    de: Kamera-Wascher-Aktuator C
  description:
    en: "B010C names actuator C. Front cameras sit in the grille and get a jet of their own. Ford's TSB 20-2267 (2020) covers 2015–2020 F-150 (not Raptor), 2017–2020 Super Duty and 2018–2020 Expedition fitted with a front camera wash: the jet dripped fluid when idle because of its internal rubber seal, and the cure is a new jet, with the grille removed and the 360-degree camera aligned afterwards. Asmo's application US20110292212A1 explains why such jets carry a check valve: it opens only under pump pressure, so fluid neither runs onto the lens nor lets air into the line. A leaking seal sets no electrical code by itself; B010C points to the actuator or its circuit. The camera tied to C is unpublished, as is any maker use of the code."
    de: "B010C bezeichnet Aktor C. Frontkameras sitzen im Kühlergrill und haben eine eigene Düse. Fords TSB 20-2267 (2020) gilt für F-150 2015–2020 außer Raptor, Super Duty 2017–2020 und Expedition 2018–2020 mit Frontkamera-Wascher: Die Düse tropfte im Ruhezustand wegen ihrer inneren Gummidichtung; Abhilfe ist eine neue Düse, wofür der Grill herunter muss und die 360-Grad-Kamera danach neu ausgerichtet wird. Asmos Anmeldung US20110292212A1 begründet, warum solche Düsen ein Rückschlagventil tragen: Es öffnet nur unter Pumpendruck, damit weder Flüssigkeit auf die Linse läuft noch Luft in die Leitung kommt. Eine undichte Dichtung erzeugt allein keinen elektrischen Code; B010C deutet auf den Aktor oder seinen Stromkreis. Die Kamera zu C bleibt offen, ebenso eine Herstellernutzung des Codes."
  affected_components:
    - camera_washer_actuator_c
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: front_actuator_wiring
      likelihood: high
      label:
        en: Damaged wiring or plug at the front end, exposed to stone chips, water and salt
        de: Beschädigte Leitung oder Stecker im Frontbereich, ausgesetzt Steinschlag, Wasser und Salz
    - id: actuator_c_failed
      likelihood: medium
      label:
        en: Pump or valve C seized or electrically defective
        de: Pumpe oder Ventil C festgegangen oder elektrisch defekt
    - id: front_end_repair
      likelihood: low
      label:
        en: Plug left disconnected after grille or bumper work
        de: Stecker nach Arbeiten an Grill oder Stoßfänger nicht wieder aufgesteckt
  symptoms:
    - en: Front camera lens is not sprayed when the wash is requested
      de: Frontkameralinse wird bei Waschanforderung nicht bespritzt
    - en: Front or 360-degree camera image stays dirty in winter or after off-road driving
      de: Bild der Front- bzw. 360-Grad-Kamera bleibt im Winter oder nach Geländefahrt verschmutzt
  repair:
