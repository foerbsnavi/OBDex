- code: B0038
  category: body
  title:
    en: Second Row Right Side Airbag Deployment Control
    de: Seitenairbag zweite Sitzreihe rechts Auslösesteuerung
  description:
    en: "B0038 watches the firing loop of the side airbag for the right-hand second-row seat, fitted in the rear door trim or in the outer bolster of the rear backrest. Mitsubishi lists it as rear side airbag module RH with exactly this J2012 wording and logs B0038-12 when the circuit has been shorted to supply for 2 seconds. On Mercedes-Benz compact models (A-Class, CLA, GLB) B003813 is an open squib in the right rear sidebag. A GM patent family keeps rear-row side bags on their own gas generators, separate from the front-row system. GM's Saab 9-4X 2011 manual lists B0038 in the same procedure as its front seat side bags. Left twin: B0030. The airbag lamp is lit."
    de: "B0038 überwacht den Zündkreis des Seitenairbags für den rechten Platz der zweiten Sitzreihe, eingebaut in der hinteren Türverkleidung oder in der äußeren Wange der Rücksitzlehne. Mitsubishi führt ihn genau mit diesem J2012-Wortlaut als hinteres Seitenairbagmodul rechts und speichert B0038-12, wenn der Kreis 2 Sekunden lang Schluss nach Plus hat. Bei den kompakten Mercedes-Benz-Modellen (A-Klasse, CLA, GLB) bedeutet B003813 eine offene Zündpille im rechten hinteren Sidebag. Eine GM-Patentschrift gibt den Seitenairbags der hinteren Reihe eigene Gasgeneratoren, getrennt vom System vorn. Die Saab-9-4X-Werkstattanleitung von 2011 behandelt B0038 zusammen mit den Vordersitz-Seitenairbags. Linkes Gegenstück: B0030. Die Airbag-Leuchte leuchtet."
  affected_components:
    - second_row_right_side_airbag
    - squib_circuit
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: rear_door_or_seat_connector
      likelihood: high
      label:
        en: Poor contact at the rear side airbag connector in the door or rear seat
        de: Schlechter Kontakt am hinteren Seitenairbagstecker in Tür oder Rücksitz
    - id: rear_side_airbag_fault
      likelihood: medium
      label:
        en: Internal fault in the right rear side airbag module
        de: Innerer Fehler im rechten hinteren Seitenairbagmodul
    - id: short_to_supply
      likelihood: low
      label:
        en: Lead chafed against a powered wire, e.g. at the rear seat fold or B-pillar
        de: Leitung an einer spannungsführenden Leitung durchgescheuert, z. B. an Rücksitzklappung oder B-Säule
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right rear passenger may lack side airbag protection
      de: Fahrgast hinten rechts hat womöglich keinen Seitenairbagschutz
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
