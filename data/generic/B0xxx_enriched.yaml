      de: Fahrerairbag zündet womöglich mit fester statt angepasster Stufe
    - en: "Safety note: airbag system; unplug seat and sensor connectors only de-energised (ignition off, battery off, wait time); calibrate the sensor after replacement, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Sitz- und Sensorstecker nur spannungsfrei trennen (Zündung aus, Batterie ab, Wartezeit); Sensor nach dem Tausch kalibrieren, nur Fachwerkstatt"
