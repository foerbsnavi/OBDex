- code: B0097
  category: body
  title:
    en: Right Side Restraints Sensor 2
    de: Seitencrashsensor rechts 2
  description:
    en: "B0097 is the second right-side crash sensor. Mitsubishi fixes it at the right B-pillar, lists it as B-PILLAR SAT SEN RH and gives Right Side Restraints Sensor 2 as the J2012 name. Only subtype -55 appears there: the unit flags, after two seconds with the ignition on, that the stored configuration does not match the fitted sensors. Honda's request AER17060A confirms the numbering with B0097-87, meaning the second right side impact sensor has gone quiet on 2016–2017 Fit and HR-V cars. On a pillar an acceleration satellite is the usual choice; Bosch fits such units to B- and C-pillars, sills or seat cross members. Not every maker uses this code: FCA reports its right B-pillar acceleration sensor on the 2025 Ram 1500 as B2764, and Saab 9-3/9-5 use B0097 for the driver belt buckle switch circuit. While stored, the airbag lamp stays on."
    de: "B0097 ist der zweite Crashsensor rechts. Mitsubishi befestigt ihn an der rechten B-Säule, führt ihn als B-PILLAR SAT SEN RH und nennt als J2012-Bezeichnung Right Side Restraints Sensor 2. Belegt ist dort nur der Untertyp -55: Nach zwei Sekunden bei Zündung an meldet das Steuergerät, dass seine gespeicherte Konfiguration nicht zu den verbauten Sensoren passt. Honda bestätigt die Zählung mit B0097-87, kein Signal vom zweiten rechten Seitenaufprallsensor (Fit/HR-V 2016–2017). An einer Säule sitzt meist ein Beschleunigungs-Satellit; Bosch montiert solche an B- und C-Säule, Schweller oder Sitzquerträger. Nicht jeder nutzt den Code: FCA meldet den rechten B-Säulen-Sensor beim Ram 1500 (2025) als B2764, Saab 9-3/9-5 belegen B0097 mit dem Gurtschloss-Schalterkreis des Fahrers. Die Airbag-Leuchte bleibt an."
  affected_components:
    - right_side_impact_sensor_2
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: module_configuration
      likelihood: high
      label:
        en: Airbag unit configuration not matching the fitted sensors, e.g. after unit replacement (Mitsubishi subtype -55)
        de: Konfiguration des Airbag-Steuergeräts passt nicht zu den verbauten Sensoren, etwa nach Gerätetausch (Mitsubishi Untertyp -55)
    - id: pillar_connector_fault
      likelihood: medium
      label:
        en: Plug at the right B-pillar sensor loose or damaged after trim or seat belt work
        de: Stecker am rechten B-Säulen-Sensor nach Verkleidungs- oder Gurtarbeiten lose oder beschädigt
    - id: pillar_sensor_no_signal
      likelihood: medium
      label:
        en: Right B-pillar sensor sending no signal (Honda subtype -87)
        de: Rechter B-Säulen-Sensor sendet kein Signal (Honda Untertyp -87)
    - id: saab_buckle_switch
      likelihood: low
      label:
        en: On Saab 9-3/9-5, driver belt buckle switch circuit fault (different meaning)
        de: Bei Saab 9-3/9-5 Fehler im Gurtschloss-Schalterkreis Fahrer (andere Bedeutung)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right side impacts near the B-pillar are detected only by the remaining sensors
      de: Seitenaufpralle rechts im Bereich der B-Säule erkennen nur noch die übrigen Sensoren
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before removing pillar trim, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor dem Abnehmen der Säulenverkleidung Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
