        de: Defekter Hallschalter im Mittelgurtschloss
  symptoms:
    - en: Airbag or rear belt warning lamp on
      de: Airbag- oder Gurtwarnleuchte hinten an
    - en: Middle rear seat shown wrongly in the belt status display
      de: Mittlerer Rücksitz wird in der Gurtanzeige falsch dargestellt
    - en: "Safety note: buckle plugs under the rear bench lie close to pretensioner wiring; only unplug them with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Gurtschlossstecker unter der Rückbank liegen nahe der Strafferverkabelung; nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
