- code: B0025
  category: body
  title:
    en: Left Side Deployment Stage 2 Control
    de: Seitenairbag links Stufe 2 Auslösesteuerung
  description:
    en: "No public J2012 code list contains B0025, and no manufacturer publicly describes a second stage of a left side airbag under this number. The only trace is at General Motors: the Saab 9-4X 2011 manual groups B0025 with the roof rail airbag codes B0016 and B0023 but gives no descriptor for it. Two-stage side airbags are rare in any case. A Ford patent notes that thorax, pelvis and head bags usually have a single inflation setting because of their small size, and the dual-chamber side airbag described by Autoliv divides one cushion into chest and pelvis zones rather than firing twice. If B0025 appears, the descriptor and module name on the scan tool decide what is meant. Airbag lamp on; the affected bag may not deploy."
    de: "B0025 steht in keiner öffentlichen J2012-Liste, und kein Hersteller beschreibt unter dieser Nummer eine zweite Stufe des linken Seitenairbags. Die einzige Spur führt zu General Motors: Das Handbuch des Saab 9-4X 2011 fasst B0025 mit den Dachrahmen-Kopfairbag-Codes B0016 und B0023 zusammen, nennt aber keinen Klartext dazu. Zweistufige Seitenairbags sind ohnehin selten. Ein Ford-Patent hält fest, dass Thorax-, Becken- und Kopfairbags wegen ihrer geringen Größe meist nur eine Füllart kennen, und der von Autoliv beschriebene Zweikammer-Seitenairbag teilt ein Kissen in Brust- und Beckenbereich, statt zweimal zu zünden. Taucht B0025 auf, entscheiden Klartext und Steuergerätename im Tester, was gemeint ist. Airbag-Leuchte an; der betroffene Airbag löst womöglich nicht aus."
  affected_components:
    - driver_side_airbag
    - srs_control_module
  common_causes:
    - id: squib_circuit_fault
      likelihood: medium
      label:
        en: Open, shorted or high-resistance squib loop of the airbag the module assigns to this code
        de: Offener, kurzgeschlossener oder hochohmiger Zündkreis des Airbags, den das Steuergerät diesem Code zuordnet
    - id: connector_lock_unseated
      likelihood: medium
      label:
        en: Connector or its position lock not fully engaged
        de: Stecker oder Steckersicherung nicht vollständig eingerastet
    - id: srs_module_fault
      likelihood: low
      label:
        en: Fault or unsuitable software in the restraint control module
        de: Fehler oder unpassende Software im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Side or curtain protection may be reduced on the affected side
      de: Seiten- bzw. Kopfschutz auf der betroffenen Seite eventuell eingeschränkt
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
