- code: B00C9
  category: body
  title:
    en: Passenger Seat Occupant Position Sensor C
    de: Beifahrersitz Insassenpositionssensor C
  description:
    en: "B00C9 names position sensor C of the passenger seat, and no carmaker lists it publicly. One concept for a third input watches the gap between torso and seat back: a patent first filed by Automotive Systems Laboratory in 1998, now with Joyson, pairs an electric field sensor in the cushion with a capacitive or radar proximity sensor in the back, aimed at the band about 10 to 18 inches above the cushion. While the torso rests within about 2 inches of the back the bag may fire; if it has been away by more than that for over 50 ms, the bag is disabled. If the back sensor keeps seeing someone the cushion sensor misses, the patent treats that as a fault. FMVSS 208 leaves the choice of such sensors to the maker. B00C9 lights the airbag lamp."
    de: "B00C9 bezeichnet Positionssensor C des Beifahrersitzes; kein Hersteller führt ihn öffentlich. Ein Konzept für einen dritten Eingang beobachtet den Abstand zwischen Rumpf und Lehne: Ein 1998 von Automotive Systems Laboratory eingereichtes Patent, heute bei Joyson, kombiniert einen Feldsensor im Polster mit einem kapazitiven oder Radar-Näherungssensor in der Lehne, gerichtet auf den Bereich etwa 10 bis 18 Zoll über dem Polster. Liegt der Rumpf bis etwa 2 Zoll an der Lehne, darf der Airbag zünden; war er länger als 50 ms weiter entfernt, wird er gesperrt. Sieht der Lehnensensor dauerhaft jemanden, den der Polstersensor nicht erkennt, wertet das Patent dies als Fehler. FMVSS 208 überlässt die Wahl solcher Sensoren dem Hersteller. B00C9 schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_occupant_position_sensor_c
    - srs_seat_wiring
    - occupant_position_module
  common_causes:
    - id: seat_back_sensor_wiring
      likelihood: high
      label:
        en: Lead to the seat back sensor broken at the hinge or after trim work
        de: Leitung zum Lehnensensor am Gelenk oder nach Arbeiten an der Verkleidung gebrochen
    - id: sensor_c_fault
      likelihood: medium
      label:
        en: Proximity sensor C faulty or its signal disagrees with the cushion sensor
        de: Näherungssensor C defekt oder sein Signal widerspricht dem Polstersensor
    - id: thick_covers_or_wetness
      likelihood: low
      label:
        en: Thick accessory covers or a wet seat back weakening the field signal
        de: Dicke Zubehörbezüge oder nasse Lehne schwächen das Feldsignal
  symptoms:
