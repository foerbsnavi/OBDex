- code: B009A
  category: body
  title:
    en: Left Side Restraints Sensor 4
    de: Seitencrashsensor links 4
  description:
    en: "B009A extends the left-side sensor row past the three positions most cars use. No carmaker documents this code publicly. Mitsubishi's airbag index ends the left row at B0093 (C-pillar), and FCA numbers its pillar satellites in its own B276x range, so neither fills the fourth slot. A fourth left sensor makes sense on long bodies or extra seat rows: Bosch says its acceleration satellites can sit on sills, seat cross members, B- and C-pillars and also in the rear, while pressure sensors watch a door cavity. If a vehicle sets B009A, the airbag module has lost a plausible signal from that added satellite or found it shorted, open or wrongly configured; the matching subtype and location must be taken from the maker's own airbag documentation. The airbag lamp comes on."
    de: "B009A setzt die linke Sensorreihe über die drei Plätze hinaus fort, die die meisten Autos nutzen. Kein Hersteller dokumentiert diesen Code öffentlich. Der Airbag-Index von Mitsubishi endet links bei B0093 (C-Säule), FCA nummeriert seine Säulensatelliten im eigenen Bereich B276x – den vierten Platz belegt also keiner. Ein vierter Sensor links lohnt sich bei langen Karosserien oder zusätzlichen Sitzreihen: Laut Bosch sitzen Beschleunigungs-Satelliten an Schweller, Sitzquerträger, B- und C-Säule oder im Heck, Drucksensoren überwachen einen Türhohlraum. Setzt ein Fahrzeug B009A, bekommt das Airbag-Steuergerät von diesem Satelliten kein plausibles Signal oder erkennt Kurzschluss, Unterbrechung oder falsche Konfiguration; Untertyp und Einbauort stehen nur in der Herstellerdokumentation. Die Airbag-Leuchte geht an."
  affected_components:
    - left_side_restraints_sensor_4
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sensor_harness_fault
      likelihood: high
      label:
        en: Damaged line or plug to the fourth left sensor, often after seat or trim removal
        de: Beschädigte Leitung oder Stecker zum vierten Sensor links, oft nach Sitz- oder Verkleidungsausbau
    - id: satellite_fault
      likelihood: medium
      label:
        en: Internal fault of the fourth left crash satellite
        de: Interner Fehler des vierten linken Crash-Satelliten
    - id: module_configuration
      likelihood: low
      label:
        en: Airbag module coded for a sensor layout the vehicle does not have
        de: Airbag-Steuergerät für eine Sensorbestückung codiert, die das Fahrzeug nicht hat
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left side impact detection in the area of the missing sensor is weaker
      de: Seitencrash-Erkennung links im Bereich des ausgefallenen Sensors ist schwächer
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before any work on sensors or wiring, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten an Sensoren oder Leitungen Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
