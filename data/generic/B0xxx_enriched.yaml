- code: B0110
  category: body
  title:
    en: Camera Washer Actuator G
    de: Kamera-Wascher-Aktuator G
  description:
    en: "B0110 names actuator G. Not every washed camera sees visible light. Bentley's product information 2051045 (2023) concerns the infrared night-vision camera in the front bumper of Bentayga, Continental GT/GTC and Flying Spur: fluid dripping from its washer jet is cured by a new non-return valve, and the camera needs recalibrating only if it is replaced itself. An earlier note (2021) replaced the short link hose between that jet and its supply connector instead. Valeo's cleaning range likewise lists infrared cameras next to visible cameras and lidar. Whether G stands for a night-vision camera is not published, and no manufacturer documents B0110. If set, the night-vision image may blur in rain or slush."
    de: "B0110 bezeichnet Aktor G. Nicht jede gewaschene Kamera arbeitet mit sichtbarem Licht. Bentleys Produktinformation 2051045 (2023) betrifft die Infrarot-Nachtsichtkamera im vorderen Stoßfänger von Bentayga, Continental GT/GTC und Flying Spur: Tropft Flüssigkeit aus ihrer Waschdüse, hilft ein neues Rückschlagventil, und die Kamera muss nur neu kalibriert werden, wenn sie selbst getauscht wird. Eine frühere Mitteilung (2021) ersetzte stattdessen den kurzen Verbindungsschlauch zwischen Düse und Zuleitungsanschluss. Auch Valeo nennt in seinem Reinigungsangebot Infrarotkameras neben sichtbaren Kameras und Lidar. Ob G für eine Nachtsichtkamera steht, ist nicht veröffentlicht, und kein Hersteller dokumentiert B0110. Ist er gesetzt, kann das Nachtsichtbild bei Regen oder Schneematsch verschwimmen."
  affected_components:
    - camera_washer_actuator_g
    - night_vision
    - actuator_wiring
  common_causes:
    - id: actuator_g_electrical
      likelihood: high
      label:
        en: Valve or pump G for the camera jet electrically open or shorted
        de: Ventil oder Pumpe G der Kameradüse elektrisch unterbrochen oder kurzgeschlossen
    - id: bumper_harness_g
      likelihood: medium
      label:
        en: Harness damage in the lower bumper area after a parking knock or repair
        de: Kabelbaumschaden im unteren Stoßfängerbereich nach Parkrempler oder Reparatur
    - id: module_fault_g
      likelihood: low
      label:
        en: Output stage of the controlling module defective
        de: Ausgang des ansteuernden Steuergeräts defekt
  symptoms:
    - en: Night-vision or front camera image stays smeared; the camera jet does not spray
      de: Bild der Nachtsicht- oder Frontkamera bleibt verschmiert; die Kameradüse spritzt nicht
    - en: Assistance functions relying on that camera may report limited availability
      de: Assistenzfunktionen, die diese Kamera nutzen, melden eventuell eingeschränkte Verfügbarkeit
  repair:
