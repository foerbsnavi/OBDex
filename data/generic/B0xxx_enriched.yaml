      likelihood: high
      label:
        en: Open or poor contact in the driver seat harness or plug to input A
        de: Unterbrechung oder schlechter Kontakt im Fahrersitz-Kabelbaum bzw. Stecker zu Eingang A
    - id: mat_damage
      likelihood: medium
      label:
        en: Cushion sensor mat creased or damaged, e.g. after seat cover work
        de: Sensormatte im Polster geknickt oder beschädigt, z. B. nach Bezugsarbeiten
