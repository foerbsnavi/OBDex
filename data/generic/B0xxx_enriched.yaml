- code: B0117
  category: body
  title:
    en: Camera Washer Actuator O
    de: Kamera-Wascher-Aktuator O
  description:
    en: "B0117 names actuator O; unlike I, the letter O is used in this row. Not every silent washer is faulty. Continental's patent US11673532B2 (granted 2023, now held by Aumovio) lets the controller hold back the camera valves on purpose: in an off-road mode only selected cameras are washed, and with four-wheel drive engaged below about 20 km/h all valves stay shut so mud does not use up the fluid; a timed mode washes at most once per interval, two or five minutes in the examples. AUMOVIO also clears dust with air alone to save fluid. A deliberately inhibited actuator should set no code; B0117 indicates a fault in actuator O itself. Which camera O means is not published, and no manufacturer documents B0117."
    de: "B0117 bezeichnet Aktor O; anders als I wird O in dieser Reihe verwendet. Nicht jeder stumme Wascher ist defekt. Continentals Patent US11673532B2 (erteilt 2023, heute bei Aumovio) lässt das Steuergerät die Kameraventile absichtlich zurückhalten: Im Geländemodus werden nur ausgewählte Kameras gewaschen, und bei zugeschaltetem Allrad unter etwa 20 km/h bleiben alle Ventile zu, damit Schlamm nicht die Flüssigkeit aufbraucht; ein Zeitmodus wäscht höchstens einmal je Intervall, in den Beispielen zwei oder fünf Minuten. AUMOVIO entfernt Staub zudem nur mit Luft, um Flüssigkeit zu sparen. Ein absichtlich gesperrter Aktor sollte keinen Code setzen; B0117 deutet auf einen Fehler an Aktor O selbst. Welche Kamera O meint, ist nicht veröffentlicht, und kein Hersteller dokumentiert B0117."
