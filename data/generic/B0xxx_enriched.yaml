        en: Open, shorted or corroded line or plug to the fifth right sensor, often after door or trim work
        de: Unterbrochene, kurzgeschlossene oder korrodierte Leitung bzw. Stecker zum fünften Sensor rechts, oft nach Arbeiten an Tür oder Verkleidung
    - id: satellite_fault
      likelihood: medium
      label:
        en: Internal fault of the fifth right crash sensor (pressure or acceleration type)
        de: Interner Fehler des fünften rechten Crashsensors (Druck- oder Beschleunigungsausführung)
