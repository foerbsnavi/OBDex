- code: B007A
  category: body
  title:
    en: Passenger Seat Belt Pretensioner B Deployment Control
    de: Beifahrer-Gurtstraffer B Auslösesteuerung
  description:
    en: B007A is the passenger-side twin of B0079 and covers the second pretensioner on the front passenger seat. Mercedes lists B007A13 for an open in the squib of the passenger's belt end fitting tensioner on the A-, CLA- and GLB-Class and keeps the passenger retractor apart as B007F. A lap or anchor pretensioner of this kind fires together with the retractor unit, as Joyson explains for its lap pretensioner, and draws the lap belt down onto the pelvis to cut the risk of sliding under it. Mitsubishi files comparable lap pretensioners under its own codes B1001 and B1002 rather than in J2012 slots, so B007A is not expected there. Once B007A is set, the airbag lamp comes on and the module records that the passenger's lap tensioning is unavailable.
    de: B007A ist das Gegenstück zu B0079 auf der Beifahrerseite und betrifft den zweiten Gurtstraffer am Beifahrersitz. Mercedes führt B007A13 bei A-, CLA- und GLB-Klasse für eine Unterbrechung an der Zündpille des Endbeschlagstraffers des Beifahrers; den Aufrollerstraffer dieses Platzes hält es getrennt unter B007F. Ein solcher Becken- oder Verankerungsstraffer zündet zusammen mit dem Aufroller – so beschreibt es Joyson für seinen Beckengurtstraffer – und zieht den Beckengurt aufs Becken, damit der Insasse nicht darunter durchrutscht. Mitsubishi legt vergleichbare Beckengurtstraffer unter eigenen Codes (B1001, B1002) ab statt auf J2012-Plätzen; dort ist B007A nicht zu erwarten. Ist B007A gesetzt, leuchtet die Airbag-Lampe, und das Steuergerät vermerkt, dass die Beckenstraffung am Beifahrerplatz fehlt.
  affected_components:
    - passenger_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: end_fitting_connector
      likelihood: high
      label:
        en: Plug at the passenger end fitting tensioner disturbed, e.g. after seat removal
        de: Stecker am Endbeschlagstraffer des Beifahrers gelöst, etwa nach Sitzausbau
    - id: harness_pinched
      likelihood: medium
      label:
        en: Lead to the lap tensioner pinched under the passenger seat
        de: Leitung zum Beckengurtstraffer unter dem Beifahrersitz eingeklemmt
    - id: squib_internal
      likelihood: low
      label:
        en: Internal fault of the passenger lap tensioner
        de: Interner Fehler des Beckengurtstraffers am Beifahrersitz
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger's lap belt not tightened in a crash, higher risk of sliding under it
      de: Beckengurt des Beifahrers wird nicht gestrafft, höheres Risiko des Durchrutschens
    - en: "Safety note: pyrotechnic tensioner next to the seat; disconnect the battery, observe the wait time, have a specialist workshop do the repair"
      de: "Sicherheitshinweis: pyrotechnischer Straffer neben dem Sitz – Batterie abklemmen, Wartezeit beachten, Reparatur durch eine Fachwerkstatt"
  repair:
    difficulty: shop_only
