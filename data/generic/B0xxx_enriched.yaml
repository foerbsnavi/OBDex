- code: B0049
  category: body
  title:
    en: Third Row Right Frontal Stage 1 Deployment Control
    de: Frontairbag dritte Sitzreihe rechts Stufe 1 Auslösesteuerung
  description:
    en: B0049 marks the stage 1 charge of a right third-row frontal bag, the main charge of a bag that would have to come out of the second-row seatback ahead of it. Daimler's application for a bag mounted behind a front seat and Mercedes-Benz's later design with chambers that bridge a changing seat gap show how such a bag can be built; in series, Mercedes offers rear frontal airbags only for the outer second-row seats of its S-Class and Maybach models. No carmaker documents B0049 and no bulletin cites it. A third-row frontal code on a vehicle without that equipment points to a module set up for the wrong variant. Airbag lamp on.
    de: B0049 kennzeichnet Stufe 1 eines Frontairbags für den rechten Platz der dritten Reihe, also die Hauptladung eines Airbags, der aus der Lehne des davor stehenden Sitzes der zweiten Reihe kommen müsste. Die Daimler-Anmeldung für einen Airbag hinter einem Vordersitz und der spätere Mercedes-Benz-Entwurf mit Kammern, die einen wechselnden Sitzabstand überbrücken, zeigen den möglichen Aufbau; in Serie bietet Mercedes Fond-Frontairbags nur für die äußeren Plätze der zweiten Reihe in S-Klasse und Maybach an. Kein Hersteller dokumentiert B0049, kein Bulletin nennt ihn. Ein Frontcode der dritten Reihe an einem Fahrzeug ohne diese Ausstattung deutet auf ein Steuergerät mit falscher Variantencodierung. Airbag-Leuchte an.
  affected_components:
    - third_row_right_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: config_mismatch
      likelihood: low
