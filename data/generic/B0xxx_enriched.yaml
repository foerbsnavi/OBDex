- code: B012C
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet Control Module "A"
    de: DC/AC-Wandler A Hochvolt-Steckdosen-Steuermodul „A“
  description:
    en: B012C names power outlet control module A of converter A without a fault type, so the module itself is under suspicion rather than one socket. Ford calls its unit DCACA; on the F-150 with the 2.0 kW system it sits in the cab under the left rear seat. Ford's SSM 50167 traced a loud fan on early 2021 builds to DCACA software, and SSM 52213 for 2022–2023 F-150 and 2023 Super Duty a dealer-service message with P0A93:96 stored in the DCACA; both were cured by reprogramming. Neither bulletin mentions B012C, and no manufacturer documents the code; it is open whether module A means the inverter itself or a separate outlet controller. Usually all outlets of the converter are unavailable.
    de: B012C nennt Steckdosen-Steuermodul A von Wandler A ohne Fehlerart; verdächtig ist also das Modul selbst, nicht eine einzelne Steckdose. Ford nennt seine Einheit DCACA; beim F-150 mit 2,0-kW-System sitzt sie im Innenraum unter dem linken Rücksitz. Fords SSM 50167 führte einen lauten Lüfter bei frühen Fahrzeugen von 2021 auf DCACA-Software zurück, SSM 52213 zu F-150 2022–2023 und Super Duty 2023 eine Werkstatt-Meldung mit P0A93:96 im DCACA; beides behob eine Neuprogrammierung. Keines der Bulletins nennt B012C, und kein Hersteller dokumentiert den Code; offen bleibt, ob Modul A den Wechselrichter selbst oder eine eigene Steckdosensteuerung meint. Meist fallen alle Steckdosen des Wandlers aus.
  affected_components:
    - hv_outlet_module_a
    - dc_ac_converter_module_a
  common_causes:
    - id: module_a_software
      likelihood: high
      label:
        en: Outdated or corrupted module software; reprogramming per maker bulletin
        de: Veraltete oder beschädigte Modulsoftware; Neuprogrammierung nach Herstellerbulletin
    - id: module_a_supply_comm
      likelihood: medium
      label:
        en: Power, ground or network connection of module A faulty
        de: Versorgung, Masse oder Netzwerkverbindung von Modul A gestört
    - id: module_a_internal
      likelihood: low
      label:
        en: Module A internally defective, e.g. cooling fan or power stage
        de: Modul A intern defekt, etwa Lüfter oder Leistungsteil
  symptoms:
    - en: Onboard power unavailable or service message in the centre display
      de: Bordnetzstrom nicht verfügbar oder Service-Meldung im Zentralbildschirm
    - en: Unusual fan noise from the module's location
      de: Ungewöhnliches Lüftergeräusch am Einbauort des Moduls
    - en: Module handles 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Modul verarbeitet 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [100, 2500]
    estimated_hours: [0.5, 3]
