- code: B00B6
  category: body
  title:
    en: Driver Seat Recline Position Restraints Sensor
    de: Fahrersitz-Lehnenpositionssensor (Rückhaltesystem)
  description:
    en: "B00B6 concerns a sensor that tells the restraint system how far the backrest of the driver seat is reclined. No carmaker documents this code publicly, and the NHTSA bulletin index has no entry for it. Patents show why the angle matters: an ATI patent lets the controller suppress or depower the airbag from seat position, back angle and belt spool-out alone, without looking at the occupant, and a Bosch application derives the tilt from a three-axis accelerometer in the seat back, uses a 45 degree limit to decide which airbags fire and feeds the angle into occupant classification. Autoliv even calibrated its classification mat at several back angles. If B00B6 is stored the module loses that input; the airbag lamp stays on until the sensor or its circuit is repaired."
    de: "B00B6 betrifft einen Sensor, der dem Rückhaltesystem meldet, wie weit die Fahrersitzlehne geneigt ist. Kein Hersteller dokumentiert den Code öffentlich, und im NHTSA-Bulletinindex fehlt er ganz. Patente zeigen, warum der Winkel zählt: Ein ATI-Patent lässt das Steuergerät den Airbag allein aus Sitzposition, Lehnenwinkel und Gurtauszug sperren oder schwächer zünden, ohne den Insassen selbst zu erfassen; eine Bosch-Anmeldung bestimmt die Neigung mit einem Dreiachs-Beschleunigungssensor in der Lehne, entscheidet an einer 45-Grad-Grenze, welche Airbags zünden, und gibt den Winkel an die Insassenklassifizierung weiter. Autoliv hat seine Klassifizierungsmatte sogar bei mehreren Lehnenwinkeln abgeglichen. Ist B00B6 gespeichert, fehlt dem Steuergerät dieser Eingang; die Airbag-Leuchte bleibt an, bis Sensor oder Leitung instand gesetzt sind."
  affected_components:
    - driver_recline_sensor
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: harness_at_hinge
      likelihood: high
      label:
        en: Lead pinched or broken at the seat back hinge, where it flexes with every adjustment
        de: Leitung am Lehnengelenk eingeklemmt oder gebrochen, wo sie bei jeder Verstellung gebogen wird
    - id: sensor_fault
      likelihood: medium
      label:
        en: Internal fault or loose mounting of the recline sensor
        de: Interner Fehler oder lockere Befestigung des Lehnensensors
    - id: calibration_missing
      likelihood: low
      label:
        en: Sensor or seat back replaced without the required zero setting
        de: Sensor oder Lehne ohne den nötigen Nullabgleich getauscht
  symptoms:
