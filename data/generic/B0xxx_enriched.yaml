- code: B0100
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator A
    de: Sensorreinigung Luftgebläse-Aktuator A
  description:
    en: B0100 is the general fault for air blower A in a sensor cleaning system, i.e. the fan or motor unit itself rather than its wiring or relay (those are B0102 and B0104). Such blowers keep camera lenses and lidar windows clear of droplets, dust and insects. Ford's patent US12115948B2 mounts a blower on the sensor bracket; it pulls outside air through an intake duct and pushes it out across a cylindrical lidar window and a camera lens. In Ford's roof-mounted sensor tiara for its self-driving test fleet, slots release an air curtain that deflects most bugs, and air also dries a lens after washing. Which blower is A is up to the maker. No vehicle manufacturer documents B0100 publicly. A dead blower lets dirt build up until the sensor reports itself blocked.
    de: B0100 ist der Sammelfehler für Luftgebläse A einer Sensorreinigung, also für Lüfter oder Motoreinheit selbst und nicht für Ansteuerleitung oder Relais (dafür B0102 und B0104). Solche Gebläse halten Kameralinsen und Lidar-Fenster frei von Tropfen, Staub und Insekten. Fords Patent US12115948B2 setzt ein Gebläse an den Sensorhalter; es saugt Außenluft durch einen Ansaugkanal und bläst sie über ein zylindrisches Lidar-Fenster und eine Kameralinse. Beim Sensorträger („Tiara“) auf dem Dach von Fords Versuchsfahrzeugen für autonomes Fahren erzeugen Schlitze einen Luftvorhang, der die meisten Insekten ablenkt; Luft trocknet die Linse auch nach dem Waschen. Welches Gebläse A heißt, legt der Hersteller fest. Öffentlich dokumentiert kein Fahrzeughersteller B0100. Fällt das Gebläse aus, sammelt sich Schmutz, bis der Sensor sich als verdeckt meldet.
  affected_components:
    - sensor_cleaning_air_blower_a
    - object_detection_maintenance_module_a
  common_causes:
    - id: blower_motor_failure
      likelihood: high
      label:
        en: Blower A motor worn, seized or with an open winding
        de: Motor von Gebläse A verschlissen, festgegangen oder Wicklung unterbrochen
    - id: impeller_blocked
      likelihood: medium
      label:
        en: Impeller blocked by ice, leaves or debris in the intake duct
        de: Lüfterrad durch Eis, Laub oder Schmutz im Ansaugkanal blockiert
    - id: blower_connector
      likelihood: low
      label:
        en: Corroded or loose plug directly at blower A
        de: Korrodierter oder lockerer Stecker direkt an Gebläse A
  symptoms:
    - en: Sensor blocked or cleaning fault message
      de: Meldung „Sensor blockiert“ oder Störung der Sensorreinigung
    - en: Driver assistance or automated driving functions limited or switched off
      de: Assistenz- oder automatisierte Fahrfunktionen eingeschränkt oder abgeschaltet
    - en: No airflow audible or felt at the sensor outlets
      de: An den Luftauslässen am Sensor kein Luftstrom hörbar oder spürbar
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [100, 900]
    estimated_hours: [0.5, 3]
  flags:
