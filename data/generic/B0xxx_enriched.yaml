- code: B0106
  category: body
  title:
    en: LIDAR Washer Actuator A
    de: LIDAR-Wascher-Aktuator A
  description:
    en: "B0106 opens a row of four lidar washer actuators (A to D). The actuator is whatever delivers fluid to a lidar window: a washer pump or an electromagnetic valve. In Ford's patent US10569746B2 a computer triggers a wash pump for the spray nozzle of a roof lidar, after an air nozzle has run for about 5 s and the window is still more than about 20 % opaque; a wiper follows only if needed. Solero builds 2/2- and 3/2-way valves that send washer fluid to individual nozzles, including lidar. AUMOVIO's lidar nozzles clean the dome with pressurised liquid using the Coanda effect. Which lidar or nozzle the maker calls A is not published, and no carmaker documents B0106. When the wash fails, the lidar may report a blocked view."
    de: "B0106 eröffnet eine Reihe von vier Lidar-Wascheraktoren (A bis D). Aktor ist, was die Flüssigkeit zum Lidar-Fenster bringt: eine Waschpumpe oder ein elektromagnetisches Ventil. In Fords Patent US10569746B2 schaltet ein Rechner die Waschpumpe für die Sprühdüse eines Dach-Lidars, nachdem eine Luftdüse etwa 5 s gelaufen ist und das Fenster noch mehr als rund 20 % trüb ist; ein Wischer folgt nur bei Bedarf. Solero baut 2/2- und 3/2-Wegeventile, die Waschflüssigkeit an einzelne Düsen verteilen, auch für Lidar. Die Lidar-Düsen von AUMOVIO reinigen die Kuppel mit Flüssigkeit unter Druck nach dem Coandă-Effekt. Welches Lidar oder welche Düse der Hersteller A nennt, ist nicht veröffentlicht, und kein Autohersteller dokumentiert B0106. Versagt die Wäsche, kann das Lidar eine verdeckte Sicht melden."
  affected_components:
    - lidar_washer_actuator_a
    - washer_pump
    - object_detection_maintenance_module_a
  common_causes:
    - id: pump_or_valve_a_failure
      likelihood: high
      label:
