- code: B0050
  category: body
  title:
    en: Driver Seat Belt Sensor
    de: Gurtsensor Fahrer
  description:
    en: "B0050 monitors the switch in the driver's belt buckle that tells the restraint module whether the belt is latched; the module uses it for the belt reminder and for choosing the airbag and pretensioner response. Usually a two-wire Hall sensor whose current changes when the steel tongue enters the buckle. FCA documents B0050 with this wording: its 2016-17 parts notes for the Dart, Cherokee and Chrysler 200 list B0050-13 as an open circuit of the driver belt sensor, and TSB 10-001-23 for the 2015-22 Renegade and Fiat 500X lists B0050-13 and B0050-1D (out of range), traced to terminal corrosion at the inline buckle connector under the seat. Mitsubishi uses B0052 for the passenger buckle. The airbag lamp lights."
    de: "B0050 überwacht den Schalter im Gurtschloss des Fahrers, der dem Airbagsteuergerät meldet, ob der Gurt eingerastet ist; das Steuergerät braucht das für den Gurtwarner und für die Wahl der Airbag- und Gurtstrafferreaktion. Meist ist es ein zweiadriger Hallsensor, dessen Strom sich ändert, wenn die Stahlzunge im Schloss steckt. FCA dokumentiert B0050 mit diesem Wortlaut: Teilehinweise von 2016–17 für Dart, Cherokee und Chrysler 200 nennen B0050-13 als offenen Kreis des Fahrergurtsensors, und TSB 10-001-23 für Renegade und Fiat 500X 2015–22 führt B0050-13 und B0050-1D (außerhalb des Bereichs) auf korrodierte Kontakte am Zwischenstecker des Gurtschlosses unter dem Sitz zurück. Mitsubishi nutzt B0052 für das Beifahrergurtschloss. Die Airbag-Leuchte geht an."
  affected_components:
    - seat_belt_buckle_switch
    - srs_seat_wiring
    - seat_harness_connector
    - srs_control_module
  common_causes:
    - id: buckle_inline_connector
      likelihood: high
      label:
        en: Corroded terminals at the inline connector between buckle and seat harness
        de: Korrodierte Kontakte am Zwischenstecker zwischen Gurtschloss und Sitzkabelstrang
    - id: buckle_switch_fault
      likelihood: medium
      label:
        en: Faulty Hall sensor or switch inside the driver buckle
        de: Defekter Hallsensor oder Schalter im Fahrergurtschloss
    - id: seat_track_harness
      likelihood: medium
      label:
        en: Buckle lead pinched or stretched by the seat track
        de: Gurtschlossleitung durch die Sitzschiene eingeklemmt oder gedehnt
    - id: foreign_object_buckle
      likelihood: low
      label:
        en: Foreign object or debris in the buckle confusing the sensor
        de: Fremdkörper im Gurtschloss stört den Sensor
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Belt reminder for the driver may warn wrongly or stay silent
      de: Gurtwarner für den Fahrer warnt womöglich falsch oder gar nicht
    - en: Restraint module may treat the driver as unbelted and adapt airbag and pretensioner firing
      de: Steuergerät behandelt den Fahrer womöglich als nicht angeschnallt und passt Airbag- und Straffer-Auslösung an
    - en: "Safety note: the buckle connector sits under the seat next to the side airbag and pretensioner plugs; disconnect the battery and observe the wait time before unplugging anything"
      de: "Sicherheitshinweis: Der Gurtschlossstecker liegt unter dem Sitz neben Seitenairbag- und Gurtstrafferstecker; vor dem Trennen Batterie abklemmen und Wartezeit einhalten"
  repair:
