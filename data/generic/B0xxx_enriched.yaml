- code: B0032
  category: body
  title:
    en: Second Row Left Frontal Stage 2 Deployment Control
    de: Frontairbag zweite Sitzreihe links Stufe 2 Auslösesteuerung
  description:
    en: "B0032 concerns a second igniter for the rear-seat frontal airbag on the left. A second stage lets the module add gas later or skip it, depending on crash severity and on who sits behind the seat; a Mercedes-Benz filing for a backrest-mounted rear airbag allows separate deployment devices for its chambers so they can fire in sequence. In that car the rear bag's tube frame is filled with compressed gas while its centre takes in outside air. No published DTC table assigns B0032 to this use. GM's Global A modules give the number to the left rear belt pretensioner: the Saab 9-4X 2011 sets it after 2 seconds of a short, an open, above 4.2 ohms or below 1.4 ohms. Airbag lamp on."
    de: B0032 betrifft einen zweiten Zünder des linken Fond-Frontairbags. Mit einer zweiten Stufe kann das Steuergerät je nach Unfallschwere und Insasse hinter dem Sitz später nachfüllen oder darauf verzichten; eine Anmeldung von Mercedes-Benz für einen Airbag in der Vordersitzlehne sieht eigene Auslöseeinheiten für die Kammern vor, damit sie nacheinander zünden. In der S-Klasse wird das Schlauchgerüst mit Druckgas gefüllt, die Mitte saugt Außenluft an. Keine veröffentlichte Codetabelle ordnet B0032 so zu. Die Global-A-Steuergeräte von GM nutzen die Nummer für den Gurtstraffer hinten links; der Saab 9-4X 2011 setzt sie nach 2 Sekunden Schluss, Unterbrechung, über 4,2 Ohm oder unter 1,4 Ohm. Airbag-Leuchte an.
  affected_components:
