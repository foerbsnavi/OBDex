- code: B0021
  category: body
  title:
    en: Left Curtain Deployment Control 1
    de: Kopfairbag links Auslösesteuerung 1
  description:
    en: In the J2012 order B0021 is the first firing loop of the left curtain airbag, the bag that drops from the roof rail over the side windows. Mitsubishi files it under the left curtain module and stores byte 11, 12, 13 or a short to another circuit once the condition has lasted 2 seconds. Mercedes-Benz reads B002113 as an open squib of the left window bag on the A-Class, CLA and GLB, where raised contact resistance at the restraint unit plug was the cause (LI54.21-P-070658). Curtain 1 is the only or front curtain inflator; B0022 is the second one. GM Global A modules use B0021 for the passenger seat side airbag instead, with bulletins on seat harness contact (PI1469, 23-NA-030). Airbag lamp on; the left curtain may not fire.
    de: Nach der J2012-Reihenfolge ist B0021 der erste Zündkreis des linken Kopfairbags, der sich vom Dachrahmen über die Seitenscheiben entfaltet. Mitsubishi ordnet ihn dem linken Curtain-Modul zu und legt Byte 11, 12, 13 oder einen Schluss zu einem anderen Kreis ab, sobald der Zustand 2 Sekunden besteht. Mercedes-Benz liest B002113 bei A-Klasse, CLA und GLB als offene Zündpille des linken Windowbags; Ursache war erhöhter Übergangswiderstand am Stecker des Airbagsteuergeräts (LI54.21-P-070658). Kreis 1 gehört zum einzigen bzw. vorderen Gasgenerator des Vorhangs, B0022 zum zweiten. GM-Steuergeräte der Global-A-Generation nutzen B0021 dagegen für den Seitenairbag im Beifahrersitz (Bulletins PI1469, 23-NA-030). Airbag-Leuchte an; der linke Kopfairbag zündet womöglich nicht.
  affected_components:
    - left_curtain_airbag
    - srs_roof_wiring
    - srs_control_module
  common_causes:
    - id: connector_resistance
      likelihood: high
      label:
        en: Raised contact resistance at the curtain airbag or restraint module connector
        de: Erhöhter Übergangswiderstand am Kopfairbag- oder Steuergerätestecker
    - id: srs_wiring_pillar
      likelihood: medium
      label:
        en: Damaged lead along the A-, B- or C-pillar or the roof rail
        de: Beschädigte Leitung an A-, B-, C-Säule oder Dachrahmen
    - id: curtain_module_fault
      likelihood: medium
      label:
        en: Internal fault in the left curtain airbag module
        de: Innerer Fehler im linken Kopfairbagmodul
    - id: srs_module_fault
      likelihood: low
      label:
        en: Fault or unsuitable software in the restraint control module
        de: Fehler oder unpassende Software im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left curtain airbag may not deploy in a side impact or rollover
      de: Linker Kopfairbag löst bei Seitenaufprall oder Überschlag eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
