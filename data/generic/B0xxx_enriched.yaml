- code: B0053
  category: body
  title:
    en: Second Row Left Seat Belt Sensor
    de: Gurtsensor zweite Sitzreihe links
  description:
    en: "B0053 is the J2012 slot for the buckle sensor at the second row's left seat. Rear buckle sensors drive the rear belt reminder: for vehicles built from September 2028, FMVSS 208 S7.5(c) demands a start-up display of which rear belts are fastened or open and a warning when one is unlatched while driving. No carmaker documents B0053 with this meaning publicly; the closest documented case is Mitsubishi's passenger code B0052, set for an open, shorted or invalid buckle signal lasting 2 seconds. Older GM airbag modules give the number another meaning: the Saab 9-3 and the 2006 Saab 9-5 store B0053 when a deployment was commanded while a firing loop fault was present, a code that cannot be erased after a front airbag deployment."
    de: "B0053 ist der J2012-Platz für den Gurtschlosssensor am linken Sitz der zweiten Reihe. Solche Sensoren speisen die Gurterinnerung hinten: Für Fahrzeuge ab Baudatum September 2028 verlangt FMVSS 208 S7.5(c), dass beim Start für jeden Rücksitz angezeigt wird, welche Gurte angelegt sind oder nicht, und dass eine Warnung kommt, wenn während der Fahrt einer geöffnet wird. Mit dieser Bedeutung dokumentiert kein Hersteller B0053 öffentlich; am nächsten liegt Mitsubishis Beifahrercode B0052, der bei einem 2 Sekunden lang offenen, kurzgeschlossenen oder ungültigen Gurtschlosssignal gesetzt wird. Ältere GM-Airbagsteuergeräte belegen die Nummer anders: Saab 9-3 und Saab 9-5 (2006) speichern B0053, wenn eine Auslösung angefordert wurde, während ein Zündkreisfehler vorlag – nach einer Frontairbag-Auslösung lässt er sich nicht löschen."
  affected_components:
    - seat_belt_buckle_switch
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: rear_buckle_connector
      likelihood: high
      label:
        en: Loose or corroded buckle connector under the left rear seat
        de: Lockerer oder korrodierter Gurtschlossstecker unter dem linken Rücksitz
    - id: buckle_sensor_fault
      likelihood: medium
      label:
        en: Faulty switch or Hall sensor in the left rear buckle
        de: Defekter Schalter oder Hallsensor im linken hinteren Gurtschloss
    - id: folding_seat_harness
      likelihood: medium
      label:
        en: Lead damaged by folding or sliding the second-row seat
        de: Leitung durch Umklappen oder Verschieben des Sitzes der zweiten Reihe beschädigt
    - id: gm_deployment_record
      likelihood: low
      label:
        en: "Older GM/Saab module: deployment record with a loop fault, module replacement needed"
        de: "Älteres GM-/Saab-Steuergerät: Auslösevermerk bei Zündkreisfehler, Steuergerät muss getauscht werden"
  symptoms:
    - en: Airbag or rear belt warning lamp on
      de: Airbag- oder Gurtwarnleuchte hinten an
    - en: Rear belt display shows the left seat wrongly as fastened or unfastened
      de: Gurtanzeige hinten zeigt den linken Platz fälschlich als angeschnallt oder offen
    - en: "Safety note: the buckle plug sits under the seat near pretensioner and side airbag plugs; only unplug it with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Der Gurtschlossstecker liegt unter dem Sitz nahe Straffer- und Seitenairbagsteckern; nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
