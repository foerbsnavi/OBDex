- code: B0004
  category: body
  title:
    en: Driver Knee Bolster Deployment Control
    de: Fahrer-Kniepolster (Knieairbag) Auslösesteuerung
  description:
    en: A knee airbag, also called an active knee bolster, sits in the lower dash below the steering column. It fills the space in front of the driver's knees and holds the lower body back in a frontal crash, mainly for unbelted occupants. B0004 reports a fault in its firing loop. Mercedes-Benz stores B000413 for an open squib of the driver kneebag. Ford lists B0004:1A with the passenger knee code B0013 on the 2024 Ranger and traces it to certain airbag connectors, recognisable by a number moulded into the connector lock (TSB 24-2444). In an IIHS study of more than 400 crash tests, knee airbags brought only a small benefit for belted dummies. Still, the restraint module counts the loop as part of the system, and the airbag lamp stays on until the circuit is repaired.
    de: Der Knieairbag, auch aktives Kniepolster genannt, sitzt in der unteren Armaturentafel unter der Lenksäule. Er füllt den Raum vor den Knien des Fahrers und hält den Unterkörper im Frontalaufprall zurück, vor allem bei nicht angeschnallten Insassen. B0004 meldet einen Fehler in seinem Zündkreis. Mercedes-Benz legt B000413 für eine unterbrochene Zündpille des Fahrer-Kniebags ab. Ford nennt B0004:1A zusammen mit dem Beifahrer-Code B0013 beim Ranger 2024 und führt ihn auf bestimmte Airbagstecker zurück, erkennbar an einer Formnummer an der Verriegelung (TSB 24-2444). Eine IIHS-Auswertung von über 400 Crashtests fand für angeschnallte Dummys nur einen kleinen Nutzen. Das Steuergerät überwacht den Kreis trotzdem, die Airbag-Leuchte bleibt bis zur Reparatur an.
  affected_components:
    - knee_airbag_module
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: knee_airbag_connector
      likelihood: high
      label:
        en: Faulty or loose knee airbag connector under the dash (Ford TSB 24-2444)
        de: Fehlerhafter oder loser Knieairbag-Stecker unter der Armaturentafel (Ford TSB 24-2444)
    - id: harness_damage_lower_dash
      likelihood: medium
      label:
        en: Harness pinched or damaged during work below the steering column
        de: Kabelbaum bei Arbeiten unter der Lenksäule eingeklemmt oder beschädigt
    - id: knee_airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the knee airbag module
        de: Innerer Fehler im Knieairbagmodul
  symptoms:
