- code: B0064
  category: body
  title:
    en: Driver Seat Belt Pretensioner Deployment Loop Resistance Low
    de: Gurtstraffer Fahrer Zündkreis Widerstand zu niedrig
  description:
    en: "No J2012 code list we could check includes B0064; there, B0060 names the driver belt tension sensor. Older airbag modules from General Motors do use it: on the 2006 Saab 9-5, B0064 is set when the resistance of the driver pretensioner loop stays below 1.5 ohms, with a 0.2-ohm tolerance, for 2 seconds; B0065 marks an interrupted loop and B0066 a voltage at pin 34 outside 1.0 to 4.1 V. Saab 9-3 manuals of 2003 and 2007 describe the same fault as too little resistance at the driver's belt tensioner. The module still attempts to fire the pretensioner in a crash. GM bulletin 14609 names B0064 among the codes caused by fatigue breaks in the rear door harness of Colorado and Canyon extended cab trucks, model years 2004 to 2009. Airbag lamp on."
    de: "B0064 fehlt in den zugänglichen J2012-Codelisten, in denen B0060 den Gurtkraftsensor des Fahrers bezeichnet. Belegt ist die Nummer bei General Motors in älteren Airbagsteuergeräten: Beim Saab 9-5 (2006) wird B0064 gesetzt, sobald der Widerstand im Zündkreis des Fahrer-Gurtstraffers 2 Sekunden unter 1,5 ± 0,2 Ohm bleibt; B0065 steht dort für Unterbrechung, B0066 für eine Spannung an Pin 34 außerhalb von 1,0 bis 4,1 V. Die Handbücher des Saab 9-3 von 2003 und 2007 führen denselben Fehler als zu niedrigen Widerstand des Fahrer-Gurtstraffers. Bei einem Unfall versucht das Steuergerät trotzdem zu zünden. GM-Bulletin 14609 nennt B0064 unter den Codes bei Colorado und Canyon Extended Cab 2004–09 mit gebrochenen Leitungen im Kabelstrang der hinteren Tür. Airbag-Leuchte an."
  affected_components:
    - driver_seatbelt_pretensioner
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: pretensioner_leads_shorted
      likelihood: high
      label:
        en: Pretensioner leads shorted together, e.g. squashed harness at the B-pillar
        de: Strafferleitungen untereinander kurzgeschlossen, etwa gequetschter Kabelstrang an der B-Säule
    - id: gm_rear_door_harness
      likelihood: medium
      label:
        en: "Colorado/Canyon extended cab: fatigued wires in the rear door harness (bulletin 14609)"
        de: "Colorado/Canyon Extended Cab: ermüdete Leitungen im Kabelstrang der hinteren Tür (Bulletin 14609)"
    - id: pretensioner_connector
      likelihood: medium
      label:
        en: Damaged or contaminated pretensioner connector
        de: Beschädigter oder verschmutzter Strafferstecker
    - id: pretensioner_squib
      likelihood: low
      label:
        en: Internal fault of the driver pretensioner squib
        de: Innerer Fehler der Zündpille im Fahrer-Gurtstraffer
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver belt pretensioner may not work properly in a crash
      de: Fahrer-Gurtstraffer arbeitet bei einem Unfall womöglich nicht richtig
    - en: "Safety note: pretensioner plugs sit at the B-pillar or under the seat; do not probe the loop and only unplug them with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Strafferstecker sitzen an der B-Säule oder unter dem Sitz; Kreis nicht selbst messen, nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
  repair:
