- code: B00D2
  category: body
  title:
    en: Restraint System Malfunction Indicator 1
    de: Rückhaltesystem-Störungsanzeige 1
  description:
    en: "B00D2 means the restraint module has found a fault in the circuit of its primary warning lamp, the airbag or SRS light. FMVSS 208 S4.5.2 requires such a readiness indicator, watching its own readiness and within the driver's view, and FMVSS 101 lets it push other messages out of a shared display. No carmaker publishes B00D2. Saab shows what the check looks like under its own older numbers: on the 1998 9-3, B1227 is set when the lamp output reads above 5 V for 1.25 s, a short to positive that keeps the lamp from its 3 to 4 s bulb check, and B1228 when it reads below 1 V or above 10 kOhm while off, an open or short to ground that turns on the central warning lamp instead. Until fixed, the driver may not see further airbag faults."
    de: "B00D2 bedeutet, dass das Rückhaltesteuergerät einen Fehler im Kreis seiner Hauptwarnleuchte gefunden hat, der Airbag- bzw. SRS-Leuchte. FMVSS 208 S4.5.2 verlangt diese Bereitschaftsanzeige, vom Fahrersitz sichtbar und selbstüberwachend, und FMVSS 101 lässt sie andere Meldungen aus einer geteilten Anzeige verdrängen. Kein Hersteller veröffentlicht B00D2. Saab zeigt unter eigenen, älteren Nummern, wie die Prüfung aussieht: Beim 9-3 von 1998 entsteht B1227, wenn der Lampenausgang 1,25 s lang über 5 V liegt, ein Schluss nach Plus, der die 3 bis 4 s lange Lampenprobe verhindert, und B1228 bei unter 1 V oder über 10 kOhm im ausgeschalteten Zustand, eine Unterbrechung oder ein Masseschluss, bei dem stattdessen die Zentralwarnleuchte angeht. Bis zur Reparatur sieht der Fahrer weitere Airbagfehler womöglich nicht."
  affected_components:
    - srs_indicator_1
    - instrument_cluster
    - srs_control_module
  common_causes:
    - id: lamp_failed
      likelihood: high
      label:
        en: Bulb or LED of the airbag warning lamp failed
        de: Glühlampe oder LED der Airbag-Warnleuchte ausgefallen
    - id: lamp_circuit_short_or_open
      likelihood: medium
      label:
        en: Lamp lead open, shorted to ground or to battery voltage, or loose cluster connector
        de: Lampenleitung unterbrochen, mit Masse oder Batteriespannung kurzgeschlossen, oder lockerer Stecker am Kombiinstrument
    - id: cluster_internal
      likelihood: low
      label:
        en: Internal fault in the instrument cluster circuit board
        de: Interner Fehler auf der Platine des Kombiinstruments
  symptoms:
    - en: Airbag lamp does not come on for the bulb check at ignition-on, or stays on
      de: Airbag-Leuchte macht beim Einschalten keine Lampenprobe oder bleibt an
    - en: A substitute warning such as a central warning lamp or a tone may appear
      de: Eine Ersatzwarnung wie Zentralwarnleuchte oder Warnton kann erscheinen
    - en: "Safety note: airbag faults may go unnoticed; work on cluster and restraint wiring only de-energised (ignition off, battery off, wait time), specialist workshop only"
      de: "Sicherheitshinweis: Airbagfehler bleiben womöglich unbemerkt; an Kombiinstrument und Rückhalteleitungen nur spannungsfrei arbeiten (Zündung aus, Batterie ab, Wartezeit), nur Fachwerkstatt"
  repair:
    difficulty: medium
