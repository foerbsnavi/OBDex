- code: B0112
  category: body
  title:
    en: Camera Washer Actuator J
    de: Kamera-Wascher-Aktuator J
  description:
    en: B0112 covers actuator J; the letter I is skipped in this row, so J is the ninth. Large systems wash many cameras from one fluid network. Stellantis TSB 23-028-23 (2023) for the 2022 Grand Wagoneer and Wagoneer built up to 28 February 2022 names rear backup camera washer, surround-view cameras, night vision and the digital rearview mirror as the equipment involved; when cameras front or rear stop spraying, or fluid leaks behind the fascia, in the headliner or at the liftgate, quick connectors had come apart and are checked push-pull-push. A 2024 reissue repeats the procedure. ARaymond supplies such quick connectors for cleaning circuits. A loose coupling is not electrical; B0112 points to actuator J or its wiring.
    de: B0112 betrifft Aktor J; der Buchstabe I fehlt in dieser Reihe, J ist also der neunte. Große Systeme waschen viele Kameras aus einem Leitungsnetz. Das Stellantis-TSB 23-028-23 (2023) zu Grand Wagoneer und Wagoneer 2022, gebaut bis 28. Februar 2022, nennt Rückfahrkamera-Wascher, Rundumsichtkameras, Nachtsicht und digitalen Innenspiegel als betroffene Ausstattung. Spritzen Kameras vorn oder hinten nicht mehr oder tritt Flüssigkeit hinter der Frontverkleidung, am Dachhimmel oder an der Heckklappe aus, hatten sich Schnellkupplungen gelöst; geprüft wird durch Drücken, Ziehen, Drücken. Eine Neuauflage von 2024 wiederholt das Verfahren. ARaymond liefert solche Schnellkupplungen für Reinigungskreise. Eine lose Kupplung ist kein elektrischer Fehler; B0112 deutet auf Aktor J oder seine Leitung. Welche Kamera J versorgt, ist nicht veröffentlicht.
  affected_components:
    - camera_washer_actuator_j
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: actuator_j_electrical
      likelihood: high
      label:
        en: Valve or pump J electrically open or shorted
        de: Ventil oder Pumpe J elektrisch unterbrochen oder kurzgeschlossen
    - id: leak_into_connector
      likelihood: medium
      label:
        en: Washer fluid from a loose coupling running into the actuator plug and corroding it
        de: Waschflüssigkeit aus einer losen Kupplung läuft in den Aktorstecker und lässt ihn korrodieren
    - id: harness_j
      likelihood: low
      label:
        en: Chafed wire on the route to actuator J
        de: Durchgescheuerte Ader auf dem Weg zu Aktor J
  symptoms:
    - en: One camera of a multi-camera system is not sprayed while others are
      de: Eine Kamera eines Mehrkamerasystems wird nicht bespritzt, die anderen schon
    - en: Damp trim or puddles of washer fluid inside the vehicle if a coupling has also come loose
      de: Feuchte Verkleidung oder Pfützen von Waschflüssigkeit im Innenraum, falls sich auch eine Kupplung gelöst hat
