- code: B00F0
  category: body
  title:
    en: Driver Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt Fahrer Auslösesteuerung
  description:
    en: "B00F0 is the firing circuit for an inflatable belt at the driver's seat: a section of webbing that a gas source fills in a crash so the load spreads over a wider area of the chest. The production inflatable belts known from Ford and Mercedes-Benz sit only at rear outer seats; no carmaker documents B00F0. The idea for front seats is old and well described in patents, for example a Daimler design of 2010 with the gas generator at the lower anchor beside the B-pillar and folded webbing held by tear threads, and an Autoliv design with inflators mounted on the seat back. Joyson also lists a belt-attached restraint supplement among its airbag innovations. If the code is set, the airbag lamp comes on."
    de: B00F0 ist der Zündkreis eines aufblasbaren Gurts am Fahrersitz – ein Gurtabschnitt, den eine Gasquelle bei einem Unfall füllt, damit sich die Last auf eine breitere Brustfläche verteilt. Die bekannten Seriengurte dieser Art von Ford und Mercedes-Benz sitzen nur an den äußeren Rücksitzen; B00F0 dokumentiert kein Hersteller. Für Vordersitze ist die Idee alt und in Patenten gut beschrieben, etwa ein Daimler-Entwurf von 2010 mit Gasgenerator am unteren Anker neben der B-Säule und gefaltetem, durch Reißfäden gehaltenem Gurtband, oder ein Autoliv-Entwurf mit Gasgeneratoren an der Sitzlehne. Auch Joyson führt ein am Gurt befestigtes Zusatz-Rückhaltekissen unter seinen Airbag-Neuheiten. Mit gesetztem Code brennt die Airbag-Lampe.
  affected_components:
    - driver_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Airbag module variant expects a driver inflatable belt that is not fitted
        de: Variante des Airbag-Steuergeräts erwartet einen aufblasbaren Fahrergurt, der nicht verbaut ist
    - id: belt_inflator_connector
      likelihood: medium
      label:
        en: Plug of the belt gas generator at the lower anchor or seat loose or corroded
        de: Stecker des Gurt-Gasgenerators am unteren Anker oder am Sitz locker oder korrodiert
    - id: seat_track_harness
      likelihood: medium
      label:
        en: Lead to the inflator chafed by seat adjustment
        de: Leitung zum Gasgenerator durch Sitzverstellung durchgescheuert
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Igniter of the belt inflator faulty
        de: Zünder des Gurt-Gasgenerators defekt
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver belt would not inflate in a crash
      de: Fahrergurt würde sich bei einem Unfall nicht aufblasen
    - en: "Safety note: the belt contains a pyrotechnic gas generator; work only de-energised (battery off, wait time) and at a specialist workshop"
      de: "Sicherheitshinweis: Der Gurt enthält einen pyrotechnischen Gasgenerator; nur spannungsfrei (Batterie ab, Wartezeit) und in einer Fachwerkstatt arbeiten"
