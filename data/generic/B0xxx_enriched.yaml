- code: B00BB
  category: body
  title:
    en: Driver Seat Occupant Position Sensor E
    de: Fahrersitz Insassenpositionssensor E
  description:
    en: "B00BB is the fifth and last driver seat occupant position sensor in the J2012 block. No carmaker publishes this code. Position need not be measured on the body itself: an ATI patent family dating back to 1992 infers it from the seat, using a potentiometer or other track sensor, a recline angle sensor and belt spool-out from a shaft encoder in the retractor, and may suppress or depower the bag when the seat is fully forward. FMVSS 208 leaves both the suppression zone and the choice of sensors to the maker. Because J2012 already has separate codes for the indirect seat data, B00B5 for the track and B00B6 for the recline, the letter E probably denotes a further direct sensor, though no source confirms it. When B00BB is stored, the airbag lamp is lit."
    de: "B00BB ist der fünfte und letzte Insassenpositionssensor des Fahrersitzes im J2012-Block. Kein Hersteller veröffentlicht diesen Code. Die Position muss nicht am Körper gemessen werden: Eine ATI-Patentfamilie, die bis 1992 zurückreicht, leitet sie vom Sitz ab – mit Potentiometer oder anderem Schienensensor, einem Lehnenwinkelsensor und dem Gurtauszug über einen Drehgeber im Aufroller – und kann den Airbag sperren oder schwächer zünden, wenn der Sitz ganz vorn steht. FMVSS 208 überlässt Abschaltzone und Sensorwahl dem Hersteller. Da J2012 für diese indirekten Sitzdaten eigene Codes hat, B00B5 für die Schiene und B00B6 für die Lehne, meint E vermutlich einen weiteren direkten Sensor; belegt ist das nicht. Ist B00BB gespeichert, brennt die Airbag-Leuchte."
  affected_components:
    - driver_occupant_position_sensor_e
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sensor_harness_fault
      likelihood: high
      label:
        en: Open, shorted or loose lead to position sensor E
        de: Unterbrochene, kurzgeschlossene oder lose Leitung zu Positionssensor E
    - id: module_configuration
      likelihood: medium
      label:
