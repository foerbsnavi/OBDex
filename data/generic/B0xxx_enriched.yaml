        en: Insulation of the curtain lead chafed through against the body
        de: Isolierung der Kopfairbagleitung an der Karosserie durchgescheuert
    - id: trim_clip_pinch
      likelihood: medium
      label:
        en: Lead pinched by a pillar trim or headliner clip
        de: Leitung durch Säulenverkleidung oder Dachhimmelclip eingeklemmt
    - id: curtain_module_short
      likelihood: low
      label:
        en: Internal short to housing in the left curtain airbag
        de: Innerer Schluss zum Gehäuse im linken Kopfairbag
