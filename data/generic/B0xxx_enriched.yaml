      likelihood: high
      label:
        en: Lead of the centre buckle strained at the split bench or armrest hinge
        de: Leitung des Mittelgurtschlosses an geteilter Bank oder Armlehnengelenk überlastet
    - id: center_buckle_connector
      likelihood: medium
      label:
        en: Loose or corroded connector of the centre buckle
        de: Lockerer oder korrodierter Stecker des Mittelgurtschlosses
    - id: buckle_hall_switch
      likelihood: medium
