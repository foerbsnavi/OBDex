- code: B00F1
  category: body
  title:
    en: Passenger Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt Beifahrer Auslösesteuerung
  description:
    en: "B00F1 is the front passenger counterpart of B00F0, reserved for an inflatable belt at that seat. No manufacturer documents it, and no series vehicle is publicly known to have a passenger inflatable belt; Mercedes' S-Class manual offers the beltbag only for the outer rear belts. A passenger version would still face the same engineering choices as the patents show: Allied Chemical patented as early as 1972 a buckle that routes gas from a floor-mounted inflator through tongue and buckle into lap and shoulder belt, so the belt itself needs no wires, while Autoliv's 2002 design mounts separate inflators on the seat back. The airbag module would watch the igniter loop and set B00F1 for an open, a short or bad resistance."
    de: "B00F1 ist das Gegenstück zu B00F0 am Beifahrersitz und für einen aufblasbaren Gurt an diesem Platz vorgesehen. Kein Hersteller dokumentiert ihn, und öffentlich ist kein Serienfahrzeug mit aufblasbarem Beifahrergurt bekannt; das Handbuch der S-Klasse bietet den Beltbag nur für die äußeren Fondgurte an. Eine Beifahrer-Ausführung stünde vor denselben Entscheidungen, die Patente zeigen: Allied Chemical ließ schon 1972 ein Gurtschloss schützen, das Gas von einem am Boden verankerten Generator durch Schloss und Zunge in Becken- und Schultergurt leitet, sodass der Gurt selbst keine Leitungen braucht; Autolivs Entwurf von 2002 setzt getrennte Generatoren an die Sitzlehne. Das Airbag-Steuergerät würde den Zünderkreis überwachen und B00F1 bei Unterbrechung, Kurzschluss oder falschem Widerstand setzen."
  affected_components:
    - passenger_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Module coded for a passenger inflatable belt that the car does not have
        de: Steuergerät auf einen aufblasbaren Beifahrergurt codiert, den das Auto nicht hat
    - id: buckle_inflator_connector
      likelihood: medium
      label:
        en: Connector at the buckle-side inflator under the passenger seat loose
        de: Stecker am schlossseitigen Gasgenerator unter dem Beifahrersitz locker
    - id: seat_harness_damage
      likelihood: low
      label:
        en: Seat wiring damaged by objects under the seat or by seat movement
        de: Sitzkabelbaum durch Gegenstände unter dem Sitz oder durch Sitzbewegung beschädigt
  symptoms:
    - en: Airbag lamp lit in the cluster
      de: Airbag-Leuchte im Kombiinstrument an
    - en: Passenger belt cannot inflate in a crash
      de: Beifahrergurt kann sich bei einem Unfall nicht aufblasen
    - en: "Safety note: pyrotechnic belt inflator – disconnect the battery, respect the wait time and have repairs done by a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnischer Gurt-Gasgenerator – Batterie abklemmen, Wartezeit beachten, Reparatur durch eine Fachwerkstatt"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 3]
