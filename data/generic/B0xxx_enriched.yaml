- code: B0070
  category: body
  title:
    en: Driver Seat Belt Pretensioner A Deployment Control
    de: Fahrer-Gurtstraffer A Auslösesteuerung
  description:
    en: "B0070 covers the firing loop of the driver's first (A) belt pretensioner, the squib the airbag module ignites to take slack out of the belt in a crash. A short or open in that loop lets the module no longer count on the device, so it lights the airbag lamp. Toyota names the code in exactly this sense: its Tundra bulletin T-SB-0057-22 (model year 2022) lists B007011 (short to ground) and B007012 (short to battery), there triggered by the wireless Qi charger and cured by reprogramming the SRS ECU. J2012 does not fix which device is A; GM notes that a front seat may carry a retractor, buckle or anchor pretensioner, or more than one. Mitsubishi logs its front retractor units under its own codes B1029/B102A. Saab 9-3 airbag modules use B0070 for the passenger curtain loop instead."
    de: "Gemeint ist der Zündkreis des ersten Gurtstraffers (Stufe A) am Fahrersitz – die Zündpille, mit der das Airbagsteuergerät bei einem Aufprall die Gurtlose herauszieht. Erkennt das Steuergerät dort Unterbrechung oder Kurzschluss, gilt der Straffer als nicht verfügbar, und die Airbag-Leuchte geht an. Toyota verwendet den Code genau so: Das Bulletin T-SB-0057-22 zum Tundra 2022 nennt B007011 (Masseschluss) und B007012 (Schluss nach Plus); Auslöser war dort die induktive Qi-Ladeschale, behoben wird per Neuprogrammierung des SRS-Steuergeräts. Welches Bauteil Stufe A ist, legt J2012 nicht fest – laut GM kann ein Vordersitz einen Aufroll-, Schloss- oder Endbeschlagstraffer haben, auch mehrere. Mitsubishi führt seine vorderen Aufrollerstraffer unter eigenen Nummern (B1029/B102A). Im Saab 9-3 steht B0070 für den Kreis des Beifahrer-Kopfairbags."
  affected_components:
    - driver_seatbelt_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: pretensioner_connector
      likelihood: high
      label:
        en: Loose or corroded plug at the driver pretensioner (B-pillar base or seat side)
        de: Lockerer oder korrodierter Stecker am Fahrer-Gurtstraffer (B-Säulenfuß oder Sitzseite)
    - id: seat_harness_chafed
      likelihood: medium
      label:
        en: Firing lead chafed by seat rails or trim clips
        de: Zündleitung durch Sitzschienen oder Verkleidungsclips durchgescheuert
    - id: electrical_interference
      likelihood: low
      label:
        en: Interference from added electronics, e.g. a wireless charger (Toyota Tundra 2022, ECU update)
        de: Störeinkopplung durch Zusatzelektronik, etwa eine Qi-Ladeschale (Toyota Tundra 2022, Steuergeräte-Update)
    - id: pretensioner_squib_fault
      likelihood: low
      label:
        en: Internal fault in the pretensioner squib
        de: Interner Fehler der Zündpille im Gurtstraffer
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver belt is not tightened in a crash; airbags themselves are usually unaffected
      de: Fahrergurt wird bei einem Unfall nicht gestrafft; die Airbags selbst sind meist nicht betroffen
    - en: "Safety note: the pretensioner is a pyrotechnic part; work on it only with the battery disconnected and the wait time observed, ideally at a specialist workshop"
      de: "Sicherheitshinweis: Der Gurtstraffer ist ein pyrotechnisches Bauteil; nur spannungsfrei (Batterie ab, Wartezeit) und am besten in einer Fachwerkstatt daran arbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 700]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
