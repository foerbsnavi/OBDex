- code: B0083
  category: body
  title:
    en: Second Row Left Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer zweite Reihe links Auslösesteuerung
  description:
    en: "B0083 is intended for a switchable force limiter on the left rear seat. No manufacturer publishes it with this J2012 meaning. Rear load limiters do exist: in an IIHS rear-seat test series presented in 2020, ten vehicles had both pretensioner and limiter at the back and one had a limiter alone. Much more often B0083 is a GM code for another part. On Global A models (2011 Saab 9-4X) it means the left front impact sensor, with symptom bytes for shorts, opens, low current, internal failure, wrong part and bad serial data; an open is flagged when the sensor stays silent longer than 375 ms. GM bulletin PI1480 (2015 Colorado/Canyon) traces stored B0083/B0084 with byte 05 to a corroded sensor or an unlatched connector lock. Saab 9-3 and 9-5 use it for the passenger seat position sensor."
    de: "B0083 ist für einen umschaltbaren Kraftbegrenzer am linken Rücksitz vorgesehen. Kein Hersteller veröffentlicht ihn in dieser J2012-Bedeutung. Kraftbegrenzer hinten gibt es durchaus: In einer 2020 vorgestellten Rücksitz-Testreihe der IIHS hatten zehn Fahrzeuge hinten Straffer und Begrenzer, eines nur einen Begrenzer. Weit häufiger ist B0083 ein GM-Code für ein anderes Bauteil. Bei Global-A-Modellen (Saab 9-4X, 2011) bezeichnet er den linken Frontaufprallsensor mit Fehlerbytes für Kurzschluss, Unterbrechung, zu geringen Strom, inneren Fehler, falsches Teil und ungültige Daten; eine Unterbrechung gilt, wenn der Sensor über 375 ms schweigt. GM-Bulletin PI1480 (Colorado/Canyon 2015) führt B0083/B0084 mit Byte 05 auf korrodierte Sensoren oder nicht eingerastete Steckersicherungen zurück. Saab 9-3/9-5 meinen damit den Sitzpositionssensor rechts."
  affected_components:
    - second_row_left_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_front_impact_sensor
      likelihood: high
      label:
        en: On GM vehicles, corroded left front impact sensor or unlatched connector lock (PI1480, different meaning)
        de: Bei GM korrodierter linker Frontaufprallsensor oder nicht eingerastete Steckersicherung (PI1480, andere Bedeutung)
    - id: rear_seat_wiring
      likelihood: medium
      label:
        en: Wiring to the left rear retractor damaged under trim or seat
        de: Leitung zum linken hinteren Aufroller unter Verkleidung oder Sitz beschädigt
    - id: limiter_squib_fault
      likelihood: low
      label:
        en: Internal fault of the rear load limiter squib
        de: Interner Fehler der Zündpille am hinteren Kraftbegrenzer
  symptoms:
    - en: Airbag warning lamp on, possibly only intermittently
      de: Airbag-Warnleuchte an, teils nur zeitweise
    - en: Left rear belt keeps a fixed limiting level in a crash
      de: Linker hinterer Gurt behält bei einem Unfall eine feste Begrenzungsstufe
    - en: "Safety note: restraint system with pyrotechnic parts; work only de-energised at a specialist workshop"
      de: "Sicherheitshinweis: Rückhaltesystem mit pyrotechnischen Teilen; nur spannungsfrei in einer Fachwerkstatt arbeiten"
