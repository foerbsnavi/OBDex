- code: B011C
  category: body
  title:
    en: Fluid Reservoir Level Sensor A
    de: Flüssigkeitsbehälter Füllstandssensor A
  description:
    en: "B011C is the first of six fluid reservoir level sensors, A to F. J2012 does not say which reservoir each letter belongs to; the neighbouring codes deal with washing windows, cameras and other sensors, so washer tanks are the obvious candidates. The classic design pairs a magnet-bearing float with a reed switch: falling fluid lowers the float, and the contact flips. The application US20040200278A1 shows such a unit pushed through a rubber grommet in the tank side wall. FCA parts tip 9003109 adds a practical failure: a float that has turned out of its anti-rotation guides keeps reporting low fluid in a full bottle. No maker documents B011C publicly; the effect is a wrong or missing low-fluid warning."
    de: "B011C ist der erste von sechs Füllstandssensoren für Flüssigkeitsbehälter, A bis F. Welcher Behälter zu welchem Buchstaben gehört, legt J2012 nicht fest; die Nachbarcodes betreffen das Waschen von Scheiben, Kameras und anderen Sensoren, naheliegend sind also Waschwasserbehälter. Klassisch arbeitet ein Schwimmer mit Magnet neben einem Reedkontakt: Sinkt der Pegel, sinkt der Schwimmer, und der Kontakt schaltet um. Die Anmeldung US20040200278A1 zeigt einen solchen Geber, der durch eine Gummitülle in der Seitenwand steckt. FCA nennt im Teile-Hinweis 9003109 einen typischen Fehler: Ein aus seiner Verdrehsicherung gedrehter Schwimmer meldet trotz voller Flasche Wassermangel. Öffentlich dokumentiert kein Hersteller B011C; die Folge ist eine falsche oder fehlende Warnung."
  affected_components:
    - fluid_reservoir_level_sensor_a
    - sensor_wiring
  common_causes:
    - id: float_stuck_or_misaligned
      likelihood: high
      label:
        en: Float jammed, rotated out of its guide or soaked with fluid
        de: Schwimmer klemmt, aus seiner Führung gedreht oder vollgesogen
    - id: reed_switch_failed
      likelihood: medium
      label:
        en: Reed contact inside the sensor broken or welded
        de: Reedkontakt im Geber gebrochen oder verklebt
    - id: grommet_connector_corroded
      likelihood: medium
      label:
        en: Leaking grommet letting fluid reach the plug, corroded terminals
        de: Undichte Tülle, Flüssigkeit am Stecker, korrodierte Kontakte
  symptoms:
    - en: Low-fluid warning stays on although the reservoir is full
      de: Warnung Waschwasser niedrig bleibt trotz vollem Behälter an
    - en: No warning at all when the reservoir runs empty
      de: Keine Warnung, obwohl der Behälter leer läuft
  repair:
