- code: B00B7
  category: body
  title:
    en: Driver Seat Occupant Position Sensor A
    de: Fahrersitz Insassenpositionssensor A
  description:
    en: "B00B7 is the first of five occupant position sensors for the driver seat. No carmaker publishes the code, and J2012 does not say which sensor the letter A means. Position sensing serves the DASS route of FMVSS 208, which also exists for the driver: the driver bag must already be suppressed when a test dummy's head, neck or chest moves into a zone next to the cover that the maker defines. Ultrasound is one way to watch that zone; an Automotive Systems Laboratory patent crosses beams from transmitters in the headliner about eight inches in front of the airbag door, asks for an update within 10 ms and treats any undiagnosed fault as a reason to disable the bag. A stored B00B7 therefore means the module has lost this view and the airbag lamp is on."
    de: "B00B7 ist der erste von fünf Insassenpositionssensoren am Fahrersitz. Kein Hersteller veröffentlicht den Code, und J2012 sagt nicht, welchen Sensor der Buchstabe A meint. Die Positionserkennung dient der Option einer dynamischen automatischen Abschaltung nach FMVSS 208: Auch für den Fahrer muss der Airbag gesperrt sein, bevor Kopf, Hals oder Rumpf eine vom Hersteller festgelegte Zone vor der Abdeckung erreichen. Ultraschall ist ein Weg, diese Zone zu überwachen; ein Patent von Automotive Systems Laboratory kreuzt Strahlen von Sendern im Dachhimmel etwa acht Zoll vor der Airbagklappe, verlangt eine Aktualisierung binnen 10 ms und wertet jeden ungeklärten Fehler als Grund, den Airbag zu sperren. Ein gespeicherter B00B7 bedeutet also, dass dem Steuergerät dieser Blick fehlt; die Airbag-Leuchte ist an."
  affected_components:
    - driver_occupant_position_sensor_a
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sensor_harness_fault
      likelihood: high
      label:
        en: Open or poor contact in the lead to position sensor A (e.g. headliner or trim harness)
        de: Unterbrechung oder schlechter Kontakt in der Leitung zu Positionssensor A (z. B. Dachhimmel- oder Verkleidungskabelbaum)
    - id: sensor_obstructed
      likelihood: medium
      label:
        en: Sensor face covered, dirty or misaligned after trim work
        de: Sensorfläche verdeckt, verschmutzt oder nach Verkleidungsarbeiten verstellt
    - id: sensor_fault
      likelihood: low
      label:
        en: Internal fault of position sensor A
        de: Interner Fehler von Positionssensor A
  symptoms:
