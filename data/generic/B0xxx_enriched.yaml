- code: B00B3
  category: body
  title:
    en: Driver Seat Occupant Classification Sensor D
    de: Fahrersitz Insassenklassifizierungssensor D
  description:
    en: "B00B3 refers to the fourth of five driver seat classification inputs. No carmaker publishes it, and the mapping of letters to sensors is undocumented. A fourth input can rest on a different principle: Delphi patented a silicone-filled bladder between cushion foam and seat frame, carrying a pressure sensor and capacitive films whose spacing shrinks under load, so that weight and its spread over the cushion are estimated and cross-checked. Honda's job aid for its passenger seat weight sensors shows the service side: the sensors sit in the seat base or frame, need recalibration after a sensor or unit is replaced, and a binding sensor may be freed by loosening, shaking and retorquing the seat. Worn seat harnesses can also set such codes. A stored B00B3 lights the airbag lamp."
    de: "B00B3 betrifft Eingang D, den vierten Klassifizierungssensor des Fahrersitzes. Öffentlich nutzt ihn kein Hersteller, die Zuordnung der Buchstaben ist offen. Ein vierter Eingang kann auf einem anderen Prinzip beruhen: Delphi hat ein silikongefülltes Kissen zwischen Polsterschaum und Sitzgestell patentiert, mit Drucksensor und kapazitiven Folien, deren Abstand unter Last schrumpft – so werden Gewicht und Verteilung geschätzt und gegeneinander geprüft. Hondas Arbeitshilfe zu den Gewichtssensoren im Beifahrersitz zeigt die Werkstattseite: Die Sensoren sitzen in Sitzunterbau oder Gestell, brauchen nach Sensor- oder Steuergerätetausch eine Neukalibrierung, und ein klemmender Sensor lässt sich durch Lösen, Rütteln und Nachziehen des Sitzes befreien. Ein gespeicherter B00B3 schaltet die Airbag-Leuchte ein."
  affected_components:
    - driver_classification_sensor_d
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seat_harness_wear
      likelihood: high
      label:
        en: Seat harness worn by seat movement, open or intermittent contact to input D
        de: Sitzkabelbaum durch Sitzverstellung verschlissen, Unterbrechung oder Wackelkontakt zu Eingang D
