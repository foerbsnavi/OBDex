      de: Kamerawäsche für die von Aktor S versorgte Kamera bewirkt nichts
    - en: Wash may run continuously or not stop if a relay contact has welded
      de: Bei verschweißtem Relaiskontakt läuft die Wäsche eventuell dauerhaft oder hört nicht auf
