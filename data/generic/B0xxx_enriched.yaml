        de: Sitzstecker nach dem Wiedereinbau des herausnehmbaren Sitzes nicht gesteckt
    - id: buckle_connector_corrosion
      likelihood: medium
      label:
        en: Corroded buckle connector, e.g. from wet floor near the sliding door
        de: Korrodierter Gurtschlossstecker, etwa durch nassen Boden an der Schiebetür
