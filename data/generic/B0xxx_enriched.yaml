    - en: "Safety note: the end fitting tensioner is pyrotechnic; never probe it live – battery off, wait time, specialist workshop"
      de: "Sicherheitshinweis: Der Endbeschlagstraffer ist pyrotechnisch; nie unter Spannung messen – Batterie ab, Wartezeit, Fachwerkstatt"
