- code: B0036
  category: body
  title:
    en: Right Side Deployment Stage 2 Loop Short to Ground
    de: Seitenairbag rechts Stufe 2 Auslösekreis Kurzschluss nach Masse
  description:
    en: "B0036 appears neither in the public J2012 lists nor in any accessible manufacturer document, so the code is not publicly verifiable. Its title describes a short to ground in a second stage of the right side airbag. How restraint modules handle such a fault is known from other codes: Mitsubishi stores B0028-11 when the right front side airbag circuit has been grounded for 2 seconds, and the GM manual for the Saab 9-4X sets byte 02 on the passenger seat side airbag code B0021 after a ground short of the same length. GM adds that a badly seated connector lock can let the shorting bars bridge both firing leads, so connectors are checked first with byte 02. Two-stage side airbags are uncommon. Airbag lamp on; the bag may not deploy."
    de: "B0036 findet sich weder in den öffentlichen J2012-Listen noch in einer zugänglichen Herstellerunterlage; der Code ist öffentlich nicht nachweisbar. Sein Titel beschreibt einen Masseschluss in einer zweiten Stufe des rechten Seitenairbags. Wie Steuergeräte so einen Fehler behandeln, zeigen andere Codes: Mitsubishi legt B0028-11 ab, wenn der Kreis des rechten vorderen Seitenairbags 2 Sekunden an Masse liegt, und das GM-Handbuch zum Saab 9-4X setzt Byte 02 am Code B0021 für den Seitenairbag im Beifahrersitz nach einem ebenso langen Masseschluss. GM ergänzt, dass eine schlecht eingerastete Steckersicherung die Kurzschlussbrücken beide Zündleitungen verbinden lässt; bei Byte 02 werden daher zuerst die Stecker geprüft. Zweistufige Seitenairbags sind selten. Airbag-Leuchte an; der Airbag löst womöglich nicht aus."
  affected_components:
    - passenger_side_airbag
    - srs_seat_wiring
  common_causes:
    - id: harness_short_ground
      likelihood: high
      label:
        en: Chafed side airbag lead touching the seat frame or body
        de: Durchgescheuerte Seitenairbagleitung mit Kontakt zu Sitzgestell oder Karosserie
    - id: connector_lock_unseated
      likelihood: medium
      label:
        en: Connector lock not engaged, shorting bars bridge the loop
        de: Steckersicherung nicht eingerastet, Kurzschlussbrücken überbrücken den Kreis
    - id: side_airbag_fault
      likelihood: low
      label:
        en: Internal short in the side airbag module
        de: Innerer Kurzschluss im Seitenairbagmodul
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right side airbag may not deploy in a side impact
      de: Rechter Seitenairbag löst bei einem Seitenaufprall eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 900]
