- code: B012A
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet "D" Circuit/Open
    de: DC/AC-Wandler A Hochvolt-Steckdose „D“ Stromkreis/Unterbrechung
  description:
    en: "B012A concerns outlet D. Sockets in a pickup bed live in a harsher place than those in the cab: dust, rain, washing and cords left plugged in. Ford's customer satisfaction program 21B52 shows how tightly bed outlets are tied into the vehicle: on certain 2021 F-150 Raptor trucks with Pro Power Onboard, a bed outlet cover standing open more than about 17 degrees kept the truck from shifting out of Park until the PCM was reprogrammed. In Ford's patent US11043801B2 the bed outlet carries several sockets, each with its own switch and protection, and a second outlet sits in the cab. Whether D is a bed socket is not published, and no manufacturer documents B012A. Moisture in the socket or its connector is a likely cause."
    de: "B012A betrifft Steckdose D. Steckdosen auf der Ladefläche eines Pick-ups sitzen rauer als im Innenraum: Staub, Regen, Waschanlage und Kabel, die stecken bleiben. Fords Kundenzufriedenheitsprogramm 21B52 zeigt, wie eng die Ladeflächen-Steckdosen ins Fahrzeug eingebunden sind: Bei bestimmten F-150 Raptor 2021 mit Pro Power Onboard verhinderte eine mehr als etwa 17 Grad offene Steckdosenklappe das Auslegen aus P, bis das PCM neu programmiert war. In Fords Patent US11043801B2 trägt die Ladeflächen-Einheit mehrere Steckdosen mit je eigenem Schalter und Schutz, eine zweite Einheit sitzt im Innenraum. Ob D eine Ladeflächen-Steckdose ist, ist nicht veröffentlicht; B012A dokumentiert kein Hersteller. Feuchtigkeit in Steckdose oder Stecker ist eine naheliegende Ursache."
  affected_components:
    - dc_ac_converter_a
    - hv_outlet_d
  common_causes:
    - id: outlet_d_water_corrosion
      likelihood: high
      label:
        en: Water or corrosion in socket D or its connector, typical for exterior or bed outlets
        de: Wasser oder Korrosion in Steckdose D oder ihrem Stecker, typisch für Außen- und Ladeflächensteckdosen
    - id: outlet_d_harness_chafed
      likelihood: medium
      label:
        en: Harness to outlet D chafed or crushed in the body or bed
        de: Kabelbaum zu Steckdose D in Karosserie oder Ladefläche durchgescheuert oder gequetscht
    - id: outlet_d_insert_broken
      likelihood: low
      label:
        en: Socket insert mechanically damaged
        de: Steckdoseneinsatz mechanisch beschädigt
  symptoms:
    - en: Socket D without power, other sockets may work
      de: Steckdose D ohne Strom, andere Steckdosen arbeiten eventuell
    - en: Message that onboard power or an outlet is unavailable
      de: Meldung, dass Bordnetzstrom oder eine Steckdose nicht verfügbar ist
    - en: Outlet circuits carry 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Steckdosenkreise führen 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
