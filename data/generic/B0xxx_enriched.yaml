- code: B0084
  category: body
  title:
    en: Second Row Center Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer zweite Reihe Mitte Auslösesteuerung
  description:
    en: "B0084 names a squib-switched force limiter for the middle rear seat. Neither a carmaker nor a bulletin shows it with that meaning, and the hardware is rare: NHTSA's 2013 evaluation reports load limiters as standard only at the outer front seats, and the rear centre belt is often a plain retractor. A Delphi patent for rear seats without airbags instead chooses between roughly 4–6 kN and 2–3 kN purely mechanically, with no firing loop at all. Owners usually meet B0084 through GM. The 2011 Saab 9-4X, a Global A design, stores it for the right front impact sensor, set after ten seconds of a short, open or bad data; PI1480 covers it on the 2015 Colorado/Canyon. Saab 9-3 and 9-5 modules use it for the driver seat position sensor and then disable the driver airbag's second stage."
    de: "B0084 bezeichnet einen per Zündpille umgeschalteten Kraftbegrenzer am mittleren Rücksitz. Weder ein Hersteller noch ein Bulletin zeigt ihn in dieser Bedeutung, und das Bauteil ist selten: Die NHTSA-Auswertung von 2013 nennt Kraftbegrenzer nur an den äußeren Vordersitzen als Standard, der Mittelgurt hinten ist oft ein einfacher Aufroller. Ein Delphi-Patent für Rücksitze ohne Airbag wählt zwischen etwa 4–6 kN und 2–3 kN sogar rein mechanisch, ganz ohne Zündkreis. Meist begegnet B0084 bei GM. Global-A-Fahrzeuge (Saab 9-4X, 2011) legen ihn für den rechten Frontaufprallsensor ab, wenn Kurzschluss, Unterbrechung oder fehlerhafte Daten zehn Sekunden anstehen; PI1480 behandelt ihn bei Colorado/Canyon 2015. Saab 9-3/9-5 meinen den Fahrersitz-Positionssensor und schalten dann Stufe 2 des Lenkradairbags ab."
  affected_components:
    - second_row_center_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_right_front_impact_sensor
      likelihood: high
      label:
        en: On GM vehicles, fault at the right front impact sensor or its plug (different meaning)
        de: Bei GM Fehler am rechten Frontaufprallsensor oder dessen Stecker (andere Bedeutung)
    - id: saab_seat_position_sensor
      likelihood: medium
      label:
        en: On Saab 9-3/9-5, open or short in the driver seat position sensor circuit (different meaning)
        de: Bei Saab 9-3/9-5 Unterbrechung oder Kurzschluss im Kreis des Fahrersitz-Positionssensors (andere Bedeutung)
    - id: centre_rear_wiring
      likelihood: low
      label:
        en: Damaged lead to a centre rear limiter where one is fitted
        de: Beschädigte Leitung zu einem hinteren Mittelsitz-Begrenzer, falls verbaut
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On Saab 9-3/9-5 the second stage of the driver airbag is disabled
      de: Bei Saab 9-3/9-5 ist die zweite Stufe des Fahrerairbags abgeschaltet
    - en: "Safety note: airbag system with pyrotechnic parts; diagnose only de-energised at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System mit pyrotechnischen Teilen; nur spannungsfrei in einer Fachwerkstatt prüfen"
