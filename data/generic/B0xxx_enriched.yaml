- code: B0013
  category: body
  title:
    en: Passenger Knee Bolster Deployment Control
    de: Beifahrer-Kniepolster (Knieairbag) Auslösesteuerung
  description:
    en: "B0013 belongs to the knee airbag on the passenger side, which deploys from the lower glovebox area and keeps the passenger's knees and thighs from sliding under the dash. Mercedes-Benz logs B001313 for an open squib of the front passenger kneebag. Ford pairs B0013:1A with the driver knee code B0004 on the 2024 Ranger; the TSB has all four airbag connectors checked, the passenger knee airbag being C2433, and swaps those with the wrong moulding number. GM uses the same number differently: in its later modules B0013 is stage 2 of the driver steering wheel airbag, with the same fault bytes as B0012 (Saab 9-4X 2011, GM 2009 Cobalt coil coverage). So a GM vehicle needs a check at the steering wheel, other makers at the passenger knee airbag. The airbag lamp is on."
    de: "B0013 gehört zum Knieairbag auf der Beifahrerseite, der aus dem unteren Handschuhfachbereich auslöst und verhindert, dass Knie und Oberschenkel unter die Armaturentafel rutschen. Mercedes-Benz legt B001313 für eine unterbrochene Zündpille des Beifahrer-Kniebags ab. Ford stellt B0013:1A beim Ranger 2024 neben den Fahrer-Code B0004; laut TSB werden alle vier Airbagstecker geprüft, der Beifahrer-Knieairbag hängt an C2433, Stecker mit falscher Formnummer werden ersetzt. GM nutzt dieselbe Nummer anders: In seinen neueren Steuergeräten ist B0013 die Stufe 2 des Lenkradairbags, mit denselben Fehlerbytes wie B0012 (Saab 9-4X 2011, GM-Kulanz Wickelfeder Cobalt 2009). Bei GM also am Lenkrad suchen, bei anderen Herstellern am Beifahrer-Knieairbag. Die Airbag-Leuchte ist an."
  affected_components:
    - knee_airbag_passenger
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: knee_airbag_connector
      likelihood: high
      label:
        en: Faulty connector at the passenger knee airbag (Ford TSB 24-2444)
        de: Fehlerhafter Stecker am Beifahrer-Knieairbag (Ford TSB 24-2444)
    - id: gm_steering_wheel_stage2
      likelihood: medium
      label:
        en: On GM vehicles fault in the driver airbag stage 2 loop or clock spring
        de: Bei GM Fehler im Kreis Stufe 2 des Fahrerairbags oder in der Wickelfeder
    - id: knee_airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the passenger knee airbag
        de: Innerer Fehler im Beifahrer-Knieairbag
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger knee airbag (or on GM driver airbag stage 2) may not deploy
      de: Beifahrer-Knieairbag (bei GM Fahrerairbag Stufe 2) löst womöglich nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
