- code: B00A1
  category: body
  title:
    en: Occupant Position System
    de: Insassenpositionssystem
  description:
    en: "B00A1 covers the occupant position system, which watches where a person sits rather than how heavy they are, so that an airbag can be held back when someone is too close to it. FMVSS 208 accepts this as dynamic automatic suppression (DASS): the bag must be switched off before the occupant's head, neck or upper body reach a zone beside the cover that the maker defines. No carmaker publishes B00A1 itself. Honda's OPDS shows the idea: sensors in the passenger backrest report height and lean, the side airbag is switched off while a Side Airbag Off lamp is lit, and the system needs initialising after seat-back parts or the unit are changed. Patents describe other ways, such as ultrasonic beams from the headliner or a sensor at the airbag door. A fault lights the airbag lamp."
    de: "B00A1 betrifft das Insassenpositionssystem, das nicht das Gewicht, sondern die Sitzhaltung erfasst, damit ein Airbag gesperrt werden kann, wenn jemand zu nah davor ist. FMVSS 208 lässt das als dynamische automatische Abschaltung zu, die den Airbag sperren muss, bevor Kopf, Hals oder Rumpf in eine vom Hersteller festgelegte Zone neben der Abdeckung geraten. Den Code B00A1 selbst veröffentlicht kein Hersteller. Hondas OPDS zeigt das Prinzip: Sensoren in der Beifahrer-Rückenlehne melden Größe und Neigung, der Seitenairbag wird abgeschaltet und die Anzeige Side Airbag Off leuchtet; nach dem Tausch von Lehnenteilen oder Steuergerät muss das System initialisiert werden. Patente beschreiben weitere Wege, etwa Ultraschall vom Dachhimmel oder einen Sensor an der Airbagklappe. Ein Fehler schaltet die Airbag-Leuchte ein."
  affected_components:
    - occupant_position_module
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: not_initialised
      likelihood: high
      label:
        en: System not initialised after seat cover, seat-back sensor or control unit replacement
        de: System nach Tausch von Sitzbezug, Lehnensensor oder Steuergerät nicht initialisiert
    - id: seat_harness_connector
      likelihood: medium
      label:
        en: Damaged seat harness or loose plug under the seat
        de: Beschädigter Sitzkabelbaum oder lockerer Stecker unter dem Sitz
    - id: position_sensor_fault
      likelihood: medium
      label:
        en: Faulty position sensor or position control unit
        de: Defekter Positionssensor oder defektes Positionssteuergerät
    - id: moisture_or_objects
      likelihood: low
      label:
        en: Damp seat, accessory seat covers or objects disturbing the sensors
        de: Feuchter Sitz, Zubehör-Sitzbezüge oder Gegenstände, die die Sensoren stören
  symptoms:
