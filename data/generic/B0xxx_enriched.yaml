      de: Airbag-Warnleuchte an, oft nach Frontreparatur oder Wassereintritt
    - en: Frontal crash detection relies on the module's internal sensor only
      de: Frontcrash-Erkennung stützt sich nur noch auf den internen Sensor des Steuergeräts
    - en: "Safety note: airbag system; disconnect the battery and observe the wait time before touching sensors or wiring, work at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten an Sensor oder Leitung Batterie abklemmen und Wartezeit einhalten, Fachwerkstatt"
  repair:
    difficulty: shop_only
