- code: B009E
  category: body
  title:
    en: Right Side Restraints Sensor 5
    de: Seitencrashsensor rechts 5
  description:
    en: "B009E stands for a fifth crash sensor on the vehicle's right flank. No carmaker documents this code publicly: Mitsubishi's airbag index ends its right row with the C-pillar unit B0098, and the NHTSA bulletin index shows no entry for B009E at all. A fifth right-hand sensor would mostly make sense on long bodies, vans with sliding doors or vehicles with extra seat rows. Two sensing principles are on offer: Bosch's peripheral pressure sensor sits in a door cavity and reacts when the crushed door raises the air pressure, while satellites such as Continental's gSAT pick up the shock in stiff structure. FMVSS 214 shows why several are needed, because a pole can hit the flank at many points. With B009E stored the airbag lamp is on and deployment near that sensor may come late."
    de: "B009E steht für einen fünften Crashsensor auf der rechten Fahrzeugseite. Kein Hersteller dokumentiert diesen Code öffentlich: Der Airbag-Index von Mitsubishi schließt die rechte Reihe mit dem C-Säulen-Sensor B0098 ab, und im NHTSA-Bulletinindex taucht B009E überhaupt nicht auf. Sinnvoll wäre ein fünfter Sensor rechts vor allem bei langen Karosserien, Transportern mit Schiebetür oder zusätzlichen Sitzreihen. Zwei Messprinzipien stehen zur Wahl: Boschs peripherer Drucksensor sitzt im Türhohlraum und spricht an, wenn die eingedrückte Tür den Luftdruck steigen lässt; Satelliten wie Continentals gSAT messen den Stoß in steifer Struktur. FMVSS 214 erklärt den Bedarf, denn ein Pfahl kann die Flanke an vielen Stellen treffen. Ist B009E gespeichert, leuchtet die Airbag-Lampe, und nahe diesem Sensor kann die Auslösung zu spät kommen."
  affected_components:
