- code: B0096
  category: body
  title:
    en: Right Side Restraints Sensor 1
    de: Seitencrashsensor rechts 1
  description:
    en: "B0096 concerns the first crash sensor on the right side, mirror image of B0091. Mitsubishi puts it in the right front door, calls it DOOR SATEL SENS RH and prints the J2012 title beside it; its airbag unit checks the sensor with the ignition on and, after two seconds, stores -11 for a ground short, -81 when data from the sensor stop and -55 for a configuration that does not fit the car, among nine subtypes in total. Honda logs B0096-87 when the first right side impact sensor of a 2016 or 2017 Fit or HR-V goes silent. A door position suits a pressure sensor: Bosch describes how a dent in the door changes the air pressure inside it, turning the whole door into the sensing element. Saab 9-3 and 9-5 models give B0096 to the passenger belt buckle switch circuit instead. The airbag lamp comes on."
    de: "B0096 betrifft den ersten Crashsensor auf der rechten Seite, das Spiegelbild zu B0091. Mitsubishi setzt ihn in die rechte Vordertür, nennt ihn DOOR SATEL SENS RH und druckt den J2012-Titel daneben; das Airbag-Steuergerät prüft ihn bei Zündung an und speichert nach zwei Sekunden etwa -11 für Masseschluss, -81, wenn vom Sensor keine Daten mehr kommen, und -55 für eine Konfiguration, die nicht zum Auto passt – insgesamt neun Untertypen. Honda legt bei Fit und HR-V 2016–2017 B0096-87 ab, kein Signal vom ersten rechten Seitenaufprallsensor. In der Tür arbeitet meist ein Drucksensor: Bosch beschreibt, wie eine Delle den Luftdruck im Türinneren ändert, sodass die ganze Tür zum Messfühler wird. Saab 9-3 und 9-5 vergeben B0096 dagegen an den Kreis des Gurtschloss-Schalters am Beifahrersitz. Die Airbag-Leuchte geht an."
  affected_components:
    - right_side_impact_sensor_1
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: door_harness_fault
      likelihood: high
      label:
        en: Chafed wire or poor contact in the door harness between body and right front door
        de: Durchgescheuerte Ader oder schlechter Kontakt im Türkabelbaum zwischen Karosserie und rechter Vordertür
    - id: door_sensor_fault
      likelihood: medium
      label:
        en: Internal fault of the right front door satellite sensor
        de: Interner Fehler des Satellitensensors in der rechten Vordertür
    - id: module_configuration
      likelihood: low
      label:
        en: Airbag unit configuration not matching the vehicle (Mitsubishi subtype -55)
        de: Konfiguration des Airbag-Steuergeräts passt nicht zum Fahrzeug (Mitsubishi Untertyp -55)
    - id: saab_buckle_switch
      likelihood: low
      label:
        en: On Saab 9-3/9-5, passenger belt buckle switch circuit fault (different meaning)
        de: Bei Saab 9-3/9-5 Fehler im Gurtschloss-Schalterkreis Beifahrer (andere Bedeutung)
  symptoms:
    - en: Airbag warning lamp on, sometimes only after the right front door has been opened or worked on
      de: Airbag-Warnleuchte an, teils erst nach Öffnen oder Arbeiten an der rechten Vordertür
    - en: Side and curtain airbags on the right may fire late in a side impact
      de: Seiten- und Kopfairbags rechts lösen bei einem Seitenaufprall womöglich verspätet aus
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before removing the door trim, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor dem Abnehmen der Türverkleidung Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
