- code: B00D1
  category: body
  title:
    en: Passenger Seat Belt Indicator
    de: Gurtwarnleuchte Beifahrer
  description:
    en: "B00D1 covers the passenger seat belt warning. Unlike the driver warning, it only makes sense if the car knows the seat is occupied, so it leans on occupant sensing. No carmaker documents the code. Ford's 2014 F-150 uses the passenger sensing system to decide who gets Belt-Minder reminders: above 6 mph and after 1 to 2 minutes, lamp and chime come on for six seconds every 25 seconds for about five minutes. Honda's 2013 Fit lights the passenger warning about 6 s after ignition-on but not for a child or slight adult whom the weight sensors miss. Mazda saw the passenger warning come on for an empty seat holding a laptop or phone. FMVSS 208 S7.5 requires a passenger warning visible to the driver from September 2028. B00D1 points to the lamp side, not the buckle."
    de: "B00D1 betrifft die Gurtwarnung für den Beifahrer. Anders als beim Fahrer ergibt sie nur Sinn, wenn das Fahrzeug weiß, dass der Sitz belegt ist; sie stützt sich daher auf die Insassenerkennung. Kein Hersteller dokumentiert den Code. Fords F-150 von 2014 entscheidet mit dem Beifahrer-Erkennungssystem, wer Belt-Minder-Erinnerungen bekommt: Über 6 mph und nach 1 bis 2 Minuten melden sich Leuchte und Ton für sechs Sekunden alle 25 Sekunden, etwa fünf Minuten lang. Hondas Fit 2013 zeigt die Beifahrerwarnung etwa 6 s nach Zündung an, nicht aber für ein Kind oder kleine Erwachsene, die die Gewichtssensoren nicht erfassen. Mazda beobachtete die Beifahrerwarnung bei leerem Sitz mit Laptop oder Handy. FMVSS 208 S7.5 verlangt ab September 2028 eine für den Fahrer sichtbare Beifahrerwarnung. B00D1 zielt auf die Anzeigeseite, nicht auf das Gurtschloss."
  affected_components:
    - passenger_belt_indicator
    - instrument_cluster
    - srs_control_module
  common_causes:
    - id: indicator_circuit
      likelihood: high
      label:
        en: Open or shorted circuit to the passenger belt lamp or its display segment
        de: Unterbrochene oder kurzgeschlossene Leitung zur Beifahrer-Gurtleuchte bzw. ihrem Anzeigefeld
    - id: lamp_or_display_fault
      likelihood: medium
      label:
        en: Lamp, LED or display unit for the passenger warning failed
        de: Leuchte, LED oder Anzeigeeinheit der Beifahrerwarnung ausgefallen
    - id: occupancy_input_missing
      likelihood: low
      label:
        en: Occupancy information missing or wrong, so the warning logic cannot run
        de: Belegungsinformation fehlt oder ist falsch, sodass die Warnlogik nicht arbeiten kann
  symptoms:
