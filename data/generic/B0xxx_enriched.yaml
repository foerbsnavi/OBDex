- code: B009C
  category: body
  title:
    en: Left Side Restraints Sensor 6
    de: Seitencrashsensor links 6
  description:
    en: "B009C is the sixth and last left-side slot in the J2012 sensor block. No carmaker documents this code publicly. Real vehicles show how many side satellites are usual: FCA's 2019 Jeep Cherokee recall 19V-449 lists two engine bay sensors and four for B- or C-pillar positions, three per side at most, and FCA files those pillar units as B2761 to B2765 rather than in the B009x block. A sixth left sensor would therefore suit only long vans, buses or vehicles with several rear rows, where Bosch's option of satellites in the rear body also fits. If B009C appears, check first which sensor the maker assigns to it; a scan tool reading on a car with fewer sensors may point to a wrong module configuration. The airbag lamp lights."
    de: "B009C ist der sechste und letzte linke Platz im J2012-Sensorblock. Kein Hersteller dokumentiert diesen Code öffentlich. Echte Fahrzeuge zeigen, wie viele Seitensatelliten üblich sind: Der FCA-Rückruf 19V-449 (Jeep Cherokee 2019) nennt zwei Sensoren im Motorraum und vier für B- und C-Säulen, also höchstens drei je Seite, und FCA führt diese Säulensensoren als B2761 bis B2765 statt im Block B009x. Ein sechster Sensor links passt daher nur zu langen Transportern, Bussen oder Fahrzeugen mit mehreren hinteren Reihen, wo auch Boschs Variante mit Satelliten im Heck greift. Taucht B009C auf, zuerst klären, welchen Sensor der Hersteller damit meint; bei einem Auto mit weniger Sensoren deutet der Eintrag eher auf eine falsche Konfiguration des Steuergeräts. Die Airbag-Leuchte geht an."
  affected_components:
