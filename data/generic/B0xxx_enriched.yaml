- code: B0071
  category: body
  title:
    en: First Row Center Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer erste Reihe Mitte Auslösesteuerung
  description:
    en: "B0071 is reserved for a pretensioner at the middle seat of the first row, which exists only where a three-person front bench is fitted. The airbag module would watch this squib like any other firing loop and flag an open, a short or a resistance outside its window. No carmaker publishes B0071 with this meaning. Mercedes-Benz does show that such a device can be present: its information LI54.21-P-070658 (A-, CLA-, GLB-Class) lists an open circuit at the emergency tensioning retractor in the centre of the first seat row, but files it under its own code B1B36. GM places buckle pretensioners at the inner flank of a front seat. In the airbag modules of the Saab 9-3 (2003, 2007), B0071 stands for a short in the passenger curtain or rollover-bar circuit, a different part altogether."
    de: "Der Code ist für einen Gurtstraffer am mittleren Platz der ersten Reihe vorgesehen – den gibt es nur bei einer durchgehenden Dreier-Sitzbank vorn. Das Airbagsteuergerät würde diese Zündpille wie jeden Auslösekreis auf Unterbrechung, Kurzschluss und unzulässigen Widerstand prüfen. Öffentlich dokumentiert kein Hersteller B0071 in dieser Bedeutung. Dass es ein solches Bauteil gibt, zeigt Mercedes-Benz: Die Information LI54.21-P-070658 (gültig für A-Klasse, CLA, GLB) nennt eine Unterbrechung am Gurtstraffer-Aufroller in der Mitte der ersten Sitzreihe – allerdings unter dem eigenen Code B1B36. GM beschreibt Schlossstraffer an der Innenseite eines Vordersitzes. In den Airbagsteuergeräten des Saab 9-3 (2003, 2007) bedeutet B0071 dagegen einen Kurzschluss im Kreis des Beifahrer-Kopfairbags bzw. Überrollbügels."
  affected_components:
    - first_row_center_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: center_seat_connector
      likelihood: high
      label:
        en: Plug under the front bench centre seat loose or corroded
        de: Stecker unter dem mittleren Vordersitz locker oder korrodiert
    - id: bench_harness_damage
      likelihood: medium
      label:
        en: Harness damaged when the centre seat or console is folded or removed
        de: Kabelbaum beim Umklappen oder Ausbau von Mittelsitz bzw. Konsole beschädigt
    - id: configuration_mismatch
      likelihood: low
      label:
        en: Airbag module configured for a centre pretensioner the vehicle does not have
        de: Airbagsteuergerät auf einen mittleren Gurtstraffer codiert, den das Fahrzeug nicht hat
    - id: squib_internal
      likelihood: low
      label:
        en: Internal fault of the centre pretensioner
        de: Interner Fehler des mittleren Gurtstraffers
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Middle front occupant gets no belt pretensioning in a crash
      de: Mittlerer Insasse vorn erhält bei einem Unfall keine Gurtstraffung
    - en: "Safety note: pyrotechnic component; disconnect the battery, wait the specified time and leave the work to a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Bauteil – Batterie abklemmen, vorgeschriebene Wartezeit einhalten und die Arbeit einer Fachwerkstatt überlassen"
