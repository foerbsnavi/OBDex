- code: B0107
  category: body
  title:
    en: LIDAR Washer Actuator B
    de: LIDAR-Wascher-Aktuator B
  description:
    en: "B0107 is the second lidar washer actuator. Why a car would need several becomes clear in Uber's 2016 patent: its roof lidar is washed by three separate nozzle units, each with its own pump and check valve, fed from one reservoir, and the controller normally sprays fluid first and then dries with air. A fault on one pump leaves only that segment of the window dirty. ARaymond's cleaning brochure shows multi-outlet lidar nozzles and integrated electromagnetic valves as an alternative to one pump per nozzle. Kautex supplies complete reservoir, pump and nozzle sets for camera and lidar cleaning. B0107 has no published meaning at any vehicle maker, and whether B is a second lidar or a second nozzle on the same one is not stated anywhere."
    de: "B0107 ist der zweite Lidar-Wascheraktor. Wozu ein Fahrzeug mehrere braucht, zeigt Ubers Patent von 2016: Das Dach-Lidar wird dort von drei getrennten Düseneinheiten gewaschen, jede mit eigener Pumpe und Rückschlagventil, gespeist aus einem Behälter; die Steuerung sprüht normalerweise erst Flüssigkeit und trocknet dann mit Luft. Fällt eine Pumpe aus, bleibt nur dieser Abschnitt des Fensters verschmutzt. ARaymonds Broschüre zu Reinigungssystemen zeigt Lidar-Düsen mit mehreren Auslässen und integrierte elektromagnetische Ventile als Alternative zur Pumpe je Düse. Kautex liefert komplette Sätze aus Behälter, Pumpe und Düsen für Kamera- und Lidar-Reinigung. Bei keinem Fahrzeughersteller ist eine Bedeutung von B0107 veröffentlicht, und ob B ein zweites Lidar oder eine zweite Düse am selben Lidar ist, steht nirgends."
  affected_components:
