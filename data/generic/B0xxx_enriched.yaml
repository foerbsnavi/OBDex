- code: B0016
  category: body
  title:
    en: Right Front/Passenger Frontal Deployment Loop Short to Ground
    de: Beifahrer-Frontairbag Auslösekreis Kurzschluss nach Masse
  description:
    en: "The public J2012 code lists skip B0016. General Motors used it in two generations with different meanings. In older modules, documented for the Saab 9-5 2006 and the Saab 9-3 up to 2011, B0016 means low resistance in the passenger frontal stage 1 loop: the reading drops under about 1.5 ohms, tolerance 0.2, for two seconds. That is close to the title, since a short to ground or between the leads also pulls the measured resistance down. In later GM modules (Saab 9-4X 2011) B0016 is the left roof rail airbag loop, with its own bytes for short to ground (02) and low resistance below 1.4 ohms (0E). GM bulletin 08-09-41-002H lists B0016 among codes caused by unseated connector locks on many 2005-14 GM models. The airbag lamp is on in every case."
    de: "B0016 steht nicht in den öffentlichen J2012-Codelisten. General Motors nutzte ihn in zwei Generationen mit unterschiedlicher Bedeutung. In älteren Steuergeräten, belegt für Saab 9-5 (2006) und Saab 9-3 bis 2011, heißt B0016 zu kleiner Widerstand im Beifahrer-Frontkreis Stufe 1: gemessen werden unter 1,5 Ohm (±0,2) für zwei Sekunden. Das liegt nahe am Titel, denn ein Masseschluss oder ein Schluss zwischen den Leitungen drückt den Messwert ebenfalls nach unten. In neueren GM-Steuergeräten (Saab 9-4X 2011) ist B0016 der Kreis des linken Dachrahmen-Kopfairbags, mit eigenen Bytes für Masseschluss (02) und Widerstand unter 1,4 Ohm (0E). GM-Bulletin 08-09-41-002H zählt B0016 zu den Codes, die nicht eingerastete Steckersicherungen bei vielen GM-Modellen 2005–14 auslösten. Die Airbag-Leuchte ist jeweils an."
  affected_components:
    - passenger_airbag_module
    - srs_wiring
  common_causes:
    - id: loop_short_or_low_resistance
      likelihood: high
      label:
        en: Squib leads shorted together or to ground in the passenger frontal loop (older GM)
        de: Zündpillenleitungen im Beifahrer-Frontkreis untereinander oder gegen Masse geschlossen (ältere GM)
    - id: connector_lock
      likelihood: medium
      label:
        en: Connector position assurance lock not seated (GM 08-09-41-002H)
        de: Steckersicherung nicht eingerastet (GM 08-09-41-002H)
    - id: roof_rail_airbag_loop
      likelihood: medium
      label:
        en: On later GM vehicles fault in the left roof rail airbag loop
        de: Bei neueren GM-Fahrzeugen Fehler im Kreis des linken Kopfairbags
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger frontal airbag stage 1 (older GM) or left head airbag (later GM) may not deploy
      de: Beifahrer-Frontairbag Stufe 1 (ältere GM) bzw. linker Kopfairbag (neuere GM) löst womöglich nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 1200]
