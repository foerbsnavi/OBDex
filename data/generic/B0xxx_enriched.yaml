    - en: "Safety note: passenger airbag status may be wrong; disconnect seat sensors only de-energised, keep tightening torques and run the zero-point calibration with the scan tool, specialist workshop only"
      de: "Sicherheitshinweis: Status des Beifahrerairbags womöglich falsch; Sitzsensoren nur spannungsfrei trennen, Anzugsmomente einhalten und Nullabgleich mit dem Diagnosegerät durchführen, nur Fachwerkstatt"
