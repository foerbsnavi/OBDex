      likelihood: medium
      label:
        en: Load cell B damaged or drifting, for example after the seat was forced or dropped
        de: Lastzelle B beschädigt oder driftend, etwa nach Gewalteinwirkung auf den Sitz
    - id: mounting_torque_or_alignment
      likelihood: medium
      label:
