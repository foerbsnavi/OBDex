    - id: gm_pretensioner_open
      likelihood: medium
      label:
        en: "Older GM/Saab module: open passenger pretensioner loop, e.g. broken rear door wire"
        de: "Älteres GM-/Saab-Steuergerät: unterbrochener Zündkreis des Beifahrer-Straffers, etwa gebrochene Leitung in der hinteren Tür"
    - id: buckle_sensor_fault
      likelihood: low
