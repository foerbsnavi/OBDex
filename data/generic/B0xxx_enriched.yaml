- code: B0024
  category: body
  title:
    en: Right Side Deployment Control
    de: Seitenairbag rechts Auslösekreis
  description:
    en: "B0024 is missing from the public J2012 lists; there the right front side airbag is B0028. General Motors used the number twice. Older modules, such as those of the 2006 Saab 9-5 and the Saab 9-3, assign it to driver frontal stage 1: on the 9-5 the voltage at the module pin leaves the 1.0 to 4.1 volt window for 2 seconds, on the 9-3 the loop is shorted to ground or battery. In 2021 GM listed B0024 01 beside B0017 01 and B001E 01 on Cadillac XT4 to XT6, Blazer, Camaro, Malibu and Acadia as a software fault of the sensing module, pointing to the knee bag and the inboard side bag of the driver seat; new SDM software fixes it (PIT5827, 21-NA-176). A right side airbag meaning is not publicly documented. Airbag lamp on."
    de: "In den öffentlichen J2012-Listen fehlt B0024; der rechte vordere Seitenairbag hat dort B0028. General Motors hat die Nummer zweimal vergeben. Ältere Steuergeräte wie im Saab 9-5 von 2006 und im Saab 9-3 meinen damit Fahrer-Frontairbag Stufe 1: Beim 9-5 verlässt die Spannung am Steuergerätepin 2 Sekunden lang das Fenster 1,0 bis 4,1 Volt, beim 9-3 hat der Kreis Masse- oder Plusschluss. 2021 nannte GM B0024 01 zusammen mit B0017 01 und B001E 01 bei Cadillac XT4 bis XT6, Blazer, Camaro, Malibu und Acadia als Softwarefehler des Steuergeräts, bezogen auf Knieairbag und inneren Seitenairbag am Fahrersitz; Abhilfe ist neue SDM-Software (PIT5827, 21-NA-176). Eine Bedeutung als rechter Seitenairbag ist nicht öffentlich belegt. Airbag-Leuchte an."
  affected_components:
    - right_side_airbag_module
    - srs_control_module
    - srs_wiring
    - seat_harness_connector
  common_causes:
    - id: sdm_software
      likelihood: high
      label:
        en: Restraint module software fault on 2021 GM models (PIT5827, 21-NA-176)
        de: Softwarefehler im Airbagsteuergerät bei GM-Modellen 2021 (PIT5827, 21-NA-176)
    - id: driver_loop_short
      likelihood: medium
      label:
        en: Short to ground or battery in the driver frontal stage 1 loop (older GM/Saab)
        de: Masse- oder Plusschluss im Kreis Fahrer-Frontairbag Stufe 1 (ältere GM/Saab)
    - id: clock_spring_fault
      likelihood: medium
      label:
        en: Worn clock spring in the driver airbag loop (older GM/Saab)
        de: Verschlissene Wickelfeder im Fahrerairbagkreis (ältere GM/Saab)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Depending on the vehicle, the driver airbag or a seat side airbag may be affected
      de: Je nach Fahrzeug ist der Fahrerairbag oder ein Sitz-Seitenairbag betroffen
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
