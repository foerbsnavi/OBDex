- code: B0023
  category: body
  title:
    en: Left Side Deployment Stage 1 Loop Short to Ground
    de: Seitenairbag links Stufe 1 Auslösekreis Kurzschluss nach Masse
  description:
    en: "B0023 does not appear in the J2012 code lists, which jump from B0022 to B0028, and no carmaker documents it as a ground short of a left side airbag stage. It is documented at General Motors with another meaning: in the Saab 9-4X 2011 manual B0023 is the right roof rail (curtain) airbag loop, with bytes for short to battery (01), short to ground (02), open (04) and resistance above 4.2 or below 1.4 ohms (0D, 0E), each confirmed after 2 seconds. GM bulletin 08-09-41-002H lists B0023 among codes caused by unseated connector position locks on many 2005-14 models. A real ground short in a squib loop can stop deployment, so first read which module and descriptor the scan tool reports. Airbag lamp on."
    de: "In den J2012-Listen fehlt B0023 – sie springen von B0022 auf B0028 –, und kein Hersteller beschreibt ihn als Masseschluss einer linken Seitenairbagstufe. Belegt ist er bei General Motors mit anderer Bedeutung: Im Handbuch des Saab 9-4X 2011 steht B0023 für den Kreis des rechten Dachrahmen-Kopfairbags, mit Bytes für Plusschluss (01), Masseschluss (02), Unterbrechung (04) sowie Widerstand über 4,2 bzw. unter 1,4 Ohm (0D, 0E), jeweils nach 2 Sekunden bestätigt. Laut GM-Bulletin 08-09-41-002H entstand B0023 bei vielen Modellen 2005–14 durch Steckersicherungen, die nicht richtig eingerastet waren. Ein echter Masseschluss im Zündkreis kann die Auslösung verhindern; deshalb zuerst Steuergerät und Klartext im Tester lesen. Airbag-Leuchte an."
  affected_components:
    - driver_side_airbag
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: connector_lock_unseated
      likelihood: high
      label:
        en: Connector position assurance not engaged, so shorting bars bridge the loop (GM 08-09-41-002H)
        de: Steckersicherung nicht eingerastet, Kurzschlussbrücken überbrücken den Kreis (GM 08-09-41-002H)
    - id: harness_short_ground
      likelihood: medium
      label:
        en: Chafed lead touching body ground
        de: Durchgescheuerte Leitung mit Kontakt zur Karosseriemasse
    - id: airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the affected airbag module
        de: Innerer Fehler im betroffenen Airbagmodul
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: The airbag on the affected loop may not deploy
      de: Der Airbag am betroffenen Kreis löst eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
