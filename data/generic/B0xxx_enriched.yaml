- code: B0119
  category: body
  title:
    en: Camera Washer Actuator Q
    de: Kamera-Wascher-Aktuator Q
  description:
    en: B0119 names actuator Q. Land Rover's SSM76076 (2023) for the Defender (L663) from model year 2020 traces dripping headlamp washer jets and a dripping rear camera washer jet to a one-way valve in the feed pipe that no longer seals; the dealer tool runs a guided leak test and may call for a new rear camera washer hose with the valve. Headlamp and camera washing thus often share fluid and parts. ARaymond's cleaning brochure lists non-return valves, quick connectors and heated nozzles as building blocks of such circuits. A leaking valve is a hydraulic fault, not an electrical one; B0119 itself points to actuator Q or its wiring. Which camera Q serves is not published, and no maker documents the code.
    de: B0119 bezeichnet Aktor Q. Land Rovers SSM76076 (2023) zum Defender (L663) ab Modelljahr 2020 führt tropfende Scheinwerfer-Waschdüsen und eine tropfende Heckkamera-Waschdüse auf ein Einwegventil in der Zuleitung zurück, das nicht mehr dichtet; das Werkstattgerät führt durch einen Lecktest und verlangt gegebenenfalls einen neuen Heckkamera-Waschschlauch samt Ventil. Scheinwerfer- und Kamerawäsche teilen sich also oft Flüssigkeit und Bauteile. Die Reinigungsbroschüre von ARaymond nennt Rückschlagventile, Schnellkupplungen und beheizte Düsen als Bausteine solcher Kreise. Ein undichtes Ventil ist ein hydraulischer, kein elektrischer Fehler; B0119 selbst deutet auf Aktor Q oder seine Leitung. Welche Kamera Q versorgt, ist nicht veröffentlicht, und kein Hersteller dokumentiert den Code.
  affected_components:
