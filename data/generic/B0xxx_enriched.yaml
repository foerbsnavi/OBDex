- code: B00A0
  category: body
  title:
    en: Occupant Classification System
    de: Insassenklassifizierungssystem
  description:
    en: B00A0 is the catch-all code for occupant classification, the function that judges at the front passenger place whether the passenger airbag may fire and with what force, as FMVSS 208 demands for advanced airbags. Mitsubishi lists it as OCCUPANT SENS UNIT with ten subtypes, among them sensor faults (-02/-09), low supply or unfinished zero-point reset (-22, battery at 9 V or less), lost communication (-83/-86/-87/-88) and a reset error (-93); most are set after 2 s with the ignition on, -88 after 5 s and -87 after 10 s. Mazda traced B00A0:09 on the CX-3 and CX-5 to a sensor too quick to react to low voltage while cranking and replaces the cushion (08-002/23). Nissan reprograms the OCS unit when zero reset fails (NTB19-071D). The airbag lamp lights.
    de: B00A0 ist der Sammelcode des Insassenklassifizierungssystems, das am Beifahrersitz entscheidet, ob und wie stark der Beifahrerairbag zünden darf – so verlangt es FMVSS 208 für adaptive Airbags. Mitsubishi führt ihn als OCCUPANT SENS UNIT mit zehn Untertypen, etwa Sensorfehler (-02/-09), Unterspannung oder nicht abgeschlossener Nullabgleich (-22, Batterie 9 V oder weniger), Kommunikationsausfall (-83/-86/-87/-88) und Reset-Fehler (-93); meist gilt eine Verzögerung von 2 s bei Zündung an, bei -88 5 s, bei -87 10 s. Mazda führt B00A0:09 bei CX-3 und CX-5 auf einen Sensor zurück, der beim Anlassen zu schnell auf Unterspannung ansprach, und tauscht das Sitzpolster (08-002/23). Nissan programmiert das OCS-Gerät neu, wenn der Nullabgleich scheitert (NTB19-071D). Die Airbag-Leuchte geht an.
  affected_components:
