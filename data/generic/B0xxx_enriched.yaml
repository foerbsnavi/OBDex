        de: Rückhaltesteuergerät für einen fünften Positionssensor konfiguriert, der nicht verbaut ist
    - id: sensor_fault
      likelihood: low
      label:
        en: Internal fault of position sensor E
        de: Interner Fehler von Positionssensor E
  symptoms:
