- code: B00E1
  category: body
  title:
    en: Third Row Right Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B dritte Reihe rechts Auslösesteuerung
  description:
    en: On the right seat of the third row, B00E1 stands for a B-stage tensioner whose firing loop shows an open, a short or an out-of-window resistance. In no public service document does a manufacturer use B00E1. Where Mercedes-Benz fits a right third-row tensioner, it is the retractor, and the airbag unit reports it as B00E6 (LI54.21-P-070658, versions of March and June 2020). A B stage there would be a buckle or anchor device; NHTSA's 2013 study of pretensioners explains how a buckle unit drags the buckle down by a cable when its charge fires, and GM lists buckle, retractor and anchor units as the three possible types. Expect a lit airbag lamp and no tensioning from this stage until the loop is repaired.
    de: "Am rechten Platz der dritten Reihe steht B00E1 für einen Straffer der Stufe B, dessen Zündkreis unterbrochen, kurzgeschlossen oder außerhalb des zulässigen Widerstands ist. Kein Hersteller verwendet B00E1 in einem öffentlich zugänglichen Werkstattdokument. Wo Mercedes-Benz dort einen Straffer verbaut, ist es der Aufroller, und das Airbag-Steuergerät meldet ihn als B00E6 (LI54.21-P-070658, Fassungen vom März und Juni 2020). Eine Stufe B wäre an dieser Stelle ein Schloss- oder Verankerungsstraffer; die NHTSA-Studie von 2013 beschreibt, wie ein Schlossstraffer das Gurtschloss beim Zünden über ein Seil nach unten zieht, und GM nennt Schloss, Aufroller und Verankerung als die drei Bauarten. Folge: Airbag-Lampe an, diese Stufe strafft bis zur Reparatur nicht."
  affected_components:
    - third_row_right_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: right_buckle_connector
      likelihood: high
      label:
        en: Connector of the right third-row buckle or anchor tensioner not fully seated
        de: Stecker des rechten Schloss- bzw. Verankerungsstraffers in der dritten Reihe nicht ganz eingerastet
    - id: cargo_floor_harness
      likelihood: medium
      label:
        en: Wiring under the cargo floor or side trim pinched or damaged by loads
        de: Leitung unter dem Laderaumboden oder der Seitenverkleidung eingeklemmt oder durch Ladung beschädigt
    - id: srs_module_contact
      likelihood: low
      label:
        en: Raised contact resistance at the airbag module plug
        de: Erhöhter Übergangswiderstand am Stecker des Airbag-Steuergeräts
    - id: squib_internal
      likelihood: low
      label:
        en: Defective squib inside the tensioner
        de: Defekte Zündpille im Straffer
  symptoms:
    - en: Airbag lamp on in the instrument cluster
      de: Airbag-Leuchte im Kombiinstrument an
    - en: Occupant at the right of the third row gets no B-stage tensioning
      de: Insasse rechts in der dritten Reihe erhält keine Straffung durch Stufe B
    - en: "Safety note: the tensioner contains a pyrotechnic charge; only work on it de-energised (battery off, wait time) and leave it to a specialist workshop"
      de: "Sicherheitshinweis: Der Straffer enthält eine pyrotechnische Ladung; nur spannungsfrei (Batterie ab, Wartezeit) und durch eine Fachwerkstatt bearbeiten lassen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 3]
  flags:
