- code: B0039
  category: body
  title:
    en: Second Row Right Frontal Stage 1 Deployment Control
    de: Frontairbag zweite Sitzreihe rechts Stufe 1 Auslösesteuerung
  description:
    en: B0039 belongs to the right-hand rear-seat frontal airbag, stage 1, which is the primary charge that the module fires in any frontal crash severe enough to need the bag. The bag sits in the back of the passenger seat ahead; Mercedes-Benz offers this layout as an S-Class option and fits it as standard to the Maybach, where it is meant to ease head and neck loads on belted outer rear passengers. An older Daimler application already described a bag at the rear of a front seat that spreads a channel frame and fills with ambient air. No public DTC table pairs B0039 with this bag. GM Global A modules use B0039 for the right rear belt pretensioner instead (Saab 9-4X 2011). Airbag lamp on.
    de: B0039 gehört zur Stufe 1 des rechten Fond-Frontairbags, also zur Hauptladung, die das Steuergerät bei jedem ausreichend schweren Frontalaufprall zündet. Der Airbag sitzt in der Rückseite des Beifahrersitzes; Mercedes-Benz bietet diese Bauart in der S-Klasse an und baut sie im Maybach serienmäßig ein, um Kopf und Nacken angegurteter Fondgäste auf den Außenplätzen zu entlasten. Schon eine ältere Daimler-Anmeldung beschreibt einen Airbag an der Rückseite eines Vordersitzes, der ein Kanalgerüst aufspannt und sich mit Umgebungsluft füllt. Keine öffentliche Codetabelle verbindet B0039 mit diesem Airbag. GM-Steuergeräte der Global-A-Reihe nutzen B0039 für den Gurtstraffer hinten rechts (Saab 9-4X 2011). Airbag-Leuchte an.
  affected_components:
    - second_row_right_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seatback_connector
      likelihood: high
      label:
        en: Loose or corroded connector of the airbag lead routed through the front seat backrest
        de: Lockerer oder korrodierter Stecker der Airbagleitung in der Vordersitzlehne
    - id: rear_airbag_module
      likelihood: medium
      label:
        en: Internal fault in the right rear-seat airbag module
        de: Innerer Fehler im rechten Fond-Airbagmodul
    - id: harness_strain_seat_track
      likelihood: medium
      label:
        en: Lead stretched or pinched by the seat track or folding mechanism
        de: Leitung durch Sitzschiene oder Klappmechanismus gedehnt oder eingeklemmt
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right rear passenger may lose frontal airbag protection
      de: Fahrgast hinten rechts verliert womöglich den Frontairbagschutz
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
