- code: B0125
  category: body
  title:
    en: Night Vision Control Module
    de: Nachtsicht-Steuergerät
  description:
    en: "B0125 concerns the night vision control module, which processes the camera image and passes it to the display. Stellantis uses this code: on the 2023 Jeep Grand Cherokee the cluster stores B0125-02, Night Vision Control Module general signal failure, alongside U02BD (lost communication) in the BCM. Case S2208000163 blames misaligned or not fully seated terminals at connector D3944A of the processing module; case S2408000119 adds B14FB-31 (no video signal) in that module and names a cracked camera lens as one cause. GM's PIT5785 for Cadillac XT5 and XT6 shows the same link from the cluster end: an unplugged black LVDS connector there leaves a green pixelated picture. Night vision is lost; driving is not affected."
    de: "B0125 betrifft das Nachtsicht-Steuergerät, das das Kamerabild aufbereitet und an die Anzeige gibt. Stellantis nutzt den Code: Beim Jeep Grand Cherokee 2023 speichert das Kombiinstrument B0125-02 (allgemeiner Signalfehler des Nachtsicht-Steuergeräts), dazu das BCM U02BD (Kommunikation verloren). Fall S2208000163 nennt verschobene oder nicht eingerastete Kontakte im Stecker D3944A des Verarbeitungsmoduls; Fall S2408000119 ergänzt B14FB-31 (kein Videosignal) in diesem Modul und eine gesprungene Kameralinse als Ursache. GMs PIT5785 zu Cadillac XT5 und XT6 zeigt dieselbe Strecke vom Kombiinstrument aus: Ein dort abgezogener schwarzer LVDS-Stecker hinterlässt ein grün verpixeltes Bild. Die Nachtsicht entfällt, das Fahren nicht."
  affected_components:
    - night_vision_module
    - instrument_cluster
    - wiring_harness
  common_causes:
    - id: module_connector_terminals
      likelihood: high
      label:
        en: Misaligned, bent or not fully seated terminals at the module connector
        de: Verschobene, verbogene oder nicht eingerastete Kontakte am Modulstecker
    - id: lvds_link_cluster
      likelihood: medium
      label:
        en: Video link (LVDS) to the cluster loose or damaged
        de: Videoverbindung (LVDS) zum Kombiinstrument locker oder beschädigt
    - id: camera_signal_faulty
      likelihood: medium
      label:
        en: Camera delivers no usable image, e.g. cracked lens
        de: Kamera liefert kein brauchbares Bild, etwa bei gesprungener Linse
    - id: module_internal
      likelihood: low
      label:
        en: Control module internally defective
        de: Steuergerät intern defekt
  symptoms:
    - en: Night vision unavailable message in the cluster
      de: Meldung „Nachtsicht nicht verfügbar“ im Kombiinstrument
    - en: No, frozen or pixelated night vision image
      de: Kein, eingefrorenes oder verpixeltes Nachtsichtbild
