- code: B0031
  category: body
  title:
    en: Second Row Left Frontal Stage 1 Deployment Control
    de: Frontairbag zweite Sitzreihe links Stufe 1 Auslösesteuerung
  description:
    en: "B0031 points to the first firing stage of a frontal airbag that protects the left rear passenger, so it can only be stored where such a bag exists. The known production case is Mercedes-Benz's S-Class of 2020: an optional rear airbag (standard on the Maybach) unfolds from the back of the front seat for the two outer rear seats, built as a gas-filled tube frame that draws ambient air into its cushion. No carmaker publishes B0031 with this meaning. GM used the number differently: the Saab 9-4X 2011 manual groups B0031 with its front seat side airbag codes. Stage 2 and 3 of the same bag follow as B0032 and B0033. The airbag lamp lights and the rear bag may not fire in a frontal crash."
    de: "B0031 meldet die erste Zündstufe eines Frontairbags für den Fahrgast hinten links und kann daher nur auftreten, wo es ein solches Bauteil gibt. Bekanntes Serienbeispiel ist die Mercedes-Benz S-Klasse ab 2020: Ein Fond-Airbag (aufpreispflichtig, beim Maybach serienmäßig) entfaltet sich aus der Rückseite der Vordersitzlehne für die beiden äußeren Rücksitze; ein gasgefülltes Schlauchgerüst spannt das Kissen auf, das sich mit Umgebungsluft füllt. Mit dieser Bedeutung dokumentiert kein Hersteller den Code öffentlich. GM vergab die Nummer anders – die Saab-9-4X-Anleitung von 2011 fasst B0031 mit den Codes der Vordersitz-Seitenairbags zusammen. Stufe 2 und 3 desselben Airbags sind B0032 und B0033. Die Airbag-Leuchte brennt."
  affected_components:
    - second_row_left_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seatback_connector
      likelihood: high
      label:
        en: Loose or corroded connector of the airbag lead routed through the front seat backrest
        de: Lockerer oder korrodierter Stecker der Airbagleitung in der Vordersitzlehne
    - id: rear_airbag_module
      likelihood: medium
      label:
        en: Internal fault in the rear-seat airbag module in the front seatback
        de: Innerer Fehler im Fond-Airbagmodul in der Vordersitzlehne
    - id: harness_strain_seat_track
      likelihood: medium
      label:
        en: Lead stretched or pinched by the seat track or folding mechanism
        de: Leitung durch Sitzschiene oder Klappmechanismus gedehnt oder eingeklemmt
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left rear passenger may lose frontal airbag protection in a crash
      de: Fahrgast hinten links hat bei einem Frontalaufprall womöglich keinen Airbagschutz
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
