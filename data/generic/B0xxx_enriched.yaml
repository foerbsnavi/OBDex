- code: B00BA
  category: body
  title:
    en: Driver Seat Occupant Position Sensor D
    de: Fahrersitz Insassenpositionssensor D
  description:
    en: "B00BA covers position input D, the fourth of the driver seat sensors. Its use by a carmaker is not documented publicly. Early out-of-position concepts mixed several sensor kinds: a 1989 Automotive Systems Laboratory patent uses a pyroelectric detector for presence, ultrasound for the distance to wheel and dashboard and a pressure transducer under the occupant for weight, recommends redundant sensors of each kind against false readings, warns the occupant with a lamp and fires a multi-cartridge driver inflator step by step to match size and position. A fourth slot thus suits a redundant sensor or one working on another principle, but no maker confirms what D stands for. B00BA indicates a fault in that input; the warning lamp for the airbags lights and position-based staging is limited."
    de: "B00BA betrifft Positionseingang D, den vierten Sensor am Fahrersitz. Öffentlich beschreibt kein Hersteller den Code. Frühe Konzepte gegen falsche Sitzhaltung kombinierten mehrere Sensorarten: Ein Patent von Automotive Systems Laboratory aus dem Jahr 1989 erkennt die Anwesenheit pyroelektrisch, misst den Abstand zu Lenkrad und Armaturenbrett per Ultraschall und das Gewicht mit einem Druckaufnehmer unter dem Insassen, empfiehlt je Art redundante Sensoren gegen Fehlmessungen, warnt per Leuchte und zündet einen Fahrer-Gasgenerator mit mehreren Kartuschen stufenweise passend zu Größe und Position. Ein vierter Platz eignet sich also für einen redundanten oder anders arbeitenden Sensor; was D bedeutet, bestätigt aber kein Hersteller. B00BA zeigt einen Fehler dieses Eingangs; die Airbag-Leuchte ist an, die angepasste Auslösung eingeschränkt."
  affected_components:
    - driver_occupant_position_sensor_d
    - srs_wiring
    - srs_control_module
  common_causes:
