- code: B007F
  category: body
  title:
    en: Passenger Seat Belt Pretensioner C Deployment Control
    de: Beifahrer-Gurtstraffer C Auslösesteuerung
  description:
    en: "B007F covers the passenger's third (C) pretensioner and is the best-documented code of this series. Mercedes lists B007F13 as an open in the squib of the front passenger's emergency tensioning retractor (A-, CLA- and GLB-Class). FCA uses the same slot for the same part: STAR case S2008000193 for the 2020–2021 Ram 1500 links B007F-2B to a loose or spread plug of the retractor down at the passenger-side B-pillar, repaired with kit 68148100AA, and case S2008000137 for the 2020 Jeep Grand Cherokee reports B007F-11, a short to ground, from a body harness pinched by B-pillar trim. The retractor is a pyrotechnic unit that rewinds the webbing in a crash. With B007F set, the airbag lamp is on and the passenger's shoulder belt lacks pretensioning."
    de: "B007F betrifft den dritten Gurtstraffer (Stufe C) am Beifahrersitz und ist der am besten belegte Code dieser Reihe. Mercedes führt B007F13 als Unterbrechung an der Zündpille des Gurtstraffer-Aufrollers auf der Beifahrerseite (A-, CLA- und GLB-Klasse). FCA belegt den Platz mit demselben Bauteil: STAR-Fall S2008000193 zum Ram 1500 (2020–2021) verknüpft B007F-2B mit einem lockeren oder aufgeweiteten Aufrollerstecker unten an der rechten B-Säule, instand gesetzt mit Satz 68148100AA; Fall S2008000137 zum Jeep Grand Cherokee 2020 meldet B007F-11, Masseschluss, durch einen von der B-Säulenverkleidung eingeklemmten Karosseriekabelbaum. Der Aufroller ist ein pyrotechnisches Bauteil, das bei einem Unfall das Gurtband zurückspult. Mit gesetztem B007F leuchtet die Airbag-Lampe, und der Schultergurt des Beifahrers wird nicht vorgespannt."
  affected_components:
    - passenger_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: retractor_connector_spread
      likelihood: high
      label:
        en: Retractor plug at the lower passenger-side B-pillar loose or with spread terminals (FCA S2008000193)
        de: Aufrollerstecker unten an der rechten B-Säule locker oder mit aufgeweiteten Kontakten (FCA S2008000193)
    - id: harness_pinched_trim
      likelihood: medium
      label:
