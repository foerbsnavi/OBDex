- code: B0080
  category: body
  title:
    en: Driver Seat Belt Load Limiter Deployment Control
    de: Fahrer-Gurtkraftbegrenzer Auslösesteuerung
  description:
    en: "B0080 reports a fault in the firing loop that switches the driver's belt force limiter. In adaptive retractors a small squib, fired by the airbag module, changes the level at which the webbing is paid out, so the chest load suits crash severity and occupant. Mercedes-Benz uses the code exactly so: topic LI54.21-P-070658 (cars of the 177, 118 and 247 series) gives B008013 for an interrupted igniter of the driver's belt force limiter, traced to raised resistance at the airbag module plug. Ford names B0080 among the restraint module codes cured by reprogramming on 2017–2018 Fusion/MKZ, without giving its meaning. Older GM-built Saabs (9-3, 9-5) use B0080 for an internal fault of the driver-side B-pillar or side impact sensor instead. With the code set, the airbag lamp is lit."
    de: "B0080 meldet einen Fehler im Zündkreis, der den Gurtkraftbegrenzer des Fahrers umschaltet. Bei adaptiven Aufrollern zündet das Airbag-Steuergerät dazu eine kleine Pille, die festlegt, ab welcher Kraft das Gurtband nachgibt – passend zu Unfallschwere und Insasse. Mercedes-Benz belegt genau diese Bedeutung: Die Information LI54.21-P-070658 (A-Klasse, CLA, GLB) führt B008013 als Unterbrechung an der Zündpille des Fahrer-Gurtkraftbegrenzers, Ursache war erhöhter Übergangswiderstand am Steckverbinder des Steuergeräts. Ford zählt B0080 bei Fusion/MKZ 2017–2018 zu den Codes, die eine Neuprogrammierung des Rückhaltemoduls behebt, ohne Bedeutung. Ältere Saab von GM (9-3, 9-5) nutzen B0080 dagegen für einen inneren Fehler des Seiten- bzw. B-Säulen-Sensors links. Die Airbag-Leuchte brennt."
  affected_components:
    - driver_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: module_connector_resistance
      likelihood: high
      label:
        en: Raised contact resistance at the airbag module connector (Mercedes LI54.21-P-070658)
        de: Erhöhter Übergangswiderstand am Stecker des Airbag-Steuergeräts (Mercedes LI54.21-P-070658)
    - id: retractor_harness_fault
      likelihood: medium
      label:
        en: Chafed or disconnected lead to the driver's retractor at the B-pillar
        de: Durchgescheuerte oder getrennte Leitung zum Fahrer-Aufroller an der B-Säule
    - id: restraint_module_software
      likelihood: low
      label:
        en: Restraint module software needing an update (Ford Fusion/MKZ)
        de: Software des Rückhaltemoduls benötigt ein Update (Ford Fusion/MKZ)
    - id: limiter_squib_fault
      likelihood: low
      label:
        en: Internal fault of the load limiter squib in the retractor
        de: Interner Fehler der Zündpille des Gurtkraftbegrenzers im Aufroller
  symptoms:
    - en: Airbag warning lamp on, sometimes with an SRS message in the cluster
      de: Airbag-Warnleuchte an, teils mit SRS-Meldung im Kombiinstrument
    - en: Driver's belt keeps only its basic force limiting level in a crash
      de: Fahrergurt behält bei einem Unfall nur die Grundstufe der Kraftbegrenzung
    - en: "Safety note: pyrotechnic part in the driver's retractor; work only de-energised (battery off, wait time) at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Bauteil im Fahrer-Aufroller; nur spannungsfrei (Batterie ab, Wartezeit) in einer Fachwerkstatt bearbeiten"
  repair:
