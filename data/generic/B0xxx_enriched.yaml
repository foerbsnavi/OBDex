- code: B0085
  category: body
  title:
    en: Second Row Right Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer zweite Reihe rechts Auslösesteuerung
  description:
    en: B0085 points to the igniter circuit that would change the force level of the right rear belt. No maker documents it with that meaning. Joyson offers dual-stage limiters with degressive or adaptive behaviour, and an Autoliv patent switches from the stiff to the soft torsion section when the controller fires a squib once cabin deceleration crosses a threshold; in a rear seat such a loop would be watched like any other squib. IIHS rear-seat work found the right rear position tested less often than the left (16 against 27 runs). In practice, B0085 on a GM Global A car (Saab 9-4X 2011) is the left front side impact sensor, reported for shorts, opens, current above 23 mA, internal failure, a wrong part or invalid serial data. Only the make tells which part is meant.
    de: B0085 verweist auf den Zündkreis eines umschaltbaren Kraftbegrenzers am rechten Rücksitz. Kein Hersteller belegt ihn in dieser Bedeutung. Joyson bietet zweistufige Begrenzer mit degressivem oder adaptivem Verhalten an, und ein Autoliv-Patent schaltet vom steifen auf den weichen Torsionsabschnitt um, sobald das Steuergerät nach Überschreiten einer Verzögerungsschwelle eine Pille zündet; im Fond würde ein solcher Kreis wie jeder andere überwacht. In den IIHS-Rücksitztests wurde rechts hinten seltener gemessen als links (16 gegenüber 27 Versuchen). Praktisch bezeichnet B0085 beim Saab 9-4X von 2011 (GM Global A) den vorderen linken Seitenaufprallsensor, gemeldet bei Kurzschluss, Unterbrechung, Strom über 23 mA, innerem Fehler, falschem Teil oder ungültigen Daten. Erst die Marke klärt das Bauteil.
  affected_components:
    - second_row_right_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_left_side_impact_sensor
      likelihood: high
      label:
        en: On GM vehicles, left front side impact sensor or its door wiring faulty (different meaning)
        de: Bei GM linker vorderer Seitenaufprallsensor oder dessen Türleitung defekt (andere Bedeutung)
    - id: rear_right_wiring
