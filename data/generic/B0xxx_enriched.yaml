        de: Erhöhter Widerstand am Stecker des Rückhaltesteuergeräts
    - id: third_row_left_connector
      likelihood: medium
      label:
        en: Left third-row retractor connector disturbed during trim or seat work
        de: Verbinder des linken Aufrollers der dritten Reihe bei Verkleidungs- oder Sitzarbeiten gelöst
    - id: srs_module_fault
      likelihood: low
      label:
