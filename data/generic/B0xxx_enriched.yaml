- code: B0101
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator B
    de: Sensorreinigung Luftgebläse-Aktuator B
  description:
    en: "B0101 reports a fault of the second cleaning air source, blower B. A second unit makes sense where sensors are spread over the body: a roof pod and a bumper or corner sensor need separate air supplies. Not every design uses a fan; Uber's 2016 patent (now Aurora) feeds lidar and camera air knives from a compressor and accumulator held at about 140–160 psi, with one solenoid valve per outlet and a pressure sensor that raises a warning on a leak. AUMOVIO's lidar nozzles use compressed air to strip water droplets and to clear dust without washer fluid, and Kautex's Allegro systems combine water and air for camera and lidar. The split between A and B is not published by any carmaker, nor is B0101 itself."
    de: "B0101 meldet einen Fehler der zweiten Reinigungs-Luftquelle, Gebläse B. Eine zweite Einheit ist sinnvoll, wo Sensoren über die Karosserie verteilt sind: Dachmodul und Stoßfänger- oder Ecksensor brauchen getrennte Luftversorgung. Nicht jede Bauart nutzt einen Lüfter; Ubers Patent von 2016 (heute Aurora) speist die Luftmesser an Lidar und Kameras aus Kompressor und Speicher mit etwa 140–160 psi, mit je einem Magnetventil pro Auslass und einem Drucksensor, der bei Undichtigkeit warnt. Die Lidar-Düsen von AUMOVIO blasen mit Druckluft Wassertropfen ab und entfernen Staub ganz ohne Waschflüssigkeit; Kautex kombiniert in den Allegro-Systemen Wasser und Luft für Kamera und Lidar. Wie A und B aufgeteilt sind, veröffentlicht kein Autohersteller, ebenso wenig B0101 selbst."
  affected_components:
    - sensor_cleaning_air_blower_b
    - object_detection_maintenance_module_b
  common_causes:
    - id: blower_b_failure
      likelihood: high
      label:
        en: Blower or compressor B worn out or drawing too much current
        de: Gebläse bzw. Kompressor B verschlissen oder mit zu hoher Stromaufnahme
    - id: air_path_leak
      likelihood: medium
      label:
        en: Leaking or split air hose so blower B cannot build pressure
        de: Undichter oder gerissener Luftschlauch, Gebläse B baut keinen Druck auf
    - id: water_ingress
      likelihood: low
      label:
        en: Water or salt ingress into blower B at an exposed mounting point
        de: Wasser- oder Salzeintritt in Gebläse B an exponierter Einbaustelle
  symptoms:
    - en: Cleaning fault shown for the sensor group served by blower B
      de: Reinigungsstörung für die Sensorgruppe, die Gebläse B versorgt
    - en: Water droplets or dust remain on lidar or camera window
      de: Wassertropfen oder Staub bleiben auf Lidar- oder Kamerafenster
    - en: Assistance functions reduced when the affected sensor goes blind
      de: Assistenzfunktionen eingeschränkt, sobald der betroffene Sensor erblindet
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [100, 1200]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [B0100, B0103, B0105, U022F]
  sources:
    - https://patents.google.com/patent/US10220817B2/en
    - https://www.aumovio.com/en/solutions/driver-assistance/optical-sensors-and-windshield-cleaning-systems.html
    - https://www.kautex.com/en/allegro-cleaning-systems
  reviewed: '2026-11-06'

- code: B0102
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator A Control
    de: Sensorreinigung Luftgebläse-Aktuator A Ansteuerung
  description:
    en: "B0102 narrows the blower A problem down to its control path: the controlling module sees a wrong voltage or current on the line that commands blower A, typically an open circuit, a short to ground or a short to supply. In Ford's lidar cleaning patent US10569746B2 a computer opens airflow from a blower or compressor by driving an electric solenoid valve and may modulate it; when window opacity exceeds about 30 %, air runs first and autonomous mode may be dropped. Ford's later patent US12115948B2 places the blower beside the sensor on its bracket, so its feed runs into an exposed pod. Valeo notes that an obstructed lens can end automated operation. No carmaker publishes B0102. Unlike B0100, the blower itself may be fine here."
    de: "B0102 grenzt das Problem von Gebläse A auf die Ansteuerung ein: Das steuernde Modul misst auf der Leitung, die Gebläse A schaltet, falsche Spannung oder falschen Strom, meist Unterbrechung, Masse- oder Plusschluss. In Fords Lidar-Reinigungspatent US10569746B2 öffnet ein Rechner den Luftstrom aus Gebläse oder Kompressor über ein elektrisches Magnetventil und kann ihn dosieren; liegt die Trübung des Fensters über etwa 30 %, läuft zuerst Luft, und der autonome Modus kann enden. Fords späteres Patent US12115948B2 setzt das Gebläse neben den Sensor auf den Halter, die Zuleitung führt also in ein exponiertes Modul. Valeo weist darauf hin, dass eine verdeckte Linse den automatisierten Betrieb beenden kann. Kein Autohersteller veröffentlicht B0102. Anders als bei B0100 kann das Gebläse selbst hier intakt sein."
  affected_components:
    - sensor_cleaning_air_blower_a
    - actuator_wiring
    - object_detection_maintenance_module_a
  common_causes:
    - id: control_wire_open
      likelihood: high
      label:
        en: Broken control wire or pin between module and blower A
        de: Gebrochene Steuerleitung oder Kontakt zwischen Modul und Gebläse A
    - id: control_wire_short
      likelihood: medium
      label:
        en: Control line of blower A shorted to ground or to battery voltage
        de: Steuerleitung von Gebläse A mit Masse oder Batteriespannung kurzgeschlossen
    - id: module_driver_fault
      likelihood: low
      label:
        en: Output stage in the cleaning or maintenance module defective
        de: Endstufe im Reinigungs- bzw. Wartungssteuergerät defekt
  symptoms:
    - en: Blower A never starts although cleaning is requested
      de: Gebläse A läuft trotz Reinigungsanforderung nie an
    - en: Blower A runs constantly when the line is shorted to supply
      de: Gebläse A läuft dauernd, wenn die Leitung Plusschluss hat
    - en: Sensor blocked message and limited assistance features
      de: Meldung „Sensor blockiert“ und eingeschränkte Assistenzfunktionen
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [50, 500]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [B0100, B0103, B0104]
  sources:
    - https://patents.google.com/patent/US10569746B2/en
    - https://patents.google.com/patent/US12115948B2/en
    - https://www.valeo.com/en/sensor-and-camera-cleaning-system-for-cars/
  reviewed: '2026-11-06'

- code: B0103
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator B Control
    de: Sensorreinigung Luftgebläse-Aktuator B Ansteuerung
  description:
    en: "With B0103 the module flags the command line of blower B, not the blower: open wire, short or a driver that cannot switch. In compressed-air layouts the controlled element is often a valve bank. Uber's patent lets the controller fire individual solenoids for set times, for example one valve for three seconds, so a single faulty drive line leaves only part of the lidar or one camera without air. Ford’s test-car tiara blows an air curtain through slots beside each lens to keep insects off, so a dead control line on the B side lets dirt settle where air should flow. Kautex says its software prioritises cleaning points by coordinating actuators. Which outlets belong to B is unpublished, and no carmaker documents B0103; its partner on the A side is B0102."
    de: "Bei B0103 meldet das Modul die Befehlsleitung von Gebläse B, nicht das Gebläse: offene Leitung, Kurzschluss oder eine Endstufe, die nicht schalten kann. Bei Druckluftanlagen ist das geschaltete Bauteil oft ein Ventilblock. In Ubers Patent öffnet die Steuerung einzelne Magnetventile für feste Zeiten, etwa ein Ventil drei Sekunden lang; eine einzige gestörte Ansteuerleitung lässt so nur einen Teil des Lidars oder eine Kamera ohne Luft. Die Tiara von Fords Versuchsfahrzeugen bläst durch Schlitze neben jeder Linse einen Luftvorhang, der Insekten abhält – fällt die Ansteuerung auf der B-Seite aus, setzt sich dort Schmutz ab. Laut Kautex priorisiert die Software Reinigungspunkte, indem sie die Aktoren koordiniert. Welche Auslässe zu B gehören, ist unveröffentlicht; kein Autohersteller dokumentiert B0103. Gegenstück auf der A-Seite ist B0102."
  affected_components:
    - sensor_cleaning_air_blower_b
    - actuator_wiring
    - object_detection_maintenance_module_b
  common_causes:
    - id: control_harness_b
      likelihood: high
      label:
        en: Damaged harness or connector in the control path of blower B
        de: Beschädigter Kabelbaum oder Stecker im Ansteuerpfad von Gebläse B
    - id: valve_coil_b
      likelihood: medium
      label:
        en: Solenoid coil of the B air valve open or shorted, where air is valve-switched
        de: Magnetspule des Luftventils B unterbrochen oder kurzgeschlossen, wo Luft über Ventile geschaltet wird
    - id: module_output_b
      likelihood: low
      label:
        en: Failed driver for blower B in the controlling module
        de: Ausgefallene Endstufe für Gebläse B im steuernden Modul
  symptoms:
    - en: Lens streaks or droplets remain after a wash cycle
      de: Nach dem Waschgang bleiben Schlieren oder Tropfen auf der Linse
    - en: Cleaning warning for sensors on the B circuit only
      de: Reinigungswarnung nur für Sensoren am Kreis B
    - en: Assistance features temporarily unavailable in rain or dust
      de: Assistenzfunktionen bei Regen oder Staub zeitweise nicht verfügbar
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [50, 500]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [B0101, B0102, B0105]
  sources:
    - https://patents.google.com/patent/US10220817B2/en
    - https://www.kautex.com/en/mobility/clear-vision-systems-cvs
    - https://www.eenewseurope.com/en/ford-anti-bug-system-keeps-autonomous-sensors-clean/
