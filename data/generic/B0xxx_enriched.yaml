- code: B0124
  category: body
  title:
    en: Night Vision Camera
    de: Nachtsichtkamera
  description:
    en: B0124 points at the night vision camera, usually a far-infrared thermal sensor behind the grille or in the bumper; Teledyne FLIR says it has supplied more than a million automotive thermal sensors. Its exposed position causes most faults. GM's PIC6352A for Cadillac CT6, XT5 and XT6 traces failed camera learn procedures to loose or corroded LVDS connectors between camera B276 and its control module, often after water entered a damaged camera. Bentley's 2055858/1 for the Bentayga describes stone chips letting water in and corroding the camera cable, and Stellantis case S2408000119 warns that a cracked lens distorts the picture. None of these bulletins quotes B0124 itself. Night vision stops working; normal driving is unaffected.
    de: B0124 betrifft die Nachtsichtkamera, meist einen Ferninfrarot-Wärmesensor hinter dem Kühlergrill oder im Stoßfänger; Teledyne FLIR gibt an, über eine Million solcher Fahrzeug-Wärmesensoren geliefert zu haben. Die ausgesetzte Lage verursacht die meisten Fehler. GMs PIC6352A zu Cadillac CT6, XT5 und XT6 führt misslungene Kamera-Anlernvorgänge auf lockere oder korrodierte LVDS-Stecker zwischen Kamera B276 und Steuergerät zurück, oft nachdem Wasser in eine beschädigte Kamera gelangt war. Bentleys 2055858/1 zum Bentayga nennt Steinschläge, durch die Wasser eindringt und das Kamerakabel korrodiert; Stellantis warnt im Fall S2408000119, dass eine gesprungene Linse das Bild verzerrt. B0124 selbst nennt keines dieser Bulletins. Die Nachtsicht fällt aus, das Fahren bleibt normal.
  affected_components:
    - night_vision_camera
    - camera_wiring
  common_causes:
    - id: camera_water_ingress
      likelihood: high
      label:
        en: Water ingress through a stone-chipped or cracked camera window
        de: Wassereintritt durch Steinschlag oder Riss im Kamerafenster
    - id: lvds_connector_corroded
      likelihood: medium
      label:
        en: Loose or corroded LVDS video connector between camera and control module
        de: Lockerer oder korrodierter LVDS-Videostecker zwischen Kamera und Steuergerät
    - id: camera_not_learned
      likelihood: low
      label:
        en: Camera replaced but not learned or calibrated
        de: Kamera getauscht, aber nicht angelernt oder kalibriert
  symptoms:
    - en: Night vision image missing, distorted or pixelated
      de: Nachtsichtbild fehlt, ist verzerrt oder verpixelt
    - en: Message such as night vision unavailable, service required
      de: Meldung wie „Nachtsicht nicht verfügbar, Service erforderlich“
  repair:
    difficulty: medium
    diy_possible: false
