- code: B00D4
  category: body
  title:
    en: Restraint System Malfunction Audible Indicator
    de: Rückhaltesystem-Störungsanzeige akustisch
  description:
    en: "B00D4 concerns the audible restraint warning, the tone that stands in when a fault cannot be shown by the lamp. Ford's 2014 F-150 manual describes it: system readiness is signalled by the warning light, or by a backup tone if the light is out, and a problem announces itself as five beeps in a row, repeated until the fault and the lamp are put right. Audi's 1986 patent explains why such a fallback exists: a blown fuse could kill both the airbag module and its lamp, so the driver would believe the system was fine; it mentions an audible alarm as an alternative signal. No carmaker publishes B00D4. A stored code means the restraint module sees a fault in its chime or speaker path, so a later lamp failure could go wholly unannounced."
    de: "B00D4 betrifft die akustische Rückhaltewarnung, den Ton, der einspringt, wenn die Leuchte einen Fehler nicht zeigen kann. Fords Handbuch zum F-150 von 2014 beschreibt das: Die Bereitschaft meldet die Warnleuchte oder, wenn sie ausgefallen ist, ein Ersatzton; ein Problem kündigt sich durch eine Folge von fünf Pieptönen an, die sich wiederholt, bis Fehler, Leuchte oder beides repariert sind. Ein Audi-Patent von 1986 erklärt, warum es eine solche Rückfallebene gibt: Eine durchgebrannte Sicherung konnte Airbag-Steuergerät und Leuchte zugleich lahmlegen, und der Fahrer hielte das System für intakt; als Alternative nennt es einen akustischen Alarm. Kein Hersteller veröffentlicht B00D4. Der Code heißt, das Rückhaltesteuergerät sieht einen Fehler im Pfad zu Gong oder Lautsprecher; ein späterer Lampenausfall bliebe dann unbemerkt."
  affected_components:
    - srs_audible_indicator
    - instrument_cluster
    - srs_control_module
  common_causes:
    - id: chime_circuit
      likelihood: medium
      label:
        en: Open or shorted lead to the chime or speaker used for restraint warnings
        de: Unterbrochene oder kurzgeschlossene Leitung zum Gong bzw. Lautsprecher der Rückhaltewarnung
    - id: chime_or_speaker_fault
      likelihood: medium
      label:
        en: Chime module or cluster speaker failed
        de: Gongmodul oder Lautsprecher im Kombiinstrument ausgefallen
    - id: network_message
      likelihood: low
      label:
        en: Tone request from the restraint module not received by the sounding unit
        de: Tonanforderung des Rückhaltesteuergeräts kommt beim Tongeber nicht an
  symptoms:
