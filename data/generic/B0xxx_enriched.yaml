    - en: Possible related faults of the seat heater on the same seat
      de: Möglicherweise begleitende Fehler der Sitzheizung desselben Sitzes
    - en: "Safety note: airbag system; work on seat and sensor plugs only de-energised; after replacing a sensor or trim follow the maker's calibration, specialist workshop only"
