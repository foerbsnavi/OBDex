- code: B0123
  category: body
  title:
    en: Pedestrian Alert Speaker B
    de: Fußgänger-Warnlautsprecher B
  description:
    en: B0123 is the same check for pedestrian alert speaker B, which implies a second sounder. Ford's special service message 48451 for 2020 hybrids and plug-ins describes speakers at the front and the rear that sound in forward and reverse between 0 and 30 km/h. In the EU, Regulation 540/2014 made an acoustic vehicle alerting system compulsory on all new hybrid and electric vehicles from July 2021, sounding from start-up to about 20 km/h and when reversing. Stellantis records internal faults of its quiet vehicle pedestrian module as B2779-04, a maker-specific code rather than this one. No manufacturer links B0123 to a particular speaker in public; with B silent, one direction loses its warning and the legal sound requirement is no longer met.
    de: B0123 prüft dasselbe für Fußgänger-Warnlautsprecher B und setzt damit einen zweiten Schallgeber voraus. Fords Service-Mitteilung SSM 48451 zu Hybrid- und Plug-in-Modellen 2020 beschreibt Lautsprecher vorn und hinten, die vorwärts wie rückwärts zwischen 0 und 30 km/h tönen. In der EU schreibt die Verordnung 540/2014 seit Juli 2021 für alle neuen Hybrid- und Elektrofahrzeuge ein akustisches Warnsystem (AVAS) vor, das vom Anfahren bis etwa 20 km/h und beim Rückwärtsfahren klingt. Stellantis speichert innere Fehler seines Fußgänger-Warnmoduls als B2779-04, einen eigenen Herstellercode. Welcher Lautsprecher B ist, legt kein Hersteller öffentlich fest. Schweigt B, fehlt in einer Richtung die Warnung, und die gesetzliche Geräuschpflicht ist nicht mehr erfüllt.
  affected_components:
    - pedestrian_alert_speaker_b
    - speaker_wiring
    - pedestrian_alert_control_module
  common_causes:
    - id: speaker_b_failed
      likelihood: high
      label:
        en: Speaker B defective, for example from moisture in the rear bumper or wheel arch area
        de: Lautsprecher B defekt, etwa durch Feuchtigkeit im Bereich Heckstoßfänger oder Radhaus
    - id: speaker_b_connector
