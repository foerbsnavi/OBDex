- code: B00C8
  category: body
  title:
    en: Passenger Seat Occupant Position Sensor B
    de: Beifahrersitz Insassenpositionssensor B
  description:
    en: "B00C8 marks the second occupant position sensor of the passenger seat. No carmaker publishes it. A position input does not have to look at the person; it can come from how the load spreads over the seat. In a Honda application filed in 2002, a weight unit under each side of the seat carries four strain gauges in a bridge; comparing the front and rear gauge pairs shows whether the occupant sits on the front edge, and comparing the two sides shows a lean to left or right. FMVSS 208 accepts dynamic suppression for the passenger: the bag must already be suppressed when a 3- or 6-year-old dummy moves its head, neck or torso into a zone in front of the cover, a zone each maker defines for itself. Whether B means such a load-based signal is not documented. B00C8 brings on the airbag lamp."
    de: "B00C8 steht für Positionssensor B am Beifahrersitz; öffentlich führt ihn kein Hersteller. Ein Positionseingang muss die Person nicht ansehen, er kann auch aus der Lastverteilung auf dem Sitz stammen. In einer Honda-Anmeldung von 2002 trägt je eine Gewichtseinheit links und rechts unter dem Sitz vier Dehnmessstreifen als Brücke; der Vergleich der vorderen und hinteren Paare zeigt, ob der Insasse auf der Vorderkante sitzt, der Vergleich beider Seiten eine Neigung nach links oder rechts. FMVSS 208 erlaubt für den Beifahrer eine dynamische Abschaltung: Der Airbag muss bereits gesperrt sein, wenn Kopf, Hals oder Rumpf eines Dummys von 3 oder 6 Jahren in eine Zone vor der Abdeckung geraten, die jeder Hersteller selbst festlegt. Ob B ein solches Signal meint, ist offen. B00C8 schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_occupant_position_sensor_b
    - srs_seat_wiring
    - occupant_position_module
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Plug or lead to sensor B damaged when the seat was moved or removed
        de: Stecker oder Leitung zu Sensor B beim Verfahren oder Ausbau des Sitzes beschädigt
    - id: sensor_b_fault
      likelihood: medium
      label:
        en: Strain gauge bridge or position sensor B faulty, drifting with temperature
        de: Dehnmessbrücke bzw. Positionssensor B defekt oder temperaturabhängig driftend
    - id: seat_preload
      likelihood: low
      label:
        en: Seat frame mounted under tension, so the load split looks implausible
        de: Sitzrahmen verspannt montiert, sodass die Lastverteilung unplausibel wirkt
