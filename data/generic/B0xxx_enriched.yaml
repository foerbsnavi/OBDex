- code: B00E2
  category: body
  title:
    en: Third Row Center Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B dritte Reihe Mitte Auslösesteuerung
  description:
    en: "B00E2 would report the firing circuit of a B-stage tensioner at the centre seat of the third row. This is about the rarest slot in the pretensioner table: a centre seat in row three is uncommon, and a second tensioner stage on it even more so. No manufacturer documents the code. For comparison, the third-row tensioners in Mercedes vehicles are listed only as left and right retractor loops (B00E7/B00E6 in LI54.21-P-070658), and the GLS manual of 2017 likewise speaks of retractor tensioners. A B stage would act on the lap section, as Joyson's lap pretensioner does in combination with a retractor. If the code appears, check first whether the module's equipment coding matches the seats actually fitted."
    de: "B00E2 meldet den Zündkreis eines Straffers der Stufe B am Mittelplatz der dritten Reihe. Das ist einer der seltensten Plätze der ganzen Straffertabelle: Ein Mittelsitz in Reihe drei ist schon ungewöhnlich, eine zweite Straffer-Stufe daran erst recht. Kein Hersteller dokumentiert den Code. Zum Vergleich: Die Straffer der dritten Reihe bei Mercedes erscheinen nur als linker und rechter Aufrollerkreis (B00E7/B00E6 in LI54.21-P-070658), und auch das GLS-Handbuch von 2017 spricht von Aufrollerstraffern. Eine Stufe B würde am Beckengurt wirken, wie Joysons Beckenstraffer im Verbund mit einem Aufroller. Taucht der Code auf, zuerst prüfen, ob die Ausstattungscodierung des Steuergeräts zu den tatsächlich eingebauten Sitzen passt."
  affected_components:
    - third_row_center_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Module variant coding expects a centre B stage that is not installed
        de: Variantencodierung des Steuergeräts erwartet eine mittlere Stufe B, die nicht verbaut ist
    - id: center_seat_connector
      likelihood: medium
      label:
        en: Plug under the third-row centre seat disconnected after seat removal
        de: Stecker unter dem Mittelsitz der dritten Reihe nach Sitzausbau nicht wieder gesteckt
    - id: squib_internal
      likelihood: low
      label:
        en: Squib of the centre lap tensioner open or shorted internally
        de: Zündpille des mittleren Beckenstraffers intern unterbrochen oder kurzgeschlossen
  symptoms:
    - en: Airbag indicator stays on after the self-test
      de: Airbag-Kontrollleuchte bleibt nach dem Selbsttest an
    - en: Centre occupant of the third row may lack lap-belt tensioning in a crash
      de: Mittlerer Insasse der dritten Reihe hat bei einem Unfall womöglich keine Beckengurtstraffung
    - en: "Safety note: pyrotechnic restraint component – disconnect the battery, wait the specified time and have the work done by a specialist"
      de: "Sicherheitshinweis: pyrotechnisches Rückhaltebauteil – Batterie abklemmen, vorgeschriebene Wartezeit einhalten und die Arbeit einer Fachwerkstatt überlassen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [60, 600]
    estimated_hours: [0.3, 3]
  flags:
    mil: false
    emissions_relevant: false
