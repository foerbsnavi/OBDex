- code: B00E4
  category: body
  title:
    en: Second Row Right Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C zweite Reihe rechts Auslösesteuerung
  description:
    en: "B00E4 belongs to the outboard seat on the right in the back and its C-stage tensioner. Mercedes-Benz uses it in that sense: every version of LI54.21-P-070658 seen here (December 2019 to June 2020) lists B00E413 as an open in the squib of the tensioning retractor at the rear right. The topic blames higher resistance at the SRS unit connector rather than the tensioner and tells technicians to trace the wire, reseat the plugs and replace the unit only on recurrence. The retractor sits behind the rear trim or in the seat and winds the webbing back when fired, as GM's rescue guide and Joyson explain. No public bulletin from another maker cites B00E4. While the code is stored, the airbag lamp or SRS message stays on."
    de: "B00E4 gehört zum rechten äußeren Rücksitz und dessen Straffer der Stufe C. Mercedes-Benz verwendet den Code so: Alle hier gelesenen Fassungen von LI54.21-P-070658 (Dezember 2019 bis Juni 2020) führen B00E413 als Unterbrechung an der Zündpille des rechten hinteren Gurtstraffer-Aufrollers. Als Ursache nennt die Information nicht den Straffer, sondern erhöhten Widerstand am Stecker des SRS-Steuergeräts: Leitung verfolgen, Stecker neu verbinden, das Steuergerät nur bei erneutem Auftreten tauschen. Der Aufroller sitzt hinter der Fondverkleidung oder im Sitz und spult beim Zünden Gurtband zurück, wie der Rettungsleitfaden von GM und Joyson erklären. Ein öffentliches Bulletin eines anderen Herstellers zu B00E4 gibt es nicht. Solange der Code gespeichert ist, bleibt Airbag-Lampe bzw. SRS-Meldung an."
  affected_components:
    - second_row_right_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: srs_module_contact
      likelihood: high
      label:
        en: Poor contact at the SRS control unit plug (Mercedes A-Class/CLA/GLB)
        de: Schlechter Kontakt am Stecker des SRS-Steuergeräts (Mercedes A-Klasse/CLA/GLB)
    - id: rear_right_connector
