- code: B00C5
  category: body
  title:
    en: Passenger Seat Track Position Restraints Sensor
    de: Beifahrersitz-Schienenpositionssensor (Rückhaltesystem)
  description:
    en: "B00C5 reports a fault of the sensor that tells the restraint controller where the passenger seat sits on its rails. FCA uses the code with exactly this name. A 2022 STAR case for the 2021 Dodge Durango treats B00C5-13, circuit open, with the airbag lamp on: check the yellow 30-way plug I6634A under the passenger seat and make sure the seat track position return wire R730 is seated in cavity B11, using a pull-push-pull test. GPOP tips 68264880A and 9003579 for Dart, Cherokee and Chrysler 200 list B00C5-13 among codes to raise with engineering before an ORC is replaced, and ask for pins that are bent, corroded or opened up to be checked. Such sensors are usually two-wire Hall switches that change state when the rail passes."
    de: "B00C5 meldet einen Fehler des Sensors, der dem Rückhaltesteuergerät die Lage des Beifahrersitzes auf seinen Schienen mitteilt. FCA nutzt den Code genau mit diesem Namen. Ein STAR-Fall von 2022 zum Dodge Durango 2021 behandelt B00C5-13, Kreis offen, bei leuchtender Airbag-Lampe: Den gelben 30-poligen Stecker I6634A unter dem Beifahrersitz prüfen und sicherstellen, dass die Rückleitung R730 des Schienensensors in Kammer B11 fest sitzt, mit Zug-Druck-Zug-Probe. Die GPOP-Hinweise 68264880A und 9003579 für Dart, Cherokee und Chrysler 200 führen B00C5-13 unter den Codes, bei denen vor dem Tausch des ORC die Technik zu fragen ist, und verlangen die Prüfung auf verbogene, korrodierte oder aufgeweitete Kontakte. Solche Sensoren sind meist zweiadrige Hall-Schalter, die umschalten, wenn die Schiene vorbeigleitet."
  affected_components:
    - passenger_seat_track_sensor
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: under_seat_connector
      likelihood: high
      label:
        en: Terminal pushed back or loose in the under-seat connector (FCA Durango, R730 return wire)
        de: Kontakt im Stecker unter dem Sitz zurückgeschoben oder locker (FCA Durango, Rückleitung R730)
    - id: harness_pinched_by_seat
      likelihood: medium
      label:
        en: Lead to the track sensor pinched or torn by the moving seat
        de: Leitung zum Schienensensor vom verfahrenden Sitz eingeklemmt oder abgerissen
    - id: hall_sensor_fault
      likelihood: medium
      label:
        en: Track position sensor faulty or its gap to the rail wrong after seat work
        de: Schienenpositionssensor defekt oder Abstand zur Schiene nach Sitzarbeiten falsch
    - id: orc_fault
      likelihood: low
      label:
        en: Restraint controller internal fault, only after wiring and sensor are ruled out
        de: Interner Fehler des Rückhaltesteuergeräts, erst nach Ausschluss von Leitung und Sensor
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger airbag deployment can no longer be adapted to the seat position
      de: Auslösung des Beifahrerairbags lässt sich nicht mehr an die Sitzstellung anpassen
    - en: "Safety note: airbag system; disconnect under-seat plugs only de-energised (ignition off, battery off, wait time), do not replace the restraint controller before checking pins, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Stecker unter dem Sitz nur spannungsfrei trennen (Zündung aus, Batterie ab, Wartezeit), Rückhaltesteuergerät nicht vor der Kontaktprüfung tauschen, nur Fachwerkstatt"
