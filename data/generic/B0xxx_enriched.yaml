      likelihood: high
      label:
        en: Poor contact at the third-row right side airbag connector
        de: Schlechter Kontakt am rechten Seitenairbagstecker der dritten Reihe
    - id: folding_seat_harness
      likelihood: medium
      label:
        en: Lead damaged by folding, sliding or removing the third-row seat
        de: Leitung durch Klappen, Verschieben oder Ausbauen des Sitzes der dritten Reihe beschädigt
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
  symptoms:
