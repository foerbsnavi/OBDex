      label:
        en: Damaged stage 3 lead or vent squib in the right rear airbag
        de: Beschädigte Leitung oder Ventilzündpille der Stufe 3 im rechten Fond-Airbag
    - id: seatback_connector
      likelihood: high
      label:
        en: Loose or corroded connector of the airbag lead routed through the front seat backrest
        de: Lockerer oder korrodierter Stecker der Airbagleitung in der Vordersitzlehne
    - id: config_mismatch
      likelihood: low
      label:
