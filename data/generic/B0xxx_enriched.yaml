- code: B0001
  category: body
  title:
    en: Driver Frontal Stage 1 Deployment Control
    de: Fahrer-Frontairbag Stufe 1 Auslösesteuerung
  description:
    en: The restraint control module tests the firing loop of the first inflator stage in the driver airbag, which sits in the steering wheel hub and is fed through the clock spring. B0001 is stored when that loop is open, shorted or outside its resistance window; the fault byte added to the code names the exact type. Mercedes-Benz logs B000113 for an open stage 1 squib, Honda used B0001-13 on the 2013 Civic, Mitsubishi files it under the driver airbag module, FCA under squib 1, and GM on its 2020-21 full-size trucks, where B0001-1B came from rust particles at the airbag connector raising the resistance (bulletin 21-NA-005). Stage 1 is the charge used in every deployment, so a fault here can cost the driver frontal protection. The airbag warning lamp stays lit.
    de: "Das Airbag-Steuergerät prüft den Zündkreis der ersten Treibsatzstufe im Fahrerairbag; das Modul sitzt in der Lenkradnabe und hängt über die Wickelfeder am Kabelbaum. B0001 wird abgelegt, wenn dieser Kreis unterbrochen, kurzgeschlossen oder außerhalb seines Widerstandsfensters ist – das angehängte Fehlerbyte nennt die Art. Belegt ist der Code bei Mercedes-Benz (B000113: Zündpille Stufe 1 unterbrochen), Honda (Civic 2013, B0001-13), Mitsubishi (Fahrerairbagmodul), FCA (Zündpille 1) und GM: Bei den großen Pick-ups und SUVs 2020–21 trieben Rostpartikel am Airbagstecker den Widerstand hoch (B0001-1B, Bulletin 21-NA-005). Die erste Stufe zündet bei jeder Auslösung; fällt sie aus, fehlt dem Fahrer womöglich der Frontairbag. Die Airbag-Warnleuchte bleibt an."
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: connector_corrosion
      likelihood: high
      label:
        en: Corroded or poorly seated connector between steering wheel harness and airbag module
        de: Korrodierter oder schlecht sitzender Stecker zwischen Lenkradkabelbaum und Airbagmodul
    - id: clock_spring_open
      likelihood: medium
      label:
        en: Broken or worn conductor in the clock spring
        de: Gerissene oder verschlissene Leiterbahn in der Wickelfeder
    - id: driver_airbag_module_fault
      likelihood: medium
      label:
        en: Internal fault in the driver airbag module (stage 1 squib)
        de: Innerer Fehler im Fahrerairbagmodul (Zündpille Stufe 1)
    - id: harness_chafe
      likelihood: low
      label:
        en: Chafed lead in the steering wheel or column harness
        de: Durchgescheuerte Leitung im Lenkrad- oder Lenksäulenkabelbaum
  symptoms:
    - en: Airbag warning lamp or service airbag message stays on
      de: Airbag-Warnleuchte oder Meldung „Airbag prüfen“ dauerhaft an
    - en: Driver frontal airbag may not deploy in a crash
      de: Fahrer-Frontairbag löst im Crash möglicherweise nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
