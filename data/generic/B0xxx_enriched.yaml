  reviewed: '2026-11-06'

- code: B00E3
  category: body
  title:
    en: Second Row Left Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C zweite Reihe links Auslösesteuerung
  description:
    en: B00E3 is the C-stage tensioner of the left outer rear seat, and two makers document it codegenau. Stellantis case S2408000089 (Jeep Wrangler 2023) has the occupant restraint controller store B00E3-13, named there for the retractor tensioner at the left of row two, after a service visit; the fix was to secure connector D3244A with a push-pull-push check, no parts. Mercedes-Benz topic LI54.21-P-070658 (A-Class, CLA, later GLB) reads B00E313 as an open squib in the tensioning retractor behind the left rear passenger, usually caused by high contact resistance at the airbag unit plug; reconnecting comes first, a new control unit only if the fault returns. So C here means the retractor, as Joyson's pyrotechnic retractor describes. Airbag lamp on.
    de: B00E3 ist der Straffer der Stufe C am linken äußeren Rücksitz, und zwei Hersteller belegen ihn codegenau. Im Stellantis-Fall S2408000089 (Jeep Wrangler 2023) speichert das Rückhaltesteuergerät nach einem Werkstattbesuch B00E3-13 für den Aufrollerstraffer links in der zweiten Reihe; abgestellt wurde das durch sicheres Stecken des Verbinders D3244A (Drücken-Ziehen-Drücken), ohne Teile. Mercedes-Benz liest in LI54.21-P-070658 (A-Klasse, CLA, später GLB) B00E313 als Unterbrechung der Zündpille im linken hinteren Gurtstraffer-Aufroller, meist durch erhöhten Übergangswiderstand am Stecker des Airbag-Steuergeräts; erst neu stecken, ein neues Steuergerät nur bei Wiederkehr. Stufe C meint hier also den Aufroller, wie ihn Joyson als pyrotechnischen Gurtaufroller beschreibt. Airbag-Lampe an.
  affected_components:
    - second_row_left_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: retractor_connector_unlatched
      likelihood: high
      label:
        en: Retractor pretensioner plug not latched after trim or seat work (Jeep Wrangler 2023, connector D3244A)
        de: Stecker des Aufrollerstraffers nach Verkleidungs- oder Sitzarbeiten nicht eingerastet (Jeep Wrangler 2023, Verbinder D3244A)
    - id: srs_module_contact
      likelihood: medium
      label:
        en: High contact resistance at the airbag control unit connector (Mercedes LI54.21-P-070658)
        de: Hoher Übergangswiderstand am Stecker des Airbag-Steuergeräts (Mercedes LI54.21-P-070658)
    - id: rear_harness_chafe
      likelihood: medium
      label:
        en: Lead to the left rear retractor chafed at the C-pillar or seat frame
        de: Leitung zum linken hinteren Aufroller an C-Säule oder Sitzrahmen durchgescheuert
    - id: retractor_squib_fault
      likelihood: low
      label:
        en: Faulty squib in the retractor pretensioner
        de: Defekte Zündpille im Aufrollerstraffer
  symptoms:
    - en: Airbag warning lamp or SRS message in the cluster
      de: Airbag-Warnleuchte bzw. SRS-Meldung im Kombiinstrument
    - en: Left rear shoulder belt is not retracted in a crash
      de: Schultergurt hinten links wird bei einem Unfall nicht eingezogen
    - en: "Safety note: the retractor pretensioner is pyrotechnic; work only with the system de-energised (battery off, wait time) and preferably at a specialist workshop"
      de: "Sicherheitshinweis: Der Aufrollerstraffer ist pyrotechnisch; nur bei spannungsfreiem System (Batterie ab, Wartezeit) und am besten in einer Fachwerkstatt arbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [50, 700]
    estimated_hours: [0.3, 2.5]
