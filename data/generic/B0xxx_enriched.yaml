  reviewed: '2026-11-06'

- code: B0075
  category: body
  title:
    en: Second Row Right Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer zweite Reihe rechts Auslösesteuerung
  description:
    en: "B0075 is the right-hand counterpart of B0073: the pretensioner at the second row's right outer seat. Mitsubishi lists it as PRE-TEN REAR RH with the J2012 title and tests the circuit whenever the ignition is on; byte 11 stands for a short to ground and 13 for an open circuit, while further bytes cover shorts to power, crossed wires, high resistance or a configuration mismatch, each after 2 seconds. Toyota names B007512, a short to battery, in its 2022 Tundra bulletin about the Qi charger. Rear retractor wiring passes through seat and trim areas that are opened during interior work, which makes a disturbed plug the usual suspect. With the code active, the airbag lamp is on and the right rear passenger may not be pulled back into the seat in a crash."
    de: "B0075 ist das Gegenstück zu B0073 auf der rechten Seite: der Gurtstraffer am rechten Außenplatz der zweiten Reihe. Mitsubishi führt ihn als PRE-TEN REAR RH mit dem J2012-Titel und prüft den Kreis bei jeder eingeschalteten Zündung; Byte 11 bedeutet Masseschluss, Byte 13 Unterbrechung, weitere Bytes stehen für Schluss nach Plus, Leitungsschluss untereinander, zu hohen Widerstand oder falsche Konfiguration – jeweils nach 2 Sekunden. Toyota nennt im Qi-Ladeschalen-Bulletin zum Tundra 2022 B007512, einen Schluss nach Plus. Die Leitung zum hinteren Aufroller verläuft durch Sitz- und Verkleidungsbereiche, die bei Innenraumarbeiten geöffnet werden; ein gelöster Stecker ist deshalb der erste Verdacht. Ist der Code aktiv, leuchtet die Airbag-Lampe, und der Mitfahrer hinten rechts wird bei einem Unfall womöglich nicht in den Sitz gezogen."
  affected_components:
    - second_row_right_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: rear_right_connector
      likelihood: high
      label:
        en: Plug at the right rear retractor not fully latched after interior work
        de: Stecker am rechten hinteren Aufroller nach Innenraumarbeiten nicht ganz eingerastet
    - id: rear_right_harness
      likelihood: medium
      label:
        en: Chafed lead to the right rear pretensioner (short to ground or power)
        de: Durchgescheuerte Leitung zum rechten hinteren Straffer (Masse- oder Plusschluss)
    - id: electrical_interference
      likelihood: low
      label:
        en: Interference from added electronics, fixed by an ECU update (Toyota Tundra 2022)
        de: Störeinkopplung durch Zusatzelektronik, behoben per Steuergeräte-Update (Toyota Tundra 2022)
    - id: pretensioner_internal
      likelihood: low
      label:
        en: Internal fault of the right rear pretensioner
        de: Interner Fehler des rechten hinteren Straffers
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right rear occupant without belt pretensioning in a crash
      de: Insasse hinten rechts ohne Gurtstraffung bei einem Unfall
    - en: "Safety note: the rear retractor contains a pyrotechnic charge; work on it only de-energised and leave it to a specialist workshop"
      de: "Sicherheitshinweis: Der hintere Aufroller enthält eine pyrotechnische Ladung; nur spannungsfrei und durch eine Fachwerkstatt bearbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 2.5]
  flags:
