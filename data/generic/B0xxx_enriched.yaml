      de: Airbag-Warnleuchte an
    - en: Passenger airbag off lamp may light for an adult sitting with the seat back reclined
      de: Beifahrerairbag-Aus-Leuchte geht womöglich bei einem Erwachsenen mit geneigter Lehne an
    - en: "Safety note: airbag system; work on seat back and sensor only de-energised (ignition off, battery off, wait time), relearn or calibrate afterwards, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; an Lehne und Sensor nur spannungsfrei arbeiten (Zündung aus, Batterie ab, Wartezeit), danach anlernen bzw. kalibrieren, nur Fachwerkstatt"
