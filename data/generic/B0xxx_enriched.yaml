    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before removing pillar trim, work at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System; vor dem Abnehmen der Säulenverkleidung Batterie abklemmen und Wartezeit einhalten, Fachwerkstatt"
