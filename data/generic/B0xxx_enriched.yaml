- code: B0056
  category: body
  title:
    en: Third Row Left Seat Belt Sensor
    de: Gurtsensor dritte Sitzreihe links
  description:
    en: B0056 belongs to the left third-row seat's buckle sensor, found in larger SUVs, minivans and seven-seat estates. Third-row seats usually fold flat into the floor, so the buckle lead has to pass through the folding mechanism and is flexed every time the cargo area is extended. In Ford's patent for rear belt monitoring the third-row bench is the hard-wired part of the system, while only the removable second row needs a wireless link. FMVSS 208 S7.5(c) extends the rear belt warning to all rear rows for vehicles built from September 2028. A Hall switch that senses the latched tongue is the usual hardware. No carmaker documents B0056 with this wording publicly, nor does any service bulletin mention it; Mitsubishi's B0052 is the documented model for this fault type.
    de: B0056 gehört zum Gurtschlosssensor am linken Sitz der dritten Reihe, wie es ihn in großen SUVs, Vans und Siebensitzer-Kombis gibt. Sitze der dritten Reihe lassen sich meist flach im Boden versenken; die Gurtschlossleitung läuft daher durch die Klappmechanik und wird bei jedem Vergrößern des Laderaums gebogen. Im Ford-Patent zur Gurtüberwachung hinten ist die Bank der dritten Reihe der fest verdrahtete Teil, nur die herausnehmbare zweite Reihe braucht eine Funkverbindung. FMVSS 208 S7.5(c) dehnt die Gurtwarnung für Fahrzeuge ab Baudatum September 2028 auf alle hinteren Reihen aus. Übliche Technik ist ein Hallschalter, der die eingerastete Zunge erkennt. Mit diesem Wortlaut dokumentiert kein Hersteller B0056 öffentlich, auch kein Bulletin nennt ihn; belegtes Vorbild für diesen Fehlertyp ist Mitsubishis B0052.
