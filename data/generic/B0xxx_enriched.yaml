      de: Fehler kann mit dem Wetter oder nach dem Reinigen des Sitzes kommen und gehen
    - en: "Safety note: a child on the passenger seat may not be detected; replace mats only as the maker's kit with the seat de-energised, then recalibrate, specialist workshop only"
      de: "Sicherheitshinweis: Ein Kind auf dem Beifahrersitz wird womöglich nicht erkannt; Matten nur als Herstellersatz und spannungsfrei tauschen, danach neu kalibrieren, nur Fachwerkstatt"
