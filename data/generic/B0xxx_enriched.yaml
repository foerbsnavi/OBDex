- code: B0015
  category: body
  title:
    en: Passenger Knee Airbag Deployment Control
    de: Beifahrer-Knieairbag Auslösesteuerung
  description:
    en: B0015 does not appear in the public J2012 code lists, which assign the passenger knee airbag to B0013. Only General Motors documents the number, as the firing loop of the belt pretensioner built into the driver's retractor. In the Saab 9-4X 2011 manual this pretensioner shares one diagnostic page with B001A, the anchor pretensioner, and both trip when their loop stays outside the allowed resistance band or touches supply or ground for two seconds. On the 2009-11 Impala GM notes that B0015 points to the retractor pretensioner while a second pretensioner sits at the belt anchor (PIC5396A). On an Equinox, a wire under the power seat rubbing on the seat motor set B0014 and B0015 and blew the seat fuse (PIT4898C). A passenger knee airbag under this number is not publicly documented. The airbag lamp is on.
    de: B0015 erscheint nicht in den öffentlichen J2012-Codelisten, die den Beifahrer-Knieairbag unter B0013 führen. Nur General Motors dokumentiert die Nummer, und zwar als Zündkreis des Gurtstraffers am Aufrollautomaten des Fahrers. Im Saab-9-4X-Handbuch von 2011 teilt sich dieser Straffer eine Diagnoseseite mit B001A, dem Straffer am Endbeschlag; beide werden gesetzt, wenn ihr Kreis zwei Sekunden außerhalb des zulässigen Widerstandsbands liegt oder Plus bzw. Masse berührt. Beim Impala 2009–11 weist GM darauf hin, dass B0015 den Aufrollstraffer meint, während ein zweiter Straffer am Gurtanker sitzt (PIC5396A). Beim Equinox scheuerte eine Leitung unter dem elektrischen Sitz am Sitzmotor, setzte B0014 und B0015 und ließ die Sitzsicherung durchbrennen (PIT4898C). Ein Beifahrer-Knieairbag unter dieser Nummer ist öffentlich nicht belegt.
  affected_components:
    - knee_airbag_module
    - driver_seatbelt_pretensioner
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: pretensioner_connector
      likelihood: high
      label:
        en: On GM vehicles loose or corroded connector at the driver belt pretensioner
        de: Bei GM loser oder korrodierter Stecker am Gurtstraffer des Fahrers
    - id: seat_harness_chafe
      likelihood: medium
      label:
        en: Harness under the power seat rubbing on frame or seat motor (GM PIT4898C)
        de: Kabelbaum unter dem elektrischen Sitz scheuert an Rahmen oder Sitzmotor (GM PIT4898C)
    - id: pretensioner_fault
      likelihood: low
      label:
        en: Internal fault in the pretensioner or airbag served by this loop
        de: Innerer Fehler im Straffer bzw. Airbag dieses Kreises
  symptoms:
    - en: Airbag warning lamp on, sometimes intermittent
      de: Airbag-Warnleuchte an, teils sporadisch
    - en: On GM, belt pretensioner may not fire; power seat may fail if the harness is shorted
      de: Bei GM zündet der Gurtstraffer womöglich nicht; bei Kurzschluss im Kabelbaum fällt der elektrische Sitz aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
