- code: B010B
  category: body
  title:
    en: Camera Washer Actuator B
    de: Kamera-Wascher-Aktuator B
  description:
    en: "B010B covers actuator B. A common way to reach a reversing camera is a branch off the rear-window washer line with an electric switching valve. Asmo's application US20120266926A1 (2011) describes a solenoid spool valve: unpowered it feeds the rear-screen nozzle, energised it diverts fluid to the camera nozzle. The coil is powered once reverse is engaged, and the washer switch then sprays the camera, for about two seconds in one example. Land Rover's bulletin JLRTB02100NAS1 for the 2022 Range Rover shows the plumbing side: a loose rear washer connector stopped both rear-window and camera wash, and hoses swapped at that connector made the rear-window switch wash the camera instead. Whether B is a rear camera is not published; no maker documents B010B."
    de: "B010B betrifft Aktor B. Eine verbreitete Lösung für die Rückfahrkamera ist ein Abzweig von der Heckscheiben-Waschleitung mit elektrischem Umschaltventil. Asmos Anmeldung US20120266926A1 (2011) beschreibt ein Magnet-Schieberventil: stromlos versorgt es die Heckscheibendüse, bestromt lenkt es die Flüssigkeit zur Kameradüse um. Die Spule bekommt Strom, sobald der Rückwärtsgang eingelegt ist; der Waschschalter bespritzt dann die Kamera, im Beispiel etwa zwei Sekunden lang. Land Rovers Bulletin JLRTB02100NAS1 zum Range Rover 2022 zeigt die Leitungsseite: Ein gelöster Zwischenstecker der hinteren Waschleitungen legte Heckscheiben- und Kamerawäsche still, und dort vertauschte Schläuche ließen den Heckscheibenschalter stattdessen die Kamera waschen. Ob B eine Heckkamera ist, ist nicht veröffentlicht; kein Hersteller dokumentiert B010B."
  affected_components:
    - camera_washer_actuator_b
    - rear_camera
    - actuator_wiring
  common_causes:
    - id: switching_valve_coil_b
      likelihood: high
      label:
        en: Coil of the rear-window/camera switching valve open or shorted
        de: Spule des Umschaltventils Heckscheibe/Kamera unterbrochen oder kurzgeschlossen
    - id: tailgate_harness_b
      likelihood: medium
      label:
        en: Broken wire in the tailgate or boot-lid harness passage to the valve
        de: Aderbruch im Kabeldurchgang von Heckklappe oder Kofferraumdeckel zum Ventil
    - id: reverse_signal_missing
      likelihood: low
      label:
        en: Reverse-gear signal that enables the camera wash not reaching the module
        de: Rückwärtsgang-Signal, das die Kamerawäsche freigibt, kommt nicht im Steuergerät an
  symptoms:
    - en: In reverse the washer switch no longer sprays the reversing camera
      de: Im Rückwärtsgang bespritzt der Waschschalter die Rückfahrkamera nicht mehr
    - en: Rear window may be washed instead of the camera, or neither
      de: Statt der Kamera wird eventuell die Heckscheibe gewaschen, oder keines von beiden
