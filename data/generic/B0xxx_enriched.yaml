    - actuator_wiring
    - relay_control_circuit
  common_causes:
    - id: actuator_s_coil
      likelihood: high
      label:
        en: Coil or motor of actuator S open or shorted
        de: Spule oder Motor von Aktor S unterbrochen oder kurzgeschlossen
    - id: relay_s
      likelihood: medium
