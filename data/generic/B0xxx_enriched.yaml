      label:
        en: Loose or corroded connector at speaker B or a rattling internal connector at the module
        de: Lockerer oder korrodierter Stecker an Lautsprecher B oder klappernder Innenstecker am Modul
    - id: alert_module_software_b
      likelihood: low
      label:
        en: Fault in the sound generator module or its software
        de: Fehler im Klangerzeugermodul oder dessen Software
  symptoms:
    - en: Artificial sound missing at the front or rear, e.g. only audible when moving off forwards
      de: Kunstgeräusch fehlt vorn oder hinten, etwa nur beim Vorwärtsanfahren hörbar
    - en: Possible warning message about the pedestrian alert system
      de: Eventuell Warnmeldung zum Fußgänger-Warnsystem
    - en: Legally required warning sound incomplete; have it repaired soon
      de: Gesetzlich vorgeschriebenes Warngeräusch unvollständig; bald reparieren lassen
  repair:
