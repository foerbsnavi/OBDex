- code: B0034
  category: body
  title:
    en: Right Side Deployment Stage 2 Control
    de: Seitenairbag rechts Stufe 2 Auslösesteuerung
  description:
    en: "B0034 is absent from the J2012 lists, which skip from B0033 to B0038 in the second-row block, and no carmaker or bulletin documents it publicly; the code cannot be traced to a real vehicle. The title describes a second firing stage for the right side airbag. Such bags are rare: Ford's far-side impact patent treats thorax, pelvis and head bags as single-setting because of their size, while Autoliv covers chest and pelvis with a two-chamber bag, not with two firing stages. Right front side airbags carry the J2012 code B0028; Mitsubishi, for example, checks that loop for 2 seconds before storing a fault. If B0034 is read, the module and text shown by the scan tool are what count. Airbag lamp on."
    de: "B0034 fehlt in den öffentlichen J2012-Listen, die im Block der zweiten Sitzreihe von B0033 auf B0038 springen, und kein Hersteller und kein Bulletin dokumentiert ihn öffentlich; einem realen Fahrzeug lässt er sich nicht zuordnen. Der Titel beschreibt eine zweite Zündstufe des rechten Seitenairbags. Solche Airbags sind selten: Ein Ford-Patent zum Seitenaufprall auf der Gegenseite behandelt Thorax-, Becken- und Kopfairbags ihrer Größe halber als einstufig, und der bei Autoliv beschriebene Zweikammer-Seitenairbag schützt Brust und Becken mit einem Kissen statt mit zwei Stufen. Der rechte vordere Seitenairbag trägt bei J2012 den Code B0028; Mitsubishi etwa prüft diesen Kreis 2 Sekunden, bevor ein Fehler abgelegt wird. Wird B0034 gelesen, zählt, welches Steuergerät und welcher Klartext angezeigt werden. Die Airbag-Leuchte brennt."
  affected_components:
    - passenger_side_airbag
    - srs_control_module
  common_causes:
    - id: squib_circuit_fault
      likelihood: medium
      label:
        en: Fault in the squib loop the module assigns to this code
        de: Fehler im Zündkreis, den das Steuergerät diesem Code zuordnet
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Poor contact or corrosion at the side airbag connector or jumper harness under or in the seat
        de: Schlechter Kontakt oder Korrosion am Seitenairbagstecker bzw. Zwischenkabel unter oder im Sitz
    - id: srs_module_fault
      likelihood: low
      label:
        en: Fault or unsuitable software in the restraint control module
        de: Fehler oder unpassende Software im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right side airbag protection may be reduced
      de: Schutz durch den rechten Seitenairbag eventuell eingeschränkt
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
