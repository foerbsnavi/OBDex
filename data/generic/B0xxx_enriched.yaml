- code: B0120
  category: body
  title:
    en: Fluid Reservoir Level Sensor E
    de: Flüssigkeitsbehälter Füllstandssensor E
  description:
    en: "B0120 relates to level sensor E. Ford's application US20190265715A1 describes a container for sensor cleaning whose level sensor measures conductance at a fixed height: air gives a resistance above roughly 1000 ohms, the slightly conductive fluid one below it. Because the fluid moves with the car, the computer filters the signal with acceleration and yaw rate, then estimates the remaining volume from pump activity, and it suspects a leak if the level falls while no washing is requested, in which case the vehicle may be routed to a service centre. Ford's patent US10569746B2 puts such a container on the roof beside the lidar. Letter E is not tied publicly to any tank, and no manufacturer documents B0120. Without the signal, remaining fluid can only be guessed."
    de: "B0120 betrifft Füllstandssensor E. Fords Anmeldung US20190265715A1 beschreibt einen Behälter für die Sensorreinigung, dessen Geber in fester Höhe die Leitfähigkeit misst: Luft ergibt einen Widerstand über etwa 1000 Ohm, die schwach leitende Flüssigkeit einen darunter. Weil die Flüssigkeit mit dem Fahrzeug schwappt, filtert der Rechner das Signal anhand von Beschleunigung und Gierrate, schätzt danach die Restmenge über die Pumpenlaufzeit und vermutet ein Leck, wenn der Pegel ohne Waschanforderung fällt; dann kann er das Fahrzeug zur Werkstatt lenken. Fords Patent US10569746B2 setzt einen solchen Behälter aufs Dach neben das Lidar. Buchstabe E ist öffentlich keinem Behälter zugeordnet, B0120 dokumentiert kein Hersteller. Ohne Signal lässt sich die Restmenge nur schätzen."
  affected_components:
    - fluid_reservoir_level_sensor_e
    - sensor_wiring
  common_causes:
    - id: electrodes_fouled_e
      likelihood: high
      label:
        en: Electrodes fouled or fluid with unsuitable conductivity (e.g. plain distilled water)
        de: Elektroden verschmutzt oder Flüssigkeit mit ungeeigneter Leitfähigkeit (z. B. reines destilliertes Wasser)
    - id: wiring_e_open_short
      likelihood: medium
      label:
        en: Open or short in the sensor circuit
        de: Unterbrechung oder Kurzschluss im Geberkreis
    - id: reservoir_e_leak
      likelihood: low
      label:
        en: Leaking reservoir or hose making the level drop unexpectedly
        de: Undichter Behälter oder Schlauch lässt den Pegel unerwartet fallen
  symptoms:
    - en: Refill warning too early, too late or constantly on
      de: Nachfüllwarnung zu früh, zu spät oder dauerhaft
    - en: Cleaning of exterior sensors may be restricted
      de: Reinigung der Außensensoren wird eventuell eingeschränkt
  repair:
