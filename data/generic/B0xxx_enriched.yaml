- code: B00F4
  category: body
  title:
    en: Second Row Right Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt zweite Reihe rechts Auslösesteuerung
  description:
    en: B00F4 covers the inflatable belt on the outboard right seat of row two. The hardware exists in series cars, but the code is not documented by any maker. Ford's Explorer (2014–2016) logs belt faults as B141B and/or B141C; supplement 2 of programme 21B11 (June 2022) stresses checking those codes first and allows a separate labour time when both are present, then repositioning or replacing the seat harness pigtail. Mercedes-Benz offers the beltbag on rear belts of the E-Class; its manual warns against routing a child seat through a belt carrying the BELTBAG label. Daimler's 2010 patent places the gas generator at the lower belt anchor and folds the webbing with tear threads. With B00F4 set, the airbag lamp is on.
    de: B00F4 ist der Kreis des aufblasbaren Gurts am rechten äußeren Rücksitz. Die Hardware gibt es in Serie, den Code dokumentiert aber kein Hersteller. Der Ford Explorer (2014–2016) legt Gurtfehler als B141B und/oder B141C ab; Nachtrag 2 zum Programm 21B11 (Juni 2022) betont, zuerst diese Codes zu prüfen, sieht eine eigene Arbeitszeit vor, wenn beide anliegen, und lässt dann das Anschlusskabel am Sitz neu verlegen oder ersetzen. Mercedes-Benz bietet den Beltbag für Fondgurte der E-Klasse an; das Handbuch warnt davor, einen Kindersitz mit einem Gurt mit BELTBAG-Etikett zu befestigen. Das Daimler-Patent von 2010 setzt den Gasgenerator an den unteren Gurtanker und faltet das Band mit Reißfäden. Mit gesetztem B00F4 leuchtet die Airbag-Lampe.
  affected_components:
    - second_row_right_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: seat_pigtail_damage
      likelihood: high
      label:
        en: Worn or broken wires in the right second-row seat pigtail (Ford Explorer 2014–2016)
        de: Verschlissene oder gebrochene Adern im Sitz-Anschlusskabel rechts in der zweiten Reihe (Ford Explorer 2014–2016)
    - id: anchor_inflator_connector
      likelihood: medium
      label:
        en: Inflator plug at the lower belt anchor or under the seat not latched
        de: Stecker des Gasgenerators am unteren Gurtanker bzw. unter dem Sitz nicht eingerastet
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Inflator igniter faulty
        de: Zünder des Gasgenerators defekt
  symptoms:
    - en: Airbag lamp illuminated
      de: Airbag-Lampe leuchtet
    - en: Right rear inflatable belt not ready to deploy
      de: Aufblasbarer Gurt hinten rechts nicht auslösebereit
    - en: "Safety note: do not open or probe the belt or its inflator; battery off, wait time, and leave the job to a specialist workshop"
      de: "Sicherheitshinweis: Gurt und Generator nicht öffnen oder anmessen; Batterie ab, Wartezeit, Arbeit einer Fachwerkstatt überlassen"
  repair:
    difficulty: shop_only
    diy_possible: false
