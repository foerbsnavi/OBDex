- code: B0122
  category: body
  title:
    en: Pedestrian Alert Speaker A
    de: Fußgänger-Warnlautsprecher A
  description:
    en: "B0122 flags pedestrian alert speaker A. Hybrid and electric vehicles are almost silent at walking pace, so they have to make an artificial sound. In the US, FMVSS 141 covers such vehicles up to 4,536 kg GVWR and sets minimum sound levels when stationary with propulsion active, in reverse and up to 30 km/h. GM's preliminary information PIC6478 for the 2023 Cadillac Lyriq shows a typical front speaker behind the bumper: it plays from standstill to about 25 mph, can be silenced for diagnosis by pulling fuse F46UA, and its bracket may buzz against the bumper beam. Which speaker is A is not published, and no maker documents B0122. With the speaker dead the car loses its mandatory warning sound but drives normally."
    de: "B0122 meldet Fußgänger-Warnlautsprecher A. Hybrid- und Elektroautos sind bei Schritttempo fast lautlos und müssen deshalb künstlich Geräusch erzeugen. In den USA gilt FMVSS 141 für solche Fahrzeuge bis 4.536 kg zulässiger Gesamtmasse und schreibt Mindestpegel vor: im Stand mit aktivem Antrieb, beim Rückwärtsfahren und bis 30 km/h. GMs Vorab-Information PIC6478 zum Cadillac Lyriq 2023 zeigt einen typischen Frontlautsprecher hinter dem Stoßfänger: Er klingt vom Stand bis etwa 25 mph, lässt sich zur Diagnose über die Sicherung F46UA stilllegen, und sein Halter kann am Stoßfängerträger schnarren. Welcher Lautsprecher A ist, ist nicht veröffentlicht; B0122 dokumentiert kein Hersteller. Fällt er aus, fehlt das vorgeschriebene Warngeräusch, gefahren werden kann normal."
  affected_components:
    - pedestrian_alert_speaker_a
    - speaker_wiring
    - pedestrian_alert_control_module
  common_causes:
    - id: speaker_a_failed
      likelihood: high
      label:
        en: Speaker A failed from water, salt or stone impact at the front end
        de: Lautsprecher A durch Wasser, Salz oder Steinschlag im Frontbereich ausgefallen
    - id: speaker_a_wiring
      likelihood: medium
      label:
        en: Open or short in the speaker wiring, often after bumper repairs
        de: Unterbrechung oder Kurzschluss der Lautsprecherleitung, oft nach Stoßfängerarbeiten
    - id: alert_module_output
      likelihood: low
      label:
        en: Output stage of the sound generator module or its fuse faulty
        de: Endstufe des Klangerzeugers oder dessen Sicherung defekt
  symptoms:
    - en: No artificial driving sound at low speed from the affected side
      de: Kein künstliches Fahrgeräusch bei langsamer Fahrt von der betroffenen Seite
    - en: Warning message about the pedestrian alert system in the cluster, depending on make
      de: Je nach Marke Meldung zum Fußgänger-Warnsystem im Kombiinstrument
    - en: Vehicle no longer meets the legal minimum sound; repair promptly
      de: Fahrzeug erfüllt die gesetzliche Mindestlautstärke nicht mehr; zügig reparieren
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 400]
    estimated_hours: [0.5, 2]
