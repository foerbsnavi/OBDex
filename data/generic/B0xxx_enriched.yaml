- code: B0127
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet "A" Circuit/Open
    de: DC/AC-Wandler A Hochvolt-Steckdose „A“ Stromkreis/Unterbrechung
  description:
    en: "B0127 reports an open circuit to power outlet A of DC/AC converter A, one of the household-voltage sockets the converter supplies. Ford's patent US11043801B2, behind Pro Power Onboard, gives every socket its own conductor, on/off switch and ground-fault interrupter, fed by an inverter that draws on the traction battery, the motor-generator or both; sensors ahead of and behind each switch let the controller check the path. GM's program N222385490 shows how directly the outlets hang on the converter: 2023 Silverado and Sierra 1500 built without a working inverter had dead dash and bed outlets until it was retrofitted. The makers keep the position of socket A to themselves; B0127 appears in no public document. Outlet A stays dead; driving is unaffected."
    de: "B0127 meldet eine Unterbrechung zur Steckdose A von DC/AC-Wandler A, einer der Netzspannungs-Steckdosen, die der Wandler versorgt. Fords Patent US11043801B2, Grundlage von Pro Power Onboard, gibt jeder Steckdose eine eigene Leitung, einen Ein/Aus-Schalter und einen Fehlerstromschutz; gespeist wird aus einem Wechselrichter, der Traktionsbatterie, Motor-Generator oder beide nutzt. Sensoren vor und hinter jedem Schalter erlauben der Steuerung, den Pfad zu prüfen. GMs Programm N222385490 zeigt, wie unmittelbar die Steckdosen am Wandler hängen: Silverado und Sierra 1500 von 2023 ohne funktionierenden Wechselrichter hatten stromlose Steckdosen in Armaturenbrett und Ladefläche bis zur Nachrüstung. Welche Steckdose A ist, ist nicht veröffentlicht; B0127 dokumentiert kein Hersteller. Steckdose A bleibt tot, das Fahren nicht betroffen."
  affected_components:
    - dc_ac_converter_a
    - hv_outlet_a
  common_causes:
    - id: outlet_a_wiring_open
      likelihood: high
      label:
        en: Wire or terminal in the feed to outlet A broken or pushed out
        de: Leitung oder Kontakt in der Zuleitung zu Steckdose A gebrochen oder herausgedrückt
    - id: outlet_a_socket_defective
      likelihood: medium
      label:
        en: Socket insert or its built-in protection defective
        de: Steckdoseneinsatz oder dessen eingebauter Schutz defekt
    - id: converter_output_a
      likelihood: low
      label:
        en: Output switch or relay for outlet A inside the converter faulty
        de: Ausgangsschalter oder Relais für Steckdose A im Wandler defekt
  symptoms:
    - en: Outlet A supplies no power while other outlets may still work
      de: Steckdose A liefert keinen Strom, andere Steckdosen arbeiten eventuell weiter
    - en: Message that onboard power or the outlet is unavailable
      de: Meldung, dass Bordnetzstrom oder die Steckdose nicht verfügbar ist
    - en: Outlet circuits carry 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Steckdosenkreise führen 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [60, 800]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B0128, B0129, B012A, B012B, B012C, P2DA8]
  sources:
    - https://patents.google.com/patent/US11043801B2/en
    - https://static.nhtsa.gov/odi/tsbs/2023/MC-10234131-0001.pdf
  reviewed: '2026-11-06'

- code: B0128
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet "B" Circuit/Open
    de: DC/AC-Wandler A Hochvolt-Steckdose „B“ Stromkreis/Unterbrechung
  description:
    en: "B0128 is the open-circuit fault for outlet B. Such a fault has to be told apart from a tripped protective device. In Ford's patent US11043801B2 each socket has a ground-fault interrupter whose breaker opens on a current imbalance and normally needs a manual reset; Ford adds an actuator so it can also be reset from a distance, plus test switches for the interrupters. Ford's SSM 49709 for the 2021 F-150 hybrid shows the everyday side: after the built-in Pro Power test the screen reports a ground fault until the reset button is pressed, which is normal behaviour. So rule out a tripped interrupter before chasing wiring. Where outlet B sits is not published, and no manufacturer documents B0128. Until repaired, socket B gives no power."
    de: "B0128 ist der Unterbrechungsfehler für Steckdose B. Eine Unterbrechung muss von einer ausgelösten Schutzeinrichtung unterschieden werden. In Fords Patent US11043801B2 hat jede Steckdose einen Fehlerstromschutz, dessen Schalter bei ungleichen Strömen öffnet und normalerweise von Hand zurückgesetzt wird; Ford ergänzt einen Stellantrieb für das Rücksetzen aus der Ferne und Prüftaster für die Schutzschalter. Fords SSM 49709 zum F-150 Hybrid 2021 zeigt die Praxis: Nach dem eingebauten Pro-Power-Test meldet der Bildschirm einen Erdschluss, bis die Reset-Taste gedrückt wird – das ist normal. Vor der Leitungssuche also einen ausgelösten Schutz ausschließen. Wo Steckdose B sitzt, ist nicht veröffentlicht; B0128 dokumentiert kein Hersteller. Bis zur Reparatur bleibt B stromlos."
  affected_components:
    - dc_ac_converter_a
    - hv_outlet_b
  common_causes:
    - id: outlet_b_feed_open
      likelihood: high
      label:
        en: Feed to outlet B interrupted at a connector or in the harness
        de: Zuleitung zu Steckdose B an einem Stecker oder im Kabelbaum unterbrochen
    - id: gfci_b_defective
      likelihood: medium
      label:
        en: Ground-fault interrupter of outlet B defective or its reset actuator stuck
        de: Fehlerstromschutz von Steckdose B defekt oder dessen Rücksetzantrieb hängt
    - id: outlet_b_moisture
      likelihood: low
      label:
        en: Moisture or dirt in socket B
        de: Feuchtigkeit oder Schmutz in Steckdose B
  symptoms:
    - en: Socket B dead, ground-fault or outlet message on the screen
      de: Steckdose B tot, Meldung zu Erdschluss oder Steckdose am Bildschirm
    - en: Reset does not restore power to socket B
      de: Zurücksetzen bringt Steckdose B nicht zurück
    - en: Outlet circuits carry 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Steckdosenkreise führen 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [60, 800]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B0127, B0129, B012A, B012B, B012C]
  sources:
    - https://patents.google.com/patent/US11043801B2/en
    - https://static.nhtsa.gov/odi/tsbs/2021/MC-10189611-0001.pdf
  reviewed: '2026-11-06'

- code: B0129
  category: body
  title:
    en: DC/AC Converter A High Voltage Power Outlet "C" Circuit/Open
    de: DC/AC-Wandler A Hochvolt-Steckdose „C“ Stromkreis/Unterbrechung
  description:
    en: "B0129 covers outlet C. Apart from wiring faults, the converter also cuts sockets on purpose when the load is too high. Ford's patent US11043801B2 gives limits of 20 A for the 120 V sockets and 30 A for the 240 V socket, and when total power exceeds the ceiling it de-energises sockets by priority, the lowest first. Ford's SSM 51498 for the 2023 Super Duty describes the resulting Pro Power Onboard Turned Off message after wattage thresholds were exceeded, which could only be cleared once the load was unplugged. A shutdown like that is not an open circuit: B0129 means the converter finds no intact path to socket C. Which socket that is, and any maker using B0129, is not public."
    de: "B0129 betrifft Steckdose C. Neben Leitungsfehlern schaltet der Wandler Steckdosen auch absichtlich ab, wenn die Last zu hoch ist. Fords Patent US11043801B2 nennt Grenzen von 20 A für die 120-V-Steckdosen und 30 A für die 240-V-Steckdose; übersteigt die Gesamtleistung die Obergrenze, werden Steckdosen nach Rangfolge abgeschaltet, die unwichtigste zuerst. Fords SSM 51498 zur Super Duty 2023 beschreibt die Meldung „Pro Power Onboard ausgeschaltet“ nach überschrittener Leistungsschwelle, die sich erst nach Abziehen des Verbrauchers quittieren ließ. Eine solche Abschaltung ist keine Unterbrechung: B0129 heißt, der Wandler findet keinen intakten Weg zu Steckdose C. Welche Steckdose das ist und ob ein Hersteller B0129 nutzt, ist nicht öffentlich."
  affected_components:
    - dc_ac_converter_a
    - hv_outlet_c
  common_causes:
    - id: outlet_c_terminal_burnt
      likelihood: high
      label:
        en: Terminal at outlet C overheated or burnt from heavy loads, contact lost
        de: Kontakt an Steckdose C durch hohe Last überhitzt oder verschmort, Verbindung verloren
    - id: outlet_c_harness_open
      likelihood: medium
      label:
        en: Harness to outlet C open
        de: Kabelbaum zu Steckdose C unterbrochen
    - id: converter_output_c
      likelihood: low
      label:
        en: Switching element for outlet C inside the converter defective
        de: Schaltelement für Steckdose C im Wandler defekt
  symptoms:
    - en: Socket C stays dead even with no load connected
      de: Steckdose C bleibt auch ohne angeschlossenen Verbraucher tot
    - en: Outlet message that cannot be cleared by unplugging and resetting
      de: Steckdosenmeldung lässt sich durch Abziehen und Zurücksetzen nicht beheben
    - en: Outlet circuits carry 120/240 V AC from a high-voltage source; work only with the system de-energised
      de: Steckdosenkreise führen 120/240 V Wechselspannung aus einer Hochvoltquelle; nur spannungsfrei arbeiten
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [60, 800]
    estimated_hours: [0.5, 3]
