- code: B0052
  category: body
  title:
    en: Passenger Seat Belt Sensor
    de: Gurtsensor Beifahrer
  description:
    en: "B0052 concerns the front passenger's buckle sensor, reporting to the airbag module whether the tongue is latched. That signal feeds the passenger belt reminder that FMVSS 208 requires at the front outboard seats and helps the module decide how the passenger airbag and pretensioner fire. Mitsubishi uses the code in exactly this sense: its SRS manual stores B0052 with byte 11, 12, 13, 29 or 2B for a grounded line, short to supply, open circuit, invalid signal or short to another line, each after 2 seconds with the ignition on. FCA parts guidance for its restraint controller in the Dart, Cherokee and Chrysler 200 calls B0052-13 an open passenger belt sensor. GM, by contrast, logs a deployment under B0052 in its 2011 Global A modules. Airbag lamp on."
    de: "B0052 betrifft den Sensor im Gurtschloss des Beifahrers, der dem Airbagsteuergerät meldet, ob die Gurtzunge eingerastet ist. Das Steuergerät braucht diese Information für den Gurtwarner, den FMVSS 208 an den äußeren Vordersitzen vorschreibt, und für die Wahl, wie Beifahrerairbag und Gurtstraffer zünden. Mitsubishi dokumentiert den Code mit dieser Bedeutung: Das SRS-Handbuch legt B0052 mit Byte 11, 12, 13, 29 oder 2B ab – Masseschluss, Schluss nach Plus, Unterbrechung, ungültiges Signal oder Schluss zu einer anderen Leitung, jeweils nach 2 Sekunden bei eingeschalteter Zündung. FCA führt B0052-13 in Hinweisen zum Rückhalte-Steuergerät von Dart, Cherokee und Chrysler 200 als offenen Beifahrergurtsensor. Die Global-A-Steuergeräte von GM (2011) nutzen die Nummer dagegen als Auslösevermerk. Airbag-Leuchte an."
  affected_components:
    - seat_belt_buckle_switch
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: buckle_connector_under_seat
      likelihood: high
      label:
        en: Loose or corroded buckle connector under the passenger seat
        de: Lockerer oder korrodierter Gurtschlossstecker unter dem Beifahrersitz
    - id: buckle_sensor_fault
      likelihood: medium
      label:
        en: Faulty Hall sensor inside the passenger buckle
        de: Defekter Hallsensor im Beifahrergurtschloss
    - id: seat_rail_harness_damage
      likelihood: medium
      label:
        en: Buckle lead pinched or torn by the seat rails or a mat fixing
        de: Gurtschlossleitung durch Sitzschienen oder Mattenbefestigung gequetscht oder abgerissen
    - id: restraint_module_fault
      likelihood: low
      label:
        en: Input fault inside the airbag control module
        de: Eingangsfehler im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger belt reminder warns although the belt is fastened, or stays silent
      de: Gurtwarner Beifahrer meldet trotz angelegtem Gurt oder bleibt stumm
    - en: Passenger airbag and pretensioner strategy may assume an unbelted occupant
      de: Auslösestrategie für Beifahrerairbag und Gurtstraffer geht womöglich von einem nicht angeschnallten Insassen aus
    - en: "Safety note: the buckle plug sits under the seat next to airbag and pretensioner plugs; only unplug it with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Der Gurtschlossstecker liegt unter dem Sitz neben Airbag- und Strafferstecker; nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
