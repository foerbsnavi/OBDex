      likelihood: high
      label:
        en: Loose or corroded connector at the anchor-mounted tension sensor
        de: Lockerer oder korrodierter Stecker am Gurtkraftsensor am Beschlag
    - id: tension_sensor_fault
      likelihood: medium
      label:
        en: Tension sensor output stuck or out of range, e.g. jammed slider
        de: Ausgang des Gurtkraftsensors hängt oder liegt außerhalb des Bereichs, etwa durch klemmenden Schieber
    - id: seat_harness_damage
      likelihood: medium
      label:
        en: Sensor lead pinched under the seat or at the sill trim
        de: Sensorleitung unter dem Sitz oder an der Schwellerverkleidung eingeklemmt
  symptoms:
