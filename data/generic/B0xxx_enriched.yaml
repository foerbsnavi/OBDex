- code: B0011
  category: body
  title:
    en: Passenger Frontal Stage 2 Deployment Control
    de: Beifahrer-Frontairbag Stufe 2 Auslösesteuerung
  description:
    en: "B0011 is the passenger counterpart of B0002: it concerns the second inflator stage of the dashboard airbag, which the module adds in severe crashes or fires with a delay. Mercedes-Benz logs B001113 for an open stage 2 squib of the front passenger airbag, and Mitsubishi lists B0011 as passenger airbag module 2. Stage 1 of the same bag has its own code B0010, a third element B0012. Since both stages leave the module through one connector, a code for stage 2 alone usually means a fault in the stage 2 pins, lead or squib rather than a general connector problem. Older GM modules (Saab 9-3 up to 2011) put passenger stage 2 faults under B0012 to B0014 instead. The airbag lamp is on and adaptive inflation for the passenger is lost."
    de: "B0011 ist das Gegenstück zu B0002 auf der Beifahrerseite: Es geht um die zweite Treibsatzstufe des Armaturentafel-Airbags, die das Steuergerät bei schweren Unfällen zuschaltet oder verzögert zündet. Mercedes-Benz legt B001113 für eine unterbrochene Zündpille Stufe 2 des Beifahrerairbags ab, Mitsubishi nennt B0011 das Beifahrerairbagmodul 2. Stufe 1 desselben Airbags hat den eigenen Code B0010, ein drittes Element B0012. Da beide Stufen über einen Stecker laufen, deutet ein Fehler nur an Stufe 2 meist auf deren Kontakte, Leitung oder Zündpille und weniger auf den ganzen Stecker. Ältere GM-Steuergeräte (Saab 9-3 bis 2011) führten Fehler der Beifahrerstufe 2 dagegen unter B0012 bis B0014. Die Leuchte ist an, die angepasste Füllung für den Beifahrer entfällt."
  affected_components:
    - passenger_airbag_module
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: stage2_pin_or_lead
      likelihood: high
      label:
        en: Poor contact on the stage 2 pins or open stage 2 lead
        de: Schlechter Kontakt an den Stufe-2-Pins oder unterbrochene Stufe-2-Leitung
    - id: passenger_airbag_module_fault
      likelihood: medium
      label:
        en: Stage 2 squib in the passenger airbag module faulty
        de: Zündpille Stufe 2 im Beifahrerairbagmodul defekt
    - id: srs_module_fault
      likelihood: low
      label:
        en: Output stage in the restraint control module faulty
        de: Endstufe im Airbagsteuergerät defekt
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger airbag loses its second stage for severe crashes
      de: Beifahrerairbag verliert die zweite Stufe für schwere Unfälle
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
