      de: Airbag-Warnleuchte an
    - en: Airbag adaptation to a reclined seating position unavailable
      de: Anpassung des Airbags an eine zurückgelehnte Sitzhaltung nicht verfügbar
    - en: "Safety note: airbag system; disconnect seat and sensor plugs only de-energised (ignition off, battery off, wait time); calibrate the sensor after replacement, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Sitz- und Sensorstecker nur spannungsfrei trennen (Zündung aus, Batterie ab, Wartezeit); Sensor nach dem Tausch kalibrieren, nur Fachwerkstatt"
