- code: B00E8
  category: body
  title:
    en: Third Row Center Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C dritte Reihe Mitte Auslösesteuerung
  description:
    en: B00E8 closes the C row of the table with the centre seat of the third row. No manufacturer publishes it, and the one public list that uses this block, Mercedes-Benz LI54.21-P-070658, stops at a left and a right third-row retractor (B00E7, B00E6). A centre tensioner in row three would mostly appear in large vans or SUVs with a three-seat rear bench. Joyson's retractor pretensioner is compact enough to go into a seat frame, which is where a centre unit would have to live. IIHS frontal tests of 2019 compared rear dummies in vehicles with standard belts and with tensioners plus load limiters, and noted such rear countermeasures are not yet widespread. If B00E8 is set, the airbag lamp is on and the centre belt is not tightened.
    de: B00E8 schließt die Reihe der Stufe C mit dem Mittelplatz der dritten Reihe ab. Kein Hersteller veröffentlicht ihn, und die einzige öffentliche Liste, die diesen Block nutzt – Mercedes-Benz LI54.21-P-070658 –, endet bei einem linken und einem rechten Aufroller der dritten Reihe (B00E7, B00E6). Ein mittlerer Straffer in Reihe drei käme vor allem in großen Vans oder SUVs mit Dreier-Bank ganz hinten vor. Joysons Aufrollerstraffer ist kompakt genug für den Einbau ins Sitzgestell – dort müsste ein Mittelstraffer sitzen. Das IIHS verglich 2019 in Frontalcrashs Fond-Dummys mit Standardgurt und mit Straffer plus Kraftbegrenzer und stellte fest, dass solche Maßnahmen hinten noch wenig verbreitet sind. Ist B00E8 gesetzt, leuchtet die Airbag-Lampe, und der mittlere Gurt wird nicht gestrafft.
