- code: B0029
  category: body
  title:
    en: Right Curtain Deployment Control 1
    de: Kopfairbag rechts Auslösesteuerung 1
  description:
    en: "B0029 stands for the first firing loop of the right curtain airbag. FCA's STAR case S2010000001 for the 2019 Ram heavy-duty pickup reads B0029-11 as a ground short in right curtain squib 1 and sends the technician to the wiring at the C-pillar trim fixings. Mitsubishi lists the right curtain module under B0029 and sets the ground short after 2 seconds. On the A-Class, CLA and GLB Mercedes-Benz stores B002913 for an open squib of the right window bag. Older GM modules used the number for the passenger side airbag: the 2006 Saab 9-5 sets it when resistance stays above 4.5 ohms for 2 seconds. B002A is the second right curtain loop. Airbag lamp on; the curtain may not deploy in a side impact or rollover."
    de: "B0029 bezeichnet den ersten Zündkreis des rechten Kopfairbags. FCA deutet B0029-11 im STAR-Fall S2010000001 zum Ram-Schwerlastpickup 2019 als Masseschluss der Zündpille 1 im rechten Vorhang und schickt den Techniker zur Verkabelung an den Befestigungen der C-Säulen-Verkleidung. Mitsubishi führt das rechte Curtain-Modul unter B0029 und setzt den Masseschluss nach 2 Sekunden. Bei A-Klasse, CLA und GLB speichert Mercedes-Benz B002913 für eine offene Zündpille im rechten Windowbag. Ältere GM-Steuergeräte nutzten die Nummer für den Beifahrer-Seitenairbag: Der Saab 9-5 von 2006 setzt sie, wenn der Widerstand 2 Sekunden über 4,5 Ohm bleibt. Der zweite rechte Vorhangkreis ist B002A. Airbag-Leuchte an; der Kopfairbag öffnet bei Seitenaufprall oder Überschlag womöglich nicht."
  affected_components:
    - right_curtain_airbag
    - srs_roof_wiring
    - srs_control_module
  common_causes:
    - id: srs_wiring_pillar
      likelihood: high
      label:
        en: Lead pinched or chafed at pillar trim fixings (FCA S2010000001)
        de: Leitung an Säulenverkleidungs-Befestigungen eingeklemmt oder durchgescheuert (FCA S2010000001)
    - id: connector_resistance
      likelihood: medium
      label:
        en: Raised contact resistance at the curtain or restraint module connector
        de: Erhöhter Übergangswiderstand am Kopfairbag- oder Steuergerätestecker
    - id: curtain_module_fault
      likelihood: low
      label:
        en: Internal fault in the right curtain airbag module
        de: Innerer Fehler im rechten Kopfairbagmodul
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right curtain airbag may not deploy in a side impact or rollover
      de: Rechter Kopfairbag löst bei Seitenaufprall oder Überschlag eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
