- code: B0047
  category: body
  title:
    en: Left Curtain Deployment Loop Short to Ground
    de: Kopfairbag links Auslösekreis Kurzschluss nach Masse
  description:
    en: "B0047 is missing from the accessible J2012 lists as well, and no vehicle maker or NHTSA bulletin documents it, so it is not publicly traceable. The title names a grounded left curtain airbag loop; this inflatable curtain covers the side windows in side impacts and rollovers. Under J2012 this fault is normally stored as B0021 with byte 11: Mitsubishi sets B0021-11 once the left curtain circuit has been grounded for 2 seconds. GM Global A uses B0016 02 for a grounded left roof rail airbag loop, also after 2 seconds. A grounded lead often sits where the roof harness passes sharp body edges or trim clips. Airbag lamp on."
    de: "Auch B0047 fehlt in den zugänglichen J2012-Listen, und weder ein Fahrzeughersteller noch ein NHTSA-Bulletin dokumentiert ihn; öffentlich ist er nicht nachweisbar. Der Titel nennt einen Masseschluss im Zündkreis des linken Kopfairbags, des aufblasbaren Vorhangs, der bei Seitenaufprall und Überschlag die Seitenscheiben abdeckt. Nach J2012 wird dieser Fehler sonst als B0021 mit Byte 11 gespeichert: Mitsubishi setzt B0021-11, sobald der Kreis des Vorhangairbags links 2 Sekunden lang Masse hat. GM Global A verwendet B0016 02 für einen Masseschluss im Kreis des linken Dachrahmen-Airbags, ebenfalls nach 2 Sekunden. Ein Masseschluss liegt oft dort, wo der Dachkabelstrang an scharfen Blechkanten oder Verkleidungsclips vorbeiführt. Airbag-Leuchte an."
  affected_components:
    - left_curtain_airbag
    - srs_roof_wiring
    - srs_control_module
  common_causes:
