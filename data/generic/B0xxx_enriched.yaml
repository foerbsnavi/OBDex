- code: B0078
  category: body
  title:
    en: Third Row Right Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer dritte Reihe rechts Auslösesteuerung
  description:
    en: "B0078 refers to the right seat of the third row and its belt pretensioner. No carmaker publishes B0078 in this J2012 sense, and Mercedes models with third-row tensioning retractors log the right-hand unit as B00E6 instead. Like B0077, the number has a sensor meaning in GM's older Saab modules: the 2006 Saab 9-5 sets B0078 for an open or short in the communication with the passenger-side side-impact sensor, and the 9-3 airbag module (2003, 2007) uses it for the passenger-side B-pillar sensor, with bytes for faulty communication, a short to battery or ground, or a wrong sensor fitted. Where the code really concerns the right pretensioner of the third row, the airbag lamp is on and that seat loses its pretensioning until the loop is repaired."
    de: "B0078 bezieht sich auf den rechten Platz der dritten Reihe und dessen Gurtstraffer. In dieser J2012-Bedeutung veröffentlicht ihn kein Hersteller; Mercedes-Modelle mit Aufrollerstraffern in der dritten Reihe legen den rechten Straffer als B00E6 ab. Wie B0077 ist die Nummer in den älteren Saab-Steuergeräten von GM ein Sensorcode: Der Saab 9-5 (2006) setzt B0078 bei Unterbrechung oder Kurzschluss in der Verbindung zum Seitenaufprallsensor der Beifahrerseite, das Airbagsteuergerät des 9-3 (2003, 2007) für den rechten B-Säulen-Sensor – mit Bytes für gestörte Kommunikation, Schluss nach Plus oder Masse und falsch verbauten Sensor. Betrifft der Code tatsächlich den rechten Straffer der dritten Reihe, ist die Airbag-Lampe an, und der Platz bleibt bis zur Reparatur des Kreises ohne Straffung."
  affected_components:
    - third_row_right_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: saab_side_sensor
      likelihood: high
      label:
        en: On older Saab 9-3/9-5, fault at the passenger-side side-impact or B-pillar sensor (older GM meaning)
        de: Bei älteren Saab 9-3/9-5 Fehler am Seitenaufprall- bzw. B-Säulen-Sensor rechts (ältere GM-Belegung)
    - id: third_row_right_connector
      likelihood: medium
      label:
        en: Plug at the third-row right belt loosened when the seat was folded or removed
        de: Stecker am rechten Gurt der dritten Reihe beim Umklappen oder Ausbau gelöst
    - id: pretensioner_internal
      likelihood: low
      label:
        en: Internal fault of the third-row right pretensioner
        de: Interner Fehler des rechten Straffers der dritten Reihe
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Third-row right occupant without pretensioning, or on Saab impaired side-impact detection on the passenger side
      de: Insasse dritte Reihe rechts ohne Straffung, beim Saab beeinträchtigte Seitenaufprallerkennung rechts
    - en: "Safety note: pyrotechnic restraint parts; only work on them with the battery disconnected, after the wait time, at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnische Rückhalteteile; nur bei abgeklemmter Batterie nach der Wartezeit und in einer Fachwerkstatt bearbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
