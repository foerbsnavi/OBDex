- code: B00B1
  category: body
  title:
    en: Driver Seat Occupant Classification Sensor B
    de: Fahrersitz Insassenklassifizierungssensor B
  description:
    en: "B00B1 marks the second of the five driver seat classification sensors. No carmaker documents it publicly, and the letter is not tied to a fixed spot. Seat weight systems often measure at the corners: a CTS patent puts one thick-film strain gauge sensor at each corner between seat pan and slide rail, so the occupant's whole weight passes through four bridges whose leads meet in one junction box before the airbag controller. In such a layout every corner could carry its own letter, which would explain a series from A onward, yet no public source confirms that order. A stored B00B1 therefore means one load input is open, out of range or implausible; seat bolts fitted with the wrong torque and harness strain after seat removal are typical suspects. The airbag lamp lights."
    de: "B00B1 bezeichnet den zweiten der fünf Klassifizierungssensoren am Fahrersitz. Kein Hersteller dokumentiert ihn öffentlich, und der Buchstabe ist keiner festen Stelle zugeordnet. Sitzgewichtssysteme messen oft an den Ecken: Ein CTS-Patent setzt je Ecke einen Dickschicht-Dehnungsmessstreifen zwischen Sitzwanne und Gleitschiene, sodass das ganze Gewicht durch vier Messbrücken läuft, deren Leitungen sich in einem Verteiler vor dem Airbag-Steuergerät treffen. Bei so einem Aufbau könnte jede Ecke einen eigenen Buchstaben tragen, was eine Reihe ab A erklären würde; eine öffentliche Quelle bestätigt diese Reihenfolge aber nicht. Ein gespeicherter B00B1 heißt also, dass ein Lasteingang offen, außerhalb des Bereichs oder unplausibel ist; typisch sind falsch angezogene Sitzschrauben und Zug am Kabelbaum nach Sitzausbau. Die Airbag-Leuchte geht an."
  affected_components:
    - driver_classification_sensor_b
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seat_mounting_stress
      likelihood: high
      label:
        en: Seat refitted with wrong bolt torque or distorted mounting, loading the sensor unevenly
        de: Sitz mit falschem Schraubenanzugsmoment oder verspannt montiert, Sensor ungleich belastet
    - id: seat_harness_connector
      likelihood: medium
      label:
        en: Strained or chafed lead to load input B under the seat
        de: Gezerrte oder durchgescheuerte Leitung zu Lasteingang B unter dem Sitz
    - id: load_sensor_fault
      likelihood: medium
      label:
        en: Internal fault of the strain gauge sensor
        de: Interner Fehler des Dehnungsmesssensors
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Weight-based adjustment of the driver airbag unavailable
      de: Gewichtsabhängige Anpassung des Fahrerairbags nicht verfügbar
    - en: "Safety note: airbag system; work on seat and sensor plugs only de-energised; calibrate the seat sensors after replacement or seat refitting, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Sitz- und Sensorstecker nur spannungsfrei bearbeiten (Zündung aus, Batterie ab, Wartezeit); Sitzsensoren nach Tausch oder Sitzeinbau kalibrieren, nur Fachwerkstatt"
