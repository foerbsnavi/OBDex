- code: B0006
  category: body
  title:
    en: Driver Frontal Deployment Loop Short to Ground
    de: Fahrer-Frontairbag Auslösekreis Kurzschluss nach Masse
  description:
    en: "B0006 is missing from the public J2012 code lists, which go straight from B0005 to B0010. The only documented use found has nothing to do with airbags: on the 2025 Ram 1500 the body control module stores B0006-11 for a short to ground in the latch control of the left RamBox stowage lid, fixed by a module update (flash 08-204-24). The title describes a driver airbag firing loop shorted to ground. Current restraint modules report that as a fault byte on the stage code instead, for example GM B0012 02 on the 2011 Saab 9-4X, set after two seconds of ground short. A ground short in a squib circuit can stop the stage from firing, so the scan tool must first show which module stored B0006 before anyone works on the airbag."
    de: "B0006 fehlt in den öffentlichen J2012-Codelisten, die von B0005 direkt zu B0010 springen. Die einzige gefundene Verwendung hat mit Airbags nichts zu tun: Beim Ram 1500 Modelljahr 2025 legt das Karosseriesteuergerät B0006-11 für einen Masseschluss in der Verriegelungsansteuerung des linken RamBox-Staufachdeckels ab, behoben per Software-Update (Flash 08-204-24). Der Titel beschreibt einen Masseschluss im Zündkreis des Fahrer-Frontairbags. Heutige Airbagsteuergeräte melden das als Fehlerbyte am Stufen-Code, etwa GM B0012 02 beim Saab 9-4X 2011 nach zwei Sekunden Masseschluss. Ein solcher Kurzschluss kann die Zündung der Stufe verhindern; deshalb zuerst klären, welches Steuergerät B0006 gespeichert hat, bevor jemand am Airbag arbeitet."
  affected_components:
    - driver_airbag_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: body_module_latch_circuit
      likelihood: medium
      label:
        en: On Ram 1500 2025 the code belongs to the left stowage lid latch circuit of the body module, not the airbag
        de: Beim Ram 1500 (2025) gehört der Code zum Verriegelungskreis des linken Staufachdeckels im Karosseriesteuergerät, nicht zum Airbag
    - id: squib_lead_ground_short
      likelihood: medium
      label:
        en: Driver airbag squib lead chafed against metal (ground short)
        de: Zündpillenleitung des Fahrerairbags an Metall durchgescheuert (Masseschluss)
    - id: clock_spring_short
      likelihood: low
      label:
        en: Insulation damage inside the clock spring
        de: Isolationsschaden in der Wickelfeder
  symptoms:
    - en: Airbag warning lamp on when stored by the restraint module
      de: Airbag-Warnleuchte an, wenn das Airbagsteuergerät den Code speichert
    - en: On Ram 1500 2025 stowage lid will not open electrically, alarm may sound
      de: Beim Ram 1500 (2025) öffnet der Staufachdeckel elektrisch nicht, Alarm kann auslösen
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
