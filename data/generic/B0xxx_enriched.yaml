      de: Airbag-Aus-Anzeige bleibt an, obwohl der Insasse aufrecht sitzt
    - en: "Safety note: airbag system; disconnect seat and sensor plugs only de-energised; after a sensor or unit change initialise/calibrate the system, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Sitz- und Sensorstecker nur spannungsfrei trennen; nach Sensor- oder Steuergerätetausch System initialisieren/kalibrieren, nur Fachwerkstatt"
