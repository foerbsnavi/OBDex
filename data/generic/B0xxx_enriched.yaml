- code: B007C
  category: body
  title:
    en: Second Row Right Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B zweite Reihe rechts Auslösesteuerung
  description:
    en: "B007C is the second-row right counterpart of B007B: an additional pretensioner stage at the right outer rear seat. No manufacturer publishes this code. On that seat Mitsubishi uses B0075 for its retractor pretensioner and Mercedes uses B00E4 for the right rear emergency tensioning retractor, so neither leaves a role for B007C. A B stage would typically be a buckle or anchor unit acting on the lap belt; NHTSA's 2013 evaluation explains how a buckle pretensioner pulls the buckle down by a cable and piston, while Joyson describes lap tensioners working with the retractor. Rear lap units are far less common than front ones, so this code is unusual. When it does appear, the airbag lamp stays on and that stage cannot be counted on."
    de: "B007C ist das rechte Gegenstück zu B007B: eine zusätzliche Straffer-Stufe am rechten Außenplatz der zweiten Reihe. Kein Hersteller veröffentlicht den Code. An diesem Platz verwendet Mitsubishi B0075 für den Aufrollerstraffer und Mercedes B00E4 für den rechten hinteren Gurtstraffer-Aufroller – für B007C bleibt bei beiden keine Aufgabe. Eine Stufe B wäre typischerweise ein Schloss- oder Verankerungsstraffer am Beckengurt; die NHTSA-Auswertung von 2013 erklärt, wie ein Schlossstraffer das Gurtschloss über Seilzug und Kolben nach unten zieht, Joyson beschreibt Beckengurtstraffer im Zusammenspiel mit dem Aufroller. Hinten sind Beckenstraffer weit seltener als vorn, der Code ist deshalb ungewöhnlich. Taucht er auf, bleibt die Airbag-Lampe an, und auf diese Stufe ist kein Verlass."
  affected_components:
    - second_row_right_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: rear_right_buckle_connector
      likelihood: high
      label:
        en: Plug of the right rear buckle or anchor tensioner loosened during seat work
        de: Stecker des rechten hinteren Schloss- oder Verankerungsstraffers bei Sitzarbeiten gelöst
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Airbag module configuration lists a stage that is not installed
        de: Konfiguration des Airbagsteuergeräts enthält eine nicht verbaute Stufe
    - id: squib_internal
      likelihood: low
      label:
        en: Internal fault of the right rear B-stage tensioner
        de: Interner Fehler des rechten hinteren Straffers der Stufe B
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right rear lap belt not pretensioned in a crash
      de: Beckengurt hinten rechts wird bei einem Unfall nicht vorgespannt
    - en: "Safety note: the tensioner contains a pyrotechnic charge; only work on it with the battery disconnected and at a specialist workshop"
      de: "Sicherheitshinweis: Der Straffer enthält eine pyrotechnische Ladung; nur bei abgeklemmter Batterie und in einer Fachwerkstatt daran arbeiten"
  repair:
