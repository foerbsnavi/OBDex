- code: B004B
  category: body
  title:
    en: Third Row Right Frontal Stage 3 Deployment Control
    de: Frontairbag dritte Sitzreihe rechts Stufe 3 Auslösesteuerung
  description:
    en: "B004B is the last code of the third-row frontal block: stage 3 of the right-hand bag. What a third element does is up to the maker. Mercedes-Benz shows one answer in its front airbags, where the third slot is a vent valve squib (B000313, B001213); Breed's patent shows another, a third chamber held back for a later second impact. Mercedes-Benz's rear airbag filing also links an extra chamber to the first through valves or throttles. No vehicle maker documents B004B and no NHTSA bulletin contains it. A fault here leaves the bag without its third element; stage 1 and 2 are B0049 and B004A. Airbag lamp on."
    de: "B004B ist der letzte Code des Frontblocks der dritten Reihe: Stufe 3 des rechten Airbags. Was ein drittes Element tut, bestimmt der Hersteller. Mercedes-Benz zeigt bei den vorderen Airbags eine Antwort, dort ist der dritte Platz eine Ventilzündpille (B000313, B001213); das Breed-Patent zeigt eine andere, eine dritte Kammer, die für einen späteren Zweitaufprall zurückgehalten wird. Die Mercedes-Benz-Anmeldung zum Fond-Airbag koppelt zudem eine zusätzliche Kammer über Ventile oder Drosseln an die erste. Kein Fahrzeughersteller dokumentiert B004B, in keinem NHTSA-Bulletin taucht er auf. Ein Fehler hier lässt den Airbag ohne sein drittes Element; Stufe 1 und 2 sind B0049 und B004A. Airbag-Leuchte an."
  affected_components:
    - third_row_right_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: stage3_lead
      likelihood: medium
      label:
        en: Damaged stage 3 lead or squib
        de: Beschädigte Leitung oder Zündpille der Stufe 3
    - id: config_mismatch
      likelihood: low
      label:
        en: Restraint module configured for equipment the vehicle does not have (wrong part or coding)
        de: Steuergerät auf Ausstattung codiert, die das Fahrzeug nicht hat (falsches Teil oder falsche Codierung)
    - id: second_row_seat_connector
      likelihood: low
      label:
        en: Loose connector in the second-row seatback
        de: Lockerer Stecker in der Lehne der zweiten Reihe
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Right third-row airbag may deploy without its third element
      de: Rechter Airbag der dritten Reihe zündet womöglich ohne drittes Element
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
