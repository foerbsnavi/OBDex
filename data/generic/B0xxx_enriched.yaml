- code: B0055
  category: body
  title:
    en: Second Row Right Seat Belt Sensor
    de: Gurtsensor zweite Sitzreihe rechts
  description:
    en: B0055 stands for the buckle sensor of the right seat in the second row, behind the front passenger and in vans often beside the sliding door. Where that seat is a removable captain's chair, a disconnect in the buckle lead is unavoidable; IEE points out in a patent that a wireless buckle sensor alone cannot tell the module whether the seat is fitted, so a missing signal may mean a fault or simply an empty floor. A seat refitted with its plug left open is therefore a common trigger. CTS supplies non-contact Hall buckle switches for such uses. The rear belt warning of FMVSS 208, section S7.5(c), applies to this seat for vehicles made after 1 September 2028. No carmaker documents B0055 publicly; the Mitsubishi passenger code B0052 is the nearest documented model.
    de: B0055 steht für den Gurtschlosssensor des rechten Sitzes der zweiten Reihe, also hinter dem Beifahrer und bei Vans oft neben der Schiebetür. Ist dieser Sitz ein herausnehmbarer Einzelsitz, braucht die Gurtschlossleitung eine Trennstelle; IEE weist in einem Patent darauf hin, dass ein Funk-Gurtsensor allein dem Steuergerät nicht sagt, ob der Sitz eingebaut ist – ein fehlendes Signal kann Fehler oder schlicht leeren Boden bedeuten. Ein wieder eingesetzter Sitz mit offenem Stecker ist daher ein häufiger Auslöser. CTS liefert berührungslose Hall-Gurtschlossschalter für solche Anwendungen. Die hintere Gurtwarnung aus FMVSS 208, Abschnitt S7.5(c), gilt für diesen Platz bei Fahrzeugen, die nach dem 1. September 2028 gebaut werden. Öffentlich dokumentiert kein Hersteller B0055; nächstes belegtes Vorbild ist Mitsubishis Beifahrercode B0052.
