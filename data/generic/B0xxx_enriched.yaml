- code: B0051
  category: body
  title:
    en: First Row Center Seat Belt Sensor
    de: Gurtsensor erste Sitzreihe Mitte
  description:
    en: B0051 belongs to the buckle sensor of a middle seat in the front row, found in pickups and vans with a front bench for three. FMVSS 208 requires a belt warning only for the outboard front seats, so a centre buckle sensor is extra equipment that feeds the restraint module and, where fitted, a reminder for that place. Typical hardware is a non-contacting Hall buckle switch as offered by CTS and described by Allegro. No carmaker documents B0051 with this meaning; Mitsubishi uses the same J2012 pattern for the passenger buckle, B0052, with an open or invalid signal for 2 seconds. Older GM modules (Saab 9-5 2006, 9-3) store B0051 as Deployment Commanded, a crash record. Airbag lamp on.
    de: B0051 gehört zum Gurtschlosssensor eines Mittelplatzes in der ersten Reihe, wie es ihn in Pick-ups und Transportern mit Dreiersitzbank vorn gibt. FMVSS 208 verlangt einen Gurtwarner nur für die äußeren Vordersitze; ein Sensor für die Mitte ist also Zusatzausstattung, die dem Airbagsteuergerät und gegebenenfalls einer Gurterinnerung für diesen Platz Daten liefert. Üblich ist ein berührungsloser Hall-Gurtschlossschalter, wie ihn CTS anbietet und Allegro beschreibt. Mit dieser Bedeutung dokumentiert kein Hersteller B0051; Mitsubishi nutzt dasselbe J2012-Muster für das Beifahrergurtschloss, B0052, mit offenem oder ungültigem Signal über 2 Sekunden. Ältere GM-Steuergeräte (Saab 9-5 2006, 9-3) speichern B0051 als Auslösung angefordert, also als Unfallvermerk. Airbag-Leuchte an.
  affected_components:
    - seat_belt_buckle_switch
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: center_buckle_connector
      likelihood: high
      label:
        en: Loose or corroded connector of the centre buckle under the bench seat
        de: Lockerer oder korrodierter Stecker des Mittelgurtschlosses unter der Sitzbank
    - id: buckle_switch_fault
      likelihood: medium
      label:
        en: Faulty Hall switch in the centre buckle
        de: Defekter Hallschalter im Mittelgurtschloss
    - id: fold_down_console
      likelihood: low
      label:
        en: Lead strained by a fold-down centre seat or console
        de: Leitung durch umklappbaren Mittelsitz oder Konsole belastet
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Centre seat belt reminder may be wrong or missing
      de: Gurterinnerung für den Mittelplatz ist womöglich falsch oder fehlt
    - en: "Safety note: the buckle connector sits under the seat next to the side airbag and pretensioner plugs; disconnect the battery and observe the wait time before unplugging anything"
      de: "Sicherheitshinweis: Der Gurtschlossstecker liegt unter dem Sitz neben Seitenairbag- und Gurtstrafferstecker; vor dem Trennen Batterie abklemmen und Wartezeit einhalten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [60, 450]
    estimated_hours: [0.5, 2]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [B0050, B0052, B0071]
  sources:
    - https://www.law.cornell.edu/cfr/text/49/571.208
    - https://www.ctscorp.com/Products/Automotive-Position-Sensors/occupancy-restraint-sensors
    - https://www.allegromicro.com/-/media/files/application-notes/an296068-vehicle-safety-systems.pdf
    - https://mitsubishitechinfo.com/data/DG/2022/08/HTML/N5080404A000GN00USA.htm
    - https://saabwisonline.com/9-5-9600/2006/8-body/airbag-srs/fault-diagnosis-diagnostic-trouble-codes/b0051
  reviewed: '2026-11-06'

