- code: B009F
  category: body
  title:
    en: Right Side Restraints Sensor 6
    de: Seitencrashsensor rechts 6
  description:
    en: "B009F would be the sixth and last right-hand restraints sensor in the J2012 block. No carmaker documents it publicly with this meaning. The number does appear at GM, but for another part: on 2008–2013 two-mode hybrid Tahoe, Yukon, Escalade, Silverado and Sierra trucks, bulletin PIT4614C ties a no-crank condition with B009F stored in the SDGM gateway to water passing the seal of the HVCID crash sensor for the high-voltage circuit, mounted on the lower radiator support; the sensor and terminals are inspected and replaced. That is a crash switch for isolating the hybrid battery, not an airbag satellite. A genuine sixth right satellite would be an acceleration unit, for example a PSI5-linked Bosch SMA773 sensor on a rear pillar or sill. Its failure lights the airbag lamp."
    de: "B009F wäre der sechste und letzte rechte Rückhaltesensor im J2012-Block. Kein Hersteller dokumentiert ihn öffentlich in dieser Bedeutung. Bei GM taucht die Nummer auf, aber für ein anderes Bauteil: Bei den Two-Mode-Hybriden Tahoe, Yukon, Escalade, Silverado und Sierra (2008–2013) führt das Bulletin PIT4614C einen Nichtstart mit B009F im Gateway-Modul auf Wasser zurück, das an der Dichtung des Hochvolt-Aufprallsensors am unteren Kühlerträger eindringt; Sensor und Kontakte werden geprüft und erneuert. Das ist ein Crashschalter zum Abtrennen der Hybridbatterie, kein Airbag-Satellit. Ein echter sechster Sensor rechts wäre ein Beschleunigungsaufnehmer, etwa ein per PSI5 angebundener Bosch SMA773 an hinterer Säule oder Schweller. Fällt er aus, geht die Airbag-Leuchte an."
