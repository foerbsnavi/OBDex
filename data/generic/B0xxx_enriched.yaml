- code: B002A
  category: body
  title:
    en: Right Curtain Deployment Control 2
    de: Kopfairbag rechts Auslösesteuerung 2
  description:
    en: "B002A is the second firing loop of the right curtain airbag, needed only where the right side has two curtain inflators or a separate curtain section for the rear seats. Mercedes-Benz uses it that way on the A-Class, CLA and GLB: B002A13 marks an open squib in the right rear window bag, while the front part reports B0029; a known trigger was poor contact at the control unit plug (LI54.21-P-070658). A TRW and Ford patent describes front-row and rear-row curtains that inflate separately and may be tethered together at the B-pillar. Where curtains also deploy in a rollover, FMVSS 226 requires a readiness indicator the driver can see. Airbag lamp on; head protection for the right rear seat may be missing."
    de: "B002A ist der zweite Zündkreis des rechten Kopfairbags und kommt nur vor, wo rechts zwei Gasgeneratoren im Vorhang oder ein eigener Vorhangteil für die Rücksitze verbaut sind. So verwendet ihn Mercedes-Benz in A-Klasse, CLA und GLB: B002A13 zeigt eine offene Zündpille im rechten hinteren Windowbag an, der vordere Teil meldet sich über B0029; bekannter Auslöser war ein schlechter Kontakt am Steckanschluss des Steuergeräts (LI54.21-P-070658). Ein Patent von TRW und Ford beschreibt Vorhänge für erste und zweite Reihe, die getrennt gefüllt werden und an der B-Säule verbunden sein können. Lösen Kopfairbags auch beim Überschlag aus, verlangt FMVSS 226 eine für den Fahrer sichtbare Bereitschaftsanzeige. Airbag-Leuchte an; dem rechten Fondplatz fehlt womöglich der Kopfschutz."
  affected_components:
    - right_curtain_airbag
    - squib_circuit
    - srs_roof_wiring
  common_causes:
    - id: connector_resistance
      likelihood: high
      label:
        en: Raised contact resistance at the restraint module connector (Mercedes LI54.21-P-070658)
        de: Erhöhter Übergangswiderstand am Steuergerätestecker (Mercedes LI54.21-P-070658)
    - id: rear_curtain_wiring
      likelihood: medium
      label:
        en: Damaged lead to the rear curtain section at the C-pillar or roof rail
        de: Beschädigte Leitung zum hinteren Vorhangteil an C-Säule oder Dachrahmen
    - id: curtain_module_fault
      likelihood: low
      label:
        en: Internal fault in the rear right curtain airbag module
        de: Innerer Fehler im hinteren rechten Kopfairbagmodul
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Head protection for the right rear seat may be missing
      de: Kopfschutz für den rechten Rücksitzplatz fehlt womöglich
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
