- code: B00E7
  category: body
  title:
    en: Third Row Left Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C dritte Reihe links Auslösesteuerung
  description:
    en: "B00E7 marks the C-stage tensioner of the third row's left seat, listed after its right-hand twin B00E6. Mercedes-Benz documents it: LI54.21-P-070658 uses B00E713 when the firing pill of the left third-row tensioning retractor shows an open, in the same list as the rear and driver retractors. In that topic the remedy does not start with the tensioner but with fault-tracing the wire and reconnecting the restraint unit plugs; only a recurring fault calls for a new control unit of at least level Q4. Joyson describes this kind of pyrotechnic retractor, which can sit in the body or the seat structure. No other maker publishes B00E7. Airbag lamp on; the left third-row occupant is not tensioned."
    de: "B00E7 kennzeichnet den Straffer der Stufe C am linken Sitz der dritten Reihe und folgt in der Liste auf den rechten Zwilling B00E6. Mercedes-Benz belegt ihn: LI54.21-P-070658 nennt B00E713 für eine Unterbrechung an der Zündpille des Gurtstraffer-Aufrollers links in der dritten Sitzreihe, in derselben Aufstellung wie die Aufroller hinten und am Fahrersitz. Die Abhilfe beginnt dort nicht beim Straffer, sondern beim Verfolgen der Leitung und neuem Stecken der Verbinder am Rückhaltesteuergerät; erst bei wiederkehrendem Fehler kommt ein neues Steuergerät mindestens im Stand Q4. Joyson beschreibt diese Art pyrotechnischer Aufroller, die in der Karosserie oder im Sitzgestell sitzen können. Kein anderer Hersteller veröffentlicht B00E7. Airbag-Lampe an, der Insasse links in Reihe drei wird nicht gestrafft."
