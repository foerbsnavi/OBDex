- code: B00B2
  category: body
  title:
    en: Driver Seat Occupant Classification Sensor C
    de: Fahrersitz Insassenklassifizierungssensor C
  description:
    en: "B00B2 is the third driver seat classification sensor in the J2012 list. No carmaker documents the code publicly. A widely used sensor type is Bosch's iBolt: the four bolts that anchor the seat frame are swapped for sensor bolts, a magnet and Hall element register how far a bending beam deflects, and the unit derives weight and how it is spread, separating an empty seat, a one-year-old, children of three and six, a 5th percentile woman and a 50th percentile man. A Bosch patent adds an accelerometer in the seat back that freezes the classification while jolts would distort the bolts' readings. Which bolt the letter C would denote is not published. With B00B2 stored, the airbag lamp is on and adaptive deployment cannot rely on that input."
    de: "B00B2 ist der dritte Klassifizierungssensor des Fahrersitzes in der J2012-Liste. Kein Hersteller dokumentiert den Code öffentlich. Ein verbreiteter Sensortyp ist Boschs iBolt: Die Schrauben an den vier Befestigungspunkten des Sitzgestells werden durch Sensorbolzen ersetzt, Magnet und Hall-Element erfassen die Durchbiegung eines Biegebalkens, und das Steuergerät ermittelt daraus Gewicht und Verteilung – leerer Sitz, Einjähriges, Kinder von drei und sechs Jahren, 5-Perzentil-Frau und 50-Perzentil-Mann. Ein Bosch-Patent ergänzt einen Beschleunigungssensor in der Lehne, der die Klassifizierung einfriert, solange Stöße die Bolzenwerte verfälschen würden. Welchen Bolzen der Buchstabe C meint, ist nicht veröffentlicht. Bei gespeichertem B00B2 brennt die Airbag-Leuchte, und die angepasste Auslösung kann sich nicht auf diesen Eingang stützen."
  affected_components:
