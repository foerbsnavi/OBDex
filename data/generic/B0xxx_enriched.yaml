- code: B0093
  category: body
  title:
    en: Left Side Restraints Sensor 3
    de: Seitencrashsensor links 3
  description:
    en: "B0093 is the third left-side crash sensor. Mitsubishi mounts it at the left C-pillar, names it C-PILLAR SAT SEN LH and gives the J2012 wording Left Side Restraints Sensor 3. Unlike the B-pillar unit, it carries the full set of subtypes: -11 when the sensor line is shorted to ground, -55 for a configuration mismatch, -81 when communication with the sensor fails, and others, each confirmed after two seconds with the ignition on. A sensor that far back can give the module an early view of impacts behind the front door. Bosch lists C-pillars among the mounting points for its acceleration satellites, and Continental's gSAT measures acceleration in rigid structure for the same purpose. The airbag lamp lights while B0093 is stored."
    de: "B0093 ist der dritte Crashsensor links. Mitsubishi setzt ihn an die linke C-Säule, nennt ihn C-PILLAR SAT SEN LH und gibt den J2012-Wortlaut Left Side Restraints Sensor 3 an. Anders als beim B-Säulen-Sensor ist hier der volle Satz an Untertypen belegt: -11 bei Masseschluss der Sensorleitung, -55 bei unpassender Konfiguration, -81 bei gestörter Kommunikation und weitere, jeweils nach zwei Sekunden bei eingeschalteter Zündung bestätigt. Ein so weit hinten sitzender Sensor kann dem Steuergerät Treffer hinter der Vordertür früh anzeigen. Bosch nennt C-Säulen als Einbauort seiner Beschleunigungs-Satelliten, und Continentals gSAT misst zum selben Zweck die Beschleunigung in steifer Struktur. Solange B0093 gespeichert ist, brennt die Airbag-Lampe."
  affected_components:
    - left_side_impact_sensor_3
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: c_pillar_harness_short
      likelihood: high
      label:
        en: Sensor line shorted to ground or poor contact at the C-pillar plug (subtypes -11/-81)
        de: Sensorleitung mit Masseschluss oder schlechter Kontakt am C-Säulen-Stecker (Untertypen -11/-81)
    - id: c_pillar_sensor_fault
      likelihood: medium
      label:
        en: Internal fault of the C-pillar satellite sensor
        de: Interner Fehler des Satellitensensors an der C-Säule
    - id: module_configuration
      likelihood: medium
      label:
        en: Airbag unit configuration not matching the vehicle (subtype -55)
        de: Konfiguration des Airbag-Steuergeräts passt nicht zum Fahrzeug (Untertyp -55)
    - id: airbag_unit_fault
      likelihood: low
      label:
        en: Internal fault of the airbag diagnosis unit
        de: Interner Fehler des Airbag-Steuergeräts
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left side impact sensing behind the front door is degraded
      de: Seitencrash-Erkennung links hinter der Vordertür ist eingeschränkt
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before work at the rear pillar, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten an der hinteren Säule Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
