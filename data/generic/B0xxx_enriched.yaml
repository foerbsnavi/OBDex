- code: B0048
  category: body
  title:
    en: Third Row Right Side Airbag Deployment Control
    de: Seitenairbag dritte Sitzreihe rechts Auslösesteuerung
  description:
    en: "B0048 is the right-hand counterpart of B0040: the deployment loop of a side airbag for the right seat in a third row. Few vehicles have one, because the third row usually relies on a curtain that reaches back to the D-pillar. Patent literature covers the hardware: Joyson's seatback side module is described for any seating row including the third, and GM's application treats each rear row as a separate system with its own generator that may stay idle when another fires. No manufacturer documents B0048, and NHTSA holds no bulletin with it. For a second-row right side bag, Mitsubishi shows the usual logic under B0038, a fault confirmed after 2 seconds. Airbag lamp on."
    de: "B0048 ist das rechte Gegenstück zu B0040: der Auslösekreis eines Seitenairbags für den rechten Platz der dritten Reihe. Nur wenige Fahrzeuge haben ihn, weil die dritte Reihe meist mit einem bis zur D-Säule reichenden Kopfairbag auskommt. Die Technik beschreiben Patente: Das Seitenairbagmodul von Joyson in der Lehne ist für jede Sitzreihe einschließlich der dritten gedacht, und die GM-Anmeldung behandelt jede hintere Reihe als eigenes System mit eigenem Gasgenerator, das untätig bleiben darf, wenn ein anderes zündet. Kein Hersteller dokumentiert B0048, bei NHTSA liegt kein Bulletin dazu. Für den rechten Seitenairbag der zweiten Reihe zeigt Mitsubishi unter B0038 die übliche Logik mit Bestätigung nach 2 Sekunden. Airbag-Leuchte an."
  affected_components:
    - third_row_right_side_airbag
    - squib_circuit
    - srs_wiring
    - srs_control_module
