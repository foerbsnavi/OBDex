- code: B00B8
  category: body
  title:
    en: Driver Seat Occupant Position Sensor B
    de: Fahrersitz Insassenpositionssensor B
  description:
    en: "B00B8 names the second occupant position sensor at the driver seat. The code is not published by any carmaker, and the letter assignment is the maker's choice. Instead of looking down from the roof, a position sensor can sit at the airbag cover itself: a patent first filed in 1998 by Automotive Systems Laboratory, now held by Joyson, puts an active infrared, ultrasonic or electric field sensor in or near the inflator door, keeps the bag disabled while a large body part is in the at-risk zone and cites NHTSA findings that injuries drop if the bag stays off for occupants roughly 4 to 10 inches from the door. FMVSS 208 accepts such dynamic suppression for the driver bag. A stored B00B8 means this input has failed; the airbag lamp lights."
    de: "B00B8 bezeichnet den zweiten Insassenpositionssensor am Fahrersitz. Kein Hersteller dokumentiert den Code öffentlich, die Buchstabenzuordnung trifft der Hersteller. Statt vom Dach herabzuschauen, kann ein Positionssensor direkt an der Airbagabdeckung sitzen: Ein 1998 zuerst eingereichtes Patent von Automotive Systems Laboratory, heute bei Joyson, setzt einen aktiven Infrarot-, Ultraschall- oder Feldsensor in oder neben die Airbagklappe, hält den Airbag gesperrt, solange ein größeres Körperteil in der Gefahrenzone ist, und verweist auf NHTSA-Befunde, wonach Verletzungen sinken, wenn der Airbag bei rund 4 bis 10 Zoll Abstand zur Klappe aus bleibt. FMVSS 208 lässt eine solche dynamische Abschaltung für den Fahrerairbag zu. Ein gespeicherter B00B8 heißt, dass dieser Eingang ausgefallen ist; die Airbag-Leuchte geht an."
  affected_components:
    - driver_occupant_position_sensor_b
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: clockspring_or_harness
      likelihood: medium
      label:
        en: Fault in the lead to a sensor at the steering wheel or cover, e.g. via the clockspring
        de: Fehler in der Leitung zu einem Sensor an Lenkrad oder Abdeckung, z. B. über die Wickelfeder
    - id: sensor_obstructed
      likelihood: medium
      label:
        en: Sensor window covered by stickers, covers or dirt
        de: Sensorfenster durch Aufkleber, Bezüge oder Schmutz verdeckt
    - id: sensor_fault
      likelihood: medium
      label:
        en: Internal fault of position sensor B
        de: Interner Fehler von Positionssensor B
  symptoms:
