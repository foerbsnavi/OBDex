- code: B00F3
  category: body
  title:
    en: Second Row Center Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt zweite Reihe Mitte Auslösesteuerung
  description:
    en: "B00F3 refers to an inflatable belt at the centre seat of the second row. No manufacturer documents the code, and the known systems leave this seat out: Ford's 2018 Explorer manual limits its inflatable belts to the outermost second-row positions, and Mercedes fits its beltbag to the outer rear belts (S-Class manual 2017); the E-Class manual of the same year lists the belt air bag as a frontal-impact device. A centre version would be harder to package because the gas usually enters at the buckle or lower anchor; NHTSA's belt tensile study notes that the 2011 Explorer belt needed a retractor in the lap loop because its inflator was attached to the buckle. If set, the airbag lamp is lit."
    de: "B00F3 bezieht sich auf einen aufblasbaren Gurt am Mittelplatz der zweiten Reihe. Kein Hersteller dokumentiert den Code, und die bekannten Systeme sparen diesen Platz aus: Das Explorer-Handbuch 2018 von Ford beschränkt die aufblasbaren Gurte auf die äußeren Plätze der zweiten Reihe, und Mercedes setzt den Beltbag an die äußeren Fondgurte (S-Klasse-Handbuch 2017); das E-Klasse-Handbuch desselben Jahres führt den Gurtairbag als Schutz beim Frontalaufprall. Eine Mittelausführung wäre schwerer unterzubringen, weil das Gas meist am Schloss oder am unteren Anker eintritt; die NHTSA-Zugversuchsstudie hält fest, dass der Explorer-Gurt von 2011 einen Aufroller in der Beckenschlaufe brauchte, weil der Generator am Schloss saß. Ist der Code gesetzt, leuchtet die Airbag-Lampe."
  affected_components:
    - second_row_center_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Restraint module configured for a centre inflatable belt not present in the vehicle
        de: Rückhaltesteuergerät für einen mittleren aufblasbaren Gurt konfiguriert, der im Fahrzeug fehlt
    - id: center_buckle_connector
      likelihood: medium
      label:
        en: Connector at the centre buckle inflator under the bench disconnected
        de: Stecker am Gasgenerator des mittleren Gurtschlosses unter der Bank getrennt
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Igniter of the centre belt inflator open or shorted
        de: Zünder des mittleren Gurt-Gasgenerators unterbrochen oder kurzgeschlossen
  symptoms:
    - en: Airbag indicator remains on
      de: Airbag-Kontrollleuchte bleibt an
    - en: Rear centre belt would not inflate in a crash
      de: Mittlerer Fondgurt würde sich bei einem Unfall nicht füllen
    - en: "Safety note: pyrotechnic or stored-gas inflator – only work with the battery disconnected and the wait time observed, at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnischer bzw. Kaltgas-Generator – nur mit abgeklemmter Batterie und nach Wartezeit, in einer Fachwerkstatt"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 1500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
