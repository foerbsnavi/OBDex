- code: B00F7
  category: body
  title:
    en: Third Row Right Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt dritte Reihe rechts Auslösesteuerung
  description:
    en: "B00F7 closes the inflatable-belt block with the right seat of row three. No manufacturer documents it. The nearest real case is one row further forward: on the 2014–2016 Ford Explorer, the dealer bulletin for programme 21B11 names B141C as the right and B141B as the left second-row harness code and has technicians re-route or repair the seat pigtail when either appears. Ford's 2018 owner manual puts the rear inflatable belts in the shoulder webbing of the outboard second-row seats only; on the right of row three there are child-seat anchors but no bag. Mercedes lists beltbags for the outer rear belts of the S-Class, and Autoliv's 2002 patent shows one inflator feeding belts through a gas guide. With B00F7 present, the airbag lamp stays on."
    de: "B00F7 schließt den Block der aufblasbaren Gurte mit dem rechten Platz der dritten Reihe ab. Kein Hersteller dokumentiert ihn. Der nächste reale Fall liegt eine Reihe weiter vorn: Beim Ford Explorer 2014–2016 nennt das Händlerbulletin zum Programm 21B11 B141C als Code des rechten und B141B als Code des linken Kabelbaums der zweiten Reihe und lässt bei einem davon das Sitz-Anschlusskabel neu verlegen oder instand setzen. Fords Handbuch von 2018 setzt die aufblasbaren Fondgurte nur in das Schulterband der äußeren Plätze der zweiten Reihe; rechts in Reihe drei gibt es Kindersitz-Anker, keinen Luftsack. Mercedes führt Beltbags an den äußeren Fondgurten der S-Klasse, und Autolivs Patent von 2002 speist Gurte über eine Gasführung aus einem Generator. Steht B00F7 an, bleibt die Airbag-Lampe an."
  affected_components:
    - third_row_right_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: right_seat_harness
      likelihood: high
      label:
        en: Chafed wires in the right rear seat harness, as seen one row forward on the Explorer (B141C)
        de: Durchgescheuerte Adern im Kabelbaum des rechten Fondsitzes, wie eine Reihe weiter vorn beim Explorer (B141C)
    - id: configuration_mismatch
      likelihood: medium
      label:
