- code: B00C4
  category: body
  title:
    en: Passenger Seat Occupant Classification Sensor E
    de: Beifahrersitz Insassenklassifizierungssensor E
  description:
    en: "B00C4 stands for the fifth and last passenger seat classification input; no public carmaker source uses it. Two field cases show what goes wrong besides wiring. Mazda found on 2016–2019 models that a phone, tablet or laptop lying on an empty passenger seat could make the system see a person: the passenger belt warning came on while PASS AIRBAG OFF stayed dark, and the advice was simply to keep devices off the seat. Land Rover quarantined 2025 Range Rover Sport SV cars because the OCS modules had been calibrated with the wrong weight, so the bag might not be switched off for a child seat as FMVSS 208 demands; new modules took 1.1 h. Calibration and plausibility therefore matter as much as the sensor. With B00C4 stored, the airbag lamp is lit and E is not trusted."
    de: "B00C4 steht für den fünften und letzten Klassifizierungseingang des Beifahrersitzes. Kein Hersteller veröffentlicht diesen Code. Zwei Fälle aus der Praxis zeigen, was außer der Verkabelung schiefgehen kann. Mazda stellte bei Modellen 2016–2019 fest, dass ein Handy, Tablet oder Laptop auf dem leeren Beifahrersitz als Person erkannt werden konnte: Die Gurtwarnung für den Beifahrer ging an, PASS AIRBAG OFF blieb dunkel, und der Rat lautete, keine Geräte auf den Sitz zu legen. Land Rover sperrte Range Rover Sport SV des Modelljahrs 2025, weil die OCS-Module mit falschem Gewicht kalibriert waren und der Airbag bei Kindersitz entgegen FMVSS 208 aktiv bleiben konnte; neue Module dauerten 1,1 h. Kalibrierung und Plausibilität zählen also so viel wie der Sensor. Bei B00C4 leuchtet die Airbag-Leuchte, Eingang E gilt als unzuverlässig."
  affected_components:
