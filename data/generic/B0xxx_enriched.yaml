- code: B0082
  category: body
  title:
    en: Passenger Seat Belt Load Limiter Deployment Control
    de: Beifahrer-Gurtkraftbegrenzer Auslösesteuerung
  description:
    en: "B0082 covers the firing loop of the front passenger's switchable belt force limiter. Two manufacturers document this meaning. In the Mercedes A-Class, CLA and GLB, B008213 marks an interrupted igniter of the passenger-side belt force limiter. Ford special service message 51998 covers 2023 Escape, Corsair, Bronco Sport and Maverick that store B0082:1A because of the passenger belt retractor at connector C303B; where a connection fault is found, the retractor and pretensioner assembly is replaced before any wiring repair. Autoliv patents show why retractor and limiter belong together: the pretensioner's own gas can select the higher limiting level. On GM Global A cars (Saab 9-4X) B0082 means the seat belt reminder sensor in the passenger cushion instead. The airbag lamp stays on."
    de: "B0082 betrifft den Zündkreis des umschaltbaren Gurtkraftbegrenzers am Beifahrersitz. Zwei Hersteller belegen diese Bedeutung. Mercedes-Benz führt B008213 als Unterbrechung an der Zündpille des Beifahrer-Gurtkraftbegrenzers (A-Klasse, CLA, GLB). Fords Sonder-Servicemeldung 51998 nennt Escape, Corsair, Bronco Sport und Maverick des Modelljahrs 2023, die B0082:1A wegen des Beifahrer-Gurtaufrollers am Stecker C303B ablegen; zeigt sich dort ein Verbindungsfehler, wird Aufroller samt Straffer vor jeder Kabelreparatur getauscht. Patente von Autoliv zeigen, warum Aufroller und Begrenzer zusammengehören: Das Gas des Straffers kann die höhere Begrenzungsstufe wählen. Bei GM Global A (Saab 9-4X) steht B0082 dagegen für den Gurtwarnsensor im Beifahrersitz. Die Airbag-Leuchte bleibt an."
  affected_components:
    - passenger_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: retractor_connector_c303b
      likelihood: high
      label:
        en: Poor connection at the passenger retractor plug (Ford C303B, SSM 51998)
        de: Schlechte Verbindung am Stecker des Beifahrer-Aufrollers (Ford C303B, SSM 51998)
    - id: module_connector_resistance
      likelihood: medium
      label:
        en: Raised resistance at the airbag module connector (Mercedes LI54.21-P-070658)
        de: Erhöhter Widerstand am Stecker des Airbag-Steuergeräts (Mercedes LI54.21-P-070658)
    - id: retractor_assembly_fault
      likelihood: low
      label:
        en: Internal fault of the passenger retractor and limiter assembly
        de: Interner Fehler der Beifahrer-Aufrollereinheit mit Kraftbegrenzer
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger belt cannot switch its force limiting level in a crash
      de: Beifahrergurt kann die Stufe der Kraftbegrenzung bei einem Unfall nicht umschalten
    - en: "Safety note: pyrotechnic retractor at the passenger B-pillar; work only de-energised (battery off, wait time) at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnischer Aufroller an der rechten B-Säule; nur spannungsfrei (Batterie ab, Wartezeit) in einer Fachwerkstatt bearbeiten"
