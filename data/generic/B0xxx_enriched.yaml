- code: B0060
  category: body
  title:
    en: Driver Seat Belt Tension Sensor
    de: Gurtkraftsensor Fahrer
  description:
    en: B0060 refers to a belt tension sensor in the driver's belt, a force gauge usually bolted to the lower anchor with the webbing running through it. In Delphi's design a spring-loaded slider moves against the belt pull and a Hall element between two magnets turns the travel into a voltage; the springs give way at roughly 5 to 15 lb. CTS, which calls itself the market leader, builds such sensors in several mounting styles. A second Delphi patent has the sensor report its value in 3-lb steps over a two-wire line and flag readings outside the valid band as a high or low fault. Tension sensing serves mainly the passenger seat; a driver-side unit is rare. No carmaker documents B0060 publicly; Saab's older airbag modules do not list it. Airbag lamp on.
    de: B0060 betrifft einen Gurtkraftsensor im Fahrergurt – ein Kraftmesser, meist am unteren Gurtbeschlag verschraubt, durch den das Gurtband läuft. Bei Delphi bewegt sich ein federbelasteter Schieber gegen den Gurtzug, und ein Hallelement zwischen zwei Magneten macht aus dem Weg eine Spannung; die Federn geben bei etwa 5 bis 15 lb nach. CTS, nach eigener Angabe Marktführer, baut solche Sensoren in verschiedenen Einbauformen. Ein zweites Delphi-Patent lässt den Sensor seinen Wert in 3-lb-Stufen über eine Zweidrahtleitung melden und Werte außerhalb des gültigen Bands als Fehler hoch oder niedrig kennzeichnen. Die Gurtkraftmessung dient vor allem dem Beifahrersitz; am Fahrerplatz ist sie selten. Kein Hersteller dokumentiert B0060 öffentlich; die älteren Saab-Airbagsteuergeräte führen ihn nicht. Airbag-Leuchte an.
  affected_components:
    - seat_belt_tension_sensor
    - srs_seat_wiring
    - srs_control_module
  common_causes:
