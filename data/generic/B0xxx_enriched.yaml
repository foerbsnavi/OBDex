        de: Stecker des sitzintegrierten Mittelaufrollers nach Ausbau der hinteren Bank nicht gesteckt
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Restraint module coded for a three-seat third row on a two-seat vehicle
        de: Rückhaltesteuergerät auf eine Dreier-Bank in Reihe drei codiert, obwohl nur zwei Sitze verbaut sind
