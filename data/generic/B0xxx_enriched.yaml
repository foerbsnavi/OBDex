- code: B00CB
  category: body
  title:
    en: Passenger Seat Occupant Position Sensor E
    de: Beifahrersitz Insassenpositionssensor E
  description:
    en: B00CB is the fifth and last passenger seat occupant position sensor. No carmaker publishes it. Position alone is not always enough; an early patent of Automotive Technologies International, first filed in 1992, also wants the speed at which the occupant approaches the bag. It uses ultrasound bursts near 50 kHz, taking distance from the echo time and speed from the Doppler shift, or modulated infrared and radar, mounted in the headliner, on the mirror or on the airbag cover. In a 30 mph barrier crash it allows only about 8 ms of sensing for someone 9 inches away but 57 ms at 24 inches. FMVSS 208 lets the maker define the suppression zone that such sensors watch. Whether E denotes a velocity or a further distance sensor is not documented. B00CB lights the airbag lamp.
    de: B00CB ist der fünfte und letzte Insassenpositionssensor des Beifahrersitzes. Kein Hersteller veröffentlicht ihn. Die Lage allein genügt nicht immer; ein Patent von Automotive Technologies International, zuerst 1992 eingereicht, will auch wissen, wie schnell sich der Insasse dem Airbag nähert. Es nutzt Ultraschallimpulse um 50 kHz, gewinnt den Abstand aus der Echolaufzeit und die Geschwindigkeit aus der Dopplerverschiebung, oder moduliertes Infrarot und Radar, montiert im Dachhimmel, am Spiegel oder auf der Airbagabdeckung. Bei einem Barrierecrash mit 30 mph bleiben für jemanden in 9 Zoll Abstand nur etwa 8 ms zum Messen, bei 24 Zoll 57 ms. FMVSS 208 lässt den Hersteller die Abschaltzone festlegen, die solche Sensoren überwachen. Ob E Geschwindigkeit oder einen weiteren Abstand misst, ist offen. B00CB schaltet die Airbag-Leuchte ein.
  affected_components:
    - passenger_occupant_position_sensor_e
    - srs_roof_wiring
    - occupant_position_module
  common_causes:
