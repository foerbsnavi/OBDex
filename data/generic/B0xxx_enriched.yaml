- code: B0091
  category: body
  title:
    en: Left Side Restraints Sensor 1
    de: Seitencrashsensor links 1
  description:
    en: "B0091 covers the first left-side crash sensor, which Mitsubishi places in the front door and lists as DOOR SATEL SENS LH with the J2012 title in brackets. The airbag unit checks it with the ignition on and stores a subtype after a two-second delay: -11 for a short to ground, -55 when the configuration held in the unit does not fit the vehicle, -81 for a communication fault, plus further bytes. Door satellites of this kind are usually pressure sensors: Bosch explains that the sealed door cavity acts as the sensing volume, so a crush raises pressure and the module can decide within about 5 ms. Continental sells a pressure satellite for the same task. With B0091 set, the airbag lamp lights and left side impact sensing may be weakened."
    de: "B0091 betrifft den ersten linken Seitencrashsensor, den Mitsubishi in die Vordertür setzt und als DOOR SATEL SENS LH mit dem J2012-Titel in Klammern führt. Das Airbag-Steuergerät prüft ihn bei eingeschalteter Zündung und speichert nach zwei Sekunden Verzögerung einen Untertyp: -11 bei Masseschluss, -55, wenn die im Gerät abgelegte Konfiguration nicht zum Fahrzeug passt, -81 bei Kommunikationsstörung, dazu weitere Bytes. Solche Türsatelliten messen meist Druck: Bosch erklärt, dass der abgeschlossene Türhohlraum als Messvolumen dient, eine Verformung also den Druck hebt und das Steuergerät binnen etwa 5 ms entscheiden kann. Continental bietet einen Drucksatelliten für dieselbe Aufgabe an. Mit gesetztem B0091 leuchtet die Airbag-Lampe, die Seitencrash-Erkennung links kann geschwächt sein."
  affected_components:
    - left_side_impact_sensor_1
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: door_harness_fault
      likelihood: high
      label:
        en: Short or poor contact in the door harness or connector to the sensor
        de: Kurzschluss oder schlechter Kontakt im Türkabelbaum oder Sensorstecker
    - id: door_sensor_fault
      likelihood: medium
      label:
        en: Internal fault of the front door satellite sensor
        de: Interner Fehler des Satellitensensors in der Vordertür
    - id: module_configuration
      likelihood: medium
      label:
        en: Airbag unit configuration not matching the vehicle (Mitsubishi subtype -55)
        de: Konfiguration des Airbag-Steuergeräts passt nicht zum Fahrzeug (Mitsubishi Untertyp -55)
    - id: airbag_unit_fault
      likelihood: low
      label:
        en: Internal fault of the airbag diagnosis unit
        de: Interner Fehler des Airbag-Steuergeräts
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Side and curtain airbags on the left may deploy late or not in a side impact
      de: Seiten- und Kopfairbags links lösen bei einem Seitenaufprall womöglich spät oder nicht aus
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time before door work, then have it checked at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten in der Tür Batterie abklemmen und Wartezeit einhalten, dann in einer Fachwerkstatt prüfen lassen"
