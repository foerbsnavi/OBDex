  description:
    en: "B0058 is the J2012 code for the buckle sensor at the right seat of the third row. The sensor reports a latched or free belt to the module that runs the rear belt display, which FMVSS 208 S7.5(c) makes mandatory for every rear seat from September 2028. Fold-flat third rows and access from the right-hand sliding door put the lead under strain. No carmaker documents B0058 publicly with this meaning. Older GM modules again differ: on the 2006 Saab 9-5 B0058 means an open passenger pretensioner loop, with more than 4.5 ± 0.2 ohms for 2 seconds, while the Saab 9-3 also knows a high-resistance variant. GM bulletin 14609 for 2004-09 Colorado and Canyon extended cabs covers B0058 among the pretensioner codes caused by broken rear door wires."
    de: "B0058 ist der J2012-Code für den Gurtschlosssensor am rechten Sitz der dritten Reihe. Der Sensor meldet einen eingerasteten oder freien Gurt an das Steuergerät, das die Gurtanzeige hinten führt – nach FMVSS 208 S7.5(c) ab September 2028 für jeden Rücksitz Pflicht. Klappbare dritte Reihen und der Einstieg über die rechte Schiebetür setzen die Leitung unter Belastung. Mit dieser Bedeutung dokumentiert kein Hersteller B0058 öffentlich. Ältere GM-Steuergeräte weichen auch hier ab: Beim Saab 9-5 (2006) steht B0058 für einen unterbrochenen Zündkreis des Beifahrer-Gurtstraffers, über 4,5 Ohm (±0,2) für 2 Sekunden, der Saab 9-3 kennt zusätzlich eine Variante mit zu hohem Widerstand. GM-Bulletin 14609 zu Colorado und Canyon Extended Cab 2004–09 führt B0058 unter den Straffercodes, die gebrochene Leitungen in der hinteren Tür auslösen."
