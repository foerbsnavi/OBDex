- code: B0073
  category: body
  title:
    en: Second Row Left Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer zweite Reihe links Auslösesteuerung
  description:
    en: "B0073 concerns the pretensioner at the left outer seat of the second row, normally built into the rear retractor. Mitsubishi documents it under exactly this name: with the ignition on, its airbag sensor unit stores B0073 with byte 11, 12, 13, 1A or 1B for a short to ground, a short to power, an open, lines shorted to each other or excessive resistance, and with byte 55 when the stored configuration does not match the vehicle; each fault must last 2 seconds. Toyota's Tundra bulletin T-SB-0057-22 lists B007311 and B007312. IIHS frontal tests with a dummy in the left rear seat show why such units are now spreading to the back row. GM uses the number differently: bulletin 22-NA-170 for the Equinox and Terrain links B0073 to water in the right front seat harness connector X320."
    de: "B0073 betrifft den Gurtstraffer am linken Außenplatz der zweiten Reihe, meist im hinteren Gurtaufroller untergebracht. Mitsubishi dokumentiert ihn genau unter diesem Namen: Bei eingeschalteter Zündung legt das Airbagsteuergerät B0073 mit Byte 11, 12, 13, 1A oder 1B ab – Masseschluss, Schluss nach Plus, Unterbrechung, Schluss der Leitungen untereinander oder zu hoher Widerstand –, mit Byte 55, wenn die gespeicherte Konfiguration nicht zum Fahrzeug passt; jeder Fehler muss 2 Sekunden anstehen. Toyota nennt im Tundra-Bulletin T-SB-0057-22 B007311 und B007312. Crashtests des IIHS mit einem Dummy hinten links zeigen, warum solche Straffer zunehmend auch hinten verbaut werden. GM belegt die Nummer anders: Bulletin 22-NA-170 zu Equinox und Terrain verknüpft B0073 mit Wasser im Stecker X320 des rechten Vordersitz-Kabelbaums."
  affected_components:
    - second_row_left_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: rear_retractor_connector
      likelihood: high
      label:
        en: Plug at the left rear retractor loose or damaged after trim or seat removal
        de: Stecker am linken hinteren Aufroller nach Verkleidungs- oder Sitzausbau locker oder beschädigt
    - id: rear_harness_short
      likelihood: medium
      label:
        en: Harness to the left rear pretensioner shorted to ground or power
        de: Leitung zum linken hinteren Straffer mit Masse- oder Plusschluss
    - id: configuration_mismatch
      likelihood: low
      label:
        en: Airbag module configuration does not match the fitted rear pretensioners (Mitsubishi byte 55)
        de: Codierung des Airbagsteuergeräts passt nicht zu den verbauten hinteren Straffern (Mitsubishi Byte 55)
    - id: pretensioner_internal
      likelihood: low
      label:
        en: Internal fault of the left rear pretensioner or of the airbag module
        de: Interner Fehler des linken hinteren Straffers oder des Airbagsteuergeräts
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left rear occupant gets no belt pretensioning in a crash
      de: Insasse hinten links erhält bei einem Unfall keine Gurtstraffung
    - en: "Safety note: pyrotechnic part in the rear retractor; work only with the system de-energised and preferably at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnisches Bauteil im hinteren Aufroller; nur im spannungsfreien Zustand und am besten in der Fachwerkstatt arbeiten"
  repair:
    difficulty: shop_only
