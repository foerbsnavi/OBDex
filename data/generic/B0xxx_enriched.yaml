- code: B00B4
  category: body
  title:
    en: Driver Seat Occupant Classification Sensor E
    de: Fahrersitz Insassenklassifizierungssensor E
  description:
    en: "B00B4 is the fifth and last driver seat classification sensor. No carmaker documents the code publicly. A fifth input need not weigh anything: IEE's BodySense uses capacitive sensing in the seat surface, placed over the heater mat, under the cover and on top of the foam, and tells a child restraint from a seated person whatever the belt tension, posture, weight or height; IEE says the vehicle maker does not have to calibrate it and that it serves the FMVSS 208 advanced airbag rules. Other designs add a belt tension sensor so that a tightly cinched child seat is not taken for a heavy adult. Whether E stands for such a field sensor, a mat or another load cell is the maker's decision. When B00B4 is stored, the airbag lamp is lit and that input is ignored."
    de: "B00B4 ist der fünfte und letzte Klassifizierungssensor des Fahrersitzes. Kein Hersteller dokumentiert den Code öffentlich. Ein fünfter Eingang muss gar nichts wiegen: IEEs BodySense misst kapazitiv in der Sitzfläche, über der Sitzheizung zwischen Schaum und Bezug, und unterscheidet Kinderrückhaltesystem und sitzende Person unabhängig von Gurtspannung, Haltung, Gewicht oder Größe; laut IEE muss der Fahrzeughersteller nichts kalibrieren, und das System dient den FMVSS-208-Regeln für adaptive Airbags. Andere Auslegungen ergänzen einen Gurtkraftsensor, damit ein stramm festgezurrter Kindersitz nicht als schwerer Erwachsener gilt. Ob E einen solchen Feldsensor, eine Matte oder eine weitere Lastzelle meint, entscheidet der Hersteller. Ist B00B4 gespeichert, leuchtet die Airbag-Lampe, und der Eingang bleibt unberücksichtigt."
  affected_components:
    - driver_classification_sensor_e
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Open or poor contact in the seat harness or plug to input E
        de: Unterbrechung oder schlechter Kontakt im Sitzkabelbaum bzw. Stecker zu Eingang E
    - id: seat_heater_interaction
      likelihood: medium
      label:
        en: Damaged seat heater or trim where the capacitive electrode shares its layer
        de: Beschädigte Sitzheizung oder Bezug, wo die kapazitive Elektrode dieselbe Lage nutzt
