- code: B00B9
  category: body
  title:
    en: Driver Seat Occupant Position Sensor C
    de: Fahrersitz Insassenpositionssensor C
  description:
    en: "B00B9 is the third occupant position sensor of the driver seat. No carmaker publishes it. A third input could judge posture from the seat back: a patent now held by Joyson places two electric field electrodes under the seat-back cover, one across the upper middle and inboard side and one along the outboard edge, and combines them with seat weight to block the side airbag when a small occupant leans into its path. Honda applied the same idea on the passenger side with OPDS sensors in the seat-back, which must be initialised after the cover or sensor is replaced and can be upset by a damp seat. Whether a driver seat uses the letter C for such an electrode is not documented. A stored B00B9 brings on the airbag lamp."
    de: "B00B9 ist der dritte Insassenpositionssensor des Fahrersitzes. Kein Hersteller veröffentlicht ihn. Ein dritter Eingang könnte die Haltung über die Lehne beurteilen: Ein heute bei Joyson liegendes Patent setzt zwei Feldelektroden unter den Lehnenbezug, eine quer über die obere Mitte und die Innenseite, eine entlang der Außenkante, und verknüpft sie mit dem Sitzgewicht, um den Seitenairbag zu sperren, wenn sich ein kleiner Insasse in dessen Weg lehnt. Honda nutzte dasselbe Prinzip auf der Beifahrerseite mit OPDS-Sensoren in der Lehne; sie müssen nach Bezugs- oder Sensortausch initialisiert werden, und ein feuchter Sitz kann sie stören. Ob ein Fahrersitz den Buchstaben C für eine solche Elektrode nutzt, ist nicht dokumentiert. Ein gespeicherter B00B9 schaltet die Airbag-Leuchte ein."
  affected_components:
    - driver_occupant_position_sensor_c
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: not_initialised
      likelihood: high
      label:
        en: Seat-back cover or sensor replaced without initialisation
        de: Lehnenbezug oder Sensor ohne Initialisierung getauscht
    - id: seat_harness_connector
      likelihood: medium
