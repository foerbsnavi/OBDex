- code: B011E
  category: body
  title:
    en: Fluid Reservoir Level Sensor C
    de: Flüssigkeitsbehälter Füllstandssensor C
  description:
    en: B011E covers level sensor C. Vehicles that steer by camera and lidar need their own cleaning supply, and there the level reading becomes an operating condition. Uber's application US20180015907A1 shows a sensor-cleaning reservoir with a dedicated liquid level sensor reporting to the vehicle computer; below a threshold the computer lights an indicator or tells a remote operator to refill. The related patent US10220817B2 adds a compressor and solenoid valves and handles pressure and fluid readings beyond their limits in the same way. Whether reservoir C is such a cleaning tank is stated nowhere, and B011E appears in no public manufacturer document. A fault leaves the system unsure whether it can still clean its sensors.
    de: B011E betrifft Füllstandssensor C. Fahrzeuge, die sich auf Kamera und Lidar stützen, brauchen einen eigenen Reinigungsvorrat, und dort wird der Füllstand zur Betriebsbedingung. Ubers Anmeldung US20180015907A1 zeigt einen Behälter für die Sensorreinigung mit eigenem Füllstandsgeber, der an den Fahrzeugrechner meldet; unter einer Schwelle schaltet der Rechner eine Anzeige ein oder bittet einen Fernbetreuer ums Nachfüllen. Das verwandte Patent US10220817B2 ergänzt Kompressor und Magnetventile und behandelt Druck- und Füllwerte außerhalb ihrer Grenzen auf dieselbe Weise. Ob Behälter C ein solcher Reinigungstank ist, steht nirgends; B011E taucht in keinem öffentlichen Herstellerdokument auf. Bei einem Fehler weiß das System nicht mehr sicher, ob es seine Sensoren noch reinigen kann.
  affected_components:
    - fluid_reservoir_level_sensor_c
    - sensor_wiring
  common_causes:
    - id: level_sensor_c_defective
      likelihood: high
      label:
        en: Level sensor C defective or signal implausible
        de: Füllstandsgeber C defekt oder Signal unplausibel
    - id: wiring_c_damaged
      likelihood: medium
