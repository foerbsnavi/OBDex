    - https://saabwisonline.com/9-3-9440/2007/dtcs/acm/
    - https://static.nhtsa.gov/odi/tsbs/2020/MC-10177544-9999.pdf
  reviewed: '2026-11-06'

- code: B0079
  category: body
  title:
    en: Driver Seat Belt Pretensioner B Deployment Control
    de: Fahrer-Gurtstraffer B Auslösesteuerung
  description:
    en: "B0079 marks the driver's second (B) pretensioner. Mercedes-Benz uses the code in exactly this way: in LI54.21-P-070658, valid for A-Class, CLA and GLB, B007913 is an open circuit in the squib of the belt end fitting tensioner on the driver's side, while the retractor of the same seat appears as B007E. An end fitting or anchor pretensioner pulls on the lower belt anchor next to the door side of the seat and so tightens the lap section; GM's restraint guide and a Hyundai-Kia patent describe this layout. Older Saab models give the number another meaning: the 2006 Saab 9-5 stores B0079 when an incorrect driver-side side-impact sensor is installed. A stored B0079 lights the airbag lamp and means the driver's lap tensioner may not fire."
    de: "B0079 kennzeichnet den zweiten Gurtstraffer (Stufe B) am Fahrersitz. Mercedes-Benz nutzt den Code genau so: In LI54.21-P-070658 zu A-Klasse, CLA und GLB ist B007913 eine Unterbrechung an der Zündpille des Endbeschlagstraffers auf der Fahrerseite; der Aufrollerstraffer desselben Sitzes erscheint als B007E. Ein Endbeschlag- oder Verankerungsstraffer zieht am unteren Gurtanker an der Sitzaußenseite und strafft so den Beckengurt – beschrieben im Rettungsleitfaden von GM und in einem Hyundai-Kia-Patent. Ältere Saab belegen die Nummer anders: Der Saab 9-5 (2006) speichert B0079, wenn ein falscher Seitenaufprallsensor auf der Fahrerseite eingebaut ist. Mit gespeichertem B0079 leuchtet die Airbag-Lampe, und der Beckengurtstraffer des Fahrers zündet womöglich nicht."
  affected_components:
    - driver_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: end_fitting_connector
      likelihood: high
      label:
        en: Plug at the driver's belt end fitting tensioner beside the seat loose or corroded
        de: Stecker am Endbeschlagstraffer neben dem Fahrersitz locker oder korrodiert
    - id: seat_rail_harness
      likelihood: medium
      label:
        en: Lead to the end fitting tensioner pinched by the seat rail
        de: Leitung zum Endbeschlagstraffer von der Sitzschiene eingeklemmt
    - id: saab_wrong_sensor
      likelihood: low
      label:
        en: On a 2006 Saab 9-5, wrong side-impact sensor fitted (older GM meaning)
        de: Beim Saab 9-5 (2006) falscher Seitenaufprallsensor verbaut (ältere GM-Belegung)
    - id: squib_internal
      likelihood: low
      label:
        en: Internal fault of the end fitting tensioner squib
        de: Interner Fehler der Zündpille im Endbeschlagstraffer
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver's lap belt section not tightened in a crash
