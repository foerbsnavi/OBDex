- code: B0022
  category: body
  title:
    en: Left Curtain Deployment Control 2
    de: Kopfairbag links Auslösesteuerung 2
  description:
    en: "B0022 belongs to a second firing loop for the left curtain airbag. Mercedes-Benz shows what that means in practice: on the A-Class, CLA and GLB, B002213 is an open squib in the left rear window bag, the curtain section for the rear seats, while B0021 serves the front one (LI54.21-P-070658, version 1 of 2019 and version 4 of 2020). Cars with a single curtain inflator never set it. General Motors has older meanings for the number: the 2006 Saab 9-5 used it for driver frontal stage 1 resistance below 2.0 ohms, and Global A modules for the passenger belt retractor pretensioner, as on the 2009-11 Impala (PIC5396A) or the Saab 9-4X. The module and descriptor shown by the scan tool decide which part is meant. Airbag lamp on."
    de: "B0022 gehört zu einem zweiten Zündkreis des linken Kopfairbags. Wie das aussieht, zeigt Mercedes-Benz: Bei A-Klasse, CLA und GLB meldet B002213 eine offene Zündpille im linken hinteren Windowbag, also im Vorhangteil für die Rücksitze, während B0021 den vorderen Teil betrifft (LI54.21-P-070658, Fassung 1 von 2019 und Fassung 4 von 2020). Fahrzeuge mit nur einem Gasgenerator im Vorhang setzen den Code nie. Bei General Motors hat die Nummer ältere Bedeutungen: Der Saab 9-5 von 2006 meldet damit Widerstand unter 2,0 Ohm im Fahrer-Frontairbag Stufe 1, Global-A-Steuergeräte den Gurtstraffer am Beifahrer-Aufrollautomaten, etwa beim Impala 2009–11 (PIC5396A) oder Saab 9-4X. Welches Teil gemeint ist, zeigen Steuergerät und Klartext im Tester. Airbag-Leuchte an."
  affected_components:
    - left_curtain_airbag
    - srs_roof_wiring
    - srs_control_module
  common_causes:
    - id: connector_resistance
      likelihood: high
      label:
        en: Raised contact resistance at the restraint module connector (Mercedes LI54.21-P-070658)
        de: Erhöhter Übergangswiderstand am Steuergerätestecker (Mercedes LI54.21-P-070658)
    - id: rear_curtain_wiring
      likelihood: medium
      label:
        en: Damaged lead to the rear curtain section at the C-pillar or roof rail
        de: Beschädigte Leitung zum hinteren Vorhangteil an C-Säule oder Dachrahmen
    - id: curtain_module_fault
      likelihood: low
      label:
        en: Internal fault in the rear left curtain airbag module
        de: Innerer Fehler im hinteren linken Kopfairbagmodul
    - id: srs_module_fault
      likelihood: low
      label:
        en: Fault or unsuitable software in the restraint control module
        de: Fehler oder unpassende Software im Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Head protection for the left rear seat may be missing
      de: Kopfschutz für den linken Rücksitzplatz fehlt womöglich
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
