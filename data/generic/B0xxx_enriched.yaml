- code: B00B0
  category: body
  title:
    en: Driver Seat Occupant Classification Sensor A
    de: Fahrersitz Insassenklassifizierungssensor A
  description:
    en: "B00B0 is the first of five classification inputs on the driver seat. No carmaker publishes this code, and J2012 leaves it to the maker which sensor the letter A means. Classification normally sits in the passenger seat; a Bosch patent notes that it can be omitted on the driver side, on the assumption that drivers are adults, or fitted there as well. One sensor type that could fill such a slot is a switch mat under the cushion: Autoliv patented a mat with 28 dome switches grouped in five zones, chosen from a 2,016-cell test mat loaded with FMVSS 208 dummies and child seats at several back angles. If B00B0 is stored, the restraint module no longer trusts that input, so adaptive driver airbag staging may be lost, and the airbag lamp is on."
    de: "B00B0 ist der erste von fünf Klassifizierungseingängen am Fahrersitz. Kein Hersteller veröffentlicht diesen Code, und J2012 überlässt dem Hersteller, welchen Sensor der Buchstabe A meint. Üblich ist die Klassifizierung im Beifahrersitz; ein Bosch-Patent hält fest, dass sie auf der Fahrerseite entfallen kann, weil man dort von Erwachsenen ausgeht, oder ebenfalls verbaut wird. Ein Sensortyp für einen solchen Platz ist eine Schaltmatte unter dem Polster: Autoliv hat eine Matte mit 28 Kuppelschaltern in fünf Zonen patentiert, ausgewählt aus einer Prüfmatte mit 2.016 Zellen, die mit FMVSS-208-Dummys und Kindersitzen bei mehreren Lehnenwinkeln belastet wurde. Ist B00B0 gespeichert, verwirft das Rückhaltesteuergerät diesen Eingang, die angepasste Stufung des Fahrerairbags kann entfallen, und die Airbag-Leuchte brennt."
