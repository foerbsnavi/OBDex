      de: Airbag-Warnleuchte an
    - en: Right third-row belt cannot change its limiting level
      de: Rechter Gurt der dritten Reihe kann die Begrenzungsstufe nicht wechseln
    - en: "Safety note: pyrotechnic restraint parts; work only de-energised at a specialist workshop"
      de: "Sicherheitshinweis: pyrotechnische Rückhalteteile; nur spannungsfrei in einer Fachwerkstatt arbeiten"
