- code: B010E
  category: body
  title:
    en: Camera Washer Actuator E
    de: Kamera-Wascher-Aktuator E
  description:
    en: "B010E names actuator E, which may be a dedicated pump rather than a valve. Audi's TSB 2073568/1 (2024) for e-tron, e-tron S and Q8/SQ8 e-tron models reports rear camera washer pressure too low to clean the lens: the mono pump could not build enough pressure, and production moved to a dual pump (1K6 955 651) whose spare outlet is plugged. Before swapping it, technicians rule out low fluid, a clogged pump filter, low supply voltage and kinked lines. AUMOVIO lists its washer pumps with one or two outlets for 2.0 to 4.0 bar. A pump drawing no current or too much is the kind of fault a module can flag; whether any maker calls that pump E is not published, and no manufacturer documents B010E."
    de: "B010E bezeichnet Aktor E, der auch eine eigene Pumpe statt eines Ventils sein kann. Audis TSB 2073568/1 (2024) zu e-tron, e-tron S und Q8/SQ8 e-tron meldet zu wenig Druck an der Heckkameradüse, um die Linse zu reinigen: Die Einfachpumpe brachte nicht genug Druck, in der Fertigung kam eine Doppelpumpe (1K6 955 651), deren freier Ausgang verschlossen wird. Vor dem Tausch schließt die Werkstatt zu wenig Flüssigkeit, ein verstopftes Pumpensieb, zu niedrige Bordspannung und geknickte Leitungen aus. AUMOVIO führt seine Waschpumpen mit einem oder zwei Ausgängen für 2,0 bis 4,0 bar. Eine Pumpe ohne oder mit zu hoher Stromaufnahme ist die Art Fehler, die ein Steuergerät erkennen kann; ob ein Hersteller diese Pumpe E nennt, bleibt offen; B010E belegt keiner öffentlich."
  affected_components:
    - camera_washer_actuator_e
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: pump_motor_e_worn
      likelihood: high
      label:
        en: Camera washer pump motor E worn, seized or open
        de: Motor der Kamerawaschpumpe E verschlissen, festgegangen oder unterbrochen
    - id: low_supply_voltage
      likelihood: medium
      label:
        en: Low supply voltage or poor ground at the pump
        de: Zu niedrige Versorgungsspannung oder schlechte Masse an der Pumpe
    - id: pump_filter_clogged
      likelihood: low
      label:
        en: Clogged inlet filter making the pump labour and draw high current
        de: Verstopftes Ansaugsieb lässt die Pumpe schwer laufen und viel Strom ziehen
  symptoms:
