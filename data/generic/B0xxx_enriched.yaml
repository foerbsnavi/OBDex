- code: B0104
  category: body
  title:
    en: Sensor Cleaning Air Blower Actuator A Control Relay
    de: Sensorreinigung Luftgebläse-Aktuator A Steuerrelais
  description:
    en: "B0104 points at the relay that switches power to blower A. A fan motor draws more current than a module output can carry, so a relay is a natural choice: the module energises the coil (terminals 85/86 in HELLA's scheme) and the contact (30/87) feeds the motor. HELLA's relay brochure explains that coils may carry a diode or resistor against switch-off spikes and that relays are checked for coil resistance and contact voltage drop. Faults here are an open or shorted coil, welded or burnt contacts, or a missing feed. Ford's US12115948B2 places the blower on the sensor bracket, and the Ford tiara uses that air to shield lenses from insects, as eeNews reports. No carmaker publishes B0104; the B-side relay is B0105."
    de: "B0104 verweist auf das Relais, das Gebläse A mit Strom versorgt. Ein Lüftermotor zieht mehr Strom, als ein Modulausgang tragen kann, deshalb liegt ein Relais nahe: Das Modul bestromt die Spule (Klemmen 85/86 nach HELLA-Schema), der Kontakt (30/87) speist den Motor. HELLAs Relais-Broschüre erklärt, dass Spulen eine Diode oder einen Widerstand gegen Abschaltspitzen tragen können und dass Relais auf Spulenwiderstand und Spannungsfall am Kontakt geprüft werden. Fehlerbilder sind eine offene oder kurzgeschlossene Spule, verschweißte oder verbrannte Kontakte oder eine fehlende Versorgung. Fords US12115948B2 setzt das Gebläse auf den Sensorhalter, und die Ford-Tiara nutzt diese Luft laut eeNews als Schutz der Linsen vor Insekten. Kein Autohersteller veröffentlicht B0104; das Relais der B-Seite ist B0105."
  affected_components:
    - sensor_cleaning_air_blower_relay_a
    - relay_control_circuit
    - sensor_cleaning_air_blower_a
  common_causes:
    - id: relay_contacts_burnt
      likelihood: high
      label:
        en: Burnt or welded contacts in the blower A relay
        de: Verbrannte oder verschweißte Kontakte im Relais von Gebläse A
    - id: relay_coil_open
      likelihood: medium
      label:
        en: Relay coil open or its control wire interrupted
        de: Relaisspule unterbrochen oder deren Ansteuerleitung getrennt
    - id: relay_feed_fuse
      likelihood: medium
      label:
        en: Blown fuse or loose socket on the relay supply side
        de: Durchgebrannte Sicherung oder lockerer Sockel auf der Versorgungsseite des Relais
  symptoms:
    - en: Blower A dead, or running without command if contacts are welded
      de: Gebläse A ohne Funktion, oder es läuft ohne Befehl bei verschweißten Kontakten
    - en: No relay click when cleaning is requested
      de: Kein Relaisklicken bei Reinigungsanforderung
    - en: Sensor cleaning warning with possible loss of assistance functions
      de: Warnung zur Sensorreinigung, Assistenzfunktionen können entfallen
  repair:
    difficulty: easy
    diy_possible: true
    estimated_cost_eur: [20, 200]
    estimated_hours: [0.2, 1]
  flags:
    mil: false
    emissions_relevant: false
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [B0100, B0102, B0105]
  sources:
