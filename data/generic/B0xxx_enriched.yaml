- code: B0077
  category: body
  title:
    en: Third Row Center Seat Belt Pretensioner Deployment Control
    de: Gurtstraffer dritte Reihe Mitte Auslösesteuerung
  description:
    en: B0077 stands for the pretensioner at the middle seat of the third row. Hardly any vehicle fits one, and no manufacturer documents B0077 with this J2012 meaning; Mercedes, which equips some models with third-row tensioning retractors, lists only a left and a right unit (B00E7/B00E6). The number is met more often in older GM-built Saabs. The 2006 Saab 9-5 stores B0077 when the airbag module cannot communicate with the driver-side side-impact sensor because of an open or a short, and Saab 9-3 modules of 2003 and 2007 use it for the driver-side B-pillar sensor. On such cars the fault lies in the door or pillar sensor, not in a rear belt. For a genuine third-row centre pretensioner, a stored code means a lit airbag lamp and a disabled unit.
    de: "B0077 steht für den Gurtstraffer am Mittelplatz der dritten Reihe. Kaum ein Fahrzeug hat einen, und kein Hersteller dokumentiert B0077 mit dieser J2012-Bedeutung; Mercedes, das manche Modelle mit Aufrollerstraffern in der dritten Reihe ausstattet, führt dort nur einen linken und einen rechten (B00E7/B00E6). Häufiger begegnet die Nummer bei älteren Saab aus GM-Zeit: Der Saab 9-5 von 2006 speichert B0077, wenn das Airbagsteuergerät wegen Unterbrechung oder Kurzschluss nicht mit dem Seitenaufprallsensor der Fahrerseite kommunizieren kann, und die Steuergeräte des Saab 9-3 (2003, 2007) nutzen sie für den B-Säulen-Sensor links. Dort liegt der Fehler also am Tür- bzw. Säulensensor, nicht an einem Gurt hinten. Bei einem echten Mittelstraffer der dritten Reihe bedeutet der Code: Airbag-Lampe an, Straffer außer Funktion."
  affected_components:
    - third_row_center_pretensioner
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: saab_side_sensor
      likelihood: high
      label:
        en: On older Saab 9-3/9-5, fault at the driver-side side-impact or B-pillar sensor (older GM meaning)
        de: Bei älteren Saab 9-3/9-5 Fehler am Seitenaufprall- bzw. B-Säulen-Sensor links (ältere GM-Belegung)
    - id: third_row_center_connector
      likelihood: medium
      label:
        en: Plug of the third-row centre pretensioner disturbed during seat folding or removal
        de: Stecker des mittleren Straffers der dritten Reihe beim Umklappen oder Ausbau gelöst
    - id: configuration_mismatch
      likelihood: low
      label:
        en: Airbag module coded for a centre pretensioner that is not installed
        de: Airbagsteuergerät auf einen nicht vorhandenen Mittelstraffer codiert
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On Saab, side airbag deployment on the driver side may be impaired
      de: Beim Saab ist die Auslösung der Seitenairbags auf der Fahrerseite womöglich beeinträchtigt
    - en: "Safety note: airbag sensors and pretensioners belong to the pyrotechnic restraint system; work only de-energised and at a specialist workshop"
      de: "Sicherheitshinweis: Airbagsensoren und Gurtstraffer gehören zum pyrotechnischen Rückhaltesystem; nur spannungsfrei und in einer Fachwerkstatt arbeiten"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 600]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
