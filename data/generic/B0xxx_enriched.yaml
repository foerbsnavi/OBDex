- code: B0086
  category: body
  title:
    en: Third Row Left Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer dritte Reihe links Auslösesteuerung
  description:
    en: "B0086 is reserved for a switchable force limiter at the left third-row seat. No manufacturer documents it, and an electrically fired limiter that far back is unusual. Delphi's rear-seat patent explains why: without airbags or weight sensing in rear rows, it picks the level from the length of webbing drawn out, about 4–6 kN for a large occupant or a child seat and 2–3 kN for a small occupant. NHTSA's 2013 study likewise counts load limiters as standard only at the front outer seats. On GM Global A cars (2011 Saab 9-4X) B0086 stands for the right front side impact sensor, watched for shorts and opens, too little current, internal errors, an incorrect part and corrupt messages, each needing ten seconds to set. Where a third-row limiter loop does exist, a fault lights the airbag lamp."
    de: "B0086 ist für einen umschaltbaren Kraftbegrenzer am linken Sitz der dritten Reihe reserviert. Kein Hersteller dokumentiert ihn, ein elektrisch gezündeter Begrenzer so weit hinten ist ungewöhnlich. Das Delphi-Patent für Rücksitze erklärt den Grund: Ohne Airbag und Gewichtserkennung in den hinteren Reihen wählt es die Stufe nach der Länge des ausgezogenen Gurtbands – etwa 4–6 kN für große Insassen oder einen Kindersitz, 2–3 kN für kleine. Auch die NHTSA-Studie von 2013 zählt Kraftbegrenzer nur an den äußeren Vordersitzen zum Standard. Im Saab 9-4X von 2011, einem Global-A-Modell, steht B0086 für den rechten vorderen Seitenaufprallsensor; Kurzschlüsse, Unterbrechung, Stromunterschreitung, Elektronikdefekt, Fehlbestückung und gestörte Botschaften müssen dafür zehn Sekunden anstehen. Wo ein solcher Kreis existiert, leuchtet die Airbag-Lampe."
  affected_components:
    - third_row_left_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_right_side_impact_sensor
      likelihood: high
      label:
        en: On GM vehicles, right front side impact sensor or wiring faulty (different meaning)
        de: Bei GM rechter vorderer Seitenaufprallsensor oder Leitung defekt (andere Bedeutung)
    - id: third_row_harness
      likelihood: medium
      label:
        en: Third-row harness stressed by folding or removing the seat
        de: Kabelbaum der dritten Reihe durch Umklappen oder Ausbau des Sitzes belastet
    - id: limiter_squib_fault
      likelihood: low
      label:
        en: Internal fault of the third-row limiter squib
        de: Interner Fehler der Zündpille am Begrenzer der dritten Reihe
  symptoms:
