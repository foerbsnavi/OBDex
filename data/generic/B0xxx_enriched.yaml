- code: B0007
  category: body
  title:
    en: Driver Frontal Deployment Loop Short to Battery
    de: Fahrer-Frontairbag Auslösekreis Kurzschluss nach Plus
  description:
    en: "Like B0006, this number is absent from the public J2012 lists. FCA uses B0007-11 on the 2025 Ram 1500 for the latch control of the right RamBox stowage lid, again a short to ground in the body control module and cured by the same flash 08-204-24; an airbag meaning is not documented anywhere. The title names a driver airbag loop shorted to battery voltage. Restraint modules treat that as a fault type of the stage code: GM sets B0012 01 or B0013 01 on the Saab 9-4X when the steering wheel airbag loop sits at supply voltage for two seconds. A short to positive is the more dangerous case because a further fault could energise the squib, so modules usually disable the affected stage and light the lamp. Confirm the storing module before any repair."
    de: "Wie B0006 fehlt auch diese Nummer in den öffentlichen J2012-Listen. FCA nutzt B0007-11 beim Ram 1500 (2025) für die Verriegelungsansteuerung des rechten RamBox-Staufachdeckels – ebenfalls ein Masseschluss im Karosseriesteuergerät, behoben mit demselben Flash 08-204-24; eine Airbag-Bedeutung ist nirgends belegt. Der Titel nennt einen Kurzschluss nach Plus im Zündkreis des Fahrer-Frontairbags. Airbagsteuergeräte führen das als Fehlerart am Stufen-Code: GM setzt beim Saab 9-4X B0012 01 oder B0013 01, wenn der Lenkradairbagkreis zwei Sekunden an Versorgungsspannung liegt. Plusschluss ist der heiklere Fall, weil ein zweiter Fehler die Zündpille bestromen könnte; Steuergeräte sperren dann meist die Stufe und schalten die Leuchte ein. Vor jeder Reparatur das speichernde Steuergerät feststellen."
  affected_components:
    - driver_airbag_module
    - srs_wiring
    - clock_spring
  common_causes:
    - id: body_module_latch_circuit
      likelihood: medium
      label:
        en: On Ram 1500 2025 the code belongs to the right stowage lid latch circuit of the body module
        de: Beim Ram 1500 (2025) gehört der Code zum Verriegelungskreis des rechten Staufachdeckels im Karosseriesteuergerät
    - id: squib_lead_short_to_supply
      likelihood: medium
      label:
        en: Squib lead touching a powered wire in the column or steering wheel harness
        de: Zündpillenleitung berührt eine spannungsführende Leitung im Lenksäulen- oder Lenkradkabelbaum
    - id: water_in_connector
      likelihood: low
      label:
        en: Moisture bridging pins in a connector of the airbag circuit
        de: Feuchtigkeit überbrückt Kontakte in einem Stecker des Airbagkreises
  symptoms:
