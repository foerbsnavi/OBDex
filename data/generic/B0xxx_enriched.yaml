- code: B0026
  category: body
  title:
    en: Left Side Deployment Stage 2 Loop Open
    de: Seitenairbag links Stufe 2 Auslösekreis unterbrochen
  description:
    en: "B0026 is missing from the public J2012 lists. General Motors documents it in older restraint modules with a meaning other than the title: on the 2006 Saab 9-5, B0026 is an open circuit in driver frontal stage 1, set when the measured resistance stays above 4.5 ohms, tolerance 0.2, for 2 seconds; the Saab 9-3 manuals add bytes for an open loop and too high resistance in the same driver circuit. GM bulletin 08-09-41-002H blames loose connector position locks for B0026 on 2005-14 models such as the Cobalt, Pontiac G5 and GMC Envoy. An open second stage of a left side airbag is not publicly documented under this code. If the driver loop is open, the steering wheel airbag may not fire. Airbag lamp on."
    de: "In den öffentlichen J2012-Listen fehlt B0026. General Motors belegt ihn in älteren Airbagsteuergeräten mit einer anderen Bedeutung als der Titel: Beim Saab 9-5 von 2006 ist B0026 eine Unterbrechung im Fahrer-Frontairbag Stufe 1, gesetzt, wenn der gemessene Widerstand 2 Sekunden lang über 4,5 Ohm (±0,2) liegt; die Saab-9-3-Handbücher ergänzen Bytes für offenen Kreis und zu hohen Widerstand im selben Fahrerkreis. Das GM-Bulletin 08-09-41-002H führt B0026 bei Modellen 2005–14 wie Cobalt, Pontiac G5 und GMC Envoy auf nicht vollständig verriegelte Steckersicherungen zurück. Eine offene zweite Stufe des linken Seitenairbags ist unter diesem Code nicht öffentlich dokumentiert. Ist der Fahrerkreis offen, zündet der Lenkradairbag womöglich nicht. Airbag-Leuchte an."
  affected_components:
    - driver_side_airbag
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: connector_lock_unseated
      likelihood: high
      label:
        en: Airbag connector or its position lock not fully seated (GM 08-09-41-002H)
        de: Airbagstecker oder Steckersicherung nicht vollständig eingerastet (GM 08-09-41-002H)
    - id: clock_spring_open
      likelihood: medium
      label:
        en: Broken track in the clock spring (driver loop on older GM/Saab)
        de: Gerissene Leiterbahn in der Wickelfeder (Fahrerkreis bei älteren GM/Saab)
    - id: squib_open
      likelihood: low
      label:
        en: Open squib inside the airbag module
        de: Unterbrochene Zündpille im Airbagmodul
  symptoms:
