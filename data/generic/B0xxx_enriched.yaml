- code: B00E5
  category: body
  title:
    en: Second Row Center Seat Belt Pretensioner C Deployment Control
    de: Gurtstraffer C zweite Reihe Mitte Auslösesteuerung
  description:
    en: "B00E5 covers a C-stage tensioner at the middle seat of row two. No manufacturer publishes it. Rear centre tensioners are scarce: Mercedes' 2017 GLS manual names tensioners only for the outer second-row belts, and the Mercedes bulletin that assigns B00E3 and B00E4 to the outer rear retractors has no centre entry. IIHS research on rear occupants (2020) states that belt countermeasures for the rear are available yet rarely fitted, so such slots often stay empty. If a vehicle does carry a centre retractor or buckle tensioner, the airbag module watches its squib like any other and sets B00E5 for an open, a short or a resistance drift; the warning lamp then comes on and that seat loses its tensioning."
    de: "B00E5 betrifft einen Straffer der Stufe C am Mittelplatz der zweiten Reihe. Kein Hersteller veröffentlicht den Code. Straffer hinten in der Mitte sind selten: Das GLS-Handbuch von Mercedes (2017) nennt Straffer in der zweiten Reihe nur für die äußeren Gurte, und das Mercedes-Bulletin, das B00E3 und B00E4 den äußeren Aufrollern zuordnet, kennt keinen Mittelplatz. Laut einer IIHS-Auswertung zu Fondinsassen (2020) gibt es Gurtmaßnahmen für hinten zwar, verbreitet sind sie aber nicht – daher bleiben solche Plätze oft leer. Hat ein Fahrzeug doch einen mittleren Aufroll- oder Schlossstraffer, überwacht das Airbag-Steuergerät dessen Zündpille wie jede andere und setzt B00E5 bei Unterbrechung, Kurzschluss oder Widerstandsdrift; dann geht die Warnleuchte an, der Platz wird nicht gestrafft."
  affected_components:
    - second_row_center_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: center_seat_connector
      likelihood: high
      label:
        en: Centre-seat tensioner plug under the rear bench not engaged
        de: Stecker des Mittelstraffers unter der Rückbank nicht eingerastet
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Module coded for a centre tensioner that the vehicle lacks
        de: Steuergerät auf einen Mittelstraffer codiert, den das Fahrzeug nicht hat
    - id: split_bench_harness
      likelihood: medium
      label:
        en: Lead damaged where it passes the split or folding rear bench hinge
        de: Leitung am Gelenk der geteilten bzw. klappbaren Rückbank beschädigt
  symptoms:
    - en: Airbag lamp on
      de: Airbag-Lampe an
    - en: Rear centre passenger may not be held back early in a frontal crash
      de: Mittlerer Fondpassagier wird bei einem Frontalaufprall womöglich nicht früh zurückgehalten
    - en: "Safety note: the tensioner holds a pyrotechnic charge – battery off, wait time observed, repair at a specialist workshop"
      de: "Sicherheitshinweis: Der Straffer enthält eine pyrotechnische Ladung – Batterie ab, Wartezeit einhalten, Reparatur in der Fachwerkstatt"
  repair:
    difficulty: shop_only
