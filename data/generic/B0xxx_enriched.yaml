- code: B011B
  category: body
  title:
    en: Camera Washer Actuator S
    de: Kamera-Wascher-Aktuator S
  description:
    en: "B011B closes the row with actuator S. Electrically, each actuator in the row is a coil or motor switched by a module or a relay. HELLA's relay guide explains the switching side: a control coil on terminals 85 and 86 pulls in the armature and moves the contact from 87a over to 87, and some types carry a resistor or diode across the coil to tame the spike at switch-off. Asmo's US20120266926A1 energises its camera wash valve through a relay fed from the reversing-lamp circuit, so a fault there can disable the wash as well. An open coil, a sticking relay or a broken feed on this last actuator is what B011B points to. No public source ties S to a particular camera or reports B011B from a real vehicle."
    de: "B011B schließt die Reihe mit Aktor S ab. Elektrisch ist jeder Aktor der Reihe eine Spule oder ein Motor, geschaltet von einem Steuergerät oder Relais. HELLAs Relais-Broschüre erklärt die Schaltseite: Eine Steuerspule an den Klemmen 85 und 86 zieht den Anker an und legt den Kontakt von 87a auf 87 um; manche Typen haben einen Widerstand oder eine Diode parallel zur Spule, um die Spannungsspitze beim Abschalten zu dämpfen. Asmos US20120266926A1 bestromt sein Kamera-Waschventil über ein Relais, das am Rückfahrleuchten-Kreis hängt; ein Fehler dort kann also ebenfalls die Wäsche lahmlegen. Eine unterbrochene Spule, ein klemmendes Relais oder eine gebrochene Zuleitung an diesem letzten Aktor ist, worauf B011B zielt. Keine öffentliche Quelle ordnet S einer bestimmten Kamera zu oder meldet B011B aus einem echten Fahrzeug."
  affected_components:
