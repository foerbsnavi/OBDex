- code: B010F
  category: body
  title:
    en: Camera Washer Actuator F
    de: Kamera-Wascher-Aktuator F
  description:
    en: B010F covers actuator F. On 2021 Chevrolet Tahoe and Suburban and GMC Yukon with the rear camera mirror (RPO DRZ), GM service update N202311260 found the hose feeding the rear camera nozzle kinked behind the tailgate trim in about 630 vehicles; technicians test the wash, shorten the hose to 127 mm at most and slide an 85 mm split sleeve over it. A kink starves the nozzle without any electrical fault, so it would not explain B010F; the code points to the actuator circuit. The camera itself falls under FMVSS 111, which demands a rearview image within 2.0 s of selecting reverse and tests external camera parts for corrosion and humidity, yet sets no rule for a washer. Which camera F means is not published; no maker documents B010F.
    de: B010F betrifft Aktor F. Bei Chevrolet Tahoe und Suburban sowie GMC Yukon 2021 mit Kamera-Innenspiegel (RPO DRZ) fand GMs Service-Update N202311260 in rund 630 Fahrzeugen einen geknickten Waschschlauch der Heckkamera hinter der Heckklappenblende; die Werkstatt prüft die Wäsche, kürzt den Schlauch auf höchstens 127 mm und schiebt 85 mm Schlitzwellrohr darüber. Ein Knick lässt die Düse trocken, ohne einen elektrischen Fehler zu erzeugen, und erklärt B010F daher nicht; der Code deutet auf den Stromkreis des Aktors. Die Kamera selbst fällt unter FMVSS 111, der ein Rückfahrbild binnen 2,0 s nach Einlegen des Rückwärtsgangs verlangt und äußere Kamerateile auf Korrosion und Feuchte prüft, für einen Wascher aber nichts vorschreibt. Welche Kamera F meint, ist nicht veröffentlicht; kein Hersteller dokumentiert B010F.
  affected_components:
    - camera_washer_actuator_f
    - rear_camera
    - actuator_wiring
  common_causes:
    - id: actuator_f_circuit
      likelihood: high
      label:
        en: Open or shorted circuit to valve or pump F
        de: Unterbrochener oder kurzgeschlossener Stromkreis zu Ventil oder Pumpe F
    - id: trim_work_damage
      likelihood: medium
      label:
        en: Wiring pinched or unplugged during tailgate trim removal
        de: Leitung beim Ausbau der Heckklappenverkleidung gequetscht oder abgezogen
    - id: actuator_f_failed
      likelihood: low
      label:
        en: Actuator F itself defective
        de: Aktor F selbst defekt
  symptoms:
    - en: Camera mirror or reversing image stays dirty because the rear camera wash does not work
      de: Kameraspiegel bzw. Rückfahrbild bleibt verschmutzt, weil die Heckkamerawäsche nicht arbeitet
    - en: Rearview image itself is still shown when reversing
      de: Das Rückfahrbild selbst erscheint beim Rückwärtsfahren weiterhin
