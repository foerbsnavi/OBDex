- code: B0017
  category: body
  title:
    en: Right Front/Passenger Frontal Deployment Loop Short to Battery
    de: Beifahrer-Frontairbag Auslösekreis Kurzschluss nach Plus
  description:
    en: "None of the public J2012 lists contains B0017 either. In older GM modules (Saab 9-5 2006, Saab 9-3 up to 2011) it marks an open passenger frontal stage 1 loop, set once the loop reads more than roughly 4.5 ohms for two seconds, so the component matches the title but the fault type does not. Later GM vehicles use B0017 with GM's usual fault bytes, where 01 stands for short to battery. On the 2020-22 Acadia, XT4 and related models GM traced B0017 01, together with B0024 01 and B001E 01, to faulty SDM software rather than wiring: the code is cleared and the module reprogrammed (PIT5827, 21-NA-176). The parts named there are the knee airbag and the driver seat inboard side airbag. The airbag lamp is lit."
    de: "Auch B0017 fehlt in den öffentlichen J2012-Codelisten. In älteren GM-Steuergeräten (Saab 9-5 2006, Saab 9-3 bis 2011) steht er für einen unterbrochenen Beifahrer-Frontkreis Stufe 1, gesetzt bei mehr als 4,5 Ohm (±0,2) über zwei Sekunden – das Bauteil passt zum Titel, die Fehlerart nicht. Neuere GM-Fahrzeuge führen B0017 mit den üblichen GM-Fehlerbytes, bei denen 01 Plusschluss bedeutet. Bei Acadia, XT4 und verwandten Modellen 2020–22 führte GM B0017 01 zusammen mit B0024 01 und B001E 01 auf fehlerhafte Software im Airbagsteuergerät zurück, nicht auf die Verkabelung: Code löschen, Steuergerät neu programmieren (PIT5827, 21-NA-176). Als Teile nennt GM dort den Knieairbag und den inneren Seitenairbag des Fahrersitzes. Die Airbag-Leuchte ist an."
  affected_components:
    - passenger_airbag_module
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: sdm_software
      likelihood: high
      label:
        en: On GM 2020-22 models faulty SDM software, cured by reprogramming (21-NA-176)
        de: Bei GM-Modellen 2020–22 fehlerhafte Steuergerätesoftware, behoben durch Neuprogrammierung (21-NA-176)
    - id: loop_open
      likelihood: medium
      label:
        en: Open passenger frontal stage 1 loop (older GM meaning)
        de: Unterbrochener Beifahrer-Frontkreis Stufe 1 (ältere GM-Bedeutung)
    - id: short_to_supply
      likelihood: low
      label:
        en: Squib lead in contact with a powered wire
        de: Zündpillenleitung berührt eine spannungsführende Leitung
  symptoms:
    - en: Airbag warning lamp on or an OnStar SIR notification without lamp
      de: Airbag-Warnleuchte an oder OnStar-Hinweis zum Rückhaltesystem ohne Leuchte
    - en: Affected airbag stage may be disabled
      de: Betroffene Airbagstufe womöglich gesperrt
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
