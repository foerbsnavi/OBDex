- code: B00F5
  category: body
  title:
    en: Third Row Left Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt dritte Reihe links Auslösesteuerung
  description:
    en: "B00F5 opens the third-row part of the inflatable-belt block with the left seat; B00F6 (centre) and B00F7 (right) follow. No manufacturer documents B00F5, and the known systems stop at row two: Ford's Explorer has its inflatable belts only at the second-row outer seats, even though it has a third row, and Mercedes offers the beltbag for rear belts of S- and E-Class (outer seats in the S-Class). The inflatable belt in NHTSA's 2021 test series was likewise a second-row belt. Technically a third-row unit would work like the others, with a bag in the shoulder webbing and an inflator near buckle or anchor, as the Autoliv patent outlines. If the code is stored, the airbag lamp is on and that belt will not inflate."
    de: "B00F5 eröffnet mit dem linken Sitz den Teil des Blocks für aufblasbare Gurte in der dritten Reihe; B00F6 (Mitte) und B00F7 (rechts) folgen. Kein Hersteller dokumentiert B00F5, und die bekannten Systeme enden bei Reihe zwei: Der Ford Explorer hat seine aufblasbaren Gurte nur an den äußeren Plätzen der zweiten Reihe, obwohl er eine dritte Reihe hat, und Mercedes bietet den Beltbag für Fondgurte von S- und E-Klasse an (in der S-Klasse an den Außenplätzen). Auch der aufblasbare Gurt der NHTSA-Versuchsreihe von 2021 stammte aus der zweiten Reihe. Technisch würde eine Ausführung in Reihe drei genauso arbeiten – Luftsack im Schultergurt, Generator nahe Schloss oder Anker, wie das Autoliv-Patent skizziert. Ist der Code gespeichert, leuchtet die Airbag-Lampe, und dieser Gurt bläst sich nicht auf."
  affected_components:
    - third_row_left_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Airbag module coded with a third-row inflatable belt that is not installed
        de: Airbag-Steuergerät mit einem aufblasbaren Gurt in Reihe drei codiert, der nicht eingebaut ist
    - id: third_row_connector
      likelihood: medium
      label:
        en: Plug at the left third-row belt inflator disturbed when folding the seat
        de: Stecker am Gurt-Generator links in der dritten Reihe beim Umklappen des Sitzes gelöst
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Defective igniter in the third-row belt inflator
        de: Defekter Zünder im Gurt-Generator der dritten Reihe
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left third-row inflatable belt not available in a crash
      de: Aufblasbarer Gurt links in der dritten Reihe bei einem Unfall nicht verfügbar
    - en: "Safety note: inflator with explosive igniter – disconnect the battery, wait, and have it handled by a specialist workshop"
      de: "Sicherheitshinweis: Gasgenerator mit Sprengzünder – Batterie abklemmen, warten und von einer Fachwerkstatt bearbeiten lassen"
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [80, 1500]
    estimated_hours: [0.5, 3]
  flags:
    mil: false
    emissions_relevant: false
