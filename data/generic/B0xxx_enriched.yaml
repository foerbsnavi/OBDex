  reviewed: '2026-11-06'

- code: B007E
  category: body
  title:
    en: Driver Seat Belt Pretensioner C Deployment Control
    de: Fahrer-Gurtstraffer C Auslösesteuerung
  description:
    en: "B007E is the driver's third (C) pretensioner circuit. Mercedes-Benz fills this slot with the retractor: in LI54.21-P-070658 for the A-, CLA- and GLB-Class, B007E13 is an open circuit at the squib of the driver's emergency tensioning retractor, with B0079 for the belt end fitting tensioner and B0080 for the driver's belt force limiter. The retractor unit is housed either inside the B-pillar or within the seat and winds the spool back to remove slack from the shoulder belt, as GM and Joyson explain. The same Mercedes list puts the rear retractors on the C codes B00E3, B00E4, B00E6 and B00E7, so there the C stage consistently means the retractor. A stored B007E means the airbag lamp is on and the driver's shoulder belt will not be pretensioned."
    de: "B007E ist der Kreis des dritten Gurtstraffers (Stufe C) am Fahrersitz. Mercedes-Benz belegt diesen Platz mit dem Aufroller: In LI54.21-P-070658 für A-, CLA- und GLB-Klasse bedeutet B007E13 eine Unterbrechung an der Zündpille des Fahrer-Gurtstraffer-Aufrollers; B0079 steht dort für den Endbeschlagstraffer, B0080 für den Gurtkraftbegrenzer des Fahrers. Der Aufrollerstraffer sitzt in der B-Säule oder im Sitz und dreht die Gurtspule zurück, um die Lose aus dem Schultergurt zu ziehen – so erklären es GM und Joyson. Dieselbe Mercedes-Liste legt die hinteren Aufroller auf die C-Codes B00E3, B00E4, B00E6 und B00E7; Stufe C heißt dort also durchgehend Aufroller. Mit gespeichertem B007E ist die Airbag-Lampe an, und der Schultergurt des Fahrers wird nicht vorgespannt."
  affected_components:
    - driver_pretensioner_c
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: retractor_connector
      likelihood: high
      label:
        en: Retractor plug at the lower driver-side B-pillar loose or terminals spread
        de: Aufrollerstecker unten an der B-Säule links locker oder Kontakte aufgeweitet
    - id: pillar_harness_pinched
      likelihood: medium
      label:
        en: Harness pinched by B-pillar or sill trim
        de: Kabelbaum von B-Säulen- oder Schwellerverkleidung eingeklemmt
    - id: retractor_squib_fault
      likelihood: low
      label:
        en: Internal fault of the driver retractor pretensioner
        de: Interner Fehler des Fahrer-Aufrollerstraffers
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver's shoulder belt is not tightened in a crash
      de: Schultergurt des Fahrers wird bei einem Unfall nicht gestrafft
    - en: "Safety note: the retractor holds a pyrotechnic charge; disconnect the battery, wait, and leave the work to a specialist workshop"
      de: "Sicherheitshinweis: Der Aufroller enthält eine pyrotechnische Ladung – Batterie abklemmen, warten und die Arbeit einer Fachwerkstatt überlassen"
  repair:
