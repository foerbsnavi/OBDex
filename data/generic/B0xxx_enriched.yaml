- code: B00C0
  category: body
  title:
    en: Passenger Seat Occupant Classification Sensor A
    de: Beifahrersitz Insassenklassifizierungssensor A
  description:
    en: "B00C0 flags the first of up to five classification inputs in the front passenger seat. Their job comes from FMVSS 208: the passenger bag must stay off when a 12-month dummy sits in a listed child restraint or a newborn dummy lies in a car bed, yet it must be live for a 5th percentile woman, and a yellow PASSENGER AIR BAG OFF lamp reports the suppressed state. Honda's 2013 Fit shows a typical weight solution: sensors in the seat switch the bag off at 29 kg or less, the off lamp may flicker when the load sits near that limit, and bags hanging from the seat back or a rear passenger pushing on it can upset the reading. No carmaker publishes B00C0, and which sensor the letter A names is left open. The airbag lamp lights and classification falls back to a safe default."
    de: "B00C0 meldet den ersten von bis zu fünf Klassifizierungseingängen im Beifahrersitz. Ihre Aufgabe folgt aus FMVSS 208: Der Beifahrerairbag muss gesperrt bleiben, wenn ein 12 Monate alter Dummy in einem gelisteten Kindersitz sitzt oder ein Neugeborenen-Dummy in einer Babywanne liegt, für eine Frau der 5-%-Perzentile aber scharf sein; eine gelbe Leuchte PASSENGER AIR BAG OFF zeigt die Sperre an. Hondas Fit 2013 zeigt eine übliche Gewichtslösung: Sensoren im Sitz schalten den Airbag bei 29 kg oder weniger ab, nahe dieser Grenze kann die Aus-Leuchte flackern, und Taschen an der Lehne oder ein Fondpassagier, der gegen sie drückt, verfälschen die Messung. Kein Hersteller veröffentlicht B00C0; welchen Sensor der Buchstabe A meint, bleibt offen. Die Airbag-Leuchte geht an, die Klassifizierung fällt auf einen sicheren Ersatzwert zurück."
  affected_components:
    - passenger_classification_sensor_a
    - srs_seat_wiring
    - occupant_classification_module
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Loose plug or chafed wire to input A under the passenger seat, often after the seat was removed
        de: Lockerer Stecker oder durchgescheuerte Leitung zu Eingang A unter dem Beifahrersitz, oft nach Sitzausbau
    - id: sensor_a_fault
      likelihood: medium
