      de: Airbag-Warnleuchte an
    - en: Airbag cannot be suppressed if the driver is very close to the cover
      de: Airbag kann nicht gesperrt werden, wenn der Fahrer sehr nah an der Abdeckung ist
    - en: "Safety note: airbag system; work at steering wheel, cover or sensor plugs only de-energised (ignition off, battery off, wait time); calibrate the sensor after replacement, specialist workshop only"
