- code: B0087
  category: body
  title:
    en: Third Row Center Seat Belt Load Limiter Deployment Control
    de: Gurtkraftbegrenzer dritte Reihe Mitte Auslösesteuerung
  description:
    en: "B0087 would flag the igniter circuit of an adaptive belt force limiter on the centre position of row three. That combination is close to theoretical: no carmaker documents the code, and NHTSA's 2013 study dates universal fitment of load limiters (by model year 2007) only for the front outboard seats. Joyson describes how such a unit works, with linear limiters tuned to a vehicle's crash pulse and dual-stage versions for adaptive or degressive force. On GM Global A vehicles (2011 Saab 9-4X) B0087 means the left rear side impact sensor. GM sets it after ten seconds of a fault, or when the module hears nothing from the sensor for over 375 ms. A history code there clears after 100 fault-free ignition cycles. Check the make first."
    de: "B0087 würde den Zündkreis eines umschaltbaren Kraftbegrenzers am Mittelsitz der dritten Reihe melden. Diese Kombination ist fast nur theoretisch: Kein Hersteller dokumentiert den Code, und die NHTSA-Studie von 2013 datiert die vollständige Ausstattung mit Kraftbegrenzern (bis Modelljahr 2007) nur für die äußeren Vordersitze. Joyson beschreibt die Technik: lineare Begrenzer, abgestimmt auf den Crashpuls des Fahrzeugs, und zweistufige Ausführungen für adaptive oder degressive Kraft. Im GM-Global-A-Modell Saab 9-4X (2011) bezeichnet B0087 den linken hinteren Seitenaufprallsensor. GM setzt ihn, wenn ein Fehler zehn Sekunden ansteht oder das Steuergerät länger als 375 ms nichts vom Sensor hört. Ein gespeicherter Eintrag erlischt dort nach 100 fehlerfreien Zündzyklen. Zuerst die Marke klären."
  affected_components:
    - third_row_center_load_limiter
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_left_rear_side_sensor
      likelihood: high
      label:
        en: On GM vehicles, left rear side impact sensor or its connector faulty (different meaning)
        de: Bei GM linker hinterer Seitenaufprallsensor oder dessen Stecker defekt (andere Bedeutung)
    - id: third_row_centre_wiring
      likelihood: low
      label:
        en: Damaged lead to a third-row centre limiter where fitted
        de: Beschädigte Leitung zu einem Mittelsitz-Begrenzer der dritten Reihe, falls verbaut
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On GM vehicles the AIR BAG indicator is lit by the cluster at the module's request
      de: Bei GM schaltet das Kombiinstrument auf Anforderung des Moduls die AIR-BAG-Anzeige ein
    - en: "Safety note: airbag system with pyrotechnic parts; diagnose only de-energised at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System mit pyrotechnischen Teilen; nur spannungsfrei in einer Fachwerkstatt prüfen"
