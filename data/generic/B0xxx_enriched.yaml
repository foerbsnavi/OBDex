- code: B00D0
  category: body
  title:
    en: Driver Seat Belt Indicator
    de: Gurtwarnleuchte Fahrer
  description:
    en: "B00D0 reports a fault in the driver's seat belt warning, meaning the lamp, its circuit or the output or message that drives it, not the buckle switch. No carmaker documents it publicly. The warning itself is mandatory: FMVSS 208 S7.3 asks at ignition-on for a 4 to 8 s chime plus a lamp for at least 60 s while the driver is unbelted, or a 4 to 8 s lamp with the chime tied to the unfastened belt; from September 2028 S7.5 keeps the lamp on as long as the belt is open and adds a second chime phase above 10 km/h. FMVSS 101 forbids cancelling the telltale early. UN R16 asks for a first visual stage of at least 4 s and a second, audible one of 30 s or more, starting by 25 km/h, 500 m or 60 s. With B00D0 the driver may get no reminder at all."
    de: "B00D0 meldet einen Fehler der Gurtwarnung für den Fahrer, also an Leuchte, Leitung oder dem Ausgang bzw. der Botschaft, die sie ansteuert, nicht am Gurtschloss. Kein Hersteller dokumentiert ihn öffentlich. Die Warnung selbst ist Pflicht: FMVSS 208 S7.3 verlangt beim Einschalten der Zündung für einen nicht angeschnallten Fahrer einen Ton von 4 bis 8 s und eine Leuchte von mindestens 60 s oder eine Leuchte von 4 bis 8 s mit gurtabhängigem Ton; ab September 2028 lässt S7.5 die Leuchte brennen, solange der Gurt offen ist, mit zweiter Tonphase über 10 km/h. FMVSS 101 verbietet, die Kontrollleuchte vorzeitig abzuschalten. UN R16 fordert eine erste optische Stufe von mindestens 4 s und eine zweite mit Ton von 30 s oder mehr, spätestens ab 25 km/h, 500 m oder 60 s. Bei B00D0 fehlt dem Fahrer womöglich jede Erinnerung."
  affected_components:
    - driver_belt_indicator
    - instrument_cluster
    - srs_control_module
  common_causes:
    - id: indicator_circuit
      likelihood: high
      label:
        en: Open or shorted lamp circuit or connector between restraint module and cluster
        de: Unterbrochene oder kurzgeschlossene Lampenleitung bzw. Stecker zwischen Rückhaltesteuergerät und Kombiinstrument
    - id: cluster_fault
      likelihood: medium
      label:
        en: Warning lamp or LED in the instrument cluster failed
        de: Warnleuchte bzw. LED im Kombiinstrument ausgefallen
    - id: network_or_configuration
      likelihood: low
      label:
        en: Belt warning message not received by the cluster, for example after a cluster change without configuration
        de: Gurtwarnbotschaft erreicht das Kombiinstrument nicht, etwa nach Tausch ohne Konfiguration
  symptoms:
    - en: Driver belt warning lamp stays dark or stays on regardless of the belt
      de: Fahrer-Gurtwarnleuchte bleibt dunkel oder brennt unabhängig vom Gurt
    - en: Airbag or restraint warning lamp may be on
      de: Airbag- bzw. Rückhaltesystem-Warnleuchte kann an sein
    - en: "Safety note: legally required warning missing; buckle up regardless, cluster and restraint wiring only de-energised (ignition off, battery off, wait time), specialist workshop"
      de: "Sicherheitshinweis: Vorgeschriebene Warnung fehlt; trotzdem anschnallen, Kombiinstrument und Rückhalteleitungen nur spannungsfrei (Zündung aus, Batterie ab, Wartezeit), Fachwerkstatt"
