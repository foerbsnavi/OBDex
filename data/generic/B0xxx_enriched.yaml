- code: B003B
  category: body
  title:
    en: Second Row Right Frontal Stage 3 Deployment Control
    de: Frontairbag zweite Sitzreihe rechts Stufe 3 Auslösesteuerung
  description:
    en: B003B is the third firing element of the right rear-seat frontal airbag. In front airbags Mercedes-Benz uses this third position for the squib that opens a vent valve and lets gas escape (B000313 driver, B001213 passenger); a patent from Breed shows the other option, a third gas chamber with its own igniter that the controller can fire later, for example in a second impact. Which of these a rear bag would use is not published, and no carmaker documents B003B. If it is stored, the module has found the third element out of range in resistance or voltage. Stage 1 and 2 of the same bag report as B0039 and B003A. The airbag lamp stays on.
    de: B003B ist das dritte Zündelement des rechten Fond-Frontairbags. Bei den vorderen Airbags nutzt Mercedes-Benz diesen dritten Platz für die Zündpille, die ein Abströmventil öffnet und Gas entweichen lässt (B000313 Fahrer, B001213 Beifahrer); ein Breed-Patent zeigt die andere Möglichkeit, eine dritte Gaskammer mit eigenem Zünder, die das Steuergerät später zünden kann, etwa bei einem Zweitaufprall. Welche Lösung ein Fond-Airbag nutzen würde, ist nicht veröffentlicht, und kein Hersteller dokumentiert B003B. Ist er gespeichert, liegt Widerstand oder Spannung des dritten Elements außerhalb des Sollbereichs. Stufe 1 und 2 desselben Airbags melden sich als B0039 und B003A. Die Airbag-Leuchte bleibt an.
  affected_components:
