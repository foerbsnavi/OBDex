      de: Kameradüse tröpfelt nur; der Strahl reicht nicht über die Linse
    - en: Pump hum without spray, or no pump sound at all when the wash is requested
      de: Pumpe brummt ohne Strahl, oder bei Waschanforderung ist gar kein Pumpengeräusch zu hören
