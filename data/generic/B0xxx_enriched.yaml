- code: B0003
  category: body
  title:
    en: Driver Frontal Stage 3 Deployment Control
    de: Fahrer-Frontairbag Stufe 3 Auslösesteuerung
  description:
    en: Some driver airbag modules carry a third pyrotechnic element in addition to the two inflator stages, and B0003 covers its firing loop. FCA lists the code as driver frontal squib 3; its STAR case S2108000180 found B0003-2B (wires shorted together) next to B0001 and B0002 when connector locks behind the steering wheel were not engaged. Mercedes-Benz uses B000313 for the squib of the vent valve inside the driver airbag, which lets gas escape so the cushion becomes softer. An FCA patent describes such an active vent that the airbag electronics opens or keeps closed using data from occupant classification. With this loop faulted, the bag loses its third stage or adaptive venting, while the two inflator stages may still work. The airbag lamp lights up.
    de: Manche Fahrerairbags besitzen neben den beiden Treibsatzstufen ein drittes pyrotechnisches Element; B0003 betrifft dessen Zündkreis. FCA führt den Code als Zündpille 3 des Fahrer-Frontairbags; im STAR-Fall S2108000180 stand B0003-2B (Leitungen untereinander kurzgeschlossen) neben B0001 und B0002, weil Steckersicherungen hinter dem Lenkrad nicht eingerastet waren. Mercedes-Benz nutzt B000313 für die Zündpille des Abströmventils im Fahrerairbag, das Gas ablässt und das Kissen weicher macht. Ein FCA-Patent beschreibt eine solche aktive Entlüftung, die die Airbagelektronik je nach Insassenerkennung öffnet oder geschlossen hält. Ist dieser Kreis gestört, fehlen dritte Stufe bzw. Abströmsteuerung; die beiden Treibsatzstufen können weiter funktionieren. Die Airbag-Warnleuchte ist an.
  affected_components:
    - driver_airbag_module
    - clock_spring
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: connector_lock_not_engaged
      likelihood: high
      label:
        en: Connector position assurance lock at the airbag module not engaged
        de: Steckersicherung (CPA) am Airbagmodul nicht eingerastet
    - id: stage3_squib_fault
      likelihood: medium
      label:
        en: Third squib or vent valve squib in the airbag module faulty
        de: Dritte Zündpille bzw. Zündpille des Abströmventils im Airbagmodul defekt
    - id: clock_spring_open
      likelihood: low
      label:
        en: Damaged clock spring conductor for the third circuit
        de: Beschädigte Leiterbahn der Wickelfeder für den dritten Kreis
  symptoms:
    - en: Airbag warning lamp on, often together with B0001 or B0002
      de: Airbag-Warnleuchte an, oft zusammen mit B0001 oder B0002
    - en: Adaptive venting or third deployment stage unavailable
      de: Abströmsteuerung bzw. dritte Auslösestufe nicht verfügbar
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
