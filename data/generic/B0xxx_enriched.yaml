- code: B0010
  category: body
  title:
    en: Passenger Frontal Stage 1 Deployment Control
    de: Beifahrer-Frontairbag Stufe 1 Auslösesteuerung
  description:
    en: "The front passenger airbag in the dashboard is normally dual-stage like the driver bag, but it also depends on occupant detection: FMVSS 208 allows it to be suppressed for small occupants and requires a readiness indicator that monitors the system. B0010 reports a fault in the firing loop of its first stage. Mercedes-Benz stores B001013 when the stage 1 squib of the passenger bag is open; Mitsubishi files B0010 under the passenger (assist) airbag module with several fault bytes. A suppressed airbag is not a fault and does not set this code; B0010 means the wiring or squib of stage 1 is electrically out of range. Typical spots are the connector behind the dash panel and harness routed past the glovebox. The passenger bag may not deploy and the airbag lamp stays lit."
    de: "Der Beifahrer-Frontairbag in der Armaturentafel ist meist wie der Fahrerairbag zweistufig, hängt aber zusätzlich an der Insassenerkennung: FMVSS 208 erlaubt, ihn für kleine Insassen abzuschalten, und verlangt eine Bereitschaftsanzeige, die das System überwacht. B0010 meldet einen Fehler im Zündkreis der ersten Stufe. Mercedes-Benz legt B001013 für eine unterbrochene Zündpille Stufe 1 des Beifahrerairbags ab, Mitsubishi führt B0010 beim Beifahrerairbagmodul mit mehreren Fehlerbytes. Eine gewollte Abschaltung ist kein Fehler und setzt den Code nicht; B0010 heißt, dass Leitung oder Zündpille der Stufe 1 elektrisch außerhalb der Grenzen liegen. Typische Stellen sind der Stecker hinter der Armaturentafel und die Leitung am Handschuhfach. Der Beifahrerairbag löst womöglich nicht aus, die Leuchte bleibt an."
  affected_components:
    - passenger_airbag_module
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: passenger_airbag_connector
      likelihood: high
      label:
        en: Loose, corroded or unlocked connector at the passenger airbag module
        de: Loser, korrodierter oder nicht verriegelter Stecker am Beifahrerairbagmodul
    - id: harness_damage_dash
      likelihood: medium
      label:
        en: Harness damaged during dashboard or glovebox work
        de: Kabelbaum bei Arbeiten an Armaturentafel oder Handschuhfach beschädigt
    - id: passenger_airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the passenger airbag module (stage 1 squib)
        de: Innerer Fehler im Beifahrerairbagmodul (Zündpille Stufe 1)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Front passenger airbag may not deploy in a crash
      de: Beifahrer-Frontairbag löst im Crash womöglich nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
  repair:
    difficulty: shop_only
