    - id: gm_rear_door_harness
      likelihood: medium
      label:
        en: "Older GM trucks: broken wire in the rear door harness to the pretensioner (bulletin 14609)"
        de: "Ältere GM-Pick-ups: gebrochene Leitung im Türkabelstrang hinten zum Straffer (Bulletin 14609)"
