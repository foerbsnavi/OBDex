- code: B00C7
  category: body
  title:
    en: Passenger Seat Occupant Position Sensor A
    de: Beifahrersitz Insassenpositionssensor A
  description:
    en: "B00C7 opens the row of five passenger seat position sensors, a code absent from all public carmaker documents. The passenger seat is where position sensing reached series cars: Honda's OPDS puts sensors in the passenger seat back that judge sitting height and whether a child leans toward the door, and then blocks the seat-mounted side airbag and lights a side airbag off indicator. Honda's 1998 patent describes the principle: band electrodes in the back cover are fed with a high-frequency signal, and a nearby body raises the current, so shoulders, head and a door-side lean can be told apart; the unit also diagnoses its own faults. Honda asks for the system to be initialised after seat-back parts are changed. Whether a maker maps such a sensor to A is not documented. B00C7 lights the airbag lamp."
    de: "B00C7 ist der erste von fünf Insassenpositionssensoren des Beifahrersitzes. Kein Hersteller veröffentlicht den Code. Am Beifahrersitz kam die Positionserkennung in die Serie: Hondas OPDS setzt Sensoren in die Beifahrerlehne, die Sitzhöhe und ein Anlehnen eines Kindes zur Tür erkennen, sperrt dann den Seitenairbag im Sitz und schaltet eine Anzeige für den abgeschalteten Seitenairbag ein. Hondas Patent von 1998 beschreibt das Prinzip: Bandelektroden im Lehnenbezug werden mit Hochfrequenz gespeist, ein naher Körper erhöht den Strom, sodass sich Schultern, Kopf und Neigung zur Tür unterscheiden lassen; das Gerät überwacht sich zudem selbst. Honda verlangt, das System nach dem Tausch von Lehnenteilen zu initialisieren. Ob ein Hersteller einen solchen Sensor als A führt, ist nicht belegt. B00C7 schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_occupant_position_sensor_a
    - srs_seat_wiring
    - occupant_position_module
  common_causes:
    - id: not_initialised
      likelihood: high
      label:
        en: Position system not initialised after seat cover, seat back sensor or control unit replacement
        de: Positionssystem nach Tausch von Bezug, Lehnensensor oder Steuergerät nicht initialisiert
    - id: seat_back_electrode_damage
      likelihood: medium
      label:
        en: Electrode or lead in the seat back damaged, for instance by a non-original seat cover or repairs
        de: Elektrode oder Leitung in der Lehne beschädigt, etwa durch Fremdbezug oder Reparaturen
    - id: moisture_or_objects
      likelihood: low
      label:
        en: Damp seat back or objects pressed against it
        de: Feuchte Lehne oder dagegen gedrückte Gegenstände
  symptoms:
