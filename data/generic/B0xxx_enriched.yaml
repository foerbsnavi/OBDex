- code: B00B5
  category: body
  title:
    en: Driver Seat Track Position Restraints Sensor
    de: Fahrersitz-Schienenpositionssensor (Rückhaltesystem)
  description:
    en: "B00B5 reports a fault of the driver seat track position sensor, which tells the airbag module whether the seat is pushed far forward toward the steering wheel. FCA uses it with exactly this meaning: GPOP tech tips for the Dodge Dart (PF), Jeep Cherokee (KL) and Chrysler 200 (UF) name B00B5-13, an open circuit, among codes to clear with engineering before replacing the restraint controller, and a 2024 tip for the Pacifica and Voyager (RU) asks for wiring, plug and low voltage checks first. Allegro describes the usual hardware, a two-wire Hall switch that the steel track shields from a magnet as it passes, giving zones. Honda lowers driver airbag force in the forward zone. Saab 9-3/9-5 file this sensor as B0084 and then disable the second airbag stage. The airbag lamp lights."
    de: "B00B5 meldet einen Fehler des Schienenpositionssensors am Fahrersitz, der dem Airbag-Steuergerät sagt, ob der Sitz weit nach vorn zum Lenkrad geschoben ist. FCA nutzt den Code genau so: GPOP-Hinweise zu Dodge Dart (PF), Jeep Cherokee (KL) und Chrysler 200 (UF) nennen B00B5-13 (Unterbrechung) unter den Codes, die vor dem Tausch des Rückhaltesteuergeräts mit der Technik abzuklären sind; ein Hinweis von 2024 für Pacifica und Voyager (RU) verlangt zuerst die Prüfung von Leitung, Stecker und Unterspannung. Allegro beschreibt die übliche Technik: einen zweiadrigen Hall-Schalter, den die Stahlschiene beim Vorbeigleiten vom Magneten abschirmt, woraus Zonen entstehen. Honda verringert in der vorderen Zone die Kraft des Fahrerairbags. Saab 9-3/9-5 führen diesen Sensor als B0084 und schalten dann die zweite Airbagstufe ab. Die Airbag-Leuchte brennt."
  affected_components:
    - driver_seat_track_sensor
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: harness_open_under_seat
      likelihood: high
      label:
        en: Open circuit or bent/corroded pins in the seat harness to the track sensor (FCA subtype -13)
        de: Unterbrechung oder verbogene/korrodierte Kontakte im Sitzkabelbaum zum Schienensensor (FCA-Untertyp -13)
    - id: sensor_air_gap
      likelihood: medium
      label:
        en: Sensor loose or wrongly positioned on the seat track, so the Hall switch no longer sees the track edge
        de: Sensor an der Schiene locker oder falsch positioniert, sodass der Hall-Schalter die Schienenkante nicht mehr erkennt
    - id: low_voltage
      likelihood: low
      label:
        en: Low system voltage (FCA asks to check this before replacing the controller)
        de: Niedrige Bordspannung (FCA verlangt diese Prüfung vor dem Steuergerätetausch)
    - id: sensor_fault
      likelihood: low
      label:
        en: Internal fault of the Hall-effect seat track sensor
        de: Interner Fehler des Hall-Schienensensors
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Driver airbag may fire without seat position adjustment (e.g. second stage locked out)
      de: Fahrerairbag zündet womöglich ohne Anpassung an die Sitzposition (z. B. zweite Stufe gesperrt)
    - en: "Safety note: airbag system; unplug the seat and sensor connectors only de-energised; after replacing the sensor check its position output/calibration, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; Sitz- und Sensorstecker nur spannungsfrei trennen (Zündung aus, Batterie ab, Wartezeit); nach Sensortausch Positionssignal prüfen bzw. kalibrieren, nur Fachwerkstatt"
