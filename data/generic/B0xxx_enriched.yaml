      de: Airbag-Warnleuchte an
    - en: Side and curtain airbags on the left may deploy later in a side impact
      de: Seiten- und Kopfairbags links lösen bei einem Seitenaufprall womöglich später aus
    - en: "Safety note: airbag system; switch off, disconnect the battery and keep the wait time before work, specialist workshop only"
      de: "Sicherheitshinweis: Airbag-System; vor Arbeiten Zündung aus, Batterie abklemmen und Wartezeit einhalten, nur Fachwerkstatt"
