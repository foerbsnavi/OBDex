      de: Seitencrash-Erkennung hinten links ist eingeschränkt
    - en: "Safety note: airbag system; disconnect the battery and keep the wait time, then have it diagnosed at a specialist workshop"
      de: "Sicherheitshinweis: Airbag-System; Batterie abklemmen und Wartezeit einhalten, dann in einer Fachwerkstatt diagnostizieren lassen"
