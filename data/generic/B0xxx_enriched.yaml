- code: B0126
  category: body
  title:
    en: Driver Monitoring Camera
    de: Fahrerbeobachtungskamera
  description:
    en: "B0126 belongs to the driver monitoring camera, an infrared camera aimed at the driver that tracks gaze and head position for hands-free and attention functions. GM uses the code: preliminary information PIC6556 (versions B to H, 2024–2025) for Super Cruise models from Cadillac Lyriq to Silverado EV lists B0126 symptom 82, stored by the module that processes camera images and often paired with B1DD0; the steps are a 30-minute disconnect, a check of the LVDS cable and finally a new camera. PIT6229 reports Super Cruise dropping out because software wrongly judged the driver's gaze to be off the road. In the EU, Delegated Regulation 2023/2590 requires distraction warnings above 20 km/h and a failure warning when the sensor is faulty or blocked. Hands-free driving is unavailable while the fault is active."
    de: "B0126 gehört zur Fahrerbeobachtungskamera, einer auf den Fahrer gerichteten Infrarotkamera, die Blick und Kopfhaltung für Freihand- und Aufmerksamkeitsfunktionen verfolgt. GM nutzt den Code: Die Vorab-Information PIC6556 (Fassungen B bis H, 2024–2025) für Super-Cruise-Modelle vom Cadillac Lyriq bis zum Silverado EV nennt B0126 mit Symptom 82 im Bildverarbeitungsmodul, oft zusammen mit B1DD0; vorgesehen sind 30 Minuten Abklemmen, Prüfen des LVDS-Kabels und zuletzt eine neue Kamera. PIT6229 beschreibt softwarebedingte Abschaltungen wegen angeblich zu langen Wegschauens. In der EU verlangt die Delegierte Verordnung 2023/2590 Ablenkungswarnungen ab 20 km/h und eine Fehlerwarnung bei defektem oder verdecktem Sensor. Solange der Fehler aktiv ist, steht das freihändige Fahren nicht zur Verfügung."
  affected_components:
    - driver_monitoring_camera
    - driver_monitoring_module
    - camera_wiring
  common_causes:
    - id: dms_camera_defective
      likelihood: high
      label:
        en: Driver monitoring camera internally defective
        de: Fahrerbeobachtungskamera intern defekt
    - id: dms_lvds_cable
      likelihood: medium
      label:
        en: LVDS cable to the image processing module damaged or poorly connected
        de: LVDS-Kabel zum Bildverarbeitungsmodul beschädigt oder schlecht gesteckt
    - id: dms_software_or_obstruction
      likelihood: low
      label:
        en: Software fault, or camera view blocked by objects or mounting problems
        de: Softwarefehler oder Kamerasicht durch Gegenstände bzw. Einbaufehler verdeckt
  symptoms:
    - en: Hands-free assistance such as Super Cruise unavailable or disengaging
      de: Freihand-Assistent wie Super Cruise nicht verfügbar oder schaltet ab
    - en: Driver attention or distraction warning inactive, failure message shown
      de: Aufmerksamkeits- oder Ablenkungswarnung inaktiv, Fehlermeldung angezeigt
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [100, 1500]
    estimated_hours: [0.5, 3]
  flags:
