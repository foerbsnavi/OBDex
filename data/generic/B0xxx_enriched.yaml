- code: B0114
  category: body
  title:
    en: Camera Washer Actuator L
    de: Kamera-Wascher-Aktuator L
  description:
    en: "B0114 covers actuator L. Stellantis STAR case S2123000051 (2021, Jeep Grand Cherokee) describes a front camera washer pump that stopped spraying when the reservoir ran low although the cluster showed no low-fluid warning; a new pump, reservoir or level sensor did not help, and engineering was still investigating. Ford's German application DE102018109892A1 shows a quite different actuator: a magnet that squeezes a flexible chamber next to the camera, with one-way valves at inlet and outlet, triggered at ignition on, in reverse or by the wiper lever, plus an optional float reporting a low level. Washer level codes form their own row from B011C. Which camera L serves is not published; no maker documents B0114."
    de: "B0114 betrifft Aktor L. Der Stellantis-STAR-Fall S2123000051 (2021, Jeep Grand Cherokee) beschreibt eine Frontkamera-Waschpumpe, die bei niedrigem Behälterstand nicht mehr spritzte, obwohl das Kombiinstrument keinen Flüssigkeitsmangel meldete; neue Pumpe, neuer Behälter oder Füllstandsensor halfen nicht, die Entwicklung untersuchte noch. Fords deutsche Anmeldung DE102018109892A1 zeigt einen ganz anderen Aktor: Ein Magnet drückt eine flexible Kammer neben der Kamera zusammen, mit Einwegventilen an Ein- und Auslass, ausgelöst bei Zündung an, im Rückwärtsgang oder über den Wischerhebel, dazu ein optionaler Schwimmer für den Mindeststand. Füllstandscodes bilden ab B011C eine eigene Reihe. Welche Kamera L versorgt, ist nicht veröffentlicht; kein Hersteller dokumentiert B0114."
  affected_components:
    - camera_washer_actuator_l
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: pump_l_running_dry
      likelihood: high
      label:
        en: Pump or actuator L damaged after running with a nearly empty reservoir
        de: Pumpe bzw. Aktor L nach Betrieb mit fast leerem Behälter beschädigt
    - id: actuator_l_circuit
      likelihood: medium
      label:
        en: Open or shorted wiring to actuator L
        de: Unterbrochene oder kurzgeschlossene Leitung zu Aktor L
    - id: level_signal_wrong
      likelihood: low
      label:
        en: Level sensor not warning in time, so the actuator runs without fluid
        de: Füllstandsensor warnt nicht rechtzeitig, der Aktor läuft ohne Flüssigkeit
  symptoms:
    - en: Camera wash stops working while the reservoir is low, without a low-fluid warning
      de: Kamerawäsche fällt bei niedrigem Behälterstand aus, ohne Warnung vor Flüssigkeitsmangel
    - en: Front camera view remains dirty after a wash request
      de: Frontkamerabild bleibt nach Waschanforderung verschmutzt
