- code: B0090
  category: body
  title:
    en: Left Frontal Restraints Sensor
    de: Crashsensor vorne links
  description:
    en: "B0090 concerns the left frontal crash sensor, a satellite accelerometer in the front crumple zone that tells the airbag module early how hard the front end is being hit. Bosch notes such upfront units sharpen frontal crash detection beside the central sensors. Several makers use the code exactly so. Acura bulletin 18-016 (2017 ILX) describes B0090-87, a missing signal of the left frontal impact sensor, caused by water entering the connector through a wire size variance; sensor and engine bay harness are replaced. For the Ram 1500, FCA reports B0090-49, internal electronic failure of the left frontal acceleration sensor: after sensor replacement the part number must match the restraint controller (STAR S2408000050), and TSB 08-150-26 (2025 Ram 1500) reflashes the controller. The airbag lamp comes on."
    de: "B0090 betrifft den linken Frontcrashsensor, einen Beschleunigungs-Satelliten in der vorderen Knautschzone, der dem Airbag-Steuergerät früh meldet, wie heftig die Front getroffen wird. Laut Bosch verbessern solche Vorfeldsensoren die Frontcrash-Erkennung. Mehrere Hersteller nutzen den Code genau so. Acura-Bulletin 18-016 (ILX 2017) nennt B0090-87, kein Signal vom linken Frontaufprallsensor, weil durch abweichenden Leitungsquerschnitt Wasser in den Stecker dringt; Sensor und Motorraum-Kabelbaum werden erneuert. Für den Ram 1500 meldet FCA B0090-49, innerer Elektronikfehler des linken Frontbeschleunigungssensors: Nach einem Sensortausch muss die Teilenummer zum Rückhalte-Steuergerät passen (STAR S2408000050), und TSB 08-150-26 (Ram 1500, 2025) programmiert das Steuergerät neu. Die Airbag-Leuchte geht an."
  affected_components:
    - left_front_crash_sensor
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: water_in_sensor_connector
      likelihood: high
      label:
        en: Water in the left front sensor connector damaging the harness (Acura 18-016)
        de: Wasser im Stecker des linken Frontsensors, Kabelbaum beschädigt (Acura 18-016)
    - id: sensor_part_mismatch
      likelihood: medium
      label:
        en: Replacement sensor part number not matching the restraint controller (FCA S2408000050)
        de: Teilenummer des Ersatzsensors passt nicht zum Rückhalte-Steuergerät (FCA S2408000050)
    - id: controller_software
      likelihood: medium
      label:
        en: Restraint controller software needing a reflash (FCA TSB 08-150-26)
        de: Software des Rückhalte-Steuergeräts muss neu aufgespielt werden (FCA TSB 08-150-26)
    - id: front_sensor_damage
      likelihood: low
      label:
        en: Sensor damaged by a front-end impact or poor refitting after body repair
        de: Sensor durch Frontschaden oder fehlerhaften Wiedereinbau nach Karosseriearbeit beschädigt
