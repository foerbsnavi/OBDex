- code: B00F6
  category: body
  title:
    en: Third Row Center Inflatable Seat Belt Deployment Control
    de: Aufblasbarer Sicherheitsgurt dritte Reihe Mitte Auslösesteuerung
  description:
    en: "B00F6 names the deployment circuit for an inflatable belt at the middle seat of row three. That seat is the least likely place for such a belt: the series systems on record sit at outboard rear seats, Ford's Explorer only in row two and Mercedes' beltbag on the outer rear belts. The 2017 Mercedes GLS manual, for a three-row SUV, lists pyrotechnic tensioners and force limiters for its third-row belts, but no beltbag there. NHTSA's belt test series likewise used the inflatable Explorer belt from a second-row seat. Joyson's belt-attached restraint study for new interior layouts shows where such bags might spread. No maker publishes B00F6; if set, the airbag lamp is on and that belt would not inflate."
    de: "B00F6 bezeichnet den Auslösekreis eines aufblasbaren Gurts auf dem Mittelplatz der dritten Reihe. Dort ist ein solcher Gurt am wenigsten zu erwarten: Die bekannten Seriensysteme sitzen an äußeren Fondplätzen, beim Ford Explorer nur in Reihe zwei, beim Mercedes-Beltbag an den äußeren Fondgurten. Das Handbuch des dreireihigen Mercedes GLS (2017) nennt für die Gurte der dritten Reihe Gurtstraffer und Gurtkraftbegrenzer, aber keinen Beltbag. Auch die NHTSA-Versuchsreihe zu Gurten prüfte den aufblasbaren Explorer-Gurt an einem Platz der zweiten Reihe. Joysons Studie zu gurtgebundenen Rückhaltesystemen für neue Innenraumkonzepte zeigt, wohin sich solche Luftsäcke ausbreiten könnten. Kein Hersteller veröffentlicht B00F6; ist er gesetzt, leuchtet die Airbag-Lampe, und dieser Gurt bliebe flach."
  affected_components:
    - third_row_center_inflatable_belt
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: configuration_mismatch
      likelihood: high
      label:
        en: Airbag module coded for a centre third-row inflatable belt the vehicle does not have
        de: Airbag-Steuergerät auf einen aufblasbaren Mittelgurt in Reihe drei codiert, den das Fahrzeug nicht hat
    - id: center_belt_connector
      likelihood: medium
      label:
        en: Inflator plug of the centre belt loosened when the third-row seat was folded or removed
        de: Stecker am Gasgenerator des Mittelgurts beim Umklappen oder Ausbau der dritten Sitzreihe gelöst
    - id: inflator_squib_fault
      likelihood: low
      label:
        en: Igniter in the centre belt inflator out of its resistance window
        de: Zünder im Gasgenerator des Mittelgurts außerhalb seines Widerstandsfensters
  symptoms:
    - en: Airbag warning lamp lit
      de: Airbag-Warnleuchte leuchtet
    - en: Centre third-row inflatable belt would not inflate in a crash
      de: Aufblasbarer Mittelgurt der dritten Reihe würde sich bei einem Unfall nicht füllen
    - en: "Safety note: igniter-equipped part – battery off, observe waiting time, work only in a specialist workshop"
      de: "Sicherheitshinweis: Bauteil mit Zünder – Batterie ab, Wartezeit einhalten, nur in der Fachwerkstatt arbeiten"
