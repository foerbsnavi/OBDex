- code: B0118
  category: body
  title:
    en: Camera Washer Actuator P
    de: Kamera-Wascher-Aktuator P
  description:
    en: "B0118 covers actuator P. Equipment can disappear in the middle of a model year. Ford's SSM 51564 notes that the 2023 Lincoln Aviator and the 2022–2023 Explorer and Police Interceptor Utility built from mid-July or August 2022 lost washing of the rear parking camera; the jet may still be fitted without a hose, which is normal and needs no repair. Should a module be configured for an actuator the car no longer carries, a missing-load code of this kind could follow. Asmo's US20110292212A1 shows the options designers pick from: a T-piece off the rear-window hose, a separate pump for each nozzle, or a diversion valve. No manufacturer documents B0118 or the camera behind P."
    de: "B0118 betrifft Aktor P. Ausstattung kann mitten im Modelljahr entfallen. Fords SSM 51564 hält fest, dass Explorer und Police Interceptor Utility 2022–2023 sowie Lincoln Aviator 2023 ab Baudatum Mitte Juli bzw. August 2022 keine Waschfunktion der hinteren Einparkkamera mehr haben; die Düse kann ohne Schlauch noch vorhanden sein, das ist normal und keine Reparatur nötig. Wäre ein Steuergerät auf einen Aktor codiert, den das Auto nicht mehr hat, könnte ein solcher Code wegen fehlender Last folgen. Asmos US20110292212A1 zeigt die Varianten, zwischen denen Konstrukteure wählen: ein T-Stück an der Heckscheibenleitung, eine eigene Pumpe je Düse oder ein Umschaltventil. Kein Hersteller dokumentiert B0118 oder die Kamera hinter P."
