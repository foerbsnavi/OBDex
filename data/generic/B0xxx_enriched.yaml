- code: B0033
  category: body
  title:
    en: Second Row Left Frontal Stage 3 Deployment Control
    de: Frontairbag zweite Sitzreihe links Stufe 3 Auslösesteuerung
  description:
    en: B0033 is the third deployment element of a frontal airbag for the left second-row seat. A third igniter can be a further gas chamber; a Breed patent describes an inflator with one igniter per chamber whose firing order and 0 to 25 ms delays the controller chooses. Mercedes-Benz fills the stage 3 slot of its front bags with the vent valve squib (B000313, B001213), a model for what stage 3 may mean behind a seat. No carmaker documents B0033 for a rear bag. GM bulletin 08-09-41-002H names B0033 with bytes 04, 0D and 0E in its CPA retainer bulletin for numerous GM cars and trucks of 2005 to 2014, where the number belongs to another GM loop. Airbag lamp on.
    de: "B0033 ist das dritte Auslöseelement eines Frontairbags für den linken Platz der zweiten Reihe. Ein dritter Zünder kann eine weitere Gaskammer sein: Ein Breed-Patent beschreibt einen Gasgenerator mit je einem Zünder pro Kammer, deren Reihenfolge und Abstand von 0 bis 25 ms das Steuergerät festlegt. Mercedes-Benz belegt den Stufe-3-Platz seiner vorderen Airbags mit der Zündpille des Abströmventils (B000313, B001213) – ein Hinweis, was Stufe 3 auch hinter einem Sitz bedeuten kann. Für einen Fond-Airbag dokumentiert kein Hersteller B0033. In GMs Bulletin 08-09-41-002H zu losen Steckersicherungen (zahlreiche Pkw und Pick-ups 2005–14) erscheint B0033 mit Byte 04, 0D und 0E – als anderer GM-Kreis. Airbag-Leuchte an."
