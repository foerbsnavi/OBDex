- code: B0062
  category: body
  title:
    en: Knee Airbag Deployment Loop Short to Ground
    de: Knieairbag Auslösekreis Kurzschluss nach Masse
  description:
    en: "None of the J2012 code lists we could check contain B0062; they jump from B0061 to B0070, and no carmaker describes it with the knee airbag meaning shown in the title. J2012 files knee airbag loops under B0004 for the driver and B0013 for the passenger, with the fault type in the added byte; Mercedes-Benz logs kneebag squib faults as B000413 and B001313, and in that scheme a grounded loop would carry byte 11 instead. The only public use of B0062 is at Saab: 9-3 airbag modules (manuals of 2003 and 2007) store it for the driver-side curtain or rollover bar loop, with byte 04 for open and 0E for resistance too high. Knee airbags sit in the lower dash; an IIHS study of 414 crash tests found little overall benefit for belted drivers."
    de: "B0062 steht in keiner der zugänglichen J2012-Codelisten, die von B0061 direkt zu B0070 springen, und kein Hersteller dokumentiert ihn mit der Knieairbag-Bedeutung des Titels. J2012 führt die Zündkreise der Knieairbags unter B0004 für den Fahrer und B0013 für den Beifahrer, die Fehlerart steht im angehängten Byte; Mercedes-Benz legt Fehler der Kniebag-Zündpillen als B000413 und B001313 ab; ein Masseschluss trüge in diesem Schema Byte 11. Öffentlich genutzt wird B0062 nur bei Saab: Airbagsteuergeräte des 9-3 (Handbücher 2003 und 2007) legen ihn für den Kreis von Kopfairbag bzw. Überrollbügel auf der Fahrerseite ab, mit Byte 04 für Unterbrechung und 0E für zu hohen Widerstand. Knieairbags sitzen in der unteren Instrumententafel; eine IIHS-Studie mit 414 Crashtests fand für angeschnallte Fahrer kaum Gesamtnutzen."
  affected_components:
    - knee_airbag
    - srs_wiring
    - srs_control_module
  common_causes:
    - id: knee_airbag_lead_chafed
      likelihood: high
      label:
        en: Knee airbag lead chafed against a dash bracket or steering column part
        de: Leitung des Knieairbags an Armaturenträger oder Lenksäulenteil durchgescheuert
    - id: knee_airbag_connector
      likelihood: medium
      label:
        en: Damaged knee airbag connector after work under the dashboard
        de: Beschädigter Knieairbagstecker nach Arbeiten unter der Instrumententafel
    - id: saab_curtain_loop
      likelihood: low
      label:
        en: "Saab 9-3: fault in the driver-side curtain or rollover bar loop instead"
        de: "Saab 9-3: stattdessen Fehler im Kreis von Kopfairbag oder Überrollbügel auf der Fahrerseite"
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Knee airbag may stay inactive in a frontal crash
      de: Knieairbag bleibt bei einem Frontalaufprall womöglich inaktiv
    - en: "Safety note: knee airbag plugs sit under the dashboard; do not probe the circuit and only unplug them with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Knieairbagstecker sitzen unter der Instrumententafel; Kreis nicht selbst messen, nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
  repair:
