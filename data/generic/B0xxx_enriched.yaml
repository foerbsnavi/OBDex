    - relay_control_circuit
    - sensor_cleaning_air_blower_b
  common_causes:
    - id: inrush_contact_wear
      likelihood: high
      label:
        en: Contacts of relay B pitted by high motor or compressor inrush current
        de: Kontakte von Relais B durch hohen Anlaufstrom von Motor oder Kompressor abgebrannt
    - id: relay_b_coil
      likelihood: medium
      label:
        en: Relay B coil or its suppression diode failed
        de: Spule von Relais B oder ihre Löschdiode ausgefallen
    - id: relay_b_socket
      likelihood: low
      label:
        en: Corroded relay socket or wrong relay type fitted
        de: Korrodierter Relaissockel oder falscher Relaistyp eingesetzt
  symptoms:
    - en: Blower or compressor B does not start, or will not switch off
      de: Gebläse bzw. Kompressor B startet nicht oder schaltet nicht ab
    - en: Droplets stay on sensor windows in rain
      de: Bei Regen bleiben Tropfen auf den Sensorfenstern
    - en: Assistance functions drop out when a sensor is reported blocked
      de: Assistenzfunktionen fallen aus, wenn ein Sensor als blockiert gemeldet wird
