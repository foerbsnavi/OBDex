- code: B010A
  category: body
  title:
    en: Camera Washer Actuator A
    de: Kamera-Wascher-Aktuator A
  description:
    en: "B010A opens a row of eighteen camera washer actuators, lettered A to S with I left out. The actuator is the electrically driven part that sends fluid to one camera lens: a pump of its own or a valve on a shared line. Continental's patent US11673532B2 (filed 2019) shows the layout such a row implies: front, side and rear cameras, each with its own nozzle and valve, fed by one or more pumps and switched by a controller that washes when the picture looks blocked and always cleans the rear lens in reverse. Solero sells electromagnetic valves in 2/2- and 3/2-way form for this job, and Valeo builds complete camera cleaning systems including the control unit. Makers keep the camera behind letter A to themselves; B010A appears in no public manufacturer document. The camera keeps working; only its wash is lost."
    de: "B010A eröffnet eine Reihe von achtzehn Kamera-Wascheraktoren, benannt von A bis S ohne I. Aktor ist das elektrisch angesteuerte Teil, das einer Kameralinse Flüssigkeit zuführt: eine eigene Pumpe oder ein Ventil an einer gemeinsamen Leitung. Continentals Patent US11673532B2 (angemeldet 2019) zeigt den Aufbau, den die Reihe nahelegt: Front-, Seiten- und Heckkamera mit je eigener Düse und eigenem Ventil, versorgt von einer oder mehreren Pumpen und geschaltet von einem Steuergerät, das bei verdecktem Bild wäscht und die Heckkamera im Rückwärtsgang immer reinigt. Solero bietet dafür elektromagnetische 2/2- und 3/2-Wegeventile an, Valeo komplette Kamerareinigungen samt Steuergerät. Die Kamera hinter Buchstabe A behalten die Hersteller für sich; B010A steht in keinem öffentlichen Herstellerdokument. Die Kamera bleibt nutzbar, nur ungereinigt."
  affected_components:
    - camera_washer_actuator_a
    - washer_pump
    - actuator_wiring
  common_causes:
    - id: actuator_a_open_or_shorted
      likelihood: high
      label:
        en: Valve coil or pump motor of actuator A open or shorted
        de: Ventilspule oder Pumpenmotor von Aktor A unterbrochen oder kurzgeschlossen
    - id: actuator_a_connector
      likelihood: medium
      label:
        en: Corroded or loose plug at actuator A, which sits in the splash zone near the camera
        de: Korrodierter oder lockerer Stecker an Aktor A, der im Spritzbereich nahe der Kamera sitzt
    - id: module_output_stage
      likelihood: low
      label:
        en: Driver stage in the controlling module defective
        de: Endstufe im ansteuernden Steuergerät defekt
  symptoms:
    - en: The camera assigned to actuator A is no longer washed, neither on request nor automatically
      de: Die Aktor A zugeordnete Kamera wird weder auf Anforderung noch automatisch gewaschen
    - en: Camera view stays dirty in rain, mud or road salt; a camera blocked message may appear
      de: Kamerabild bleibt bei Regen, Schlamm oder Streusalz verschmutzt; eventuell Meldung „Kamera verdeckt“
  repair:
