- code: B0061
  category: body
  title:
    en: Passenger Seat Belt Tension Sensor
    de: Gurtkraftsensor Beifahrer
  description:
    en: B0061 covers the belt tension sensor of the front passenger seat, a key input for passenger occupant classification. FMVSS 208 lets carmakers meet the child-seat rules for advanced airbags by fitting a system that automatically switches the passenger airbag off for small occupants. A child seat strapped in tightly presses into the cushion and can look as heavy as an adult on the weight sensor; the tension sensor exposes that. Delphi's patent lets the occupant module subtract belt load from seat weight and suppress the airbag above a calibrated pull of about 30 lb, and the sensor reports out-of-range values as faults. No carmaker documents B0061 publicly with this meaning. Saab 9-3 modules use it for a low driver curtain loop resistance.
    de: B0061 gilt dem Gurtkraftsensor des Beifahrersitzes, einer wichtigen Eingangsgröße der Insassenklassifizierung. FMVSS 208 erlaubt, die Kindersitz-Anforderungen an moderne Airbags mit einer automatischen Abschaltung zu erfüllen, die den Beifahrerairbag bei kleinen Insassen deaktiviert. Ein straff festgezurrter Kindersitz drückt ins Polster und kann auf dem Gewichtssensor wie ein Erwachsener wirken; der Gurtkraftsensor deckt das auf. Im Delphi-Patent zieht das Insassenmodul die Gurtkraft vom Sitzgewicht ab und schaltet den Airbag oberhalb eines kalibrierten Zugs von etwa 30 lb ab; Werte außerhalb des Bereichs meldet der Sensor als Fehler. Mit dieser Bedeutung dokumentiert kein Hersteller B0061 öffentlich. Steuergeräte des Saab 9-3 nutzen ihn für zu niedrigen Widerstand im Kreis des Fahrer-Kopfairbags.
  affected_components:
    - seat_belt_tension_sensor
    - occupant_detection_module
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: tension_sensor_connector
      likelihood: high
      label:
        en: Loose or corroded plug at the passenger belt tension sensor
        de: Lockerer oder korrodierter Stecker am Gurtkraftsensor des Beifahrers
    - id: tension_sensor_fault
      likelihood: medium
      label:
        en: Tension sensor reading out of range or stuck
        de: Messwert des Gurtkraftsensors außerhalb des Bereichs oder eingefroren
    - id: occupant_module_input
      likelihood: low
      label:
        en: Input fault in the occupant classification or airbag module
        de: Eingangsfehler im Insassenklassifizierungs- oder Airbagsteuergerät
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger airbag status indicator may show an unexpected on or off state
      de: Statusanzeige des Beifahrerairbags zeigt womöglich unerwartet an oder aus
    - en: A tightly fastened child seat may not be recognised reliably
      de: Ein straff befestigter Kindersitz wird womöglich nicht sicher erkannt
    - en: "Safety note: the sensor plug sits beside the passenger seat near airbag and pretensioner plugs; only unplug it with the battery disconnected and the wait time observed"
      de: "Sicherheitshinweis: Der Sensorstecker liegt neben dem Beifahrersitz nahe Airbag- und Strafferstecker; nur spannungsfrei trennen – Batterie abklemmen und Wartezeit einhalten"
