- code: B00DF
  category: body
  title:
    en: Passenger Restraints Disable Switch
    de: Abschaltschalter Beifahrer-Rückhaltesystem
  description:
    en: "B00DF is set for the key switch that lets the passenger airbag be turned off by hand. FMVSS 208 S4.5.4 allowed it on vehicles built before September 2012 with no forward rear seats or a short rear row; it must take the key, stay apart from the ignition and keep the bag off until switched back, and 49 CFR 595.5 governs retrofits under an NHTSA letter. Two makers use the code. FCA describes B00DF-95, incorrect assembly, on 2018–2021 Jeep Wrangler built without the on/off switch option CGZ: unused dash harness circuits R167/R168 should be checked and isolated at the ORC. Ford reports B00DF:4A after self-tests on 2024 Nautilus, from an internal counter fixed over the air, and on 2026–2027 Transit, cleared with FDRS. A real fault lights the airbag lamp."
    de: "B00DF betrifft den Schlüsselschalter, mit dem sich der Beifahrerairbag von Hand abschalten lässt. FMVSS 208 S4.5.4 erlaubte ihn bei Fahrzeugen vor September 2012 ohne nach vorn gerichtete Rücksitze oder mit kurzem Fond; er muss per Schlüssel bedient werden, getrennt vom Zündschloss sein und den Airbag aus lassen, bis er zurückgestellt wird. Nachrüstungen auf NHTSA-Schreiben regelt 49 CFR 595.5. Zwei Hersteller nutzen den Code. FCA beschreibt B00DF-95, falsche Bestückung, beim Jeep Wrangler 2018–2021 ohne Schalteroption CGZ: Ungenutzte Leitungen R167/R168 im Armaturenkabelbaum prüfen und am ORC abtrennen. Ford meldet B00DF:4A nach dem Selbsttest beim Nautilus 2024, verursacht durch einen internen Zähler und per Funk behoben, und beim Transit 2026–2027, löschbar mit FDRS. Ein echter Fehler schaltet die Airbag-Leuchte ein."
  affected_components:
    - passenger_disable_switch
    - switch_wiring
    - srs_control_module
  common_causes:
    - id: unused_switch_circuit
      likelihood: medium
      label:
        en: Switch circuits present in the harness of a vehicle without the switch, damaged or picking up faults (FCA B00DF-95)
        de: Schalterleitungen im Kabelbaum eines Fahrzeugs ohne Schalter beschädigt oder störanfällig (FCA B00DF-95)
    - id: switch_or_wiring_fault
      likelihood: medium
      label:
        en: Key switch worn or its lead open or shorted
        de: Schlüsselschalter verschlissen oder seine Leitung unterbrochen bzw. kurzgeschlossen
    - id: module_software
      likelihood: low
      label:
        en: Restraint module software counter or configuration error (Ford B00DF:4A)
        de: Software-Zähler oder Konfigurationsfehler im Rückhaltesteuergerät (Ford B00DF:4A)
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Passenger airbag does not follow the switch position, or the off lamp disagrees with it
      de: Beifahrerairbag folgt der Schalterstellung nicht, oder die Aus-Leuchte widerspricht ihr
    - en: "Safety note: passenger airbag state uncertain; no rear-facing child seat on that seat until checked, wiring and switch only de-energised (ignition off, battery off, wait time), specialist workshop"
      de: "Sicherheitshinweis: Zustand des Beifahrerairbags unklar; bis zur Prüfung keinen rückwärts gerichteten Kindersitz dort, Leitungen und Schalter nur spannungsfrei, Fachwerkstatt"
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [0, 400]
    estimated_hours: [0.2, 2]
  flags:
    mil: false
    emissions_relevant: false
