- code: B009D
  category: body
  title:
    en: Right Side Restraints Sensor 4
    de: Seitencrashsensor rechts 4
  description:
    en: "B009D opens the second half of the right-side sensor row, after B0096 to B0098. No carmaker documents this code publicly; Mitsubishi stops its right row at the C-pillar sensor B0098, and Honda's Fit and HR-V use only two side sensors per side. What a failing side satellite means in practice is shown by FCA recall 19V-449: on 2019 Jeep Cherokees the restraint controller could lose contact with acceleration sensors, which lit the airbag lamp and risked late or no deployment, so the sensors were replaced. Bosch's PSI5-linked SMA773 is an example of such a satellite, measuring two axes up to 60 g. A stored B009D therefore means the module has lost or rejected a fourth right sensor; its location comes from the maker's documentation. The airbag warning lamp stays lit."
    de: "B009D eröffnet die zweite Hälfte der rechten Sensorreihe nach B0096 bis B0098. Kein Hersteller dokumentiert diesen Code öffentlich; Mitsubishi endet rechts beim C-Säulen-Sensor B0098, Hondas Fit und HR-V kommen mit zwei Seitensensoren je Seite aus. Was ein ausgefallener Seitensatellit bedeutet, zeigt der FCA-Rückruf 19V-449: Beim Jeep Cherokee 2019 konnte das Rückhalte-Steuergerät den Kontakt zu Beschleunigungssensoren verlieren, die Airbag-Leuchte ging an, eine späte oder ausbleibende Auslösung drohte – die Sensoren wurden getauscht. Boschs SMA773 mit PSI5-Anbindung ist ein Beispiel für solche Satelliten und misst zwei Achsen bis 60 g. Ein gespeicherter B009D heißt also, dass das Steuergerät einen vierten Sensor rechts verloren oder verworfen hat; den Einbauort nennt der Hersteller. Die Airbag-Leuchte ist an."
