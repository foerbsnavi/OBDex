- code: B0019
  category: body
  title:
    en: Center Frontal Stage 2 Deployment Control
    de: Mittlerer Frontairbag Stufe 2 Auslösesteuerung
  description:
    en: "B0019 is the stage 2 member of the first-row center frontal series B0018 to B001A, meant for the second inflator charge of a middle-seat frontal airbag. No carmaker publicly documents the code with this meaning. General Motors uses B0019 widely, but for stage 1 of the passenger airbag in the instrument panel: on the Saab 9-4X 2011 sub-codes 01 and 02 mark shorts, 04 an open, 0D a loop reading that stays high and 0E one that stays low, while stage 2 of that bag is B0020. On the 2009-10 Chevrolet HHR, fretting corrosion in the in-line connector between body and dash harness raised loop resistance and set B0019 0D or 04 (PI0117B and a customer satisfaction program). On GM vehicles the passenger airbag therefore needs checking first. The airbag lamp is on."
    de: "B0019 ist das Stufe-2-Glied der Reihe B0018 bis B001A für den mittleren Frontairbag der ersten Reihe, gedacht für die zweite Treibladung eines solchen Airbags. Kein Hersteller dokumentiert den Code öffentlich in dieser Bedeutung. General Motors verwendet B0019 häufig, aber für den Zündkreis Stufe 1 des Beifahrerairbags in der Armaturentafel: Beim Saab 9-4X 2011 stehen die Unterbytes 01 und 02 für Kurzschlüsse, 04 für Unterbrechung, 0D für dauerhaft zu hohen und 0E für zu niedrigen Kreiswiderstand; Stufe 2 dieses Airbags ist B0020. Beim Chevrolet HHR 2009–10 ließ Reibkorrosion im Zwischenstecker zwischen Karosserie- und Armaturentafelkabelbaum den Widerstand steigen und setzte B0019 0D oder 04 (PI0117B, Kundenzufriedenheitsaktion). Bei GM also zuerst den Beifahrerairbag prüfen. Die Airbag-Leuchte ist an."
  affected_components:
    - center_frontal_airbag
    - passenger_airbag_module
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: gm_inline_connector_fretting
      likelihood: high
      label:
        en: On GM vehicles fretting corrosion in the passenger airbag in-line connector (HHR PI0117B)
        de: Bei GM Reibkorrosion im Zwischenstecker des Beifahrerairbags (HHR PI0117B)
    - id: center_airbag_stage2_loop
      likelihood: low
      label:
        en: Fault in the stage 2 loop of a first-row center frontal airbag (J2012 meaning)
        de: Fehler im Kreis Stufe 2 eines mittleren Frontairbags der ersten Reihe (J2012-Bedeutung)
    - id: airbag_module_fault
      likelihood: low
      label:
        en: Internal fault in the airbag module on this loop
        de: Innerer Fehler im Airbagmodul dieses Kreises
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: On GM the passenger frontal airbag stage 1 may not deploy
      de: Bei GM löst Stufe 1 des Beifahrer-Frontairbags womöglich nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
