- code: B0043
  category: body
  title:
    en: Third Row Left Frontal Stage 3 Deployment Control
    de: Frontairbag dritte Sitzreihe links Stufe 3 Auslösesteuerung
  description:
    en: "B0043 completes the left third-row frontal group as its stage 3 element. By analogy with front airbags this can be a vent valve squib, as Mercedes-Benz uses for B000313 and B001213, or a further gas chamber like the third chamber in Breed's patent that is kept for a second collision. No public source ties B0043 to a third-row bag. GM gives the number a separate, documented meaning in its older modules: the Saab 9-5 of 2006 stores B0043 if the driver stage 2 terminal sits above 4.1 V or under 1.0 V for 2 seconds, and the 9-3 splits it into shorts to supply, to ground or to another firing loop. Check which airbag the scan tool names. Airbag lamp on."
    de: "B0043 schließt die linke Frontgruppe der dritten Reihe als Element der Stufe 3 ab. Nach dem Vorbild der vorderen Airbags kann das eine Zündpille für ein Abströmventil sein, wie Mercedes-Benz sie unter B000313 und B001213 führt, oder eine weitere Gaskammer wie die dritte Kammer im Breed-Patent, die für einen Zweitaufprall bereitsteht. Keine öffentliche Quelle verbindet B0043 mit einem Airbag der dritten Reihe. GM hat der Nummer in älteren Steuergeräten eine eigene, belegte Bedeutung gegeben: Der Saab 9-5 2006 speichert B0043, wenn die Spannung am Pin der Stufe 2 des Fahrer-Frontairbags 2 Sekunden über 4,1 oder unter 1,0 Volt liegt, der 9-3 unterscheidet Schluss nach Plus, nach Masse oder zu einem anderen Zündkreis. Airbag-Leuchte an."
  affected_components:
    - third_row_left_frontal_airbag
    - squib_circuit
    - srs_seat_wiring
    - srs_control_module
  common_causes:
    - id: stage3_lead
      likelihood: medium
      label:
        en: Damaged stage 3 lead or squib
        de: Beschädigte Leitung oder Zündpille der Stufe 3
    - id: short_between_loops
      likelihood: low
      label:
        en: Short between two firing loops in a shared harness
        de: Schluss zwischen zwei Zündkreisen in einem gemeinsamen Kabelstrang
