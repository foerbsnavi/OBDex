- code: B007D
  category: body
  title:
    en: Second Row Center Seat Belt Pretensioner B Deployment Control
    de: Gurtstraffer B zweite Reihe Mitte Auslösesteuerung
  description:
    en: B007D names a second pretensioner at the middle seat of the second row. No carmaker documents it, and since even one pretensioner at the rear centre seat is uncommon, a second stage there is rarer still. Where such hardware is fitted, the B stage would act on the buckle or anchor side, comparable to the Autoliv pulley-and-cable buckle tensioner of patent US7360795B2 or the buckle units GM shows at the inner flank of front seats. Wiring to a rear centre position runs through the seat base or floor and can be disturbed when a split bench is folded or taken out. The firing loop is monitored like every other squib circuit. A stored B007D lights the airbag lamp, and the module treats that stage as unavailable.
    de: B007D bezeichnet einen zweiten Gurtstraffer am Mittelplatz der zweiten Reihe. Kein Hersteller dokumentiert ihn – schon ein einzelner Straffer hinten in der Mitte ist ungewöhnlich, eine zweite Stufe dort noch seltener. Wo es eine gibt, würde Stufe B am Gurtschloss oder am Gurtanker angreifen, vergleichbar mit dem Schlossstraffer mit Seilrolle aus dem Autoliv-Patent US7360795B2 oder den Schlossstraffern, die GM an der Innenseite der Vordersitze zeigt. Die Leitung zum hinteren Mittelplatz läuft durch Sitzunterbau oder Boden und kann beim Umklappen oder Ausbau einer geteilten Rückbank leiden. Überwacht wird der Zündkreis wie jeder andere. Mit gespeichertem B007D leuchtet die Airbag-Lampe, und das Steuergerät behandelt diese Stufe als nicht verfügbar.
  affected_components:
    - second_row_center_pretensioner_b
    - squib_circuit
    - srs_control_module
  common_causes:
    - id: center_seat_connector
      likelihood: high
      label:
        en: Plug at the rear centre buckle or anchor tensioner loosened by folding the bench
        de: Stecker am hinteren mittleren Schloss- oder Verankerungsstraffer durch Umklappen der Rückbank gelöst
    - id: configuration_mismatch
      likelihood: medium
      label:
        en: Airbag module coded for a rear centre B stage that is not present
        de: Airbagsteuergerät auf eine nicht vorhandene hintere mittlere Stufe B codiert
    - id: floor_harness_damage
      likelihood: low
      label:
        en: Harness under the rear bench chafed or pinched
        de: Kabelbaum unter der Rückbank durchgescheuert oder eingeklemmt
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Rear centre occupant without the second pretensioning stage
      de: Insasse hinten Mitte ohne zweite Straffer-Stufe
    - en: "Safety note: pyrotechnic belt hardware; de-energise the system (battery off, wait time) and have a specialist workshop do the work"
      de: "Sicherheitshinweis: pyrotechnische Gurtteile – System spannungsfrei machen (Batterie ab, Wartezeit) und die Arbeit einer Fachwerkstatt überlassen"
  repair:
    difficulty: shop_only
