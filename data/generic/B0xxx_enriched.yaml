- code: B0020
  category: body
  title:
    en: Left Side Airbag Deployment Control
    de: Seitenairbag links Auslösesteuerung
  description:
    en: B0020 covers the firing loop of the left front side airbag, the thorax bag usually built into the outer flank of the driver seat backrest. Toyota names B002011 and B002012 as short to ground and short to battery on the 2022 Tundra, where the wireless phone charger caused false entries that new SRS software cures (TSB005722). FCA reads B0020-13 as an open left seat squib on the 2014-17 Cherokee and the 2015-17 Chrysler 200 and fits new jumper harnesses in the seats (10-001-20). Honda collected parts from Accord, CR-V and TLX with the same byte 13, and Mitsubishi confirms each fault after 2 seconds. GM modules of about 2007-14 used B0020 for passenger frontal stage 2 instead, so check which bag the scan tool names. The airbag lamp is on.
    de: Hinter B0020 steht der Zündkreis des linken vorderen Seitenairbags, meist ein Thoraxairbag in der äußeren Wange der Fahrersitzlehne. Toyota führt beim Tundra 2022 B002011 und B002012 als Masse- bzw. Plusschluss; dort löste das kabellose Handy-Ladefach Fehleinträge aus, die neue SRS-Software beseitigt (TSB005722). FCA versteht B0020-13 bei Cherokee 2014–17 und Chrysler 200 2015–17 als offene Zündpille im linken Sitz und tauscht die Zwischenkabel in den Sitzen (10-001-20). Honda sammelte Teile von Accord, CR-V und TLX mit demselben Byte 13; Mitsubishi bestätigt jeden Fehler nach 2 Sekunden. GM-Steuergeräte etwa der Jahre 2007–14 belegen B0020 dagegen mit Beifahrer-Frontairbag Stufe 2 – also prüfen, welches Bauteil der Tester nennt. Die Airbag-Leuchte brennt.
  affected_components:
    - left_side_airbag_module
    - srs_control_module
    - srs_seat_wiring
    - seat_harness_connector
  common_causes:
    - id: seat_harness_connector
      likelihood: high
      label:
        en: Poor contact or corrosion at the side airbag connector or jumper harness under or in the seat
        de: Schlechter Kontakt oder Korrosion am Seitenairbagstecker bzw. Zwischenkabel unter oder im Sitz
    - id: side_airbag_fault
      likelihood: medium
      label:
        en: Internal fault in the left seat side airbag module
        de: Innerer Fehler im linken Sitz-Seitenairbagmodul
    - id: seat_harness_damage
      likelihood: medium
      label:
        en: Pinched or chafed side airbag lead in the seat frame
        de: Eingeklemmte oder durchgescheuerte Seitenairbagleitung im Sitzgestell
    - id: rcm_software_interference
      likelihood: low
      label:
        en: Restraint module software reacting to interference, e.g. Toyota Tundra 2022 with wireless charger
        de: Steuergerätesoftware reagiert auf Störungen, z. B. Toyota Tundra 2022 mit kabellosem Ladefach
  symptoms:
    - en: Airbag warning lamp on
      de: Airbag-Warnleuchte an
    - en: Left front side airbag may not deploy in a side impact
      de: Linker vorderer Seitenairbag löst bei einem Seitenaufprall eventuell nicht aus
    - en: "Safety note: do not probe the airbag circuit yourself; unplug airbag connectors only with the battery disconnected and the stated wait time observed"
      de: "Sicherheitshinweis: Airbagkreis nicht selbst durchmessen; Airbagstecker nur bei abgeklemmter Batterie und nach der vorgeschriebenen Wartezeit trennen"
