- code: P3470
  category: powertrain
  title:
    en: Cylinder 9 Exhaust Valve Control Performance
    de: Zylinder 9 Auslassventil Steuerung Funktion
  description:
    en: "P3470 covers a cylinder 9 exhaust valve that does not follow its deactivation command although the control circuit shows no electrical fault. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The risk behind it is described in a Ford patent: an exhaust valve that keeps opening after shut-off spoils the gas cushion in the cylinder and can be detected from changes in exhaust pressure. The opposite case, a valve that stays shut on reactivation, traps hot gas under pressure. Neither the Lamborghini Aventador V12 nor the Huracán V10 publishes how their bank shut-off works, and Audi's V10 simply cuts injection and ignition, so this check has no known user. Electrical faults of the same actuator: P3469, P3471, P3472."
    de: "P3470 betrifft ein Auslassventil an Zylinder 9, das dem Abschaltbefehl nicht folgt, obwohl der Steuerkreis elektrisch einwandfrei ist. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Welches Risiko dahintersteckt, zeigt ein Ford-Patent: Öffnet das Auslassventil nach der Abschaltung weiter, geht das Gaspolster verloren, was sich an Änderungen des Abgasdrucks erkennen lässt. Bleibt es umgekehrt beim Zuschalten zu, sperrt es heißes Gas unter Druck ein. Wie die Bankabschaltung von Lamborghini Aventador (V12) und Huracán (V10) technisch arbeitet, ist nicht veröffentlicht, und Audis V10 setzt nur Einspritzung und Zündung aus – ein Anwender dieser Prüfung ist nicht bekannt. Elektrische Fehler desselben Stellglieds: P3469, P3471, P3472."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust switching element of cylinder 9 stuck
        de: Schaltelement am Auslass von Zylinder 9 hängt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Insufficient oil pressure for the exhaust switch
        de: Zu geringer Öldruck für die Auslassumschaltung
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator sluggish
        de: Auslass-Stellglied schwergängig
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Knock or jolt when cylinder 9 comes back in
      de: Schlag oder Ruck, wenn Zylinder 9 wieder zuschaltet
    - en: Misfire on cylinder 9 (P0309)
      de: Fehlzündungen auf Zylinder 9 (P0309)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
