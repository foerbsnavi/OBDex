- code: P34C0
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit Bank 2
    de: Nockenwellenversteller B Positionssensor A Stromkreis Bank 2
  description:
    en: "P34C0 is the generic circuit fault of position sensor A belonging to camshaft actuator B of bank 2 and therefore appears only on V-type or other two-bank engines. Mercedes-Benz files the bank 2 exhaust feedback of its CAMTRONIC V8 (M176/M177) under neighbouring codes – P34C1 for an implausible signal, P34C2 for a grounded one – but P34C0 itself is absent from its bulletin, and no other carmaker has published it. Diagnosis therefore stays general: supply, ground and signal line between module and actuator, then the actuator with its built-in sensor. If P34BC is set as well, shared feeds and grounds deserve a look before any part is swapped. NTN-SNR describes P34C0 as an electrical fault at the outlet side. The remaining fault types for this sensor are P34C1 to P34C3."
    de: "P34C0 ist der allgemeine Kreisfehler von Positionssensor A am Nockenwellenversteller B auf Bank 2 und kommt daher nur an Zweibank-Motoren vor. Mercedes-Benz führt die Auslass-Rückmeldung von Bank 2 seines CAMTRONIC-V8 (M176/M177) unter benachbarten Codes – P34C1 bei unplausiblem Signal, P34C2 bei Masseschluss –, P34C0 selbst steht nicht im Bulletin, und auch sonst hat ihn kein Hersteller veröffentlicht. Die Diagnose bleibt deshalb allgemein: Versorgung, Masse und Signalleitung zwischen Steuergerät und Steller, danach der Steller mit eingebautem Sensor. Ist zugleich P34BC gesetzt, verdienen gemeinsame Versorgungen und Massen einen Blick, bevor Teile getauscht werden. NTN-SNR nennt den Code einen elektrischen Fehler der Auslassseite. Die übrigen Fehlerarten dieses Sensors: P34C1 bis P34C3."
  affected_components:
    - cam_actuator_b_pos_sensor_b2
    - sensor_wiring
  common_causes:
    - id: bank2_wiring
      likelihood: high
      label:
        en: Wiring or plug at the bank 2 exhaust actuator open
        de: Leitung oder Stecker am Auslass-Steller von Bank 2 unterbrochen
    - id: common_feed
      likelihood: medium
      label:
        en: Shared sensor feed or ground faulty (if P34BC is also stored)
        de: Gemeinsame Sensorversorgung oder Masse fehlerhaft (wenn auch P34BC gespeichert)
    - id: actuator_sensor
      likelihood: medium
      label:
        en: Sensor in the bank 2 actuator failed
        de: Sensor im Steller von Bank 2 defekt
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Exhaust adjustment on bank 2 disabled
      de: Auslassverstellung auf Bank 2 deaktiviert
