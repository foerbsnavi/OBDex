- code: P3474
  category: powertrain
  title:
    en: Cylinder 10 Deactivation/Intake Valve Control Performance
    de: Zylinder 10 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3474 is about function rather than wiring: cylinder 10 should shut down or come back, but measured engine behaviour says it did not, while its control circuit is intact. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Audi's R8 V10, one of the few ten-cylinder engines with shut-off, works without valve switching; Audi reserves the valve-closing method with zero-lift cams on axially sliding sleeves for its 4.0 TFSI V8. Where valve deactivation is used, causes lie in the oil supply or in a sticking switching element, and NHTSA's description of GM's lifters with oil-pressure locking pins shows how small leaks spoil the switch. P3473, P3475 and P3476 are the electrical codes of cylinder 10."
    de: "Bei P3474 geht es um die Funktion, nicht um die Verkabelung: Zylinder 10 soll abschalten oder zurückkommen, das gemessene Motorverhalten spricht aber dagegen, während der Steuerkreis intakt ist. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Audis R8-V10, einer der wenigen Zehnzylinder mit Abschaltung, kommt ohne Ventilschaltung aus; das Schließen der Ventile mit Nullhub-Nocken auf axial verschiebbaren Hülsen setzt Audi beim 4.0-TFSI-V8 ein. Wo Ventile abgeschaltet werden, liegen die Ursachen in der Ölversorgung oder in einem klemmenden Schaltelement; wie empfindlich das ist, zeigt die NHTSA-Beschreibung von GMs Stößeln mit öldruckbetätigten Sperrstiften. Die elektrischen Codes von Zylinder 10 sind P3473, P3475 und P3476."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Oil pressure or oil condition not sufficient to switch cylinder 10
        de: Öldruck oder Ölzustand reicht zum Umschalten von Zylinder 10 nicht
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Lifter or cam sleeve at cylinder 10 sticking
        de: Stößel oder Nockenhülse an Zylinder 10 klemmt
    - id: oil_screen_blocked
      likelihood: medium
      label:
        en: Oil screen or passage to the cylinder 10 actuator blocked
        de: Ölsieb oder Kanal zum Stellglied von Zylinder 10 zugesetzt
    - id: solenoid_oring_leak
      likelihood: low
      label:
        en: Leaking seal at the actuator
        de: Undichte Dichtung am Stellglied
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire on cylinder 10 (P0310)
      de: Fehlzündungen auf Zylinder 10 (P0310)
    - en: Tapping noise from the valve train
      de: Klappern aus dem Ventiltrieb
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3473, P3475, P3476, P3478, P0310, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
