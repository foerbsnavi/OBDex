- code: P3436
  category: powertrain
  title:
    en: Cylinder 5 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 5 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3436 is the short-to-power code for the cylinder 5 deactivation valve. Publicly it is documented by GM for the L84 V8 (2019), where Dynamic Fuel Management uses a dedicated valve lifter oil solenoid for each of the eight cylinders. The engine computer checks the line while its low-side driver is on; an impedance below 0.5 ohm toward supply voltage counts as a fault, confirmed by 20 of 25 samples at 250 ms, with at least 11 V and 425 rpm. As a Type B code it lights the lamp after two consecutive trips. Because the solenoid then cannot be switched in a controlled way, cylinder 5 is excluded from deactivation. Siblings: P3433 open, P3435 short to ground, P3434 function."
    de: "P3436 ist der Plusschluss-Code für das Abschaltventil von Zylinder 5. Öffentlich belegt ist er bei GM für den V8 L84 (2019), dessen Dynamic Fuel Management für jeden der acht Zylinder ein eigenes Stößel-Öl-Magnetventil nutzt. Das Steuergerät prüft die Leitung bei eingeschalteter Low-Side-Endstufe; ein Widerstand unter 0,5 Ohm zur Versorgungsspannung gilt als Fehler, bestätigt durch 20 von 25 Messungen alle 250 ms bei mindestens 11 V und 425 U/min. Als Type-B-Code schaltet er die Lampe nach zwei Fahrten in Folge ein. Da sich das Ventil dann nicht kontrolliert schalten lässt, nimmt das Steuergerät Zylinder 5 aus der Abschaltung. Geschwister: P3433 Unterbrechung, P3435 Masseschluss, P3434 Funktion."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Control wire touching a voltage supply
        de: Steuerleitung berührt eine Spannungsversorgung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted coil in the cylinder 5 solenoid
        de: Windungsschluss im Magnetventil von Zylinder 5
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage defect
        de: Defekt der Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp after two trips
      de: Motorkontrollleuchte nach zwei Fahrten
    - en: Dynamic Fuel Management disabled
      de: Dynamic Fuel Management abgeschaltet
  repair:
    difficulty: medium
    diy_possible: true
