- code: P340B
  category: powertrain
  title:
    en: Deactivation/Intake Valve Control Circuit Bank 2
    de: Abschaltung/Einlassventil Steuerkreis Bank 2
  description:
    en: P340B mirrors P340A for bank 2, the bank that does not contain cylinder 1, so it only applies to V or boxer engines. It marks an electrical fault in a control circuit that switches the intake valves of that whole bank at once. No manufacturer documents this code publicly. The widespread V8 systems put the deactivating cylinders of bank 2, cylinders 4 and 6 on GM and Chrysler engines, on their own solenoids and report them as P3425 or P3441. Honda's VCM V6 watches bank 2 via a rocker arm oil pressure switch and stores P3497. CARB asks for circuit checks of such outputs. The bank 1 counterpart is P340A, the bank 2 exhaust circuit P340D, the function code P341B. Usually the only effects are the lamp and lost economy.
    de: P340B ist das Gegenstück zu P340A für Bank 2, also die Bank ohne Zylinder 1 – er betrifft nur V- oder Boxermotoren. Gemeldet wird ein elektrischer Fehler in einem Steuerkreis, der die Einlassventile dieser ganzen Bank gemeinsam schaltet. Kein Hersteller dokumentiert den Code öffentlich. Die verbreiteten V8-Systeme versorgen die abschaltbaren Zylinder der Bank 2, bei GM und Chrysler die Zylinder 4 und 6, mit eigenen Ventilen und melden sie als P3425 oder P3441. Hondas VCM-V6 überwacht Bank 2 über einen Öldruckschalter der Kipphebel und speichert dann P3497. CARB fordert für solche Ausgänge eine Kreisprüfung. Bank 1 ist P340A, der Auslasskreis von Bank 2 P340D, der Funktionscode P341B. Meist bleibt es bei Leuchte und Mehrverbrauch.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_fault
      likelihood: medium
      label:
        en: Chafed, open or shorted wire to the bank 2 actuator
        de: Durchgescheuerte, unterbrochene oder kurzgeschlossene Leitung zum Stellglied von Bank 2
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Oil or moisture in the bank 2 actuator connector
        de: Öl oder Feuchtigkeit im Stecker des Stellglieds von Bank 2
    - id: actuator_coil_fault
      likelihood: medium
      label:
        en: Defective bank 2 intake deactivation actuator coil
        de: Defekte Spule des Einlass-Abschaltstellglieds von Bank 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Fehler in der Endstufe des Motorsteuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs on all cylinders permanently
      de: Motor läuft dauerhaft mit allen Zylindern
    - en: Slightly higher fuel consumption
      de: Leicht erhöhter Verbrauch
  repair:
    difficulty: medium
    diy_possible: true
