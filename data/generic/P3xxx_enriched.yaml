- code: P3408
  category: powertrain
  title:
    en: Cylinder 1 Exhaust Valve Control Circuit High
    de: Zylinder 1 Auslassventil Steuerkreis hoch
  description:
    en: "If an engine has its own actuator for the exhaust valves of cylinder 1, P3408 marks a control circuit that reads high, usually a short to battery voltage. No manufacturer documents this code publicly. For comparison, GM checks the intake-side P3404 with the driver switched on and flags under 0.5 ohm to supply. A GM patent application switches intake and exhaust valves together through one shared hydraulic valve, exhaust side first, and describes no separate exhaust channel either. With one solenoid per cylinder, as on GM's DFM, the code is not needed. Siblings: P3405 open, P3406 function, P3407 short to ground; P3404 is the intake-side equivalent."
    de: "Hat ein Motor ein eigenes Stellglied für die Auslassventile von Zylinder 1, kennzeichnet P3408 einen zu hohen Pegel im Steuerkreis, meist einen Schluss nach Batteriespannung. Kein Hersteller dokumentiert diesen Code öffentlich. Zum Vergleich prüft GM das einlassseitige P3404 bei eingeschalteter Endstufe und meldet unter 0,5 Ohm zur Versorgung. Auch eine GM-Patentanmeldung schaltet Ein- und Auslassventile gemeinsam über ein Hydraulikventil, die Auslassseite zuerst, und kennt keinen eigenen Auslasskanal. Mit einem Ventil je Zylinder wie bei GMs DFM entfällt der Code. Geschwister: P3405 Unterbrechung, P3406 Funktion, P3407 Masseschluss; P3404 ist das Gegenstück auf der Einlassseite."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Control wire shorted to a supply voltage
        de: Steuerleitung mit einer Versorgungsspannung verbunden
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted coil in the exhaust valve actuator
        de: Windungsschluss im Auslassventil-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage fault in the engine control module
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled
      de: Zylinderabschaltung gesperrt
  repair:
