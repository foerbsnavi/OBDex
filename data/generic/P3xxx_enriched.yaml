    - https://www.ntn-snr.com/sites/default/files/2025-07/TECHinfo_CMP_UK.pdf
    - https://patents.google.com/patent/US20220003132A1/en
    - https://static.nhtsa.gov/odi/tsbs/2018/MC-10130502-9999.pdf
