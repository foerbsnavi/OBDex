- code: P34BF
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit High Bank 1
    de: Nockenwellenversteller B Positionssensor A Stromkreis zu hoch Bank 1
  description:
    en: "P34BF: on bank 1, sensor A of the camshaft B actuator, i.e. the exhaust side, sends more voltage than allowed. An open ground, a signal wire in contact with a feed or an internally open sensor are the usual explanations. Mercedes-Benz documents low and implausible signals for this sensor on its CAMTRONIC V8 (P34BE, P34BD), but no high fault; other manufacturers do not mention the code either. On Mitsubishi's electric intake phaser the matching high code P34AF parks the motor in its reference position, and an electric exhaust actuator would presumably react in a similar way. CARB counts the sensors of a VVT system among the comprehensive components, whose out-of-range values must be detected. Low on bank 1: P34BE; high on bank 2: P34C3."
    de: "P34BF: Am Auslass-Steller der Bank 1 (Nockenwelle B) liefert Positionssensor A ein Signal über der Obergrenze. Üblich sind eine unterbrochene Masse, eine Signalleitung, die an einer Versorgung anliegt, oder ein innen offener Sensor. Mercedes-Benz belegt für diesen Sensor am CAMTRONIC-V8 zu niedrige und unplausible Signale (P34BE, P34BD), aber keinen Hochfehler; auch andere Hersteller erwähnen den Code nicht. Bei Mitsubishis elektrischem Einlassversteller setzt der entsprechende Hochcode P34AF den Motor in seine Referenzlage, und ein elektrischer Auslass-Steller dürfte ähnlich reagieren. CARB zählt die Sensoren der Ventilverstellung zu den umfassend zu überwachenden Bauteilen, deren Werte außerhalb des Bereichs erkannt werden müssen. Zu niedrig auf Bank 1: P34BE, zu hoch auf Bank 2: P34C3."
  affected_components:
    - cam_actuator_b_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: ground_open
      likelihood: high
      label:
        en: Sensor ground interrupted or plug corroded
        de: Sensormasse unterbrochen oder Stecker korrodiert
    - id: short_to_supply
      likelihood: medium
      label:
        en: Signal line shorted to a supply wire
        de: Signalleitung mit Schluss zu einer Versorgungsleitung
    - id: actuator_sensor_open
      likelihood: medium
      label:
        en: Sensor in the exhaust actuator open internally
        de: Sensor im Auslass-Steller innen unterbrochen
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Exhaust adjustment on bank 1 kept in its reference position
      de: Auslassverstellung auf Bank 1 in Referenzlage gehalten
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
  flags:
