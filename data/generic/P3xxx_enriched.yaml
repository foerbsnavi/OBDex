- code: P3420
  category: powertrain
  title:
    en: Cylinder 3 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 3 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3420 reports that the cylinder 3 deactivation control line carries supply voltage where the module expects to pull it low. On GM's L84 the test runs only while the low-side output is switched on: a connection to battery voltage below 0.5 ohm, confirmed in 20 out of 25 samples, sets a Type B code. According to NHTSA's 2025 investigation into GM's DFM V8s, every cylinder has exactly one lifter oil solenoid, run by a peak-and-hold driver, so a single short disables the whole cylinder's switching. The Gen IV controller also has a separate high-side stage for this solenoid with its own codes, which helps tell which half of the circuit failed. P3419 covers the short to ground. The engine just keeps all eight cylinders working."
    de: "P3420 meldet, dass an der Steuerleitung für die Abschaltung von Zylinder 3 Versorgungsspannung liegt, wo das Steuergerät sie nach Masse ziehen will. Beim L84 von GM läuft der Test nur bei eingeschaltetem Low-Side-Ausgang: Eine Verbindung zur Batteriespannung unter 0,5 Ohm, bestätigt in 20 von 25 Proben, setzt einen Type-B-Code. Laut NHTSA-Untersuchung 2025 zu GMs DFM-V8 hat jeder Zylinder genau ein Öl-Magnetventil für die Stößel, angesteuert nach dem Peak-and-Hold-Prinzip; ein einziger Schluss legt also die Umschaltung des ganzen Zylinders lahm. Das Gen-IV-Steuergerät hat für dieses Ventil zusätzlich eine High-Side-Stufe mit eigenen Codes, was hilft, die defekte Kreishälfte einzugrenzen. P3419 deckt den Masseschluss ab. Der Motor arbeitet einfach mit allen acht Zylindern weiter."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Control wire of cylinder 3 touching a powered conductor
        de: Steuerleitung von Zylinder 3 berührt einen spannungsführenden Leiter
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 3 solenoid winding
        de: Windungsschluss in der Wicklung des Ventils von Zylinder 3
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output transistor in the engine control module damaged
        de: Ausgangstransistor im Motorsteuergerät beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Fuel economy mode unavailable
      de: Sparbetrieb nicht verfügbar
  repair:
