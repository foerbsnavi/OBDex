    - https://patents.google.com/patent/US20070240659A1/en
    - https://patents.google.com/patent/US8006670B2/en
  reviewed: '2026-11-02'

- code: P3439
  category: powertrain
  title:
    en: Cylinder 5 Exhaust Valve Control Circuit Low
    de: Zylinder 5 Auslassventil Steuerkreis niedrig
  description:
    en: P3439 would report a short to ground in the control circuit of a dedicated exhaust valve actuator on cylinder 5. No manufacturer documents this code publicly, and no threshold is published for it. The closest documented reference is the intake-side P3435, which GM's L84 sets at under 0.5 ohm to ground with the driver off, after 20 of 25 samples. CARB's output component rules call for exactly this kind of short-circuit check on any actuator that can affect emissions. Engines that switch both valves of cylinder 5 with one solenoid report a short only through P3435. Exhaust-side siblings are P3437 (open), P3438 (function) and P3440 (short to power).
    de: P3439 würde einen Masseschluss im Steuerkreis eines eigenen Auslassventil-Stellglieds an Zylinder 5 melden. Kein Hersteller dokumentiert diesen Code öffentlich, eine Schwelle ist nicht veröffentlicht. Der nächste belegte Bezug ist das einlassseitige P3435, das GMs L84 bei unter 0,5 Ohm nach Masse und ausgeschalteter Endstufe nach 20 von 25 Messungen setzt. Die CARB-Regeln für Ausgangskomponenten verlangen genau diese Kurzschlussprüfung bei jedem abgasrelevanten Stellglied. Motoren, die beide Ventile von Zylinder 5 über ein Magnetventil schalten, melden einen Schluss nur über P3435. Auslassseitige Geschwister sind P3437 (Unterbrechung), P3438 (Funktion) und P3440 (Plusschluss).
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Control wire of the exhaust actuator grounded
        de: Steuerleitung des Auslass-Stellglieds an Masse
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internally shorted exhaust actuator
        de: Innen kurzgeschlossenes Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty engine control module output
        de: Defekter Ausgang im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs on all cylinders only
      de: Motor läuft nur noch mit allen Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
