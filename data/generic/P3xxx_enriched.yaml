        de: Steuerleitung von Zylinder 11 berührt Batteriespannung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Cylinder 11 actuator coil with shorted turns
        de: Spule des Stellglieds von Zylinder 11 mit Windungsschluss
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module driver damaged
        de: Treiber im Steuergerät beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Reduced-cylinder mode cancelled
      de: Teilzylinderbetrieb abgebrochen
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
