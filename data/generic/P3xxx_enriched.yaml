        de: Steuerventil von Zylinder 3 klemmt oder sein Sieb ist zugesetzt
    - id: oil_pressure_out_of_range
      likelihood: low
      label:
        en: Oil pressure too high or too low for the switching window
        de: Öldruck zu hoch oder zu niedrig für das Schaltfenster
  symptoms:
    - en: Misfire code for cylinder 3 (P0303)
      de: Fehlzündungscode für Zylinder 3 (P0303)
    - en: Shudder when the engine changes between modes
      de: Ruckeln beim Wechsel der Betriebsart
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
