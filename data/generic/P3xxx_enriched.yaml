- code: P34AA
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit Low Bank 2
    de: Nockenwellenversteller A Temperaturfühler Stromkreis zu niedrig Bank 2
  description:
    en: P34AA reports that the temperature sensor of the bank 2 intake cam actuator signals a voltage below its permitted range. Whether that equals a hot reading depends on the sensor design, which no public source names; with the common NTC thermistor it would mimic overheating, and the controller could limit the actuator current or stop phasing on that bank. In practice a signal wire grounded against the cylinder head, cables pinched during earlier engine work or a shorted sensor are the usual suspects. NTN-SNR lists P34AA as too small a signal of the inlet temperature sensor on the second bank; a manufacturer text is not public. Compare bank 1 (P34A6) and the high code P34AB.
    de: Mit P34AA meldet der Temperaturfühler am Einlassversteller von Bank 2 eine Spannung unterhalb des erlaubten Bereichs. Ob das einem Heißwert entspricht, hängt von der Bauart ab, die keine öffentliche Quelle nennt; bei einem gängigen NTC-Heißleiter sähe es wie Überhitzung aus, und das Steuergerät könnte den Stellerstrom begrenzen oder die Verstellung dieser Bank aussetzen. In der Praxis kommen eine am Zylinderkopf an Masse liegende Signalleitung, bei früheren Motorarbeiten eingeklemmte Kabel oder ein kurzgeschlossener Fühler infrage. NTN-SNR führt P34AA als zu kleines Signal des Einlass-Temperaturfühlers der zweiten Bank; einen Herstellertext gibt es nicht öffentlich. Vergleiche Bank 1 (P34A6) und den Hoch-Code P34AB.
  affected_components:
    - cam_actuator_a_temp_sensor_b2
    - sensor_wiring
  common_causes:
    - id: short_ground
      likelihood: high
      label:
        en: Signal wire grounded against the cylinder head
        de: Signalleitung am Zylinderkopf an Masse
    - id: pinched_harness
      likelihood: medium
      label:
        en: Cables pinched during earlier engine work
        de: Kabel bei früheren Motorarbeiten eingeklemmt
    - id: sensor_shorted
      likelihood: medium
      label:
        en: Sensor shorted internally
        de: Fühler intern kurzgeschlossen
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake phasing on bank 2 suspended, slightly less power
      de: Einlassverstellung auf Bank 2 ausgesetzt, etwas weniger Leistung
