- code: P34AB
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit High Bank 2
    de: Nockenwellenversteller A Temperaturfühler Stromkreis zu hoch Bank 2
  description:
    en: P34AB stands for a voltage above the upper limit at the temperature sensor of intake cam actuator A, bank 2. An interrupted signal or ground line is the classic cause, as is a short to a higher voltage; a plug pushed off during a service visit often explains it. Because the actuator motor warms up under load, the controller depends on this value – the Aisin patent lowers the current step by step while a high temperature persists – and without it the bank 2 phaser is usually held back. NTN-SNR names the code for the inlet side of the second bank; no carmaker publishes it. The bank 1 equivalent is P34A7, the low code P34AA.
    de: P34AB steht für eine Spannung über der oberen Grenze am Temperaturfühler des Einlassverstellers A auf Bank 2. Klassisch sind unterbrochene Signal- oder Masseleitungen, ebenso ein Schluss gegen höhere Spannung; oft wurde bei einem Werkstattbesuch ein Stecker abgezogen und nicht wieder eingerastet. Weil sich der Stellmotor unter Last erwärmt, braucht das Steuergerät diesen Wert – das Aisin-Patent senkt den Strom schrittweise, solange es heiß bleibt –, und ohne ihn hält es den Versteller von Bank 2 meist zurück. NTN-SNR ordnet den Code der Einlassseite der zweiten Bank zu; kein Hersteller veröffentlicht ihn. Auf Bank 1 entspricht ihm P34A7, zu niedrig ist P34AA.
  affected_components:
    - cam_actuator_a_temp_sensor_b2
    - sensor_wiring
  common_causes:
    - id: plug_unlatched
      likelihood: high
      label:
        en: Plug at the actuator off or not latched after service
        de: Stecker am Versteller nach Wartung ab oder nicht eingerastet
    - id: open_circuit
      likelihood: medium
      label:
        en: Signal or ground wire interrupted
        de: Signal- oder Masseleitung unterbrochen
    - id: short_supply
      likelihood: low
      label:
        en: Signal shorted to a higher voltage
        de: Signal mit Schluss gegen höhere Spannung
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake phasing on bank 2 held back
      de: Einlassverstellung auf Bank 2 zurückgehalten
