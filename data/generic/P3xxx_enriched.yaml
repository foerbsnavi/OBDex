    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03A%20Diagnostics.pdf
  reviewed: '2026-11-02'

- code: P3444
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 6 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: P3444 is set when the output that switches the cylinder 6 deactivation solenoid to ground still sees supply voltage while it is turned on, meaning the line has a short to power instead of a path through the coil. GM tests this on the 2019 L84, L86 and LT4 V8s with a limit of 0.5 ohm to controller power, 20 errors out of 25 samples at 250 ms intervals and Type B lamp logic. On the L84, whose solenoids also have a switched high-side feed, a short to voltage on that feed has the separate GM code P3115. Because the ECM can no longer energize the valve, cylinder 6 simply keeps firing and the engine gives up four-cylinder operation. Compare P3441 (open) and P3443 (short to ground).
    de: P3444 wird gesetzt, wenn der Ausgang, der das Abschalt-Magnetventil von Zylinder 6 gegen Masse schaltet, im eingeschalteten Zustand weiterhin Versorgungsspannung sieht – die Leitung hat dann Verbindung zu Plus statt über die Spule zu führen. GM prüft das bei den V8-Motoren L84, L86 und LT4 von 2019 mit einer Grenze von 0,5 Ohm zur Versorgung, 20 Fehlern in 25 Proben im 250-ms-Abstand und Type-B-Lampenlogik. Beim L84, dessen Ventile zusätzlich eine geschaltete High-Side-Versorgung haben, trägt ein Plusschluss dort den eigenen GM-Code P3115. Weil das Steuergerät das Ventil nicht mehr bestromen kann, zündet Zylinder 6 einfach weiter, und der Motor verzichtet auf den Vierzylinderbetrieb. Vergleiche P3441 (Unterbrechung) und P3443 (Masseschluss).
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 6 control wire in contact with a supply wire in the harness
        de: Steuerleitung von Zylinder 6 berührt im Kabelbaum eine Versorgungsleitung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 6 solenoid coil
        de: Windungsschluss in der Spule des Magnetventils von Zylinder 6
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty output stage in the engine control module
        de: Fehlerhafte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs on all eight cylinders permanently
      de: Motor läuft dauerhaft auf allen acht Zylindern
    - en: Slightly higher fuel consumption at light load
      de: Etwas höherer Verbrauch bei geringer Last
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
