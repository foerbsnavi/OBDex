      likelihood: low
      label:
        en: Engine control module driver fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
