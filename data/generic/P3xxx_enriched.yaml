- code: P34BD
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Range/Performance Bank 1
    de: Nockenwellenversteller B Positionssensor A Bereich/Funktion Bank 1
  description:
    en: "P34BD has a documented user. Mercedes-Benz lists P34BD09 in bulletin LI05.20-P-080192, dated 14 January 2026, for M176/M177 V8 engines with CAMTRONIC, used for example in the AMG C 63 and E 63, the G 550 and the Maybach GLS 600. Its fault text reports the feedback from exhaust-side CAMTRONIC solenoid 1 of bank 1 as faulty and classes it as a component fault. Mercedes names software and hardware as the cause: update the ME engine control unit, check the part numbers of all CAMTRONIC actuators and replace older ones (A177 982 03 03 or 17 00 by 19 00, 02 03 or 16 00 by 18 00), and look for heat-damaged wiring at the bulkhead. P005A (exhaust solenoid 1 jammed off) and the limp-home code P164B often come along. Bank 2: P34C1."
    de: "Für P34BD gibt es einen belegten Anwender. Mercedes-Benz nennt P34BD09 im Bulletin LI05.20-P-080192 vom Januar 2026 für die V8-Motoren M176/M177 mit CAMTRONIC, eingebaut etwa in AMG-63-Modellen, S 580, G 550 und GLS 600. Laut Fehlertext ist die Rückmeldung des CAMTRONIC-Stellers 1 (Auslass, Bank 1) gestört, eingestuft als Bauteilfehler. Als Ursache gibt Mercedes Software und Hardware an: Motorsteuergerät ME aktualisieren, die Teilenummern aller CAMTRONIC-Steller prüfen und ältere ersetzen (A177 982 03 03 bzw. 17 00 durch 19 00, 02 03 bzw. 16 00 durch 18 00) sowie nach Hitzespuren am Kabelbaum nahe der Stirnwand sehen. Häufig erscheinen dazu P005A (Auslass-Steller 1 hängt in Aus-Stellung) und der Notlaufcode P164B. Bank 2: P34C1."
  affected_components:
    - cam_actuator_b_pos_sensor_b1
  common_causes:
    - id: engine_software
      likelihood: high
      label:
        en: "Engine control software outdated (Mercedes M176/M177: update)"
        de: "Software des Motorsteuergeräts veraltet (Mercedes M176/M177: Update)"
    - id: old_actuator_version
      likelihood: high
      label:
        en: CAMTRONIC actuator of a superseded part number
        de: CAMTRONIC-Steller mit überholter Teilenummer
    - id: harness_heat_damage
      likelihood: medium
      label:
        en: Harness heat-damaged above the bulkhead
        de: Kabelbaum über der Stirnwand durch Hitze geschädigt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: CAMTRONIC in limp-home mode, often with further CAMTRONIC codes
      de: CAMTRONIC im Notlauf, oft mit weiteren CAMTRONIC-Codes
