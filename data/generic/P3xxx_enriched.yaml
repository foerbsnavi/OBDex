- code: P3437
  category: powertrain
  title:
    en: Cylinder 5 Exhaust Valve Control Circuit/Open
    de: Zylinder 5 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: P3437 is reserved for an open circuit in a separate exhaust valve actuator on cylinder 5. No manufacturer documents this code publicly. GM, the main user of cylinder 5 deactivation codes (2007 V6, 3.6 L V6, L84 V8), only publishes the intake-side group P3433 to P3436, because its systems switch both valves of a cylinder together; NHTSA's description of Dynamic Fuel Management states that each solenoid feeds intake and exhaust lifters. CARB still expects any emission-relevant actuator to be checked for continuity, which is what this code would report. P3438 to P3440 are the other exhaust codes for cylinder 5, P3433 the intake-side open.
    de: P3437 ist für eine Unterbrechung im Kreis eines gesonderten Auslassventil-Stellglieds an Zylinder 5 vorgesehen. Kein Hersteller dokumentiert diesen Code öffentlich. GM, der Hauptnutzer der Abschaltcodes für Zylinder 5 (V6 von 2007, 3,6-l-V6, V8 L84), veröffentlicht nur die Einlassgruppe P3433 bis P3436, weil seine Systeme beide Ventile eines Zylinders gemeinsam schalten; laut NHTSA-Beschreibung des Dynamic Fuel Management versorgt jedes Magnetventil Einlass- und Auslassstößel. CARB erwartet dennoch für jedes abgasrelevante Stellglied eine Durchgangsprüfung – genau das würde dieser Code melden. P3438 bis P3440 sind die übrigen Auslasscodes von Zylinder 5, P3433 die Unterbrechung auf der Einlassseite.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken wire or connector to the cylinder 5 exhaust actuator
        de: Leitungs- oder Steckerbruch zum Auslass-Stellglied von Zylinder 5
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Open actuator coil
        de: Unterbrochene Stellglied-Spule
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module driver fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
