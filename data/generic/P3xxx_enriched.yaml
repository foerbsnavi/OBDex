  description:
    en: Cylinder 11 exhaust valve control voltage below expected range — short to ground. Engines with twelve cylinders and cylinder deactivation, such as Lamborghini's Aventador V12, hold the exhaust valves of the shut-off cylinders closed with a switchable actuator; this code concerns that actuator's circuit on cylinder 11. While the circuit is faulty the module keeps all cylinders active, and if the valve gear is stuck in the off position the cylinder may misfire.
    de: Steuerspannung Auslassventil Zylinder 11 unter Sollbereich — Masseschluss. Zwölfzylinder mit Zylinderabschaltung, etwa der V12 des Lamborghini Aventador, halten die Auslassventile der abgeschalteten Zylinder über einen schaltbaren Aktuator geschlossen; dieser Code betrifft dessen Stromkreis an Zylinder 11. Solange der Stromkreis gestört ist, lässt das Steuergerät alle Zylinder aktiv, und hängt der Ventiltrieb in der abgeschalteten Stellung, kann der Zylinder Aussetzer haben.
