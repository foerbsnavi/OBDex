        de: Stecker oder Kabelbaum zum Steller von Bank 2 unterbrochen oder kurzgeschlossen
    - id: actuator_sensor
      likelihood: medium
      label:
        en: Position sensor in the actuator failed
        de: Positionssensor im Steller defekt
    - id: control_module
      likelihood: low
      label:
        en: Control module fault
        de: Steuergerät defekt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 intake phasing held in its base position
      de: Einlassverstellung von Bank 2 in Grundstellung
    - en: Possibly less power and uneven running between banks
      de: Ggf. weniger Leistung und ungleicher Lauf zwischen den Bänken
