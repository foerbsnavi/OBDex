    - sae:J2012
  related_codes: [P3425, P3427, P3428, P3402, P3442, P3450, P349B, P0304]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/tsbs/2016/MC-10121651-9999.pdf
    - https://static.nhtsa.gov/odi/tsbs/2020/MC-10175723-9999.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11024415-0001.pdf
