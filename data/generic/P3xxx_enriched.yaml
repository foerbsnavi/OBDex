- code: P3468
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 9 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: P3468 indicates that the control circuit for the cylinder 9 deactivation or intake valve actuator is pulled high, typically by a short to battery voltage that the module notices once it switches the output on. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Most engines above eight cylinders that shut cylinders down, such as Audi's R8 V10 and Bentley's W12, do so bank by bank without dedicated valve actuators; Mercedes' M137 V12, by contrast, used a solenoid pack. GM's eight-cylinder version of this check counts below 0.5 ohm to controller power with the driver on, 20 of 25 samples. Expect the module to shut the output off and run all cylinders. P3465 (open) and P3467 (ground short) are the other electrical faults here.
    de: "P3468 zeigt an, dass der Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 9 nach oben gezogen wird – meist durch einen Schluss nach Batteriespannung, den das Steuergerät beim Einschalten des Ausgangs bemerkt. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Die meisten Motoren mit mehr als acht Zylindern und Abschaltung, etwa Audis R8-V10 oder Bentleys W12, legen ganze Bänke ohne eigene Ventil-Stellglieder still; der Mercedes-V12 M137 mit seinem Magnetventilblock war die Ausnahme. GM zählt bei seinen V8 unter 0,5 Ohm zur Versorgung bei eingeschaltetem Treiber, 20 von 25 Proben. Das Steuergerät schaltet den Ausgang ab und fährt mit allen Zylindern. Übrige elektrische Fehler: P3465 (offen) und P3467 (Masseschluss)."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 9 control wire touching a supply wire
        de: Steuerleitung von Zylinder 9 berührt eine Versorgungsleitung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 9 solenoid coil
        de: Windungsschluss in der Spule des Magnetventils von Zylinder 9
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage of the engine control module damaged
        de: Endstufe des Motorsteuergeräts beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs on all cylinders at all times
      de: Motor läuft ständig mit allen Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3465, P3466, P3467, P3472, P3497]
