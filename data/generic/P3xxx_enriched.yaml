- code: P34B7
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit High Bank 1
    de: Nockenwellenversteller B Temperaturfühler Stromkreis zu hoch Bank 1
  description:
    en: "P34B7 sets when the heat reading delivered by exhaust actuator B, bank 1, sits above its upper limit. Electrically this points to an open signal line, a detached sensor ground or contact with battery or reference voltage; with a negative-coefficient element the module would see an implausibly cold actuator. A cold reading harms nothing by itself, but it robs the controller of its heat protection – in Aisin's design the reading decides when the holding current at the end stop must be cut back – so the module will typically stop relying on electric phasing. NTN-SNR describes P34B7 as an excessive outlet-side signal. No manufacturer text on this code is published. CARB obliges the OBD system to recognise such open or shorted circuits. Low counterpart: P34B6."
    de: "P34B7 wird gesetzt, wenn das Temperatursignal des Auslassverstellers B auf Bank 1 über seiner Obergrenze liegt. Elektrisch spricht das für eine offene Signalleitung, eine gelöste Fühlermasse oder einen Schluss nach Versorgungsspannung; bei einem Heißleiter sähe das Steuergerät einen unglaubhaft kalten Versteller. Ein Kaltwert schadet für sich genommen nicht, nimmt dem Regler aber den Hitzeschutz: Im Aisin-Konzept entscheidet gerade dieser Wert, wann der Haltestrom am Anschlag zurückgenommen wird. Das Steuergerät verzichtet daher in der Regel auf die elektrische Verstellung. NTN-SNR nennt P34B7 ein zu hohes Signal der Auslassseite. Herstellertexte zu dem Code gibt es nicht. CARB fordert, solche Kreisfehler zu erkennen. Zu niedrig: P34B6."
  affected_components:
    - cam_actuator_b_temp_sensor_b1
    - sensor_wiring
  common_causes:
    - id: signal_open
      likelihood: high
      label:
        en: Signal line or sensor ground interrupted, plug corroded
        de: Signalleitung oder Fühlermasse unterbrochen, Stecker korrodiert
    - id: short_to_supply
      likelihood: medium
      label:
        en: Signal line shorted to a supply wire
        de: Signalleitung mit Schluss zu einer Versorgungsleitung
    - id: sensor_open
      likelihood: medium
      label:
        en: Sensor element open inside the actuator
        de: Fühlerelement im Versteller hochohmig
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Exhaust cam on bank 1 held in its default position
      de: Auslassnocke auf Bank 1 in Standardlage gehalten
