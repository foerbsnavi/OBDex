- code: P3434
  category: powertrain
  title:
    en: Cylinder 5 Deactivation/Intake Valve Control Performance
    de: Zylinder 5 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "With P3434 the computer has found that cylinder 5 does not switch off or back on correctly, while the control circuit tests fine. No manufacturer documents this code publicly. GM's L84 runs the equivalent test under P349C: manifold pressure stays too high while cylinder 5 is commanded off, meaning its valves keep working. For 3.6 L V6 engines, GM bulletin 21-NA-036 describes the field picture: misfires on cylinder 5 (P0305), sometimes only after a reduced-cylinder phase, from oil leaking past the control valve or rockers that do not latch, and asks to check for a solenoid tip broken off in the bore. Wiring faults for this cylinder are P3433, P3435 and P3436."
    de: "Mit P3434 hat das Steuergerät festgestellt, dass Zylinder 5 nicht richtig ab- oder zuschaltet, während der Steuerkreis in Ordnung ist. Kein Hersteller dokumentiert diesen Code öffentlich. GMs L84 führt den gleichwertigen Test unter P349C: Der Saugrohrdruck bleibt zu hoch, obwohl Zylinder 5 abgeschaltet sein soll – seine Ventile arbeiten also weiter. Für 3,6-l-V6-Motoren beschreibt GMs Bulletin 21-NA-036 das Bild aus der Werkstatt: Fehlzündungen auf Zylinder 5 (P0305), teils nur nach einer Teilzylinderphase, durch Öl, das am Steuerventil vorbeiläuft, oder nicht einrastende Kipphebel; zu prüfen ist auch eine in der Bohrung abgebrochene Ventilspitze. Leitungsfehler dieses Zylinders sind P3433, P3435 und P3436."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: control_valve_oil_leak
      likelihood: high
      label:
        en: Oil leaking past the cylinder 5 control valve seal
        de: Öl läuft an der Dichtung des Steuerventils von Zylinder 5 vorbei
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Switching rocker or lifter of cylinder 5 not latching
        de: Schaltbarer Kipphebel oder Stößel von Zylinder 5 rastet nicht ein
    - id: broken_solenoid_tip
      likelihood: low
      label:
        en: Solenoid tip broken off in the bore
        de: Ventilspitze in der Bohrung abgebrochen
    - id: low_or_degraded_oil
      likelihood: low
      label:
        en: Low or aged engine oil
        de: Zu wenig oder gealtertes Motoröl
  symptoms:
    - en: Misfire on cylinder 5 (P0305)
      de: Fehlzündungen auf Zylinder 5 (P0305)
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Shaking after reduced-cylinder operation
      de: Schütteln nach Teilzylinderbetrieb
  repair:
