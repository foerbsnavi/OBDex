- code: P3410
  category: powertrain
  title:
    en: Cylinder 2 Deactivation/Intake Valve Control Performance
    de: Zylinder 2 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3410 covers a cylinder 2 deactivation system that is electrically intact but does not do what is commanded, such as valves that keep opening or fail to return. No manufacturer documents this code publicly. GM checks this behavior on the L84 under its own code P3499, by watching manifold pressure while cylinder 2 should be off; Ford uses the matching cylinder 1 code P3402. GM bulletin 21-NA-036 for 3.6 L V6 engines shows how such faults appear in practice: oil leaking past the control valve or rockers that do not latch cause misfires on cylinder 2 (P0302). Circuit faults belong to P3409, P3411 and P3412. Expect roughness and lost economy."
    de: "P3410 betrifft eine Abschaltung von Zylinder 2, die elektrisch intakt ist, aber nicht tut, was befohlen wird – etwa Ventile, die weiter öffnen oder nicht zurückschalten. Kein Hersteller dokumentiert diesen Code öffentlich. GM prüft dieses Verhalten beim L84 unter dem eigenen Code P3499 über den Saugrohrdruck, solange Zylinder 2 abgeschaltet sein soll; Ford nutzt das Pendant für Zylinder 1, P3402. Wie solche Fehler in der Praxis aussehen, zeigt GMs Bulletin 21-NA-036 zu 3,6-l-V6-Motoren: Öl, das am Steuerventil vorbeiläuft, oder nicht einrastende Kipphebel führen zu Fehlzündungen auf Zylinder 2 (P0302). Kreisfehler gehören zu P3409, P3411 und P3412. Zu erwarten sind unruhiger Lauf und Mehrverbrauch."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: control_valve_oil_leak
      likelihood: high
      label:
        en: Oil bleeding past the control valve seal, pressure lost
