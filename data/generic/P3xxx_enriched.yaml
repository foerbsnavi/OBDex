    - https://static.nhtsa.gov/odi/tsbs/2018/MC-10130502-9999.pdf
  reviewed: '2026-11-06'

- code: P34C6
  category: powertrain
  title:
    en: B Camshaft Position Actuator Control Circuit Driver Current/Temperature Too High Bank 1
    de: Nockenwellenversteller B Steuerkreis Treiberstrom/-temperatur zu hoch Bank 1
  description:
    en: "P34C6 concerns actuator B, which NTN-SNR assigns to the exhaust camshaft, on bank 1: the stage driving it signals overcurrent or overheating. That presumes an electrically powered exhaust phaser, and none is documented in public sources. The 2022 Mitsubishi Outlander shifts its exhaust camshaft hydraulically via a solenoid valve, which fail-safe holds at a reference angle, and Mercedes-Benz uses B-side codes on its M176/M177 V8 only for CAMTRONIC position feedback, not for driver load. So no manufacturer is known for this code. Should it appear, the logic of the Aisin patent applies: a hot driver board or a motor fighting a stiff phaser pushes current up, and the controller backs off or switches the motor off. Exhaust timing then rests at its default, which mainly costs smoothness and some economy. Bank 2: P34C7."
    de: "P34C6 betrifft Versteller B, den NTN-SNR der Auslassnockenwelle zuordnet, auf Bank 1: Dessen Endstufe meldet Überstrom oder Übertemperatur. Voraussetzung wäre ein Auslassversteller mit Elektromotor, und ein solcher ist in öffentlichen Quellen nicht beschrieben. Der Mitsubishi Outlander 2022 verstellt die Auslassnocke über ein Ölsteuerventil, das im Notlauf in Referenzlage bleibt; Mercedes-Benz nutzt beim V8 M176/M177 Codes der B-Seite nur für die Lagerückmeldung von CAMTRONIC, nicht für die Belastung einer Endstufe. Ein Anwender ist daher nicht bekannt. Tritt der Code auf, gilt das Prinzip aus dem Aisin-Patent: Eine heiße Treiberplatine oder ein Motor gegen einen schwergängigen Versteller treibt den Strom hoch, worauf das Steuergerät zurückregelt oder abschaltet. Die Auslasssteuerzeit bleibt dann in Grundstellung. Bank 2: P34C7."
  affected_components:
    - cam_actuator_b_driver_b1
    - cam_actuator_b_b1
  common_causes:
    - id: actuator_binding
      likelihood: medium
      label:
        en: Exhaust phaser on bank 1 stiff, motor overloaded
        de: Auslassversteller auf Bank 1 schwergängig, Motor überlastet
    - id: wiring_short
      likelihood: medium
      label:
        en: Short in the motor wiring of actuator B, bank 1
        de: Schluss in der Motorleitung von Steller B, Bank 1
    - id: driver_module
      likelihood: low
      label:
        en: Output stage for actuator B damaged or overheated
        de: Endstufe für Steller B beschädigt oder überhitzt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Exhaust cam timing on bank 1 fixed in its default position
      de: Auslasssteuerzeit auf Bank 1 in Grundstellung festgehalten
    - en: Slightly higher fuel use, minor loss of smoothness
      de: Etwas höherer Verbrauch, leicht unruhigerer Lauf
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1300]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [P34C7, P34C4, P34C8, P34B4, P34BC, P0013]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.ntn-snr.com/sites/default/files/2025-07/TECHinfo_CMP_UK.pdf
    - https://patents.google.com/patent/US20220003132A1/en
    - https://mitsubishitechinfo.com/data/DG/2022/02/HTML/N5020401U0011Z00USA.htm
    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11027678-0001.pdf
  reviewed: '2026-11-06'

- code: P34C7
  category: powertrain
  title:
    en: B Camshaft Position Actuator Control Circuit Driver Current/Temperature Too High Bank 2
    de: Nockenwellenversteller B Steuerkreis Treiberstrom/-temperatur zu hoch Bank 2
  description:
    en: "P34C7 closes the group of four driver-load codes: on bank 2 the power stage of the exhaust-side actuator B reports current or temperature above its limit. NTN-SNR ties it to outlet adjustment on the second bank. It is the rarest of the set, because electric phasers have so far appeared on the intake side; no public manufacturer document names P34C7. The fault type means the module is guarding itself, not that a sensor reads wrong, since position and temperature sensor faults of this actuator have their own codes (P34C0 to P34C3, P34B8). Plausible triggers are a motor working against a seized or poorly oiled phaser, a short in its wiring, or a driver that runs hot because it sits close to the exhaust side. CARB treats such phasers as monitored outputs. Driving continues, just with exhaust timing locked. Bank 1: P34C6."
    de: "P34C7 schließt die Vierergruppe der Endstufencodes ab: Für Bank 2 meldet der Treiber des auslassseitigen Verstellers B Strom oder Temperatur über dem Grenzwert. NTN-SNR führt ihn unter der Auslassverstellung der zweiten Bank. Er ist der seltenste der Gruppe, denn elektrische Versteller gibt es bislang auf der Einlassseite; ein öffentliches Herstellerdokument zu P34C7 existiert nicht. Der Fehlertyp zeigt Selbstschutz an; fehlerhafte Lage- oder Temperaturfühler dieses Verstellers haben eigene Codes (P34C0 bis P34C3, P34B8). Denkbar sind ein Motor, der gegen einen festsitzenden oder schlecht geschmierten Versteller arbeitet, ein Schluss in seiner Leitung oder ein Treiber, der nahe der heißen Auslassseite überhitzt. Der Motor läuft mit fester Auslasssteuerzeit weiter. Bank 1: P34C6."
  affected_components:
    - cam_actuator_b_driver_b2
    - cam_actuator_b_b2
  common_causes:
    - id: actuator_seized
      likelihood: medium
      label:
        en: Bank 2 exhaust phaser seized or poorly lubricated
        de: Auslassversteller auf Bank 2 festsitzend oder schlecht geschmiert
    - id: wiring_short
      likelihood: medium
      label:
        en: Motor wiring of actuator B, bank 2, shorted or heat-damaged
        de: Motorleitung von Steller B, Bank 2, kurzgeschlossen oder hitzegeschädigt
    - id: driver_overheat
      likelihood: low
      label:
        en: Driver overheating from poor cooling or a module fault
        de: Treiber überhitzt wegen schlechter Kühlung oder Steuergerätefehler
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 exhaust timing no longer varied
      de: Auslasssteuerzeit von Bank 2 wird nicht mehr verändert
    - en: Usually only small changes in how the engine runs
      de: Meist nur geringe Änderungen im Motorlauf
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1300]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [P34C6, P34C5, P34C8, P34B8, P34C0, P0023]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.ntn-snr.com/sites/default/files/2025-07/TECHinfo_CMP_UK.pdf
    - https://patents.google.com/patent/US20220003132A1/en
  reviewed: '2026-11-06'

- code: P34C8
  category: powertrain
  title:
    en: Camshaft Position Control Module Performance
    de: Steuergerät Nockenwellenverstellung Funktion
  description:
    en: "P34C8 does not point at one actuator or bank; it says the separate controller for cam adjustment is not working properly in itself. Mitsubishi defines it for the 2022 Outlander: with the ignition on, the controller of the electric intake phaser detects an internal CPU error, and the module is the only listed cause. Fail-safe then parks the electric intake motor and the exhaust oil control solenoid at their reference angle, lets the runner flap open, stops EGR, drops stratified cold starts and runs idle at a set speed. Mercedes-Benz lists P34C800 for M176/M177 V8s as a general CAMTRONIC fault (LI05.20-P-080192), with a software update, newer actuators and a check for heat-damaged harness as remedy. Unlike P34C4 to P34C7, which judge one output stage, this code concerns the module as a whole."
    de: "P34C8 betrifft keinen einzelnen Versteller, sondern das eigene Steuergerät der Nockenwellenverstellung, das intern gestört ist. Mitsubishi dokumentiert ihn im Outlander 2022: Bei eingeschalteter Zündung erkennt das Modul des elektrischen Einlassverstellers einen Fehler seines Prozessors; als Ursache steht allein dieses Steuergerät. Im Notlauf bleiben elektrischer Einlassmotor und Ölsteuerventil der Auslassseite in Referenzlage, die Saugrohrklappe geht auf, die AGR wird abgeschaltet, der geschichtete Kaltstart entfällt und der Leerlauf läuft mit fester Drehzahl. Mercedes-Benz führt P34C800 bei den V8 M176/M177 als allgemeinen CAMTRONIC-Fehler (LI05.20-P-080192) und nennt Software-Update, neuere Steller und eine Prüfung des Kabelbaums auf Hitzeschäden. Anders als P34C4 bis P34C7 betrifft der Code das Steuergerät insgesamt."
  affected_components:
    - cam_position_control_module
  common_causes:
    - id: module_internal
      likelihood: high
      label:
        en: Internal processor fault in the cam adjustment control module
        de: Interner Prozessorfehler im Steuergerät der Nockenwellenverstellung
    - id: module_software
      likelihood: medium
      label:
        en: "Outdated control software (Mercedes M176/M177: update)"
        de: "Veraltete Steuersoftware (Mercedes M176/M177: Update)"
    - id: supply_harness
      likelihood: low
      label:
        en: Module supply or harness heat-damaged or with poor contact
        de: Versorgung oder Kabelbaum des Steuergeräts hitzegeschädigt bzw. mit schlechtem Kontakt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Cam phasing held at its reference position
      de: Nockenwellenverstellung in Referenzlage festgehalten
    - en: Rougher cold start and fixed idle speed
      de: Rauerer Kaltstart und fest eingestellte Leerlaufdrehzahl
    - en: Noticeably less torque, higher fuel use
      de: Spürbar weniger Drehmoment, höherer Verbrauch
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [100, 1000]
    estimated_hours: [0.5, 2.5]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [P34C4, P34C5, P34C6, P34C7, P0606, P34AC]
  sources:
    - https://mitsubishitechinfo.com/data/DG/2022/02/HTML/N5020401U0011Z00USA.htm
    - https://static.nhtsa.gov/odi/tsbs/2026/MC-11027678-0001.pdf
    - https://www.ntn-snr.com/sites/default/files/2025-07/TECHinfo_CMP_UK.pdf
