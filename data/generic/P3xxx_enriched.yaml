        de: Fühlerwert wandernd oder träge
    - id: poor_contact
      likelihood: low
      label:
        en: Poor contact at the bank 2 actuator plug
        de: Schlechter Kontakt am Stecker des Verstellers von Bank 2
  symptoms:
    - en: Check engine light on after a start in freezing weather
      de: Motorkontrollleuchte nach einem Start bei Frost
    - en: Engine runs normally in most cases
      de: Motor läuft meist normal
