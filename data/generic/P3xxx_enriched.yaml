    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
  reviewed: '2026-11-02'

- code: P3464
  category: powertrain
  title:
    en: Cylinder 8 Exhaust Valve Control Circuit High
    de: Zylinder 8 Auslassventil Steuerkreis hoch
  description:
    en: "P3464 is stored once the line to a stand-alone cylinder 8 exhaust actuator sits at a high level, typically a wire touching battery voltage. No manufacturer documents this code publicly. According to GM bulletin 20-NA-038, cylinder 8 is switched off only by DFM engines and by the LTA and LT2, whose fixed pattern is 2, 3, 5 and 8; classic AFM uses 1, 7, 6 and 4. On those engines a single solenoid also moves the exhaust lifter, and GM lists a short to power on it as P3460: with the low-side driver commanded on, less than 0.5 ohm to supply, 20 of 25 samples, Type B. Its malfunction text says cylinder 7, a copy slip in the 2019 table. The shorted output cannot pull in, so cylinder 8 simply stays active. P3463 is the ground fault."
    de: "P3464 entsteht, sobald die Leitung zu einem gesonderten Auslass-Stellglied von Zylinder 8 einen zu hohen Pegel führt, typischerweise durch Kontakt mit Batteriespannung. Kein Hersteller dokumentiert diesen Code öffentlich. Laut GM-Bulletin 20-NA-038 legen nur DFM-Motoren sowie LTA und LT2 mit dem festen Muster 2, 3, 5 und 8 den Zylinder 8 still; das klassische AFM schaltet 1, 7, 6 und 4. Dort bewegt ein einziges Magnetventil auch den Auslassstößel, und einen Plusschluss daran führt GM als P3460: Endstufe eingeschaltet, unter 0,5 Ohm zur Versorgung, 20 von 25 Proben, Type B. Im Fehlertext der Tabelle von 2019 steht dabei Zylinder 7 – ein Kopierfehler. Weil der kurzgeschlossene Ausgang nicht schalten kann, bleibt Zylinder 8 einfach in Betrieb. Den Masseschluss meldet P3463."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Control wire of the cylinder 8 actuator touching a battery feed
        de: Steuerleitung des Stellglieds von Zylinder 8 berührt eine Plusleitung
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the actuator coil, resistance far too low
