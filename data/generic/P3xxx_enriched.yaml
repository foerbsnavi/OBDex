- code: P34C5
  category: powertrain
  title:
    en: A Camshaft Position Actuator Control Circuit Driver Current/Temperature Too High Bank 2
    de: Nockenwellenversteller A Steuerkreis Treiberstrom/-temperatur zu hoch Bank 2
  description:
    en: "P34C5 mirrors P34C4 on bank 2 for intake actuator A: the driver powering the electric phaser motor on the second cylinder bank has measured too much current or run too hot and protects itself. Only V or boxer engines with one electric intake phaser per bank can log it. Two banks give a handy cross-check: if the fault stays on bank 2 after the motors trade places, wiring or the module are to blame; if it moves with the motor, the motor is. The Aisin patent explains why heat and current are judged together, as pressing the phaser hard against its stop lifts both at once. NTN-SNR places it on the bank 2 inlet side. No carmaker publishes P34C5; Nissan's module bulletin NTB18-016 for the 2018 Pathfinder only shows the hardware type. Bank 1: P34C4."
    de: "P34C5 ist das Gegenstück auf Bank 2: Die Endstufe, die den elektrischen Einlassversteller A der zweiten Zylinderbank antreibt, hat zu viel Strom gemessen oder ist zu warm geworden und schützt sich. Möglich ist das nur bei V- oder Boxermotoren mit je einem elektrischen Einlassversteller pro Bank. Zwei Bänke erlauben einen einfachen Gegentest: Bleibt der Fehler nach dem Tausch der Stellmotoren auf Bank 2, liegen Leitungen oder Steuergerät nahe; wandert er mit, ist es der Motor. Warum Wärme und Strom gemeinsam bewertet werden, zeigt das Aisin-Patent: Drückt der Motor den Versteller fest an den Anschlag, steigen beide zugleich. NTN-SNR führt den Code für die Einlassseite von Bank 2. Kein Autohersteller veröffentlicht P34C5; Nissans Bulletin NTB18-016 zum Pathfinder 2018 zeigt nur die Bauart. Bank 1: P34C4."
  affected_components:
    - cam_actuator_a_driver_b2
    - cam_actuator_a_b2
  common_causes:
    - id: actuator_binding
      likelihood: high
      label:
        en: Bank 2 phaser stiff or stuck at an end stop
        de: Versteller auf Bank 2 schwergängig oder am Endanschlag fest
    - id: motor_lead_short
      likelihood: medium
      label:
        en: Motor lead to the bank 2 actuator chafed or shorted
        de: Motorleitung zum Steller auf Bank 2 durchgescheuert oder kurzgeschlossen
    - id: actuator_motor
      likelihood: medium
      label:
        en: Electric motor of the bank 2 actuator worn or internally shorted
        de: Elektromotor des Stellers auf Bank 2 verschlissen oder innen kurzgeschlossen
    - id: driver_module
      likelihood: low
      label:
        en: Bank 2 output stage in the phaser control module faulty
        de: Endstufe für Bank 2 im Verstellersteuergerät defekt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 intake timing frozen, banks run unevenly
      de: Einlasssteuerzeit von Bank 2 eingefroren, Bänke laufen ungleich
    - en: Slightly rough idle and less torque at low engine speed
      de: Leicht unruhiger Leerlauf, weniger Drehmoment bei niedriger Drehzahl
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: true
  references:
    - sae:J2012
  related_codes: [P34C4, P34C7, P34C8, P34A8, P34A9, P0020]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.ntn-snr.com/sites/default/files/2025-07/TECHinfo_CMP_UK.pdf
