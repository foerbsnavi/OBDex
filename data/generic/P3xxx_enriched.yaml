- code: P34A4
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit Bank 1
    de: Nockenwellenversteller A Temperaturfühler Stromkreis Bank 1
  description:
    en: "P34A4 flags an electrical problem of any kind in the temperature sensor circuit of intake camshaft actuator A on bank 1: a wire broken somewhere, a plug that has worked loose, or a value no valid window accepts. Such a sensor belongs to electrically driven phasers; an Aisin patent places it on the motor driver board and reduces motor current once that board stays hot. NTN-SNR lists P34A4 as the inlet-side temperature sensor with an electrical fault. Nissan uses this family on the electric intake valve timing of the 2018 Pathfinder and QX60 but only publishes the range codes P34A5 and P34A9; a public text on P34A4 itself is not known. Without a valid temperature the controller can no longer guard the motor and normally restricts phasing. Low and high faults are P34A6 and P34A7."
    de: "P34A4 meldet einen allgemeinen elektrischen Fehler am Temperaturfühler des Einlass-Nockenwellenverstellers A auf Bank 1, etwa eine gebrochene Leitung, einen abgezogenen Stecker bzw. einen Wert ohne gültiges Fenster. Einen solchen Fühler haben elektrisch angetriebene Versteller: Ein Patent von Aisin setzt ihn auf die Treiberplatine des Stellmotors und nimmt den Motorstrom zurück, wenn die Platine dauerhaft heiß bleibt. NTN-SNR führt P34A4 als Temperaturfühler der Einlassverstellung mit elektrischem Fehler. Nissan nutzt die Familie bei der elektrischen Einlass-Ventilsteuerung von Pathfinder und QX60 (2018), veröffentlicht aber nur die Plausibilitätscodes P34A5 und P34A9. Ohne gültige Temperatur kann das Steuergerät den Motor nicht mehr schützen und schränkt die Verstellung meist ein. Zu niedrig und zu hoch sind P34A6 und P34A7."
  affected_components:
    - cam_actuator_a_temp_sensor_b1
    - sensor_wiring
  common_causes:
    - id: connector_harness
      likelihood: high
      label:
        en: Plug at the actuator loose or corroded, sensor wire broken
        de: Stecker am Versteller locker oder korrodiert, Fühlerleitung gebrochen
    - id: sensor_failed
      likelihood: medium
      label:
        en: Temperature sensor in the actuator or its electronics failed
        de: Temperaturfühler im Versteller bzw. dessen Elektronik ausgefallen
    - id: control_module
      likelihood: low
      label:
        en: Fault in the module that drives the electric phaser
        de: Fehler im Steuergerät, das den elektrischen Versteller ansteuert
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake cam phasing on bank 1 restricted or held in its base position
      de: Einlassverstellung auf Bank 1 eingeschränkt oder in Grundstellung gehalten
    - en: Often no noticeable change while driving
      de: Beim Fahren oft kein spürbarer Unterschied
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [50, 700]
    estimated_hours: [0.5, 3]
  flags:
