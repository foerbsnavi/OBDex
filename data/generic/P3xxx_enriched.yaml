- code: P341A
  category: powertrain
  title:
    en: Deactivation/Intake Valve Control Circuit Performance Bank 1
    de: Abschaltung/Einlassventil Steuerkreis Funktion Bank 1
  description:
    en: "P341A is the function check behind P340A: the bank 1 intake deactivation circuit is electrically sound, yet the valves do not end up where they were commanded. No manufacturer documents this code publicly. Comparable checks exist under other numbers. GM's LT4 compares a modeled and a measured manifold pressure with and without deactivation and reports the bank result as P3400; per-cylinder failures on DFM engines go to P3498 onward. A Delphi patent notes why averaged manifold pressure alone separates working and failed intake deactivation poorly and cannot name the cylinder. Typical causes are hydraulic: low or dirty oil, a sticking control valve, lifters that do not latch. Misfires and rough running are possible."
    de: "P341A ist die Funktionsprüfung hinter P340A: Der Einlass-Abschaltkreis von Bank 1 ist elektrisch in Ordnung, die Ventile landen aber nicht dort, wo sie hinsollen. Kein Hersteller dokumentiert den Code öffentlich. Vergleichbare Prüfungen gibt es unter anderen Nummern: GM vergleicht beim LT4 gemessenen und berechneten Saugrohrdruck mit und ohne Abschaltung und meldet das Ergebnis für die Bank als P3400; zylinderweise Fehler der DFM-Motoren laufen ab P3498. Ein Delphi-Patent erklärt, warum ein gemittelter Saugrohrdruck allein funktionierende und gestörte Einlassabschaltung nur schlecht trennt und den Zylinder nicht benennen kann. Die Ursachen sind meist hydraulisch: wenig oder verschmutztes Öl, ein klemmendes Steuerventil, nicht einrastende Stößel. Fehlzündungen und unrunder Lauf sind möglich."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Low oil level or aged, contaminated oil
        de: Zu wenig Öl oder gealtertes, verschmutztes Öl
    - id: control_valve_sticking
      likelihood: medium
      label:
        en: Bank 1 deactivation control valve sticking or screen blocked
        de: Abschalt-Steuerventil von Bank 1 klemmt oder Sieb zugesetzt
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Switchable lifters or rockers on bank 1 not latching or releasing
        de: Schaltbare Stößel oder Kipphebel auf Bank 1 rasten nicht ein oder aus
    - id: oil_pressure_low
      likelihood: low
      label:
        en: Insufficient oil pressure from a worn pump or leaking seal
        de: Zu geringer Öldruck durch verschlissene Pumpe oder undichte Dichtung
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Jerk or vibration when cylinders switch off or on
      de: Ruck oder Vibration beim Ab- und Zuschalten der Zylinder
    - en: Misfire codes on bank 1
      de: Fehlzündungscodes auf Bank 1
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
