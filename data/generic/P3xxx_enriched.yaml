- code: P349D
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Performance
    de: Zylinder 6 Abschaltung/Einlassventil Funktion
  description:
    en: "P349D indicates that cylinder 6 drew in and pushed out air during events in which it should have stayed sealed. The test logic rests on a simple effect: every intake stroke leaves a dip in manifold pressure, so a resting cylinder should leave none. Ford's patent US8667835B2 and Delphi's US7314034B1 describe tracking these pulses event by event. GM applies the idea to its L84 and L87 V8s with filtered manifold pressure, 22 failures out of 25, Type B. The older GM AFM V8s also switch off cylinder 6, but there faults surface through the bank code P3400. Likely causes are a lifter whose locking pins do not release, a sticking solenoid or poor oil. P3442 is the control-performance sibling, P0306 the misfire code of this cylinder."
    de: "P349D zeigt an, dass Zylinder 6 in Takten Luft angesaugt und ausgestoßen hat, in denen er dicht bleiben sollte. Die Prüflogik nutzt einen einfachen Effekt: Jeder Ansaugtakt hinterlässt eine Delle im Saugrohrdruck, ein ruhender Zylinder also keine. Fords Patent US8667835B2 und Delphis US7314034B1 beschreiben, wie man diese Pulse Takt für Takt verfolgt. GM wendet das bei L84 und L87 über den gefilterten Saugrohrdruck an (22 Fehler aus 25, Type B). Auch die älteren AFM-V8 von GM schalten Zylinder 6 ab, melden Störungen dort aber über den Bankcode P3400. Mögliche Ursachen sind ein Stößel, dessen Riegel nicht freigeben, ein klemmendes Magnetventil oder schlechtes Öl. Geschwister: P3442 (Ansteuerung), P0306 (Fehlzündung dieses Zylinders)."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: lifter_lock_pins_stuck
      likelihood: high
      label:
        en: Locking pins of the cylinder 6 lifters do not release
        de: Riegel der Stößel von Zylinder 6 geben nicht frei
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Oil solenoid of cylinder 6 sticking
        de: Ölmagnetventil von Zylinder 6 klemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low oil level or degraded oil
        de: Zu wenig oder gealtertes Öl
    - id: map_signal_distorted
      likelihood: low
      label:
        en: Intake leak or MAP sensor fault distorting the pressure pulses
        de: Falschluft oder MAP-Sensorfehler verfälscht die Druckpulse
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Higher fuel use in light-load cruising
      de: Mehrverbrauch bei Konstantfahrt mit wenig Last
    - en: Ticking from the engine valley
      de: Ticken aus dem Motor-V
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 4500]
    estimated_hours: [0.5, 14]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3442, P3441, P3400, P349C, P349E, P0306, P0106]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US8667835B2/en
    - https://patents.google.com/patent/US7314034B1/en
    - https://static.nhtsa.gov/odi/tsbs/2020/MC-10172811-9999.pdf
  reviewed: '2026-11-06'

- code: P349E
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Performance
    de: Zylinder 7 Abschaltung/Einlassventil Funktion
  description:
    en: "P349E covers cylinder 7: deactivation was commanded, yet the cylinder kept its valve events. In GM's DFM design the intake lifter is unlocked first, while the exhaust lifter can only release once its cam lobe is back on the base circle; a sluggish pin therefore tends to leave the exhaust side working. GM's L84 and L87 check spots this through manifold pressure at each 90 degrees of crank rotation and stores a Type B code once 22 out of 25 opportunities have failed. Tula Technology, a specialist in skip-fire control, patented a check that combines intake pressure pulses with measured versus modelled crankshaft acceleration (US9891137B2). The wiring codes for cylinder 7 are P3449, P3451 and P3452. A driver may hear ticking and see the lamp."
    de: "P349E betrifft Zylinder 7: Die Abschaltung war befohlen, der Zylinder hat seine Ventile aber weiter bewegt. Bei GMs DFM wird zuerst der Einlassstößel entriegelt; der Auslassstößel kann erst freigeben, wenn sein Nocken wieder auf dem Grundkreis läuft. Ein schwergängiger Riegel lässt deshalb oft die Auslassseite arbeiten. GM erkennt das bei L84 und L87 am Saugrohrdruck, ausgewertet alle 90 Grad Kurbelwinkel, und speichert nach 22 Fehlversuchen aus 25 einen Type-B-Code. Tula Technology, Spezialist für Zylinderausblendung, hat zusätzlich eine Prüfung über Druckpulse im Saugrohr und gemessene gegen modellierte Kurbelwellenbeschleunigung patentiert (US9891137B2). Kreisfehler von Zylinder 7: P3449, P3451, P3452. Spürbar sind Ticken und Warnleuchte."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: lifter_lock_pins_sluggish
      likelihood: high
      label:
        en: Sluggish locking pin, mostly in the exhaust lifter of cylinder 7
        de: Schwergängiger Riegel, meist im Auslassstößel von Zylinder 7
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Oil solenoid of cylinder 7 not opening fully
        de: Ölmagnetventil von Zylinder 7 öffnet nicht vollständig
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low, thin or aerated oil
        de: Zu wenig, zu dünnes oder aufgeschäumtes Öl
  symptoms:
    - en: Ticking from the valve train
      de: Ticken aus dem Ventiltrieb
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation inhibited, higher consumption
      de: Zylinderabschaltung gesperrt, höherer Verbrauch
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 4500]
    estimated_hours: [0.5, 14]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3450, P3449, P3451, P3452, P349D, P349F, P0307]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
    - https://patents.google.com/patent/US9891137B2/en
  reviewed: '2026-11-06'

- code: P349F
  category: powertrain
  title:
    en: Cylinder 8 Deactivation/Intake Valve Performance
    de: Zylinder 8 Abschaltung/Einlassventil Funktion
  description:
    en: "P349F reports that cylinder 8 failed to go quiet when commanded. California's OBD rule requires makers to analyse every plausible hydraulic or mechanical failure of variable valve systems and mentions, among its examples, a lift-mechanism pin of one cylinder that will not shift; codes like this one follow from that duty. GM implements it for cylinder 8 on its L84 and L87 DFM V8s: filtered manifold pressure above the deactivation threshold in 22 out of 25 chances, rated Type B, so the lamp lights on the second faulty trip. GM's LT2 and LTA engines also rest cylinder 8, but no public GM table assigns P349F to them. Typical causes are a lifter stuck in its locked state, a failing oil solenoid or sludge. P3458 is the control-side code, P0308 the misfire code."
    de: "P349F meldet, dass Zylinder 8 auf Befehl nicht stillgelegt wurde. Die kalifornische OBD-Vorschrift verlangt von den Herstellern, jeden denkbaren hydraulischen oder mechanischen Fehler variabler Ventilsysteme zu analysieren, und nennt als Beispiel einen einzelnen zylinderbezogenen Stift, der nicht in Position geht; aus dieser Pflicht stammen Codes wie dieser. GM setzt ihn bei den DFM-V8 L84 und L87 für Zylinder 8 um: gefilterter Saugrohrdruck über der Abschaltschwelle, 22 von 25 Gelegenheiten, Type B mit Leuchte nach zwei Fahrten. Auch LT2 und LTA legen Zylinder 8 still, eine öffentliche GM-Tabelle mit P349F gibt es für sie aber nicht. Ursachen sind meist ein verriegelt hängender Stößel, ein schwaches Ölmagnetventil oder Ölschlamm. Verwandt: P3458 (Ansteuerung), P0308 (Fehlzündung)."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: lifter_lock_pins_stuck
      likelihood: high
      label:
        en: Lifter of cylinder 8 stuck in its locked state
        de: Stößel von Zylinder 8 hängt im verriegelten Zustand
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Weak or sticking oil solenoid of cylinder 8
        de: Schwaches oder klemmendes Ölmagnetventil von Zylinder 8
    - id: oil_sludge
      likelihood: medium
      label:
        en: Sludge or debris in the lifter oil passages
        de: Ölschlamm oder Fremdkörper in den Ölkanälen der Stößel
    - id: ecm_false_detection
      likelihood: low
      label:
        en: Stored after a voltage dip at cranking, ECM software update needed
        de: Nach Spannungseinbruch beim Start gespeichert, ECM-Update nötig
  symptoms:
    - en: Check engine lamp on after two trips
      de: Motorkontrollleuchte nach zwei Fahrten an
    - en: Engine stays on all cylinders, fuel use rises
      de: Motor läuft dauerhaft auf allen Zylindern, Verbrauch steigt
    - en: Ticking noise at idle
      de: Tickgeräusch im Leerlauf
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 4500]
    estimated_hours: [0.5, 14]
