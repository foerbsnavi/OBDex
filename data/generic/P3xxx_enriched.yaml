- code: P34B9
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Range/Performance Bank 2
    de: Nockenwellenversteller B Temperaturfühler Bereich/Funktion Bank 2
  description:
    en: "With P34B9 the bank 2 exhaust actuator reports a temperature that is electrically valid but does not make sense. A two-bank engine offers an obvious yardstick: after a long cold soak both exhaust actuators should read almost the same, and under equal load they should warm alike. Whether any carmaker applies such logic to P34B9 is not published; the code appears only in lists such as the one from NTN-SNR. CARB requires VVT input components to be checked for rationality where feasible, not just for open and shorted circuits. A drifting sensor, a contact resistance that shifts the reading or outdated module software are the plausible causes. In Aisin's design a false hot value would cut motor current needlessly. Bank 1: P34B5."
    de: "Bei P34B9 meldet der Auslassversteller auf Bank 2 eine Temperatur, die elektrisch gültig, aber nicht stimmig ist. Ein Motor mit zwei Bänken bietet einen naheliegenden Maßstab: Nach langer Standzeit in der Kälte sollten beide Auslassversteller fast gleich anzeigen und sich bei gleicher Last ähnlich erwärmen. Ob ein Hersteller P34B9 so prüft, ist nicht veröffentlicht; der Code steht nur in Listen wie der von NTN-SNR. CARB verlangt für Eingangsbauteile der Ventilverstellung, wo machbar, eine Plausibilitätsprüfung zusätzlich zur Kontrolle auf Unterbrechung und Kurzschluss. In Frage kommen ein driftender Fühler, ein Übergangswiderstand, der den Wert verschiebt, oder veraltete Software. Im Aisin-Konzept würde ein falscher Heißwert den Motorstrom grundlos senken. Bank 1: P34B5."
  affected_components:
    - cam_actuator_b_temp_sensor_b2
  common_causes:
    - id: sensor_drift
      likelihood: medium
      label:
        en: Bank 2 actuator temperature sensor drifting
        de: Temperaturfühler des Verstellers auf Bank 2 driftet
    - id: contact_resistance
      likelihood: medium
      label:
        en: Contact resistance at the plug shifting the value
        de: Übergangswiderstand am Stecker verschiebt den Wert
    - id: module_software
      likelihood: low
      label:
        en: Module software outdated
        de: Software des Steuergeräts veraltet
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Usually no change in driveability
      de: Fahrverhalten meist unverändert
