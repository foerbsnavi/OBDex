- code: P3485
  category: powertrain
  title:
    en: Cylinder 11 Exhaust Valve Control Circuit/Open
    de: Zylinder 11 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "P3485 is triggered by an open circuit on a separate exhaust valve actuator at cylinder 11. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Bentley's engineers say their W12 shut-off leaves both valve sets working, and they rotate the dormant bank to keep it hot; Lamborghini's Aventador V12 and Audi's group V10 likewise talk only about banks. No published system on an engine of this size switches the exhaust valve of an individual cylinder. A GM patent explains why exhaust timing is a topic of its own: its hydraulic control valves deactivate the exhaust valves first and bring them back first. Electrically, treat P3485 like any open actuator line. P3487 and P3488 report shorts, P3486 a functional fault."
    de: "P3485 löst eine Unterbrechung am Kreis eines eigenen Auslassventil-Stellglieds von Zylinder 11 aus. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bentleys Ingenieure sagen, ihre W12-Abschaltung lasse beide Ventilsätze weiterarbeiten, und sie wechseln die ruhende Bank, damit sie warm bleibt; auch Lamborghini beim Aventador-V12 und der Konzern-V10 sprechen nur von Bänken. Kein veröffentlichtes System dieser Motorgröße schaltet das Auslassventil eines einzelnen Zylinders. Warum der Auslass ein eigenes Thema ist, erklärt ein GM-Patent: Seine hydraulischen Steuerventile schalten die Auslassventile zuerst ab und zuerst wieder zu. Elektrisch gilt P3485 als gewöhnliche Unterbrechung. Schlüsse melden P3487 und P3488, Funktionsfehler P3486."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: medium
      label:
        en: Open wire to the cylinder 11 exhaust actuator
        de: Leitung zum Auslass-Stellglied von Zylinder 11 offen
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Coil of the cylinder 11 exhaust actuator open
        de: Spule des Auslass-Stellglieds von Zylinder 11 offen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Connector at the exhaust actuator corroded
        de: Stecker am Auslass-Stellglied korrodiert
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output defective
        de: Ausgang des Motorsteuergeräts defekt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer drops to half its cylinders
      de: Motor schaltet nicht mehr auf die Hälfte der Zylinder
