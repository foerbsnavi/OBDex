        de: Leitung zum Auslass-Stellglied von Zylinder 12 offen
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Coil of the cylinder 12 exhaust actuator interrupted
        de: Spule des Auslass-Stellglieds von Zylinder 12 unterbrochen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Exhaust actuator connector corroded
        de: Stecker am Auslass-Stellglied korrodiert
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module output failed
        de: Ausgang des Steuergeräts ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Partial-cylinder operation unavailable
      de: Teilzylinderbetrieb nicht verfügbar
