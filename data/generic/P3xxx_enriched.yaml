- code: P3480
  category: powertrain
  title:
    en: Cylinder 10 Exhaust Valve Control Circuit High
    de: Zylinder 10 Auslassventil Steuerkreis hoch
  description:
    en: If the control line of the cylinder 10 exhaust valve actuator is held near supply voltage, the engine computer stores P3480. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. A ten-cylinder engine has no cylinder 11 or 12, so P3480 is the last exhaust-valve code a V10 could ever use; the R8 V10 still does without it because its shut-off works through injection and ignition. Sorting out a high circuit means looking for a wire chafed against a feed, a backprobe left in a connector, or a coil with shorted windings. P3477 (open) and P3479 (low) are the other electrical faults of this actuator, P3476 the intake equivalent on cylinder 10.
    de: Liegt die Steuerleitung des Auslassventil-Stellglieds von Zylinder 10 nahe der Versorgungsspannung, speichert das Motorsteuergerät P3480. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Ein Zehnzylinder hat keinen Zylinder 11 oder 12; P3480 ist damit der letzte Auslassventil-Code, den ein V10 überhaupt nutzen könnte. Der R8-V10 braucht ihn trotzdem nicht, weil seine Abschaltung über Einspritzung und Zündung läuft. Bei einem zu hohen Kreis sucht man nach einer Leitung, die an einer Versorgung scheuert, nach einer im Stecker vergessenen Messspitze oder nach einer Spule mit Windungsschluss. Die anderen elektrischen Fehler dieses Stellglieds sind P3477 (offen) und P3479 (niedrig), das Einlass-Gegenstück an Zylinder 10 ist P3476.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 10 shorted to a feed
        de: Leitung zum Auslass-Stellglied von Zylinder 10 mit Schluss zur Versorgung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted windings in the exhaust actuator coil
        de: Windungsschluss in der Spule des Auslass-Stellglieds
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output defective
        de: Ausgang des Motorsteuergeräts defekt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off disabled
      de: Zylinderabschaltung deaktiviert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
