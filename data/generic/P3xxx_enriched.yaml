- code: P3429
  category: powertrain
  title:
    en: Cylinder 4 Exhaust Valve Control Circuit/Open
    de: Zylinder 4 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "P3429 stands for an open circuit to an actuator that would switch nothing but cylinder 4's exhaust valves. No manufacturer documents this code publicly, although few cylinders are deactivated as often: GM's AFM V8s (bulletin 20-NA-038), the Hemi with MDS and Mazda CX-5 and Mazda6 four-cylinders with deactivation all idle cylinder 4; Mazda's alert SA-041/18 names cylinders 1 and 4 as the deactivation area where rocker arms can fall out. In the GM design reviewed by NHTSA in 2025, one solenoid per cylinder works the intake and exhaust lifter together, so interrupted wiring is reported as P3425. A layout with a separate exhaust output would still owe CARB a continuity test. P3430 to P3432 complete this exhaust group."
    de: "P3429 bezeichnet eine Unterbrechung im Kreis eines Stellglieds, das nur die Auslassventile von Zylinder 4 schaltet. Kein Hersteller dokumentiert diesen Code öffentlich, obwohl kaum ein Zylinder so oft abgeschaltet wird: GMs AFM-V8 (Bulletin 20-NA-038), der Hemi mit MDS und die Vierzylinder von Mazda CX-5 und Mazda6 mit Abschaltung legen Zylinder 4 still; Mazdas Hinweis SA-041/18 nennt die Zylinder 1 und 4 als Abschaltbereich, in dem Kipphebel herausfallen können. Bei der GM-Bauart, die NHTSA 2025 untersucht hat, betätigt ein Magnetventil pro Zylinder beide Stößel, Ein- wie Auslass,, eine unterbrochene Leitung wird daher als P3425 gemeldet. Eine Anordnung mit eigenem Auslass-Ausgang schuldete CARB dennoch eine Durchgangsprüfung. P3430 bis P3432 ergänzen diese Auslassgruppe."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Open conductor or pushed-out pin to the cylinder 4 exhaust actuator
        de: Unterbrochener Leiter oder herausgedrückter Pin zum Auslass-Stellglied von Zylinder 4
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Exhaust actuator coil burnt open
        de: Spule des Auslass-Stellglieds durchgebrannt
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module output not switching
        de: Ausgang des Steuergeräts schaltet nicht
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Fuel-saving mode inactive
      de: Sparmodus inaktiv
  repair:
    difficulty: medium
    diy_possible: true
