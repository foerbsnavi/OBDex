- code: P34AC
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit Bank 1
    de: Nockenwellenversteller A Positionssensor A Stromkreis Bank 1
  description:
    en: "P34AC covers any electrical fault in the circuit of position sensor A of the intake cam actuator on bank 1. On engines with an electric intake phaser this sensor tells the controller where the drive motor stands. Mitsubishi has the code in its 2022 Outlander manual: the electric intake valve timing module logs it when the sensor voltage is too low or too high for one second or longer, and names wiring with an open or short as well as the actuator itself. In fail-safe the phaser is parked at its base angle, the intake runner valve opens, EGR stops and the cold-start stratified mode is dropped. The check runs once the engine has been above 2,000 rpm for a second and first appears as a pending code. Low and high are P34AE and P34AF."
    de: "P34AC erfasst jeden elektrischen Fehler im Kreis von Positionssensor A des Einlassverstellers auf Bank 1. Bei Motoren mit elektrischem Einlassversteller meldet dieser Sensor dem Steuergerät, wo der Stellmotor gerade steht. Mitsubishi belegt den Code für den Outlander 2022: Das Steuergerät der elektrischen Einlass-Ventilsteuerung speichert ihn, wenn die Sensorspannung eine Sekunde oder länger unter- oder oberhalb ihres Fensters liegt; als Ursachen nennt es Leitungen mit Unterbrechung oder Kurzschluss sowie den Steller selbst. Im Notlauf bleibt der Versteller in Grundstellung, die Saugrohrklappe öffnet, die Abgasrückführung ruht und der geschichtete Kaltstart entfällt. Geprüft wird, sobald der Motor eine Sekunde über 2000/min lief; zuerst erscheint ein vorläufiger Code. Zu niedrig und zu hoch melden P34AE und P34AF."
  affected_components:
    - cam_actuator_a_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: wiring
      likelihood: high
      label:
        en: Actuator harness open or shorted, plug loose
        de: Kabelbaum zum Steller unterbrochen oder kurzgeschlossen, Stecker locker
    - id: actuator_sensor
      likelihood: medium
      label:
        en: Position sensor in the electric actuator failed (actuator replacement)
        de: Positionssensor im elektrischen Steller defekt (Steller tauschen)
    - id: control_module
      likelihood: low
      label:
        en: Electric valve timing control module faulty
        de: Steuergerät der elektrischen Ventilsteuerung defekt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake cam held in its base position, less torque at low revs
      de: Einlassnocke in Grundstellung, weniger Drehmoment untenherum
    - en: Rougher cold start, slightly higher consumption
      de: Rauerer Kaltstart, etwas höherer Verbrauch
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [80, 900]
    estimated_hours: [0.5, 3]
