- code: P34B3
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit High Bank 2
    de: Nockenwellenversteller A Positionssensor A Stromkreis zu hoch Bank 2
  description:
    en: "P34B3 marks a signal above the upper limit from position sensor A on the intake phaser of bank 2. An interrupted ground, a signal wire touching a supply voltage or a worn-out sensor are the usual findings. No carmaker publishes the code. The nearest documented case is Mitsubishi's bank 1 code P34AF on the 2022 Outlander: the high value must persist for at least a second, and the Hall sensor of the actuator motor is listed as a possible cause. With an electric phaser the sensor therefore sits inside the actuator, and a sensor fault usually means replacing the actuator. NTN-SNR lists P34B3 as the inlet-side position sensor A on the second bank with too high a signal. The engine keeps running with the bank 2 phaser at its base angle."
    de: "P34B3 kennzeichnet ein Signal über der oberen Grenze von Positionssensor A am Einlassversteller von Bank 2. Typisch sind eine unterbrochene Masse, ein Signal, das Versorgungsspannung abbekommt, oder ein ausgefallener Sensor. Eine Herstellerbeschreibung des Codes ist nicht öffentlich. Am nächsten liegt Mitsubishis Bank-1-Code P34AF beim Outlander 2022: Der zu hohe Wert muss mindestens eine Sekunde anstehen, und als mögliche Ursache steht der Hallsensor des Stellmotors. Bei elektrischen Verstellern steckt der Sensor also im Steller, ein Sensorfehler bedeutet meist einen neuen Steller. NTN-SNR führt P34B3 als einlassseitigen Positionssensor A der zweiten Bank mit zu hohem Signal. Der Motor läuft weiter, der Versteller von Bank 2 bleibt in Grundstellung."
  affected_components:
