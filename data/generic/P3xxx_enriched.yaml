- code: P3430
  category: powertrain
  title:
    en: Cylinder 4 Exhaust Valve Control Performance
    de: Zylinder 4 Auslassventil Steuerung Funktion
  description:
    en: "P3430 would cover exhaust valves on cylinder 4 that keep opening, or stay shut, against the command while the circuit itself is sound. No manufacturer documents this code publicly. Ford shows both sides of the problem: a Ford patent recognises an exhaust valve opening after shutdown from changes in exhaust pressure and responds by reactivating the cylinder and storing a code, while in practice the 2025 F-150 5.0 l reports a cylinder 4 switching fault as P3426 and traces it to a restricted solenoid oil feed tube (bulletin 26-2093). An exhaust valve that does not stay closed lets fresh air reach the catalyst and the oxygen sensors, which can show up as fuel trim errors, misfire counts and vibration."
    de: "P3430 deckte Auslassventile an Zylinder 4 ab, die gegen den Befehl weiter öffnen oder geschlossen bleiben, bei elektrisch intaktem Kreis. Kein Hersteller dokumentiert diesen Code öffentlich. Ford zeigt beide Seiten des Problems: In einem Ford-Patent fällt ein Auslassventil, das trotz Abschaltung öffnet, durch veränderten Abgasdruck auf; die Steuerung schaltet den Zylinder daraufhin wieder zu und legt einen Code ab; in der Praxis meldet der F-150 5,0 l (2025) einen Schaltfehler an Zylinder 4 aber als P3426 und führt ihn auf ein verengtes Ölzulaufrohr der Ventile zurück (Bulletin 26-2093). Bleibt ein Auslassventil nicht zu, gelangt Frischluft zu Katalysator und Lambdasonden – sichtbar als Gemischfehler, Fehlzündungszähler und Vibrationen."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: oil_feed_restricted
      likelihood: medium
      label:
        en: Restricted oil supply to the cylinder 4 switching elements
        de: Behinderte Ölversorgung der Schaltelemente von Zylinder 4
    - id: exhaust_switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter or rocker of cylinder 4 not changing state
        de: Auslassstößel oder Kipphebel von Zylinder 4 wechselt den Zustand nicht
    - id: low_or_degraded_oil
      likelihood: low
      label:
        en: Oil too thin, too old or too low
        de: Öl zu dünn, zu alt oder zu wenig
  symptoms:
    - en: Vibration in reduced-cylinder mode
      de: Vibrationen im Teilzylinderbetrieb
    - en: Lean or rich fuel trim codes
      de: Codes für mageres oder fettes Gemisch
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
