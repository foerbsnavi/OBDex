- code: P340A
  category: powertrain
  title:
    en: Deactivation/Intake Valve Control Circuit Bank 1
    de: Abschaltung/Einlassventil Steuerkreis Bank 1
  description:
    en: "P340A is meant for engines that switch the intake valves of a whole bank through a shared control circuit, rather than one solenoid per cylinder. It reports an electrical fault in that bank 1 circuit, without saying whether it is open or shorted. No manufacturer documents this code publicly, which leaves it without known limits; CARB merely demands that outputs of this kind be monitored for breaks and shorts. The common systems are built per cylinder: GM's DFM V8 has one solenoid per cylinder in the valley, so faults go to codes such as P3401. Honda's VCM V6 reports bank-level trouble as P3400. Bank 2 is P340B, the exhaust side P340C, the bank 1 function check P341A. Expect a warning lamp and no reduced-cylinder mode."
    de: "P340A ist für Motoren gedacht, die die Einlassventile einer ganzen Bank über einen gemeinsamen Steuerkreis schalten statt über je ein Magnetventil pro Zylinder. Der Code meldet einen elektrischen Fehler in diesem Kreis von Bank 1, ohne zwischen Unterbrechung und Kurzschluss zu trennen. Kein Hersteller dokumentiert ihn öffentlich, veröffentlichte Schwellen fehlen daher; CARB verlangt lediglich, solche Ausgangskreise auf Unterbrechung und Kurzschluss zu prüfen. Die verbreiteten Systeme arbeiten zylinderweise: GMs DFM-V8 hat im V des Blocks ein Ventil je Zylinder und meldet Fehler etwa als P3401, Hondas VCM-V6 legt Bankfehler als P3400 ab. Bank 2 ist P340B, die Auslassseite P340C, die Funktionsprüfung P341A. Zu erwarten: Warnleuchte, kein Teilzylinderbetrieb."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_fault
      likelihood: medium
      label:
        en: Damaged, open or shorted wire in the bank 1 control circuit
        de: Beschädigte, unterbrochene oder kurzgeschlossene Leitung im Steuerkreis von Bank 1
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose connector at the bank 1 actuator
        de: Korrodierter oder lockerer Stecker am Stellglied von Bank 1
    - id: actuator_coil_fault
      likelihood: medium
      label:
        en: Bank 1 intake deactivation actuator with open or shorted coil
        de: Einlass-Abschaltstellglied von Bank 1 mit unterbrochener oder kurzgeschlossener Spule
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage fault in the engine control module
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled on bank 1
      de: Zylinderabschaltung auf Bank 1 gesperrt
    - en: Higher fuel consumption at light load
      de: Höherer Verbrauch bei geringer Last
  repair:
