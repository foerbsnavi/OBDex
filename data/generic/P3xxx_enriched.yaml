    - sae:J2012
  related_codes: [P3469, P3471, P3472, P3466, P0309]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://patents.google.com/patent/US8006670B2/en
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
    - https://www.pistonheads.com/news/ph-eurocars/lamborghini-huracan-my16-update/33255
  reviewed: '2026-11-02'

- code: P3471
  category: powertrain
  title:
    en: Cylinder 9 Exhaust Valve Control Circuit Low
    de: Zylinder 9 Auslassventil Steuerkreis niedrig
  description:
    en: "A low reading on the control line of the cylinder 9 exhaust valve actuator triggers P3471, most often a wire grounded against the engine or body. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Because known shut-off systems on engines above eight cylinders either drop a whole bank by fuel and spark (Audi R8 V10) or close the valves with one shared actuator per cylinder (as in GM's design), a separately wired exhaust actuator on cylinder 9 would be unusual. If such a circuit is present, test it the same way as the intake circuit: resistance to ground with the connector unplugged, then the coil. P3469 is the open-circuit fault, P3472 the short to voltage, P3467 the matching intake code."
    de: "Ein zu niedriger Pegel an der Steuerleitung des Auslassventil-Stellglieds von Zylinder 9 löst P3471 aus, meist eine Leitung mit Masseschluss an Motor oder Karosserie. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Die bekannten Abschaltsysteme oberhalb von acht Zylindern legen entweder eine ganze Bank über Einspritzung und Zündung still (Audi R8-V10) oder schließen die Ventile mit einem gemeinsamen Stellglied je Zylinder, wie GMs Technik zeigt; ein eigens verdrahtetes Auslass-Stellglied an Zylinder 9 wäre daher ungewöhnlich. Ist ein solcher Kreis vorhanden, prüft man ihn wie den Einlasskreis: Widerstand gegen Masse bei abgezogenem Stecker, danach die Spule. Unterbrechung meldet P3469, Plusschluss P3472, die Einlassseite P3467."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 9 grounded
        de: Leitung zum Auslass-Stellglied von Zylinder 9 mit Masseschluss
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the exhaust actuator
        de: Innerer Schluss im Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output damaged
        de: Ausgang des Motorsteuergeräts beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Partial-cylinder mode unavailable
      de: Teilzylinderbetrieb nicht verfügbar
  repair:
    difficulty: medium
