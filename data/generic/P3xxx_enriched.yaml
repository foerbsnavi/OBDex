- code: P3441
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 6 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: "Cylinder 6 belongs to both classic V8 deactivation groups, so P3441 is a code that real engines set. On GM V8s with Active Fuel Management, which park cylinders 1, 7, 6 and 4, the 2019 tables list it for the L86 truck engine and the LT4 Corvette: with the low-side driver off, more than 200 kohm between output and ground counts as an open, and 20 failures in 25 samples (every 250 ms, from 400 rpm) store a Type B code. The L84 with Dynamic Fuel Management runs the same check from 425 rpm. Chrysler names P3441 for the 5.7 L Hemi with MDS; a STAR case blames a heat shield rubbing through the solenoid harness. Shorts on this circuit are P3443 and P3444."
    de: "Zylinder 6 gehört zu beiden klassischen V8-Abschaltgruppen, P3441 tritt also an echten Motoren auf. Bei GMs Active Fuel Management, das die Zylinder 1, 7, 6 und 4 stilllegt, führen die Tabellen 2019 den Code für den Pick-up-Motor L86 und den LT4 der Corvette: Zeigt der Ausgang bei abgeschalteter Low-Side-Endstufe mehr als 200 kOhm gegen Masse, gilt das als Unterbrechung; 20 Fehler unter 25 Proben (alle 250 ms, ab 400 U/min) speichern einen Type-B-Code. Der L84 mit Dynamic Fuel Management prüft genauso, ab 425 U/min. Chrysler nennt P3441 beim 5,7-l-Hemi mit MDS; ein STAR-Fall macht ein Hitzeschild verantwortlich, das den Kabelbaum der Magnetventile durchscheuert. Schlüsse in diesem Kreis melden P3443 und P3444."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Solenoid harness broken or chafed through (on the 5.7 L Hemi by the manifold heat shield)
        de: Kabelbaum der Magnetventile gebrochen oder durchgescheuert (beim 5,7-l-Hemi durch das Krümmer-Hitzeschild)
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 6 deactivation solenoid
        de: Spule im Abschalt-Magnetventil von Zylinder 6 unterbrochen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Loose or corroded connector at the cylinder 6 solenoid
        de: Lockerer oder korrodierter Stecker am Magnetventil von Zylinder 6
    - id: pcm_software
      likelihood: low
      label:
        en: Control module software that needs an update (Chrysler TSB 18-002-25)
        de: Steuergeräte-Software mit Update-Bedarf (Chrysler TSB 18-002-25)
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer drops to four-cylinder mode
      de: Motor wechselt nicht mehr in den Vierzylinderbetrieb
    - en: Possibly circuit codes for cylinders 1, 4 and 7 as well if the shared harness is damaged
      de: Eventuell auch Kreiscodes für Zylinder 1, 4 und 7, wenn der gemeinsame Kabelbaum beschädigt ist
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
