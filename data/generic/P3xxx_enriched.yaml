- code: P3407
  category: powertrain
  title:
    en: Cylinder 1 Exhaust Valve Control Circuit Low
    de: Zylinder 1 Auslassventil Steuerkreis niedrig
  description:
    en: P3407 stands for a short to ground in the control circuit of a dedicated exhaust valve actuator on cylinder 1. No manufacturer documents this code publicly, so there are no published thresholds. As an analogy, GM's intake-side code P3403 counts an impedance under 0.5 ohm to ground, seen with the driver off, as a fault. CARB requires such output circuits to be checked for shorts. Engines with one shared solenoid per cylinder, like GM's AFM and DFM V8s, report this fault under the intake-side codes instead. An open exhaust circuit would be P3405, a short to power P3408. The car usually keeps running normally on all cylinders, with a warning lamp.
    de: "P3407 steht für einen Masseschluss im Steuerkreis eines eigenen Auslassventil-Stellglieds an Zylinder 1. Kein Hersteller dokumentiert diesen Code öffentlich, veröffentlichte Schwellen gibt es daher nicht. Zum Vergleich: GM wertet beim einlassseitigen P3403 weniger als 0,5 Ohm nach Masse bei ausgeschalteter Endstufe als Fehler. CARB verlangt, solche Ausgangskreise auf Kurzschlüsse zu prüfen. Motoren mit einem gemeinsamen Ventil je Zylinder wie GMs AFM- und DFM-V8 melden diesen Fehler stattdessen über die Einlass-Codes. Eine Unterbrechung auf der Auslassseite wäre P3405, ein Plusschluss P3408. Das Auto fährt meist normal auf allen Zylindern weiter, mit Warnleuchte."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Actuator control wire shorted to ground
        de: Steuerleitung des Stellglieds mit Masse verbunden
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internal short in the exhaust valve actuator
        de: Innerer Schluss im Auslassventil-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Fehler in der Endstufe des Motorsteuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: No change to reduced-cylinder mode
      de: Kein Wechsel in den Teilzylinderbetrieb
  repair:
