        de: Signalleitung mit Kontakt zu einer Versorgungsspannung
    - id: hall_sensor
      likelihood: medium
      label:
        en: Hall sensor in the actuator defective (actuator replacement)
        de: Hallsensor im Steller defekt (Steller tauschen)
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 intake phaser held at its base angle
      de: Einlassversteller von Bank 2 in Grundstellung gehalten
