    de: Zylinder 10 Auslassventil Steuerkreis niedrig
  description:
    en: "P3479 shows a short to ground, or another cause of a low signal, on the control line of the cylinder 10 exhaust valve actuator. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Engines with ten or more cylinders that deactivate cylinders include Audi's R8 V10, Lamborghini's Huracán V10 and Aventador V12, and Bentley's W12; the published descriptions of all of them talk about whole banks, not about a valve actuator per cylinder. If an engine does carry one, the check mirrors the intake low test known from GM's V8s: resistance to ground with the output off. Repair is wiring or actuator work around cylinder 10. Siblings: P3477 (open), P3480 (high), P3475 (intake low)."
    de: "P3479 zeigt einen Masseschluss oder eine andere Ursache für ein zu niedriges Signal an der Steuerleitung des Auslassventil-Stellglieds von Zylinder 10. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zu den Motoren mit zehn oder mehr Zylindern und Abschaltung zählen Audis R8-V10, der V10 des Lamborghini Huracán und der V12 des Aventador sowie Bentleys W12; deren veröffentlichte Beschreibungen sprechen durchweg von ganzen Bänken, nicht von einem Ventil-Stellglied je Zylinder. Hat ein Motor doch eines, ähnelt die Prüfung dem Einlass-Test von GMs V8: Widerstand gegen Masse bei abgeschaltetem Ausgang. Zu reparieren sind Leitungen oder das Stellglied an Zylinder 10. Geschwister: P3477 (offen), P3480 (hoch), P3475 (Einlass niedrig)."
