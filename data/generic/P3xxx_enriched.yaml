- code: P3438
  category: powertrain
  title:
    en: Cylinder 5 Exhaust Valve Control Performance
    de: Zylinder 5 Auslassventil Steuerung Funktion
  description:
    en: "P3438 describes an exhaust side of cylinder 5 that is commanded to deactivate or reactivate but does not follow, with an intact circuit. No manufacturer documents this code publicly. Two patents show why the exhaust side matters: in a GM patent application one shared valve switches the exhaust valves off, and back on, before the intake valves, so an exhaust lifter that lags breaks that order, and Ford detects an exhaust valve still opening after deactivation from exhaust pressure. If the exhaust valve keeps opening while the cylinder is off, the engine can run rough. GM's DFM engines report a cylinder whose valves stay active as P349C. The electrical codes for this channel are P3437, P3439 and P3440."
    de: "P3438 beschreibt eine Auslassseite von Zylinder 5, die ab- oder zugeschaltet werden soll, aber bei intaktem Kreis nicht folgt. Kein Hersteller dokumentiert diesen Code öffentlich. Zwei Patente zeigen, warum die Auslassseite zählt: in einer GM-Patentanmeldung schaltet ein gemeinsames Ventil die Auslassventile vor den Einlassventilen ab und auch vor ihnen wieder zu, ein nachhinkender Auslassstößel bricht diese Reihenfolge; Ford erkennt ein nach der Abschaltung weiter öffnendes Auslassventil am Abgasdruck. Öffnet das Auslassventil weiter, während der Zylinder abgeschaltet ist, kann der Motor unrund laufen. GMs DFM-Motoren melden einen Zylinder, dessen Ventile aktiv bleiben, als P349C. Die elektrischen Codes dieses Kanals sind P3437, P3439 und P3440."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter or rocker of cylinder 5 slow to switch
        de: Auslass-Stößel oder -Kipphebel von Zylinder 5 schaltet träge
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Insufficient oil pressure for switching
        de: Zu geringer Öldruck zum Umschalten
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator valve sticking
        de: Ventil des Auslass-Stellglieds klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Roughness or noise while cylinders are switched off
      de: Unruhe oder Geräusche bei abgeschalteten Zylindern
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
