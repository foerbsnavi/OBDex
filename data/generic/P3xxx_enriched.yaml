- code: P3467
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 9 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "With P3467 the control line of the cylinder 9 deactivation or intake valve actuator reads too low, which usually means it is touching ground. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Twelve-cylinder engines with cylinder shut-off do exist, for instance Mercedes' M137 and Lamborghini's Aventador V12 introduced in 2012, but no published diagnostic list connects this number to them. GM's matching test on its V8 engines looks for less than 0.5 ohm to ground with the driver switched off and only runs above 11 V and 425 rpm. On a low-side driven solenoid, a ground fault can keep the coil energised, so the cylinder may drop out when it should fire. Siblings: P3465 open circuit, P3468 short to voltage."
    de: "P3467 heißt: Die Steuerleitung des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 9 liegt zu niedrig, meist wegen einer Verbindung nach Masse. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zwölfzylinder mit Zylinderabschaltung gibt es durchaus, etwa den M137 von Mercedes oder den V12 des Lamborghini Aventador, eingeführt 2012, doch keine veröffentlichte Diagnoseliste ordnet ihnen diese Nummer zu. GMs gleichartige Prüfung an V8-Motoren sucht bei abgeschaltetem Treiber nach weniger als 0,5 Ohm gegen Masse und läuft nur oberhalb von 11 V und 425 U/min. Bestromt der Schluss ein masseseitig geschaltetes Ventil dauerhaft, kann der Zylinder ungewollt ausfallen. Geschwister: P3465 Unterbrechung, P3468 Schluss nach Plus."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 9 control wire shorted to ground
        de: Steuerleitung von Zylinder 9 mit Masseschluss
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 9 solenoid
        de: Innerer Schluss im Magnetventil von Zylinder 9
    - id: connector_water
      likelihood: low
      label:
        en: Moisture in the solenoid connector
        de: Feuchtigkeit im Stecker des Magnetventils
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty driver in the engine control module
        de: Fehlerhafte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled
      de: Zylinderabschaltung gesperrt
    - en: Possible misfire on cylinder 9 if the actuator stays energised
      de: Mögliche Fehlzündungen auf Zylinder 9, wenn das Stellglied bestromt bleibt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
