- code: P3405
  category: powertrain
  title:
    en: Cylinder 1 Exhaust Valve Control Circuit/Open
    de: Zylinder 1 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "J2012 reserves P3405 for an open control circuit of a separate exhaust valve actuator on cylinder 1. No manufacturer documents this code publicly. The common systems do not need it: in GM's Dynamic Fuel Management one solenoid per cylinder feeds oil to both intake and exhaust lifters, and Ford's VDE only lists intake codes for cylinder 1. A GM patent application uses one shared hydraulic valve and only sets the order, with the exhaust valves switched off and back on before the intake valves; a Ford patent watches the exhaust valve via exhaust pressure. A separate exhaust actuator would fall under CARB's output component rule, which asks for continuity checks. If used, an open coil or wire would set P3405, while P3401 covers the intake side and P3406-P3408 the other exhaust faults."
    de: "J2012 sieht P3405 für einen unterbrochenen Steuerkreis eines eigenen Auslassventil-Stellglieds an Zylinder 1 vor. Kein Hersteller dokumentiert diesen Code öffentlich. Die verbreiteten Systeme brauchen ihn nicht: Bei GMs Dynamic Fuel Management versorgt ein Magnetventil je Zylinder Einlass- und Auslassstößel gemeinsam, und Fords VDE führt für Zylinder 1 nur Einlass-Codes. Eine GM-Patentanmeldung nutzt ein gemeinsames Hydraulikventil und legt nur die Reihenfolge fest: Auslassventile schalten vor den Einlassventilen ab und auch vor ihnen wieder zu. Ein Ford-Patent überwacht das Auslassventil am Abgasdruck. Ein eigenes Auslass-Stellglied fiele unter die CARB-Vorgabe mit Durchgangsprüfung. Wo er genutzt wird, steht P3405 für eine offene Spule oder Leitung; P3401 betrifft die Einlassseite, P3406–P3408 die übrigen Auslassfehler."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken wire or loose terminal to the exhaust valve actuator
        de: Leitungsbruch oder lockerer Kontakt zum Auslassventil-Stellglied
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 1 exhaust valve actuator
        de: Unterbrochene Spule im Auslassventil-Stellglied von Zylinder 1
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output driver fault in the engine control module
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation or valve switching disabled
      de: Zylinderabschaltung bzw. Ventilumschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3406, P3407, P3408, P3401, P3400]
  sources:
