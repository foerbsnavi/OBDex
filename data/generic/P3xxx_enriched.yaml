- code: P3400
  category: powertrain
  title:
    en: Cylinder Deactivation System Bank 1
    de: Zylinderabschaltsystem Bank 1
  description:
    en: "P3400 is the bank-level verdict: the engine computer has concluded that cylinder deactivation on bank 1 as a whole does not behave as commanded, without blaming a single circuit. Makers fill it differently. On the 2019 LT4 Corvette, GM compares a manifold pressure model with all cylinders firing against the same model while cylinders are off; 100 failed samples out of 200 give a Type B code. Mazda's 2.5 l four-cylinders store it when a deactivation oil control valve is clogged, for example by plastic from the filter wrapper (SA-061/20). In Honda's VCM V6 it stems from a rocker arm oil pressure switch, and the Hemi Ram 1500 got a PCM update for it. Bank 2 is P3497. The lamp comes on; misfires or rough running may follow."
    de: "Mit P3400 urteilt das Steuergerät über die ganze Bank 1: Die Zylinderabschaltung dort arbeitet nicht wie befohlen, ein bestimmter Stromkreis wird aber nicht benannt. Die Hersteller belegen den Code unterschiedlich. GM vergleicht beim LT4 der Corvette (2019) ein Saugrohrdruck-Modell mit allen Zylindern gegen dasselbe Modell bei abgeschalteten Zylindern; 100 Fehlproben von 200 ergeben einen Type-B-Code. Mazda kennt ihn bei den 2,5-l-Vierzylindern, wenn ein Ölsteuerventil der Abschaltung verstopft ist, etwa durch Plastikfetzen der Filterhülle (SA-061/20). Bei Honda hängt er am Öldruckschalter der VCM-Kipphebel, Ram bietet für den Hemi ein PCM-Update. Bank 2 meldet P3497. Die Leuchte geht an, oft mit Fehlzündungen oder unrundem Lauf."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - oil_control_valve
  common_causes:
    - id: oil_control_valve_blocked
      likelihood: high
      label:
        en: Deactivation oil control valve or its screen clogged by debris
        de: Ölsteuerventil der Abschaltung oder sein Sieb durch Fremdkörper verstopft
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Low oil level, wrong grade or overdue oil change
        de: Zu wenig Öl, falsche Sorte oder überfälliger Ölwechsel
    - id: switching_element_failed
      likelihood: medium
      label:
        en: Switchable rocker arm or lifter broken, dislodged or not latching
        de: Schaltbarer Kipphebel oder Stößel gebrochen, verrutscht oder rastet nicht
    - id: oil_pressure_out_of_range
      likelihood: low
      label:
        en: Oil pressure too high on cold start, e.g. weak relief valve spring
        de: Zu hoher Öldruck beim Kaltstart, etwa durch schwache Überdruckventilfeder
    - id: ecm_software
      likelihood: low
      label:
        en: Engine control software needing an update
        de: Motorsteuergeräte-Software, die ein Update braucht
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough idle or misfire codes on the deactivating cylinders
      de: Unruhiger Leerlauf oder Fehlzündungscodes auf den abschaltbaren Zylindern
    - en: Ticking or clattering from the valve train
      de: Ticken oder Klappern aus dem Ventiltrieb
    - en: Reduced-cylinder mode no longer used, higher fuel use
      de: Teilzylinderbetrieb entfällt, höherer Verbrauch
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 4000]
