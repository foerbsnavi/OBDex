- code: P3482
  category: powertrain
  title:
    en: Cylinder 11 Deactivation/Intake Valve Control Performance
    de: Zylinder 11 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3482 is the functional check for cylinder 11: the actuator circuit is electrically fine, but the cylinder does not actually go dormant or wake up when told to. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Bentley's Bentayga and Continental W12 can run on six of twelve cylinders, yet the published description has the valves keep working, so a valve-switching failure cannot arise there. Engines that do close valves rely on oil pressure acting on switching lifters, as NHTSA's review of GM's lifter design lays out in detail; contaminated or low oil and worn locking pins are the usual reasons for a missed switch. The electrical counterparts on cylinder 11 are P3481, P3483 and P3484."
    de: "P3482 ist die Funktionsprüfung für Zylinder 11: Der Kreis des Stellglieds ist elektrisch in Ordnung, doch der Zylinder ruht nicht oder erwacht nicht, wenn er soll. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bentleys Bentayga und Continental mit W12 können auf sechs von zwölf Zylindern fahren, die veröffentlichte Beschreibung lässt die Ventile dabei aber weiterarbeiten – ein Fehler der Ventilumschaltung kann dort nicht auftreten. Motoren, die Ventile schließen, brauchen Öldruck an schaltbaren Stößeln, wie die NHTSA-Untersuchung zu GMs Stößeln zeigt. Verschmutztes oder zu wenig Öl und abgenutzte Sperrstifte sind die üblichen Gründe für ein verpasstes Umschalten. Elektrische Gegenstücke an Zylinder 11: P3481, P3483, P3484."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Contaminated or insufficient oil for switching cylinder 11
        de: Verschmutztes oder zu wenig Öl zum Umschalten von Zylinder 11
    - id: lifter_locking_pin_stuck
      likelihood: medium
      label:
        en: Worn or sticking locking pins at cylinder 11
        de: Abgenutzte oder klemmende Sperrstifte an Zylinder 11
    - id: oil_screen_blocked
      likelihood: medium
      label:
        en: Oil screen to the cylinder 11 actuator clogged
        de: Ölsieb zum Stellglied von Zylinder 11 verstopft
    - id: solenoid_oring_leak
      likelihood: low
      label:
        en: Actuator seal leaking pressure
        de: Dichtung am Stellglied verliert Druck
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire on cylinder 11 (P0311)
      de: Fehlzündungen auf Zylinder 11 (P0311)
    - en: Noticeable shudder when switching modes
      de: Spürbares Rütteln beim Wechsel der Betriebsart
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3481, P3483, P3484, P3486, P0311, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
