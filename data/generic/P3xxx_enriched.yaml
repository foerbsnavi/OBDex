- code: P34B6
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit Low Bank 1
    de: Nockenwellenversteller B Temperaturfühler Stromkreis zu niedrig Bank 1
  description:
    en: "Circuit Low means the voltage on the signal wire of the exhaust actuator B temperature sensor (bank 1) stays under its lower limit. Which temperature that stands for depends on a sensor curve that no public source gives; with a thermistor whose resistance falls as it warms, a short to ground would look like extreme heat. Aisin's patent shows what a hot reading triggers: the controller lowers the motor current and may even switch the motor off at a preset threshold, so exhaust phasing loses authority. In the NTN-SNR catalogue P34B6 appears as an undersized outlet-side signal. Wires rubbing on the cylinder head and a sensor shorted inside are the main suspects. No carmaker documents P34B6. High: P34B7; bank 2: P34BA."
    de: "Zu niedrig heißt hier: Die Spannung auf der Signalleitung des Temperaturfühlers am Auslassversteller B (Bank 1) bleibt unter ihrer Untergrenze. Welche Temperatur dem entspricht, hängt von einer Kennlinie ab, deren Werte nirgends öffentlich stehen. Nimmt man einen Heißleiter an, dessen Widerstand mit der Wärme sinkt, sähe ein Masseschluss wie starke Hitze aus. Was ein Heißwert auslöst, zeigt das Aisin-Patent: Das Steuergerät senkt den Motorstrom und kann den Motor ab einer festen Schwelle sogar abschalten – die Auslassverstellung verliert dann an Wirkung. Im Katalog von NTN-SNR erscheint P34B6 als zu kleines Signal der Auslassseite. Verdächtig sind vor allem am Zylinderkopf scheuernde Leitungen und ein innen kurzgeschlossener Fühler. Kein Hersteller dokumentiert P34B6. Zu hoch: P34B7, Bank 2: P34BA."
  affected_components:
    - cam_actuator_b_temp_sensor_b1
    - sensor_wiring
