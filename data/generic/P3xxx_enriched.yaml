- code: P3402
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Control Performance
    de: Zylinder 1 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "This code reports that cylinder 1 does not respond as expected when the engine computer switches it off or back on, although the control circuit itself tests fine. Ford lists P3402 in its Variable Displacement Engine monitor for 2020-2023 gasoline engines: it runs continuously during deactivation, entry and exit, between 400 and 4500 rpm and once oil pressure has had about two seconds to build. GM handles the mechanical check for cylinder 1 under its own code P3498 instead. Wiring faults on the same channel set P3401, P3403 or P3404. A driver typically notices a warning lamp, a shake when the engine changes modes, or a misfire on cylinder 1."
    de: "P3402 meldet, dass Zylinder 1 beim Ab- oder Zuschalten nicht wie erwartet reagiert, obwohl der Steuerkreis elektrisch in Ordnung ist. Ford führt den Code in seiner Überwachung „Variable Displacement Engine“ der Benziner 2020–2023: Sie läuft während der Abschaltung sowie beim Ein- und Ausstieg, zwischen 400 und 4500 U/min und erst, wenn der Öldruck rund zwei Sekunden Zeit zum Aufbau hatte. GM prüft dieselbe Mechanik bei Zylinder 1 unter dem eigenen Code P3498. Leitungsfehler desselben Kanals laufen als P3401, P3403 oder P3404. Im Alltag zeigen sich Warnleuchte, Ruckeln beim Moduswechsel oder Fehlzündungen auf Zylinder 1."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Low oil level, wrong viscosity or aged oil slows the hydraulic switching
        de: Zu wenig, falsches oder gealtertes Öl verzögert das hydraulische Umschalten
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Switchable lifter or rocker of cylinder 1 sticking or not latching
        de: Schaltbarer Stößel oder Kipphebel an Zylinder 1 klemmt oder rastet nicht ein
    - id: solenoid_sticking
      likelihood: medium
      label:
        en: Deactivation solenoid valve sticking or its oil screen blocked
        de: Abschalt-Magnetventil klemmt oder sein Ölsieb ist zugesetzt
    - id: solenoid_seal_leak
      likelihood: low
      label:
        en: Leaking solenoid seal lets control pressure bleed off
        de: Undichte Ventildichtung lässt den Steuerdruck abfallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Shudder or jerk when the engine enters or leaves reduced-cylinder mode
      de: Ruckeln beim Wechsel in den oder aus dem Teilzylinderbetrieb
    - en: Misfire on cylinder 1 (P0301)
      de: Fehlzündungen auf Zylinder 1 (P0301)
    - en: Cylinder deactivation no longer used, higher fuel use
      de: Zylinderabschaltung wird nicht mehr genutzt, höherer Verbrauch
  repair:
