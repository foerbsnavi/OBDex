- code: P34B0
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit Bank 2
    de: Nockenwellenversteller A Positionssensor A Stromkreis Bank 2
  description:
    en: "P34B0 concerns the electrical circuit of position sensor A of the intake cam actuator on bank 2, so it only concerns V and boxer engines. No manufacturer publishes it. Mitsubishi documents the bank 1 code P34AC for the 2022 Outlander, which uses only the bank 1 codes: there the sensor reports the angle of the electric phaser motor, and a voltage outside its window for a second sets the fault. A two-bank engine with electric phasers would watch its second actuator in the same way. Mercedes, by contrast, files the sensors of its CAMTRONIC lift actuators under the position sensor A codes of camshaft B (P34BD, P34BE), so what the actuator is depends on the maker. Check plug, harness and actuator on bank 2."
    de: "P34B0 ist der Kreiscode für Positionssensor A am Einlassversteller von Bank 2 und betrifft damit nur V- und Boxermotoren. Kein Hersteller veröffentlicht ihn. Mitsubishi belegt für den Outlander 2022, der nur die Codes von Bank 1 nutzt, das Gegenstück P34AC: Dort meldet der Sensor den Winkel des elektrischen Stellmotors, und eine Spannung außerhalb des Fensters über eine Sekunde löst den Fehler aus. Ein zweibankiger Motor mit elektrischen Verstellern würde seinen zweiten Steller ebenso überwachen. Mercedes dagegen führt die Sensoren seiner CAMTRONIC-Hubsteller unter den Positionssensor-A-Codes von Nockenwelle B (P34BD, P34BE); was als Steller gilt, hängt also vom Hersteller ab. Zu prüfen sind Stecker, Kabelbaum und Steller auf Bank 2."
  affected_components:
    - cam_actuator_a_pos_sensor_b2
    - sensor_wiring
  common_causes:
    - id: wiring
      likelihood: high
      label:
