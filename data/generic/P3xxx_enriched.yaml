- code: P3416
  category: powertrain
  title:
    en: Cylinder 2 Exhaust Valve Control Circuit High
    de: Zylinder 2 Auslassventil Steuerkreis hoch
  description:
    en: "P3416 means the control line of a separate cylinder 2 exhaust valve actuator sits too high, typically because it touches a supply voltage or the coil has shorted turns. No manufacturer documents this code publicly. The closest published test is GM's for the intake-side P3412 on the L84: once the output stage is active, any resistance to supply below 0.5 ohm is a failure, and 20 hits out of 25 lead to a Type B entry. NHTSA's review of GM's DFM V8 describes one valve lifter oil solenoid per cylinder that serves intake and exhaust alike, which is why such engines need no exhaust-only code. CARB requires shorts in outputs to be detected. Related: P3413 open, P3415 short to ground, P3408 for cylinder 1."
    de: "P3416 bedeutet, dass die Steuerleitung eines eigenen Auslassventil-Stellglieds an Zylinder 2 zu hoch liegt, meist weil sie eine Versorgungsspannung berührt oder die Spule Windungsschluss hat. Kein Hersteller dokumentiert diesen Code öffentlich. Die nächstliegende veröffentlichte Prüfung ist GMs Test für das einlassseitige P3412 am L84: Bei eingeschalteter Endstufe gelten weniger als 0,5 Ohm zur Versorgung als Fehler, 20 von 25 Messungen setzen einen Type-B-Code. Die NHTSA-Untersuchung zu GMs DFM-V8 beschreibt je Zylinder ein Stößel-Öl-Magnetventil, das Ein- und Auslass gleichermaßen bedient – deshalb brauchen solche Motoren keinen reinen Auslass-Code. CARB verlangt, Kurzschlüsse an Ausgängen zu erkennen. Verwandt: P3413 Unterbrechung, P3415 Masseschluss, P3408 für Zylinder 1."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Actuator control wire shorted to a supply line
        de: Steuerleitung des Stellglieds mit einer Versorgungsleitung verbunden
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 2 exhaust actuator coil
        de: Windungsschluss in der Spule des Auslass-Stellglieds von Zylinder 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Fehler in der Endstufe des Motorsteuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays in full-cylinder mode
      de: Motor bleibt im Vollzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
