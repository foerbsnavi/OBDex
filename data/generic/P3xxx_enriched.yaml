- code: P3404
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 1 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3404 is the short-to-power counterpart within the cylinder 1 group. GM tests it while the low-side driver is switched on: if the output still shows less than 0.5 ohm to supply voltage, the current has no proper path through the solenoid, and 20 of 25 samples at 250 ms set a Type B fault. The test only runs with at least 11 V at the powertrain relay and about 425 rpm (L84; 400 rpm on the L86). Ford names P3404 for the single deactivating cylinder of its VDE engines. Typical culprits are a control wire touching a supply line or a solenoid with shorted windings. Compare P3403 (short to ground) and P3401 (open)."
    de: "P3404 ist innerhalb der Gruppe von Zylinder 1 der Code für einen Schluss nach Plus. GM prüft ihn bei eingeschalteter Low-Side-Endstufe: Zeigt der Ausgang dann weniger als 0,5 Ohm zur Versorgungsspannung, fließt der Strom nicht ordentlich über die Spule, und 20 von 25 Messungen im 250-ms-Raster setzen einen Type-B-Fehler. Gemessen wird nur bei mindestens 11 V am Powertrain-Relais und rund 425 U/min (L84; beim L86 400 U/min). Ford nennt P3404 für den einzigen abschaltbaren Zylinder seiner VDE-Motoren. Meist berührt die Steuerleitung eine Plusleitung oder die Spule hat Windungsschluss. Abgrenzung: P3403 ist der Masseschluss, P3401 die Unterbrechung."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Control wire shorted to a supply voltage in the harness
        de: Steuerleitung im Kabelbaum mit einer Plusleitung verbunden
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted winding in the cylinder 1 deactivation solenoid
        de: Windungsschluss im Abschalt-Magnetventil von Zylinder 1
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Damaged output stage in the engine control module
        de: Beschädigte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled
      de: Zylinderabschaltung abgeschaltet
    - en: Possible further circuit codes on other solenoids if a shared supply is affected
      de: Möglicherweise weitere Kreiscodes an anderen Ventilen, wenn eine gemeinsame Versorgung betroffen ist
  repair:
