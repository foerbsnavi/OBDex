- code: P3448
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Circuit High
    de: Zylinder 6 Auslassventil Steuerkreis hoch
  description:
    en: If cylinder 6 had its own exhaust valve actuator, P3448 would report its control line shorted to battery voltage. No manufacturer documents this code publicly. A GM patent application on cylinder deactivation switches both sides through one shared hydraulic valve and only lets the exhaust valves go first, off and back on, so it shows no separate exhaust control either; GM's production V8s likewise put both lifters on one solenoid and publish only P3444 for a short to power on cylinder 6. That test, below 0.5 ohm to power with the driver switched on and 20 of 25 samples, is the reference for how such a fault would be judged. With the actuator unusable, deactivation is blocked. P3445 to P3447 are the sibling exhaust codes.
    de: Hätte Zylinder 6 ein eigenes Auslassventil-Stellglied, meldete P3448 einen Schluss seiner Steuerleitung nach Batteriespannung. Kein Hersteller dokumentiert diesen Code öffentlich. Eine GM-Patentanmeldung zur Zylinderabschaltung schaltet beide Seiten über ein gemeinsames Hydraulikventil und lässt die Auslassventile nur zuerst ab- und auch zuerst wieder zuschalten – eine getrennte Auslasssteuerung zeigt sie nicht. Auch GMs Serien-V8 legen beide Stößel auf ein Magnetventil und veröffentlichen für einen Plusschluss an Zylinder 6 nur P3444. Dessen Prüfung – unter 0,5 Ohm zur Versorgung bei eingeschalteter Endstufe, 20 von 25 Proben – zeigt, wie ein solcher Fehler bewertet würde. Ist das Stellglied unbrauchbar, wird die Abschaltung gesperrt. P3445 bis P3447 sind die Geschwistercodes der Auslassseite.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire touching a supply line
        de: Leitung des Auslass-Stellglieds berührt eine Versorgungsleitung
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the exhaust actuator coil of cylinder 6
        de: Windungsschluss in der Spule des Auslass-Stellglieds von Zylinder 6
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage faulty
        de: Endstufe des Motorsteuergeräts fehlerhaft
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: No switch to reduced-cylinder operation
      de: Kein Wechsel in den Teilzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
