- code: P3442
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Control Performance
    de: Zylinder 6 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3442 reports that cylinder 6 does not switch off or back on as commanded although its control circuit tests fine. FCA uses it as Cylinder 6 Deactivation Control Performance on the 6.4 l Heavy Duty Hemi with MDS in RAM 2500 to 5500 trucks: bulletins 18-082-16 and 18-036-20 list it with P3402, P3426 and P3450 under a lit MIL and fix it with new PCM software. Ford stores it on 2025 F-150 5.0 l trucks built January to April 2025: bulletin 25-2487, replaced by 26-2093, traces P3442 and P3450 to a restricted oil feed tube for the left-bank deactivation solenoids, which is renewed under the valve cover. GM's L84 judges cylinder 6 under its own code P349D. Electrical faults on the same channel are P3441, P3443 and P3444."
    de: "P3442 meldet, dass Zylinder 6 sich nicht wie befohlen ab- oder wieder zuschaltet, obwohl sein Steuerkreis elektrisch in Ordnung ist. FCA nutzt den Code als „Cylinder 6 Deactivation Control Performance“ beim 6,4-l-Heavy-Duty-Hemi mit MDS in RAM 2500 bis 5500: Die Bulletins 18-082-16 und 18-036-20 nennen ihn mit P3402, P3426 und P3450 bei leuchtender MIL und beheben ihn per neuer Motorsoftware. Ford speichert ihn beim F-150 5,0 l, gebaut Januar bis April 2025: Bulletin 25-2487, ersetzt durch 26-2093, führt P3442 und P3450 auf ein verengtes Ölzulaufrohr der Abschalt-Magnetventile der linken Bank zurück, das unter dem Ventildeckel erneuert wird. GMs L84 bewertet Zylinder 6 unter dem eigenen Code P349D. Elektrische Fehler desselben Kanals sind P3441, P3443 und P3444."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: pcm_software
      likelihood: medium
      label:
        en: Outdated PCM calibration (FCA 6.4 l, bulletins 18-082-16 and 18-036-20)
        de: Veraltete Motorsoftware (FCA 6,4 l, Bulletins 18-082-16 und 18-036-20)
    - id: oil_feed_tube_restricted
      likelihood: medium
      label:
        en: Restricted oil feed tube to the left-bank solenoids (Ford 5.0 l, TSB 26-2093)
        de: Verengtes Ölzulaufrohr zu den Magnetventilen der linken Bank (Ford 5,0 l, TSB 26-2093)
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil level too low, wrong grade or worn oil, so pressure builds too slowly
        de: Zu wenig, falsches oder verbrauchtes Öl, der Druck baut sich zu langsam auf
    - id: lifter_stuck
      likelihood: low
      label:
        en: Deactivating lifter of cylinder 6 not locking or unlocking
        de: Abschaltstößel von Zylinder 6 verriegelt oder entriegelt nicht
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Jerk or vibration when the engine changes between eight and four cylinders
      de: Ruck oder Vibration beim Wechsel zwischen acht und vier Zylindern
    - en: Misfire on cylinder 6 (P0306)
      de: Fehlzündungen auf Zylinder 6 (P0306)
    - en: Fuel consumption rises because deactivation is locked out
      de: Verbrauch steigt, weil die Abschaltung gesperrt ist
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
