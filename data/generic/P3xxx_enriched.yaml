- code: P3421
  category: powertrain
  title:
    en: Cylinder 3 Exhaust Valve Control Circuit/Open
    de: Zylinder 3 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: P3421 opens the exhaust group of cylinder 3 and stands for an interrupted circuit to an actuator that would switch only the exhaust valves. No manufacturer documents this code publicly. Engines that are known to idle cylinder 3, such as GM's LTA and LT2 V8s (bulletin 20-NA-038) and the L84, let one lifter control both valves of the cylinder, so an open circuit there shows up as P3417. A GM patent application on deactivation hardware keeps a single oil-switching valve and only shapes the cam timing so that the exhaust side drops out first and returns first. Should a design ever give the exhaust side its own actuator, CARB's continuity check for outputs would apply to it. The owner would see a warning lamp and lose the economy mode.
    de: P3421 eröffnet die Auslassgruppe von Zylinder 3 und steht für einen unterbrochenen Kreis zu einem Stellglied, das nur die Auslassventile schaltet. Kein Hersteller dokumentiert diesen Code öffentlich. Motoren, die Zylinder 3 nachweislich stilllegen – etwa GMs V8 LTA und LT2 (Bulletin 20-NA-038) und der L84 –, lassen beide Ventile des Zylinders über einen Stößel schalten; eine Unterbrechung erscheint dort als P3417. Eine GM-Patentanmeldung zur Abschalt-Hardware behält ein einziges Öl-Schaltventil und legt nur die Nockensteuerzeiten so, dass die Auslassseite zuerst aussetzt und zuerst wiederkommt. Ein eigenes Auslass-Stellglied bräuchte die Durchgangsprüfung, die CARB für Ausgänge verlangt. Der Fahrer sähe eine Warnleuchte, und der Sparbetrieb fiele weg.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken lead or loose terminal at the cylinder 3 exhaust actuator
        de: Gebrochene Ader oder lockerer Kontakt am Auslass-Stellglied von Zylinder 3
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Exhaust actuator winding interrupted
        de: Wicklung des Auslass-Stellglieds unterbrochen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Fault in the control module output
        de: Fehler im Ausgang des Steuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
