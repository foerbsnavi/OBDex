- code: P34BC
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit Bank 1
    de: Nockenwellenversteller B Positionssensor A Stromkreis Bank 1
  description:
    en: "P34BC means the module cannot make sense of the wiring of sensor A, which reports where actuator B on bank 1 stands. Read against the NTN-SNR list, actuator B is the exhaust-side one. Where such actuators are electric, sensor A reports the motor or phaser angle; Mitsubishi shows the intake equivalent P34AC, set after a voltage outside the window for one second or more. Mercedes-Benz files the feedback of its CAMTRONIC exhaust solenoid on its M176/M177 eight-cylinder units in this very group, yet its bulletin lists only the range and low codes P34BD and P34BE, not the general circuit code. No public source covers P34BC itself, so diagnosis stays generic: unplugged connector, broken wires, missing sensor supply, then the actuator. Bank 2 counterpart: P34C0."
    de: "P34BC bedeutet: Mit der Verkabelung von Sensor A, der die Lage von Versteller B auf Bank 1 meldet, kann das Steuergerät nichts anfangen. Nach der NTN-SNR-Liste ist Versteller B der auf der Auslassseite. Wo solche Steller elektrisch arbeiten, meldet Sensor A den Winkel von Motor bzw. Versteller; Mitsubishi beschreibt das Einlass-Gegenstück P34AC, das nach mindestens einer Sekunde Spannung außerhalb des Fensters gesetzt wird. Mercedes-Benz ordnet die Rückmeldung seines CAMTRONIC-Auslass-Stellers bei den Achtzylindern M176/M177 genau dieser Gruppe zu, nennt im Bulletin aber nur P34BD und P34BE, nicht den allgemeinen Kreiscode. Zu P34BC selbst gibt es keine öffentliche Quelle; die Diagnose folgt daher dem üblichen Weg: Stecker, Leitungen, Sensorversorgung, zuletzt der Steller. Gegenstück auf Bank 2: P34C0."
  affected_components:
    - cam_actuator_b_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: connector_open
      likelihood: high
      label:
        en: Connector at the exhaust actuator unplugged or corroded, wire broken
        de: Stecker am Auslass-Steller gelöst oder korrodiert, Leitung gebrochen
    - id: sensor_supply
      likelihood: medium
      label:
        en: Sensor supply or ground missing
        de: Versorgung oder Masse des Sensors fehlt
    - id: actuator_sensor
      likelihood: medium
      label:
        en: Sensor integrated in the actuator failed (actuator replacement)
        de: Im Steller integrierter Sensor defekt (Steller tauschen)
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Exhaust-side adjustment on bank 1 switched off
      de: Verstellung auf der Auslassseite von Bank 1 abgeschaltet
    - en: Possibly slightly higher fuel consumption
      de: Ggf. leicht erhöhter Verbrauch
  repair:
    difficulty: medium
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
