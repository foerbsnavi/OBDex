- code: P34A9
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Range/Performance Bank 2
    de: Nockenwellenversteller A Temperaturfühler Bereich/Funktion Bank 2
  description:
    en: "P34A9 covers the plausibility check of the temperature sensor at intake cam actuator A on bank 2. Nissan names it together with P34A5 in bulletins NTB18-016 (2018 Pathfinder) and ITB18-009 (2018 QX60): vehicles built before 18 December 2017 could store one or both codes and switch on the MIL when started in freezing weather. Nissan traced this to the electric intake valve timing control module and first replaced the module with one carrying newer software; a later revision moved the fix to a reprogramming campaign. If P0021 or other timing codes are stored, they take priority. Outside this case, a sensor whose reading wanders or a poor contact at the bank 2 actuator are the candidates. Bank 1 is P34A5."
    de: "P34A9 betrifft die Plausibilitätsprüfung des Temperaturfühlers am Einlassversteller A auf Bank 2. Nissan nennt ihn zusammen mit P34A5 in den Bulletins NTB18-016 (Pathfinder 2018) und ITB18-009 (QX60 2018): Fahrzeuge, die vor dem 18. Dezember 2017 gebaut wurden, konnten nach einem Start bei Frost einen oder beide Codes speichern und die Kontrollleuchte einschalten. Ursache war das Steuergerät der elektrischen Einlass-Ventilsteuerung; Nissan tauschte es zunächst gegen eines mit neuerer Software und stellte später auf eine Umprogrammierung um. Sind P0021 oder andere Verstellcodes gespeichert, haben sie Vorrang. Ohne diesen Softwarebezug kommen ein Fühler mit wanderndem Wert oder ein schlechter Kontakt am Versteller von Bank 2 infrage. Bank 1 meldet P34A5."
  affected_components:
    - cam_actuator_a_temp_sensor_b2
  common_causes:
    - id: module_software
      likelihood: high
      label:
        en: Module software (Nissan 2018 Pathfinder/QX60, reprogramming)
        de: Steuergeräte-Software (Nissan Pathfinder/QX60 2018, Umprogrammierung)
    - id: sensor_wander
      likelihood: medium
      label:
