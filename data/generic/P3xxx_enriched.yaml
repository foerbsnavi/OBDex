- code: P3462
  category: powertrain
  title:
    en: Cylinder 8 Exhaust Valve Control Performance
    de: Zylinder 8 Auslassventil Steuerung Funktion
  description:
    en: "With P3462 the ECM would be saying that the exhaust valve of cylinder 8 ignores deactivation commands even though nothing is wrong electrically. No manufacturer documents this code publicly. GM covers the exhaust side of cylinder 8 on the 2019 L84 with its own code P3190, Cylinder 8 Trapped High Pressure Exhaust Charge: if crankshaft jerk, normalized by engine speed, exceeds a load-dependent threshold while the cylinder is deactivated, the exhaust valve is judged not to have opened, and 66 failures in 100 samples set a Type B code. Ford patented the complementary check for an exhaust valve that keeps opening after deactivation, based on exhaust pressure. Symptoms range from vibration in reduced-cylinder mode to a misfire on cylinder 8 (P0308)."
    de: "Mit P3462 würde das Steuergerät mitteilen, dass das Auslassventil von Zylinder 8 Abschaltbefehle übergeht, obwohl elektrisch alles stimmt. Kein Hersteller dokumentiert diesen Code öffentlich. GM deckt die Auslassseite von Zylinder 8 beim L84 von 2019 mit dem eigenen Code P3190 ab („Cylinder 8 Trapped High Pressure Exhaust Charge“): Übersteigt die auf die Drehzahl bezogene Drehungleichförmigkeit der Kurbelwelle bei abgeschaltetem Zylinder eine lastabhängige Schwelle, gilt das Auslassventil als nicht geöffnet; 66 Fehler in 100 Proben setzen einen Type-B-Code. Ford hat die Gegenprüfung patentiert – ein Auslassventil, das trotz Abschaltung weiter aufgeht, erkannt am Abgasdruck. Die Folgen reichen von Vibrationen im Teilzylinderbetrieb bis zu Fehlzündungen auf Zylinder 8 (P0308)."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter of cylinder 8 failing to relock in time
        de: Auslassstößel von Zylinder 8 verriegelt nicht rechtzeitig
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil supply to the lifter gallery insufficient
        de: Ölversorgung der Stößelkanäle unzureichend
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust-side control valve sticking
        de: Steuerventil der Auslassseite klemmt
