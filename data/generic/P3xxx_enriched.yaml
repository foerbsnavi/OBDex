- code: P3488
  category: powertrain
  title:
    en: Cylinder 11 Exhaust Valve Control Circuit High
    de: Zylinder 11 Auslassventil Steuerkreis hoch
  description:
    en: "With P3488, the cylinder 11 exhaust actuator line sits too high, most often since the wire has picked up battery voltage. No manufacturer documents this code publicly; cylinders 9 to 12 only exist on engines with nine or more, and J2012 keeps these codes for them. Later V12 and W12 designs give it no job: Bentley's W12 idles a bank of six with its valves still moving, while the Aventador from Lamborghini parks one bank under 135 km/h. Only Mercedes' V12 of around 2000 uncoupled exhaust valves, using two solenoids for that bank. GM's comparable V8 check calls a circuit high below 0.5 ohm to supply while the driver is on, 20 of 25 samples, Type B. The actuator then cannot be engaged, and the engine just runs on all cylinders. P3487 is the ground fault."
    de: "P3488 betrifft einen zu hoch liegenden Kreis des Auslass-Stellglieds von Zylinder 11, meist weil die Steuerleitung Batteriespannung abbekommt. Kein Hersteller dokumentiert diesen Code öffentlich; Zylinder 9 bis 12 gibt es erst ab neun Zylindern, für solche Motoren hält J2012 diese Codes bereit. Spätere Zwölfzylinder mit Abschaltung haben dafür keine Verwendung: Bentleys W12 legt eine Sechserbank still, deren Ventile weiterlaufen, und Lamborghini nimmt beim Aventador unter 135 km/h eine komplette Bank vom Netz. Nur der Mercedes-V12 um 2000 entkoppelte Auslassventile, mit zwei Magnetventilen für die Bank. GMs vergleichbare V8-Prüfung wertet unter 0,5 Ohm zur Versorgung bei eingeschalteter Endstufe als Fehler, 20 von 25 Proben, Type B. Das Stellglied bleibt dann aus, alle zwölf Zylinder arbeiten weiter. Masseschluss: P3487."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Control wire of the cylinder 11 actuator touching a battery feed
        de: Steuerleitung des Stellglieds von Zylinder 11 berührt eine Plusleitung
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the actuator coil
        de: Windungsschluss in der Stellglied-Spule
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage in the engine control module failed
        de: Endstufe im Motorsteuergerät ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays on all twelve cylinders
      de: Motor bleibt auf allen zwölf Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
