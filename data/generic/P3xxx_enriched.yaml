- code: P3422
  category: powertrain
  title:
    en: Cylinder 3 Exhaust Valve Control Performance
    de: Zylinder 3 Auslassventil Steuerung Funktion
  description:
    en: "P3422 would apply if cylinder 3's exhaust valves disregard an order to stop or restart even though the wiring checks out. No manufacturer documents this code publicly. How such a fault can be spotted is shown in patents: Ford patented a way to catch an exhaust valve still lifting after shutdown by its mark in the exhaust pressure trace; the engine then brings the cylinder back, blocks further deactivation and may store a code. A Delphi patent does the same for the intake side by timing pressure pulses against crank angle. GM folds both valves of cylinder 3 into one mechanical check, P349A. A leaking exhaust valve pumps air through the cold cylinder, which upsets fuel trim and can cause a misfire count on cylinder 3."
    de: "P3422 käme zum Zug, falls bei Zylinder 3 die Auslassventile einen Befehl zum Abschalten oder Zuschalten übergehen, obwohl der Kreis fehlerfrei arbeitet. Kein Hersteller dokumentiert diesen Code öffentlich. Wie sich ein solcher Fehler erkennen lässt, zeigen Patente: In einem Ford-Patent verrät sich ein Auslassventil, das trotz Abschaltung weiter hebt, über den Verlauf des Abgasdrucks; die Steuerung schaltet den Zylinder dann wieder zu, sperrt weitere Abschaltungen und kann einen Code ablegen. Ein Delphi-Patent macht Ähnliches für die Einlassseite, indem es Druckpulse zeitlich mit dem Kurbelwinkel vergleicht. GM fasst beide Ventile von Zylinder 3 in einer mechanischen Prüfung zusammen, P349A. Ein undichtes Auslassventil pumpt Luft durch den kalten Zylinder, stört so die Gemischregelung und kann Fehlzündungen auf Zylinder 3 zählen lassen."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: exhaust_switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust-side switching lifter or rocker of cylinder 3 stuck
        de: Auslassseitiger Schaltstößel oder Kipphebel von Zylinder 3 hängt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil level or quality outside specification
        de: Ölstand oder Ölqualität außerhalb der Vorgabe
    - id: oil_passage_restricted
      likelihood: low
      label:
        en: Restricted oil passage to the exhaust switching element
        de: Verengter Ölkanal zum Auslass-Schaltelement
  symptoms:
    - en: Uneven running in reduced-cylinder mode
      de: Unrunder Lauf im Teilzylinderbetrieb
    - en: Fuel trim or misfire codes alongside
      de: Gemischregel- oder Fehlzündungscodes zusätzlich
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
