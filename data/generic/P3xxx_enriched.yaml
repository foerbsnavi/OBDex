      de: Motorkontrollleuchte an
    - en: Jolt or knock on reactivation of cylinder 12
      de: Ruck oder Schlag beim Zuschalten von Zylinder 12
    - en: Misfire on cylinder 12 (P0312)
      de: Fehlzündungen auf Zylinder 12 (P0312)
