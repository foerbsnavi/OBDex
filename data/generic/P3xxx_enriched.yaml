- code: P3451
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 7 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3451 means the switched ground line of the cylinder 7 deactivation solenoid has contact with ground somewhere along its way. GM documents the check for the L84 and L86 trucks and the LT4 Corvette (2019): with the driver off, less than 0.5 ohm to ground, 20 hits in 25 samples taken every 250 ms, Type B, meaning the warning lamp waits for a second faulty trip. According to GM, certain controllers log the open-circuit code P3449 along with it, so both codes together need not mean two faults. On the L84 the high-side feed of the same solenoid reports a ground short under its own code P3117. P3452 is the short to power on this channel, P3450 the mechanical fault."
    de: "P3451 heißt, dass die geschaltete Masseleitung des Abschalt-Magnetventils von Zylinder 7 irgendwo auf ihrem Weg Kontakt zur Masse hat. GM beschreibt die Prüfung für die Pick-up-Motoren L84 und L86 sowie den LT4 der Corvette (2019): Endstufe aus, weniger als 0,5 Ohm gegen Masse, 20 Treffer in 25 Proben im 250-ms-Takt, Type B – die Lampe geht also nach der zweiten fehlerhaften Fahrt an. Nach GM-Angabe tragen bestimmte Steuergeräte den Unterbrechungscode P3449 mit ein; beide Codes zusammen müssen daher keine zwei Fehler bedeuten. Beim L84 meldet die High-Side-Versorgung desselben Ventils einen Masseschluss unter eigenem Code P3117. P3452 ist der Plusschluss dieses Kanals, P3450 der mechanische Fehler."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 7 control wire pinched or chafed to ground
        de: Steuerleitung von Zylinder 7 gequetscht oder bis auf Masse durchgescheuert
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Cylinder 7 solenoid shorted internally
        de: Innerer Schluss im Magnetventil von Zylinder 7
    - id: connector_water
      likelihood: low
      label:
        en: Oil or water inside the solenoid connector
        de: Öl oder Wasser im Stecker des Magnetventils
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Defective driver in the engine control module
        de: Defekte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on after two trips
      de: Motorkontrollleuchte nach zwei Fahrten an
    - en: P3449 may be stored as well
      de: Eventuell zusätzlich P3449 gespeichert
    - en: No four-cylinder mode, higher fuel use
      de: Kein Vierzylinderbetrieb, höherer Verbrauch
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3449, P3450, P3452, P3455, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03A%20Diagnostics.pdf
  reviewed: '2026-11-02'

- code: P3452
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 7 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: Unlike the open and ground-short checks, GM can only detect P3452 while the cylinder 7 solenoid driver is switched on, because a short to supply voltage shows up as an output that will not pull low when it should. The 2019 tables for the L84, L86 and LT4 set the limit at 0.5 ohm to controller power and need 20 errors out of 25 samples, Type B. The check therefore depends on the ECM actually commanding deactivation; on GM's DFM engines that only happens with coolant above 40 °C, more than 20 s after start and above 13 km/h, according to NHTSA. Typical causes are a harness pressed against a feed wire or a solenoid with shorted windings. P3449 and P3451 are the other circuit codes for cylinder 7.
    de: "Anders als Unterbrechung und Masseschluss kann GM P3452 nur erkennen, solange die Endstufe für Zylinder 7 eingeschaltet ist: Ein Schluss nach Versorgungsspannung zeigt sich als Ausgang, der nicht auf Masse zieht, obwohl er es soll. Die Tabellen 2019 für L84, L86 und LT4 setzen die Grenze bei 0,5 Ohm zur Versorgung und verlangen 20 Fehler aus 25 Proben, Type B. Die Prüfung hängt also davon ab, dass das Steuergerät überhaupt eine Abschaltung befiehlt; bei GMs DFM-Motoren geschieht das laut NHTSA erst ab 40 °C Kühlmittel, mehr als 20 s nach dem Start und über 13 km/h. Typisch sind ein an eine Versorgungsleitung gedrückter Kabelbaum oder ein Ventil mit Windungsschluss. P3449 und P3451 sind die übrigen Kreiscodes für Zylinder 7."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 7 control wire shorted to a voltage feed
        de: Steuerleitung von Zylinder 7 hat Schluss zu einer Versorgungsleitung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Low-resistance coil in the cylinder 7 solenoid
        de: Zu niederohmige Spule im Magnetventil von Zylinder 7
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module driver defective
        de: Endstufe des Motorsteuergeräts defekt
  symptoms:
    - en: Check engine lamp on, often only after longer warm drives
      de: Motorkontrollleuchte an, oft erst nach längeren Fahrten mit warmem Motor
    - en: Cylinder deactivation unavailable
      de: Zylinderabschaltung nicht verfügbar
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3449, P3450, P3451, P3456, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03A%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
  reviewed: '2026-11-02'

- code: P3453
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Circuit/Open
    de: Zylinder 7 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "P3453 is the code SAE assigns to an open circuit in a dedicated exhaust valve actuator for cylinder 7. No manufacturer documents this code publicly. GM's description of Dynamic Fuel Management, published by NHTSA, shows how exhaust control works without such an actuator: the same oil signal unlocks the intake lifter at once, while the exhaust lifter waits until the valve spring load drops on the base circle of the cam. Separate wiring exists only in designs with an extra exhaust actuator, and CARB would require its continuity to be monitored. Actual cylinder 7 circuit faults on GM and Chrysler V8s show up as P3449 instead. P3454 to P3456 are the other exhaust codes; P3455 is the short to ground."
    de: "P3453 ist der Code, den SAE einer Unterbrechung im Kreis eines eigenen Auslassventil-Stellglieds an Zylinder 7 zuweist. Kein Hersteller dokumentiert diesen Code öffentlich. GMs von der NHTSA veröffentlichte Beschreibung des Dynamic Fuel Management zeigt, wie die Auslassseite ohne solches Stellglied geschaltet wird: Dasselbe Ölsignal entriegelt den Einlassstößel sofort, während der Auslassstößel wartet, bis die Ventilfeder auf dem Grundkreis der Nocke entlastet ist. Eigene Leitungen gibt es nur bei Bauarten mit zusätzlichem Auslass-Stellglied, deren Durchgang CARB überwachen ließe. Echte Kreisfehler an Zylinder 7 von GM- und Chrysler-V8 erscheinen dagegen als P3449. P3454 bis P3456 sind die übrigen Auslasscodes, P3455 der Masseschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Interrupted wire to the cylinder 7 exhaust actuator
        de: Unterbrochene Leitung zum Auslass-Stellglied von Zylinder 7
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Burnt-out actuator coil
        de: Durchgebrannte Spule des Stellglieds
    - id: connector_corrosion
      likelihood: low
      label:
        en: Corroded actuator connector
        de: Korrodierter Stecker am Stellglied
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3454, P3455, P3456, P3449, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11013168-0001.pdf
  reviewed: '2026-11-02'

- code: P3454
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Performance
    de: Zylinder 7 Auslassventil Steuerung Funktion
  description:
    en: "P3454 covers an exhaust valve on cylinder 7 that does not switch as commanded, with no electrical fault on its control circuit. No manufacturer documents this code publicly. GM's own cylinder 7 check P318F on the 2019 L84 shows why the exhaust side matters: if the exhaust valve fails to open and release the burned gas, the trapped charge is compressed again, cylinder pressure climbs and the intake mechanism can be damaged on reactivation, so the ECM reacts at once (crankshaft jerk test, 66 of 100 samples, Type B). A Ford patent tackles the reverse problem, an exhaust valve still opening after deactivation, spotted through exhaust pressure. P3453, P3455 and P3456 are the electrical codes."
    de: "P3454 erfasst ein Auslassventil an Zylinder 7, das nicht wie befohlen schaltet, ohne dass sein Steuerkreis einen elektrischen Fehler hat. Kein Hersteller dokumentiert diesen Code öffentlich. Warum die Auslassseite wichtig ist, zeigt GMs eigene Prüfung P318F für Zylinder 7 beim L84 von 2019: Öffnet das Auslassventil nicht und bleibt das verbrannte Gas im Zylinder, wird es erneut verdichtet, der Zylinderdruck steigt, und beim Wiederzuschalten kann die Einlassmechanik Schaden nehmen. Das Steuergerät greift deshalb sofort ein (Auswertung der Kurbelwellen-Drehungleichförmigkeit, 66 von 100 Proben, Type B). Ein Ford-Patent behandelt das umgekehrte Problem, ein nach der Abschaltung weiter öffnendes Auslassventil, erkannt über den Abgasdruck. P3453, P3455 und P3456 sind die elektrischen Codes."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter of cylinder 7 stuck in the unlocked state
        de: Auslassstößel von Zylinder 7 hängt im entriegelten Zustand
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure or oil quality inadequate for switching
        de: Öldruck oder Ölqualität reicht zum Umschalten nicht aus
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust control valve slow or sticking
        de: Steuerventil der Auslassseite träge oder klemmend
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Hard knock or jolt when cylinder 7 is reactivated
      de: Harter Schlag oder Ruck beim Wiederzuschalten von Zylinder 7
    - en: Possible misfire on cylinder 7 (P0307)
      de: Mögliche Fehlzündungen auf Zylinder 7 (P0307)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3453, P3455, P3456, P3450, P349E, P0307]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US8006670B2/en
  reviewed: '2026-11-02'

