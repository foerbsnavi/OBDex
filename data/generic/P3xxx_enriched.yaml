- code: P34B8
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit Bank 2
    de: Nockenwellenversteller B Temperaturfühler Stromkreis Bank 2
  description:
    en: "P34B8 is the circuit fault for the heat sensor inside exhaust camshaft actuator B of bank 2, the row without cylinder 1 on a V or flat engine. If P34B4 is stored at the same time, a shared feed, a common ground or the control module is more likely than two failed sensors at once. The code family presumes an electrically driven exhaust phaser with its own heat-sensitive driver: NTN-SNR files it under outlet camshaft adjustment, and Aisin's patent explains why such a driver carries a temperature sensor at all. A carmaker using P34B8 could not be found in bulletins or official service information. In practice: check plug and harness on bank 2 first, then the actuator itself. For a signal stuck low or high on bank 2 see P34BA and P34BB."
    de: "P34B8 meldet einen Kreisfehler am Temperaturfühler des Auslassverstellers B auf Bank 2 – bei V- oder Boxermotoren die Reihe ohne Zylinder 1. Steht zugleich P34B4 im Speicher, liegt eine gemeinsame Versorgung, Masse oder das Steuergerät näher als zwei gleichzeitig defekte Fühler. Die Codefamilie setzt einen elektrisch angetriebenen Auslassversteller mit eigenem, wärmeempfindlichem Treiber voraus: NTN-SNR ordnet sie der Auslass-Nockenwellenverstellung zu, das Aisin-Patent begründet, wozu ein solcher Treiber überhaupt einen Fühler trägt. Einen Hersteller, der P34B8 verwendet, fanden wir weder in Bulletins noch in offiziellen Werkstattinformationen. Praktisch heißt das: zuerst Stecker und Kabelbaum auf Bank 2 prüfen, danach den Versteller. Signal zu klein bzw. zu groß auf Bank 2: P34BA, P34BB."
  affected_components:
    - cam_actuator_b_temp_sensor_b2
    - sensor_wiring
  common_causes:
    - id: bank2_harness
      likelihood: high
      label:
        en: Connector or harness at the bank 2 exhaust actuator open
        de: Stecker oder Kabelbaum am Auslassversteller von Bank 2 unterbrochen
    - id: shared_supply_ground
      likelihood: medium
      label:
        en: Shared supply or ground faulty (when bank 1 also reports)
        de: Gemeinsame Versorgung oder Masse fehlerhaft (wenn Bank 1 ebenfalls meldet)
    - id: actuator_sensor
      likelihood: medium
      label:
        en: Temperature sensor in the bank 2 actuator failed
        de: Temperaturfühler im Versteller von Bank 2 defekt
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Exhaust phasing on bank 2 restricted, banks may run slightly unevenly
      de: Auslassverstellung auf Bank 2 eingeschränkt, Bänke laufen ggf. leicht ungleich
  repair:
