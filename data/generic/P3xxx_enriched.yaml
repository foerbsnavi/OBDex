  reviewed: '2026-11-02'

- code: P3435
  category: powertrain
  title:
    en: Cylinder 5 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 5 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3435 flags a short to ground on the control line of the cylinder 5 deactivation valve. GM documents it codewise twice: in the 2019 tables for the L84 V8, with under 0.5 ohm to ground in the driver-off state, 20 of 25 samples at 250 ms and Type B, and in an engineering bulletin for 3.6 L V6 engines (LGX, LGZ) where P3435 appears along with P3433 and P3409 when oil leaks from the rocker arm control valve. Oil that wicks into the connector can create exactly such a leakage path. P3433 is the open circuit, P3436 the short to power, P3434 a mechanical failure. In daily driving the engine simply stays on all cylinders."
    de: "P3435 meldet einen Masseschluss an der Steuerleitung des Abschaltventils von Zylinder 5. GM belegt den Code gleich zweimal: in den Tabellen 2019 für den V8 L84 mit unter 0,5 Ohm nach Masse bei ausgeschalteter Endstufe, 20 von 25 Messungen im 250-ms-Takt und Type B, und in einer Engineering-Information zu 3,6-l-V6-Motoren (LGX, LGZ), in der P3435 neben P3433 und P3409 auftaucht, wenn am Kipphebel-Steuerventil Öl austritt. Öl, das in den Stecker kriecht, kann genau einen solchen Kriechstrompfad bilden. P3433 ist die Unterbrechung, P3436 der Plusschluss, P3434 ein mechanischer Fehler. Im Alltag bleibt der Motor einfach auf allen Zylindern."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: oil_in_connector
      likelihood: high
      label:
        en: Oil in the cylinder 5 valve connector creating a leakage path (GM 3.6 L V6)
