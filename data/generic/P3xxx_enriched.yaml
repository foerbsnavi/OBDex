- code: P3432
  category: powertrain
  title:
    en: Cylinder 4 Exhaust Valve Control Circuit High
    de: Zylinder 4 Auslassventil Steuerkreis hoch
  description:
    en: "P3432 is the last code of the cylinder 4 block and denotes an exhaust actuator control line sitting at supply voltage. No manufacturer documents this code publicly. The intake-side counterpart P3428 is well covered: For GM's L84, L86 and Corvette LT4 of model year 2019, a supply path below half an ohm, measured while the low-side stage conducts, is logged as a Type B short. Exhaust valves are not forgotten in those engines, they simply switch with the same lifter oil. A GM patent application lets a single hydraulic valve serve both sides, and the cam timing makes the exhaust side drop out earlier than the intake side and also come back sooner. Without a separate exhaust output, this code has nothing to watch. Expect only the lamp."
    de: "P3432 ist der letzte Code des Blocks für Zylinder 4 und meint ein Auslass-Stellglied, dessen Ansteuerung an Versorgungsspannung hängt. Kein Hersteller dokumentiert diesen Code öffentlich. Das einlassseitige Gegenstück P3428 ist gut belegt: In GMs Unterlagen 2019 zu L84, L86 und dem LT4 der Corvette gilt ein Versorgungsweg unter einem halben Ohm bei leitendem Low-Side-Treiber als Schluss und wird als Type B abgelegt. Die Auslassventile sind bei diesen Motoren nicht vergessen, sie schalten schlicht mit demselben Stößelöl. In einer GM-Patentanmeldung bedient ein einziges Hydraulikventil beide Seiten; die Nockensteuerzeiten lassen die Auslassseite früher aussetzen und auch früher wieder arbeiten als die Einlassseite. Ohne eigenen Auslass-Ausgang hat dieser Code nichts zu überwachen. Zu erwarten ist nur die Leuchte."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 4 in contact with battery voltage
        de: Leitung des Auslass-Stellglieds von Zylinder 4 hat Kontakt zur Batteriespannung
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Exhaust actuator coil with shorted windings
        de: Spule des Auslass-Stellglieds mit Windungsschluss
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage of the engine control module defective
        de: Endstufe des Motorsteuergeräts defekt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Deactivation unavailable
      de: Abschaltung nicht verfügbar
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
