- code: P34AE
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit Low Bank 1
    de: Nockenwellenversteller A Positionssensor A Stromkreis zu niedrig Bank 1
  description:
    en: P34AE says the voltage from position sensor A on the bank 1 intake side remains under its minimum. The 2022 Mitsubishi Outlander, whose intake cam is moved by an electric motor, evaluates the code in the electric valve timing module and points to an open or shorted actuator circuit or a faulty actuator; unlike the circuit and high codes, no delay time is stated. Typical findings are a signal line touching ground, a missing sensor supply or a shorted Hall element in the motor. The module then stops phasing and keeps the intake cam at its base angle, which costs low-end torque; because the stratified cold start is also dropped, starts from cold may run rougher. P34AF is the high code, P34B2 the bank 2 code.
    de: "P34AE heißt: Die Spannung von Positionssensor A an der Einlassseite von Bank 1 erreicht ihren Mindestwert nicht. Der Mitsubishi Outlander 2022 bewegt die Einlassnocke mit einem Elektromotor, wertet den Code im Steuergerät der elektrischen Ventilsteuerung aus und verweist auf einen unterbrochenen oder kurzgeschlossenen Stellerkreis oder einen defekten Steller; eine Verzögerungszeit nennt er hier, anders als beim Kreis- und beim Hoch-Code, nicht. Häufig liegt die Signalleitung an Masse, fehlt die Sensorversorgung oder ist ein Hallelement im Motor kurzgeschlossen. Das Steuergerät stellt die Verstellung dann ein und hält die Nocke in Grundstellung; das kostet Drehmoment untenherum, und weil der geschichtete Kaltstart entfällt, kann der Motor kalt unruhiger anspringen. Zu hoch ist P34AF, Bank 2 P34B2."
  affected_components:
    - cam_actuator_a_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: short_ground
      likelihood: high
      label:
        en: Signal line shorted to ground
        de: Signalleitung mit Masseschluss
    - id: supply_missing
      likelihood: medium
      label:
        en: Sensor supply open or shorted
        de: Sensorversorgung unterbrochen oder kurzgeschlossen
    - id: hall_sensor
      likelihood: medium
      label:
        en: Hall sensor in the actuator motor shorted (actuator replacement)
        de: Hallsensor im Stellmotor kurzgeschlossen (Steller tauschen)
  symptoms:
