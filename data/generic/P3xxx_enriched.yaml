- code: P3487
  category: powertrain
  title:
    en: Cylinder 11 Exhaust Valve Control Circuit Low
    de: Zylinder 11 Auslassventil Steuerkreis niedrig
  description:
    en: "P3487 would tell of a grounded control wire feeding a dedicated exhaust valve actuator on cylinder 11. No manufacturer documents this code publicly; cylinders 9 to 12 only exist on engines with nine or more, and J2012 keeps these codes for them. The closest real design is Mercedes' Active Cylinder Control on the CL 600 and S 600 V12 around 2000: it shut down one bank, and according to Wikipedia two solenoids uncoupled that bank's exhaust valves to keep pressure in the idle cylinders. That is one circuit per bank, not per cylinder. GM's V8 analogue flags a ground short below 0.5 ohm with the driver off. Grounded wiring could engage the actuator by itself and silence cylinder 11 when it is meant to fire. Siblings: P3485 (open), P3488 (high)."
    de: "P3487 zeigte an, dass die Ansteuerleitung eines separaten Auslass-Stellglieds an Zylinder 11 Masse bekommt. Kein Hersteller dokumentiert diesen Code öffentlich; Zylinder 9 bis 12 gibt es erst ab neun Zylindern, für solche Motoren hält J2012 diese Codes bereit. Am nächsten kommt ihm die Active Cylinder Control des V12 in CL 600 und S 600 um das Jahr 2000: Sie legte eine Bank still, und laut Wikipedia entkoppelten zwei Magnetventile die Auslassventile dieser Bank, damit in den ruhenden Zylindern Druck blieb. Das ist ein Kreis je Bank, nicht je Zylinder. GMs V8-Gegenstück erkennt einen Masseschluss unter 0,5 Ohm bei ausgeschaltetem Treiber. Eine Leitung an Masse könnte das Stellglied ohne Befehl anziehen und Zylinder 11 abschalten, obwohl er zünden soll. Geschwister: P3485 (offen), P3488 (hoch)."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Actuator wire chafed through to engine ground
        de: Stellglied-Leitung zur Motormasse durchgescheuert
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Actuator coil shorted to its housing
        de: Spule des Stellglieds mit Schluss zum Gehäuse
    - id: connector_water
      likelihood: low
      label:
        en: Moisture in the actuator connector bridging to ground
        de: Feuchtigkeit im Stellglied-Stecker überbrückt nach Masse
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Bank shut-off no longer offered
      de: Bankabschaltung wird nicht mehr angeboten
    - en: Possible misfire on cylinder 11 (P0311)
      de: Mögliche Aussetzer an Zylinder 11 (P0311)
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3485, P3486, P3488, P3483, P0311, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://en.wikipedia.org/wiki/Mercedes-Benz_CL-Class_(C215)
    - https://motorweek.org/road_tests/2001_mercedes_benz_cl600_s600_program_2033/
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
