        de: Signalleitung an Masse, Kabelbaum durch Hitze beschädigt
    - id: supply_missing
      likelihood: medium
      label:
        en: Sensor supply interrupted
        de: Sensorversorgung unterbrochen
    - id: sensor_shorted
      likelihood: medium
      label:
        en: Sensor in the actuator shorted
        de: Sensor im Steller kurzgeschlossen
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 intake phasing switched off
      de: Einlassverstellung von Bank 2 abgeschaltet
    - en: Possibly codes from other sensors on the same supply
      de: Ggf. Codes weiterer Sensoren an derselben Versorgung
