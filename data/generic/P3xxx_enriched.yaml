    - https://www.audi-mediacenter.com/en/the-sheer-joy-of-driving-redefined-audi-r8-v10-performance-rwd-until-2024-14405/the-engine-legendary-ten-cylinder-on-the-road-and-the-racetrack-14408
    - https://en.wikipedia.org/wiki/Mercedes-Benz_M137_engine
