  description:
    en: "P3477 belongs to engines that switch the exhaust valve of cylinder 10 through its own actuator, and it reports that this actuator's circuit is open. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Ten-cylinder engines with shut-off, the Audi R8 V10 and the Lamborghini Huracán, deactivate a bank rather than individual valves; Audi names injection and ignition as what is stopped. GM's patent on valve deactivation shows that the exhaust side has its own timing requirement, with solenoid-driven hydraulic control valves stopping and restarting the exhaust valves ahead of the intake valves. Diagnose as a plain open circuit: connector, wire, coil. P3479 and P3480 are the shorts, P3478 the functional fault, P3473 the intake circuit."
    de: "P3477 gehört zu Motoren, die das Auslassventil von Zylinder 10 über ein eigenes Stellglied schalten, und meldet einen offenen Kreis dieses Stellglieds. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Die Zehnzylinder mit Abschaltung, Audi R8-V10 und Lamborghini Huracán, legen eine Bank still statt einzelner Ventile; Audi nennt Einspritzung und Zündung als das, was ruht. Dass die Auslassseite eigene Zeitvorgaben hat, zeigt GMs Patent zur Ventilabschaltung: Magnetbetätigte Hydraulikventile legen dort die Auslassventile vor den Einlassventilen still und holen sie auch vorher zurück. Diagnose wie bei jeder Unterbrechung – Stecker, Leitung, Spule. Schlüsse melden P3479 und P3480, Funktionsfehler P3478, den Einlasskreis P3473."
