- code: P34A6
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit Low Bank 1
    de: Nockenwellenversteller A Temperaturfühler Stromkreis zu niedrig Bank 1
  description:
    en: With P34A6 the temperature signal from the intake cam actuator on bank 1 sits under its minimum. No source available to us names the sensor type. If it is the usual NTC thermistor, low voltage corresponds to high temperature, so a signal line shorted to ground or an internally shorted sensor looks to the module like an overheated actuator. Electric phasers guard their motor and driver against heat – Aisin describes cutting the current in stages while the board temperature stays high – so a false hot value can make the controller hold the phaser back. NTN-SNR names P34A6 as a too-small signal of the inlet temperature sensor. No carmaker publishes this code in detail. High is P34A7, bank 2 P34AA.
    de: "P34A6 heißt: Das Temperatursignal des Einlassverstellers auf Bank 1 unterschreitet seinen Mindestwert. Welcher Fühlertyp verbaut ist, nennt keine uns vorliegende Quelle. Beim üblichen NTC-Heißleiter bedeutet wenig Spannung viel Wärme; liegt die Signalleitung an Masse oder ist der Fühler innen kurzgeschlossen, hält das Steuergerät den Versteller deshalb für überhitzt. Elektrische Versteller schützen Motor und Endstufe vor Hitze – Aisin beschreibt, den Strom stufenweise zu senken, solange die Platine heiß bleibt –, ein falscher Heißwert kann die Verstellung also bremsen. NTN-SNR führt P34A6 als zu kleines Signal des Einlass-Temperaturfühlers. Ein Hersteller beschreibt den Code nicht näher. Zu hoch ist P34A7, Bank 2 P34AA."
  affected_components:
    - cam_actuator_a_temp_sensor_b1
    - sensor_wiring
  common_causes:
    - id: short_ground
      likelihood: high
      label:
        en: Signal wire shorted to ground (chafed at the cylinder head)
        de: Signalleitung mit Masseschluss (am Zylinderkopf durchgescheuert)
    - id: sensor_shorted
      likelihood: medium
      label:
        en: Sensor shorted internally
        de: Fühler intern kurzgeschlossen
    - id: real_overheat
      likelihood: low
      label:
        en: Actuator really overheated by a sluggish phaser
        de: Versteller durch schwergängige Mechanik tatsächlich überhitzt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake phasing on bank 1 limited, less pulling power
      de: Einlassverstellung auf Bank 1 begrenzt, weniger Durchzug
