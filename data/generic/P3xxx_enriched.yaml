      de: Motorkontrollleuchte leuchtet
    - en: Exhaust cam timing on bank 1 fixed or limited
      de: Auslass-Steuerzeit auf Bank 1 fest oder begrenzt
    - en: Driving usually unaffected
      de: Fahrbetrieb meist unauffällig
