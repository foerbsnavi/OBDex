- code: P3498
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Performance
    de: Zylinder 1 Abschaltung/Einlassventil Funktion
  description:
    en: "P3498 flags a mechanical failure on cylinder 1: the control unit commanded it off, but its valves kept opening. This differs from P3402, which concerns the control side, and from the wiring codes P3401, P3403 and P3404. GM runs the check on its 5.3 l L84 and 6.2 l L87 Dynamic Fuel Management V8s by watching filtered manifold pressure every 90 crank degrees; if it stays above a threshold while cylinder 1 should be resting, 22 failures in 25 chances log a Type B code. Mazda's 2.5 l engines, which deactivate cylinders 1 and 4, show it together with P349B when a rocker arm has dropped out or broken (SA-041/18, SA-022/19); Mazda then authorises a replacement engine. Drivers notice the lamp, rough running or a loss of power."
    de: "P3498 meldet einen mechanischen Fehler an Zylinder 1: Das Steuergerät hat ihn abgeschaltet, seine Ventile öffnen aber weiter. Damit unterscheidet sich der Code von P3402, der die Ansteuerung betrifft, und von den Kreiscodes P3401, P3403 und P3404. GM prüft das bei den DFM-V8 L84 (5,3 l) und L87 (6,2 l) über den gefilterten Saugrohrdruck, alle 90 Grad Kurbelwinkel; bleibt er über der Schwelle, obwohl Zylinder 1 ruhen soll, führen 22 Fehler in 25 Gelegenheiten zu einem Type-B-Code. Bei Mazdas 2,5-l-Motoren, die Zylinder 1 und 4 abschalten, erscheint er mit P349B, wenn ein Kipphebel herausgefallen oder gebrochen ist (SA-041/18, SA-022/19); Mazda gibt dann einen Austauschmotor frei. Spürbar: Leuchte, unrunder Lauf, Leistungsverlust."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: rocker_arm_broken_or_dislodged
      likelihood: high
      label:
        en: Switchable rocker arm of cylinder 1 dropped out or broken (Mazda)
        de: Schaltbarer Kipphebel an Zylinder 1 herausgefallen oder gebrochen (Mazda)
    - id: lifter_lock_pins_stuck
      likelihood: medium
      label:
        en: Deactivation lifter of cylinder 1 stays locked (GM DFM)
        de: Abschaltstößel von Zylinder 1 bleibt verriegelt (GM DFM)
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Lifter oil solenoid of cylinder 1 sticking or with protruding pole piece
        de: Ölmagnetventil von Zylinder 1 klemmt oder Polkern steht über
    - id: poor_oil_maintenance
      likelihood: medium
      label:
        en: Overdue oil changes or wrong oil grade
        de: Überfällige Ölwechsel oder falsche Ölsorte
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough idle or misfire on cylinder 1 (P0301)
      de: Unruhiger Leerlauf oder Fehlzündungen auf Zylinder 1 (P0301)
    - en: Clatter from the cylinder head and loss of power
      de: Klappern aus dem Zylinderkopf und Leistungsverlust
    - en: Cylinder deactivation no longer used, higher fuel use
      de: Zylinderabschaltung entfällt, höherer Verbrauch
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 6000]
    estimated_hours: [0.5, 16]
