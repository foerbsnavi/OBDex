- code: P3443
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 6 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "Here the engine computer has found the cylinder 6 solenoid's switched lead pulled to ground. GM spells out the test for its 2019 V8s (L84, L86 and the LT4 Corvette): while the low-side driver is off, an impedance under 0.5 ohm toward ground is a fault, and 20 hits among 25 checks while the powertrain relay supplies at least 11 V store a Type B code. GM adds that some controllers record the open-circuit code P3441 at the same moment, so the pair does not prove two separate faults. On the L84 each solenoid also has a high-side feed, and a short to ground there carries GM's own code P3114. P3444 is the short to voltage on this channel. Cylinder deactivation stays off until the fault is repaired."
    de: "Hier hat das Steuergerät die Steuerleitung des Abschalt-Magnetventils von Zylinder 6 auf Masse gezogen vorgefunden. GM beschreibt die Prüfung für seine V8-Motoren 2019 (L84, L86 und LT4 der Corvette): Bei ausgeschalteter Low-Side-Endstufe ist ein Widerstand unter 0,5 Ohm gegen Masse ein Fehler; 20 Treffer unter 25 Prüfungen bei mindestens 11 V am Powertrain-Relais speichern einen Type-B-Code. Laut GM tragen manche Steuergeräte im selben Moment auch den Unterbrechungscode P3441 ein – das Paar beweist also nicht zwei getrennte Fehler. Beim L84 hat jedes Ventil zusätzlich eine High-Side-Versorgung; ein Masseschluss dort läuft unter GMs eigenem Code P3114. P3444 ist der Plusschluss dieses Kanals. Bis zur Reparatur bleibt die Zylinderabschaltung aus."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Insulation of the cylinder 6 control wire worn through to ground
        de: Isolierung der Steuerleitung von Zylinder 6 bis auf Masse durchgescheuert
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Cylinder 6 solenoid shorted internally to its housing
        de: Magnetventil von Zylinder 6 innen gegen sein Gehäuse kurzgeschlossen
    - id: connector_water
      likelihood: low
      label:
        en: Moisture or oil bridging the pins of the solenoid connector
        de: Feuchtigkeit oder Öl überbrückt die Kontakte des Ventilsteckers
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage in the engine control module damaged
        de: Endstufe im Motorsteuergerät beschädigt
  symptoms:
    - en: Check engine lamp on from the second faulty trip
      de: Motorkontrollleuchte ab der zweiten fehlerhaften Fahrt an
    - en: Four-cylinder mode no longer available
      de: Vierzylinderbetrieb nicht mehr verfügbar
    - en: P3441 stored at the same time on some GM controllers
      de: Bei manchen GM-Steuergeräten gleichzeitig P3441 gespeichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3441, P3442, P3444, P3447, P3497]
  sources:
