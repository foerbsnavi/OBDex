- code: P340C
  category: powertrain
  title:
    en: Deactivation/Exhaust Valve Control Circuit Bank 1
    de: Abschaltung/Auslassventil Steuerkreis Bank 1
  description:
    en: "P340C concerns a separate electrical circuit that disables the exhaust valves of bank 1 as a group. A fault in its wiring, connector or actuator coil sets the code. No manufacturer documents it publicly, and none of the known production systems needs it: GM's DFM engines feed the intake and exhaust lifters of each cylinder from one shared solenoid, and a GM patent application describes one hydraulic valve per pair of cylinders that drops the exhaust valves before the intake valves purely by cam timing. Under CARB rules every output of this type needs an electrical integrity test. The intake-side circuit is P340A, bank 2 exhaust P340D, the bank 1 exhaust function P341C. Drivers mainly see the lamp; deactivation is suspended."
    de: "P340C betrifft einen eigenen Stromkreis, der die Auslassventile von Bank 1 gemeinsam abschaltet. Ein Fehler in Leitung, Stecker oder Spule des Stellglieds setzt den Code. Kein Hersteller dokumentiert ihn öffentlich, und die bekannten Serienlösungen kommen ohne ihn aus: GMs DFM-Motoren steuern Ein- und Auslassventil eines Zylinders über ein gemeinsames Magnetventil, und eine GM-Patentanmeldung beschreibt ein Hydraulikventil je Zylinderpaar, bei dem allein die Nockenstellung dafür sorgt, dass die Auslassventile vor den Einlassventilen stillgelegt werden. CARB verlangt für jeden solchen Ausgang eine Prüfung auf Unterbrechung und Kurzschluss. Einlassseitig gilt P340A, Bank 2 Auslass P340D, die Funktion auf Bank 1 P341C. Spürbar ist meist nur die Leuchte, die Abschaltung ruht."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_fault
      likelihood: medium
