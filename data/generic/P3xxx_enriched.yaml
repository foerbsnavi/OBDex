- code: P3409
  category: powertrain
  title:
    en: Cylinder 2 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 2 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3409 is the open-circuit code for the deactivation control of cylinder 2. GM uses it on two very different engines. On the 3.6 L V6 (LGX, LGZ) cylinder 2 is one of the two active fuel management cylinders, and an engineering bulletin links P3409 to oil leaking from the rocker arm oil control valve in the camshaft cover. On the L84 V8 with Dynamic Fuel Management every cylinder has a solenoid; GM flags an open circuit when it sees more than 200 kohm with the driver off, 20 of 25 samples at 250 ms, Type B. Shorts are P3411 and P3412, a mechanical failure P3410. The driver sees a warning lamp and loses the fuel-saving mode.
    de: P3409 ist der Unterbrechungs-Code der Abschaltsteuerung von Zylinder 2. GM nutzt ihn an zwei sehr unterschiedlichen Motoren. Beim 3,6-l-V6 (LGX, LGZ) gehört Zylinder 2 zu den beiden abschaltbaren Zylindern; eine Engineering-Information verbindet P3409 mit Öl, das am Kipphebel-Ölsteuerventil im Nockenwellendeckel austritt. Beim V8 L84 mit Dynamic Fuel Management hat jeder Zylinder ein Magnetventil; GM erkennt eine Unterbrechung an mehr als 200 kOhm bei ausgeschalteter Endstufe, 20 von 25 Messungen im 250-ms-Takt, Type B. Schlüsse laufen als P3411 und P3412, ein mechanischer Fehler als P3410. Der Fahrer sieht die Warnleuchte, die Spar-Betriebsart entfällt.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: oil_in_connector
      likelihood: high
      label:
        en: Oil leaking at the control valve and soaking its connector (GM 3.6 L V6)
        de: Öl tritt am Steuerventil aus und durchnässt dessen Stecker (GM 3,6-l-V6)
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken wire or loose pin in the cylinder 2 solenoid circuit
        de: Leitungsbruch oder lockerer Pin im Kreis des Magnetventils von Zylinder 2
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 2 deactivation solenoid
        de: Unterbrochene Spule im Abschalt-Magnetventil von Zylinder 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output driver fault
        de: Fehler der Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Oil residue around the valve cover control valve (V6)
      de: Ölspuren am Steuerventil im Ventildeckel (V6)
    - en: No reduced-cylinder operation, higher fuel use
      de: Kein Teilzylinderbetrieb, höherer Verbrauch
  repair:
