- code: P34BB
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit High Bank 2
    de: Nockenwellenversteller B Temperaturfühler Stromkreis zu hoch Bank 2
  description:
    en: "P34BB is stored when the bank 2 exhaust actuator's temperature signal stays above its window – typically a broken signal line, a loosened ground connection or contact with a supply wire. Because the module can no longer see how warm the actuator driver is, it lacks what it needs to protect it; Aisin's design, for comparison, ends its current reduction only after the reading has stayed below a return threshold for some time. With the value missing, the exhaust phaser on this bank will usually be kept in a safe position, so the warning lamp is often the only sign. No manufacturer publication covers P34BB, and NTN-SNR simply calls it too high a signal on the outlet side, second bank. High fault on bank 1: P34B7; low on bank 2: P34BA."
    de: "P34BB wird gespeichert, sobald der Temperaturwert vom Auslassversteller der Bank 2 oberhalb seines Fensters bleibt – meist wegen einer gebrochenen Signalleitung, einer gelösten Masse oder Berührung mit einer Versorgungsleitung. Weil das Steuergerät nicht mehr erkennt, wie warm der Treiber des Verstellers ist, fehlt ihm die Grundlage, ihn zu schützen; im Aisin-Konzept etwa endet die Stromabsenkung erst, wenn der Wert eine Weile unter einer Rückkehrschwelle lag. Ohne Messwert hält das System den Auslassversteller dieser Bank meist in sicherer Lage, sodass oft nur die Warnleuchte auffällt. Kein Hersteller veröffentlicht P34BB; NTN-SNR spricht knapp von einem zu hohen Signal der Auslassseite, zweite Bank. Zu hoch auf Bank 1: P34B7, zu niedrig auf Bank 2: P34BA."
  affected_components:
    - cam_actuator_b_temp_sensor_b2
    - sensor_wiring
  common_causes:
    - id: signal_or_ground_open
      likelihood: high
      label:
        en: Signal line broken or sensor ground loose
        de: Signalleitung gebrochen oder Fühlermasse lose
    - id: short_to_voltage
      likelihood: medium
      label:
        en: Signal line touching a supply wire
        de: Signalleitung berührt eine Versorgungsleitung
    - id: sensor_open
      likelihood: low
      label:
        en: Sensor open inside the bank 2 actuator
        de: Fühler im Versteller von Bank 2 innen unterbrochen
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Bank 2 exhaust cam held in a safe position
      de: Auslassnocke von Bank 2 in sicherer Lage gehalten
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [50, 850]
    estimated_hours: [0.5, 3.5]
