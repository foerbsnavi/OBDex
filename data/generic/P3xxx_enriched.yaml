    - https://media.audiusa.com/view/releases/404
  reviewed: '2026-11-02'

- code: P3475
  category: powertrain
  title:
    en: Cylinder 10 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 10 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: P3475 points to a short to ground on the circuit that controls deactivation or the intake valve of cylinder 10. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The Lamborghini Huracán's V10 runs on five cylinders at light load and the Aventador V12 on six below 135 km/h, yet neither maker publishes code-level diagnostics, and Audi's sister V10 manages without valve actuators. For a sense of the test, GM's eight-cylinder version of the low check needs below 0.5 ohm to ground while the output is off, sampled every 250 ms. Check the wire to cylinder 10 for chafing first, then the actuator itself. P3473 handles an open line, P3476 a short to voltage, P3479 the exhaust counterpart.
    de: "P3475 deutet auf einen Masseschluss im Kreis, der Abschaltung bzw. Einlassventil von Zylinder 10 steuert. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Der V10 des Lamborghini Huracán läuft bei geringer Last auf fünf Zylindern, der V12 des Aventador unter 135 km/h auf sechs, doch keiner der beiden Hersteller veröffentlicht Diagnose bis auf Code-Ebene, und Audis baugleicher V10 kommt ohne Ventil-Stellglieder aus. Zur Einordnung der Prüfung: GMs Achtzylinder-Fassung verlangt unter 0,5 Ohm gegen Masse bei abgeschaltetem Ausgang, abgetastet alle 250 ms. Zuerst die Leitung zu Zylinder 10 auf Scheuerstellen untersuchen, danach das Stellglied. Eine offene Leitung meldet P3473, Plusschluss P3476, das Auslass-Gegenstück P3479."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 10 control wire grounded through chafing
        de: Steuerleitung von Zylinder 10 durch Scheuern an Masse
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Actuator of cylinder 10 shorted internally
        de: Stellglied von Zylinder 10 mit innerem Schluss
    - id: connector_water
      likelihood: low
      label:
        en: Water in the actuator connector
        de: Wasser im Stecker des Stellglieds
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Defective control module output stage
        de: Defekte Endstufe im Steuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Reduced-cylinder mode unavailable
      de: Teilzylinderbetrieb nicht verfügbar
    - en: Possible misfire on cylinder 10
      de: Mögliche Fehlzündungen auf Zylinder 10
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3473, P3474, P3476, P3479, P0310, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
