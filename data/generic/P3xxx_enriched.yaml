- code: P34A0
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Performance
    de: Zylinder 9 Abschaltung/Einlassventil Funktion
  description:
    en: P34A0 is reserved for a cylinder 9 that keeps its valves moving after the engine computer has ordered it off, which presumes an engine with at least nine cylinders and per-cylinder valve switching. No manufacturer documents this code publicly. The twelve-cylinder engines with deactivation found so far work bank by bank; Bentley's W12 in the 2020 Bentayga Speed, for example, alternates between two complete banks of six. A monitor would work like GM's tests for cylinders 1 to 8 (P3498 to P349F), where manifold pressure that stays too high in skipped events reveals a cylinder that is still breathing. CARB requires such mechanical checks for valve control systems. P3466 is the control-performance code for cylinder 9.
    de: "P34A0 ist für einen Zylinder 9 vorgesehen, der nach dem Abschaltbefehl weiter Ventilhub macht; das setzt einen Motor mit mindestens neun Zylindern und Ventilabschaltung je Zylinder voraus. Kein Hersteller dokumentiert diesen Code öffentlich. Die bekannten Zwölfzylinder mit Abschaltung arbeiten bankweise, etwa Bentleys W12 im Bentayga Speed von 2020, der zwischen zwei kompletten Sechserbänken wechselt. Eine Überwachung liefe wie GMs Tests für die Zylinder 1 bis 8 (P3498 bis P349F): Bleibt der Saugrohrdruck in ausgelassenen Takten zu hoch, ist der Zylinder nicht dicht. Die CARB verlangt solche mechanischen Prüfungen für Ventilsteuerungen. Die Ansteuerungsfunktion von Zylinder 9 meldet P3466."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: high
      label:
        en: Switching lifter or rocker of cylinder 9 stuck
        de: Schaltstößel oder Schaltkipphebel von Zylinder 9 klemmt
    - id: oil_control_valve_faulty
      likelihood: medium
      label:
        en: Oil control valve for the deactivation not switching
        de: Ölsteuerventil der Abschaltung schaltet nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low or degraded oil
        de: Zu wenig oder gealtertes Öl
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough running in reduced-cylinder mode
      de: Unrunder Lauf im Teilzylinderbetrieb
    - en: Higher fuel use
      de: Höherer Verbrauch
