- code: P3415
  category: powertrain
  title:
    en: Cylinder 2 Exhaust Valve Control Circuit Low
    de: Zylinder 2 Auslassventil Steuerkreis niedrig
  description:
    en: "P3415 describes a control circuit for a dedicated cylinder 2 exhaust valve actuator that is pulled toward ground. No manufacturer documents this code publicly. Cylinder 2 itself is a common deactivation candidate: GM switches it off on its 3.6 l and 3.0 l V6 engines (bulletin 21-NA-036) and on DFM V8s, but there one oil control valve serves the whole cylinder, so wiring faults land on the intake-side codes P3409, P3411 and P3412. On the L84, GM treats a resistance to ground below 0.5 ohm, read while the output stage is inactive, as a short. CARB wants these outputs tested for shorts. Siblings: P3413 open, P3414 function, P3416 short to power; cylinder 1 uses P3407. The engine keeps running on all cylinders."
    de: "P3415 beschreibt einen Steuerkreis für ein eigenes Auslassventil-Stellglied an Zylinder 2, der nach Masse gezogen wird. Kein Hersteller dokumentiert diesen Code öffentlich. Zylinder 2 selbst wird oft abgeschaltet: GM legt ihn bei den 3,6- und 3,0-l-V6 (Bulletin 21-NA-036) und bei den DFM-V8 still, dort bedient aber ein Ölsteuerventil den ganzen Zylinder, Leitungsfehler erscheinen deshalb als Einlass-Codes P3409, P3411 und P3412. Beim L84 wertet GM weniger als 0,5 Ohm nach Masse bei abgeschalteter Endstufe als Kurzschluss. CARB verlangt, solche Ausgangskreise auf Schlüsse zu prüfen. Geschwister: P3413 Unterbrechung, P3414 Funktion, P3416 Plusschluss; Zylinder 1 nutzt P3407. Der Motor läuft auf allen Zylindern weiter."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Control wire of the cylinder 2 exhaust actuator touching ground
        de: Steuerleitung des Auslass-Stellglieds von Zylinder 2 hat Masseschluss
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 2 exhaust actuator
        de: Innerer Kurzschluss im Auslass-Stellglied von Zylinder 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Damaged output stage in the engine control module
        de: Beschädigte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation inhibited
      de: Zylinderabschaltung unterbunden
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
