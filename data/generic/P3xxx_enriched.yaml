- code: P34BA
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit Low Bank 2
    de: Nockenwellenversteller B Temperaturfühler Stromkreis zu niedrig Bank 2
  description:
    en: "P34BA tells that the temperature signal from bank 2's exhaust actuator is pulled under its lower limit. Typical sources are a signal wire that has found ground, for instance where the harness runs close to hot exhaust parts, or a sensor element shorted inside the actuator. If the controller reads the low voltage as heat, it protects the actuator by reducing its current, as Aisin describes, so the bank 2 exhaust timing may no longer follow its target and timing codes such as P0024 can follow. The code is catalogued by NTN-SNR; no maker publishes it, so any threshold remains unknown. Repairs range from mending a wire to replacing the actuator, because the sensor sits in its electronics. Bank 1 low: P34B6; bank 2 high: P34BB."
    de: "P34BA zeigt an, dass das Temperatursignal am Auslassversteller von Bank 2 unter seine Untergrenze gezogen wird. Häufig hat eine Signalleitung Masse gefunden, etwa dort, wo der Kabelbaum nahe an heißen Abgasteilen verläuft, oder das Fühlerelement ist im Versteller kurzgeschlossen. Deutet das Steuergerät die niedrige Spannung als Hitze, schützt es den Versteller durch weniger Strom, wie Aisin es beschreibt; die Auslass-Steuerzeit von Bank 2 folgt dann womöglich nicht mehr dem Sollwert, und Verstellcodes wie P0024 können hinzukommen. Im Katalog von NTN-SNR steht der Code, ein Hersteller veröffentlicht ihn nicht – Schwellen bleiben daher unbekannt. Die Reparatur reicht vom geflickten Kabel bis zum neuen Versteller, da der Fühler in dessen Elektronik sitzt. Bank 1 zu niedrig: P34B6, Bank 2 zu hoch: P34BB."
  affected_components:
    - cam_actuator_b_temp_sensor_b2
    - sensor_wiring
  common_causes:
    - id: harness_heat_short
      likelihood: high
      label:
        en: Harness near exhaust parts damaged, signal shorted to ground
        de: Kabelbaum nahe Abgasteilen beschädigt, Signal an Masse
    - id: sensor_shorted
      likelihood: medium
      label:
        en: Sensor element shorted inside the bank 2 actuator
        de: Fühlerelement im Versteller von Bank 2 kurzgeschlossen
    - id: control_module
      likelihood: low
      label:
        en: Input of the controlling module faulty
        de: Eingang des ansteuernden Steuergeräts defekt
  symptoms:
    - en: Malfunction indicator lamp lit
      de: Motorkontrollleuchte leuchtet
    - en: Bank 2 exhaust timing limited, possibly with additional timing codes
      de: Auslass-Steuerzeit von Bank 2 begrenzt, ggf. mit weiteren Verstellcodes
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [50, 850]
    estimated_hours: [0.5, 3.5]
  flags:
