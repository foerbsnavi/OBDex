- code: P3450
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Control Performance
    de: Zylinder 7 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3450 reports that cylinder 7 does not deactivate or reactivate as commanded while its solenoid circuit checks out. FCA lists it as Cylinder 7 Deactivation Control Performance for the 6.4 l Heavy Duty Hemi with MDS (RAM 2500 to 5500, bulletins 18-082-16 and 18-036-20): the MIL lights and a PCM reflash cures it, with an optional calibration that also eases drone and shudder in MDS mode. On the 2025 F-150 5.0 l, Ford bulletin 26-2093, which replaces 25-2487, pairs it with P3442 and has the left-bank solenoid oil feed tube replaced under the valve cover. In GM's system, as NHTSA describes it, oil pressure moves locking pins so the lifter body travels without opening the valve. GM's L84 uses P349E. Electrical faults: P3449, P3451, P3452."
    de: "P3450 meldet, dass Zylinder 7 sich nicht wie befohlen ab- oder zuschaltet, obwohl der Kreis seines Magnetventils in Ordnung ist. FCA führt ihn als „Cylinder 7 Deactivation Control Performance“ beim 6,4-l-Heavy-Duty-Hemi mit MDS (RAM 2500 bis 5500, Bulletins 18-082-16 und 18-036-20): Die MIL leuchtet, eine neue Motorsoftware behebt den Fehler; eine wahlweise Kalibrierung mildert zudem Dröhnen und Ruckeln im MDS-Betrieb. Beim F-150 5,0 l von 2025 nennt Fords Bulletin 26-2093, Nachfolger von 25-2487, ihn zusammen mit P3442 und lässt das Ölzulaufrohr der Magnetventile der linken Bank unter dem Ventildeckel tauschen. In GMs System verschiebt laut NHTSA Öldruck Sperrstifte, sodass sich der Stößelkörper bewegt, ohne das Ventil zu öffnen. GMs L84 nutzt P349E. Elektrische Fehler: P3449, P3451, P3452."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: oil_feed_tube_restricted
      likelihood: medium
      label:
        en: Restricted oil feed tube to the left-bank solenoids (Ford 5.0 l, TSB 26-2093)
        de: Verengtes Ölzulaufrohr zu den Magnetventilen der linken Bank (Ford 5,0 l, TSB 26-2093)
    - id: pcm_software
      likelihood: medium
      label:
        en: Outdated PCM calibration (FCA 6.4 l, bulletins 18-082-16 and 18-036-20)
        de: Veraltete Motorsoftware (FCA 6,4 l, Bulletins 18-082-16 und 18-036-20)
    - id: lifter_locking_pin_stuck
      likelihood: medium
      label:
        en: Locking pins in a cylinder 7 lifter sticking from wear or dirt
        de: Sperrstifte in einem Stößel von Zylinder 7 klemmen durch Verschleiß oder Schmutz
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Insufficient or aged oil delaying the switch
        de: Zu wenig oder gealtertes Öl verzögert das Umschalten
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Ticking noise from the valve train
      de: Tickern aus dem Ventiltrieb
    - en: Misfire on cylinder 7 (P0307)
      de: Fehlzündungen auf Zylinder 7 (P0307)
    - en: Reduced-cylinder mode switched off
      de: Teilzylinderbetrieb abgeschaltet
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3449, P3451, P3452, P3442, P3402, P3426, P349E, P0307]
  sources:
