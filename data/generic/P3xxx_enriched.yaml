- code: P349A
  category: powertrain
  title:
    en: Cylinder 3 Deactivation/Intake Valve Performance
    de: Zylinder 3 Abschaltung/Einlassventil Funktion
  description:
    en: P349A states that cylinder 3 kept its valves working while the engine computer had switched it off. GM picks this up on its L84 and L87 V8s through manifold pressure that stays too high during the skipped strokes, Type B after 22 failed checks out of 25. Not every stored P349A means a worn lifter. For the 2021 Tahoe, Suburban, Yukon and Escalade, GM explains (PIP5731, later bulletin 20-NA-204) that a voltage dip while cranking could make the ECM drop the deactivation outputs for one trip and log this code in history without a real defect; the cure is new ECM software and a road test with a warm engine at 30 to 45 mph. If it returns, the lifters and the solenoid of cylinder 3 need checking. P3418 covers the control side.
    de: "P349A sagt aus, dass Zylinder 3 seine Ventile weiter betätigt hat, obwohl das Steuergerät ihn abgeschaltet hatte. GM erkennt das bei L84 und L87 an einem Saugrohrdruck, der in den ausgelassenen Takten zu hoch bleibt (Type B nach 22 Fehlprüfungen in 25). Nicht jeder gespeicherte P349A bedeutet einen verschlissenen Stößel: Für Tahoe, Suburban, Yukon und Escalade 2021 beschreibt GM (PIP5731, danach Bulletin 20-NA-204), dass ein Spannungseinbruch beim Anlassen die Abschaltausgänge für einen Fahrzyklus sperren und den Code ohne echten Defekt im Speicher hinterlassen konnte; Abhilfe sind neue ECM-Software und eine Probefahrt mit warmem Motor bei rund 50 bis 70 km/h. Kehrt er zurück, sind Stößel und Magnetventil von Zylinder 3 zu prüfen. Die Ansteuerung betrifft P3418."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - ecm
  common_causes:
    - id: ecm_false_detection
      likelihood: medium
      label:
        en: Voltage dip at cranking disabled the outputs, ECM software outdated
        de: Spannungseinbruch beim Start sperrte die Ausgänge, ECM-Software veraltet
    - id: lifter_lock_pins_stuck
      likelihood: medium
      label:
        en: Deactivation lifter of cylinder 3 does not unlock
        de: Abschaltstößel von Zylinder 3 entriegelt nicht
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Lifter oil solenoid of cylinder 3 sticking
        de: Ölmagnetventil von Zylinder 3 klemmt
    - id: low_or_degraded_oil
      likelihood: low
      label:
        en: Low or aged oil slowing the switching
        de: Zu wenig oder gealtertes Öl verzögert das Umschalten
  symptoms:
    - en: Code stored in history with no noticeable concern
      de: Code im Fehlerspeicher, ohne dass etwas auffällt
    - en: Check engine lamp on if the fault is real
      de: Motorkontrollleuchte an, wenn der Fehler echt ist
    - en: Ticking noise or higher fuel use
      de: Tickgeräusch oder höherer Verbrauch
