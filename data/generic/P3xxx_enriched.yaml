- code: P3423
  category: powertrain
  title:
    en: Cylinder 3 Exhaust Valve Control Circuit Low
    de: Zylinder 3 Auslassventil Steuerkreis niedrig
  description:
    en: "P3423 points to a grounded control wire at a dedicated cylinder 3 exhaust actuator. No manufacturer documents this code publicly, and NHTSA's 2025 look at GM's DFM engines shows why: each cylinder has just one lifter oil solenoid, and it feeds both lifters, intake and exhaust, so there is no separate exhaust output that could fail. For that same solenoid on cylinder 3, GM's L84 table flags a resistance to ground under half an ohm at rest and files it as P3419. The 2007 Displacement on Demand application likewise lists only one solenoid circuit for cylinder 3. Any design with its own exhaust output would fall under the CARB duty to detect shorts. Effect: warning lamp, cylinder 3 stays active."
    de: "P3423 weist auf einen Masseschluss in der Steuerleitung eines eigenen Auslass-Stellglieds an Zylinder 3 hin. Kein Hersteller dokumentiert diesen Code öffentlich; den Grund zeigt die NHTSA-Untersuchung 2025 zu GMs DFM-V8: Ein einziges Stößel-Öl-Magnetventil je Zylinder versorgt beide Stößel, Einlass und Auslass, einen getrennten Auslass-Ausgang gibt es also nicht. Für eben dieses Ventil an Zylinder 3 wertet GMs L84-Tabelle einen Widerstand unter einem halben Ohm zur Masse bei ruhendem Treiber als Fehler und nutzt dafür P3419. Auch GMs Displacement-on-Demand-Tabelle aus dem Jahr 2007 führt für Zylinder 3 nur einen Ventilkreis. Eine Bauart mit eigenem Auslass-Ausgang fiele unter die CARB-Pflicht, Kurzschlüsse zu erkennen. Folge: Warnleuchte, Zylinder 3 bleibt aktiv."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 3 shorted to engine ground
        de: Leitung des Auslass-Stellglieds von Zylinder 3 mit Motormasse verbunden
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Actuator winding shorted to its housing
        de: Wicklung des Stellglieds hat Schluss zum Gehäuse
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty output stage in the control module
        de: Fehlerhafte Endstufe im Steuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: No switch to reduced-cylinder operation
      de: Kein Wechsel in den Teilzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3421, P3422, P3424, P3419, P3431, P3415]
  sources:
