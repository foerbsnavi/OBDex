- code: P3417
  category: powertrain
  title:
    en: Cylinder 3 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 3 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: "P3417 flags a broken path in the drive circuit of the cylinder 3 deactivation solenoid. GM documents it twice: its 2007 Displacement on Demand table covers solenoid circuits on cylinder 1, 3 and 5 and needs 30 bad readings in 100 with the engine turning faster than 800 rpm; for the 2019 DFM engine L84, the ECM expects over 200 kohm whenever its low-side output rests, 20 of 25 checks, Type B. That controller also watches a high-side driver for the same solenoid under separate codes, and GM warns that P3419 may appear alongside. The LTA and LT2 V8s also put cylinder 3 to rest, together with 2, 5 and 8 (bulletin 20-NA-038). As long as the circuit is open, every cylinder keeps firing."
    de: "P3417 meldet einen unterbrochenen Ansteuerkreis des Abschalt-Magnetventils von Zylinder 3. GM belegt den Code zweimal: Die Tabelle 2007 für Displacement on Demand deckt die Ventilkreise an Zylinder 1, 3 und 5 ab und wertet 30 fehlerhafte Messungen aus 100 oberhalb von 800 U/min. Für den DFM-Motor L84 (2019) erwartet das Steuergerät über 200 kOhm, solange sein Low-Side-Treiber ruht, 20 von 25 Prüfungen, Type B. Dasselbe Steuergerät überwacht zusätzlich einen High-Side-Treiber dieses Ventils unter eigenen Codes, und GM weist darauf hin, dass P3419 mit auftreten kann. Auch die V8 LTA und LT2 legen Zylinder 3 still (Bulletin 20-NA-038). Bei offenem Kreis läuft der Motor dauerhaft mit allen Zylindern."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Broken or chafed wire between control module and cylinder 3 solenoid
        de: Gebrochene oder durchgescheuerte Leitung zwischen Steuergerät und Ventil von Zylinder 3
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open winding in the cylinder 3 deactivation solenoid
        de: Unterbrochene Wicklung im Abschalt-Magnetventil von Zylinder 3
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Loose, oily or corroded solenoid connector
        de: Lockerer, verölter oder korrodierter Ventilstecker
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Failed output stage in the engine control module
        de: Ausgefallene Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Reduced-cylinder mode no longer engages
      de: Teilzylinderbetrieb schaltet nicht mehr zu
    - en: Slightly higher fuel consumption
      de: Etwas höherer Verbrauch
