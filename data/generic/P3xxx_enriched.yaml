- code: P349C
  category: powertrain
  title:
    en: Cylinder 5 Deactivation/Intake Valve Performance
    de: Zylinder 5 Abschaltung/Einlassventil Funktion
  description:
    en: "P349C means that cylinder 5 stayed active although the engine computer had requested a skip. GM documents it for its Dynamic Fuel Management V8s (L84 with 5.3 l, L87 with 6.2 l), where every cylinder may be skipped; the classic AFM V8s rest only cylinders 1, 7, 6 and 4. Detection compares filtered manifold pressure with a deactivation threshold, and a Type B code follows after 22 failures out of 25. For 2019 Silverado and Sierra trucks, GM's PIP5584 blames the lifter oil solenoid of the affected cylinder: replace it and inspect the remaining solenoids for a pole piece that stands proud of the surface. Wiring faults for cylinder 5 appear as P3433, P3435 and P3436. The driver sees the lamp and pays with higher fuel use."
    de: "P349C heißt: Zylinder 5 ist aktiv geblieben, obwohl das Steuergerät ihn aussetzen lassen wollte. Belegt ist der Code bei GMs Dynamic-Fuel-Management-V8 (L84 mit 5,3 l, L87 mit 6,2 l), die jeden Zylinder abschalten können; die klassischen AFM-V8 legen nur die Zylinder 1, 7, 6 und 4 still. Erkannt wird der Fehler am gefilterten Saugrohrdruck, der über einer Abschaltschwelle bleibt; 22 Fehler in 25 Gelegenheiten ergeben einen Type-B-Code. Für Silverado und Sierra 2019 nennt GM in PIP5584 das Stößel-Ölmagnetventil des Zylinders als Ursache: tauschen und bei den übrigen Ventilen prüfen, ob der Polkern übersteht. Elektrische Fehler dieses Kanals sind P3433, P3435 und P3436. Der Fahrer sieht die Leuchte und merkt Mehrverbrauch."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - valve_train
    - engine_oil
  common_causes:
    - id: oil_solenoid_faulty
      likelihood: high
      label:
        en: Lifter oil solenoid of cylinder 5 faulty, pole piece protruding
        de: Ölmagnetventil von Zylinder 5 defekt, Polkern steht über
    - id: lifter_lock_pins_stuck
      likelihood: medium
      label:
        en: Lifters of cylinder 5 do not unlock
        de: Stößel von Zylinder 5 entriegeln nicht
    - id: oil_contamination
      likelihood: low
      label:
        en: Dirt in the oil blocking the solenoid or lifter bores
        de: Schmutz im Öl setzt Magnetventil oder Stößelbohrungen zu
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer skips cylinders, fuel use rises
      de: Motor blendet keine Zylinder mehr aus, Verbrauch steigt
    - en: Vibration at light load
      de: Vibrationen bei geringer Last
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 4500]
    estimated_hours: [0.5, 14]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3434, P3433, P3435, P3436, P349B, P349D, P0305]
  sources:
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/tsbs/2018/MC-10145466-9999.pdf
