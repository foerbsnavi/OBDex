- code: P3489
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 12 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3489 reports that the circuit to the actuator for deactivation or the intake valve of cylinder 12, the highest cylinder number in this code series, is open. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Twelve-cylinder engines with shut-off span Mercedes' late-1990s V12, which deactivated every second cylinder in the firing order, Lamborghini's Aventador V12 that shuts down one cylinder bank below 135 km/h, and Bentley's W12. The Mercedes engine used a hydraulic solenoid pack, the kind of part such a circuit would drive; the bank-based systems publish no equivalent. Comparable logic on GM V8s calls a circuit open above 200 kohm with the output idle. P3491 and P3492 report shorts, P3490 a functional fault, P3493 the exhaust valve.
    de: P3489 meldet eine Unterbrechung im Kreis zum Stellglied für Abschaltung bzw. Einlassventil von Zylinder 12, der höchsten Zylindernummer dieser Code-Reihe. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zwölfzylinder mit Abschaltung reichen vom Mercedes-V12 der späten 1990er, der jeden zweiten Zylinder der Zündfolge stilllegte, über den V12 des Lamborghini Aventador, der unter 135 km/h eine Bank abschaltet, bis zu Bentleys W12. Der Mercedes-Motor nutzte einen hydraulischen Magnetventilblock, wie ihn ein solcher Kreis ansteuert; die bankweisen Systeme veröffentlichen nichts dergleichen. GM wertet an V8 einen Kreis ab 200 kOhm bei ruhendem Ausgang als offen. Schlüsse melden P3491 und P3492, Funktionsfehler P3490, das Auslassventil P3493.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Wire to the cylinder 12 actuator open or chafed
        de: Leitung zum Stellglied von Zylinder 12 offen oder durchgescheuert
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Cylinder 12 actuator coil open
        de: Spule des Stellglieds von Zylinder 12 unterbrochen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Loose or corroded connector at cylinder 12
        de: Lockerer oder korrodierter Stecker an Zylinder 12
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage of the control module failed
        de: Endstufe des Steuergeräts ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer runs in reduced-cylinder mode
      de: Motor fährt nicht mehr im Teilzylinderbetrieb
    - en: Somewhat higher fuel use on the highway
      de: Etwas höherer Verbrauch auf der Autobahn
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3490, P3491, P3492, P3493, P3400, P3497, P0312]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://en.wikipedia.org/wiki/Variable_displacement
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
