- code: P3481
  category: powertrain
  title:
    en: Cylinder 11 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 11 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3481 marks an open circuit to the actuator for deactivation or the intake valve of cylinder 11, a cylinder only V12 and W12 engines possess. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Bentley's W12, the best documented twelve-cylinder with shut-off, stops one complete bank of six and, according to its engineering chief, leaves the valves operating; the ECU alternates between bank A and bank B using intake and exhaust sensor data so cylinders and catalytic converter stay warm. With no valve actuator, there is no circuit for P3481 to check. On a design that has one, it means a broken wire, connector or coil. P3483 and P3484 report shorts, P3482 the function, P3485 the exhaust side.
    de: P3481 kennzeichnet eine Unterbrechung zum Stellglied für Abschaltung bzw. Einlassventil von Zylinder 11 – einen Zylinder, den nur V12- und W12-Motoren haben. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bentleys W12, der am besten belegte Zwölfzylinder mit Abschaltung, legt eine komplette Sechserbank still und lässt dabei nach Aussage seines Entwicklungsvorstands die Ventile weiterarbeiten; das Steuergerät wechselt anhand von Sensordaten aus Ansaug- und Abgasseite zwischen Bank A und B, damit Zylinder und Katalysator warm bleiben. Ohne Ventil-Stellglied gibt es keinen Kreis, den P3481 prüfen könnte. Sonst stehen Leitung, Stecker oder Spule im Verdacht. Schlüsse melden P3483 und P3484, die Funktion P3482, die Auslassseite P3485.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Wire to the cylinder 11 actuator broken
        de: Leitung zum Stellglied von Zylinder 11 gebrochen
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Cylinder 11 actuator coil open
        de: Spule des Stellglieds von Zylinder 11 offen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Actuator connector at cylinder 11 loose or corroded
        de: Stecker am Stellglied von Zylinder 11 locker oder korrodiert
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Driver stage in the engine control module failed
        de: Treiberstufe im Motorsteuergerät ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays on all twelve cylinders
      de: Motor bleibt auf allen zwölf Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
