- code: P34C4
  category: powertrain
  title:
    en: A Camshaft Position Actuator Control Circuit Driver Current/Temperature Too High Bank 1
    de: Nockenwellenversteller A Steuerkreis Treiberstrom/-temperatur zu hoch Bank 1
  description:
    en: "P34C4 is logged when the output stage feeding the bank 1 intake actuator A reports that its current or its own temperature has passed the permitted limit. The code belongs to electric phasers, where a small motor instead of an oil valve turns the camshaft. An Aisin patent shows the protective logic: a current sensor and a board temperature sensor sit on the motor driver, and if the board stays hot the controller first eases the motor off its end stop and later cuts the current. NTN-SNR files P34C4 under inlet adjustment, bank 1. Nissan drives both intake cams of the 2018 Pathfinder electrically from a separate module (NTB18-016), yet no public manufacturer text covers P34C4 itself. A binding phaser, sludged oil or a shorted motor winding are typical triggers. Bank 2 is P34C5."
    de: "P34C4 steht, wenn die Endstufe des Einlassverstellers A (Bank 1) meldet, dass ihr Strom oder ihre eigene Temperatur über der Grenze liegt. Gemeint sind elektrische Versteller, bei denen ein kleiner Motor statt eines Ölventils die Nockenwelle verdreht. Ein Aisin-Patent beschreibt den Schutz: Auf der Treiberplatine sitzen ein Stromsensor und ein Temperaturfühler; bleibt die Platine heiß, löst das Steuergerät den Versteller zuerst vom Anschlag und nimmt später den Strom ganz weg. NTN-SNR ordnet P34C4 der Einlassverstellung von Bank 1 zu. Nissan verstellt beim Pathfinder 2018 beide Einlassnocken elektrisch über ein eigenes Steuergerät (NTB18-016); eine öffentliche Herstellerbeschreibung zu P34C4 gibt es aber nicht. Häufige Auslöser sind ein schwergängiger Versteller, verschlammtes Öl oder eine Windung mit Schluss. Bank 2 meldet P34C5."
  affected_components:
    - cam_actuator_a_driver_b1
    - cam_actuator_a_b1
  common_causes:
    - id: actuator_binding
      likelihood: high
      label:
        en: Phaser stiff or held against its stop, motor draws high current for long
        de: Versteller schwergängig oder am Anschlag, Motor zieht lange hohen Strom
    - id: oil_condition
      likelihood: medium
      label:
        en: Low or sludged engine oil making the phaser hard to turn
        de: Zu wenig oder verschlammtes Motoröl, Versteller dreht schwer
    - id: motor_winding_short
      likelihood: medium
      label:
        en: Winding or motor lead of the bank 1 actuator shorted
        de: Windung oder Motorleitung des Stellers auf Bank 1 mit Schluss
    - id: driver_module
      likelihood: low
      label:
        en: Output stage or its sensors in the phaser control module faulty
        de: Endstufe oder deren Sensoren im Verstellersteuergerät defekt
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake timing on bank 1 no longer adjusted, held at a fixed angle
      de: Einlasssteuerzeit auf Bank 1 wird nicht mehr verstellt, bleibt fest
    - en: Weaker pull at low revs, rougher idle on a cold engine
      de: Weniger Zug untenherum, unruhigerer Leerlauf bei kaltem Motor
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [80, 1200]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
