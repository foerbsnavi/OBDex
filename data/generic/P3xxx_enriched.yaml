- code: P340D
  category: powertrain
  title:
    en: Deactivation/Exhaust Valve Control Circuit Bank 2
    de: Abschaltung/Auslassventil Steuerkreis Bank 2
  description:
    en: "P340D is the bank 2 version of the exhaust-side group circuit: the engine computer sees an electrical fault on the line that is supposed to disable the exhaust valves of the bank without cylinder 1. No manufacturer documents this code publicly. Separate exhaust control matters because a cylinder can only act as a gas spring if its exhaust valves stay shut too; a Ford patent shows how an exhaust valve that keeps opening can be detected from exhaust pressure. On known engines, though, intake and exhaust are switched together per cylinder, as with GM's DFM. CARB rules call for monitoring of outputs like this one. Related: P340C for bank 1, P340B for the bank 2 intake side, P341D for the function check. Deactivation stays off."
    de: "P340D ist die Bank-2-Fassung des auslassseitigen Sammelkreises: Das Steuergerät erkennt einen elektrischen Fehler an der Leitung, die die Auslassventile der Bank ohne Zylinder 1 stilllegen soll. Kein Hersteller dokumentiert den Code öffentlich. Eine eigene Auslasssteuerung ist von Bedeutung, weil ein Zylinder nur dann als Gasfeder arbeitet, wenn auch seine Auslassventile geschlossen bleiben; ein Ford-Patent zeigt, wie sich ein weiter öffnendes Auslassventil am Abgasdruck erkennen lässt. Bei bekannten Motoren werden Ein- und Auslass jedoch je Zylinder gemeinsam geschaltet, so bei GMs DFM. CARB verlangt die Überwachung solcher Ausgangskreise. Verwandt: P340C für Bank 1, P340B für den Einlass von Bank 2, P341D für die Funktion. Die Abschaltung bleibt aus."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_fault
      likelihood: medium
      label:
        en: Damaged wiring to the bank 2 exhaust deactivation actuator
        de: Beschädigte Leitung zum Auslass-Abschaltstellglied von Bank 2
    - id: actuator_coil_fault
      likelihood: medium
      label:
        en: Faulty coil in the bank 2 exhaust actuator
        de: Defekte Spule im Auslass-Stellglied von Bank 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage fault in the engine control module
        de: Fehler in der Endstufe des Motorsteuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer drops cylinders at light load
      de: Motor schaltet bei geringer Last keine Zylinder mehr ab
  repair:
