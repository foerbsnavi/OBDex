- code: P34A1
  category: powertrain
  title:
    en: Cylinder 10 Deactivation/Intake Valve Performance
    de: Zylinder 10 Abschaltung/Einlassventil Funktion
  description:
    en: "P34A1 would mean that cylinder 10 kept opening its valves while it was supposed to be deactivated. No manufacturer documents this code publicly; it only makes sense on V10, V12 or W12 engines. Lamborghini, for instance, gave the Aventador LP 700-4 a Cylinder Deactivation System that rests one bank at speeds under 135 km/h, but no public diagnostic table lists P34A1. The physics of a check is shared with smaller engines: Ford's patent US8667835B2 watches the rise and fall of manifold pressure across successive intake events and compares it with the commanded pattern. Causes would mirror those of the V8 codes P3498 to P349F: a stuck switching element, a faulty oil control valve or poor oil. P3474 covers the control side of cylinder 10."
    de: "P34A1 hieße, dass Zylinder 10 seine Ventile weiter öffnet, während er abgeschaltet sein soll. Kein Hersteller dokumentiert diesen Code öffentlich; sinnvoll ist er nur bei V10-, V12- oder W12-Motoren. Lamborghini hat etwa den Aventador LP 700-4 mit einem Cylinder Deactivation System ausgestattet, das unter 135 km/h eine Bank ruhen lässt, eine öffentliche Diagnosetabelle mit P34A1 gibt es aber nicht. Die Prüfphysik ist dieselbe wie bei kleineren Motoren: Fords Patent US8667835B2 verfolgt Anstieg und Abfall des Saugrohrdrucks über aufeinanderfolgende Ansaugtakte und vergleicht sie mit dem befohlenen Muster. Ursachen wären wie bei den V8-Codes P3498 bis P349F ein klemmendes Schaltelement, ein defektes Ölsteuerventil oder schlechtes Öl. Die Ansteuerung betrifft P3474."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: high
      label:
        en: Switching element of cylinder 10 not unlocking
        de: Schaltelement von Zylinder 10 entriegelt nicht
    - id: oil_control_valve_faulty
      likelihood: medium
      label:
        en: Deactivation oil control valve sticking
        de: Ölsteuerventil der Abschaltung klemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil level too low or oil aged
        de: Ölstand zu niedrig oder Öl gealtert
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Reduced-cylinder mode no longer offered
      de: Teilzylinderbetrieb wird nicht mehr genutzt
    - en: Uneven running at low load
      de: Ungleichmäßiger Lauf bei geringer Last
