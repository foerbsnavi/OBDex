- code: P34C3
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit High Bank 2
    de: Nockenwellenversteller B Positionssensor A Stromkreis zu hoch Bank 2
  description:
    en: "P34C3 completes the sensor group of actuator B: on bank 2, sensor A watching the exhaust-side actuator puts out a voltage beyond its permitted range. A broken sensor ground, an open signal path or contact with a feed line are the usual causes. No manufacturer publishes P34C3. Mercedes-Benz, whose CAMTRONIC V8 uses neighbouring codes on this bank (P34C1, P34C2), lists no high fault, and the 2022 Mitsubishi Outlander has no electric exhaust actuator at all – its exhaust camshaft is shifted through an oil control solenoid that the fail-safe fixes in its reference position together with the electric intake motor. Until the cause is found the bank 2 exhaust adjustment stays in its default state, so drivers mainly see the warning lamp. Bank 1: P34BF."
    de: "P34C3 schließt die Sensorgruppe von Versteller B ab: Auf Bank 2 meldet Positionssensor A des Auslass-Stellers eine Spannung über dem zulässigen Bereich. Üblich sind eine gebrochene Sensormasse, ein offener Signalweg oder ein Schluss zu einer Versorgungsleitung. Veröffentlicht hat P34C3 kein Hersteller. Mercedes-Benz, dessen CAMTRONIC-V8 auf dieser Bank die Nachbarcodes P34C1 und P34C2 nutzt, nennt keinen Hochfehler, und der Mitsubishi Outlander 2022 hat gar keinen elektrischen Auslass-Steller – seine Auslassnocke bewegt ein Ölsteuerventil, das der Notlauf zusammen mit dem elektrischen Einlassmotor in Referenzlage festhält. Bis die Ursache gefunden ist, bleibt die Auslassverstellung von Bank 2 in Grundstellung; Fahrer sehen vor allem die Warnleuchte. Bank 1: P34BF."
  affected_components:
    - cam_actuator_b_pos_sensor_b2
    - sensor_wiring
  common_causes:
