- code: P34B2
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit Low Bank 2
    de: Nockenwellenversteller A Positionssensor A Stromkreis zu niedrig Bank 2
  description:
    en: P34B2 is set when position sensor A on the intake phaser of bank 2 delivers a voltage below its permitted window. Public manufacturer information on this code is lacking. On the 2022 Mitsubishi Outlander the bank 1 version P34AE is evaluated by the electric valve timing module and traced to the actuator circuit or the actuator. Mercedes calls the corresponding low code of its CAMTRONIC exhaust sensors on bank 2 (P34C2) a ground short and, in bulletin LI05.20-P-080192, has the engine harness by the bulkhead inspected for scorching. A grounded signal wire, a missing sensor supply or a shorted sensor are therefore the first things to rule out on bank 2. High is P34B3, bank 1 P34AE.
    de: P34B2 wird gesetzt, wenn die Spannung von Positionssensor A am Einlassversteller von Bank 2 das zulässige Fenster nach unten verlässt. Öffentlich dokumentiert kein Hersteller diesen Code. Beim Mitsubishi Outlander 2022 wertet das Steuergerät der elektrischen Ventilsteuerung die Bank-1-Fassung P34AE aus und führt sie auf den Stellerkreis oder den Steller zurück. Bei Mercedes steht der passende Niedrig-Code der CAMTRONIC-Auslasssensoren auf Bank 2 (P34C2) für einen Masseschluss; laut Bulletin LI05.20-P-080192 soll die Werkstatt den Motorkabelbaum nahe der Stirnwand auf Hitzespuren ansehen. Auf Bank 2 zuerst eine an Masse liegende Signalleitung, eine fehlende Sensorversorgung oder einen kurzgeschlossenen Sensor ausschließen. Zu hoch ist P34B3, Bank 1 P34AE.
  affected_components:
    - cam_actuator_a_pos_sensor_b2
    - sensor_wiring
  common_causes:
