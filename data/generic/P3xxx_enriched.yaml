- code: P3414
  category: powertrain
  title:
    en: Cylinder 2 Exhaust Valve Control Performance
    de: Zylinder 2 Auslassventil Steuerung Funktion
  description:
    en: "P3414 would be set when the exhaust valves of cylinder 2 do not follow a deactivation or reactivation command on an engine with separate exhaust valve control. No manufacturer documents this code publicly. The underlying problem is described in a Ford patent: an exhaust valve that still opens after deactivation shows up as pressure changes in the exhaust, and the controller can reactivate the cylinder or block further deactivation. GM's DFM engines report a cylinder whose intake and exhaust valves stay active under their own code P3499 instead. Electrical faults on this channel are P3413, P3415 and P3416, the intake-side function code is P3410."
    de: "P3414 würde gesetzt, wenn die Auslassventile von Zylinder 2 an einem Motor mit gesonderter Auslasssteuerung einem Ab- oder Zuschaltbefehl nicht folgen. Kein Hersteller dokumentiert diesen Code öffentlich. Das zugrunde liegende Problem beschreibt ein Ford-Patent: Ein Auslassventil, das nach der Abschaltung weiter öffnet, zeigt sich als Druckschwankung im Abgas, worauf das Steuergerät den Zylinder wieder zuschalten oder weitere Abschaltungen sperren kann. GMs DFM-Motoren melden einen Zylinder, dessen Ein- und Auslassventile aktiv bleiben, stattdessen unter dem eigenen Code P3499. Elektrische Fehler dieses Kanals sind P3413, P3415 und P3416; der Funktionscode der Einlassseite ist P3410."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust-side lifter or rocker of cylinder 2 not switching
        de: Auslassseitiger Stößel oder Kipphebel von Zylinder 2 schaltet nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low oil pressure or aerated oil
        de: Zu geringer Öldruck oder aufgeschäumtes Öl
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator valve sticking
        de: Ventil des Auslass-Stellglieds klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough running when cylinders are switched off
      de: Unrunder Lauf bei abgeschalteten Zylindern
    - en: Deactivation suspended by the engine computer
      de: Abschaltung vom Steuergerät ausgesetzt
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
