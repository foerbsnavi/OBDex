- code: P3490
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Control Performance
    de: Zylinder 12 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3490 concerns the mechanical result on cylinder 12: the actuator circuit passes its electrical checks, but the cylinder does not deactivate or reactivate as intended. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. In a V12 up to six cylinders can be stopped, and on a valve-switching design the commanded state depends on oil pressure reaching the switching parts; Mercedes' M137 suffered exactly there, with failures of its solenoid pack and oil pressure tubes. Lamborghini's and Bentley's twelve-cylinder engines shut whole banks and publish no valve monitoring. NHTSA's GM lifter description explains what can stick: spring-loaded locking pins moved by oil. Electrical faults on cylinder 12: P3489, P3491, P3492."
    de: "P3490 betrifft das mechanische Ergebnis an Zylinder 12: Der Kreis des Stellglieds besteht die elektrischen Prüfungen, der Zylinder schaltet aber nicht wie vorgesehen ab oder zu. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bei einem V12 lassen sich bis zu sechs Zylinder stilllegen; bei Ventilabschaltung muss dafür Öldruck die Schaltteile erreichen. Genau dort hatte der M137 von Mercedes Schwächen, mit Ausfällen an Magnetventilblock und Öldruckleitungen. Die Zwölfzylinder von Lamborghini und Bentley schalten ganze Bänke und veröffentlichen keine Ventilüberwachung. Was klemmen kann, erklärt die NHTSA-Beschreibung von GMs Stößeln: federbelastete Sperrstifte, die Öl verschiebt. Elektrische Fehler an Zylinder 12: P3489, P3491, P3492."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Oil pressure or quality inadequate to switch cylinder 12
        de: Öldruck oder Ölqualität reicht zum Umschalten von Zylinder 12 nicht
    - id: oil_line_leak
      likelihood: medium
      label:
        en: Leak in the oil supply to the cylinder 12 actuator
        de: Leck in der Ölversorgung zum Stellglied von Zylinder 12
    - id: lifter_locking_pin_stuck
      likelihood: medium
      label:
        en: Locking pins at cylinder 12 sticking
        de: Sperrstifte an Zylinder 12 klemmen
    - id: solenoid_sticking
      likelihood: low
      label:
        en: Actuator valve mechanically sluggish
        de: Ventil des Stellglieds mechanisch schwergängig
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire on cylinder 12 (P0312)
      de: Fehlzündungen auf Zylinder 12 (P0312)
    - en: Vibration at light load
      de: Vibrationen bei geringer Last
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3489, P3491, P3492, P3494, P0312, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://en.wikipedia.org/wiki/Variable_displacement
    - https://en.wikipedia.org/wiki/Mercedes-Benz_M137_engine
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
  reviewed: '2026-11-02'

- code: P3491
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 12 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: A ground fault on the control line of the cylinder 12 deactivation or intake valve actuator produces P3491. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The Aventador's cylinder deactivation system, introduced in 2012, shuts down one bank of six below 135 km/h, and Bentley's W12 drops one bank; neither publishes cylinder-level diagnostic codes. On GM V8s the corresponding low test watches for under 0.5 ohm to ground while the output is switched off, every 250 ms, and needs 20 hits in 25 samples. Because a grounded low-side line powers the actuator, the cylinder can be shut off against the module's will. P3489 (open) and P3492 (high) are the other circuit faults, P3495 the exhaust low.
    de: Ein Masseschluss an der Steuerleitung des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 12 erzeugt P3491. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Die Zylinderabschaltung des Aventador, eingeführt 2012, legt unter 135 km/h eine Bank mit sechs Zylindern still, Bentleys W12 eine Bank; Zylindercodes veröffentlicht keiner der beiden. An GM-V8 sucht der entsprechende Test bei abgeschaltetem Ausgang alle 250 ms nach unter 0,5 Ohm gegen Masse und braucht 20 Treffer in 25 Proben. Weil eine masseseitig geschaltete Leitung mit Masseschluss das Stellglied bestromt, kann der Zylinder gegen den Willen des Steuergeräts abschalten. Die anderen Kreisfehler sind P3489 (offen) und P3492 (hoch), Auslass niedrig ist P3495.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 12 control wire shorted to ground
        de: Steuerleitung von Zylinder 12 mit Masseschluss
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 12 actuator
        de: Innerer Schluss im Stellglied von Zylinder 12
    - id: connector_water
      likelihood: low
      label:
        en: Water ingress at the connector
        de: Wassereintritt am Stecker
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty control module driver
        de: Fehlerhafter Treiber im Steuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off blocked
      de: Zylinderabschaltung gesperrt
    - en: Possible misfire on cylinder 12
      de: Mögliche Fehlzündungen auf Zylinder 12
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3489, P3490, P3492, P3495, P0312, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://www.bentleymedia.com/en/newsitem/1130-new-bentayga-speed-the-ultimate-bentayga
  reviewed: '2026-11-02'

- code: P3492
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 12 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: P3492 records a high condition on the control circuit of the cylinder 12 deactivation or intake valve actuator, generally a short to a supply voltage seen while the output is commanded on. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The Variable displacement overview notes that a V12 can stop up to six cylinders, and the production engines doing so (Mercedes M137, Lamborghini Aventador, Bentley W12) differ widely in method, from a hydraulic solenoid pack (M137) to bank shut-off with the valves left running (Bentley). Only a design with valve actuators has a cylinder 12 actuator to short. Expect deactivation to be inhibited and the engine to run on all twelve. P3489 and P3491 are the electrical siblings, P3496 the exhaust high code.
    de: "P3492 hält einen zu hohen Zustand im Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 12 fest, meist einen Schluss zur Versorgung, der bei eingeschaltetem Ausgang auffällt. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Ein V12 kann bis zu sechs Zylinder stilllegen; die Serienmotoren dafür (Mercedes M137, Lamborghini Aventador, Bentley W12) gehen verschieden vor, vom hydraulischen Magnetventilblock (M137) bis zur Bankabschaltung mit weiterlaufenden Ventilen (Bentley). Ein Stellglied an Zylinder 12 gibt es nur bei einer Bauart mit Ventil-Stellgliedern. Das Steuergerät sperrt dann die Abschaltung, der Motor läuft auf allen zwölf. Elektrische Geschwister: P3489 und P3491, Auslass hoch ist P3496."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 12 control wire shorted to supply voltage
        de: Steuerleitung von Zylinder 12 mit Schluss zur Versorgungsspannung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 12 actuator
        de: Windungsschluss im Stellglied von Zylinder 12
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output damaged
        de: Ausgang des Motorsteuergeräts beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs permanently on twelve cylinders
      de: Motor läuft dauerhaft auf zwölf Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
