    de: Zylinder 10 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3476 is logged when the control circuit of the cylinder 10 deactivation or intake valve actuator sits at too high a level, usually a short to a battery-fed wire found while the output is active. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. On the V10s that offer shut-off, Audi describes the bank being stopped by cutting fuel injection and ignition in the upper gears, so cylinder 10 has no valve actuator there. A twelve-cylinder engine with valve switching, such as Mercedes' M137 with its oil-pressure solenoid pack, is the kind of design this code was written for. The control module then usually blocks deactivation for the rest of the trip. Electrical siblings: P3473 and P3475."
    de: "P3476 wird gespeichert, wenn der Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 10 zu hoch liegt – in der Regel ein Schluss zu einer batteriegespeisten Leitung, der bei aktivem Ausgang auffällt. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bei den V10 mit Abschaltung beschreibt Audi, dass die Bank in den oberen Gängen über das Abschalten von Einspritzung und Zündung ruht; Zylinder 10 hat dort kein Ventil-Stellglied. Für Konstruktionen wie den Mercedes-V12 M137 mit öldruckgesteuertem Magnetventilblock ist dieser Code gedacht. Meist sperrt das Steuergerät die Abschaltung danach für den Rest der Fahrt. Elektrische Geschwister: P3473 und P3475."
