- code: P3445
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Circuit/Open
    de: Zylinder 6 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "P3445 is defined for a break in the wiring of a stand-alone actuator that would control the exhaust valves of cylinder 6. No manufacturer documents this code publicly. The engines that deactivate cylinder 6 today, GM's AFM and DFM V8s and Chrysler's Hemi with MDS, publish only intake-side codes for this cylinder (P3441, and at GM also P3443 and P3444). NHTSA's description of GM's DFM hardware explains why: a single solenoid per cylinder sends oil to the intake and the exhaust lifters alike, which then unlock one after the other. An engine with its own exhaust-side actuators would have to check their wiring for continuity under CARB's rules for output components, and that is the fault this code names. P3446 to P3448 complete the exhaust group."
    de: "P3445 ist für einen Bruch in der Verkabelung eines separaten Stellglieds gedacht, das die Auslassventile von Zylinder 6 steuern würde. Kein Hersteller dokumentiert diesen Code öffentlich. Die Motoren, die heute Zylinder 6 abschalten – GMs V8 mit AFM und DFM sowie Chryslers Hemi mit MDS –, veröffentlichen für diesen Zylinder nur Codes der Einlassseite (P3441, bei GM zusätzlich P3443 und P3444). Die NHTSA-Beschreibung der DFM-Technik von GM zeigt den Grund: Ein einziges Magnetventil je Zylinder leitet Öl zu Einlass- und Auslassstößel gemeinsam, die danach nacheinander entriegeln. Ein Motor mit eigenen Stellgliedern auf der Auslassseite müsste deren Leitungen nach CARB-Regeln für Ausgangskomponenten auf Durchgang prüfen – genau diesen Fehler benennt der Code. P3446 bis P3448 vervollständigen die Auslassgruppe."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken wire or loose connector at the cylinder 6 exhaust actuator
        de: Leitungsbruch oder lockerer Stecker am Auslass-Stellglied von Zylinder 6
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Actuator coil interrupted
        de: Spule des Stellglieds unterbrochen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage in the control module faulty
        de: Endstufe im Steuergerät fehlerhaft
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled
      de: Zylinderabschaltung abgeschaltet
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
