- code: P3472
  category: powertrain
  title:
    en: Cylinder 9 Exhaust Valve Control Circuit High
    de: Zylinder 9 Auslassventil Steuerkreis hoch
  description:
    en: "P3472 records a high voltage level on the cylinder 9 exhaust valve control circuit, the pattern of a wire shorted to a supply feed or of a coil with shorted windings. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Engines that could in principle have a cylinder 9 with deactivation include the Mercedes M137 V12, the Lamborghini Aventador V12 and Bentley's W12; for none of them is a separate exhaust actuator documented, and the Bentley engine is described as leaving its valves working during shut-off. A US patent from GM shows that the exhaust side has a sequence of its own: there the exhaust valves stop before the intake valves and also return first. P3469 (open) and P3471 (low) complete the electrical set."
    de: "P3472 hält einen zu hohen Spannungspegel im Steuerkreis des Auslassventils von Zylinder 9 fest – das Bild einer Leitung mit Schluss zu einer Versorgung oder einer Spule mit Windungsschluss. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Für einen abschaltbaren Zylinder 9 kämen etwa der Mercedes-V12 M137, der V12 des Lamborghini Aventador und Bentleys W12 in Frage; bei keinem ist ein eigenes Auslass-Stellglied dokumentiert, und vom Bentley-Motor heißt es sogar, seine Ventile arbeiteten beim Abschalten weiter. Dass die Auslassseite eine eigene Schaltfolge hat, zeigt ein US-Patent von GM: Dort ruhen die Auslassventile vor den Einlassventilen und kehren auch zuerst zurück. P3469 (offen) und P3471 (niedrig) ergänzen die elektrischen Fehler."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 9 shorted to voltage
        de: Leitung zum Auslass-Stellglied von Zylinder 9 mit Plusschluss
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted windings in the exhaust actuator
        de: Windungsschluss im Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty engine control module output
        de: Fehlerhafter Ausgang des Motorsteuergeräts
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation switched off by the control module
      de: Zylinderabschaltung vom Steuergerät abgeschaltet
  repair:
    difficulty: medium
    diy_possible: true
