- code: P3454
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Performance
    de: Zylinder 7 Auslassventil Steuerung Funktion
  description:
    en: "P3454 covers an exhaust valve on cylinder 7 that does not switch as commanded, with no electrical fault on its control circuit. No manufacturer documents this code publicly. GM's own cylinder 7 check P318F on the 2019 L84 shows why the exhaust side matters: if the exhaust valve fails to open and release the burned gas, the trapped charge is compressed again, cylinder pressure climbs and the intake mechanism can be damaged on reactivation, so the ECM reacts at once (crankshaft jerk test, 66 of 100 samples, Type B). A Ford patent tackles the reverse problem, an exhaust valve still opening after deactivation, spotted through exhaust pressure. P3453, P3455 and P3456 are the electrical codes."
    de: "P3454 erfasst ein Auslassventil an Zylinder 7, das nicht wie befohlen schaltet, ohne dass sein Steuerkreis einen elektrischen Fehler hat. Kein Hersteller dokumentiert diesen Code öffentlich. Warum die Auslassseite wichtig ist, zeigt GMs eigene Prüfung P318F für Zylinder 7 beim L84 von 2019: Öffnet das Auslassventil nicht und bleibt das verbrannte Gas im Zylinder, wird es erneut verdichtet, der Zylinderdruck steigt, und beim Wiederzuschalten kann die Einlassmechanik Schaden nehmen. Das Steuergerät greift deshalb sofort ein (Auswertung der Kurbelwellen-Drehungleichförmigkeit, 66 von 100 Proben, Type B). Ein Ford-Patent behandelt das umgekehrte Problem, ein nach der Abschaltung weiter öffnendes Auslassventil, erkannt über den Abgasdruck. P3453, P3455 und P3456 sind die elektrischen Codes."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter of cylinder 7 stuck in the unlocked state
        de: Auslassstößel von Zylinder 7 hängt im entriegelten Zustand
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure or oil quality inadequate for switching
        de: Öldruck oder Ölqualität reicht zum Umschalten nicht aus
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust control valve slow or sticking
        de: Steuerventil der Auslassseite träge oder klemmend
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Hard knock or jolt when cylinder 7 is reactivated
      de: Harter Schlag oder Ruck beim Wiederzuschalten von Zylinder 7
    - en: Possible misfire on cylinder 7 (P0307)
      de: Mögliche Fehlzündungen auf Zylinder 7 (P0307)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3453, P3455, P3456, P3450, P349E, P0307]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US8006670B2/en
  reviewed: '2026-11-02'

- code: P3455
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Circuit Low
    de: Zylinder 7 Auslassventil Steuerkreis niedrig
  description:
    en: "P3455 points to a ground fault on the line that would drive an exhaust-only actuator on cylinder 7. No manufacturer documents this code publicly. On GM V8 engines, AFM and DFM alike, a single lifter oil solenoid serves intake and exhaust of each cylinder, so a grounded line there sets the intake-side code P3451: the low-side driver is switched off, the output reads under 0.5 ohm to ground, and 20 of 25 checks taken every 250 ms must fail (Type B). On FCA's Hemi, MDS wiring rubbed through by the heat shield behind the driver-side head, next to cylinder 7, shows up as P3449. With its control line grounded, the actuator could switch on uncommanded, so the cylinder may lose its valve motion while fuel still flows. P3453 is the open, P3456 the short to power."
    de: "P3455 steht für Masseschluss an der Ansteuerung eines separaten Stellglieds, das nur das Auslassventil von Zylinder 7 schaltet. Kein Hersteller dokumentiert diesen Code öffentlich. Bei GMs V8 – ob AFM oder DFM – arbeitet je Zylinder ein einziges Stößel-Ölmagnetventil für Ein- und Auslass; eine Leitung an Masse setzt dort den Einlass-Code P3451. Geprüft wird bei ausgeschalteter Low-Side-Endstufe auf unter 0,5 Ohm gegen Masse, 20 von 25 Messungen im 250-ms-Raster müssen scheitern (Type B). Beim Hemi von FCA landen durchgescheuerte MDS-Leitungen hinten am fahrerseitigen Zylinderkopf – dort liegt Zylinder 7 – unter P3449. Hat die Steuerleitung Masseschluss, zieht das Stellglied womöglich ohne Befehl an: Der Zylinder verliert seinen Ventilhub, obwohl weiter eingespritzt wird. P3453 meldet die Unterbrechung, P3456 den Plusschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: harness_chafed_to_ground
      likelihood: high
      label:
        en: Actuator wire chafed through against the cylinder head or a heat shield
        de: Stellglied-Leitung am Zylinderkopf oder Hitzeschild durchgescheuert
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Actuator coil shorted to its housing
        de: Spule des Stellglieds mit Schluss zum Gehäuse
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage in the engine control module damaged
        de: Endstufe im Motorsteuergerät beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
    - en: Rough running or misfire on cylinder 7 if the actuator pulls in unbidden
      de: Unruhiger Lauf oder Aussetzer an Zylinder 7, wenn das Stellglied ungewollt anzieht
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
