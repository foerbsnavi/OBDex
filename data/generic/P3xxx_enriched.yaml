- code: P34B5
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Range/Performance Bank 1
    de: Nockenwellenversteller B Temperaturfühler Bereich/Funktion Bank 1
  description:
    en: "P34B5 is the rationality check for the temperature reading of exhaust-side actuator B on bank 1: the circuit is intact, yet the value or its behaviour is not believable. CARB asks for such checks on VVT input sensors wherever feasible, ideally catching readings that are wrongly high as well as wrongly low. How a carmaker judges this reading is not public, and no maker publishes P34B5 at all. The intake twin P34A5 shows a likely pattern: Nissan traced cold-start alarms on the 2018 Pathfinder to module software and cured them with an update. The value matters because, in Aisin's patent, a board temperature above a release threshold for a set time moves the phaser off its end stop to cut holding current. Bank 2: P34B9."
    de: "P34B5 ist die Plausibilitätsprüfung für den Temperaturwert des Auslassverstellers B auf Bank 1: Der Kreis ist in Ordnung, Wert oder Verlauf wirken aber unglaubwürdig. CARB verlangt solche Prüfungen für Eingangsfühler der Ventilverstellung, soweit machbar, und zwar möglichst in beide Richtungen. Nach welchen Kriterien ein Hersteller hier urteilt, ist nicht veröffentlicht; P34B5 selbst dokumentiert keiner. Ein Hinweis kommt vom Einlass-Gegenstück P34A5: Nissan führte Fehlmeldungen nach Kaltstarts beim Pathfinder 2018 auf die Software des Steuergeräts zurück und behob sie per Update. Wichtig ist der Wert, weil Aisins Patent den Versteller von seinem Anschlag wegdreht, sobald die Platine eine Zeit lang über einer Schwelle liegt, damit der Haltestrom sinkt. Bank 2: P34B9."
  affected_components:
    - cam_actuator_b_temp_sensor_b1
  common_causes:
    - id: control_software
      likelihood: medium
      label:
        en: Module software judging the value wrongly (update available?)
        de: Steuergeräte-Software bewertet den Wert falsch (Update vorhanden?)
    - id: sensor_drift
      likelihood: medium
      label:
        en: Temperature sensor in the actuator drifting
        de: Temperaturfühler im Versteller driftet
    - id: loose_contact
      likelihood: low
      label:
        en: Loose contact shifting the reading
        de: Wackelkontakt verfälscht den Messwert
  symptoms:
