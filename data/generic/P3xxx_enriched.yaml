- code: P3401
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 1 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: "P3401 points to a broken control path to the solenoid that switches off cylinder 1, a cylinder that GM and Chrysler V8s and Ford's 1.5 l three-cylinder EcoBoost all deactivate. On the 2019 L84 and L86 V8s, GM looks at the low-side output while it is off: over 200 kilohm to ground counts as open, and 20 failures among 25 readings at 250 ms intervals make it a Type B fault. GM adds that some controllers store P3403 alongside. Ford's VDE monitor relies on the fault status of its smart driver and decides within 5 seconds. For the 5.7 l Hemi, a Chrysler STAR case describes a deformed manifold heat shield that rubs the MDS solenoid harness open. P3403 and P3404 cover shorts, P3402 the mechanical function. Deactivation is then locked out."
    de: "P3401 weist auf einen unterbrochenen Steuerweg zum Magnetventil hin, das Zylinder 1 abschaltet – diesen Zylinder legen die V8 von GM und Chrysler ebenso still wie Fords 1,5-l-Dreizylinder-EcoBoost. GM prüft bei den V8-Motoren L84 und L86 (2019) die Low-Side-Endstufe im ausgeschalteten Zustand: Mehr als 200 Kiloohm nach Masse gelten als Unterbrechung, 20 Fehler unter 25 Messungen im Abstand von 250 ms setzen einen Type-B-Code; manche Steuergeräte legen dabei zusätzlich P3403 ab. Ford entscheidet über den Fehlerstatus der Smart-Endstufe binnen 5 Sekunden. Beim 5,7-l-Hemi beschreibt ein STAR-Fall ein verbogenes Krümmer-Hitzeschild, das den Kabelbaum der MDS-Ventile durchscheuert. Kurzschlüsse sind P3403/P3404, die Mechanik P3402. Die Abschaltung bleibt gesperrt."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Control wire broken or worn through, e.g. by a hot exhaust heat shield
        de: Steuerleitung gerissen oder durchgescheuert, etwa am Abgas-Hitzeschild
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Loose, corroded or oil-soaked solenoid connector
        de: Lockerer, korrodierter oder verölter Stecker am Magnetventil
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 1 deactivation solenoid
        de: Unterbrochene Spule im Abschalt-Magnetventil von Zylinder 1
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty output stage in the engine control module
        de: Defekte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on, on GM after the second trip
      de: Motorkontrollleuchte an, bei GM nach der zweiten Fahrt
    - en: Engine stays in all-cylinder mode
      de: Motor bleibt im Vollzylinderbetrieb
    - en: Slightly higher fuel consumption
      de: Etwas höherer Kraftstoffverbrauch
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
