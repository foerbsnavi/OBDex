        de: Kabelbaum nahe der Frontscheibe hitzegeschädigt, Signal an Masse
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Sensor in the bank 2 CAMTRONIC actuator shorted
        de: Sensor im CAMTRONIC-Steller von Bank 2 kurzgeschlossen
    - id: engine_software
      likelihood: low
      label:
        en: Engine control software outdated
        de: Software des Motorsteuergeräts veraltet
  symptoms:
