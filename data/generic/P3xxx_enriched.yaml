- code: P3440
  category: powertrain
  title:
    en: Cylinder 5 Exhaust Valve Control Circuit High
    de: Zylinder 5 Auslassventil Steuerkreis hoch
  description:
    en: P3440 closes the cylinder 5 block and stands for a high signal, usually a short to supply voltage, in the circuit of a separate exhaust valve actuator. No manufacturer documents this code publicly. The code only makes sense on an engine with a separate exhaust actuator; a Ford patent, for example, checks via exhaust pressure whether an exhaust valve still opens after deactivation. Current production systems that deactivate cylinder 5 drive both valves from one solenoid, and GM reports a short to power there as P3436, checked with the driver on and a 0.5 ohm limit. If a dedicated exhaust channel did short high, the computer would stop using deactivation and light the lamp. Compare P3437, P3438 and P3439.
    de: P3440 schließt den Block von Zylinder 5 ab und steht für ein zu hohes Signal, meist einen Schluss nach Versorgungsspannung, im Kreis eines gesonderten Auslassventil-Stellglieds. Kein Hersteller dokumentiert diesen Code öffentlich. Sinn ergibt der Code nur bei einem eigenen Auslass-Stellglied; ein Ford-Patent etwa prüft am Abgasdruck, ob ein Auslassventil nach der Abschaltung noch öffnet. Heutige Serienmotoren, die Zylinder 5 abschalten, steuern beide Ventile über ein Magnetventil; GM meldet einen Plusschluss dort als P3436, geprüft bei eingeschalteter Endstufe mit einer Grenze von 0,5 Ohm. Hätte ein eigener Auslasskanal Plusschluss, würde das Steuergerät die Abschaltung sperren und die Lampe einschalten. Vergleiche P3437, P3438 und P3439.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator control wire shorted to voltage
        de: Steuerleitung des Auslass-Stellglieds mit Plus verbunden
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted actuator coil
        de: Windungsschluss in der Stellglied-Spule
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation unavailable
      de: Zylinderabschaltung nicht verfügbar
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
