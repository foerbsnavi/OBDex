- code: P34BE
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit Low Bank 1
    de: Nockenwellenversteller B Positionssensor A Stromkreis zu niedrig Bank 1
  description:
    en: "For P34BE, too, a Mercedes-Benz text exists: the CAMTRONIC bulletin covering the M176 and M177 eight-cylinders reads P34BE00 as the signal of exhaust solenoid 1, bank 1, being grounded. That fits the generic meaning, a signal under its lower limit. Mercedes points to the engine cover and the wiring routed over the bulkhead, close to the windshield, where heat damage was found; harness damage is to be reported with photos and a lambda graph test. Beyond the wiring, the remedy includes fitting the latest CAMTRONIC actuators and updating the engine software. Once the feedback is lost the system can enter limp-home (P164B), and the exhaust cam profile of that bank stays fixed. High on bank 1: P34BF; low on bank 2: P34C2."
    de: "Auch zu P34BE gibt es einen Mercedes-Text: Das CAMTRONIC-Bulletin zu den Achtzylindern M176 und M177 beschreibt P34BE00 als Masseschluss im Sensorsignal von Auslass-Steller 1, Bank 1. Das deckt sich mit der allgemeinen Bedeutung, einem Signal unter der Untergrenze. Mercedes verweist auf Motorabdeckung und Kabelbaum über der Stirnwand nahe der Frontscheibe, wo Hitzeschäden auftraten; beschädigte Leitungen sind mit Fotos und einem Lambda-Diagramm zu melden. Neben der Verkabelung gehören neuere Teilenummern der CAMTRONIC-Steller und ein Software-Update zur Abhilfe. Fehlt die Rückmeldung, kann das System in den Notlauf gehen (P164B), und das Auslass-Nockenprofil dieser Bank bleibt fest. Zu hoch auf Bank 1: P34BF, zu niedrig auf Bank 2: P34C2."
  affected_components:
    - cam_actuator_b_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: harness_heat_short
      likelihood: high
      label:
        en: Heat-damaged harness above the bulkhead, signal shorted to ground
        de: Hitzegeschädigter Kabelbaum über der Stirnwand, Signal an Masse
    - id: actuator_internal
