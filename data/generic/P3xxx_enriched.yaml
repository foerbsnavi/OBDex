    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US20070240659A1/en
  reviewed: '2026-11-06'

- code: P3425
  category: powertrain
  title:
    en: Cylinder 4 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 4 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: Cylinder 4 is one of the four cylinders that classic V8 cylinder deactivation shuts off, together with 1, 6 and 7, both at GM (Active Fuel Management) and on the Chrysler 5.7 L Hemi with MDS. That makes P3425 one of the best documented codes in this range. GM's 2019 tables for the L84 and L86 flag an open when the off-state output shows more than 200 kohm, 20 of 25 samples, Type B. Chrysler lists it as Cylinder 4 Deactivation Control Circuit; a STAR case describes the driver-side exhaust manifold heat shield wearing through the solenoid harness and asks for at least 15 mm clearance. P3427 and P3428 cover shorts on the same circuit.
    de: Zylinder 4 gehört bei der klassischen V8-Abschaltung zu den vier stillgelegten Zylindern, zusammen mit 1, 6 und 7 – bei GM (Active Fuel Management) ebenso wie beim Chrysler 5,7-l-Hemi mit MDS. Damit ist P3425 einer der am besten belegten Codes dieses Bereichs. GMs Tabellen 2019 für L84 und L86 melden eine Unterbrechung, wenn der Ausgang im ausgeschalteten Zustand mehr als 200 kOhm zeigt, 20 von 25 Messungen, Type B. Chrysler führt ihn als Abschalt-Steuerkreis Zylinder 4; ein STAR-Fall beschreibt, wie das Hitzeschild des fahrerseitigen Abgaskrümmers den Kabelbaum der Magnetventile durchscheuert, und verlangt mindestens 15 mm Abstand. P3427 und P3428 decken Schlüsse im selben Kreis ab.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: harness_heat_shield_chafe
      likelihood: high
      label:
        en: Solenoid harness chafed through by the exhaust manifold heat shield (5.7 L Hemi)
        de: Kabelbaum der Magnetventile vom Krümmer-Hitzeschild durchgescheuert (5,7-l-Hemi)
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 4 deactivation solenoid
        de: Unterbrochene Spule im Abschalt-Magnetventil von Zylinder 4
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose solenoid connector
        de: Korrodierter oder lockerer Stecker am Magnetventil
    - id: pcm_software
      likelihood: low
      label:
        en: Control module software needing an update (Chrysler TSB 18-002-25)
        de: Steuergeräte-Software mit Update-Bedarf (Chrysler TSB 18-002-25)
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays in eight-cylinder mode
      de: Motor bleibt im Achtzylinderbetrieb
    - en: Further circuit codes for cylinders 1, 6 and 7 if the shared harness is damaged
      de: Weitere Kreiscodes für Zylinder 1, 6 und 7, wenn der gemeinsame Kabelbaum beschädigt ist
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
