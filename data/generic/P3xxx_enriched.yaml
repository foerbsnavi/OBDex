- code: P3484
  category: powertrain
  title:
    en: Cylinder 11 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 11 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: P3484 signals that the control circuit of the cylinder 11 deactivation or intake valve actuator is too high, for example because its wire is shorted to a battery feed and the module detects it when switching the output on. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Twelve-cylinder engines that shut down cylinders, notably the Bentley W12 in Bentayga and Continental GT and the Lamborghini Aventador V12, describe their systems as switching off a whole bank, with Bentley stating that the valves keep moving. P3484 thus fits only a design with a dedicated valve actuator at cylinder 11. The control module will normally cancel deactivation and run on all cylinders. P3481 and P3483 are the remaining electrical faults.
    de: P3484 signalisiert einen zu hohen Pegel im Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 11, etwa weil die Leitung Schluss zu einer Batterieleitung hat und das Steuergerät das beim Einschalten des Ausgangs bemerkt. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zwölfzylinder mit Abschaltung wie Bentleys W12 in Bentayga und Continental GT oder der V12 des Lamborghini Aventador beschreiben ihre Systeme als Abschaltung einer ganzen Bank; Bentley betont, dass die Ventile in Bewegung bleiben. P3484 passt also nur zu einer Konstruktion mit eigenem Ventil-Stellglied an Zylinder 11. Das Steuergerät bricht die Abschaltung dann meist ab und fährt mit allen Zylindern. Die übrigen elektrischen Fehler sind P3481 und P3483.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
