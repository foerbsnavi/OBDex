- code: P341C
  category: powertrain
  title:
    en: Deactivation/Exhaust Valve Control Circuit Performance Bank 1
    de: Abschaltung/Auslassventil Steuerkreis Funktion Bank 1
  description:
    en: "P341C covers exhaust valves on bank 1 that ignore a deactivation command while their wiring and actuator coil check out. No manufacturer documents this code publicly. A Ford patent explains why it matters and how to spot it: a sealed cylinder whose exhaust valve keeps lifting leaves a trace in exhaust pressure, and the controller can respond by reactivating the cylinder, blocking further deactivation and storing a fault. Production engines control both valve sets per cylinder jointly, so GM, for instance, files such faults under its own per-cylinder codes from P3498. Electrically this circuit reports P340C; intake function on bank 1 is P341A, bank 2 exhaust P341D."
    de: "P341C erfasst Auslassventile auf Bank 1, die einem Abschaltbefehl nicht folgen, obwohl ihr Steuerkreis elektrisch einwandfrei ist. Kein Hersteller dokumentiert den Code öffentlich. Warum das zählt und wie man es bemerkt, zeigt ein Ford-Patent: Öffnet an einem eigentlich verschlossenen Zylinder das Auslassventil weiter, zeichnet sich das im Abgasdruck ab; das Steuergerät kann den Zylinder dann wieder zuschalten, weitere Abschaltungen sperren und einen Fehler speichern. Bekannte Motoren schalten beide Ventile eines Zylinders gemeinsam, GM etwa legt solche Fehler unter eigenen Zylindercodes ab P3498 ab. Elektrisch gehört zu diesem Kreis P340C, die Funktion der Einlassseite ist P341A, Bank 2 P341D."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust-side lifter or rocker on bank 1 not switching
        de: Auslassseitiger Stößel oder Kipphebel auf Bank 1 schaltet nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low oil pressure or foaming oil
        de: Zu wenig Öldruck oder aufgeschäumtes Öl
    - id: actuator_sticking
      likelihood: low
      label:
        en: Bank 1 exhaust deactivation actuator sticking
        de: Auslass-Abschaltstellglied von Bank 1 klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Popping or uneven exhaust note in reduced-cylinder mode
      de: Unruhiger Abgasklang im Teilzylinderbetrieb
    - en: Deactivation suspended
      de: Abschaltung ausgesetzt
