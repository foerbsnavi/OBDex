- code: P3483
  category: powertrain
  title:
    en: Cylinder 11 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 11 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3483 is stored for a low signal on the control circuit of the cylinder 11 deactivation or intake valve actuator, in practice a short to ground. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Cylinder 11 exists only on twelve-cylinder engines; among those with shut-off are Bentley's W12, Lamborghini's Aventador V12 and, historically, Mercedes' M137. GM's analogous V8 test treats under 0.5 ohm to ground with the driver off as a fault once 20 of 25 samples agree, with the enable conditions of 11 V system voltage and 425 rpm. A grounded line can energise the actuator continuously and take cylinder 11 out at the wrong time. Siblings: P3481 (open) and P3484 (high)."
    de: "P3483 wird für ein zu niedriges Signal im Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 11 gespeichert, praktisch also einen Masseschluss. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zylinder 11 gibt es nur bei Zwölfzylindern; Abschaltung haben etwa Bentleys W12, der V12 des Lamborghini Aventador und früher der M137 von Mercedes. GMs entsprechender V8-Test wertet unter 0,5 Ohm gegen Masse bei abgeschaltetem Treiber als Fehler, sobald 20 von 25 Proben übereinstimmen; Freigabe ab 11 V Bordspannung und 425 U/min. Eine Leitung an Masse kann das Stellglied dauerhaft bestromen und Zylinder 11 zur falschen Zeit stilllegen. Geschwister: P3481 (offen) und P3484 (hoch)."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 11 control line shorted to ground
        de: Steuerleitung von Zylinder 11 mit Masseschluss
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Cylinder 11 actuator shorted internally
        de: Stellglied von Zylinder 11 mit innerem Schluss
    - id: connector_water
      likelihood: low
      label:
        en: Moisture at the actuator connector
        de: Feuchtigkeit am Stecker des Stellglieds
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output faulty
        de: Ausgang des Motorsteuergeräts fehlerhaft
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off disabled
      de: Zylinderabschaltung abgeschaltet
    - en: Possible misfire on cylinder 11
      de: Mögliche Fehlzündungen auf Zylinder 11
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
