- code: P34A5
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Range/Performance Bank 1
    de: Nockenwellenversteller A Temperaturfühler Bereich/Funktion Bank 1
  description:
    en: "P34A5 means the temperature reported for intake cam actuator A on bank 1 passes the electrical checks yet makes no sense. Nissan describes the code for the 2018 Pathfinder (R52) and the Infiniti QX60 built before 18 December 2017: the MIL came on after starts at ambient temperatures around or below 0 °C. The remedy in bulletin NTB18-016 was a new electric intake valve timing control module with updated software, followed by a position learning run for the actuator; the revised bulletin NTB18-016a hands this over to the reprogramming campaign NTB18-072. Timing codes such as P0011 must be fixed before this one. Away from that software case, look for a drifting sensor or a loose contact. Drivers usually notice nothing. Bank 2 is P34A9."
    de: "Bei P34A5 ist der Temperaturwert des Einlassverstellers A (Bank 1) elektrisch gültig, passt aber nicht ins Bild. Nissan belegt den Code für Pathfinder (R52) und Infiniti QX60 des Modelljahres 2018, gebaut vor dem 18. Dezember 2017: Nach Starts bei Außentemperaturen um oder unter 0 °C ging die Motorkontrollleuchte an. Bulletin NTB18-016 ließ das Steuergerät der elektrischen Einlass-Ventilsteuerung gegen eines mit neuer Software tauschen und danach die Lage des Stellers anlernen; die Neufassung NTB18-016a verweist stattdessen auf die Umprogrammier-Aktion NTB18-072. Andere Verstellcodes wie P0011 sind vorher zu klären. Außerhalb dieses Softwarefalls kommen ein driftender Fühler oder ein Wackelkontakt infrage. Fahrer merken meist nichts. Bank 2 meldet P34A9."
  affected_components:
    - cam_actuator_a_temp_sensor_b1
  common_causes:
    - id: module_software
      likelihood: high
      label:
        en: "Software of the electric valve timing module (Nissan 2018: cold-start false alarm)"
        de: "Software des Steuergeräts der elektrischen Ventilsteuerung (Nissan 2018: Fehlalarm beim Kaltstart)"
    - id: sensor_drift
      likelihood: medium
      label:
        en: Temperature sensor drifting out of its expected range
        de: Temperaturfühler driftet aus seinem erwarteten Bereich
    - id: intermittent_contact
      likelihood: low
      label:
        en: Intermittent contact at the actuator plug
        de: Wackelkontakt am Stecker des Verstellers
  symptoms:
    - en: Check engine light on, often after a cold start
      de: Motorkontrollleuchte an, oft nach einem Kaltstart
    - en: Usually no driveability complaint
      de: Meist keine Auffälligkeit im Fahrverhalten
