- code: P3456
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Circuit High
    de: Zylinder 7 Auslassventil Steuerkreis hoch
  description:
    en: P3456 would flag a cylinder 7 exhaust valve actuator whose control line is shorted to supply voltage. No manufacturer documents this code publicly. According to NHTSA's summary of the DFM system, GM drives its deactivation solenoids with peak-and-hold current drivers for fast, repeatable switching, and one solenoid serves both valves of the cylinder, so a short to power is caught under the intake-side code P3452 instead (below 0.5 ohm to power with the driver on, 20 of 25 samples, Type B). CARB requires such a check for any emission-relevant output, which is why the exhaust code exists at all. A short to ground on the same channel is P3455, an open circuit P3453, a mechanical fault P3454.
    de: P3456 meldete ein Auslassventil-Stellglied an Zylinder 7, dessen Steuerleitung Schluss nach Versorgungsspannung hat. Kein Hersteller dokumentiert diesen Code öffentlich. Laut der NHTSA-Zusammenfassung des DFM-Systems steuert GM seine Abschaltventile mit Peak-and-Hold-Stromtreibern für schnelles, gleichmäßiges Schalten an, und ein Ventil bedient beide Ventile des Zylinders. Ein Plusschluss fällt deshalb unter den Einlass-Code P3452 (unter 0,5 Ohm zur Versorgung bei eingeschalteter Endstufe, 20 von 25 Proben, Type B). CARB verlangt eine solche Prüfung für jeden abgasrelevanten Ausgang – deshalb gibt es den Auslass-Code überhaupt. Masseschluss desselben Kanals ist P3455, Unterbrechung P3453, ein mechanischer Fehler P3454.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Actuator wire of cylinder 7 shorted to battery voltage
        de: Stellglied-Leitung von Zylinder 7 mit Batteriespannung verbunden
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Exhaust actuator coil with shorted turns
        de: Spule des Auslass-Stellglieds mit Windungsschluss
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Current driver in the control module failed
        de: Stromtreiber im Steuergerät ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine does not enter reduced-cylinder mode
      de: Motor geht nicht in den Teilzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3453, P3454, P3455, P3452, P3400]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
  reviewed: '2026-11-02'

- code: P3457
  category: powertrain
  title:
    en: Cylinder 8 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 8 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: "Cylinder 8 is not among the cylinders that classic Active Fuel Management or Chrysler's MDS shut off (both use 1, 4, 6 and 7), so P3457 is documented only for newer designs. GM's 2019 tables list it for the L84 with Dynamic Fuel Management, which can deactivate every cylinder: more than 200 kohm with the low-side driver off, 20 of 25 samples every 250 ms from 425 rpm, Type B. GM's AFM/DFM information bulletin adds that the LTA and LT2 engines deactivate cylinders 2, 3, 5 and 8. GM also notes that some controllers store P3459 together with an open. P3458 is the function code for cylinder 8, P3459 and P3460 the short-circuit codes."
    de: "Zylinder 8 gehört nicht zu den Zylindern, die das klassische Active Fuel Management oder Chryslers MDS stilllegen (beide nutzen 1, 4, 6 und 7). P3457 ist deshalb nur für neuere Bauarten belegt. GMs Tabellen 2019 führen ihn für den L84 mit Dynamic Fuel Management, der jeden Zylinder abschalten kann: mehr als 200 kOhm bei ausgeschalteter Low-Side-Endstufe, 20 von 25 Proben im 250-ms-Takt ab 425 U/min, Type B. GMs Informations-Bulletin zu AFM und DFM ergänzt, dass die Motoren LTA und LT2 die Zylinder 2, 3, 5 und 8 abschalten. Laut GM speichern manche Steuergeräte bei einer Unterbrechung zusätzlich P3459. P3458 ist der Funktionscode für Zylinder 8, P3459 und P3460 die Schlusscodes."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Wire to the cylinder 8 solenoid broken or chafed in the lifter valley harness
        de: Leitung zum Magnetventil von Zylinder 8 im Kabelbaum unter dem Ansaugkrümmer gebrochen oder durchgescheuert
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open winding in the cylinder 8 solenoid
        de: Unterbrochene Wicklung im Magnetventil von Zylinder 8
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Poor contact at the solenoid connector
        de: Schlechter Kontakt am Ventilstecker
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage faulty
        de: Endstufe des Motorsteuergeräts defekt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Dynamic cylinder deactivation inhibited
      de: Dynamische Zylinderabschaltung gesperrt
    - en: P3459 may be stored alongside on some GM controllers
      de: Bei manchen GM-Steuergeräten zusätzlich P3459 gespeichert
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
