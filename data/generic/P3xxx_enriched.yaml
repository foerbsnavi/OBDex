        de: Unterbrochene oder kurzgeschlossene Leitung im Kreis des Auslass-Stellglieds von Bank 1
    - id: actuator_coil_fault
      likelihood: medium
      label:
        en: Exhaust deactivation actuator coil open or shorted
        de: Spule des Auslass-Abschaltstellglieds unterbrochen oder kurzgeschlossen
    - id: connector_heat_damage
      likelihood: low
      label:
        en: Connector or wiring damaged by heat near the exhaust side
        de: Stecker oder Leitung durch Hitze an der Auslassseite beschädigt
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
