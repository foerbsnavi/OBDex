  reviewed: '2026-11-06'

- code: P3427
  category: powertrain
  title:
    en: Cylinder 4 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 4 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3427 is set when the cylinder 4 deactivation solenoid circuit has a path to ground. GM uses it on several 2019 V8s: the DFM engine L84, the AFM engine L86 and the LT4 of the Corvette. Once the low-side output is switched off, less than half an ohm toward ground fails the check; 20 of 25 samples, relay voltage at least 11 V, 425 rpm (L84) or 400 rpm (L86, LT4), Type B. In all three tables the criteria column names cylinder 1, an apparent copy slip. For the MDS-equipped Hemi from Chrysler, one STAR case documents an exhaust manifold shield that rubs the solenoid harness open; a bared wire touching metal there can end up as this kind of short. P3428 covers the opposite short, to battery voltage."
    de: "P3427 wird gesetzt, wenn der Kreis des Abschalt-Magnetventils von Zylinder 4 einen Weg nach Masse hat. GM nutzt ihn bei mehreren V8 des Jahrgangs 2019: DFM-Motor L84, AFM-Motor L86 und LT4 der Corvette. Bei ausgeschaltetem Low-Side-Ausgang fällt jeder Massewiderstand unter einem halben Ohm durch die Prüfung; 20 von 25 Proben, Relaisspannung mindestens 11 V, 425 U/min (L84) bzw. 400 U/min (L86, LT4), Type B. In allen drei Tabellen nennt die Spalte mit den Fehlerkriterien Zylinder 1 – offenbar ein Kopierfehler. Für Chryslers Hemi mit MDS dokumentiert ein STAR-Fall ein Krümmer-Hitzeschild, das den Ventil-Kabelbaum aufreibt; berührt eine blanke Ader dort Metall, kann genau so ein Schluss entstehen. P3428 ist der Plusschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Control wire to the cylinder 4 solenoid rubbed through to ground, e.g. by a heat shield
        de: Steuerleitung zum Ventil von Zylinder 4 bis auf Masse durchgescheuert, etwa am Hitzeschild
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Cylinder 4 solenoid shorted internally
        de: Ventil von Zylinder 4 mit innerem Schluss
    - id: connector_water
      likelihood: low
      label:
        en: Moisture or oil in the solenoid connector
        de: Feuchtigkeit oder Öl im Ventilstecker
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Damaged driver in the engine control module
        de: Beschädigter Treiber im Motorsteuergerät
  symptoms:
    - en: Check engine lamp after two drives
      de: Motorkontrollleuchte nach zwei Fahrten
    - en: V4 or reduced mode never engages
      de: V4- bzw. Sparbetrieb schaltet nie zu
    - en: Further circuit codes on other deactivating cylinders if the harness is damaged
      de: Weitere Kreiscodes anderer abschaltbarer Zylinder bei beschädigtem Kabelbaum
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
