- code: P3494
  category: powertrain
  title:
    en: Cylinder 12 Exhaust Valve Control Performance
    de: Zylinder 12 Auslassventil Steuerung Funktion
  description:
    en: "P3494 is set when the exhaust valve of cylinder 12 does not follow its command although the actuator circuit is electrically intact. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Valve-based shut-off traps a charge in the cylinder; if the exhaust valve keeps opening, that cushion leaks away, which a Ford patent proposes to detect through exhaust pressure, and if it sticks shut on reactivation, compressed gas loads the valve train. The Aventador V12 and Bentley W12 sidestep this by bank shut-off without published valve switching, and for the Mercedes M137 with its hydraulic solenoid pack no public code assignment is known. Electrical faults of this actuator: P3493, P3495, P3496; intake function: P3490."
    de: "P3494 wird gesetzt, wenn das Auslassventil von Zylinder 12 seinem Befehl nicht folgt, obwohl der Kreis des Stellglieds elektrisch intakt ist. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bei Ventilabschaltung bleibt eine Ladung im Zylinder eingeschlossen. Öffnet das Auslassventil weiter, entweicht dieses Polster, was ein Ford-Patent über den Abgasdruck erkennen will; klemmt es beim Zuschalten geschlossen, belastet verdichtetes Gas den Ventiltrieb. Aventador-V12 und Bentley-W12 schalten Bänke ohne veröffentlichte Ventilschaltung. Für den M137 von Mercedes mit seinem hydraulischen Magnetventilblock ist keine öffentliche Codezuordnung bekannt. Elektrische Fehler dieses Stellglieds: P3493, P3495, P3496; Einlassfunktion: P3490."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust switching element at cylinder 12 sticking
        de: Schaltelement am Auslass von Zylinder 12 klemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure or quality insufficient for the exhaust switch
        de: Öldruck oder Ölqualität für die Auslassumschaltung ungenügend
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator sluggish
        de: Auslass-Stellglied träge
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Jolt or knock on reactivation of cylinder 12
      de: Ruck oder Schlag beim Zuschalten von Zylinder 12
    - en: Misfire on cylinder 12 (P0312)
      de: Fehlzündungen auf Zylinder 12 (P0312)
  repair:
    difficulty: hard
    diy_possible: false
