- code: P34AD
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Range/Performance Bank 1
    de: Nockenwellenversteller A Positionssensor A Bereich/Funktion Bank 1
  description:
    en: "P34AD covers a plausibility fault: the position sensor A signal from the intake actuator on bank 1 is electrically present but does not agree with what else the module knows. On the 2022 Mitsubishi Outlander, which turns its intake phaser electrically, the control module checks the motor position against the phase seen by the intake camshaft sensor and logs P34AD when the two disagree; wiring faults and the actuator are given as causes. In practice a worn or slipping actuator, a position that was not relearned after repairs or a disturbed cam signal come first; Nissan, which uses the same kind of electric intake valve timing, requires a position learning run after module replacement. The phaser then stays at its base angle."
    de: "P34AD ist ein Plausibilitätsfehler: Das Signal von Positionssensor A des Einlassverstellers auf Bank 1 ist elektrisch vorhanden, stimmt aber nicht mit den übrigen Informationen des Steuergeräts überein. Beim Mitsubishi Outlander 2022, der seinen Einlassversteller elektrisch dreht, vergleicht das Steuergerät die Lage des Stellmotors mit der Phase, die der Einlass-Nockenwellensensor liefert, und speichert P34AD bei Widerspruch; als Ursachen nennt es Leitungsfehler und den Steller. Praktisch stehen ein verschlissener oder durchrutschender Steller, eine nach Reparaturen nicht neu angelernte Lage oder ein gestörtes Nockenwellensignal vorn; Nissan verlangt bei seiner gleichartigen elektrischen Einlass-Ventilsteuerung nach einem Steuergerätetausch das Anlernen der Stellerlage. Der Versteller bleibt dann in Grundstellung."
  affected_components:
    - cam_actuator_a_pos_sensor_b1
  common_causes:
    - id: actuator_worn
      likelihood: high
      label:
        en: Electric actuator worn, sticking or slipping
        de: Elektrischer Steller verschlissen, schwergängig oder durchrutschend
    - id: not_learned
      likelihood: medium
      label:
        en: Actuator position not relearned after repair
        de: Stellerlage nach Reparatur nicht neu angelernt
    - id: cam_signal
      likelihood: medium
      label:
        en: Intake camshaft sensor signal or timing drive disturbed
        de: Signal des Einlass-Nockenwellensensors oder Steuertrieb gestört
    - id: intermittent_wiring
      likelihood: low
      label:
        en: Intermittent wiring fault
        de: Sporadischer Leitungsfehler
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake cam timing fixed, weaker response at low revs
      de: Einlass-Steuerzeit fest, schwächeres Ansprechen untenherum
    - en: Possibly accompanying timing codes such as P0011
      de: Ggf. begleitende Verstellcodes wie P0011
