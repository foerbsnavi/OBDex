- code: P3411
  category: powertrain
  title:
    en: Cylinder 2 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 2 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3411 means the control output for the cylinder 2 deactivation valve sees a short to ground. GM lists it for the L84 V8 (2019), whose Dynamic Fuel Management can switch off any cylinder: below 0.5 ohm to ground with the low-side driver off, 20 failures in 25 samples every 250 ms, at least 11 V on the powertrain relay and 425 rpm. It is a Type B fault, so the lamp lights after two trips in a row. GM notes that some controllers set P3409 together with it. On engines where cylinder 2 cannot be deactivated the code has no use. The fix is usually in the wiring or the solenoid in the engine valley; P3412 is the short to power."
    de: "P3411 bedeutet, dass der Steuerausgang für das Abschaltventil von Zylinder 2 einen Masseschluss sieht. GM führt den Code beim V8 L84 (2019), dessen Dynamic Fuel Management jeden Zylinder abschalten kann: weniger als 0,5 Ohm nach Masse bei ausgeschalteter Low-Side-Endstufe, 20 Fehler in 25 Messungen alle 250 ms, mindestens 11 V am Powertrain-Relais und 425 U/min. Als Type-B-Fehler geht die Lampe nach zwei aufeinanderfolgenden Fahrten an. Laut GM setzen manche Steuergeräte dabei zusätzlich P3409. Wo Zylinder 2 nicht abschaltbar ist, kommt der Code nicht vor. Ursache liegt meist in der Leitung oder im Magnetventil im Motor-V; P3412 ist der Plusschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Damaged insulation lets the control wire touch ground
        de: Beschädigte Isolierung, Steuerleitung berührt Masse
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Cylinder 2 solenoid shorted internally
        de: Magnetventil von Zylinder 2 innen kurzgeschlossen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty engine control module driver
        de: Defekte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp after two trips
      de: Motorkontrollleuchte nach zwei Fahrten
    - en: Dynamic Fuel Management inactive, engine stays on all cylinders
      de: Dynamic Fuel Management inaktiv, Motor bleibt auf allen Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
