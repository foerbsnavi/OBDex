        de: MDS-Kabelbaum hinten am fahrerseitigen Zylinderkopf vom Krümmer-Hitzeschild durchgescheuert (5,7-l-Hemi)
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Cylinder 7 solenoid coil open
        de: Spule des Magnetventils von Zylinder 7 unterbrochen
