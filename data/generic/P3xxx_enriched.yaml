- code: P3424
  category: powertrain
  title:
    en: Cylinder 3 Exhaust Valve Control Circuit High
    de: Zylinder 3 Auslassventil Steuerkreis hoch
  description:
    en: "P3424 closes the cylinder 3 block and stands for an exhaust actuator control line that is held at supply voltage. No manufacturer documents this code publicly. The L84 from GM shows how far one shared solenoid can be monitored without it: for cylinder 3 the ECM checks a low-side driver under P3417, P3419 and P3420 and a high-side driver under extra codes of its own, yet none of them is exhaust-only. A GM patent application explains why: one hydraulic switching valve per cylinder pair serves intake and exhaust, the order being set by the cam lobes. The nearest documented test is the one behind P3420, in which a supply connection of less than half an ohm, seen with the output active, is judged a short. A driver would notice only the lamp."
    de: "P3424 ist der Schlusspunkt für Zylinder 3 und steht für eine Steuerleitung eines Auslass-Stellglieds, die auf Versorgungsspannung liegt. Kein Hersteller dokumentiert diesen Code öffentlich. Am L84 von GM sieht man, wie weit sich ein gemeinsames Ventil auch ohne ihn überwachen lässt: Für Zylinder 3 prüft das Steuergerät einen Low-Side-Treiber unter P3417, P3419 und P3420 und einen High-Side-Treiber unter weiteren eigenen Codes – keiner davon betrifft nur den Auslass. Eine GM-Patentanmeldung erklärt den Grund: Ein hydraulisches Schaltventil je Zylinderpaar bedient Ein- und Auslass, die Reihenfolge legen die Nocken fest. Die nächstliegende dokumentierte Prüfung ist die hinter P3420, bei der eine Verbindung zur Versorgung unter einem halben Ohm bei aktivem Ausgang als Schluss gilt. Bemerkbar wäre nur die Leuchte."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire chafed against a supply line
        de: Leitung des Auslass-Stellglieds an einer Versorgungsleitung durchgescheuert
    - id: actuator_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the exhaust actuator of cylinder 3
        de: Windungsschluss im Auslass-Stellglied von Zylinder 3
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output fault
        de: Ausgangsfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs on all cylinders permanently
      de: Motor läuft dauerhaft auf allen Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
