- code: P3453
  category: powertrain
  title:
    en: Cylinder 7 Exhaust Valve Control Circuit/Open
    de: Zylinder 7 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: "P3453 is the code SAE assigns to an open circuit in a dedicated exhaust valve actuator for cylinder 7. No manufacturer documents this code publicly. GM's description of Dynamic Fuel Management, published by NHTSA, shows how exhaust control works without such an actuator: the same oil signal unlocks the intake lifter at once, while the exhaust lifter waits until the valve spring load drops on the base circle of the cam. Separate wiring exists only in designs with an extra exhaust actuator, and CARB would require its continuity to be monitored. Actual cylinder 7 circuit faults on GM and Chrysler V8s show up as P3449 instead. P3454 to P3456 are the other exhaust codes; P3455 is the short to ground."
    de: "P3453 ist der Code, den SAE einer Unterbrechung im Kreis eines eigenen Auslassventil-Stellglieds an Zylinder 7 zuweist. Kein Hersteller dokumentiert diesen Code öffentlich. GMs von der NHTSA veröffentlichte Beschreibung des Dynamic Fuel Management zeigt, wie die Auslassseite ohne solches Stellglied geschaltet wird: Dasselbe Ölsignal entriegelt den Einlassstößel sofort, während der Auslassstößel wartet, bis die Ventilfeder auf dem Grundkreis der Nocke entlastet ist. Eigene Leitungen gibt es nur bei Bauarten mit zusätzlichem Auslass-Stellglied, deren Durchgang CARB überwachen ließe. Echte Kreisfehler an Zylinder 7 von GM- und Chrysler-V8 erscheinen dagegen als P3449. P3454 bis P3456 sind die übrigen Auslasscodes, P3455 der Masseschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Interrupted wire to the cylinder 7 exhaust actuator
        de: Unterbrochene Leitung zum Auslass-Stellglied von Zylinder 7
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Burnt-out actuator coil
        de: Durchgebrannte Spule des Stellglieds
    - id: connector_corrosion
      likelihood: low
      label:
        en: Corroded actuator connector
        de: Korrodierter Stecker am Stellglied
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation locked out
      de: Zylinderabschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3454, P3455, P3456, P3449, P3400]
  sources:
