- code: P3497
  category: powertrain
  title:
    en: Cylinder Deactivation System Bank 2
    de: Zylinderabschaltsystem Bank 2
  description:
    en: "P3497 is the bank 2 counterpart of P3400: the control unit concludes that deactivation on the bank that lacks cylinder 1 is failing as a whole, and it blames no single cylinder circuit. Honda's VCM V6 links it to rocker arm oil pressure switch C (P3400 belongs to switch B); bulletin 13-055 for the 2013 Odyssey and Pilot shows both codes after cold starts with oil pressure above 92 psi, which moved the spool valves and cut cylinders the ECU had not selected. The fix there was a new relief valve spring. Ram lists P3497 for the 2023 5.7 l Hemi eTorque and cures it with PCM software (18-002-25). Expect a warning lamp, misfire codes and rough running during warm-up."
    de: "P3497 ist das Gegenstück zu P3400 für Bank 2, also die Zylinderreihe ohne Zylinder 1: Das Steuergerät stellt fest, dass die Abschaltung dort insgesamt nicht wie befohlen arbeitet, ohne einen Einzelkreis zu benennen. Honda ordnet den Code beim VCM-V6 dem Öldruckschalter C der Kipphebel zu, P3400 dem Schalter B. Laut Bulletin 13-055 (Odyssey und Pilot 2013) entstanden beide nach Kaltstarts mit über 92 psi Öldruck: Die Schieberventile schalteten, und Zylinder fielen ungewollt aus. Abhilfe war eine neue Feder des Überdruckventils. Ram nennt P3497 beim 5,7-l-Hemi eTorque 2023 und behebt ihn per PCM-Software (18-002-25). Typisch sind Warnleuchte, Fehlzündungen und unrunder Warmlauf."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - oil_control_valve
    - oil_pressure_switch
  common_causes:
    - id: oil_pressure_too_high_cold
      likelihood: medium
      label:
        en: Excess oil pressure on cold start, e.g. weak relief valve spring
        de: Zu hoher Öldruck beim Kaltstart, etwa durch schwache Überdruckventilfeder
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Low oil level, wrong grade or overdue oil change on bank 2
        de: Zu wenig Öl, falsche Sorte oder überfälliger Ölwechsel
    - id: switching_element_failed
      likelihood: medium
      label:
        en: Switchable rocker arm or lifter on bank 2 sticking or not latching
        de: Schaltbarer Kipphebel oder Stößel auf Bank 2 klemmt oder rastet nicht
    - id: oil_pressure_switch_faulty
      likelihood: low
      label:
        en: Rocker arm oil pressure switch of bank 2 reporting wrongly
        de: Öldruckschalter der Kipphebel auf Bank 2 meldet falsch
    - id: ecm_software
      likelihood: low
      label:
        en: Engine control software needing an update
        de: Motorsteuergeräte-Software, die ein Update braucht
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire codes on bank 2 cylinders, mostly after a cold start
      de: Fehlzündungscodes auf Zylindern der Bank 2, meist nach Kaltstart
    - en: Rough idle while the engine warms up
      de: Unruhiger Leerlauf während der Warmlaufphase
    - en: Reduced-cylinder mode no longer used, higher fuel use
      de: Teilzylinderbetrieb entfällt, höherer Verbrauch
