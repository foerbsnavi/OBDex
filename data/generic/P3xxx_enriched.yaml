        de: Steuerleitung von Zylinder 11 berührt Batteriespannung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Cylinder 11 actuator coil with shorted turns
        de: Spule des Stellglieds von Zylinder 11 mit Windungsschluss
    - id: ecm_driver_fault
      likelihood: low
      label:
