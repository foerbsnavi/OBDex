- code: P34A2
  category: powertrain
  title:
    en: Cylinder 11 Deactivation/Intake Valve Performance
    de: Zylinder 11 Abschaltung/Einlassventil Funktion
  description:
    en: "P34A2 names a mechanical deactivation fault on cylinder 11: the valves continued to operate although the cylinder had been switched off. No manufacturer documents this code publicly. The nearest production example is the Active Cylinder Control that Mercedes fitted to the 5.8 l V12 of the CL 600 and S 600 from 2001; it idled one bank and uncoupled its exhaust valves by means of two solenoids; a stuck switching element there would produce exactly the fault this code describes. For eight-cylinder engines GM uses P3498 to P349F, judged by manifold pressure and stored as Type B after 22 failures in 25 checks. P3482 is the control-performance code for cylinder 11, and a misfire there would be P0311."
    de: "P34A2 benennt einen mechanischen Abschaltfehler an Zylinder 11: Die Ventile arbeiteten weiter, obwohl der Zylinder abgeschaltet war. Kein Hersteller dokumentiert diesen Code öffentlich. Am nächsten kommt ihm Mercedes' Active Cylinder Control am 5,8-l-V12 von CL 600 und S 600 ab 2001: Sie legte eine Bank still und koppelte deren Auslassventile über zwei Magnetventile ab – ein hängendes Schaltelement ergäbe dort genau das Fehlerbild dieses Codes. Bei Achtzylindern nutzt GM dafür P3498 bis P349F, wertet den Saugrohrdruck aus und speichert Type B nach 22 Fehlern in 25 Prüfungen. Die Ansteuerungsfunktion von Zylinder 11 meldet P3482, eine Fehlzündung dort P0311."
  affected_components:
    - valve_train
    - lifter
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: high
      label:
        en: Valve switching element of cylinder 11 jammed
        de: Ventilschaltelement von Zylinder 11 klemmt
    - id: oil_supply_fault
      likelihood: medium
      label:
        en: Oil pressure supply to the switching parts disturbed
        de: Öldruckversorgung der Schaltelemente gestört
    - id: low_or_degraded_oil
      likelihood: low
      label:
        en: Low or degraded oil
        de: Zu wenig oder gealtertes Öl
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough running when one bank is shut down
      de: Unrunder Lauf, wenn eine Bank abgeschaltet ist
    - en: Higher fuel use
      de: Höherer Verbrauch
