- code: P3412
  category: powertrain
  title:
    en: Cylinder 2 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 2 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "On GM's L84 V8 each cylinder, including cylinder 2, has a valve lifter oil solenoid bolted into the block valley. NHTSA's description of the system notes these solenoids are driven with peak-and-hold current for fast response. P3412 is set when the control line for cylinder 2 is shorted to supply voltage: GM checks it with the driver on and treats under 0.5 ohm to power as failed, 20 of 25 samples at 250 ms, Type B. In that state the computer cannot pull the solenoid properly and drops cylinder 2 from deactivation. Related codes are P3409 for an open circuit, P3411 for a short to ground and P3410 when the circuit is fine but the cylinder does not respond."
    de: "Beim GM-V8 L84 sitzt für jeden Zylinder, auch für Zylinder 2, ein Stößel-Öl-Magnetventil im Motor-V. Die NHTSA-Beschreibung des Systems nennt eine Ansteuerung mit Anzugs- und Haltestrom für schnelles Schalten. P3412 wird gesetzt, wenn die Steuerleitung von Zylinder 2 Schluss nach Versorgungsspannung hat: GM prüft bei eingeschalteter Endstufe und wertet unter 0,5 Ohm zur Versorgung als Fehler, 20 von 25 Messungen im 250-ms-Takt, Type B. Dann kann das Steuergerät das Ventil nicht sauber schalten und nimmt Zylinder 2 aus der Abschaltung. Verwandt sind P3409 für Unterbrechung, P3411 für Masseschluss und P3410, wenn der Kreis stimmt, der Zylinder aber nicht reagiert."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Control wire shorted to a voltage feed in the harness
        de: Steuerleitung im Kabelbaum mit einer Spannungsversorgung verbunden
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Low-resistance coil in the cylinder 2 solenoid
        de: Zu niederohmige Spule im Magnetventil von Zylinder 2
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output stage fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation no longer active
      de: Zylinderabschaltung nicht mehr aktiv
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
