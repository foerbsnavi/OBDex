- code: P3495
  category: powertrain
  title:
    en: Cylinder 12 Exhaust Valve Control Circuit Low
    de: Zylinder 12 Auslassventil Steuerkreis niedrig
  description:
    en: "P3495 points to a low signal, usually a short to ground, on the control line of the cylinder 12 exhaust valve actuator. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The twelve-cylinder engines with deactivation (Bentley W12, Lamborghini Aventador V12, Mercedes M137) are not documented with a dedicated exhaust actuator per cylinder; the newer ones shut entire banks and keep the valves moving, as Bentley states for its W12. Where such an actuator does exist, the diagnosis follows the usual path: connector unplugged, resistance of the wire to ground, then the coil itself. P3493 is the open circuit, P3496 the short to voltage, and P3491 the low fault on the intake side of cylinder 12."
    de: "P3495 weist auf ein zu niedriges Signal, meist einen Masseschluss, an der Steuerleitung des Auslassventil-Stellglieds von Zylinder 12 hin. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Für die Zwölfzylinder mit Abschaltung (Bentley W12, Lamborghini Aventador V12, Mercedes M137) ist kein eigenes Auslass-Stellglied je Zylinder dokumentiert; die jüngeren legen ganze Bänke still und lassen die Ventile laufen, wie Bentley für den W12 erklärt. Gibt es ein solches Stellglied doch, folgt die Diagnose dem üblichen Weg: Stecker abziehen, Widerstand der Leitung gegen Masse messen, dann die Spule prüfen. Unterbrechung ist P3493, Plusschluss P3496, der niedrige Fehler der Einlassseite von Zylinder 12 P3491."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 12 grounded
        de: Leitung zum Auslass-Stellglied von Zylinder 12 an Masse
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Exhaust actuator with internal short
        de: Auslass-Stellglied mit innerem Schluss
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module output faulty
        de: Ausgang des Steuergeräts fehlerhaft
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation inactive
      de: Zylinderabschaltung inaktiv
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3493, P3494, P3496, P3491, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.mobilityengineeringtech.com/component/content/article/41966-sae-ma-01159
    - https://www.bentleymedia.com/en/newsitem/1611-end-of-an-era-as-final-bentley-w12-engine-hand-built-in-crewe
    - https://en.wikipedia.org/wiki/Mercedes-Benz_M137_engine
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
  reviewed: '2026-11-02'

- code: P3496
  category: powertrain
  title:
    en: Cylinder 12 Exhaust Valve Control Circuit High
    de: Zylinder 12 Auslassventil Steuerkreis hoch
  description:
    en: "P3496 is the final code of the per-cylinder valve block: it marks the cylinder 12 exhaust valve control circuit as too high, typically a short to battery voltage or a coil with shorted turns. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Bentley built its last W12 in 2024 after describing a shut-off that idles one bank of six under part or trailing throttle, and the Lamborghini Aventador V12 shut one bank below 135 km/h; neither documents an exhaust actuator for cylinder 12. The clearest public account of exhaust valves following their own switching sequence remains a GM patent. Should the code appear, the module will disable deactivation. P3493 (open) and P3495 (low) complete the set, P3497 is the bank 2 system code."
    de: "P3496 ist der letzte Code des zylinderweisen Ventilblocks: Er meldet den Steuerkreis des Auslassventils von Zylinder 12 als zu hoch, typischerweise ein Schluss zur Batteriespannung oder eine Spule mit Windungsschluss. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bentleys W12, gebaut bis 2024, legte bei Teillast oder im Schiebebetrieb eine Sechserbank still. Der V12 des Lamborghini Aventador legte unter 135 km/h eine Bank still. Keiner dokumentiert ein Auslass-Stellglied für Zylinder 12; eine eigene Schaltfolge der Auslassventile zeigt öffentlich vor allem ein GM-Patent. Tritt der Code auf, sperrt das Steuergerät die Abschaltung. P3493 (offen) und P3495 (niedrig) ergänzen die Reihe, P3497 ist der Systemcode für Bank 2."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 12 shorted to battery voltage
        de: Leitung zum Auslass-Stellglied von Zylinder 12 mit Schluss zur Batteriespannung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the exhaust actuator coil
        de: Windungsschluss in der Spule des Auslass-Stellglieds
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output damaged
        de: Ausgang des Motorsteuergeräts beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off disabled
      de: Zylinderabschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3493, P3494, P3495, P3492, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://www.bentleymedia.com/en/newsitem/1611-end-of-an-era-as-final-bentley-w12-engine-hand-built-in-crewe
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
    - https://patents.google.com/patent/US20070240659A1/en
  reviewed: '2026-11-02'

