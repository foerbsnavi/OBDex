- code: P341B
  category: powertrain
  title:
    en: Deactivation/Intake Valve Control Circuit Performance Bank 2
    de: Abschaltung/Einlassventil Steuerkreis Funktion Bank 2
  description:
    en: "With P341B the controller judges that intake deactivation on bank 2 is not doing its job even though no circuit fault is present: cylinders keep breathing when they should be sealed, or stay sealed after reactivation. No manufacturer documents this code publicly. One way to catch it is described in a Delphi patent: pressure pulses in the intake are timed against crank angle, and a missing or extra pulse shows which cylinder misbehaves. In practice, makers use their own codes instead, such as GM's P3498 series per cylinder or Honda's bank code P3497. CARB requires a functional check of such outputs. Electrical faults on the same bank are P340B; bank 1 is P341A. Oil level and quality are the first things to check."
    de: "Bei P341B kommt das Steuergerät zu dem Schluss, dass die Einlassabschaltung auf Bank 2 ihre Aufgabe nicht erfüllt, obwohl kein Kreisfehler vorliegt: Zylinder atmen weiter, obwohl sie dicht sein sollten, oder bleiben nach dem Zuschalten verschlossen. Kein Hersteller dokumentiert den Code öffentlich. Ein Erkennungsweg steht in einem Delphi-Patent: Druckpulse im Ansaugtrakt werden gegen den Kurbelwinkel getaktet, und ein fehlender oder zusätzlicher Puls verrät den betroffenen Zylinder. In der Praxis nehmen die Hersteller eigene Codes, etwa GMs Reihe ab P3498 je Zylinder oder Hondas Bankcode P3497. CARB verlangt eine Funktionsprüfung solcher Stellglieder. Elektrische Fehler derselben Bank laufen unter P340B, Bank 1 unter P341A. Zuerst Ölstand und Ölzustand prüfen."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Oil level too low or oil past its service life
        de: Ölstand zu niedrig oder Öl über die Wechselfrist hinaus
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Lifter or rocker on bank 2 stuck in one switching state
        de: Stößel oder Kipphebel auf Bank 2 hängt in einer Schaltstellung
    - id: control_valve_leak
      likelihood: medium
      label:
        en: Control valve on bank 2 sticking or leaking past its seal
        de: Steuerventil auf Bank 2 klemmt oder ist an der Dichtung undicht
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough running, mostly at light load
      de: Unrunder Lauf, vor allem bei geringer Last
    - en: Misfire codes on bank 2
      de: Fehlzündungscodes auf Bank 2
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
