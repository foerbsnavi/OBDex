    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03A%20Diagnostics.pdf
    - https://static.nhtsa.gov/odi/tsbs/2020/MC-10176548-9999.pdf
  reviewed: '2026-11-06'

- code: P3428
  category: powertrain
  title:
    en: Cylinder 4 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 4 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3428 means the wire that switches cylinder 4's deactivation solenoid is tied to voltage. GM's bulletin 20-NA-038 lists cylinders 1, 4, 6 and 7 as the ones its AFM V8s switch to V4 mode, which makes cylinder 4 a standard candidate. In the 2019 documents for L84, L86 and the Corvette LT4, GM judges the circuit with the low-side stage switched on: a supply path of less than half an ohm counts as a short, and 20 bad results within 25 produce a Type B entry and the lamp after two trips. Because the low-side stage sinks the current, a line stuck at battery voltage can push the output into overcurrent, so after repair the module should be checked too. P3427 is the short to ground, P3425 the open. The truck or car keeps all cylinders running."
    de: "P3428 bedeutet, dass die Steuerleitung des Abschalt-Magnetventils von Zylinder 4 auf Spannung liegt. GMs Bulletin 20-NA-038 nennt die Zylinder 1, 4, 6 und 7 als jene, die seine AFM-V8 für den V4-Betrieb stilllegen – Zylinder 4 ist also ein Standardkandidat. Die Tabellen 2019 für L84, L86 und LT4 der Corvette bewerten den Kreis bei eingeschaltetem Low-Side-Treiber: Ein Weg zur Versorgung unter einem halben Ohm gilt als Schluss, 20 Fehler in 25 Proben ergeben einen Type-B-Eintrag und die Leuchte nach zwei Fahrten. Weil die Low-Side-Stufe den Strom nach Masse führt, kann eine auf Batteriespannung hängende Leitung den Ausgang überlasten; nach der Reparatur gehört daher auch das Steuergerät geprüft. P3427 ist der Masseschluss, P3425 die Unterbrechung. Bis zur Reparatur arbeiten alle Zylinder."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 4 control wire shorted to a 12 V feed
        de: Steuerleitung von Zylinder 4 mit einer 12-V-Leitung verbunden
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Low-resistance winding in the cylinder 4 solenoid
        de: Zu niederohmige Wicklung im Ventil von Zylinder 4
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Overloaded output stage in the engine control module
        de: Überlastete Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: No V4 or reduced-cylinder operation
      de: Kein V4- oder Teilzylinderbetrieb
  repair:
