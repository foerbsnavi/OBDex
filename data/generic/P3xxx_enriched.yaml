- code: P3449
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 7 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: "P3449 tells you the engine computer lost continuity in the circuit to the cylinder 7 deactivation solenoid. Chrysler documents it twice for the 5.7 L Hemi with MDS: a 2025 bulletin for the 2023 RAM 1500 eTorque lists it next to a cylinder 7 misfire (P0307) and fixes it with new PCM software, and a STAR case names P3449 first when the driver-side manifold heat shield has worn through the MDS harness at the rear of the cylinder head. GM uses the code on AFM V8s (L86, LT4 Corvette) and on the DFM L84, flagging more than 200 kohm in the off state, 20 of 25 samples, Type B. P3451 and P3452 report shorts, P3450 a mechanical fault on cylinder 7."
    de: "P3449 bedeutet: Das Steuergerät findet keinen Durchgang mehr im Kreis zum Abschalt-Magnetventil von Zylinder 7. Chrysler belegt den Code beim 5,7-l-Hemi mit MDS gleich zweimal. Ein Bulletin von 2025 zum RAM 1500 eTorque (Modelljahr 2023) nennt ihn neben Fehlzündungen auf Zylinder 7 (P0307) und behebt ihn mit neuer PCM-Software. Ein STAR-Fall führt P3449 an erster Stelle, wenn das Hitzeschild des fahrerseitigen Krümmers den MDS-Kabelbaum hinten am Zylinderkopf durchgescheuert hat. GM nutzt den Code bei AFM-V8 (L86, LT4 der Corvette) und beim DFM-Motor L84: mehr als 200 kOhm im ausgeschalteten Zustand, 20 von 25 Proben, Type B. P3451 und P3452 melden Schlüsse, P3450 einen mechanischen Fehler an Zylinder 7."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: harness_heat_shield_chafe
      likelihood: high
      label:
