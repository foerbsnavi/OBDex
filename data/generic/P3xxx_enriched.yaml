- code: P3478
  category: powertrain
  title:
    en: Cylinder 10 Exhaust Valve Control Performance
    de: Zylinder 10 Auslassventil Steuerung Funktion
  description:
    en: P3478 describes a cylinder 10 exhaust valve that does not switch as commanded although its actuator circuit is fine. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. When an exhaust valve keeps working after shut-off, the trapped gas is pumped out and the cylinder cools, which a Ford patent proposes to catch through exhaust pressure. Cooling is also why Bentley alternates the idle bank of its W12 to protect cylinders and converter; Bentley, like Audi on the R8 V10, shuts down banks rather than individual valves. The code therefore only applies to engines with switchable exhaust valves, which none of the known V10 or V12 systems publicly use. P3477, P3479 and P3480 are the electrical faults.
    de: "P3478 beschreibt ein Auslassventil an Zylinder 10, das nicht wie befohlen schaltet, obwohl der Kreis seines Stellglieds in Ordnung ist. Arbeitet ein Auslassventil nach der Abschaltung weiter, wird das eingeschlossene Gas ausgeschoben und der Zylinder kühlt aus; ein Ford-Patent will das über den Abgasdruck erkennen. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Gegen Auskühlen wechselt Bentley beim W12 die ruhende Bank und schützt so Zylinder und Katalysator; wie Audi beim R8-V10 legt Bentley Bänke still, keine einzelnen Ventile. Der Code betrifft daher nur Motoren mit schaltbaren Auslassventilen, die keines der bekannten V10- oder V12-Systeme öffentlich nutzt. Elektrische Fehler: P3477, P3479, P3480."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust switching element at cylinder 10 stuck
        de: Schaltelement am Auslass von Zylinder 10 klemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure too low for the exhaust switch
        de: Öldruck für die Auslassumschaltung zu niedrig
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator responding slowly
        de: Auslass-Stellglied reagiert träge
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Harsh jolt as cylinder 10 is reactivated
      de: Harter Ruck beim Zuschalten von Zylinder 10
    - en: Misfire on cylinder 10 (P0310)
      de: Fehlzündungen auf Zylinder 10 (P0310)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
