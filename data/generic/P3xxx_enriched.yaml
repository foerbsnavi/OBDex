- code: P34AF
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Circuit High Bank 1
    de: Nockenwellenversteller A Positionssensor A Stromkreis zu hoch Bank 1
  description:
    en: P34AF is logged when position sensor A on the bank 1 intake phaser reports a voltage above its upper limit for at least one second. Mitsubishi covers the code in its 2022 Outlander manual and, besides the harness, points to the Hall sensor of motor 1 in the electric actuator – a hint that position sensor A is a Hall element inside the phaser motor. A broken ground lead of the sensor, a signal line in contact with supply voltage or a dead Hall sensor are the usual causes; since the sensor is built into the actuator, a sensor fault normally means a new actuator. Fail-safe parks the intake phaser at its base angle, opens the intake runner valve and switches off exhaust gas recirculation. Low is P34AE, bank 2 P34B3.
    de: "P34AF wird gespeichert, wenn Positionssensor A des Einlassverstellers auf Bank 1 mindestens eine Sekunde lang eine Spannung über der oberen Grenze liefert. Für den Outlander 2022 belegt Mitsubishi den Code und nennt neben dem Kabelbaum den Hallsensor von Motor 1 im elektrischen Steller – ein Hinweis, dass Positionssensor A ein Hallelement im Stellmotor ist. Üblich: Sensormasse unterbrochen, Signal mit Schluss gegen Versorgungsspannung oder Hallsensor ausgefallen; weil der Sensor im Steller sitzt, bedeutet ein Sensordefekt meist einen neuen Steller. Im Notlauf bleibt der Einlassversteller in Grundstellung, die Saugrohrklappe öffnet und die Abgasrückführung wird abgeschaltet. Zu niedrig ist P34AE, Bank 2 P34B3."
  affected_components:
    - cam_actuator_a_pos_sensor_b1
    - sensor_wiring
  common_causes:
    - id: ground_open
      likelihood: high
      label:
        en: Sensor ground open or plug corroded
        de: Sensormasse unterbrochen oder Stecker korrodiert
    - id: short_supply
      likelihood: medium
      label:
        en: Signal wire shorted to supply voltage
        de: Signalleitung mit Schluss gegen Versorgungsspannung
    - id: hall_sensor
      likelihood: medium
      label:
        en: Hall sensor of the actuator motor failed (actuator replacement)
        de: Hallsensor des Stellmotors ausgefallen (Steller tauschen)
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Intake phaser held in its base position, reduced power
      de: Einlassversteller in Grundstellung, weniger Leistung
    - en: Slightly higher fuel consumption
      de: Etwas höherer Kraftstoffverbrauch
