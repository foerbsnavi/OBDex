- code: P3465
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 9 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3465 flags an open circuit to the actuator meant to shut down cylinder 9 or hold its intake valve closed. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Among such engines, Mercedes' M137 V12 (S 600 and CL 600, 1998 to 2002) had a shut-off system built around a solenoid pack and oil pressure tubes, whereas Audi's R8 V10 idles a whole bank by stopping injection and ignition. For orientation, GM treats the comparable circuit on its V8s as open above 200 kohm with the driver off, 20 failures in 25 samples. P3467 and P3468 cover shorts on the same line, P3466 a mechanical fault, P3469 the exhaust side of cylinder 9.
    de: "Bei P3465 sieht das Steuergerät eine Unterbrechung im Kreis jenes Stellglieds, das Zylinder 9 stilllegen oder dessen Einlassventil geschlossen halten soll. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zu diesen Motoren zählt der V12 M137 von Mercedes (S 600 und CL 600, 1998 bis 2002), dessen Abschaltsystem auf einem Magnetventilblock mit Öldruckleitungen aufbaute; Audis R8-V10 legt dagegen eine komplette Bank still, indem er Einspritzung und Zündung aussetzt. Zur Einordnung: GM wertet den entsprechenden Kreis seiner V8 bei ausgeschaltetem Treiber ab 200 kOhm als offen (20 Fehler in 25 Proben). Kurzschlüsse derselben Leitung melden P3467 und P3468, mechanische Störungen P3466, die Auslassseite von Zylinder 9 P3469."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Broken or chafed wire to the cylinder 9 actuator
        de: Leitung zum Stellglied von Zylinder 9 gebrochen oder durchgescheuert
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 9 solenoid
        de: Spule des Magnetventils von Zylinder 9 unterbrochen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Loose or corroded connector at the solenoid pack
        de: Stecker am Magnetventilblock locker oder korrodiert
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output stage in the engine control module failed
        de: Endstufe im Motorsteuergerät ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off no longer engages
      de: Zylinderabschaltung greift nicht mehr
    - en: Slightly higher fuel consumption at part load
      de: Leicht erhöhter Verbrauch im Teillastbereich
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
