- code: P3419
  category: powertrain
  title:
    en: Cylinder 3 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 3 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "P3419 says the line feeding the cylinder 3 deactivation solenoid is dragged toward ground. The L84 V8 in GM's 2019 OBD documents shows the test: while the low-side output rests, a resistance to chassis ground under half an ohm is wrong, and once 20 out of 25 readings, one every 250 ms, agree, with the powertrain relay above 11 V and the engine at 425 rpm or faster, a Type B fault is logged. The lamp therefore follows on the second trip, and some controllers add P3417 at the same moment. The older 2007 Displacement on Demand table still merged short and open for cylinder 3 into one solenoid test. P3420 is the opposite fault, P3427 the cylinder 4 equivalent. Driving stays normal apart from the lost fuel saving."
    de: "P3419 besagt, dass die Leitung zum Abschalt-Magnetventil von Zylinder 3 nach Masse gezogen wird. Wie GM das beim V8 L84 prüft, steht in den OBD-Unterlagen 2019: Ruht der Low-Side-Ausgang, ist ein Widerstand unter einem halben Ohm zur Masse unzulässig, sobald 20 von 25 Proben im 250-ms-Takt übereinstimmen – vorausgesetzt, das Antriebsrelais liefert mindestens 11 V und der Motor dreht mit 425 U/min oder mehr. Es entsteht ein Type-B-Code, die Leuchte geht also nach zwei Fahrten an; bei manchen Steuergeräten wird P3417 mit abgelegt. Die ältere Tabelle 2007 für Displacement on Demand fasste Schluss und Unterbrechung für Zylinder 3 noch in einem Ventiltest zusammen. P3420 ist der Gegenfehler, P3427 das Pendant für Zylinder 4. Fahren lässt sich normal, nur die Spritersparnis entfällt."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Insulation of the cylinder 3 control wire worn through to ground
        de: Isolierung der Steuerleitung von Zylinder 3 bis auf Masse durchgescheuert
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short of the cylinder 3 solenoid to its housing
        de: Innerer Schluss des Ventils von Zylinder 3 gegen das Gehäuse
    - id: connector_water
      likelihood: low
      label:
        en: Oil or water bridging pins in the connector
        de: Öl oder Wasser überbrückt Kontakte im Stecker
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Defective driver in the engine control module
        de: Defekter Treiber im Motorsteuergerät
  symptoms:
    - en: Check engine lamp after two drives
      de: Motorkontrollleuchte nach zwei Fahrten
    - en: Engine no longer drops cylinders under light load
      de: Motor schaltet bei geringer Last keine Zylinder mehr ab
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
