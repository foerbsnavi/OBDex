- code: P34A7
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit High Bank 1
    de: Nockenwellenversteller A Temperaturfühler Stromkreis zu hoch Bank 1
  description:
    en: P34A7 is set when the temperature sensor of intake camshaft actuator A on bank 1 delivers a voltage above its upper limit. Most often the sensor wire or its ground is interrupted, or the signal touches a supply voltage; with an NTC-type sensor this reads as an implausibly cold actuator. The module then lacks a usable value for its thermal protection and usually switches to a cautious phasing strategy. NTN-SNR assigns P34A7 to the inlet camshaft adjustment with too high a signal. Nissan fits such sensors to the electric intake phaser of the 2018 Pathfinder and QX60 but has not published this particular code. Check the actuator plug and the harness routing over the engine first. Low is P34A6.
    de: P34A7 setzt das Steuergerät, wenn der Temperaturfühler des Einlass-Nockenwellenverstellers A auf Bank 1 eine Spannung über seiner oberen Grenze liefert. Meist ist die Fühlerleitung oder deren Masse unterbrochen, oder das Signal hat Kontakt zu einer Versorgungsspannung; bei einem NTC-Fühler wirkt das wie ein unplausibel kalter Versteller. Damit fehlt dem Steuergerät ein brauchbarer Wert für den Hitzeschutz, und es verstellt nur noch vorsichtig. NTN-SNR ordnet P34A7 der Einlassverstellung mit zu hohem Signal zu. Nissan verbaut solche Fühler am elektrischen Einlassversteller von Pathfinder und QX60 (2018), hat diesen Code aber nicht veröffentlicht. Zuerst Stecker am Versteller und Kabelführung über dem Motor prüfen. Zu niedrig ist P34A6.
  affected_components:
    - cam_actuator_a_temp_sensor_b1
    - sensor_wiring
  common_causes:
