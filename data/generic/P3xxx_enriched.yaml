- code: P34A3
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Performance
    de: Zylinder 12 Abschaltung/Einlassventil Funktion
  description:
    en: "P34A3 closes the series at the twelfth cylinder: cylinder 12 was commanded to deactivate, but its valves did not stop. No manufacturer documents this code publicly. A dedicated check is needed because CARB's misfire definition excludes cylinders that are deliberately shut off, so the misfire monitor will not flag a skipped cylinder that still pumps air without fuel. Delphi's patent US7314034B1 confirms the state of each cylinder from the pattern of intake or exhaust pressure pulses, close to the principle GM applies to cylinders 1 to 8. On V12s that switch bank by bank, a defect would first show as rough running and a warning lamp. P3490 handles the control side of cylinder 12."
    de: "P34A3 schließt die Reihe mit dem letzten Zylinder eines Zwölfzylinders ab: Zylinder 12 sollte abschalten, seine Ventile liefen aber weiter. Kein Hersteller dokumentiert diesen Code öffentlich. Eine eigene Prüfung braucht es, weil die CARB absichtlich stillgelegte Zylinder aus der Definition der Fehlzündung herausnimmt; die Aussetzerüberwachung übersieht also einen Zylinder, der ohne Kraftstoff weiter Luft pumpt. Delphis Patent US7314034B1 bestimmt den Zustand jedes Zylinders aus dem Muster der Druckpulse im Saug- oder Abgaskrümmer, ähnlich dem Prinzip, das GM für die Zylinder 1 bis 8 nutzt. Bei bankweise schaltenden V12 fiele ein Defekt zuerst durch unrunden Lauf und die Warnleuchte auf. Die Ansteuerung betrifft P3490."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: high
      label:
        en: Lifter or rocker switching element of cylinder 12 stuck
        de: Schaltelement an Stößel oder Kipphebel von Zylinder 12 klemmt
    - id: oil_control_valve_faulty
      likelihood: medium
      label:
        en: Oil control valve of the deactivation sticking
        de: Ölsteuerventil der Abschaltung klemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low or aged oil
        de: Zu wenig oder gealtertes Öl
  symptoms:
