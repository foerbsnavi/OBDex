    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US8006670B2/en
  reviewed: '2026-11-02'

- code: P3463
  category: powertrain
  title:
    en: Cylinder 8 Exhaust Valve Control Circuit Low
    de: Zylinder 8 Auslassventil Steuerkreis niedrig
  description:
    en: "P3463 would mean that the control line of a dedicated cylinder 8 exhaust actuator is shorted to ground. No manufacturer documents this code publicly. On the only engines with documented cylinder 8 deactivation, GM's L84 and its relatives, one solenoid handles both valves, and GM reports a ground short on it as P3459, testing for less than 0.5 ohm to ground with the driver off. NHTSA's summary of the system lists solenoid driver circuit faults among the reasons the ECM inhibits deactivation, which is also what a driver would notice here: the engine keeps all eight cylinders running and uses a little more fuel. P3461 covers an open, P3462 the function and P3464 a short to power in this exhaust group."
    de: "P3463 stünde für einen Masseschluss in der Leitung eines eigenständigen Auslass-Stellglieds an Zylinder 8. Kein Hersteller dokumentiert diesen Code öffentlich. Bei den einzigen Motoren mit belegter Abschaltung von Zylinder 8, GMs L84 und seinen Verwandten, bedient ein Magnetventil beide Ventile; einen Masseschluss daran meldet GM als P3459 und prüft dafür auf weniger als 0,5 Ohm gegen Masse bei ausgeschalteter Endstufe. Die NHTSA-Zusammenfassung des Systems zählt Kreisfehler an den Ventil-Endstufen zu den Gründen, aus denen das Steuergerät die Abschaltung sperrt – genau das merkt auch der Fahrer: Der Motor läuft weiter auf allen acht Zylindern und verbraucht etwas mehr. P3461 (Unterbrechung), P3462 (Funktion) und P3464 (Plusschluss) vervollständigen diese Auslassgruppe."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Cylinder 8 exhaust actuator wire shorted to the engine block
        de: Leitung des Auslass-Stellglieds von Zylinder 8 mit dem Motorblock kurzgeschlossen
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Exhaust actuator shorted to ground internally
        de: Auslass-Stellglied innen gegen Masse kurzgeschlossen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Driver stage in the engine control module faulty
        de: Endstufe im Motorsteuergerät fehlerhaft
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays on all eight cylinders
      de: Motor bleibt auf allen acht Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
