- code: P3499
  category: powertrain
  title:
    en: Cylinder 2 Deactivation/Intake Valve Performance
    de: Zylinder 2 Abschaltung/Einlassventil Funktion
  description:
    en: P3499 reports that cylinder 2 did not stop exchanging gas when told to deactivate. On GM's DFM V8s (L84, L87) one oil solenoid in the lifter valley feeds both lifters of the cylinder; oil pressure pushes spring-loaded pins inward which lets the outer lifter shell ride the cam while the valve remains closed. If those pins stay engaged, the engine computer sees manifold pressure that is too high during the skipped events and, after 22 of 25 failed opportunities, stores this Type B code. GM's 2019 Silverado and Sierra information PIP5584 names a faulty oil control solenoid as one cause. The electrical side of cylinder 2 has its own codes (P3409, P3411, P3412), and the control-performance code is P3410. Expect a lamp and lost economy.
    de: "P3499 bedeutet: Zylinder 2 hat beim Abschaltbefehl nicht aufgehört, Luft durchzusetzen. Bei GMs DFM-V8 (L84, L87) versorgt ein Ölmagnetventil im Motor-V beide Stößel des Zylinders; Öldruck schiebt federbelastete Riegel nach innen, sodass der Stößelkörper dem Nocken folgt und das Ventil zu bleibt. Rasten die Riegel nicht aus, misst das Steuergerät während der ausgelassenen Takte zu hohen Saugrohrdruck und legt nach 22 Fehlversuchen in 25 Gelegenheiten diesen Type-B-Code ab. GMs Information PIP5584 zu Silverado und Sierra 2019 nennt ein defektes Ölsteuerventil als eine Ursache. Elektrische Fehler laufen als P3409, P3411 und P3412, die Ansteuerungsfunktion als P3410. Folgen: Leuchte und höherer Verbrauch."
  affected_components:
    - lifter
    - valve_train
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: lifter_lock_pins_stuck
      likelihood: high
      label:
        en: Locking pins in the cylinder 2 lifters do not retract
        de: Riegel in den Stößeln von Zylinder 2 fahren nicht ein
    - id: oil_solenoid_faulty
      likelihood: medium
      label:
        en: Lifter oil solenoid of cylinder 2 not delivering oil pressure
        de: Ölmagnetventil von Zylinder 2 gibt keinen Öldruck weiter
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low, aerated or degraded oil
        de: Zu wenig, aufgeschäumtes oder gealtertes Öl
    - id: ecm_false_detection
      likelihood: low
      label:
        en: Code stored without a real fault, ECM software update needed
        de: Code ohne echten Defekt gespeichert, ECM-Software-Update nötig
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Higher fuel consumption because cylinder 2 is no longer skipped
      de: Höherer Verbrauch, weil Zylinder 2 nicht mehr ausgeblendet wird
    - en: Ticking from the lifter area
      de: Ticken aus dem Bereich der Stößel
