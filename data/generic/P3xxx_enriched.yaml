- code: P3486
  category: powertrain
  title:
    en: Cylinder 11 Exhaust Valve Control Performance
    de: Zylinder 11 Auslassventil Steuerung Funktion
  description:
    en: "P3486 flags a functional problem with the exhaust valve of cylinder 11: the circuit is healthy, but the valve does not reach the commanded state. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. With a twelve-cylinder engine the consequences of a valve that keeps opening are that the cylinder pumps cold air through the exhaust and the converter cools, the issue Bentley avoids on its W12 by alternating banks. A Ford patent shows how such a leaking exhaust valve can be spotted from exhaust pressure. The reverse fault, a valve that stays shut, compresses trapped gas when the cylinder returns. As none of the known V12 or W12 systems switches valves individually, there is no documented user. P3485, P3487 and P3488 are the electrical faults."
    de: "P3486 meldet ein Funktionsproblem am Auslassventil von Zylinder 11: Der Kreis ist gesund, das Ventil erreicht den befohlenen Zustand aber nicht. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Öffnet bei einem Zwölfzylinder ein Auslassventil weiter, pumpt der Zylinder kalte Luft ins Abgas und der Katalysator kühlt aus – genau das umgeht Bentley beim W12 durch das Wechseln der Bänke. Wie sich ein solches undichtes Auslassventil am Abgasdruck erkennen lässt, zeigt ein Ford-Patent. Der umgekehrte Fehler, ein geschlossen bleibendes Ventil, verdichtet beim Zuschalten das eingeschlossene Gas. Da keines der bekannten V12- oder W12-Systeme Ventile einzeln schaltet, ist kein Anwender belegt. Die elektrischen Fehler sind P3485, P3487 und P3488."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust switching element of cylinder 11 jammed
        de: Schaltelement am Auslass von Zylinder 11 verklemmt
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil supply inadequate for exhaust switching
        de: Ölversorgung für die Auslassumschaltung unzureichend
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust actuator slow to respond
        de: Auslass-Stellglied reagiert langsam
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Knock when cylinder 11 reactivates
      de: Schlag beim Zuschalten von Zylinder 11
    - en: Misfire on cylinder 11 (P0311)
      de: Fehlzündungen auf Zylinder 11 (P0311)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
