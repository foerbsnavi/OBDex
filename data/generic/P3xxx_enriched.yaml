- code: P3493
  category: powertrain
  title:
    en: Cylinder 12 Exhaust Valve Control Circuit/Open
    de: Zylinder 12 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: P3493 applies to a separately controlled exhaust valve on cylinder 12 and reports that its actuator circuit is open. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Bentley's W12 and the Lamborghini Aventador V12 shut off banks; Bentley explicitly keeps the valves operating, and Lamborghini describes only the switch to six cylinders below 135 km/h. A GM patent treats the exhaust valves as a step of their own, stopping them before the intake valves, while GM's later production design drives both valves of a cylinder from one solenoid. An open exhaust circuit on cylinder 12 therefore points to a rare design. P3495 and P3496 are the short-circuit codes, P3494 the function, P3489 the intake side.
    de: P3493 gilt für ein getrennt gesteuertes Auslassventil an Zylinder 12 und meldet eine Unterbrechung im Kreis seines Stellglieds. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Bentleys W12 und der V12 des Lamborghini Aventador legen Bänke still; Bentley lässt die Ventile ausdrücklich weiterarbeiten, Lamborghini beschreibt nur den Wechsel auf sechs Zylinder unter 135 km/h. Ein GM-Patent behandelt die Auslassventile als eigenen Schritt und legt sie vor den Einlassventilen still; GMs spätere Serientechnik betätigt beide Ventile eines Zylinders über ein Magnetventil. Ein offener Auslasskreis an Zylinder 12 deutet daher auf eine seltene Bauart. Schlüsse melden P3495 und P3496, die Funktion P3494, die Einlassseite P3489.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
