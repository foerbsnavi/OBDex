- code: P3492
  category: powertrain
  title:
    en: Cylinder 12 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 12 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: P3492 records a high condition on the control circuit of the cylinder 12 deactivation or intake valve actuator, generally a short to a supply voltage seen while the output is commanded on. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The Variable displacement overview notes that a V12 can stop up to six cylinders, and the production engines doing so (Mercedes M137, Lamborghini Aventador, Bentley W12) differ widely in method, from a hydraulic solenoid pack (M137) to bank shut-off with the valves left running (Bentley). Only a design with valve actuators has a cylinder 12 actuator to short. Expect deactivation to be inhibited and the engine to run on all twelve. P3489 and P3491 are the electrical siblings, P3496 the exhaust high code.
    de: "P3492 hält einen zu hohen Zustand im Steuerkreis des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 12 fest, meist einen Schluss zur Versorgung, der bei eingeschaltetem Ausgang auffällt. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Ein V12 kann bis zu sechs Zylinder stilllegen; die Serienmotoren dafür (Mercedes M137, Lamborghini Aventador, Bentley W12) gehen verschieden vor, vom hydraulischen Magnetventilblock (M137) bis zur Bankabschaltung mit weiterlaufenden Ventilen (Bentley). Ein Stellglied an Zylinder 12 gibt es nur bei einer Bauart mit Ventil-Stellgliedern. Das Steuergerät sperrt dann die Abschaltung, der Motor läuft auf allen zwölf. Elektrische Geschwister: P3489 und P3491, Auslass hoch ist P3496."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 12 control wire shorted to supply voltage
        de: Steuerleitung von Zylinder 12 mit Schluss zur Versorgungsspannung
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 12 actuator
        de: Windungsschluss im Stellglied von Zylinder 12
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output damaged
        de: Ausgang des Motorsteuergeräts beschädigt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine runs permanently on twelve cylinders
      de: Motor läuft dauerhaft auf zwölf Zylindern
