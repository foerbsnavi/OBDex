- code: P34C2
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Circuit Low Bank 2
    de: Nockenwellenversteller B Positionssensor A Stromkreis zu niedrig Bank 2
  description:
    en: "Mercedes-Benz documents this code as P34C200: on cylinder bank 2, the feedback line of CAMTRONIC exhaust solenoid 1 is grounded. The code is one of sixteen that bulletin LI05.20-P-080192 groups together for engine types M176 and M177, found in AMG 63 models as well as S-Class, G-Class and GLS cars. Since heat damage turned up on wiring that runs over the firewall beside the windscreen, a harness inspection comes first, before parts are replaced; Mercedes also wants actuators with the older numbers ending 02 03, 16 00, 03 03 and 17 00 exchanged for the current versions and the engine software updated. A low signal can also come from an actuator with internal damage. Bank 1 low: P34BE; bank 2 high: P34C3."
    de: "Mercedes-Benz belegt diesen Code als P34C200: Auf Zylinderbank 2 liegt die Rückmeldeleitung des CAMTRONIC-Auslass-Stellers 1 an Masse. Der Code gehört zu sechzehn, die das Bulletin LI05.20-P-080192 für die Motoren M176 und M177 zusammenfasst – zu finden in AMG-63-Modellen sowie in S-Klasse, G-Klasse und GLS. Weil an Leitungen, die über die Spritzwand neben der Windschutzscheibe laufen, Hitzeschäden auftraten, kommt die Sichtprüfung des Kabelbaums vor jedem Teiletausch; außerdem sollen Steller mit den älteren Nummern auf 02 03, 16 00, 03 03 und 17 00 gegen aktuelle Ausführungen getauscht und die Motorsoftware aktualisiert werden. Ein zu niedriges Signal kann auch von einem innen beschädigten Steller stammen. Bank 1 zu niedrig: P34BE, Bank 2 zu hoch: P34C3."
  affected_components:
    - cam_actuator_b_pos_sensor_b2
    - sensor_wiring
  common_causes:
