- code: P34C1
  category: powertrain
  title:
    en: B Camshaft Position Actuator Position Sensor A Range/Performance Bank 2
    de: Nockenwellenversteller B Positionssensor A Bereich/Funktion Bank 2
  description:
    en: "Mercedes-Benz names P34C109 for the exhaust side of bank 2 on its CAMTRONIC V8s: the signal from the sensor at solenoid 1 is wrong although the circuit is intact, entered as a component fault. CARB explains why such a check exists, since even a single cylinder pin on a lift mechanism not moving into place is a failure mode that VVT monitoring has to cover. The same bulletin, LI05.20-P-080192, also carries P005C (solenoid 1, exhaust, bank 2: faulty or jammed off) and P164B (CAMTRONIC limp-home). The Mercedes remedy: engine software, current actuator part numbers, and a look at the harness for heat damage. Because the solenoid sensor is integrated, a confirmed fault calls for replacing the actuator. Bank 1 counterpart: P34BD."
    de: "Mercedes-Benz nennt P34C109 für die Auslassseite von Bank 2 seiner CAMTRONIC-V8: Das Signal des Sensors an Steller 1 ist falsch, obwohl der Kreis intakt ist, eingetragen als Bauteilfehler. Warum es diese Prüfung gibt, erklärt CARB: Schon ein einzelner Zylinderstift eines Hubmechanismus, der seine Stellung nicht erreicht, ist ein Fehlerfall, den die Überwachung der Ventilverstellung erfassen muss. Dasselbe Bulletin LI05.20-P-080192 führt außerdem P005C (Auslass-Steller 1, Bank 2: Fehlfunktion oder in Stellung AUS festsitzend) und P164B (CAMTRONIC im Notlauf). Abhilfe laut Mercedes: Motorsoftware, aktuelle Teilenummern der Steller, Kabelbaum auf Hitzeschäden prüfen. Weil der Sensor zum Steller gehört, ist bei bestätigtem Fehler ein neuer Steller fällig. Gegenstück auf Bank 1: P34BD."
  affected_components:
    - cam_actuator_b_pos_sensor_b2
  common_causes:
    - id: superseded_actuator
      likelihood: high
      label:
        en: "CAMTRONIC actuator of an older part number (Mercedes: replace)"
        de: "CAMTRONIC-Steller mit älterer Teilenummer (Mercedes: ersetzen)"
    - id: engine_software
      likelihood: high
      label:
        en: Engine control software needs an update
        de: Software des Motorsteuergeräts braucht ein Update
    - id: pin_sticking
      likelihood: medium
      label:
        en: Actuator pin sticking or moving too slowly
        de: Stift des Stellers klemmt oder bewegt sich zu langsam
  symptoms:
