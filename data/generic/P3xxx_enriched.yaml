- code: P3469
  category: powertrain
  title:
    en: Cylinder 9 Exhaust Valve Control Circuit/Open
    de: Zylinder 9 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: P3469 is set when the circuit driving a separate exhaust valve actuator on cylinder 9 is open. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. A distinct exhaust actuator only exists where intake and exhaust valves are switched independently; a GM patent at least shows that the exhaust valves can follow their own timing, being deactivated before the intake valves and reactivated before them too. GM's own production system uses one solenoid per cylinder for both valves, and the publicly described ten- and twelve-cylinder systems (Audi R8 V10, Bentley W12) keep the valves moving altogether. So an open circuit here can only concern an engine that carries such hardware. P3471 and P3472 report shorts, P3470 a functional fault, P3465 the intake side.
    de: P3469 setzt das Steuergerät, wenn der Kreis eines eigenen Auslassventil-Stellglieds an Zylinder 9 unterbrochen ist. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Ein eigenes Auslass-Stellglied setzt unabhängig geschaltete Ventile voraus; ein GM-Patent zeigt immerhin, dass Auslassventile eigenem Timing folgen können – sie ruhen vor den Einlassventilen und kehren vor ihnen zurück. GMs Serientechnik nutzt dagegen ein Magnetventil je Zylinder für beide Ventile, und die öffentlich beschriebenen Systeme mit zehn und zwölf Zylindern (Audi R8-V10, Bentley W12) lassen die Ventile ohnehin weiterlaufen. Der Fehler betrifft also nur Motoren mit solcher Hardware. Schlüsse melden P3471 und P3472, Funktionsfehler P3470, die Einlassseite P3465.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: medium
      label:
        en: Open or chafed wire to the cylinder 9 exhaust actuator
        de: Leitung zum Auslass-Stellglied von Zylinder 9 unterbrochen oder durchgescheuert
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Exhaust actuator coil of cylinder 9 open
        de: Spule des Auslass-Stellglieds von Zylinder 9 unterbrochen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Connector at the exhaust actuator loose or corroded
        de: Stecker am Auslass-Stellglied locker oder korrodiert
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output failed
        de: Ausgang des Motorsteuergeräts ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder shut-off blocked
      de: Zylinderabschaltung gesperrt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
