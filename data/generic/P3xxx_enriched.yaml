- code: P341D
  category: powertrain
  title:
    en: Deactivation/Exhaust Valve Control Circuit Performance Bank 2
    de: Abschaltung/Auslassventil Steuerkreis Funktion Bank 2
  description:
    en: "P341D appears once the bank 2 exhaust valves respond wrongly to a deactivation or reactivation request while the electrical side is intact. No manufacturer documents this code publicly. Timing is the critical part: a GM patent application has the exhaust valves stop before the intake valves when a cylinder is switched off and resume before them when it comes back, so that burnt gas is expelled and no fresh charge is trapped. GM's DFM V8, as NHTSA describes it, reverses this and stops the intake side first. If the exhaust side lags, the planned order breaks. CARB expects outputs like this to be checked for proper function. The circuit code for this bank is P340D, the bank 1 equivalent P341C, the intake function on bank 2 P341B. Expect a lamp, harsh mode changes and higher fuel use."
    de: "P341D wird gesetzt, wenn die Auslassventile von Bank 2 falsch auf eine Ab- oder Zuschaltanforderung reagieren, obwohl die elektrische Seite intakt ist. Kein Hersteller dokumentiert den Code öffentlich. Entscheidend ist die Reihenfolge: In einer GM-Patentanmeldung hören die Auslassventile beim Abschalten vor den Einlassventilen auf zu arbeiten und setzen beim Zuschalten auch vor ihnen wieder ein, damit verbranntes Gas hinausgeschoben und keine Frischladung eingesperrt wird. GMs DFM-V8 legt laut NHTSA umgekehrt zuerst die Einlassseite still. Hinkt die Auslassseite hinterher, gerät die geplante Abfolge durcheinander. CARB verlangt eine Funktionsprüfung solcher Stellglieder. Der Kreiscode dieser Bank ist P340D, Bank 1 P341C, die Einlassfunktion auf Bank 2 P341B. Zu erwarten sind Leuchte, harte Moduswechsel und Mehrverbrauch."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter or rocker on bank 2 switching late or not at all
        de: Auslassstößel oder -kipphebel auf Bank 2 schaltet spät oder gar nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil too thin, too old or too low for fast switching
        de: Öl zu dünn, zu alt oder zu wenig für schnelles Umschalten
    - id: actuator_sticking
      likelihood: low
      label:
        en: Sluggish bank 2 exhaust actuator valve
        de: Träges Ventil des Auslass-Stellglieds von Bank 2
  symptoms:
