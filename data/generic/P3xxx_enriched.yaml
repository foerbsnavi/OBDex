- code: P3450
  category: powertrain
  title:
    en: Cylinder 7 Deactivation/Intake Valve Control Performance
    de: Zylinder 7 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3450 is meant for a cylinder 7 whose valves do not switch as commanded while the solenoid circuit itself checks out. No manufacturer documents this code publicly. In practice the lifters do the switching: NHTSA's account of GM's system shows oil pressure pushing spring-loaded locking pins inward so the lifter body moves without lifting the valve, and DFM only engages with coolant between 40 and 126 °C, more than 20 s of running and above 13 km/h. When that mechanism fails on cylinder 7, GM's L84 sets P349E from manifold pressure, and Chrysler's Hemi sets P1417, Cylinder 7 Reactivation Control Performance. P3449, P3451 and P3452 are the electrical codes for the same cylinder."
    de: "P3450 ist für einen Zylinder 7 gedacht, dessen Ventile nicht wie befohlen umschalten, obwohl der Kreis des Magnetventils keinen Fehler zeigt. Kein Hersteller dokumentiert diesen Code öffentlich. Umgeschaltet wird in Wirklichkeit im Stößel: Nach der NHTSA-Darstellung von GMs System drückt Öldruck federbelastete Sperrstifte nach innen, sodass sich der Stößelkörper bewegt, ohne das Ventil anzuheben. DFM greift zudem erst bei 40 bis 126 °C Kühlmittel, nach mehr als 20 s Laufzeit und über 13 km/h. Versagt diese Mechanik an Zylinder 7, setzt GMs L84 anhand des Saugrohrdrucks P349E, Chryslers Hemi setzt P1417 „Cylinder 7 Reactivation Control Performance“. P3449, P3451 und P3452 sind die elektrischen Codes desselben Zylinders."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: lifter_locking_pin_stuck
      likelihood: high
      label:
        en: Locking pins in a cylinder 7 lifter sticking from wear or dirt
        de: Sperrstifte in einem Stößel von Zylinder 7 klemmen durch Verschleiß oder Schmutz
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Insufficient or aged oil delaying the switch
        de: Zu wenig oder gealtertes Öl verzögert das Umschalten
    - id: oil_screen_blocked
      likelihood: medium
      label:
        en: Oil screen or passage to the cylinder 7 solenoid blocked
        de: Ölsieb oder Kanal zum Magnetventil von Zylinder 7 verstopft
    - id: solenoid_oring_leak
      likelihood: low
      label:
        en: Leaking O-ring on the solenoid lets pressure escape
        de: Undichter O-Ring am Magnetventil lässt Druck entweichen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Ticking noise from the valve train
      de: Tickern aus dem Ventiltrieb
    - en: Misfire on cylinder 7 (P0307)
      de: Fehlzündungen auf Zylinder 7 (P0307)
    - en: Reduced-cylinder mode switched off
      de: Teilzylinderbetrieb abgeschaltet
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
