- code: P34B4
  category: powertrain
  title:
    en: B Camshaft Position Actuator Temperature Sensor Circuit Bank 1
    de: Nockenwellenversteller B Temperaturfühler Stromkreis Bank 1
  description:
    en: "P34B4 reports that the circuit of the temperature sensor on camshaft actuator B, bank 1, cannot be evaluated: an open line, a disconnected plug or a reading that fits no valid state. In the supplier list of NTN-SNR the letter B stands for the outlet camshaft, so the code targets an exhaust phaser turned by an electric motor whose electronics need heat protection. An Aisin patent mounts such a sensor on the motor control board and calls the intake shaft merely an example. We found no carmaker that publishes P34B4; the 2022 Mitsubishi Outlander, for instance, drives only its intake cam electrically and shifts the exhaust cam with an oil control solenoid. Expect restricted exhaust phasing until the circuit is repaired. Low and high faults: P34B6, P34B7."
    de: "Mit P34B4 stellt das Steuergerät fest, dass sich der Kreis des Temperaturfühlers am Nockenwellenversteller B (Bank 1) nicht auswerten lässt – wegen einer Unterbrechung, eines gelösten Steckers oder eines Werts ohne gültigen Zustand. NTN-SNR ordnet den Buchstaben B der Auslassnockenwelle zu; gemeint ist also ein Auslassversteller mit Elektromotor, dessen Elektronik vor Überhitzung bewahrt werden muss. Ein Aisin-Patent setzt einen solchen Fühler auf die Steuerplatine des Motors und nennt die Einlasswelle nur beispielhaft. Öffentlich beschreibt kein Hersteller P34B4; der Mitsubishi Outlander 2022 etwa verstellt nur den Einlass elektrisch, den Auslass dagegen hydraulisch über ein Magnetventil. Bis zur Reparatur ist die Auslassverstellung meist eingeschränkt. Zu niedrig bzw. zu hoch: P34B6, P34B7."
  affected_components:
    - cam_actuator_b_temp_sensor_b1
    - sensor_wiring
  common_causes:
    - id: plug_or_wire_open
      likelihood: high
      label:
        en: Plug at the exhaust actuator not seated or wire broken
        de: Stecker am Auslassversteller nicht eingerastet oder Leitung gebrochen
    - id: actuator_electronics
      likelihood: medium
      label:
        en: Temperature sensor in the actuator electronics failed
        de: Temperaturfühler in der Elektronik des Verstellers ausgefallen
    - id: module_input
      likelihood: low
      label:
        en: Faulty input stage in the controlling module
        de: Eingangsstufe im ansteuernden Steuergerät defekt
