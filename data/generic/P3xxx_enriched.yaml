- code: P3447
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Circuit Low
    de: Zylinder 6 Auslassventil Steuerkreis niedrig
  description:
    en: "P3447 is about a ground fault on the lead of a stand-alone exhaust actuator for cylinder 6. No manufacturer documents this code publicly. GM, the one maker publishing the full set of cylinder 6 circuit codes, switches both valves of the cylinder with one solenoid and reports a ground short as the intake-side P3443: impedance below 0.5 ohm toward ground while the driver is off, 20 of 25 samples, Type B. A comparable test would apply here, because CARB requires circuit monitoring for every emission-relevant output. NHTSA notes that GM inhibits deactivation as soon as a solenoid driver circuit fault is present, so the practical result is an engine running on all cylinders. P3445 (open) and P3448 (short to power) are the neighbouring exhaust codes."
    de: "P3447 beschreibt eine Steuerleitung zu einem eigenen Auslassventil-Stellglied an Zylinder 6, die Schluss nach Masse hat. Kein Hersteller dokumentiert diesen Code öffentlich. GM, der einzige Hersteller mit vollständig veröffentlichten Kreiscodes für Zylinder 6, schaltet beide Ventile des Zylinders über ein Magnetventil und meldet einen Masseschluss als P3443 auf der Einlassseite: unter 0,5 Ohm gegen Masse bei ausgeschalteter Endstufe, 20 von 25 Proben, Type B. Eine vergleichbare Prüfung käme hier zum Einsatz, denn CARB verlangt eine Kreisüberwachung für jeden abgasrelevanten Ausgang. Laut NHTSA sperrt GM die Abschaltung, sobald ein Kreisfehler an einer Ventil-Endstufe vorliegt; praktisch läuft der Motor also auf allen Zylindern. P3445 (Unterbrechung) und P3448 (Plusschluss) sind die benachbarten Auslasscodes."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 6 chafed against the engine
        de: Leitung des Auslass-Stellglieds von Zylinder 6 am Motor durchgescheuert
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internal short to ground in the exhaust actuator
        de: Innerer Masseschluss im Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Damaged driver in the engine control module
        de: Beschädigte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays in full-cylinder mode
      de: Motor bleibt im Vollzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
