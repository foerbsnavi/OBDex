- code: P3406
  category: powertrain
  title:
    en: Cylinder 1 Exhaust Valve Control Performance
    de: Zylinder 1 Auslassventil Steuerung Funktion
  description:
    en: Where an engine controls the exhaust valves of cylinder 1 separately, P3406 would mean the exhaust side does not follow the command although the circuit checks pass. No manufacturer documents this code publicly. Ford holds a patent that detects an exhaust valve still opening after deactivation through pressure changes in the exhaust, and a GM patent, using one shared control valve, has the exhaust valves deactivate and also reactivate before the intake valves, so a lagging exhaust side is a real failure mode. Production systems from GM and Ford instead check the whole cylinder (GM P3498, Ford P3402). Electrical faults on this channel are P3405, P3407 and P3408; if the cylinder keeps pumping exhaust, the driver may feel roughness.
    de: Steuert ein Motor die Auslassventile von Zylinder 1 gesondert, stünde P3406 dafür, dass die Auslassseite dem Befehl nicht folgt, obwohl der Kreis elektrisch in Ordnung ist. Kein Hersteller dokumentiert diesen Code öffentlich. Ein Ford-Patent erkennt ein nach der Abschaltung weiter öffnendes Auslassventil an Druckschwankungen im Abgas, ein GM-Patent schaltet mit einem gemeinsamen Steuerventil die Auslassventile vor den Einlassventilen ab und auch vor ihnen wieder zu – eine nachhinkende Auslassseite ist also ein realer Fehlerfall. Serienmotoren von GM und Ford prüfen stattdessen den ganzen Zylinder (GM P3498, Ford P3402). Elektrische Fehler dieses Kanals sind P3405, P3407 und P3408. Spürbar wäre unruhiger Lauf im Teilzylinderbetrieb.
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Insufficient or degraded oil delays exhaust-side switching
        de: Zu wenig oder verbrauchtes Öl verzögert das Umschalten auf der Auslassseite
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter or rocker of cylinder 1 not latching or unlatching
        de: Auslass-Stößel oder -Kipphebel von Zylinder 1 rastet nicht ein oder aus
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust valve actuator sticking
        de: Auslassventil-Stellglied klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Rough running or vibration in reduced-cylinder mode
      de: Unrunder Lauf oder Vibrationen im Teilzylinderbetrieb
    - en: Cylinder deactivation suspended
      de: Zylinderabschaltung ausgesetzt
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3405, P3407, P3408, P3402, P3400]
