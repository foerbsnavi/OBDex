- code: P3459
  category: powertrain
  title:
    en: Cylinder 8 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 8 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "When the ground-side control line of the cylinder 8 deactivation solenoid touches ground, the ECM stores P3459. GM publishes this test for the 2019 L84 V8 with Dynamic Fuel Management: driver off, impedance below 0.5 ohm to ground, a minimum of 11 V on the relay feed and 425 rpm, 20 errors in 25 samples, Type B. Some GM controllers log P3457 at the same time. Because a DFM engine may skip any cylinder, a fault on cylinder 8 shuts down a system that otherwise uses this cylinder routinely; GM's LTA and LT2 also include cylinder 8 in their fixed deactivation set. A ground short on the solenoid's high-side feed has its own GM code, P311A. P3460 is the short to power."
    de: "Berührt die masseseitige Steuerleitung des Abschalt-Magnetventils von Zylinder 8 die Masse, speichert das Steuergerät P3459. GM veröffentlicht die Prüfung für den V8 L84 mit Dynamic Fuel Management (2019): Endstufe aus, Widerstand unter 0,5 Ohm gegen Masse, mindestens 11 V am Powertrain-Relais und 425 U/min, 20 Fehler in 25 Proben, Type B. Manche GM-Steuergeräte tragen gleichzeitig P3457 ein. Da ein DFM-Motor jeden Zylinder auslassen darf, legt ein Fehler an Zylinder 8 ein System still, das diesen Zylinder sonst regelmäßig nutzt; auch GMs LTA und LT2 haben Zylinder 8 in ihrer festen Abschaltgruppe. Ein Masseschluss an der High-Side-Versorgung des Ventils hat bei GM den eigenen Code P311A. P3460 ist der Plusschluss."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 8 control wire grounded through damaged insulation
        de: Steuerleitung von Zylinder 8 über beschädigte Isolierung an Masse
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 8 solenoid
        de: Innerer Schluss im Magnetventil von Zylinder 8
    - id: connector_water
      likelihood: low
      label:
        en: Contamination in the solenoid connector
        de: Verschmutzung im Stecker des Magnetventils
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Output driver in the engine control module damaged
        de: Endstufe im Motorsteuergerät beschädigt
  symptoms:
    - en: Check engine lamp on after the second trip
      de: Motorkontrollleuchte nach der zweiten Fahrt an
    - en: Engine runs on all eight cylinders at all times
      de: Motor läuft ständig auf allen acht Zylindern
    - en: Higher fuel consumption
      de: Höherer Kraftstoffverbrauch
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
