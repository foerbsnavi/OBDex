- code: P3418
  category: powertrain
  title:
    en: Cylinder 3 Deactivation/Intake Valve Control Performance
    de: Zylinder 3 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3418 is meant for a cylinder 3 deactivation that is wired correctly yet does not respond as requested: the cylinder keeps breathing when it should rest, or fails to come back. No manufacturer documents this code publicly. GM tests the hardware of cylinder 3 under its own code P349A; bulletin 20-NA-204 for the 2021 L84 and L87 notes that a voltage dip during cranking can briefly disable the outputs and set that code without a real fault. Honda shows the same failure pattern in another form: in bulletin 13-055 excess cold-start oil pressure pushed cylinders 1 to 4 into cut mode uncommanded, logged as P3400/P3497 with misfires. Circuit faults belong to P3417, P3419 and P3420. Expect rough running and a misfire code."
    de: "P3418 ist für eine Abschaltung von Zylinder 3 gedacht, die elektrisch in Ordnung ist, aber nicht wie verlangt reagiert: Der Zylinder atmet weiter, wenn er ruhen soll, oder kommt nicht zurück. Kein Hersteller dokumentiert diesen Code öffentlich. Die Mechanik von Zylinder 3 testet GM stattdessen unter P349A; Bulletin 20-NA-204 zu L84 und L87 (2021) beschreibt, dass ein Spannungseinbruch beim Anlassen die Ausgänge kurz abschalten und diesen Code ohne echten Defekt setzen kann. Honda zeigt dasselbe Fehlerbild in anderer Form: Laut Bulletin 13-055 drückte zu hoher Öldruck beim Kaltstart die Zylinder 1 bis 4 ungewollt in die Abschaltung, gemeldet als P3400/P3497 mit Fehlzündungen. Kreisfehler gehören zu P3417, P3419 und P3420. Typisch sind unruhiger Lauf und ein Fehlzündungscode."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Low oil level, wrong viscosity or aged oil
        de: Zu wenig Öl, falsche Viskosität oder gealtertes Öl
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Lifter or rocker of cylinder 3 not locking or unlocking
        de: Stößel oder Kipphebel von Zylinder 3 verriegelt oder entriegelt nicht
    - id: solenoid_sticking
      likelihood: medium
      label:
