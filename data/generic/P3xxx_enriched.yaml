- code: P3426
  category: powertrain
  title:
    en: Cylinder 4 Deactivation/Intake Valve Control Performance
    de: Zylinder 4 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3426 is one of the few performance codes in this range that makers really use. FCA calls it Cylinder 4 Deactivation Control Performance on the 6.4 l Heavy Duty Hemi with MDS; bulletins 18-082-16 and 18-036-20 list it with P3402, P3442 and P3450 and fix it with new PCM software. Ford stores it on the 2025 F-150 5.0 l: bulletin 25-2487, replaced by 26-2093, traces P3402 and P3426 to a restricted oil feed tube for the right-bank deactivation solenoids, which is replaced under the valve cover. GM checks cylinder 4 mechanically under P349B instead. Circuit faults are P3425, P3427 and P3428. The lamp comes on, and the engine may run rough or stay in full-cylinder mode."
    de: "P3426 gehört zu den wenigen Funktionscodes dieses Bereichs, die Hersteller tatsächlich verwenden. FCA nennt ihn beim 6,4-l-Heavy-Duty-Hemi mit MDS Cylinder 4 Deactivation Control Performance; die Bulletins 18-082-16 und 18-036-20 führen ihn zusammen mit P3402, P3442 und P3450 und beheben ihn mit neuer PCM-Software. Ford legt ihn beim F-150 5,0 l (2025) ab: Bulletin 25-2487, ersetzt durch 26-2093, führt P3402 und P3426 auf ein verengtes Ölzulaufrohr der Abschaltventile der rechten Bank zurück, das unter dem Ventildeckel getauscht wird. GM prüft Zylinder 4 mechanisch stattdessen unter P349B. Kreisfehler sind P3425, P3427 und P3428. Die Leuchte geht an, der Motor kann unruhig laufen oder im Vollzylinderbetrieb bleiben."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: oil_feed_tube_restricted
      likelihood: high
      label:
        en: Restricted oil feed tube to the deactivation solenoids (Ford 5.0 l, TSB 26-2093)
        de: Verengtes Ölzulaufrohr zu den Abschaltventilen (Ford 5,0 l, TSB 26-2093)
    - id: pcm_software
      likelihood: medium
      label:
        en: Control software needing an update (FCA 6.4 l Hemi)
        de: Steuergeräte-Software mit Update-Bedarf (FCA 6,4-l-Hemi)
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Low or worn-out engine oil
        de: Zu wenig oder verbrauchtes Motoröl
    - id: lifter_stuck
      likelihood: low
      label:
        en: Deactivating lifter of cylinder 4 sticking
        de: Abschaltbarer Stößel von Zylinder 4 klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire on cylinder 4 or rough running
      de: Fehlzündung auf Zylinder 4 oder unruhiger Lauf
    - en: Drone or shudder at light throttle
      de: Dröhnen oder Ruckeln bei wenig Gas
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
