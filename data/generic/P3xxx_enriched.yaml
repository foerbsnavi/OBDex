- code: P3466
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Control Performance
    de: Zylinder 9 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3466 is the plausibility test for cylinder 9: its actuator circuit is electrically sound, yet the cylinder fails to change state when the engine computer commands it. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. In valve-based systems the switching happens hydraulically; NHTSA's account of GM's design describes oil pressure moving locking pins inside the lifter. The Mercedes M137 V12, whose shut-off system relied on a solenoid pack and oil pressure tubes, is known for trouble with exactly those parts, exactly the kind of fault this code targets. Bank-switching V10 and W12 engines from Audi and Bentley leave the valves running and have nothing comparable to check. P3465, P3467 and P3468 are the electrical faults of cylinder 9."
    de: "P3466 prüft die Plausibilität an Zylinder 9: Der Kreis des Stellglieds ist elektrisch in Ordnung, trotzdem wechselt der Zylinder auf Befehl nicht den Zustand. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Ventilbasierte Systeme schalten hydraulisch; die NHTSA beschreibt für GM, wie Öldruck Sperrstifte im Stößel verschiebt. Der Mercedes-V12 M137, dessen Abschaltsystem auf Magnetventilblock und Öldruckleitungen beruhte, gilt gerade an diesen Teilen als anfällig – genau solche Mängel zielt dieser Code an. Audis V10 und Bentleys W12 schalten bankweise ab, lassen die Ventile aber weiterlaufen und haben hier nichts zu überwachen. Die elektrischen Fehler von Zylinder 9 sind P3465, P3467 und P3468."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Oil level, pressure or quality too poor to switch cylinder 9
        de: Ölstand, Öldruck oder Ölqualität reicht zum Umschalten von Zylinder 9 nicht
    - id: oil_line_leak
      likelihood: medium
      label:
        en: Leak at the oil tubes or solenoid pack feeding cylinder 9
        de: Undichtigkeit an Ölleitungen oder Magnetventilblock für Zylinder 9
    - id: lifter_stuck
      likelihood: medium
      label:
        en: Switching lifter of cylinder 9 sticking
        de: Schaltstößel von Zylinder 9 klemmt
    - id: solenoid_sticking
      likelihood: low
      label:
        en: Solenoid valve slow or sticking mechanically
        de: Magnetventil mechanisch träge oder klemmend
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Misfire count on cylinder 9 (P0309)
      de: Fehlzündungen auf Zylinder 9 (P0309)
    - en: Rough running while switching between full and partial mode
      de: Unruhiger Lauf beim Wechsel zwischen Voll- und Teilbetrieb
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3465, P3467, P3468, P3470, P3400, P0309]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
    - https://en.wikipedia.org/wiki/Mercedes-Benz_M137_engine
  reviewed: '2026-11-02'

- code: P3467
  category: powertrain
  title:
    en: Cylinder 9 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 9 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "With P3467 the control line of the cylinder 9 deactivation or intake valve actuator reads too low, which usually means it is touching ground. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. Twelve-cylinder engines with cylinder shut-off do exist, for instance Mercedes' M137 and Lamborghini's Aventador V12 introduced in 2012, but no published diagnostic list connects this number to them. GM's matching test on its V8 engines looks for less than 0.5 ohm to ground with the driver switched off and only runs above 11 V and 425 rpm. On a low-side driven solenoid, a ground fault can keep the coil energised, so the cylinder may drop out when it should fire. Siblings: P3465 open circuit, P3468 short to voltage."
    de: "P3467 heißt: Die Steuerleitung des Abschalt- bzw. Einlassventil-Stellglieds von Zylinder 9 liegt zu niedrig, meist wegen einer Verbindung nach Masse. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Zwölfzylinder mit Zylinderabschaltung gibt es durchaus, etwa den M137 von Mercedes oder den V12 des Lamborghini Aventador, eingeführt 2012, doch keine veröffentlichte Diagnoseliste ordnet ihnen diese Nummer zu. GMs gleichartige Prüfung an V8-Motoren sucht bei abgeschaltetem Treiber nach weniger als 0,5 Ohm gegen Masse und läuft nur oberhalb von 11 V und 425 U/min. Bestromt der Schluss ein masseseitig geschaltetes Ventil dauerhaft, kann der Zylinder ungewollt ausfallen. Geschwister: P3465 Unterbrechung, P3468 Schluss nach Plus."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Cylinder 9 control wire shorted to ground
        de: Steuerleitung von Zylinder 9 mit Masseschluss
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 9 solenoid
        de: Innerer Schluss im Magnetventil von Zylinder 9
    - id: connector_water
      likelihood: low
      label:
        en: Moisture in the solenoid connector
        de: Feuchtigkeit im Stecker des Magnetventils
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty driver in the engine control module
        de: Fehlerhafte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation disabled
      de: Zylinderabschaltung gesperrt
    - en: Possible misfire on cylinder 9 if the actuator stays energised
      de: Mögliche Fehlzündungen auf Zylinder 9, wenn das Stellglied bestromt bleibt
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3465, P3466, P3468, P3471, P3497, P0309]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://newatlas.com/aventador-lp-700-4-start-stop/24363/
    - https://en.wikipedia.org/wiki/Mercedes-Benz_M137_engine
