- code: P3431
  category: powertrain
  title:
    en: Cylinder 4 Exhaust Valve Control Circuit Low
    de: Zylinder 4 Auslassventil Steuerkreis niedrig
  description:
    en: "P3431 reports a cylinder 4 exhaust actuator line shorted to ground. No manufacturer documents this code publicly. Cylinder 4 is switched off by Chrysler's MDS Hemi as well as by GM's V8s with AFM or DFM, but each of them runs a single solenoid per cylinder, so their bulletins and tables only list intake-side circuit codes: Ram's 2025 software bulletin 18-002-25 names P3425 next to P3401, P3441 and P3449, and for GM's 2019 L84, P3427 handles a grounded line of under half an ohm, checked while the output rests and confirmed 20 times in 25 (Type B). That is the closest documented test; CARB would demand the same kind of short detection for a separate exhaust output. Drivers would see the lamp, and cylinder shutdown would cease."
    de: "P3431 meldet eine Leitung zum Auslass-Stellglied von Zylinder 4 mit Masseschluss. Kein Hersteller dokumentiert diesen Code öffentlich. Zylinder 4 wird zwar beim Hemi mit MDS von Chrysler ebenso abgeschaltet wie bei GMs V8 mit AFM oder DFM, doch diese Motoren arbeiten mit einem einzigen Magnetventil je Zylinder; ihre Bulletins und Tabellen führen deshalb nur einlassseitige Kreiscodes: Das Ram-Software-Bulletin 18-002-25 von 2025 nennt P3425 neben P3401, P3441 und P3449, und GMs L84-Tabelle 2019 nutzt P3427 für einen Masseschluss unter 0,5 Ohm bei ausgeschaltetem Treiber, 20 von 25 Proben, Type B. Das ist die nächstliegende dokumentierte Prüfung; für einen eigenen Auslass-Ausgang verlangte CARB dieselbe Art der Schlusserkennung. Sichtbar wären eine Warnleuchte und keine Zylinderabschaltung."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Cylinder 4 exhaust actuator lead grounded on the block or a bracket
        de: Leitung des Auslass-Stellglieds von Zylinder 4 liegt an Block oder Halter auf Masse
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internal short to ground in the exhaust actuator
        de: Innerer Masseschluss im Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module driver fault
        de: Treiberfehler im Steuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays on all cylinders
      de: Motor bleibt auf allen Zylindern
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
