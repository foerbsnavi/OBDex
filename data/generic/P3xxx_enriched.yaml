- code: P3442
  category: powertrain
  title:
    en: Cylinder 6 Deactivation/Intake Valve Control Performance
    de: Zylinder 6 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3442 would flag cylinder 6 failing to switch off or back on while its control circuit is electrically sound. No manufacturer documents this code publicly. Both large users of cylinder 6 deactivation picked their own numbers instead: GM's L84 reports a cylinder 6 that keeps breathing as P349D, judged from filtered manifold pressure in 22 of 25 opportunities (Type B), and Chrysler's 5.7 L Hemi uses P1416, Cylinder 6 Reactivation Control Performance. GM also warns that P349D can set after a voltage dip during cranking, which an ECM update cures. Real mechanical faults usually trace back to the oil supply or a lifter that does not latch. Electrical faults on the same channel are P3441, P3443 and P3444."
    de: "P3442 stünde für einen Zylinder 6, der sich nicht ab- oder wieder zuschalten lässt, obwohl sein Steuerkreis elektrisch einwandfrei ist. Kein Hersteller dokumentiert diesen Code öffentlich. Beide großen Nutzer der Abschaltung von Zylinder 6 vergeben eigene Nummern: GMs L84 meldet einen Zylinder 6, der weiter Luft ansaugt, als P349D – erkannt am gefilterten Saugrohrdruck in 22 von 25 Gelegenheiten (Type B); Chryslers 5,7-l-Hemi nutzt P1416 „Cylinder 6 Reactivation Control Performance“. GM weist zudem darauf hin, dass P349D nach einem Spannungseinbruch beim Anlassen gesetzt werden kann; dann hilft ein Software-Update. Echte mechanische Fehler gehen meist auf die Ölversorgung oder einen nicht einrastenden Stößel zurück. Elektrische Fehler desselben Kanals sind P3441, P3443 und P3444."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: low_or_degraded_oil
      likelihood: high
      label:
        en: Oil level too low, wrong grade or worn oil, so pressure builds too slowly
        de: Zu wenig, falsches oder verbrauchtes Öl, der Druck baut sich zu langsam auf
    - id: lifter_stuck
      likelihood: medium
      label:
        en: Deactivating lifter of cylinder 6 not locking or unlocking
        de: Abschaltstößel von Zylinder 6 verriegelt oder entriegelt nicht
    - id: solenoid_sticking
      likelihood: medium
      label:
        en: Cylinder 6 solenoid valve sticking or its oil screen clogged
        de: Magnetventil von Zylinder 6 klemmt oder sein Ölsieb ist zugesetzt
    - id: ecm_software
      likelihood: low
      label:
        en: Code stored after a voltage dip during cranking, cured by an ECM update (GM analogue 20-NA-204)
        de: Code nach Spannungseinbruch beim Anlassen, behoben per Software-Update (GM-Analogie 20-NA-204)
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Jerk or vibration when the engine changes between eight and four cylinders
      de: Ruck oder Vibration beim Wechsel zwischen acht und vier Zylindern
    - en: Misfire on cylinder 6 (P0306)
      de: Fehlzündungen auf Zylinder 6 (P0306)
    - en: Fuel consumption rises because deactivation is locked out
      de: Verbrauch steigt, weil die Abschaltung gesperrt ist
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
