- code: P34B1
  category: powertrain
  title:
    en: A Camshaft Position Actuator Position Sensor A Range/Performance Bank 2
    de: Nockenwellenversteller A Positionssensor A Bereich/Funktion Bank 2
  description:
    en: P34B1 means the intake-side position sensor A of bank 2 delivers an electrically sound but implausible value. No public manufacturer document uses this code. The nearest published example is the bank 1 code P34AD on the 2022 Mitsubishi Outlander, where the electric phaser module checks the motor position against the intake camshaft sensor and flags a mismatch. Mercedes uses the same fault type on the exhaust side for its CAMTRONIC lift actuators (P34BD, P34C1); bulletin LI05.20-P-080192 answers it with an engine software update and actuators of a newer part number. On bank 2 an actuator that binds or has worn, a lost learned position or a camshaft signal problem (compare P0021) are likely. The bank 2 phaser is then locked at its base angle.
    de: "P34B1: Positionssensor A des Einlassverstellers auf Bank 2 liefert ein elektrisch intaktes, aber unplausibles Signal. Keine öffentliche Herstellerunterlage verwendet diesen Code. Am nächsten kommt der Bank-1-Code P34AD beim Mitsubishi Outlander 2022: Dort gleicht das Steuergerät des elektrischen Verstellers die Motorlage mit dem Einlass-Nockenwellensensor ab und meldet Abweichungen. Mercedes nutzt denselben Fehlertyp auf der Auslassseite für die CAMTRONIC-Hubsteller (P34BD, P34C1); Bulletin LI05.20-P-080192 behebt ihn mit neuer Motorsoftware und Stellern mit neuerer Teilenummer. Auf Bank 2 sind ein schwergängiger oder abgenutzter Steller, eine verlorene angelernte Lage oder ein Problem mit dem Nockenwellensignal (siehe P0021) wahrscheinlich. Der Versteller bleibt dann in Grundstellung."
  affected_components:
    - cam_actuator_a_pos_sensor_b2
  common_causes:
    - id: actuator_sticking
      likelihood: high
      label:
        en: Actuator on bank 2 sticking or worn
        de: Steller auf Bank 2 klemmend oder verschlissen
    - id: learned_position
      likelihood: medium
      label:
        en: Learned actuator position lost or software outdated
        de: Angelernte Stellerlage verloren oder Software veraltet
    - id: cam_signal
      likelihood: medium
      label:
        en: Bank 2 intake camshaft signal disturbed
        de: Signal der Einlassnockenwelle von Bank 2 gestört
  symptoms:
    - en: Check engine light on
      de: Motorkontrollleuchte an
    - en: Bank 2 intake timing fixed, reduced power
      de: Einlass-Steuerzeit von Bank 2 fest, weniger Leistung
    - en: Possibly further timing codes such as P0021
      de: Ggf. weitere Verstellcodes wie P0021
  repair:
    difficulty: hard
    diy_possible: false
