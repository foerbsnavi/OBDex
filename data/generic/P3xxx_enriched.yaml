    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3442, P3443, P3444, P3445, P3449, P3400, P3497, P0306]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03A%20Diagnostics.pdf
