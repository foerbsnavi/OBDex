- code: P349B
  category: powertrain
  title:
    en: Cylinder 4 Deactivation/Intake Valve Performance
    de: Zylinder 4 Abschaltung/Einlassventil Funktion
  description:
    en: P349B is set when cylinder 4 fails to shut its valves on command. On Mazda's 2.5 l Skyactiv-G with cylinder deactivation (CX-5 and Mazda6, 2018-2019), cylinders 1 and 4 can be switched off; service alerts SA-041/18 and SA-022/19 tie P349B, P3498, P3400, P0304 and P0340 to a rocker arm that fell out of place or broke. Technicians are told to check the oil change records as well, and Mazda handles such cases with a replacement engine. GM's L84 and L87 use the code for cylinder 4 with the same manifold pressure test as for the other seven cylinders, Type B. Circuit faults would be P3425, P3427 and P3428, the control-performance code P3426. Expect noise from the head, rough idle and weak pull.
    de: "P349B fällt, wenn Zylinder 4 seine Ventile trotz Befehl nicht stilllegt. Beim 2,5-l-Skyactiv-G mit Zylinderabschaltung (CX-5 und Mazda6, 2018–2019) lassen sich die Zylinder 1 und 4 abschalten; die Service-Alerts SA-041/18 und SA-022/19 verbinden P349B mit P3498, P3400, P0304 und P0340 und führen sie auf einen verrutschten oder gebrochenen Kipphebel zurück. Die Werkstatt soll dabei auch die Ölwechsel-Nachweise prüfen; Mazda löst solche Fälle mit einem Tauschmotor. GM verwendet den Code bei L84 und L87 für Zylinder 4 mit demselben Saugrohrdruck-Test wie bei den übrigen sieben Zylindern (Type B). Kreisfehler wären P3425, P3427 und P3428, die Ansteuerungsfunktion P3426. Typisch: Geräusche aus dem Zylinderkopf, unrunder Leerlauf, schwacher Durchzug."
  affected_components:
    - valve_train
    - lifter
    - cylinder_deactivation_solenoid
    - engine_oil
  common_causes:
    - id: rocker_arm_broken_or_dislodged
      likelihood: high
      label:
        en: Rocker arm of cylinder 4 fallen out of place or broken (Mazda)
        de: Kipphebel an Zylinder 4 verrutscht oder gebrochen (Mazda)
    - id: poor_oil_maintenance
      likelihood: medium
      label:
        en: Long oil change intervals or unsuitable oil
        de: Zu lange Ölwechselintervalle oder ungeeignetes Öl
    - id: lifter_lock_pins_stuck
      likelihood: medium
      label:
        en: Deactivation lifter of cylinder 4 stuck locked (GM DFM)
        de: Abschaltstößel von Zylinder 4 hängt verriegelt (GM DFM)
    - id: oil_solenoid_faulty
      likelihood: low
      label:
        en: Oil control solenoid of cylinder 4 faulty
        de: Ölmagnetventil von Zylinder 4 defekt
  symptoms:
    - en: Rough idle and misfire on cylinder 4 (P0304)
      de: Unruhiger Leerlauf und Fehlzündungen auf Zylinder 4 (P0304)
    - en: Clatter or knocking from the valve cover area
      de: Klappern oder Klopfen aus dem Bereich des Ventildeckels
    - en: Lack of power
      de: Leistungsmangel
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
  repair:
    difficulty: shop_only
    diy_possible: false
    estimated_cost_eur: [100, 6000]
    estimated_hours: [0.5, 16]
  flags:
    mil: true
    emissions_relevant: true
