- code: P3458
  category: powertrain
  title:
    en: Cylinder 8 Deactivation/Intake Valve Control Performance
    de: Zylinder 8 Abschaltung/Einlassventil Steuerung Funktion
  description:
    en: "P3458 describes a cylinder 8 that does not deactivate or reactivate as commanded although its control circuit is electrically fine. No manufacturer documents this code publicly. GM, the only maker with published cylinder 8 deactivation codes, files this failure under P349F on the L84: during a commanded skip, filtered manifold pressure stays above a threshold, which means the intake and exhaust valves kept working; the test runs with air charge above 120 mg and MAP/BARO between 0.30 and 0.95, and 22 failures in 25 opportunities give a Type B code. Bulletin 20-NA-204 adds that on 2021 full-size SUVs with L84 and L87 a voltage dip during cranking can set P349F without any hardware fault. Electrical faults are P3457, P3459 and P3460."
    de: "P3458 beschreibt einen Zylinder 8, der Ab- oder Zuschaltbefehle nicht umsetzt, während sein Steuerkreis elektrisch fehlerfrei bleibt. Kein Hersteller dokumentiert diesen Code öffentlich. GM, als einziger Hersteller mit veröffentlichten Abschaltcodes für Zylinder 8, ordnet diesen Fehler beim L84 dem Code P349F zu: Bleibt der gefilterte Saugrohrdruck während eines befohlenen Aussetzers über einer Schwelle, haben Ein- und Auslassventil weitergearbeitet. Geprüft wird bei einer Zylinderfüllung über 120 mg und MAP/BARO zwischen 0,30 und 0,95; 22 Fehler in 25 Gelegenheiten ergeben einen Type-B-Code. Bulletin 20-NA-204 ergänzt, dass bei großen SUVs 2021 mit L84 und L87 ein Spannungseinbruch beim Anlassen P349F ohne Hardwarefehler setzen kann. Elektrische Fehler sind P3457, P3459 und P3460."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: lifter_stuck
      likelihood: medium
      label:
        en: Cylinder 8 deactivation lifter not unlocking or relocking
        de: Abschaltstößel von Zylinder 8 entriegelt oder verriegelt nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure too low or oil aerated
        de: Öldruck zu niedrig oder Öl aufgeschäumt
    - id: solenoid_sticking
      likelihood: medium
      label:
        en: Cylinder 8 solenoid valve sluggish or its screen blocked
        de: Magnetventil von Zylinder 8 träge oder Sieb zugesetzt
    - id: ecm_software
      likelihood: low
      label:
        en: False entry after low voltage while cranking, fixed by ECM update (GM analogue 20-NA-204)
        de: Fehleintrag nach Unterspannung beim Anlassen, behoben per Software-Update (GM-Analogie 20-NA-204)
  symptoms:
    - en: Check engine lamp on, sometimes going out again
      de: Motorkontrollleuchte an, teils wieder erloschen
    - en: Shake or roughness in light-load cruising
      de: Schütteln oder Unruhe bei Konstantfahrt mit wenig Last
    - en: Misfire on cylinder 8 (P0308)
      de: Fehlzündungen auf Zylinder 8 (P0308)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
