- code: P3403
  category: powertrain
  title:
    en: Cylinder 1 Deactivation/Intake Valve Control Circuit Low
    de: Zylinder 1 Abschaltung/Einlassventil Steuerkreis niedrig
  description:
    en: "The engine computer drives the deactivation valve for cylinder 1 through an output stage that checks its own wiring. P3403 means that check found the control line pulled to ground. GM documents it for the L84 and L86 V8s (2019): with the driver off, an impedance below 0.5 ohm to ground counts as a fault, and 20 failures in 25 samples taken every 250 ms set a Type B code, so the lamp comes on after the second trip. Ford's VDE monitor flags the same short via its smart driver within 5 seconds. An open line is P3401, a short to battery voltage P3404, a mechanical failure P3402. The engine then stays in all-cylinder mode, mainly costing fuel."
    de: "Das Steuergerät schaltet das Abschaltventil von Zylinder 1 über eine Endstufe, die ihre Leitung selbst prüft. P3403 heißt: Diese Prüfung hat einen Masseschluss der Steuerleitung gefunden. GM beschreibt das für die V8-Motoren L84 und L86 (Modelljahr 2019): Bei ausgeschalteter Endstufe gilt ein Widerstand unter 0,5 Ohm nach Masse als Fehler; 20 Treffer aus 25 Messungen im 250-ms-Takt ergeben einen Type-B-Code, die Lampe geht also nach der zweiten Fahrt an. Fords VDE-Überwachung erkennt denselben Schluss über ihre Smart-Endstufe binnen 5 Sekunden. Unterbrechung ist P3401, Plusschluss P3404, ein mechanischer Fehler P3402. Der Motor läuft dann dauerhaft mit allen Zylindern und verbraucht mehr."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: high
      label:
        en: Control wire chafed against the engine and shorted to ground
        de: Steuerleitung am Motor durchgescheuert, Schluss nach Masse
    - id: solenoid_internal_short
      likelihood: medium
      label:
        en: Internal short in the cylinder 1 deactivation solenoid
        de: Innerer Schluss im Abschalt-Magnetventil von Zylinder 1
    - id: connector_contamination
      likelihood: low
      label:
        en: Oil or water in the solenoid connector
        de: Öl oder Wasser im Stecker des Magnetventils
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty output driver in the engine control module
        de: Defekte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on after two trips
      de: Motorkontrollleuchte nach zwei Fahrten an
    - en: Engine no longer switches to reduced-cylinder mode
      de: Motor wechselt nicht mehr in den Teilzylinderbetrieb
    - en: Somewhat higher fuel consumption
      de: Etwas höherer Kraftstoffverbrauch
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
