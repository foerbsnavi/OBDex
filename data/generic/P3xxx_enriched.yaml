- code: P3433
  category: powertrain
  title:
    en: Cylinder 5 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 5 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3433 reports an open control circuit to the deactivation valve of cylinder 5, and GM has used it across three generations. The 2007 V6 with Displacement on Demand, which shut off cylinders 1, 3 and 5, already flagged a short or open after 30 failures in 100 samples at 250 ms above 800 rpm. On the 3.6 L V6 (LGX, LGZ) cylinder 5 is an active fuel management cylinder, and GM tied P3433 to oil leaking from the rocker arm control valve in the camshaft cover. The 2019 L84 V8 tests every cylinder with a 200 kohm limit. Each time it is a Type B code. P3434 to P3436 are the function and short codes for the same cylinder.
    de: P3433 meldet einen unterbrochenen Steuerkreis zum Abschaltventil von Zylinder 5, und GM nutzt ihn über drei Generationen. Schon der V6 mit Displacement on Demand von 2007, der die Zylinder 1, 3 und 5 stilllegte, erkannte Schluss oder Unterbrechung nach 30 Fehlern in 100 Messungen im 250-ms-Takt oberhalb 800 U/min. Beim 3,6-l-V6 (LGX, LGZ) ist Zylinder 5 einer der abschaltbaren Zylinder; GM brachte P3433 dort mit Öl in Verbindung, das am Kipphebel-Steuerventil im Nockenwellendeckel austritt. Der V8 L84 von 2019 prüft jeden Zylinder mit einer Grenze von 200 kOhm. Jedes Mal ist es ein Type-B-Code. P3434 bis P3436 sind Funktions- und Schlusscodes desselben Zylinders.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: oil_in_connector
      likelihood: high
      label:
        en: Oil leaking at the cylinder 5 control valve into its connector (GM 3.6 L V6)
        de: Öl tritt am Steuerventil von Zylinder 5 aus und gelangt in den Stecker (GM 3,6-l-V6)
    - id: wiring_open
      likelihood: medium
      label:
        en: Broken wire or spread terminal in the solenoid circuit
        de: Leitungsbruch oder aufgeweiteter Kontakt im Ventilkreis
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Open coil in the cylinder 5 solenoid
        de: Unterbrochene Spule im Magnetventil von Zylinder 5
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module output fault
        de: Ausgangsfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Oil seepage at the valve cover control valve (V6)
      de: Ölaustritt am Steuerventil im Ventildeckel (V6)
    - en: Reduced-cylinder mode no longer used
      de: Teilzylinderbetrieb wird nicht mehr genutzt
  repair:
