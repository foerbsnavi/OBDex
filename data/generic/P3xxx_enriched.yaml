- code: P3460
  category: powertrain
  title:
    en: Cylinder 8 Deactivation/Intake Valve Control Circuit High
    de: Zylinder 8 Abschaltung/Einlassventil Steuerkreis hoch
  description:
    en: "P3460 reports a short to supply voltage on the control circuit of the cylinder 8 deactivation solenoid, found while the output is switched on. GM lists it for the 2019 L84: under 0.5 ohm between output and controller power, 20 of 25 samples spaced 250 ms apart, Type B, with the same 11 V and 425 rpm enable limits as the other cylinder 8 circuit checks. GM's table contains a slip here: the strategy column for P3460 speaks of the cylinder 7 solenoid, while code and component name cylinder 8. Typical causes are harness damage against a feed wire or a solenoid with shorted turns; the visible result is that the engine stops using cylinder 8 deactivation. Siblings: P3457 (open) and P3459 (short to ground)."
    de: "P3460 meldet einen Schluss nach Versorgungsspannung im Steuerkreis des Abschalt-Magnetventils von Zylinder 8, erkannt bei eingeschaltetem Ausgang. GM führt den Code für den L84 von 2019: unter 0,5 Ohm zwischen Ausgang und Versorgung, 20 von 25 Proben im 250-ms-Abstand, Type B, mit denselben Freigaben von 11 V und 425 U/min wie die übrigen Kreisprüfungen an Zylinder 8. In GMs Tabelle steckt hier ein Versehen: Die Spalte zur Prüfstrategie spricht beim P3460 vom Ventil für Zylinder 7, Code und Bauteilname nennen Zylinder 8. Ursache sind meist Kabelschäden an einer Versorgungsleitung oder eine Spule mit Windungsschluss; sichtbar wird es daran, dass der Motor Zylinder 8 nicht mehr abschaltet. Geschwister: P3457 (Unterbrechung) und P3459 (Masseschluss)."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_voltage
      likelihood: high
      label:
        en: Cylinder 8 control wire in contact with a voltage source
        de: Steuerleitung von Zylinder 8 berührt eine Spannungsquelle
    - id: solenoid_coil_shorted
      likelihood: medium
      label:
        en: Shorted turns in the cylinder 8 solenoid
        de: Windungsschluss im Magnetventil von Zylinder 8
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Faulty driver in the engine control module
        de: Fehlerhafte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation inactive, slightly higher fuel use
      de: Zylinderabschaltung inaktiv, etwas höherer Verbrauch
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3457, P3458, P3459, P3464, P3497]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
  reviewed: '2026-11-02'

- code: P3461
  category: powertrain
  title:
    en: Cylinder 8 Exhaust Valve Control Circuit/Open
    de: Zylinder 8 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: In the J2012 scheme, P3461 marks lost continuity to an exhaust-side actuator of its own on cylinder 8. No manufacturer documents this code publicly. In the published sources, cylinder 8 is deactivated only by GM's newer V8s (DFM on the L84 and L87, a fixed 2-3-5-8 pattern on the LTA and LT2), and per NHTSA those engines feed both lifters of a cylinder from one solenoid, leaving no separate exhaust wiring to test. A GM patent application likewise uses one shared hydraulic valve and only staggers the exhaust valves ahead of the intake valves; only a separate exhaust actuator would fall under CARB's continuity check for output components. P3462 to P3464 are the other cylinder 8 exhaust codes, P3457 the intake-side open.
    de: Im J2012-Schema steht P3461 für fehlenden Durchgang zu einem eigenständigen Stellglied der Auslassseite an Zylinder 8. Kein Hersteller dokumentiert diesen Code öffentlich. In den veröffentlichten Quellen schalten nur GMs neuere V8 den Zylinder 8 ab (DFM beim L84 und L87, festes Muster 2-3-5-8 bei LTA und LT2), und laut NHTSA versorgen diese Motoren beide Stößel eines Zylinders aus einem Magnetventil – eine eigene Auslassleitung zum Prüfen gibt es dort nicht. Auch eine GM-Patentanmeldung nutzt ein gemeinsames Hydraulikventil und staffelt die Auslassventile nur zeitlich vor die Einlassventile; erst ein eigenes Auslass-Stellglied fiele unter die CARB-Durchgangsprüfung für Ausgangskomponenten. Zur selben Auslassgruppe gehören P3462 bis P3464; die Unterbrechung auf der Einlassseite heißt P3457.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Wire or plug to the cylinder 8 exhaust actuator broken
        de: Leitung oder Stecker zum Auslass-Stellglied von Zylinder 8 gebrochen
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Exhaust actuator winding open
        de: Wicklung des Auslass-Stellglieds unterbrochen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Control module output defective
        de: Ausgang des Steuergeräts defekt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation no longer active
      de: Zylinderabschaltung nicht mehr aktiv
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3462, P3463, P3464, P3457, P3497]
  sources:
