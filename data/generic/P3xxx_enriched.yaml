- code: P3473
  category: powertrain
  title:
    en: Cylinder 10 Deactivation/Intake Valve Control Circuit/Open
    de: Zylinder 10 Abschaltung/Einlassventil Steuerkreis/Unterbrechung
  description:
    en: P3473 reports an open circuit to the deactivation or intake valve actuator of cylinder 10, the last cylinder of a V10. No manufacturer documents this code publicly; J2012 reserves the codes for cylinders 9 to 12 for engines with more than eight cylinders. The V10 engines known for cylinder shut-off are Audi's 5.2 FSI in the R8 and Lamborghini's Huracán from model year 2016. Audi says its system idles one bank in the upper four gears by switching off injection and ignition, so it needs no valve actuator that this code could watch. On a twelve-cylinder engine with valve deactivation the code would mean a broken wire, an open coil or a bad connector at cylinder 10. P3475 and P3476 deal with shorts, P3474 with the mechanical result, P3477 with the exhaust valve.
    de: P3473 meldet eine Unterbrechung zum Abschalt- bzw. Einlassventil-Stellglied von Zylinder 10, beim V10 also dem letzten Zylinder. Kein Hersteller dokumentiert diesen Code öffentlich; die Codes für Zylinder 9 bis 12 sind in J2012 für Motoren mit mehr als acht Zylindern reserviert. Als V10 mit Zylinderabschaltung bekannt sind Audis 5,2 FSI im R8 und der Motor des Lamborghini Huracán ab Modelljahr 2016. Laut Audi legt das System in den vier oberen Gängen eine Bank still, indem es Einspritzung und Zündung abschaltet – ein Ventil-Stellglied, das dieser Code überwachen könnte, gibt es dort nicht. Bei einem Zwölfzylinder mit Ventilabschaltung stünde der Code für eine gebrochene Leitung, eine offene Spule oder einen schlechten Stecker an Zylinder 10. Schlüsse behandeln P3475 und P3476, die mechanische Seite P3474, das Auslassventil P3477.
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open_or_chafed
      likelihood: high
      label:
        en: Wire to the cylinder 10 actuator open or chafed
        de: Leitung zum Stellglied von Zylinder 10 unterbrochen oder durchgescheuert
    - id: solenoid_coil_open
      likelihood: medium
      label:
        en: Cylinder 10 solenoid coil open
        de: Spule des Magnetventils von Zylinder 10 offen
    - id: connector_corrosion
      likelihood: medium
      label:
        en: Corroded or loose connector at cylinder 10
        de: Korrodierter oder lockerer Stecker an Zylinder 10
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module driver failed
        de: Treiber im Motorsteuergerät ausgefallen
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine no longer switches to reduced-cylinder mode
      de: Motor wechselt nicht mehr in den Teilzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: false
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3474, P3475, P3476, P3477, P3400, P3497, P0310]
  sources:
