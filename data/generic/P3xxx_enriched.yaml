- code: P3446
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Performance
    de: Zylinder 6 Auslassventil Steuerung Funktion
  description:
    en: "P3446 stands for an exhaust valve on cylinder 6 that does not follow a deactivation or reactivation command although its circuit is intact. No manufacturer documents this code publicly. GM watches a closely related failure under a code of its own: on the 2019 L84, P318E (Cylinder 6 Trapped High Pressure Exhaust Charge) looks for an exhaust valve that fails to open and let the burned gas out, recognised by crankshaft jerk in 66 of 100 samples, Type B, with immediate protective action. A Ford patent covers the opposite case, an exhaust valve that keeps opening after shut-off, detected from exhaust pressure. The electrical codes for this exhaust channel are P3445, P3447 and P3448."
    de: "P3446 steht für ein Auslassventil an Zylinder 6, das einem Ab- oder Zuschaltbefehl nicht folgt, obwohl sein Kreis intakt ist. Kein Hersteller dokumentiert diesen Code öffentlich. GM überwacht einen eng verwandten Fehler unter eigener Nummer: Beim L84 von 2019 sucht P318E („Cylinder 6 Trapped High Pressure Exhaust Charge“) nach einem Auslassventil, das nicht öffnet und das verbrannte Gas nicht hinauslässt. Erkannt wird das an Drehungleichförmigkeiten der Kurbelwelle in 66 von 100 Proben, Type B, mit sofortiger Schutzreaktion. Ein Ford-Patent behandelt den umgekehrten Fall, ein Auslassventil, das nach dem Abschalten weiter öffnet, und erkennt ihn am Abgasdruck. Die elektrischen Codes dieses Auslasskanals sind P3445, P3447 und P3448."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter of cylinder 6 switching late or not at all
        de: Auslassstößel von Zylinder 6 schaltet verspätet oder gar nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure too low for reliable switching
        de: Öldruck zu niedrig für sicheres Umschalten
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust control valve sticking
        de: Steuerventil der Auslassseite klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Knock-like noise or vibration when the cylinder is switched back on
      de: Klopfähnliches Geräusch oder Vibration beim Wiederzuschalten des Zylinders
    - en: Possible misfire on cylinder 6 (P0306)
      de: Mögliche Fehlzündungen auf Zylinder 6 (P0306)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
