    - https://static.nhtsa.gov/odi/inv/2025/INRD-PE25001-11969.pdf
    - https://static.nhtsa.gov/odi/tsbs/2025/MC-11013168-0001.pdf
  reviewed: '2026-11-02'

- code: P3446
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Performance
    de: Zylinder 6 Auslassventil Steuerung Funktion
  description:
    en: "P3446 stands for an exhaust valve on cylinder 6 that does not follow a deactivation or reactivation command although its circuit is intact. No manufacturer documents this code publicly. GM watches a closely related failure under a code of its own: on the 2019 L84, P318E (Cylinder 6 Trapped High Pressure Exhaust Charge) looks for an exhaust valve that fails to open and let the burned gas out, recognised by crankshaft jerk in 66 of 100 samples, Type B, with immediate protective action. A Ford patent covers the opposite case, an exhaust valve that keeps opening after shut-off, detected from exhaust pressure. The electrical codes for this exhaust channel are P3445, P3447 and P3448."
    de: "P3446 steht für ein Auslassventil an Zylinder 6, das einem Ab- oder Zuschaltbefehl nicht folgt, obwohl sein Kreis intakt ist. Kein Hersteller dokumentiert diesen Code öffentlich. GM überwacht einen eng verwandten Fehler unter eigener Nummer: Beim L84 von 2019 sucht P318E („Cylinder 6 Trapped High Pressure Exhaust Charge“) nach einem Auslassventil, das nicht öffnet und das verbrannte Gas nicht hinauslässt. Erkannt wird das an Drehungleichförmigkeiten der Kurbelwelle in 66 von 100 Proben, Type B, mit sofortiger Schutzreaktion. Ein Ford-Patent behandelt den umgekehrten Fall, ein Auslassventil, das nach dem Abschalten weiter öffnet, und erkennt ihn am Abgasdruck. Die elektrischen Codes dieses Auslasskanals sind P3445, P3447 und P3448."
  affected_components:
    - cylinder_deactivation_solenoid
    - lifter
    - engine_oil
  common_causes:
    - id: switching_element_stuck
      likelihood: medium
      label:
        en: Exhaust lifter of cylinder 6 switching late or not at all
        de: Auslassstößel von Zylinder 6 schaltet verspätet oder gar nicht
    - id: low_or_degraded_oil
      likelihood: medium
      label:
        en: Oil pressure too low for reliable switching
        de: Öldruck zu niedrig für sicheres Umschalten
    - id: actuator_sticking
      likelihood: low
      label:
        en: Exhaust control valve sticking
        de: Steuerventil der Auslassseite klemmt
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Knock-like noise or vibration when the cylinder is switched back on
      de: Klopfähnliches Geräusch oder Vibration beim Wiederzuschalten des Zylinders
    - en: Possible misfire on cylinder 6 (P0306)
      de: Mögliche Fehlzündungen auf Zylinder 6 (P0306)
  repair:
    difficulty: hard
    diy_possible: false
    estimated_cost_eur: [100, 3500]
    estimated_hours: [0.5, 12]
  flags:
    mil: true
    emissions_relevant: true
    drive_cycle_required: true
    limp_mode_possible: false
  references:
    - sae:J2012
  related_codes: [P3445, P3447, P3448, P3442, P349D, P0306]
  sources:
    - https://www.law.cornell.edu/regulations/california/13-CCR-1968.2
    - https://gsi.ext.gm.com/gmspo/mode6/pdf/2019/19OBDG03B%20Diagnostics.pdf
    - https://patents.google.com/patent/US8006670B2/en
  reviewed: '2026-11-02'

- code: P3447
  category: powertrain
  title:
    en: Cylinder 6 Exhaust Valve Control Circuit Low
    de: Zylinder 6 Auslassventil Steuerkreis niedrig
  description:
    en: "P3447 is about a ground fault on the lead of a stand-alone exhaust actuator for cylinder 6. No manufacturer documents this code publicly. GM, the one maker publishing the full set of cylinder 6 circuit codes, switches both valves of the cylinder with one solenoid and reports a ground short as the intake-side P3443: impedance below 0.5 ohm toward ground while the driver is off, 20 of 25 samples, Type B. A comparable test would apply here, because CARB requires circuit monitoring for every emission-relevant output. NHTSA notes that GM inhibits deactivation as soon as a solenoid driver circuit fault is present, so the practical result is an engine running on all cylinders. P3445 (open) and P3448 (short to power) are the neighbouring exhaust codes."
    de: "P3447 beschreibt eine Steuerleitung zu einem eigenen Auslassventil-Stellglied an Zylinder 6, die Schluss nach Masse hat. Kein Hersteller dokumentiert diesen Code öffentlich. GM, der einzige Hersteller mit vollständig veröffentlichten Kreiscodes für Zylinder 6, schaltet beide Ventile des Zylinders über ein Magnetventil und meldet einen Masseschluss als P3443 auf der Einlassseite: unter 0,5 Ohm gegen Masse bei ausgeschalteter Endstufe, 20 von 25 Proben, Type B. Eine vergleichbare Prüfung käme hier zum Einsatz, denn CARB verlangt eine Kreisüberwachung für jeden abgasrelevanten Ausgang. Laut NHTSA sperrt GM die Abschaltung, sobald ein Kreisfehler an einer Ventil-Endstufe vorliegt; praktisch läuft der Motor also auf allen Zylindern. P3445 (Unterbrechung) und P3448 (Plusschluss) sind die benachbarten Auslasscodes."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_short_to_ground
      likelihood: medium
      label:
        en: Exhaust actuator wire of cylinder 6 chafed against the engine
        de: Leitung des Auslass-Stellglieds von Zylinder 6 am Motor durchgescheuert
    - id: actuator_internal_short
      likelihood: medium
      label:
        en: Internal short to ground in the exhaust actuator
        de: Innerer Masseschluss im Auslass-Stellglied
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Damaged driver in the engine control module
        de: Beschädigte Endstufe im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Engine stays in full-cylinder mode
      de: Motor bleibt im Vollzylinderbetrieb
  repair:
    difficulty: medium
    diy_possible: true
    estimated_cost_eur: [60, 900]
    estimated_hours: [0.5, 4]
  flags:
    mil: true
    emissions_relevant: true
