      de: Motorkontrollleuchte an
    - en: CAMTRONIC limp-home, exhaust valve lift on bank 1 no longer switched
      de: CAMTRONIC-Notlauf, Auslass-Ventilhub auf Bank 1 wird nicht mehr umgeschaltet
