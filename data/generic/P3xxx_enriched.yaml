- code: P3413
  category: powertrain
  title:
    en: Cylinder 2 Exhaust Valve Control Circuit/Open
    de: Zylinder 2 Auslassventil Steuerkreis/Unterbrechung
  description:
    en: P3413 belongs to the exhaust half of the cylinder 2 block and reports an open control circuit for a separately driven exhaust valve actuator. No manufacturer documents this code publicly. The engines known to deactivate cylinder 2, GM's L84 V8 and the 3.6 L V6, switch intake and exhaust valves through one control valve per cylinder and therefore report circuit faults as P3409. The code would only apply to designs with their own control valve for the exhaust side; a GM patent application instead switches both sides with one shared valve and merely staggers them, exhaust first. CARB requires a continuity check for such output components. P3414 to P3416 complete the exhaust group. The driver would see a lamp and lose deactivation.
    de: "P3413 gehört zur Auslass-Hälfte des Blocks für Zylinder 2 und meldet einen unterbrochenen Steuerkreis eines gesondert angesteuerten Auslassventil-Stellglieds. Kein Hersteller dokumentiert diesen Code öffentlich. Die Motoren, die Zylinder 2 nachweislich abschalten – GMs V8 L84 und der 3,6-l-V6 –, schalten Ein- und Auslassventile über ein gemeinsames Steuerventil je Zylinder und melden Kreisfehler deshalb als P3409. Gelten würde der Code nur für Bauarten mit eigenem Steuerventil für die Auslassseite; eine GM-Patentanmeldung schaltet dagegen beide Seiten über ein gemeinsames Ventil und staffelt sie nur, die Auslassseite zuerst. CARB verlangt für solche Ausgangskomponenten eine Durchgangsprüfung. P3414 bis P3416 vervollständigen die Auslassgruppe. Für den Fahrer: Warnleuchte, keine Abschaltung."
  affected_components:
    - cylinder_deactivation_solenoid
    - wiring_harness
    - ecm
  common_causes:
    - id: wiring_open
      likelihood: medium
      label:
        en: Open wire or connector to the cylinder 2 exhaust actuator
        de: Unterbrochene Leitung oder Stecker zum Auslass-Stellglied von Zylinder 2
    - id: actuator_coil_open
      likelihood: medium
      label:
        en: Actuator coil open
        de: Spule des Stellglieds unterbrochen
    - id: ecm_driver_fault
      likelihood: low
      label:
        en: Engine control module driver fault
        de: Endstufenfehler im Motorsteuergerät
  symptoms:
    - en: Check engine lamp on
      de: Motorkontrollleuchte an
    - en: Cylinder deactivation unavailable
      de: Zylinderabschaltung nicht verfügbar
  repair:
