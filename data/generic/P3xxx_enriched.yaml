- code: P34A8
  category: powertrain
  title:
    en: A Camshaft Position Actuator Temperature Sensor Circuit Bank 2
    de: Nockenwellenversteller A Temperaturfühler Stromkreis Bank 2
  description:
    en: "P34A8 mirrors P34A4 on bank 2: the module detects an open or otherwise faulty circuit at the temperature sensor of intake cam actuator A on the side without cylinder 1. Only V and boxer engines have this bank. The one documented user of the family, Nissan's electric intake valve timing on the 2018 Pathfinder and QX60, monitors both banks separately (range codes P34A5 and P34A9), yet P34A8 itself turns up in no manufacturer document we could find. NTN-SNR describes it as an electrical fault of the inlet-side temperature sensor on the second bank. Typical findings are a corroded plug, a chafed harness near the cylinder head or a failed sensor. Range, low and high are P34A9, P34AA and P34AB."
    de: "P34A8 ist das Gegenstück zu P34A4 auf Bank 2: Das Steuergerät erkennt am Temperaturfühler des Einlassverstellers A auf der Seite ohne Zylinder 1 eine Unterbrechung oder einen anderen Kreisfehler. Diese Bank gibt es nur bei V- und Boxermotoren. Der einzige belegte Nutzer der Familie, Nissans elektrische Einlass-Ventilsteuerung in Pathfinder und QX60 (2018), überwacht beide Bänke getrennt (Plausibilitätscodes P34A5 und P34A9); P34A8 selbst steht in keiner öffentlichen Herstellerunterlage. Bei NTN-SNR steht er als elektrischer Fehler des einlassseitigen Temperaturfühlers der zweiten Bank. Häufig sind ein korrodierter Stecker, ein am Zylinderkopf aufgescheuerter Kabelbaum oder ein defekter Fühler. Bereich, zu niedrig und zu hoch melden P34A9, P34AA und P34AB."
  affected_components:
    - cam_actuator_a_temp_sensor_b2
    - sensor_wiring
  common_causes:
